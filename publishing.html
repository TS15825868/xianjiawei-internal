<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1f3b"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="xianjiawei-publishing-runtime" content="20260809-standalone-v14-safe-first-load"><title>仙加味｜貼文審核發佈系統</title><link rel="stylesheet" href="/assets/css/internal-app.css?v=20260809-publishing-v14"><link rel="stylesheet" href="/assets/css/publishing-app.css?v=20260809-publishing-v14"><link rel="stylesheet" href="/assets/css/publishing-performance.css?v=20260809-publishing-v14"><link rel="stylesheet" href="/assets/css/publishing-readiness.css?v=20260809-readiness-v6"></head><body><div class="publish-shell"><header class="publish-header"><div class="publish-header-inner"><a class="publish-brand" href="/publishing.html" aria-label="仙加味貼文審核發佈系統"><span class="publish-brand-mark">仙</span><span><strong>仙加味・貼文審核發佈</strong><small>獨立內容系統</small></span></a><div class="publish-header-actions"><span id="userState" class="publish-user">確認登入中…</span><button class="btn" type="button" data-diagnose>系統診斷</button><button class="btn" type="button" data-refresh>重新整理</button><button class="btn primary" type="button" data-add-post>新增貼文</button><a class="btn erp-link" href="/">營運 ERP</a></div></div></header><main class="publish-main"><section class="publish-hero"><div><p class="eyebrow">Content Review & Publishing</p><h1>貼文審核、排程與正式發布</h1><p>此系統只處理社群貼文。介面、資料庫與平台發布彼此隔離；外部平台短暫異常時，草稿與審核仍可維持穩定。</p></div><div><strong id="connectionState" class="connection">安全檢查中…</strong></div></section><p class="publish-separation-note"><strong>開啟頁面先進安全模式。</strong> Worker、D1、Cloudflare Access 與目前登入通過後才開始讀正式資料並開放寫入；正式發布則等已設定的平台 API 背景檢查通過後自動解鎖。正式發布仍須完成16項圖文硬審核，文案或圖片一改就重新審核；所有對外圖片必須是完整成圖，不接受拼湊式素材。</p><section id="readinessSummary" class="readiness-summary" aria-label="系統與平台健康狀態"><span class="readiness-chip checking"><strong>系統診斷</strong><small>檢查中…</small></span></section><section id="metrics" class="publish-metrics" aria-label="貼文狀態統計"></section><section id="platformSummary" class="publish-platforms" aria-label="平台授權狀態"></section><section class="publish-toolbar" aria-label="貼文篩選"><input id="searchInput" type="search" placeholder="搜尋標題、文案、產品或平台"><select id="statusFilter"><option value="all">全部狀態</option><option value="draft">草稿</option><option value="pending_review">待審核</option><option value="approved">已核准</option><option value="scheduled">已排程</option><option value="published">已發布</option><option value="manual_required">需人工發布</option><option value="failed">失敗</option></select><button id="clearFilters" class="btn" type="button">清除篩選</button></section><div id="app"><div id="listRoot"><section class="loading-card">系統安全檢查中…</section></div></div></main></div><div id="modalRoot"></div><div id="toastRoot" class="toast-root" aria-live="polite"></div><noscript><p class="noscript">此系統需要啟用 JavaScript 才能操作。</p></noscript><script src="/assets/js/publishing-resilience.js?v=20260809-publishing-v14"></script><script src="/assets/js/publishing-readiness-ui.js?v=20260809-readiness-v6"></script><script type="module" src="/assets/js/publishing-app-v2.js?v=20260809-publishing-v14"></script><script src="/assets/js/device-image-upload.js?v=20260809-publishing-v14"></script><script src="/assets/js/svg-candidate-rasterizer.js?v=20260809-publishing-v14"></script><script src="/assets/js/publishing-review-gate.js?v=20260809-publishing-v14"></script><script src="/assets/js/public-post-import.js?v=20260809-publishing-v14"></script><script src="/assets/js/product-authority-guard.js?v=20260809-publishing-v14"></script><script src="/assets/js/post-regenerate-v6.js?v=20260809-publishing-v14"></script><script src="/assets/js/manual-publish-tools.js?v=20260809-publishing-v14"></script><script>window.addEventListener('xjw-post-imported',function(){document.querySelector('[data-refresh]')?.click()});</script></body></html>
