<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0b1f3b">
<title>仙加味｜客服免費備援</title>
<style>
:root{color-scheme:light;--navy:#0b1f3b;--cream:#f7f4ed;--red:#8f2f2f;--gold:#a88645;--line:#ddd5c7;--muted:#5c6777}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.7}
main{max-width:780px;margin:auto;padding:24px 16px 55px}
nav{display:flex;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:18px}nav a{color:var(--navy);font-weight:700;text-underline-offset:4px}
.mark{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:var(--navy);color:#fff;font-size:25px;font-weight:800}
h1{font-size:clamp(28px,6vw,39px);line-height:1.25;margin:6px 0 10px}h2{font-size:20px;margin:0 0 14px}
.muted{color:var(--muted)}p{margin:0 0 12px}
.panel{border:1px solid var(--line);border-radius:20px;background:#fff;padding:clamp(16px,4vw,28px);margin-top:18px;box-shadow:0 7px 24px #0b1f3b08}
.info{padding:12px 15px;border-left:4px solid var(--gold);background:#fff8ec;border-radius:9px;color:#61421a}
.field{margin:0 0 18px}label{display:block;font-weight:800;margin-bottom:6px}select{display:block;width:100%;font-size:17px;padding:13px;border-radius:12px;background:#fff;color:var(--navy);border:1px solid #b2bbca}
.actions{display:flex;flex-wrap:wrap;gap:10px}
button{border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:800;cursor:pointer;min-height:48px}
button.primary{background:var(--navy);color:#fff}button.secondary{background:#f0ebdf;color:var(--navy)}button:disabled{opacity:.5;cursor:not-allowed}
.result{white-space:pre-wrap;min-height:96px;border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--cream);font-size:17px}
#status{font-weight:700;min-height:28px;margin:12px 0}#status.error{color:#9e2828}
.caption{font-size:13px;color:var(--muted)}
@media(max-width:430px){main{padding-left:12px;padding-right:12px}button{flex:1}nav{gap:10px}}
</style>
</head>
<body>
<main>
<nav aria-label="內部導航"><span class="mark" aria-hidden="true">仙</span><a href="/">內部首頁</a><a href="/erp.html">ERP</a><a href="/publishing.html">貼文中心</a></nav>
<header><p class="muted">仙加味 · 免費客服備援</p><h1>正式產品資料回覆草稿</h1><p>當 n8n 或 AI 無法使用時，直接從正式產品母資料取得成分、規格草稿。不用 AI 額度、不需外部客服平台。</p></header>
<div class="info" role="note"><strong>內部人工確認專用：</strong>不會讀取顧客私訊、不會接收電話或訂單資料、不會傳送留言。請人工確認問題和產品正確後，再自行回覆。</div>
<section class="panel" aria-label="產生客服草稿">
<h2>選擇正式產品與問題</h2>
<div class="field"><label for="product">正式產品</label><select id="product">
<option value="guilu-gao">龜鹿膏｜100g／罐</option>
<option value="guilu-drink-30">龜鹿飲30cc玻璃罐｜30cc／罐</option>
<option value="guilu-drink-180">龜鹿飲180cc鋁袋｜180cc／包</option>
<option value="luerong-fen">鹿茸粉｜75g／罐</option>
</select></div>
<div class="field"><label for="topic">問題類型</label><select id="topic"><option value="ingredients">產品成分</option><option value="specification">包裝規格</option></select></div>
<div class="actions"><button id="generate" type="button" class="primary">取得正式資料草稿</button><button id="copy" type="button" class="secondary" disabled>複製草稿</button></div>
<p id="status" role="status" aria-live="polite"></p>
<div id="result" class="result" aria-live="polite">請選擇產品及問題類型，再按「取得正式資料草稿」。</div>
<p class="caption">不儲存顧客個資、不執行自動發送。資訊來源為仙加味官網最新公開產品母資料，錯誤或未確認問題請轉官方 LINE 人工處理。</p>
</section>
</main>
<script>
'use strict';
const names={ 'guilu-gao':'龜鹿膏','guilu-drink-30':'龜鹿飲30cc玻璃罐','guilu-drink-180':'龜鹿飲180cc鋁袋','luerong-fen':'鹿茸粉'};
const product=document.getElementById('product'),topic=document.getElementById('topic'),result=document.getElementById('result'),status=document.getElementById('status'),generate=document.getElementById('generate'),copy=document.getElementById('copy');
let safeReply='';
for(const item of [product,topic])item.addEventListener('change',()=>{safeReply='';copy.disabled=true;result.textContent='選項已更新，請重新取得草稿。';status.textContent='';});
generate.addEventListener('click',async()=>{
 if(generate.disabled)return;
 safeReply='';generate.disabled=true;copy.disabled=true;status.className='';status.textContent='正在讀取正式資料…';
 const id=product.value,name=names[id],t=topic.value;
 try{
  if(!name||!['ingredients','specification'].includes(t))throw Error('無效選項');
  const request={productId:id,topic:t,question:'請問'+name+'的'+(t==='ingredients'?'成分':'規格')+'是什麼？'};
  const response=await fetch('/api/social-facts/suggest',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'content-type':'application/json'},body:JSON.stringify(request)});
  const data=await response.json().catch(()=>null);
  if(!response.ok||data?.ok!==true||data?.sent!==false||data?.humanReviewRequired!==true||typeof data.reply!=='string')
   throw Error(response.status===401||response.status===403?'需要有效的內部登入權限':'正式產品資料暫不可用，請轉人工處理');
  safeReply=data.reply;result.textContent=safeReply;copy.disabled=false;
  status.textContent='已取得正式資料草稿，請人工核對後再使用。';
 }catch(error){result.textContent='未取得合格草稿。';status.className='error';status.textContent=error.message||'查詢失敗';}
 finally{generate.disabled=false;}
});
copy.addEventListener('click',async()=>{
 if(!safeReply)return;
 try{await navigator.clipboard.writeText(safeReply);status.className='';status.textContent='已複製草稿，請人工確認後使用。'}
 catch{status.className='error';status.textContent='無法直接複製，請手動選取文字。'}
});
</script>
</body>
</html>
