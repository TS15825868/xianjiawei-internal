name: XJW one-time archive verified published duplicate drafts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-verified-published-duplicates-20261031.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xjw-d1-duplicate-maintenance
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read D1 exact duplicate drafts and active delivery/link locks
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,title,copy,updated_at,published_at,scheduled_at,approved_by,image_approved,image_url,image_quality_status FROM social_posts WHERE id IN ('XJW-CONV-live-hongludi-outing-20260929','XJW-CONV-brand-third-generation-note') ORDER BY id" > /tmp/dup-before.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT post_id,state,metricool_id,uuid FROM social_metricool_sync WHERE post_id IN ('XJW-CONV-live-hongludi-outing-20260929','XJW-CONV-brand-third-generation-note')" > /tmp/dup-links.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT post_id,status,remote_id FROM social_publish_deliveries WHERE post_id IN ('XJW-CONV-live-hongludi-outing-20260929','XJW-CONV-brand-third-generation-note')" > /tmp/dup-deliveries.json
      - name: Generate only two compare-and-swap archival changes with true service audit identity
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const rows=p=>JSON.parse(fs.readFileSync(p,'utf8'))[0].results;
          const before=rows('/tmp/dup-before.json'),links=rows('/tmp/dup-links.json'),deliveries=rows('/tmp/dup-deliveries.json');
          const targets=[
           {id:'XJW-CONV-live-hongludi-outing-20260929',sha:'2d89d993cab671cb412fb5c81d4fcec1aea44dcfd18145a52202988a54b3bb3b',receipt:'Metricool published id 384813552, FB/IG/Threads receipts, exact complete copy match',audit:'AUD-XJW-DUP-20261031-HONGLUDI'},
           {id:'XJW-CONV-brand-third-generation-note',sha:'2582b5d1f32ed964c0d128a3cfe0caa8777c54be9e8116978282c55afd8b6d14',receipt:'Metricool published id 386519368, FB/IG/Threads receipts, same brand-quality-vs-price story; older public product naming',audit:'AUD-XJW-DUP-20261031-CRAFT'}
          ];
          if(before.length!==targets.length||links.length||deliveries.length)throw Error('D1 row or existing remote publication lock changed; abort all');
          const q=s=>"'"+String(s??'').replaceAll("'","''")+"'";
          const sql=[],receiptEvidence=[];
          for(const t of targets){
            const p=before.find(x=>x.id===t.id);
            const actual=crypto.createHash('sha256').update(p?.copy||'').digest('hex');
            if(!p||p.status!=='draft'||p.approved_by!==null||p.scheduled_at!==null||p.published_at!==null||Number(p.image_approved)!==0||actual!==t.sha)
              throw Error('Not a safe unchanged draft: '+t.id);
            const beforeJson=JSON.stringify({status:p.status,updated_at:p.updated_at,copy_sha256:actual});
            const afterJson=JSON.stringify({status:'archived',reason:'Published external duplicate, no republication',metricoolReceipt:t.receipt,copy_sha256:actual,actorType:'GITHUB_ACTIONS_MAINTENANCE_NOT_HUMAN'});
            sql.push("UPDATE social_posts SET status='archived',updated_at=datetime('now') WHERE id="+q(t.id)+" AND status='draft' AND copy="+q(p.copy)+" AND updated_at="+q(p.updated_at)+" AND approved_by IS NULL AND published_at IS NULL AND scheduled_at IS NULL AND COALESCE(image_approved,0)=0 AND NOT EXISTS(SELECT 1 FROM social_metricool_sync WHERE post_id=social_posts.id) AND NOT EXISTS(SELECT 1 FROM social_publish_deliveries WHERE post_id=social_posts.id);");
            sql.push("INSERT INTO audit_logs(id,actor_email,action,entity_type,entity_id,before_json,after_json,ip) SELECT "+[t.audit,'system:github-actions-dedupe','外部已發布重複草稿安全封存','貼文',t.id,beforeJson,afterJson,''].map(q).join(',')+" WHERE changes()=1;");
            receiptEvidence.push({post_id:t.id,expected_copy_sha256:t.sha,external_published_receipt:t.receipt,original_status:'draft',expected_after:'archived',audit_id:t.audit});
          }
          fs.writeFileSync('/tmp/dup-apply.sql',sql.join('\n')+'\n');
          fs.writeFileSync('/tmp/dup-evidence.json',JSON.stringify({scope:'two_old_unpublished_drafts_only',before:receiptEvidence,run:process.env.GITHUB_RUN_ID},null,2));
          console.log('PASS prewrite guard for 2 unchanged duplicated draft posts; no approvals or publishing');
          NODE
      - name: Archive only the two verified duplicates; no public actions
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/dup-apply.sql
      - name: Independently read back both posts and their audit logs
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,copy,updated_at,approved_by,scheduled_at,published_at,image_approved,image_url,image_quality_status FROM social_posts WHERE id IN ('XJW-CONV-live-hongludi-outing-20260929','XJW-CONV-brand-third-generation-note') ORDER BY id" > /tmp/dup-after.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,entity_id,actor_email,action,after_json FROM audit_logs WHERE id IN ('AUD-XJW-DUP-20261031-HONGLUDI','AUD-XJW-DUP-20261031-CRAFT')" > /tmp/dup-audit.json
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'))[0].results;
          const before=read('/tmp/dup-before.json'),after=read('/tmp/dup-after.json'),audit=read('/tmp/dup-audit.json');
          if(before.length!==2||after.length!==2||audit.length!==2)throw Error('Missing exact D1 after rows or mandatory audit');
          for(const old of before){
           const next=after.find(p=>p.id===old.id);
           if(!next||next.status!=='archived'||next.copy!==old.copy||next.image_url!==old.image_url||next.image_quality_status!==old.image_quality_status||next.approved_by||next.scheduled_at||next.published_at||Number(next.image_approved)!==0)throw Error('Unsafe or unverified archive: '+old.id);
           const log=audit.find(x=>x.entity_id===old.id);
           if(!log||log.actor_email!=='system:github-actions-dedupe'||JSON.parse(log.after_json).status!=='archived')throw Error('Missing truthful service audit: '+old.id);
          }
          console.log('PASS remote D1: 2 published-duplicate drafts archived, original media/copy and audit preserved; 0 approvals, 0 sends');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xjw-published-duplicate-archive-proof-${{ github.run_id }}
          path: |
            /tmp/dup-before.json
            /tmp/dup-links.json
            /tmp/dup-deliveries.json
            /tmp/dup-after.json
            /tmp/dup-audit.json
            /tmp/dup-evidence.json
          retention-days: 3
