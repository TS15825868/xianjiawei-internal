name: 仙加味10組待審歷史圖片近似比對視覺覆核
on:
  push:
    branches: [main]
    paths: ['ops/request-20261112-near-pairs-visual-review.json']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -q Pillow==11.3.0
      - run: python ops/render-20261112-near-pairs-sheet.py
      - name: Commit visually inspectable comparison of 10 original-image pairs
        run: |
          set -euo pipefail
          git config user.name 'xianjiawei-safe-audit-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/visual-review/20261112-10-near-pairs-sheet.jpg
          git commit -m 'review: show 10 original source image pairs without AI alterations'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
