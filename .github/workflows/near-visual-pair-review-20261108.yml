name: 仙加味12組近似圖片逐組實體並排查證（唯讀）
on:
  push:
    branches: [main]
    paths: ['ops/request-near-visual-pairs-review-20261108.json']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reuse previous successful report without recalculating 68 images
        run: gh run download 42479318932 -n xjw-pending-vs-archive-visual-42479318932 -D near-source
      - run: python -m pip install --quiet --disable-pip-version-check Pillow==11.3.0
      - name: Inspect 12 closest original image pairs with present D1 captions
        run: python ops/render-near-visual-pair-contact-20261108.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xjw-12-visual-pairs-${{ github.run_id }}
          path: near-pair-review/
          retention-days: 7
          if-no-files-found: warn
