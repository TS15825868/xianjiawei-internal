name: 仙加味 ERP Cloudflare 部署後正式驗證
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-deploy-cloudflare-after-secrets-v20260815.yml'
permissions:
  contents: write
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Confirm Cloudflare credentials stay configured
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }
          echo 'PASS: Cloudflare credentials present.'
      - name: Verify remote D1 after deployment
        run: npx --yes wrangler@4.0.0 d1 execute xianjiawei-internal-db --remote --command "SELECT 1 AS ok"
      - name: Verify deployed Worker, full ERP and publishing center
        shell: bash
        run: |
          set -euo pipefail
          base='https://xianjiawei-internal.tung314069.workers.dev'
          for attempt in 1 2 3 4 5 6 7 8; do
            core="$(curl -fsS --max-time 15 "$base/healthz/core" || true)"
            readiness="$(curl -fsS --max-time 15 "$base/healthz/readiness" || true)"
            root="$(curl -fsS --max-time 15 "$base/" || true)"
            page="$(curl -fsS --max-time 15 "$base/publishing.html" || true)"
            topic="$(curl -fsS --max-time 15 "$base/assets/data/guilu-content-topic-bank-v20260814.json" || true)"
            if [ -n "$core" ] && [ -n "$readiness" ] && [ -n "$root" ] && [ -n "$page" ] && [ -n "$topic" ]; then
              CORE="$core" READINESS="$readiness" ROOT="$root" PAGE="$page" TOPIC="$topic" node -e "const core=JSON.parse(process.env.CORE||'{}'); const readiness=JSON.parse(process.env.READINESS||'{}'); const topic=JSON.parse(process.env.TOPIC||'{}'); const root=String(process.env.ROOT||''); const page=String(process.env.PAGE||''); const okCore=Object.keys(core).length>0; const okReadiness=Object.keys(readiness).length>0; const okRoot=root.includes('營運中控')&&root.includes('internal-app.js')&&root.includes('/publishing.html'); const okPage=page.includes('貼文審核發佈系統')&&page.includes('唯一正式內容系統')&&page.includes('publishing-content-guidance-v20260814.js'); const okTopic=Array.isArray(topic.topics)&&topic.topics.length>=40; if(!okCore||!okReadiness||!okRoot||!okPage||!okTopic) process.exit(1); console.log('PASS: ERP root, health, publishing UI and topic bank are live.');" && exit 0 || true
            fi
            sleep 5
          done
          echo 'Full ERP Worker deployment verification failed.' >&2
          exit 1
      - name: Record verified production deployment
        shell: bash
        run: |
          cat > deployment-status.json <<EOF
          {
            "status": "verified_live",
            "source_commit": "e3e33de35f4e0631e93a8db3a0cd27c50facbe2d",
            "cloudflare_version_id": "4d7fb6f7-e589-4c4f-bb39-cf0f9661be99",
            "runtime": "cloudflare-worker-full-erp",
            "entry": "src/production-entry.js",
            "health": "healthz/core + healthz/readiness + / + publishing.html + guilu topic bank",
            "remote_d1": "verified",
            "guard_mode": "paused_for_full_system_update",
            "blocking_content_media_guards": false,
            "verified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment-status.json
          if git diff --cached --quiet; then
            echo 'Deployment status already current.'
            exit 0
          fi
          git commit -m 'deploy: record verified full ERP Worker release'
          git pull --rebase origin main
          git push origin HEAD:main
