name: 仙加味內部系統與貼文中心完整驗收（現行版）

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-internal-verification-current.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 19 * * 0'

permissions:
  contents: read

concurrency:
  group: xianjiawei-full-internal-verification-current
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE_URL: https://xianjiawei-internal.tung314069.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Static syntax and current-authority guards
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run guard:full
          npm run build:static
          grep -Eq 'xianjiawei-publishing-runtime" content="publishing-center-app-[^"]+' dist/publishing.html
          grep -Eq "window\.__XJW_BOOT_VERSION__='[^']+'" dist/publishing.html
          grep -q 'publishing-app.css?v=20260914-no-containment-v4' dist/publishing.html
          grep -Eq 'publishing-app-v2\.js\?v=[^"[:space:]]+' dist/publishing.html
          grep -Eq 'publishing-review-gate\.js\?v=[^"[:space:]]+' dist/publishing.html
          grep -q "'/assets/js/publishing-readiness-ui.js?v=" dist/publishing.html
          grep -q 'scheduleOptionalTools' dist/publishing.html
          ! grep -q '<script src="/assets/js/publishing-readiness-ui.js' dist/publishing.html
          test -s dist/assets/js/publishing-readiness-ui.js
          grep -q 'livePlatformSummary' dist/assets/js/publishing-readiness-ui.js
          grep -q 'platformSummaryObserver' dist/assets/js/publishing-readiness-ui.js
          grep -q 'platformProbeError' dist/assets/js/publishing-readiness-ui.js
          grep -q '週一／週三／週五 09:00' dist/assets/js/publishing-app-v2.js
          grep -q '\[1,3,5\]' dist/assets/js/publishing-app-v2.js
          if grep -R -n -E '週二19:30|週六09:30|\[2,6\]' assets/js src publishing.html; then
            echo '發現舊排程規則' >&2
            exit 1
          fi
          if grep -q 'content-visibility:auto\|contain:layout paint style\|contain-intrinsic-size:620px\|contain-intrinsic-size:560px' dist/assets/css/publishing-app.css; then
            echo '發現已退役 Safari 卡片虛擬化規則' >&2
            exit 1
          fi
          grep -q 'content-visibility:visible!important' dist/assets/css/publishing-performance.css
          grep -q 'XJW_MAINTENANCE_READ_ONLY' src/full-system-entry.js
          grep -q 'XJW_MAINTENANCE_PRIVATE_READ_LOCKED' src/full-system-entry.js
          echo 'PASS static current-authority verification without stale version locks.'

      - name: Verify remote D1 integrity without fixed record counts
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT status,COUNT(*) AS count FROM social_posts GROUP BY status ORDER BY status" > d1-status.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS total FROM social_posts" > d1-total.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS bad FROM social_posts WHERE status NOT IN ('draft','pending_review','approved','scheduled','published','manual_required','failed','archived')" > d1-invalid-status.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS bad FROM social_posts WHERE status IN ('pending_review','approved','scheduled','published') AND TRIM(COALESCE(image_url,''))=''" > d1-ready-missing-image.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS bad FROM social_posts WHERE status='scheduled' AND (scheduled_at IS NULL OR TRIM(scheduled_at)='')" > d1-scheduled-missing-time.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "PRAGMA foreign_key_check" > d1-fk.json
          node - <<'NODE'
          const fs=require('fs');
          const rows=f=>{const d=JSON.parse(fs.readFileSync(f,'utf8'));return (Array.isArray(d)?d[0]?.results:d?.results)||[]};
          const total=Number(rows('d1-total.json')[0]?.total||0);
          const st=Object.fromEntries(rows('d1-status.json').map(r=>[r.status,Number(r.count||0)]));
          if(total<1)throw new Error('D1沒有貼文資料');
          const sum=Object.values(st).reduce((a,b)=>a+b,0);
          if(sum!==total)throw new Error(`狀態加總 ${sum} 與總數 ${total} 不一致`);
          for(const file of ['d1-invalid-status.json','d1-ready-missing-image.json','d1-scheduled-missing-time.json']){
            const bad=Number(rows(file)[0]?.bad||0);if(bad!==0)throw new Error(`${file} bad=${bad}`);
          }
          if(rows('d1-fk.json').length!==0)throw new Error('D1 foreign_key_check 失敗');
          console.log('PASS D1 dynamic integrity',total,st);
          NODE

      - name: Verify live boundary for current maintenance mode
        shell: bash
        run: |
          set -euo pipefail
          maintenance="$(node -e "const fs=require('fs');const s=fs.readFileSync('wrangler.jsonc','utf8');console.log(/\"TEMP_DISABLE_ACCESS\"\s*:\s*\"true\"/.test(s)?'true':'false')")"
          echo "maintenance=$maintenance"
          html="$(curl -fsS --max-time 25 "$BASE_URL/publishing.html")"
          grep -Eq 'xianjiawei-publishing-runtime" content="publishing-center-app-[^"]+' <<<"$html"
          grep -q "'/assets/js/publishing-readiness-ui.js?v=" <<<"$html"
          if [ "$maintenance" = 'true' ]; then
            curl -fsS --max-time 25 "$BASE_URL/api/me" > live-me.json
            curl -fsS --max-time 25 "$BASE_URL/api/posts?limit=18&offset=0" > live-posts.json
            curl -fsS --max-time 25 "$BASE_URL/healthz/platform-connections" > live-platform-connections.json
            node -e "const me=require('./live-me.json'),posts=require('./live-posts.json'),platform=require('./live-platform-connections.json');if(!me.maintenance_readonly||me.role!=='viewer')throw new Error('維護模式 /api/me 不是唯讀viewer');if(!posts.maintenance_readonly||!Array.isArray(posts.items))throw new Error('維護模式 /api/posts 未提供安全唯讀清單');if(platform.safe_read_only!==true||platform.publishes_content!==false)throw new Error('平台連線健康端點不是安全唯讀');if((platform.blocking_platforms||[]).length)throw new Error('平台存在阻斷性故障：'+platform.blocking_platforms.join(','));console.log('PASS maintenance public read surface',posts.items.length,posts.total,platform.degraded_platforms||[],platform.unconfigured_platforms||[])"
            private_code="$(curl -sS --max-time 25 -o live-private.json -w '%{http_code}' "$BASE_URL/api/modules/customers")"
            test "$private_code" = '423'
            node -e "const x=require('./live-private.json');if(x.code!=='XJW_MAINTENANCE_PRIVATE_READ_LOCKED')process.exit(1)"
            write_code="$(curl -sS --max-time 25 -o live-write.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$BASE_URL/api/posts")"
            test "$write_code" = '423'
            node -e "const x=require('./live-write.json');if(x.code!=='XJW_MAINTENANCE_READ_ONLY')process.exit(1)"
            echo 'PASS maintenance sensitive reads and writes are locked.'
          else
            for path in '/' '/erp.html' '/publishing.html' '/healthz/core'; do
              code="$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 25 "$BASE_URL$path" || true)"
              test "$code" -ge 200
              test "$code" -lt 500
            done
            echo 'PASS protected live boundary responds without server errors.'
          fi

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: xianjiawei-full-internal-current-${{ github.run_id }}
          path: |
            d1-status.json
            d1-total.json
            d1-invalid-status.json
            d1-ready-missing-image.json
            d1-scheduled-missing-time.json
            d1-fk.json
            live-*.json
          if-no-files-found: warn
          retention-days: 7
