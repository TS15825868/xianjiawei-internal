name: 仙加味內部系統與貼文中心完整驗收（現行版）
# post-image-repair-final-verification-20261007

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'src/**'
      # Independent fallback safety checks run in verify-cloudflare-receipt-fallback.yml.
      - '!src/social-webhook-cloudflare-fallback.mjs'
      - '!src/social-webhook-cloudflare-fallback.test.mjs'
      # n8n-only changes run the dependency-free safety suite instead.
      # This full check remains for ERP/site changes and its weekly schedule.
      - 'tools/**'
      # Offline evidence-only code has its own zero-D1 CI workflow.
      - '!tools/audit-social-media-offline.mjs'
      - '!tools/test-audit-social-media-offline.mjs'
      # Pure approval rollback tooling runs the dedicated zero-network gate.
      - '!tools/apply-post-copy-correction.cjs'
      - '!tools/test-post-copy-review-rollback.cjs'
      # Metricool image archive format checks run in their isolated no-install suite.
      - '!tools/metricool-image-format.cjs'
      - '!tools/metricool-image-format.test.cjs'
      - 'config/**'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'index.html'
      - 'erp.html'
      - 'publishing.html'
      - 'social-support.html'
      - 'wrangler.jsonc'
      - '.github/workflows/full-internal-verification-current.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 19 * * 0'

permissions:
  contents: read

concurrency:
  group: xianjiawei-full-internal-verification-current
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE_URL: https://xianjiawei-internal.tung314069.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Verify Cloudflare receipt-only fallback safety
        run: node --test src/social-webhook-cloudflare-fallback.test.mjs

      - name: Verify private social receiver, history, authorization and crash-recovery safety
        run: |
          node --test n8n-runtime/social-receipt-handler.test.mjs
          node --test n8n-runtime/social-webhook.test.mjs
          node --test n8n-runtime/social-tls-preflight.test.mjs
          node --test n8n-runtime/comment-pg-store.test.cjs
          node --test n8n-runtime/account-allowlist.test.cjs
          node --test n8n-runtime/comment-policy.test.cjs
          node --test n8n-runtime/comment-sender.test.cjs
          node --test n8n-runtime/comment-automation.test.cjs
          node --test n8n-runtime/comment-inbox-processor.test.cjs
          node --test n8n-runtime/comment-send-store.test.cjs
          node --test n8n-runtime/comment-erp-view.test.cjs
          node --test n8n-runtime/instagram-readonly-workflow.test.cjs
          node --test n8n-runtime/comment-meta-history.test.cjs
          node --test n8n-runtime/comment-meta-pages.test.cjs
          node --test n8n-runtime/comment-workflow.test.cjs
          node --test n8n-runtime/start-low-memory.test.cjs
          node --test n8n-runtime/smoke-readonly.test.cjs
          node --test n8n-runtime/monitor-parallel-fallback.test.cjs

      - name: Verify scheduled publication fails closed when review or D1 storage fails
        run: node tools/test-production-schedule-fail-closed.mjs

      - name: Verify protected and disabled-by-default Cloudflare free AI reply drafts
        run: node --test tools/test-social-ai-draft.mjs

      - name: Verify free official-fact reply fallback (zero inference)
        run: node --test tools/test-social-fact-suggestion.mjs

      - name: Verify actual free customer-support page and protected routing
        run: node --test tools/test-social-support-ui.mjs

      - name: Static syntax and current-authority guards
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run guard:full
          npm run build:static
          grep -Eq 'xianjiawei-publishing-runtime" content="publishing-center-app-[^"]+' dist/publishing.html
          grep -Eq "window\.__XJW_BOOT_VERSION__='[^']+'" dist/publishing.html
          grep -q 'publishing-app.css?v=20260914-no-containment-v4' dist/publishing.html
          grep -Eq 'publishing-app-v2\.js\?v=[^"[:space:]]+' dist/publishing.html
          grep -Eq 'publishing-review-gate\.js\?v=[^"[:space:]]+' dist/publishing.html
          grep -q "'/assets/js/publishing-readiness-ui.js?v=" dist/publishing.html
          grep -q 'scheduleOptionalTools' dist/publishing.html
          ! grep -q '<script src="/assets/js/publishing-readiness-ui.js' dist/publishing.html
          test -s dist/assets/js/publishing-readiness-ui.js
          grep -q 'livePlatformSummary' dist/assets/js/publishing-readiness-ui.js
          grep -q 'platformSummaryObserver' dist/assets/js/publishing-readiness-ui.js
          grep -q 'platformProbeError' dist/assets/js/publishing-readiness-ui.js
          grep -q '週二／週五 10:00' dist/assets/js/publishing-app-v2.js
          grep -q '\[2,5\]' dist/assets/js/publishing-app-v2.js
          if grep -R -n -E '週二19:30|週六09:30|\[2,6\]' assets/js src publishing.html; then
            echo '發現舊排程規則' >&2
            exit 1
          fi
          if grep -q 'content-visibility:auto\|contain:layout paint style\|contain-intrinsic-size:620px\|contain-intrinsic-size:560px' dist/assets/css/publishing-app.css; then
            echo '發現已退役 Safari 卡片虛擬化規則' >&2
            exit 1
          fi
          grep -q 'content-visibility:visible!important' dist/assets/css/publishing-performance.css
          grep -q 'XJW_MAINTENANCE_READ_ONLY' src/full-system-entry.js
          grep -q 'XJW_MAINTENANCE_PRIVATE_READ_LOCKED' src/full-system-entry.js
          echo 'PASS static current-authority verification without stale version locks.'

      - name: Verify live ecosystem product facts without fixed counts
        run: node n8n-runtime/smoke-readonly.js

      - name: Validate ecosystem authority explicitly
        run: node tools/validate-ecosystem-authority.mjs

      # Production D1 quota protection: no recurring SQL on push or weekly runs.
      # Previous full-table COUNT, JOIN and PRAGMA scans could exhaust the free Rows Read cap.
      # Live D1 data integrity must be verified only by a separately authorized, bounded
      # audit with known budget; this CI's success is NOT a D1 data-integrity receipt.
      - name: Record remote D1 verification as intentionally not executed
        shell: bash
        run: |
          set -euo pipefail
          echo 'Remote production D1 SQL: SKIPPED (quota safety, no full scans).'
          echo 'Production D1 data integrity: NOT VERIFIED by this workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Do not claim production D1 integrity from this CI result.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live boundary for current maintenance mode
        shell: bash
        run: |
          set -euo pipefail
          maintenance="$(node -e "const fs=require('fs');const s=fs.readFileSync('wrangler.jsonc','utf8');console.log(/\"TEMP_DISABLE_ACCESS\"\s*:\s*\"true\"/.test(s)?'true':'false')")"
          echo "maintenance=$maintenance"
          if [ "$maintenance" = 'true' ]; then
            html="$(curl -fsS --max-time 25 "$BASE_URL/publishing.html")"
            grep -Eq 'xianjiawei-publishing-runtime" content="publishing-center-app-[^"]+' <<<"$html"
            grep -q "'/assets/js/publishing-readiness-ui.js?v=" <<<"$html"
            curl -fsS --max-time 25 "$BASE_URL/api/me" > live-me.json
            curl -fsS --max-time 25 "$BASE_URL/api/posts?limit=18&offset=0" > live-posts.json
            curl -fsS --max-time 25 "$BASE_URL/healthz/platform-connections" > live-platform-connections.json
            node -e "const me=require('./live-me.json'),posts=require('./live-posts.json'),platform=require('./live-platform-connections.json');if(!me.maintenance_readonly||me.role!=='viewer')throw new Error('維護模式 /api/me 不是唯讀viewer');if(!posts.maintenance_readonly||!Array.isArray(posts.items))throw new Error('維護模式 /api/posts 未提供安全唯讀清單');if(platform.safe_read_only!==true||platform.publishes_content!==false)throw new Error('平台連線健康端點不是安全唯讀');if((platform.blocking_platforms||[]).length)throw new Error('平台存在阻斷性故障：'+platform.blocking_platforms.join(','));console.log('PASS maintenance public read surface',posts.items.length,posts.total,platform.degraded_platforms||[],platform.unconfigured_platforms||[])"
            private_code="$(curl -sS --max-time 25 -o live-private.json -w '%{http_code}' "$BASE_URL/api/modules/customers")"
            test "$private_code" = '423'
            node -e "const x=require('./live-private.json');if(x.code!=='XJW_MAINTENANCE_PRIVATE_READ_LOCKED')process.exit(1)"
            write_code="$(curl -sS --max-time 25 -o live-write.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$BASE_URL/api/posts")"
            test "$write_code" = '423'
            node -e "const x=require('./live-write.json');if(x.code!=='XJW_MAINTENANCE_READ_ONLY')process.exit(1)"
            echo 'PASS maintenance sensitive reads and writes are locked.'
          else
            for path in '/' '/erp.html' '/publishing.html' '/healthz/core'; do
              code="$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 25 "$BASE_URL$path" || true)"
              test "$code" -ge 200
              test "$code" -lt 500
            done
            echo 'PASS Cloudflare Access protected live boundary responds without server errors; login page is not misread as app HTML.'
          fi

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: xianjiawei-full-internal-current-${{ github.run_id }}
          path: |
            d1-status.json
            d1-total.json
            d1-invalid-status.json
            d1-ready-missing-image.json
            d1-scheduled-missing-time.json
            d1-broken-media-refs.json
            d1-active-image-refs.json
            d1-fk.json
            live-*.json
          if-no-files-found: warn
          retention-days: 7

