name: 仙加味目前產品 D1 正式資料唯讀驗收
on:
  push:
    branches: [main]
    paths: ['.github/workflows/current-product-d1-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Read active product facts only
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,json_extract(data_json,'$.name') AS name,json_extract(data_json,'$.specification') AS specification,json_extract(data_json,'$.usage') AS usage FROM app_records WHERE module='products' AND archived=0 ORDER BY id" > d1-product-facts.json
      - name: Compare public facts while retaining all internal products
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {PRODUCTS} from './src/product-master-snapshot.js';
          const rows=JSON.parse(fs.readFileSync('d1-product-facts.json','utf8')).flatMap(x=>x.results||[]);
          const errors=[];
          for(const row of rows){
            let name=String(row.name||'');
            if(name==='龜鹿飲'&&String(row.specification).startsWith('30cc'))name='龜鹿飲30cc玻璃罐';
            if(name==='龜鹿飲'&&String(row.specification).startsWith('180cc'))name='龜鹿飲180cc鋁袋';
            if(name==='龜鹿飲30cc玻璃瓶')name='龜鹿飲30cc玻璃罐';
            const product=PRODUCTS.find(p=>p.name===name);
            if(!product)continue;
            if(!(product.allowedSpecs||[]).includes(row.specification))errors.push({id:row.id,name,field:'specification',actual:row.specification,expected:product.allowedSpecs});
            if(product.id==='guilu-drink-30'&&(!String(row.usage).includes('每日 1–2 罐')||!String(row.usage).includes('可依個人需求調整')))errors.push({id:row.id,name,field:'usage',actual:row.usage});
          }
          console.log('D1 active product records:',rows.length,'current public authority:',PRODUCTS.length,'internal/deferred records retained');
          if(errors.length){console.error(JSON.stringify(errors));process.exit(1)}
          console.log('PASS D1 active public product facts; no records modified or deleted');
          NODE

