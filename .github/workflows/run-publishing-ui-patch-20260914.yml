name: 仙加味整理模式子層安全清理
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-publishing-ui-patch-20260914.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Remove broad child auth bypass
        shell: python
        run: |
          from pathlib import Path
          block = """  if(String(env.TEMP_DISABLE_ACCESS||'').toLowerCase()==='true'){
            if(!env?.DB)throw new Error('D1 資料庫尚未綁定');
            const profile=await env.DB.prepare(\"SELECT email,display_name,role,active FROM profiles WHERE active=1 ORDER BY CASE WHEN role='owner' THEN 0 WHEN role='admin' THEN 1 ELSE 2 END, email LIMIT 1\").first();
            if(!profile)throw new Error('維護模式找不到可用內部帳號');
            return profile;
          }
          """
          block = ''.join(line[10:] if line.startswith('          ') else line for line in block.splitlines(True))
          for filename in ('src/publishing-only-entry.js','src/production-entry.js','src/worker.js'):
              path=Path(filename)
              text=path.read_text()
              count=text.count(block)
              if count != 1:
                  raise SystemExit(f'{filename}: expected one broad maintenance bypass block, found {count}')
              path.write_text(text.replace(block,'',1))
          print('Removed broad child bypass from 3 auth layers.')
      - name: Validate source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('src/publishing-only-entry.js','src/production-entry.js','src/worker.js'):
              if '維護模式找不到可用內部帳號' in Path(name).read_text():
                  raise SystemExit(name+' still contains broad maintenance bypass')
          full=Path('src/full-system-entry.js').read_text()
          assert 'XJW_MAINTENANCE_PRIVATE_READ_LOCKED' in full
          assert 'XJW_MAINTENANCE_READ_ONLY' in full
          assert 'TEMP_DISABLE_ACCESS' in Path('wrangler.jsonc').read_text()
          PY
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run check
          npm run guard:full
      - name: Commit hardened source
        run: |
          git config user.name 'TS15825868'
          git config user.email 'tung314069@gmail.com'
          git add src/publishing-only-entry.js src/production-entry.js src/worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'security: keep maintenance bypass only at top-level whitelist'
          git push origin HEAD:main
