name: 仙加味獨立候選情境圖安全回填
on:
  push:
    branches: [main]
    paths: ['ops/scene-candidate-binding-20261106.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Apply candidate images with compare-and-swap and explicit AI deferral only
        run: node ops/bind-scene-candidates-20261106.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-candidate-results-${{ github.run_id }}
          path: scene-candidate-results.json
          retention-days: 7
