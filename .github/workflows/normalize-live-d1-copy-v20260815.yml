name: 仙加味現行貼文D1正式規格清理

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-live-d1-copy-v20260815.yml'
  workflow_dispatch:

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require credentials and install dependencies
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Normalize current public post text in D1
        shell: bash
        run: |
          cat > /tmp/normalize.sql <<'SQL'
          UPDATE social_posts SET
            title=replace(replace(title,'75g （2兩）','75g'),'75g（2兩）','75g'),
            headline=replace(replace(headline,'75g （2兩）','75g'),'75g（2兩）','75g'),
            copy=replace(replace(copy,'75g （2兩）','75g'),'75g（2兩）','75g'),
            image_alt=replace(replace(image_alt,'75g （2兩）','75g'),'75g（2兩）','75g'),
            image_source=replace(replace(image_source,'75g （2兩）','75g'),'75g（2兩）','75g'),
            image_approved=0,
            approved_by=NULL,
            approved_at=NULL,
            scheduled_at=NULL,
            proposed_scheduled_at=NULL,
            updated_at=CURRENT_TIMESTAMP,
            status=CASE WHEN status IN ('published','manual_required') THEN status ELSE 'pending_review' END
          WHERE status<>'archived' AND (
            title LIKE '%2兩%' OR headline LIKE '%2兩%' OR copy LIKE '%2兩%' OR image_alt LIKE '%2兩%' OR image_source LIKE '%2兩%'
          );
          SQL
          npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/normalize.sql
      - name: Verify current D1 customer-facing text
        shell: bash
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS value FROM social_posts WHERE status<>'archived' AND (title LIKE '%2兩%' OR headline LIKE '%2兩%' OR copy LIKE '%2兩%' OR image_alt LIKE '%2兩%');" > /tmp/old.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS value FROM social_posts WHERE status<>'archived' AND (title LIKE '%台興山產%' OR headline LIKE '%台興山產%' OR copy LIKE '%台興山產%' OR image_alt LIKE '%台興山產%');" > /tmp/name.json
          node - <<'NODE'
          const fs=require('fs');
          const value=p=>Number(JSON.parse(fs.readFileSync(p,'utf8')).flatMap(x=>x.results||[])[0]?.value||0);
          const old=value('/tmp/old.json'),name=value('/tmp/name.json');
          console.log({old_spec_2li:old,blocked_name:name});
          if(old!==0)throw new Error('D1仍有2兩舊規格');
          if(name!==0)throw new Error('D1仍有台興山產');
          NODE
