name: 仙加味剩餘兩篇歷史文案重疊角度精準修復
on:
  push:
    branches: [main]
    paths: ['ops/request-two-overlap-angles-20261108.json']
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Repair two historically overlapping editorial angles with image SHA, D1 CAS and audit readback
        run: node ops/repair-two-overlap-angles-20261108.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-overlap-angles-${{ github.run_id }}
          path: two-overlap-angle-copy-results.json
          retention-days: 7
