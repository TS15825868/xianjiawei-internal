name: 仙加味貼文狀態資料庫與龜鹿母庫正式修復
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-publishing-status-and-content-bank-v20260815.yml'
permissions:
  contents: write
concurrency:
  group: xianjiawei-publishing-status-migration
  cancel-in-progress: true
jobs:
  migrate-sync-validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      XJW_CONTENT_SEED_CREATED_BY: tung314069@gmail.com
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Patch permanent publishing authority and current content bank
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re

          # 1) 龜鹿長青貼文母庫：同步目前正式規格、用法與正式顧客產品圖。
          bank_path=Path('assets/data/guilu-content-topic-bank-v20260814.json')
          bank=json.loads(bank_path.read_text(encoding='utf-8'))
          bank['version']='2026-08-15-guilu-publishing-v3-current-product-authority'
          rules=bank.setdefault('rules',{})
          rules['imagePriority']='符合文案的目前正式素材優先；official_product 一律使用 customer-display 正式顧客產品圖，products-v3 只作實物身份與比例校正；沒有合格情境圖才重新生成。正式產品本體不得AI重畫、裁切、拉伸或改比例。'
          rules['pendingReviewRule']='只有文案與圖片都完整、且圖片來源可確認時才進待審核；既有 draft／pending_review 可同步最新正式文案與媒體，已核准、已排程或已發布內容不自動覆寫；所有貼文仍需人工16項圖文審核後才能核准。'
          media={
            'guilu-gao':'https://ts15825868.github.io/xianjiawei/images/customer-display-v20260812/guilu-gao.avif?v=20260814-product-modal-media-v3',
            'guilu-drink-30':'https://ts15825868.github.io/xianjiawei/images/customer-display-v20260812/guilu-drink-30cc.avif?v=20260814-product-modal-media-v3',
            'guilu-drink-180':'https://ts15825868.github.io/xianjiawei/images/customer-display-v20260812/guilu-drink-180cc-product.jpg?v=20260814-product-modal-media-v3',
            'guilu-tangkuai':'https://ts15825868.github.io/xianjiawei/images/customer-display-v20260812/guilu-tangkuai.avif?v=20260814-product-modal-media-v3',
            'guilu-jiao':'https://ts15825868.github.io/xianjiawei/images/customer-display-v20260812/guilu-jiao.avif?v=20260814-product-modal-media-v3',
            'luerong-fen':'https://ts15825868.github.io/xianjiawei/images/customer-display-v20260812/luerong-fen.avif?v=20260814-product-modal-media-v3',
          }
          def norm(s):
              if not isinstance(s,str): return s
              pairs=[
                ('75g／盒、8塊裝','75g （2兩）／盒｜8塊裝'),
                ('75g／盒｜8塊裝','75g （2兩）／盒｜8塊裝'),
                ('75g／盒','75g （2兩）／盒'),
                ('600g（1斤）／盒、32塊裝','600g （1斤）／盒｜32塊裝'),
                ('600g（1斤）／盒｜32塊裝','600g （1斤）／盒｜32塊裝'),
                ('600g（1斤）大盒、32塊裝','600g （1斤）／盒｜32塊裝'),
                ('600g（1斤）','600g （1斤）'),
                ('每塊約18.75g','每塊約18.75 g'),
              ]
              for a,b in pairs:s=s.replace(a,b)
              return s
          topics={t.get('id'):t for t in bank.get('topics',[]) if t.get('id')}
          for t in bank.get('topics',[]):
              for key in ('title','headline','copy','category','imageAlt','imageSource'):
                  if key in t:t[key]=norm(t[key])
              if t.get('imageMode')=='official_product':
                  ids=[x for x in (t.get('productIds') or []) if x]
                  if len(ids)==1 and ids[0] in media:
                      t['imageUrl']=media[ids[0]]
                      t['imageSource']=f'仙加味目前正式顧客產品圖:{ids[0]}'
          slogan='\n\n仙加味｜補養，是一種節奏。'
          copy_updates={
            'guilu-forms':'想方便即飲，可以比較龜鹿飲；喜歡小匙取用或用溫熱水化開，可以了解龜鹿膏；喜歡熱湯與家常料理，可以從龜鹿湯塊或龜鹿膠開始。先看產品型態與生活情境，再比較規格會更容易。'+slogan,
            'soup-block-vs-jiao':'龜鹿湯塊是75g （2兩）／盒｜8塊裝，每塊約9.375g；龜鹿膠是600g （1斤）／盒｜32塊裝，每塊約18.75 g。兩者都能從溫熱料理情境理解，差別先看盒裝規格、每次取用與家庭使用方式。'+slogan,
            'gao-routine':'龜鹿膏食用時間可依個人使用習慣與作息時間安排；初次可先從半匙開始。可以直接取用，也可以用約100～300mL溫熱水化開。'+slogan,
            'gao-first-half':'龜鹿膏初次可以先從半匙開始；後續食用時間可依個人使用習慣與作息時間安排。這一篇只整理產品取用方式與日常安排。'+slogan,
            'tangkuai-75g':'龜鹿湯塊正式規格為75g （2兩）／盒｜8塊裝，每塊約9.375g。把總重量、盒裝數量與每塊約重一起看，會更容易理解實際規格，也不會和舊的300g或600g資料混在一起。'+slogan,
            'tangkuai-hot-water':'龜鹿湯塊除了料理，也可以依正式使用方式搭配熱水或保溫壺。不同情境都維持同一個正式規格：75g （2兩）／盒｜8塊裝，每塊約9.375g。'+slogan,
            'tangkuai-detail-weight':'龜鹿湯塊規格為75g （2兩）／盒｜8塊裝，每塊約9.375g。把總重量、塊數與單塊約重一起看，可以更清楚理解每次取用的份量。'+slogan,
            'jiao-600g':'龜鹿膠正式規格為600g （1斤）／盒｜32塊裝，每塊約18.75 g。產品本體維持淡紫色正式盒裝，不與龜鹿湯塊混用。'+slogan,
            'jiao-family':'龜鹿膠是600g （1斤）／盒｜32塊裝，每塊約18.75 g。可以從家庭料理、分塊取用與固定備用的角度理解，先看包裝與使用方式，不把大盒產品誤畫成75g龜鹿湯塊。'+slogan,
            'jiao-detail-weight':'龜鹿膠規格為600g （1斤）／盒｜32塊裝，每塊約18.75 g。把總重量、塊數與單塊約重一起看，可以更清楚理解家庭使用與分塊取用。'+slogan,
          }
          for tid,value in copy_updates.items():
              if tid in topics:topics[tid]['copy']=value
          if 'gao-routine' in topics:topics['gao-routine']['headline']='依自己的使用習慣與作息安排，更容易維持日常節奏'
          if 'tangkuai-75g' in topics:topics['tangkuai-75g']['title']='龜鹿湯塊75g （2兩）／盒，8塊裝代表什麼？'
          if 'tangkuai-detail-weight' in topics:
              topics['tangkuai-detail-weight']['title']='龜鹿湯塊每塊約9.375g，怎麼看這個數字？'
              topics['tangkuai-detail-weight']['headline']='75g （2兩）／盒、8塊裝，換算每塊約9.375g'
          if 'jiao-600g' in topics:topics['jiao-600g']['title']='龜鹿膠600g （1斤）／盒，怎麼看這個規格？'
          if 'jiao-detail-weight' in topics:
              topics['jiao-detail-weight']['title']='龜鹿膠每塊約18.75 g，怎麼看這個數字？'
              topics['jiao-detail-weight']['headline']='600g （1斤）／盒、32塊裝，換算每塊約18.75 g'
          bank_path.write_text(json.dumps(bank,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          # 2) Seed 工具：不能再用 INSERT OR IGNORE 靜默吞掉 CHECK/FK 錯誤；僅更新 draft / pending_review。
          seed_path=Path('tools/build-guilu-review-seed.mjs')
          seed=seed_path.read_text(encoding='utf-8')
          if 'XJW_CONTENT_SEED_CREATED_BY' not in seed:
              marker="const REQUIRED_IMAGE_PREFIX = `${SITE}/images/`;"
              assert marker in seed
              seed=seed.replace(marker,marker+"\nconst SEED_CREATED_BY = process.env.XJW_CONTENT_SEED_CREATED_BY || 'tung314069@gmail.com';")
          seed=seed.replace('statements.push(`INSERT OR IGNORE INTO social_posts(', 'statements.push(`INSERT INTO social_posts(')
          old_end="""    'github-actions-content-bank',CURRENT_TIMESTAMP,CURRENT_TIMESTAMP
  );`);"""
          new_end="""    ${sqlString(SEED_CREATED_BY)},CURRENT_TIMESTAMP,CURRENT_TIMESTAMP
  )
  ON CONFLICT(id) DO UPDATE SET
    title=excluded.title,headline=excluded.headline,copy=excluded.copy,category=excluded.category,platforms_json=excluded.platforms_json,
    status='pending_review',scheduled_at=NULL,proposed_scheduled_at=NULL,approved_by=NULL,approved_at=NULL,published_at=NULL,
    image_url=excluded.image_url,image_alt=excluded.image_alt,image_source=excluded.image_source,image_approved=0,
    image_width=excluded.image_width,image_height=excluded.image_height,image_bytes=excluded.image_bytes,image_quality_status=excluded.image_quality_status,
    updated_at=CURRENT_TIMESTAMP
  WHERE social_posts.status IN ('draft','pending_review');`);"""
          assert old_end in seed, 'seed insert ending marker not found'
          seed=seed.replace(old_end,new_end)
          seed_path.write_text(seed,encoding='utf-8')

          # 3) Review gate：最新每塊約重可出現在顧客文字，不得再被舊守門誤擋；龜鹿膏不鎖固定早晚。
          gate_path=Path('src/publishing-review-gate-entry.js')
          gate=gate_path.read_text(encoding='utf-8')
          gate=gate.replace("2026-08-14-publishing-review-gate-v4-draft-pending-approved","2026-08-15-publishing-review-gate-v5-current-product-authority")
          gate=gate.replace("if(/每塊約?\\s*9\\.375\\s*g/i.test(segment))errors.push('龜鹿湯塊每塊約9.375g只留產品詳細／內部資料，不放貼文主規格')","")
          gate=gate.replace("if(/每塊約?\\s*18\\.75\\s*g/i.test(segment))errors.push('龜鹿膠每塊約18.75 g只留產品詳細／內部資料，不放貼文主規格')","")
          gate=gate.replace("/(一天一次一小匙|每日一次一小匙|早晚各一小匙)/","/(一天一次一小匙|每日一次一小匙|早晚各一小匙|每日早上及下午各一小匙)/")
          gate=gate.replace("龜鹿膏目前正式使用方式為每日早上及下午各一小匙","龜鹿膏不設定固定早上／下午時段；食用時間可依個人使用習慣與作息時間安排")
          gate_path.write_text(gate,encoding='utf-8')

          # 4) Worker：正式狀態母本包含 pending_review / manual_required / failed，並能自動遷移舊 CHECK schema。
          worker_path=Path('src/worker.js')
          worker=worker_path.read_text(encoding='utf-8')
          worker=worker.replace("status TEXT NOT NULL DEFAULT 'draft',scheduled_at TEXT","status TEXT NOT NULL DEFAULT 'draft' CHECK (status IN ('draft','pending_review','approved','scheduled','published','manual_required','failed','archived')),scheduled_at TEXT")
          old_cols='["proposed_scheduled_at TEXT","image_alt TEXT NOT NULL DEFAULT \'\'","image_source TEXT NOT NULL DEFAULT \'官方素材\'","image_approved INTEGER NOT NULL DEFAULT 0","image_width INTEGER NOT NULL DEFAULT 0","image_height INTEGER NOT NULL DEFAULT 0","image_bytes INTEGER NOT NULL DEFAULT 0","image_quality_status TEXT NOT NULL DEFAULT \'unknown\'","approved_by TEXT","approved_at TEXT","published_at TEXT"]'
          new_cols='["proposed_scheduled_at TEXT","image_alt TEXT NOT NULL DEFAULT \'\'","image_source TEXT NOT NULL DEFAULT \'官方素材\'","image_approved INTEGER NOT NULL DEFAULT 0","image_width INTEGER NOT NULL DEFAULT 0","image_height INTEGER NOT NULL DEFAULT 0","image_bytes INTEGER NOT NULL DEFAULT 0","image_quality_status TEXT NOT NULL DEFAULT \'unknown\'","approved_by TEXT","approved_at TEXT","published_at TEXT","media_id TEXT","review_note TEXT NOT NULL DEFAULT \'\'","brand_check_json TEXT NOT NULL DEFAULT \'{}\'","rejection_reason TEXT NOT NULL DEFAULT \'\'"]'
          assert old_cols in worker or new_cols in worker
          worker=worker.replace(old_cols,new_cols)
          if 'async function ensureSocialPostStatusSchema(env)' not in worker:
              migration=r'''
async function ensureSocialPostStatusSchema(env){
  const row=await env.DB.prepare("SELECT sql FROM sqlite_master WHERE type='table' AND name='social_posts' LIMIT 1").first();
  const sql=String(row?.sql||'');
  if(!sql)return;
  const required=["'pending_review'","'manual_required'","'failed'"];
  if(required.every(value=>sql.includes(value)))return;
  const orphanCreated=await env.DB.prepare("SELECT COUNT(*) AS count FROM social_posts p LEFT JOIN profiles x ON p.created_by=x.email WHERE p.created_by<>'' AND x.email IS NULL").first();
  const orphanApproved=await env.DB.prepare("SELECT COUNT(*) AS count FROM social_posts p LEFT JOIN profiles x ON p.approved_by=x.email WHERE p.approved_by IS NOT NULL AND p.approved_by<>'' AND x.email IS NULL").first();
  if(Number(orphanCreated?.count||0)||Number(orphanApproved?.count||0))throw new Error('social_posts 狀態遷移前發現孤兒使用者關聯，已停止自動遷移');
  const before=await env.DB.prepare('SELECT COUNT(*) AS count FROM social_posts').first();
  await env.DB.exec(`
    DROP TABLE IF EXISTS social_posts_status_v2;
    CREATE TABLE social_posts_status_v2(
      id TEXT PRIMARY KEY,title TEXT NOT NULL,headline TEXT NOT NULL DEFAULT '',copy TEXT NOT NULL DEFAULT '',category TEXT NOT NULL DEFAULT '日常節奏',platforms_json TEXT NOT NULL DEFAULT '[]',
      status TEXT NOT NULL DEFAULT 'draft' CHECK (status IN ('draft','pending_review','approved','scheduled','published','manual_required','failed','archived')),
      scheduled_at TEXT,approved_by TEXT,approved_at TEXT,published_at TEXT,created_by TEXT NOT NULL,created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
      image_url TEXT NOT NULL DEFAULT '',image_alt TEXT NOT NULL DEFAULT '',image_source TEXT NOT NULL DEFAULT '官方素材',image_approved INTEGER NOT NULL DEFAULT 0 CHECK (image_approved IN (0,1)),
      image_width INTEGER NOT NULL DEFAULT 0,image_height INTEGER NOT NULL DEFAULT 0,image_bytes INTEGER NOT NULL DEFAULT 0,image_quality_status TEXT NOT NULL DEFAULT 'unknown',
      media_id TEXT,review_note TEXT NOT NULL DEFAULT '',brand_check_json TEXT NOT NULL DEFAULT '{}',rejection_reason TEXT NOT NULL DEFAULT '',proposed_scheduled_at TEXT,
      FOREIGN KEY(created_by) REFERENCES profiles(email),FOREIGN KEY(approved_by) REFERENCES profiles(email)
    );
    INSERT INTO social_posts_status_v2(id,title,headline,copy,category,platforms_json,status,scheduled_at,approved_by,approved_at,published_at,created_by,created_at,updated_at,image_url,image_alt,image_source,image_approved,image_width,image_height,image_bytes,image_quality_status,media_id,review_note,brand_check_json,rejection_reason,proposed_scheduled_at)
    SELECT id,title,headline,copy,category,platforms_json,status,scheduled_at,approved_by,approved_at,published_at,created_by,created_at,updated_at,image_url,image_alt,image_source,image_approved,image_width,image_height,image_bytes,image_quality_status,media_id,review_note,brand_check_json,rejection_reason,proposed_scheduled_at FROM social_posts;
  `);
  const staged=await env.DB.prepare('SELECT COUNT(*) AS count FROM social_posts_status_v2').first();
  if(Number(staged?.count||0)!==Number(before?.count||0))throw new Error('social_posts 狀態遷移 staging 筆數不一致，未切換正式表');
  await env.DB.exec(`
    DROP TABLE social_posts;
    ALTER TABLE social_posts_status_v2 RENAME TO social_posts;
    CREATE INDEX IF NOT EXISTS idx_social_posts_status ON social_posts(status);
    CREATE INDEX IF NOT EXISTS idx_social_posts_schedule ON social_posts(scheduled_at);
    CREATE INDEX IF NOT EXISTS idx_posts_status ON social_posts(status,scheduled_at);
  `);
  const after=await env.DB.prepare('SELECT COUNT(*) AS count FROM social_posts').first();
  const current=await env.DB.prepare("SELECT sql FROM sqlite_master WHERE type='table' AND name='social_posts' LIMIT 1").first();
  const foreignKeys=await env.DB.prepare('PRAGMA foreign_key_check').all();
  if(Number(after?.count||0)!==Number(before?.count||0))throw new Error('social_posts 狀態遷移後筆數不一致');
  if(!required.every(value=>String(current?.sql||'').includes(value)))throw new Error('social_posts 新狀態 CHECK 未生效');
  if((foreignKeys.results||[]).length)throw new Error('social_posts 狀態遷移後 foreign_key_check 未通過');
}
'''
              worker=worker.replace('async function ensureSchema(env){',migration+'\nasync function ensureSchema(env){')
          call='await ensureSocialPostStatusSchema(env);'
          if call not in worker:
              pattern=r"(for\(const definition of \[\"attempt_count INTEGER NOT NULL DEFAULT 0\".*?\]\)\{await addColumn\(env,'social_publish_deliveries',definition\);\})"
              worker,n=re.subn(pattern,r"\1\n    await ensureSocialPostStatusSchema(env);",worker,count=1,flags=re.S)
              assert n==1,'cannot inject social post schema migration call'
          worker_path.write_text(worker,encoding='utf-8')

          # 5) 新增永久驗收：避免狀態 schema、seed 或舊守門再倒退。
          validator=Path('tools/validate-social-post-status-schema.mjs')
          validator.write_text("""import fs from 'node:fs';
const read=p=>fs.readFileSync(p,'utf8');
const must=(v,m)=>{if(!v)throw new Error(m)};
const worker=read('src/worker.js'),production=read('src/production-entry.js'),gate=read('src/publishing-review-gate-entry.js'),seed=read('tools/build-guilu-review-seed.mjs');
for(const status of ['pending_review','manual_required','failed'])must(worker.includes(`'${status}'`),`worker D1狀態母本缺少 ${status}`);
must(worker.includes('ensureSocialPostStatusSchema'),'worker 缺少舊D1狀態CHECK自動遷移');
for(const status of ['pending_review','manual_required','failed'])must(production.includes(status),`production狀態讀取缺少 ${status}`);
must(!gate.includes('龜鹿膏目前正式使用方式為每日早上及下午各一小匙'),'review gate仍保留退役龜鹿膏固定時段');
must(gate.includes('食用時間可依個人使用習慣與作息時間安排'),'review gate未同步目前龜鹿膏使用原則');
must(!gate.includes('每塊約9.375g只留產品詳細／內部資料，不放貼文主規格'),'review gate仍誤擋目前湯塊每塊約重');
must(!gate.includes('每塊約18.75 g只留產品詳細／內部資料，不放貼文主規格'),'review gate仍誤擋目前龜鹿膠每塊約重');
must(seed.includes('XJW_CONTENT_SEED_CREATED_BY'),'母庫seed沒有合法created_by來源');
must(!seed.includes('INSERT OR IGNORE INTO social_posts'),'母庫seed不得再靜默忽略CHECK/FK錯誤');
must(seed.includes('ON CONFLICT(id) DO UPDATE SET'),'母庫seed缺少draft/pending安全同步');
must(seed.includes("WHERE social_posts.status IN ('draft','pending_review')"),'母庫seed不得覆寫已核准／已發布貼文');
console.log('PASS：D1正式貼文狀態、待審核母庫與目前產品守門規則一致。');
""",encoding='utf-8')
          pkg_path=Path('package.json')
          pkg=json.loads(pkg_path.read_text(encoding='utf-8'))
          guard=pkg['scripts']['guard:full']
          token='node tools/validate-social-post-status-schema.mjs'
          if token not in guard:pkg['scripts']['guard:full']=token+' && '+guard
          pkg_path.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate source and current content before database migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          bank=json.loads(Path('assets/data/guilu-content-topic-bank-v20260814.json').read_text(encoding='utf-8'))
          text=json.dumps(bank,ensure_ascii=False)
          for token in ['早上及下午各一小匙','一般日常安排為早上及下午','75g／盒、8塊裝','600g（1斤）／盒','600g（1斤）大盒','每塊約18.75g','current-products-v3']:
              if token in text:raise SystemExit(f'仍有退役母庫內容：{token}')
          topics={t['id']:t for t in bank.get('topics',[]) if t.get('id')}
          assert '75g （2兩）／盒｜8塊裝，每塊約9.375g' in topics['soup-block-vs-jiao']['copy']
          assert '600g （1斤）／盒｜32塊裝，每塊約18.75 g' in topics['soup-block-vs-jiao']['copy']
          assert '依個人使用習慣與作息時間安排' in topics['gao-routine']['copy']
          seeded=sum(1 for t in bank.get('topics',[]) if t.get('seedToReview') is True)
          assert seeded==28, seeded
          for t in bank.get('topics',[]):
              if t.get('imageMode')=='official_product':
                  assert '/images/customer-display-v20260812/' in t.get('imageUrl',''),t.get('id')
                  assert '/images/products-v3/' not in t.get('imageUrl',''),t.get('id')
          print(f'PASS: current guilu bank total={len(bank.get("topics",[]))}, seedToReview={seeded}')
          PY
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run check
          npm run guard:full
          npm run build:static
          XJW_CONTENT_SEED_CREATED_BY="$XJW_CONTENT_SEED_CREATED_BY" node tools/build-guilu-review-seed.mjs > /tmp/guilu-seed.sql
          grep -Fq "'pending_review'" /tmp/guilu-seed.sql
          grep -Fq 'ON CONFLICT(id) DO UPDATE SET' /tmp/guilu-seed.sql

      - name: Preflight remote D1 before schema migration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS row_count FROM social_posts; SELECT COUNT(*) AS orphan_created FROM social_posts p LEFT JOIN profiles x ON p.created_by=x.email WHERE p.created_by<>'' AND x.email IS NULL; SELECT COUNT(*) AS orphan_approved FROM social_posts p LEFT JOIN profiles x ON p.approved_by=x.email WHERE p.approved_by IS NOT NULL AND p.approved_by<>'' AND x.email IS NULL; SELECT sql AS table_sql FROM sqlite_master WHERE type='table' AND name='social_posts';" > /tmp/d1-preflight.json
          cat /tmp/d1-preflight.json
          node - <<'NODE'
          const fs=require('fs');const data=JSON.parse(fs.readFileSync('/tmp/d1-preflight.json','utf8'));let rows=null,oc=null,oa=null,sql='';
          const walk=x=>{if(Array.isArray(x)){for(const v of x)walk(v)}else if(x&&typeof x==='object'){if('row_count'in x)rows=Number(x.row_count);if('orphan_created'in x)oc=Number(x.orphan_created);if('orphan_approved'in x)oa=Number(x.orphan_approved);if('table_sql'in x)sql=String(x.table_sql||'');for(const v of Object.values(x))walk(v)}};walk(data);
          if(rows===null||rows<1)throw new Error(`social_posts preflight row_count異常：${rows}`);
          if(oc!==0||oa!==0)throw new Error(`social_posts有孤兒FK：created=${oc}, approved=${oa}`);
          fs.writeFileSync('/tmp/d1-before-count.txt',String(rows));
          if(sql.includes("'pending_review'")&&sql.includes("'manual_required'")&&sql.includes("'failed'"))fs.writeFileSync('/tmp/d1-migration-needed.txt','0');else fs.writeFileSync('/tmp/d1-migration-needed.txt','1');
          console.log(`PASS: preflight rows=${rows}, migrationNeeded=${fs.readFileSync('/tmp/d1-migration-needed.txt','utf8')}`);
          NODE

      - name: Migrate remote D1 status CHECK safely
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat /tmp/d1-migration-needed.txt)" = "0" ]; then echo 'D1 status schema already current'; exit 0; fi
          cat > /tmp/social-post-status-stage.sql <<'SQL'
          DROP TABLE IF EXISTS social_posts_status_v2;
          CREATE TABLE social_posts_status_v2(
            id TEXT PRIMARY KEY,
            title TEXT NOT NULL,
            headline TEXT NOT NULL DEFAULT '',
            copy TEXT NOT NULL DEFAULT '',
            category TEXT NOT NULL DEFAULT '日常節奏',
            platforms_json TEXT NOT NULL DEFAULT '[]',
            status TEXT NOT NULL DEFAULT 'draft' CHECK (status IN ('draft','pending_review','approved','scheduled','published','manual_required','failed','archived')),
            scheduled_at TEXT,
            approved_by TEXT,
            approved_at TEXT,
            published_at TEXT,
            created_by TEXT NOT NULL,
            created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
            updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
            image_url TEXT NOT NULL DEFAULT '',
            image_alt TEXT NOT NULL DEFAULT '',
            image_source TEXT NOT NULL DEFAULT '官方素材',
            image_approved INTEGER NOT NULL DEFAULT 0 CHECK (image_approved IN (0,1)),
            image_width INTEGER NOT NULL DEFAULT 0,
            image_height INTEGER NOT NULL DEFAULT 0,
            image_bytes INTEGER NOT NULL DEFAULT 0,
            image_quality_status TEXT NOT NULL DEFAULT 'unknown',
            media_id TEXT,
            review_note TEXT NOT NULL DEFAULT '',
            brand_check_json TEXT NOT NULL DEFAULT '{}',
            rejection_reason TEXT NOT NULL DEFAULT '',
            proposed_scheduled_at TEXT,
            FOREIGN KEY (created_by) REFERENCES profiles(email),
            FOREIGN KEY (approved_by) REFERENCES profiles(email)
          );
          INSERT INTO social_posts_status_v2(id,title,headline,copy,category,platforms_json,status,scheduled_at,approved_by,approved_at,published_at,created_by,created_at,updated_at,image_url,image_alt,image_source,image_approved,image_width,image_height,image_bytes,image_quality_status,media_id,review_note,brand_check_json,rejection_reason,proposed_scheduled_at)
          SELECT id,title,headline,copy,category,platforms_json,status,scheduled_at,approved_by,approved_at,published_at,created_by,created_at,updated_at,image_url,image_alt,image_source,image_approved,image_width,image_height,image_bytes,image_quality_status,media_id,review_note,brand_check_json,rejection_reason,proposed_scheduled_at FROM social_posts;
          SQL
          npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/social-post-status-stage.sql
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT (SELECT COUNT(*) FROM social_posts) AS old_count,(SELECT COUNT(*) FROM social_posts_status_v2) AS staged_count;" > /tmp/d1-stage.json
          cat /tmp/d1-stage.json
          node - <<'NODE'
          const fs=require('fs'),data=JSON.parse(fs.readFileSync('/tmp/d1-stage.json','utf8'));let o=null,s=null;const walk=x=>{if(Array.isArray(x))for(const v of x)walk(v);else if(x&&typeof x==='object'){if('old_count'in x)o=Number(x.old_count);if('staged_count'in x)s=Number(x.staged_count);for(const v of Object.values(x))walk(v)}};walk(data);if(o===null||s===null||o!==s)throw new Error(`staging筆數不一致 old=${o} staged=${s}`);console.log(`PASS: staging ${s} rows`);
          NODE
          cat > /tmp/social-post-status-swap.sql <<'SQL'
          DROP TABLE social_posts;
          ALTER TABLE social_posts_status_v2 RENAME TO social_posts;
          CREATE INDEX IF NOT EXISTS idx_social_posts_status ON social_posts(status);
          CREATE INDEX IF NOT EXISTS idx_social_posts_schedule ON social_posts(scheduled_at);
          CREATE INDEX IF NOT EXISTS idx_posts_status ON social_posts(status,scheduled_at);
          SQL
          npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/social-post-status-swap.sql

      - name: Verify migrated D1 and seed 28 current posts to pending review
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS row_count FROM social_posts; SELECT sql AS table_sql FROM sqlite_master WHERE type='table' AND name='social_posts'; PRAGMA foreign_key_check;" > /tmp/d1-after-migration.json
          cat /tmp/d1-after-migration.json
          node - <<'NODE'
          const fs=require('fs'),data=JSON.parse(fs.readFileSync('/tmp/d1-after-migration.json','utf8'));let rows=null,sql='',fk=[];const before=Number(fs.readFileSync('/tmp/d1-before-count.txt','utf8'));
          for(const block of data){const rs=block?.results||[];for(const r of rs){if('row_count'in r)rows=Number(r.row_count);if('table_sql'in r)sql=String(r.table_sql||'');if('table'in r&&'rowid'in r)fk.push(r)}}
          if(rows!==before)throw new Error(`遷移前後筆數不一致 before=${before} after=${rows}`);
          for(const status of ['pending_review','manual_required','failed'])if(!sql.includes(`'${status}'`))throw new Error(`新status CHECK缺少 ${status}`);
          if(fk.length)throw new Error(`foreign_key_check失敗 ${JSON.stringify(fk)}`);
          console.log(`PASS: D1 status schema current; preserved ${rows} existing posts`);
          NODE
          XJW_CONTENT_SEED_CREATED_BY="$XJW_CONTENT_SEED_CREATED_BY" node tools/build-guilu-review-seed.mjs > /tmp/guilu-seed.sql
          npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/guilu-seed.sql
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS guilu_count FROM social_posts WHERE instr(id,'XJW-GUILU-')=1; SELECT COUNT(*) AS guilu_pending FROM social_posts WHERE instr(id,'XJW-GUILU-')=1 AND status='pending_review'; SELECT COUNT(*) AS stale_count FROM social_posts WHERE instr(id,'XJW-GUILU-')=1 AND status IN ('draft','pending_review') AND (title LIKE '%75g／盒、8塊裝%' OR headline LIKE '%75g／盒、8塊裝%' OR copy LIKE '%75g／盒、8塊裝%' OR title LIKE '%600g（1斤）%' OR headline LIKE '%600g（1斤）%' OR copy LIKE '%600g（1斤）%' OR copy LIKE '%早上及下午各一小匙%' OR copy LIKE '%每塊約18.75g%'); SELECT COUNT(*) AS products_v3_live FROM social_posts WHERE instr(id,'XJW-GUILU-')=1 AND image_url LIKE '%/images/products-v3/%'; SELECT status,COUNT(*) AS count FROM social_posts GROUP BY status ORDER BY status;" > /tmp/d1-seed-audit.json
          cat /tmp/d1-seed-audit.json
          node - <<'NODE'
          const fs=require('fs'),data=JSON.parse(fs.readFileSync('/tmp/d1-seed-audit.json','utf8'));let g=null,p=null,s=null,v=null;const walk=x=>{if(Array.isArray(x))for(const y of x)walk(y);else if(x&&typeof x==='object'){if('guilu_count'in x)g=Number(x.guilu_count);if('guilu_pending'in x)p=Number(x.guilu_pending);if('stale_count'in x)s=Number(x.stale_count);if('products_v3_live'in x)v=Number(x.products_v3_live);for(const y of Object.values(x))walk(y)}};walk(data);
          if(g!==28)throw new Error(`龜鹿待審核母庫筆數應為28，實際=${g}`);if(p!==28)throw new Error(`龜鹿pending_review應為28，實際=${p}`);if(s!==0)throw new Error(`龜鹿待審核仍有退役內容=${s}`);if(v!==0)throw new Error(`龜鹿貼文仍直接使用products-v3=${v}`);console.log('PASS: remote D1 has 28 current guilu posts in pending_review, stale=0, products-v3-live=0');
          NODE

