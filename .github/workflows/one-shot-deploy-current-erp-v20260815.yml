name: 仙加味 ERP 目前正式版一次性部署

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-deploy-current-erp-v20260815.yml'

permissions:
  contents: write

concurrency:
  group: xianjiawei-erp-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }
          echo 'PASS: Cloudflare production credentials are configured.'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify maintenance guard mode
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const mode=JSON.parse(fs.readFileSync('guard-mode.json','utf8'));
          if(mode.mode!=='paused_for_full_system_update') throw new Error('unexpected guard mode');
          if(mode.blocking_content_and_media_guards!==false) throw new Error('blocking guards must remain paused during update');
          if(mode.keep_minimum_safety!==true) throw new Error('minimum safety must stay enabled');
          console.log('PASS: maintenance mode active; blocking content/media guards remain paused until live verification finishes.');
          NODE
      - name: Run current code and full guard contracts
        run: |
          npm run check
          npm run guard:full
      - name: Build full ERP plus standalone publishing assets
        run: npm run build:static
      - name: Verify required production output exists
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/assets/css/internal-app.css
          test -f dist/assets/js/internal-app.js
          test -f dist/assets/js/erp-publishing-separation.js
          test -f dist/publishing.html
          test -f dist/assets/js/publishing-app-v2.js
          test -f dist/assets/js/publishing-content-guidance-v20260814.js
          test -f dist/assets/js/formal-media-policy-v20260810.js
          test -f dist/assets/js/zip-media-assistant.js
          test -f dist/assets/data/guilu-content-topic-bank-v20260814.json
          test -f dist/data/latest-user-post-zip.json
          grep -q '營運中控' dist/index.html
          grep -q 'internal-app.js' dist/index.html
          grep -q '唯一正式內容系統' dist/publishing.html
          echo 'PASS: full ERP console and current standalone publishing assets exist in production dist.'
      - name: Verify remote D1 before deploy
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT 1 AS ok"
      - name: Deploy full production Worker
        run: npx wrangler deploy --keep-vars
      - name: Verify deployed Worker route and Access boundary
        shell: bash
        run: |
          set -euo pipefail
          base='https://xianjiawei-internal.tung314069.workers.dev'
          core_file="$(mktemp)"; root_file="$(mktemp)"; page_file="$(mktemp)"; topic_file="$(mktemp)"
          core_code="$(curl -sS --max-time 20 -o "$core_file" -w '%{http_code}' "$base/healthz/core" || true)"
          root_code="$(curl -sS --max-time 20 -o "$root_file" -w '%{http_code}' "$base/" || true)"
          page_code="$(curl -sS --max-time 20 -o "$page_file" -w '%{http_code}' "$base/publishing.html" || true)"
          topic_code="$(curl -sS --max-time 20 -o "$topic_file" -w '%{http_code}' "$base/assets/data/guilu-content-topic-bank-v20260814.json" || true)"
          for code in "$core_code" "$root_code" "$page_code" "$topic_code"; do
            test "$code" != '000' || { echo 'Production route is unreachable.' >&2; exit 1; }
            test "$code" -lt 500 || { echo "Production route returned server error $code" >&2; exit 1; }
          done
          core="$(cat "$core_file")"; root="$(cat "$root_file")"; page="$(cat "$page_file")"; topic="$(cat "$topic_file")"
          if CORE="$core" ROOT="$root" PAGE="$page" TOPIC="$topic" node -e "const core=JSON.parse(process.env.CORE||'{}'); const topic=JSON.parse(process.env.TOPIC||'{}'); const root=String(process.env.ROOT||''); const page=String(process.env.PAGE||''); if(core.ok!==true||!root.includes('營運中控')||!root.includes('internal-app.js')||!page.includes('貼文審核發佈系統')||!page.includes('唯一正式內容系統')||!Array.isArray(topic.topics)||topic.topics.length<40) process.exit(1);" 2>/dev/null; then
            readiness="$(curl -fsS --max-time 20 "$base/healthz/readiness")"
            READINESS="$readiness" node -e "const r=JSON.parse(process.env.READINESS||'{}'); if(!r||typeof r!=='object')process.exit(1);"
            echo 'XJW_DEPLOY_STATUS=verified_live' >> "$GITHUB_ENV"
            echo 'XJW_LIVE_VERIFY_MODE=direct_content_verified' >> "$GITHUB_ENV"
            echo 'PASS: authenticated/public production content and health endpoints are live.'
          else
            grep -Eiq '<html|<!doctype|cloudflare|access|sign in|login' "$core_file" || { echo 'healthz/core returned unexpected non-JSON content.' >&2; exit 1; }
            echo 'XJW_DEPLOY_STATUS=deployed_access_protected' >> "$GITHUB_ENV"
            echo 'XJW_LIVE_VERIFY_MODE=cloudflare_access_boundary_verified' >> "$GITHUB_ENV"
            echo 'PASS: Worker deploy and routes are live; unauthenticated requests are protected by the private access boundary.'
          fi
      - name: Record verified release and clean one-shot files
        shell: bash
        run: |
          set -euo pipefail
          cat > deployment-status.json <<EOF
          {
            "status": "${XJW_DEPLOY_STATUS}",
            "source_commit": "${GITHUB_SHA}",
            "runtime": "cloudflare-worker-full-erp",
            "entry": "src/production-entry.js",
            "health": "healthz/core + healthz/readiness + / + publishing.html + guilu topic bank",
            "live_verify_mode": "${XJW_LIVE_VERIFY_MODE}",
            "remote_d1": "verified",
            "guard_mode": "paused_for_full_system_update",
            "blocking_content_media_guards": false,
            "verified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment-status.json
          git rm .github/workflows/one-shot-deploy-current-erp-v20260815.yml
          if [ -f cloudflare-secret-presence-current.json ]; then git rm cloudflare-secret-presence-current.json; fi
          git diff --cached --check
          git commit -m 'deploy: record verified current ERP Worker release'
          git pull --rebase origin main
          git push origin HEAD:main
