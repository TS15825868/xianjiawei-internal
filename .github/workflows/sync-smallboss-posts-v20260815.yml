name: 仙加味完整單一情境小老闆圖同步貼文中心

on:
  push:
    branches: [main]
    paths:
      - 'assets/data/post-smallboss-media-v20260815.json'
      - 'assets/data/guilu-context-media-v20260815.json'
      - 'assets/data/social-image-audit-v20260815.json'
      - 'tools/rebind-one-shot-post-media-v20260815.mjs'
      - 'tools/apply-smallboss-media-overrides.mjs'
      - '.github/workflows/sync-smallboss-posts-v20260815.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xianjiawei-one-shot-post-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      XJW_CONTENT_SEED_CREATED_BY: tung314069@gmail.com
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require credentials and install dependencies
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Rebind every rebuilt post to approved non-collage media
        shell: bash
        run: |
          set -euo pipefail
          node tools/rebind-one-shot-post-media-v20260815.mjs
          node tools/apply-smallboss-media-overrides.mjs
          ! grep -Fq '/images/posts/smallboss-v20260815/' assets/data/post-smallboss-media-v20260815.json
          ! grep -Fq '/images/posts/smallboss-v20260815/' assets/data/guilu-context-media-v20260815.json
          ! grep -Fq '/images/posts/smallboss-v20260815/' assets/data/social-image-audit-v20260815.json
          node - <<'NODE'
          const fs=require('fs');
          for(const p of ['assets/data/post-smallboss-media-v20260815.json','assets/data/guilu-context-media-v20260815.json','assets/data/social-image-audit-v20260815.json']){
            const d=JSON.parse(fs.readFileSync(p,'utf8'));
            const raw=JSON.stringify(d);
            if(!raw.includes('no_collage') && !raw.includes('noCollage')) throw new Error(`${p}: no-collage policy missing`);
          }
          const m=JSON.parse(fs.readFileSync('assets/data/post-smallboss-media-v20260815.json','utf8'));
          const entries=Object.entries(m.overrides||{});
          if(entries.length!==59) throw new Error(`expected 59 bindings, got ${entries.length}`);
          for(const [id,x] of entries){
            if(!x.imageUrl||!x.imageAlt||!x.imageSource) throw new Error(`${id}: incomplete binding`);
            if(String(x.imageUrl).includes('/images/posts/smallboss-v20260815/')) throw new Error(`${id}: retired collage path`);
            if([x.imageAlt,x.imageSource].join(' ').includes('台興山產')) throw new Error(`${id}: blocked display name`);
          }
          console.log('PASS: 59 bindings are non-collage and customer-facing metadata is clean.');
          NODE
      - name: Persist no-collage mapping files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/data/post-smallboss-media-v20260815.json assets/data/guilu-context-media-v20260815.json assets/data/social-image-audit-v20260815.json
          if ! git diff --cached --quiet; then
            git commit -m 'feat(posts): replace collage visuals with approved one-shot media'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build current guilu and social review seeds
        shell: bash
        run: |
          set -euo pipefail
          XJW_CONTENT_SEED_CREATED_BY="$XJW_CONTENT_SEED_CREATED_BY" node tools/build-guilu-review-seed.mjs > /tmp/guilu.sql
          XJW_CONTENT_SEED_CREATED_BY="$XJW_CONTENT_SEED_CREATED_BY" node tools/build-social-batches-review-seed.mjs > /tmp/social.sql
          node - <<'NODE' > /tmp/legacy.sql
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('assets/data/post-smallboss-media-v20260815.json','utf8'));
          const q=v=>`'${String(v??'').replaceAll("'","''")}'`;
          for(const [id,item] of Object.entries(data.overrides||{})){
            if(id.startsWith('XJW-GUILU-')||id.startsWith('XJW-SOCIAL-')) continue;
            console.log(`UPDATE social_posts SET image_url=${q(item.imageUrl)},image_alt=${q(item.imageAlt)},image_source=${q(item.imageSource)},image_approved=0,status='pending_review',scheduled_at=NULL,proposed_scheduled_at=NULL,approved_by=NULL,approved_at=NULL,published_at=NULL,updated_at=CURRENT_TIMESTAMP WHERE id=${q(id)} AND status IN ('draft','pending_review','approved','scheduled');`);
          }
          NODE
          test "$(grep -c '^UPDATE social_posts' /tmp/legacy.sql)" -eq 5
      - name: Sync current images to Cloudflare D1 publishing center
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/guilu.sql
          npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/social.sql
          npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/legacy.sql
      - name: Verify publishing center is no-collage and correctly staged
        shell: bash
        run: |
          set -euo pipefail
          query_value(){
            local sql="$1"
            npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "$sql" > /tmp/query.json
            node -e "const x=require('/tmp/query.json'); process.stdout.write(String(x.flatMap(v=>v.results||[])[0].value));"
          }
          noncollage_count="$(query_value "SELECT COUNT(*) AS value FROM social_posts WHERE status<>'archived' AND image_source LIKE '%完整單一情境正式圖%';")"
          noncollage_not_pending="$(query_value "SELECT COUNT(*) AS value FROM social_posts WHERE image_source LIKE '%完整單一情境正式圖%' AND status<>'pending_review';")"
          collage_live="$(query_value "SELECT COUNT(*) AS value FROM social_posts WHERE status<>'archived' AND image_url LIKE '%/images/posts/smallboss-v20260815/%';")"
          pending_without_image="$(query_value "SELECT COUNT(*) AS value FROM social_posts WHERE status='pending_review' AND (image_url IS NULL OR trim(image_url)='');")"
          old_visual_live="$(query_value "SELECT COUNT(*) AS value FROM social_posts WHERE status IN ('draft','pending_review','approved','scheduled') AND (lower(image_url) LIKE '%/images/posts/current-v20260815/%.svg%' OR lower(image_url) LIKE '%/images/publishing/generated-v20260815/%.svg%' OR lower(image_url) LIKE '%post-image-guilu-drink.html%');")"
          blocked_name="$(query_value "SELECT COUNT(*) AS value FROM social_posts WHERE status<>'archived' AND (title LIKE '%台興山產%' OR headline LIKE '%台興山產%' OR copy LIKE '%台興山產%' OR image_alt LIKE '%台興山產%' OR image_source LIKE '%台興山產%');")"
          echo "noncollage_count=$noncollage_count"
          echo "noncollage_not_pending=$noncollage_not_pending"
          echo "collage_live=$collage_live"
          echo "pending_without_image=$pending_without_image"
          echo "old_visual_live=$old_visual_live"
          echo "blocked_name=$blocked_name"
          echo 'SOCIAL_DRAFTS_BEGIN'
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,image_url,image_source FROM social_posts WHERE status='draft' AND id LIKE 'XJW-SOCIAL-%' ORDER BY id;"
          echo 'SOCIAL_DRAFTS_END'
          test "$noncollage_count" -eq 59
          test "$noncollage_not_pending" -eq 0
          test "$collage_live" -eq 0
          test "$pending_without_image" -eq 0
          test "$old_visual_live" -eq 0
          test "$blocked_name" -eq 0
          echo 'PASS: 59 篇已改綁完整單一情境／正式產品小老闆情境圖並進待審核；拼湊圖、空圖、舊SVG與指定舊名稱皆為0。'
