name: 查驗 9/4 社群實際發布

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-social-delivery-20260904.yml'

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: 5e85d589-9c4f-412e-9ccd-585a5b6ecabe
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
    steps:
      - name: 查詢 D1 發布狀態
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query"
          query(){
            curl -fsS "$endpoint" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "$(jq -cn --arg sql "$1" '{sql:$sql}')" | jq .
          }
          echo '=== post ==='
          query "SELECT id,title,status,scheduled_at,published_at,updated_at,platforms_json,image_url FROM social_posts WHERE id='XJW-SOCIAL-20260904-0900-FIRST';"
          echo '=== deliveries ==='
          query "SELECT post_id,platform,status,remote_id,attempt_count,last_attempt_at,published_at,error_text FROM social_publish_deliveries WHERE post_id='XJW-SOCIAL-20260904-0900-FIRST' ORDER BY platform;"
      - name: 探測 Meta Page 與 Instagram 專業帳號身分
        shell: bash
        run: |
          set -euo pipefail
          base='https://graph.facebook.com/v25.0'
          fields='id,name,instagram_business_account,connected_instagram_account'
          echo '=== /me ==='
          curl -fsSG "$base/me" \
            --data-urlencode "fields=$fields" \
            --data-urlencode "access_token=$META_PAGE_ACCESS_TOKEN" | jq '{id,name,instagram_business_account,connected_instagram_account,error}'
          echo '=== /me/accounts ==='
          curl -sSG "$base/me/accounts" \
            --data-urlencode "fields=$fields" \
            --data-urlencode 'limit=100' \
            --data-urlencode "access_token=$META_PAGE_ACCESS_TOKEN" | jq '{data:[.data[]? | {id,name,instagram_business_account,connected_instagram_account}],error}'
