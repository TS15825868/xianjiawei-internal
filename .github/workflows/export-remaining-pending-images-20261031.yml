name: XJW one-time remaining pending image evidence export
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-remaining-pending-images-20261031.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read current remote D1 pending/draft image manifest only
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,copy,image_url,status,image_quality_status,updated_at FROM social_posts WHERE status IN ('pending_review','draft') ORDER BY id" > /tmp/xjw-pending-20261031.json
      - name: Copy only unreviewed tracked images with SHA-256 evidence
        env:
          ALREADY_EXPORTED_IDS: '["XJW-CONV-chat-30-bare-jar","XJW-CONV-chat-quiet-work","XJW-0663bdeb-49aa-46bf-8a41-95a14486f425","XJW-CONV-care-before-home-message","XJW-CONV-care-simple-checkin","XJW-CONV-chat-30-vs-180","XJW-CONV-chat-ask-boss-topic","XJW-CONV-chat-brand-not-only-product","XJW-CONV-chat-buy-first-look","XJW-CONV-chat-craft-years","XJW-CONV-chat-customer-first-question","XJW-CONV-chat-dayoff-cook"]'
        run: |
          python3 - <<'PY'
          import os,json,pathlib,shutil,hashlib
          source=json.load(open('/tmp/xjw-pending-20261031.json'))
          rows=source[0].get('results',[]) if isinstance(source,list) else source.get('results',[])
          if not 15<=len(rows)<=90:raise RuntimeError('Unexpected D1 pending rows; abort')
          done=set(json.loads(os.environ['ALREADY_EXPORTED_IDS']))
          prefix='https://raw.githubusercontent.com/TS15825868/xianjiawei-internal/main/'
          out=pathlib.Path('remaining-review-evidence-20261031');out.mkdir(exist_ok=True)
          evidence=[]
          for row in rows:
            if row['id'] in done:continue
            u=row.get('image_url') or ''
            if not u.startswith(prefix):raise RuntimeError('Non-repository image URL for '+row['id'])
            path=u[len(prefix):].split('?',1)[0]
            src=pathlib.Path(path)
            if not path.startswith('assets/post-images/') or '..' in src.parts or not src.is_file():raise RuntimeError('Unsafe or missing image '+row['id'])
            dest=out/src;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(src,dest)
            evidence.append(dict(post_id=row['id'],title=row['title'],copy=row['copy'],path=path,original_status=row['status'],original_quality=row['image_quality_status'],snapshot_updated_at=row['updated_at'],image_sha256=hashlib.sha256(src.read_bytes()).hexdigest(),bytes=src.stat().st_size))
          (out/'remaining-images-manifest.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2),encoding='utf8')
          print('PASS read-only remaining image export:',len(evidence),'from D1 rows:',len(rows))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xjw-remaining-pending-image-evidence-20261031
          path: remaining-review-evidence-20261031
          if-no-files-found: error
          retention-days: 2
          compression-level: 1
