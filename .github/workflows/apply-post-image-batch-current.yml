name: 仙加味貼文圖片通用批次回填

on:
  push:
    branches: [main]
    paths:
      - 'ops/post-image-bindings-current.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xianjiawei-post-image-binding-current
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Build D1 update SQL
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('ops/post-image-bindings-current.json','utf8'));
          const q=v=>"'" + String(v??'').replaceAll("'","''") + "'";
          const lines=[];
          for(const x of data.items){
            const url='https://raw.githubusercontent.com/TS15825868/xianjiawei-internal/main/'+x.path;
            lines.push(`UPDATE social_posts SET image_url=${q(url)}, image_alt=${q(x.alt)}, image_source=${q('ChatGPT正式生成｜GitHub main｜人工待審核')}, image_width=${Number(x.width)}, image_height=${Number(x.height)}, image_bytes=${Number(x.bytes)}, image_quality_status='ok', image_approved=0, status='pending_review', approved_by=NULL, approved_at=NULL, scheduled_at=NULL, published_at=NULL, updated_at=datetime('now') WHERE id=${q(x.postId)} AND status='draft';`);
          }
          fs.writeFileSync('/tmp/apply-post-images.sql',lines.join('\n')+'\n');
          NODE
      - name: Apply image bindings to formal D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/apply-post-images.sql
      - name: Verify all bound posts
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('ops/post-image-bindings-current.json','utf8'));
          const ids=data.items.map(x=>"'"+String(x.postId).replaceAll("'","''")+"'").join(',');
          fs.writeFileSync('/tmp/verify.sql',`SELECT id,status,image_url,image_width,image_height,image_bytes,image_quality_status FROM social_posts WHERE id IN (${ids}) ORDER BY id;`);
          NODE
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --file /tmp/verify.sql > /tmp/verify.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('ops/post-image-bindings-current.json','utf8'));
          const raw=JSON.parse(fs.readFileSync('/tmp/verify.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          if(rows.length!==data.items.length)throw new Error('回填後貼文筆數不完整');
          for(const x of data.items){
            const r=rows.find(v=>v.id===x.postId);
            if(!r)throw new Error(x.postId+' 找不到');
            if(r.status!=='pending_review')throw new Error(x.postId+' 未進入 pending_review');
            if(!String(r.image_url||'').includes(x.path))throw new Error(x.postId+' 圖片路徑不正確');
            if(Number(r.image_width)!==Number(x.width)||Number(r.image_height)!==Number(x.height))throw new Error(x.postId+' 尺寸不正確');
            if(r.image_quality_status!=='ok')throw new Error(x.postId+' 品質狀態不正確');
          }
          console.log('PASS',rows.length,'posts pending_review');
          NODE
      - name: Rebuild current production queue
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,copy,category,image_alt,image_source FROM social_posts WHERE status='draft' ORDER BY id" > /tmp/active-drafts.json
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const raw=JSON.parse(fs.readFileSync('/tmp/active-drafts.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          const productKeys=['30cc','180cc','龜鹿膏','龜鹿湯塊','龜鹿膠','鹿茸粉'];
          const items=rows.map((r,index)=>{const text=[r.title,r.copy,r.image_alt].filter(Boolean).join(' ');return{postId:r.id,imageId:`XJW-ACTIVE-IMG-${String(index+1).padStart(3,'0')}`,kind:r.category||'生活內容',title:r.title||'',products:productKeys.filter(x=>text.includes(x)),scene:r.image_alt||'',imageSource:r.image_source||'',status:'needs_unique_image',copyHash:crypto.createHash('sha256').update(r.copy||'').digest('hex').slice(0,16)}});
          const out={version:'2026-09-22-live-after-batch',brand:'仙加味',source:'Cloudflare D1 live social_posts WHERE status=draft',total:items.length,status:'production-queue',rule:'只有完成正式圖、回填D1並進pending_review才算完成；柒玄茶暫停對外。',items};
          fs.writeFileSync('ops/post-image-production-queue-current.json',JSON.stringify(out,null,2)+'\n');
          console.log('remaining drafts',items.length);
          NODE
      - name: Commit rebuilt queue if changed
        run: |
          if git diff --quiet -- ops/post-image-production-queue-current.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/post-image-production-queue-current.json
          git commit -m 'sync: refresh remaining post image queue'
          git push
