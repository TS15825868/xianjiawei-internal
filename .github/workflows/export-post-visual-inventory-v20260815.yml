name: 仙加味貼文視覺與文字全庫盤點

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-post-visual-inventory-v20260815.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require D1 credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install Wrangler
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Export current posts
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "
            SELECT id,title,headline,copy,category,platforms_json,status,image_url,image_alt,image_source,image_approved,review_note,rejection_reason
            FROM social_posts
            WHERE status<>'archived'
            ORDER BY id;
          " > /tmp/all-posts.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "
            SELECT id,title,headline,copy,category,image_url,image_alt,image_source,status
            FROM social_posts
            WHERE status='draft'
              AND (
                lower(image_url) LIKE '%/images/posts/current-v20260815/%.svg%'
                OR lower(image_url) LIKE '%/images/publishing/generated-v20260815/%.svg%'
              )
            ORDER BY id;
          " > /tmp/broken-svg-drafts.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "
            SELECT id,title,status,image_url
            FROM social_posts
            WHERE status<>'archived'
              AND (
                title LIKE '%台興山產%' OR headline LIKE '%台興山產%' OR copy LIKE '%台興山產%' OR image_alt LIKE '%台興山產%' OR image_source LIKE '%台興山產%'
              )
            ORDER BY id;
          " > /tmp/taixing-public-text.json
          node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/all-posts.json','utf8')).flatMap(x=>x.results||[]);
          const broken=JSON.parse(fs.readFileSync('/tmp/broken-svg-drafts.json','utf8')).flatMap(x=>x.results||[]);
          const taixing=JSON.parse(fs.readFileSync('/tmp/taixing-public-text.json','utf8')).flatMap(x=>x.results||[]);
          console.log(`ALL_POSTS=${rows.length}`);
          console.log(`BROKEN_SVG_DRAFTS=${broken.length}`);
          console.log(`TAIXING_PUBLIC_TEXT=${taixing.length}`);
          NODE
      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: post-visual-inventory-v20260815
          path: |
            /tmp/all-posts.json
            /tmp/broken-svg-drafts.json
            /tmp/taixing-public-text.json
          if-no-files-found: error
          retention-days: 7
