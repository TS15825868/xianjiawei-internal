name: 仙加味貼文視覺與文字全庫盤點

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-post-visual-inventory-v20260815.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require D1 credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install Wrangler
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Export all current posts and broken SVG drafts
        shell: bash
        run: |
          set -euo pipefail
          echo '=== BROKEN_SVG_DRAFTS ==='
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "
            SELECT id,title,headline,copy,category,image_url,image_alt,image_source,status
            FROM social_posts
            WHERE status='draft'
              AND (
                lower(image_url) LIKE '%/images/posts/current-v20260815/%.svg%'
                OR lower(image_url) LIKE '%/images/publishing/generated-v20260815/%.svg%'
              )
            ORDER BY id;
          "
          echo '=== ALL_POST_IMAGE_URLS ==='
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "
            SELECT id,title,status,image_url,image_alt,image_source
            FROM social_posts
            WHERE status<>'archived'
            ORDER BY id;
          "
          echo '=== TAIXING_PUBLIC_TEXT ==='
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "
            SELECT id,title,status,image_url
            FROM social_posts
            WHERE status<>'archived'
              AND (
                title LIKE '%台興山產%' OR headline LIKE '%台興山產%' OR copy LIKE '%台興山產%' OR image_alt LIKE '%台興山產%' OR image_source LIKE '%台興山產%'
              )
            ORDER BY id;
          "
