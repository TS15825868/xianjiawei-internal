name: 仙加味低風險貼文自動核准守門

on:
  workflow_run:
    workflows: ["仙加味貼文圖片通用批次回填"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-auto-approve-low-risk
  cancel-in-progress: false

jobs:
  approve:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Export pending review posts
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,headline,copy,category,status,image_url,image_alt,image_source,image_width,image_height,image_bytes,image_quality_status,image_approved FROM social_posts WHERE status='pending_review' ORDER BY id" > /tmp/pending.json
      - name: Build guarded approval SQL
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const bindings=JSON.parse(fs.readFileSync('ops/post-image-bindings-current.json','utf8'));
          const raw=JSON.parse(fs.readFileSync('/tmp/pending.json','utf8'));
          const posts=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          const byId=new Map(posts.map(p=>[p.id,p]));
          const banned=['治療','改善疾病','預防疾病','關節','卡卡','疲勞','精神不濟','補氣','生津','膠原蛋白','鈣質','保證功效','台興山產','TODO','debug','placeholder'];
          const mutable=['價格','售價','優惠','促銷','折扣','買十送一','10+1','新產品','新品'];
          const q=v=>"'" + String(v??'').replaceAll("'","''") + "'";
          const lines=[],approved=[],held=[];
          for(const x of bindings.items||[]){
            if(x.autoApprove!==true||x.riskLevel!=='low'||x.brandGatePassed!==true){held.push([x.postId,'未標記低風險自動核准']);continue}
            const p=byId.get(x.postId);
            if(!p){held.push([x.postId,'不在pending_review']);continue}
            const text=[p.title,p.headline,p.copy].filter(Boolean).join('\n');
            const reason=
              (!p.copy&&!p.headline)?'缺文案':
              !p.image_url?'缺圖片':
              !p.image_alt?'缺圖片說明':
              Number(p.image_width)<1000||Number(p.image_height)<1000?'圖片尺寸不足':
              p.image_quality_status==='low'?'圖片品質low':
              banned.some(v=>text.includes(v))?'含禁用詞':
              mutable.some(v=>text.includes(v))?'含價格/促銷/新品等易變高風險內容':
              /LINE(?! OA)/.test(text)?'LINE導流名稱不一致':'';
            if(reason){held.push([x.postId,reason]);continue}
            lines.push(`UPDATE social_posts SET status='approved', image_approved=1, approved_by='仙加味自動守門', approved_at=datetime('now'), updated_at=datetime('now') WHERE id=${q(x.postId)} AND status='pending_review';`);
            approved.push(x.postId);
          }
          fs.writeFileSync('/tmp/approve.sql',lines.join('\n')+'\n');
          fs.writeFileSync('/tmp/approved.json',JSON.stringify(approved));
          console.log('AUTO_APPROVE',approved);
          console.log('HOLD',held);
          NODE
      - name: Apply low-risk approvals
        shell: bash
        run: |
          if [ ! -s /tmp/approve.sql ]; then
            echo "No low-risk posts explicitly marked for auto approval."
            exit 0
          fi
          npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/approve.sql
      - name: Verify approved posts
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const ids=JSON.parse(fs.readFileSync('/tmp/approved.json','utf8'));
          if(!ids.length){console.log('PASS no eligible auto approvals');process.exit(0)}
          const q=v=>"'" + String(v).replaceAll("'","''") + "'";
          fs.writeFileSync('/tmp/verify.sql',`SELECT id,status,image_approved,approved_by FROM social_posts WHERE id IN (${ids.map(q).join(',')}) ORDER BY id;`);
          NODE
          if [ ! -s /tmp/verify.sql ]; then exit 0; fi
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --file /tmp/verify.sql > /tmp/verify.json
          node - <<'NODE'
          const fs=require('fs');
          const ids=JSON.parse(fs.readFileSync('/tmp/approved.json','utf8'));
          if(!ids.length)process.exit(0);
          const raw=JSON.parse(fs.readFileSync('/tmp/verify.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          if(rows.length!==ids.length)throw new Error('自動核准筆數不一致');
          for(const r of rows)if(r.status!=='approved'||Number(r.image_approved)!==1||r.approved_by!=='仙加味自動守門')throw new Error(r.id+' 自動核准驗證失敗');
          console.log('PASS auto-approved',rows.length);
          NODE
