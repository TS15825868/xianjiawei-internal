name: 仙加味待審候選時段安全驗證（不寫入過期清單）
on:
  push:
    branches: [main]
    paths:
      - 'ops/social-publishing-cadence-current.json'
permissions:
  contents: read
concurrency:
  group: xianjiawei-proposed-social-schedule
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check live publishing cadence and explicitly hold legacy proposed times
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('ops/social-publishing-cadence-current.json','utf8'));
          if(c.timezone!=='Asia/Taipei'||c.weeklyCadence?.normalPostsPerWeek!==2||
            c.weeklyCadence?.specialWeekMaxPosts!==3)throw Error('正式每週2至3篇發布節奏不符');
          const slots=c.weeklyCadence?.slots||[];
          if(slots[0]?.weekday!=='Tuesday'||slots[0]?.time!=='10:00'||
             slots[1]?.weekday!=='Friday'||slots[1]?.time!=='10:00'||
             slots[2]?.weekday!=='Sunday'||slots[2]?.time!=='10:00'||slots[2]?.optional!==true)
            throw Error('正式台灣時間週二／週五／選用週日10:00規則不符');
          const legacy=c.slots||[];
          if(!Array.isArray(legacy))throw Error('舊候選資料格式不合法');
          const now=Date.now();
          const past=legacy.filter(x=>Date.parse(x.proposed_scheduled_at||'')<=now).length;
          const latest=c.slotAuthority?.nextTargetSlots||[];
          if(latest.some(x=>x.status==='SCHEDULED'&&
              (!x.remoteMetricoolId||!x.remoteUuid||!x.verifiedAt)))
            throw Error('不能將尚無Metricool遠端回執的目標偽裝為正式排程');
          console.log('PASS weekly cadence: Tuesday 10, Friday 10, optional Sunday 10 Asia/Taipei');
          console.log('LEGACY_CANDIDATE_HOLD',JSON.stringify({entries:legacy.length,past,reason:'historical candidate list; may include archived/published posts; never write it back to D1',newReleaseTargets:latest.length}));
          console.log('No D1 writes; no public posts sent; no Metricool schedule created.');
          NODE
      - name: Check D1 actual status without materializing legacy calendar
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.45.3 d1 execute xianjiawei-internal-db --remote --json --command "SELECT status,COUNT(*) AS count, SUM(CASE WHEN scheduled_at IS NOT NULL THEN 1 ELSE 0 END) AS scheduled_at_count FROM social_posts GROUP BY status ORDER BY status"
