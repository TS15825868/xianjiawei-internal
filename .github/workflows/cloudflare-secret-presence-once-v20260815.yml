name: 仙加味 ERP Cloudflare Secrets 存在性檢查
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-secret-presence-once-v20260815.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check configured secret presence without exposing values
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo 'CLOUDFLARE_API_TOKEN=PRESENT'; else echo 'CLOUDFLARE_API_TOKEN=MISSING'; fi
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo 'CLOUDFLARE_ACCOUNT_ID=PRESENT'; else echo 'CLOUDFLARE_ACCOUNT_ID=MISSING'; fi
          echo 'Presence check only; no secret values printed and no deployment attempted.'
