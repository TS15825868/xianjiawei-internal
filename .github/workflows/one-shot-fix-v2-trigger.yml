name: 仙加味 ERP v2 對齊流程修正

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-v2-trigger.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Remove only the nonexistent optional replacement and retrigger v2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/one-shot-align-current-erp-authority-v2.yml')
          lines=path.read_text(encoding='utf-8').splitlines()
          needle='("使用products-v3最新正式實拍完整等比例融入"'
          kept=[]
          removed=0
          for line in lines:
              if needle in line:
                  removed+=1
                  continue
              kept.append(line)
          if removed != 1:
              raise SystemExit(f'expected exactly one obsolete optional replacement, removed={removed}')
          for i,line in enumerate(kept):
              if line.startswith('# rerun-2:'):
                  kept[i]='# rerun-3: removed only the nonexistent optional regeneration replacement; all real current-authority targets remain'
                  break
          path.write_text('\n'.join(kept)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-shot-align-current-erp-authority-v2.yml
          git rm .github/workflows/one-shot-fix-v2-trigger.yml
          git commit -m 'chore(erp): retrigger validated current authority alignment'
          git pull --rebase origin main
          git push origin HEAD:main
