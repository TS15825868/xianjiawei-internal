name: 仙加味 Metricool 核准圖片格式安全測試
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-metricool-approved-post-current.yml'
      - 'tools/metricool-image-format.cjs'
      - 'tools/metricool-image-format.test.cjs'
      - '.github/workflows/verify-metricool-approved-workflow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-media-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test tools/metricool-image-format.test.cjs
