name: 仙加味兩篇已發同角度重複稿精準封存
on:
  push:
    branches: [main]
    paths: ['ops/request-two-other-repeated-editorial-angles-20261108.json']
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  safe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node ops/archive-two-other-editorial-repeats-20261108.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-repeat-archive-${{ github.run_id }}
          path: two-other-editorial-duplicates-results.json
          retention-days: 7
