name: Prepare B2B inquiry tables
on:
  push:
    branches:
      - ops/b2b-inquiry-persistence
    paths:
      - '.github/workflows/prepare-business-inquiries-d1.yml'
  workflow_dispatch:
    inputs:
      allow_production_d1_export:
        description: Confirm Cloudflare free D1 Rows Read budget and authorize one production SQL export / isolated restore rehearsal
        type: boolean
        required: true
        default: false
      apply:
        description: Apply the migration after the backup and isolated rehearsal
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: xjw-business-inquiry-d1-migration
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'TS15825868/xianjiawei-internal' && ((github.event_name == 'push' && github.ref == 'refs/heads/ops/b2b-inquiry-persistence') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify schema and isolate test data
        run: |
          node --test edge/business-inquiries.test.mjs edge/business-inquiry-notification-management.test.mjs
          node --input-type=module -e 'import {businessInquirySchema} from "./edge/business-inquiries.mjs"; process.stdout.write(businessInquirySchema)' > "$RUNNER_TEMP/business-inquiries.sql"
      - name: Block migration if production export was not explicitly approved
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true && inputs.allow_production_d1_export != true }}
        run: |
          echo '::error::Production D1 backup-and-rehearsal consent is required before any B2B schema apply.'
          exit 1
      - name: Record offline-only B2B migration preflight
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.allow_production_d1_export != true }}
        run: echo 'B2B schema and isolated unit tests only; production D1 not accessed or migrated.' >> "$GITHUB_STEP_SUMMARY"
      - name: Install existing project dependencies without credentials
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_production_d1_export == true }}
        run: npm ci --ignore-scripts
      - name: Export and rehearse migration against an isolated restore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_production_d1_export == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --no-install wrangler d1 time-travel info xianjiawei-internal-db --json > "$RUNNER_TEMP/business-inquiries-recovery.json"
          # Pinned Wrangler 4.0.0 does not accept --skip-confirmation.
          # Remote export can emit a temporary signed download URL; never print it in public CI.
          if ! npx --no-install wrangler d1 export xianjiawei-internal-db --remote --output "$RUNNER_TEMP/business-inquiries-backup.sql" > "$RUNNER_TEMP/business-inquiries-export-private.log" 2>&1; then
            echo "::error::D1 export failed; private export output withheld."
            exit 1
          fi
          test -s "$RUNNER_TEMP/business-inquiries-backup.sql"
          python3 tools/verify-business-inquiry-d1-restore.py \
            "$RUNNER_TEMP/business-inquiries-backup.sql" "$RUNNER_TEMP/business-inquiries.sql" \
            "$RUNNER_TEMP/business-inquiries-recovery.json" "$RUNNER_TEMP/business-inquiries-preflight.json"
      - name: Redact recovery identifier from the public-repository artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_production_d1_export == true }}
        run: |
          python3 -c 'import hashlib,json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"business-inquiries-preflight.json"; x=json.loads(p.read_text()); b=x.pop("bookmark"); x["bookmarkSha256"]=hashlib.sha256(b.encode()).hexdigest(); p.write_text(json.dumps(x,indent=2)+"\n")'
      - name: Preserve recovery and rehearsal evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_production_d1_export == true }}
        uses: actions/upload-artifact@v4
        with:
          name: b2b-d1-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/business-inquiries-preflight.json
          if-no-files-found: error
      - name: Apply approved B2B schema and verify reads
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.apply == true && inputs.allow_production_d1_export == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute xianjiawei-internal-db --remote --file "$RUNNER_TEMP/business-inquiries.sql"
          npx --no-install wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT id, revision, notification_started_at FROM business_inquiries WHERE 0; SELECT actor_key, expires_at FROM business_inquiry_drafts WHERE 0;"
      - name: Remove downloaded production data from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/business-inquiries-backup.sql" "$RUNNER_TEMP/business-inquiries-recovery.json" "$RUNNER_TEMP/business-inquiries-export-private.log" "$RUNNER_TEMP/business-inquiries.sql" "$RUNNER_TEMP/business-inquiries-preflight.json"
