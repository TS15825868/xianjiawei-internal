name: Prepare B2B inquiry tables
on:
  push:
    branches:
      - ops/b2b-inquiry-persistence
    paths:
      - '.github/workflows/prepare-business-inquiries-d1.yml'
  workflow_dispatch:
    inputs:
      allow_production_d1_export:
        description: Authorize live D1 export which may interrupt queries; verify free budget and off-peak maintenance window first
        type: boolean
        required: true
        default: false
      apply:
        description: Apply the migration after the backup and isolated rehearsal
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: xjw-business-inquiry-d1-migration
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'TS15825868/xianjiawei-internal' && ((github.event_name == 'push' && github.ref == 'refs/heads/ops/b2b-inquiry-persistence') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify schema and isolate test data
        run: |
          node --test edge/business-inquiries.test.mjs edge/business-inquiry-notification-management.test.mjs
          node --input-type=module -e 'import {businessInquirySchema} from "./edge/business-inquiries.mjs"; import {businessInquiryCrmSchema} from "./edge/business-inquiry-crm.mjs"; process.stdout.write(businessInquirySchema + "\n" + businessInquiryCrmSchema)' > "$RUNNER_TEMP/business-inquiries.sql"
      - name: Block migration if production export was not explicitly approved
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true && inputs.allow_production_d1_export != true }}
        run: |
          echo '::error::Production D1 backup-and-rehearsal consent is required before any B2B schema apply.'
          exit 1
      - name: Validate account-wide D1 free Rows Read budget without production SQL
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_production_d1_export == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/check-d1-free-budget-before-export.mjs
      - name: Capture full live D1 table names for backup completeness (metadata only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_production_d1_export == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE_D1_TABLE_INVENTORY_PATH: ${{ runner.temp }}/business-inquiries-live-table-inventory.json
        run: node tools/capture-d1-live-table-inventory.mjs
      - name: Record offline-only B2B migration preflight
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.allow_production_d1_export != true }}
        run: echo 'B2B schema and isolated unit tests only; production D1 not accessed or migrated.' >> "$GITHUB_STEP_SUMMARY"
      - name: Install existing project dependencies without credentials
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_production_d1_export == true }}
        run: npm ci --ignore-scripts
      - name: Export and rehearse migration against an isolated restore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_production_d1_export == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --no-install wrangler d1 time-travel info xianjiawei-internal-db --json > "$RUNNER_TEMP/business-inquiries-recovery.json"
          # Pinned Wrangler 4.0.0 does not accept --skip-confirmation.
          # Remote export can emit a temporary signed download URL; never print it in public CI.
          if ! npx --no-install wrangler d1 export xianjiawei-internal-db --remote --output "$RUNNER_TEMP/business-inquiries-backup.sql" > "$RUNNER_TEMP/business-inquiries-export-private.log" 2>&1; then
            echo "::error::D1 export failed; private export output withheld."
            exit 1
          fi
          test -s "$RUNNER_TEMP/business-inquiries-backup.sql"
          python3 tools/verify-business-inquiry-d1-restore.py \
            "$RUNNER_TEMP/business-inquiries-backup.sql" "$RUNNER_TEMP/business-inquiries.sql" \
            "$RUNNER_TEMP/business-inquiries-recovery.json" "$RUNNER_TEMP/business-inquiries-preflight.json" "$RUNNER_TEMP/business-inquiries-live-table-inventory.json"
      - name: Redact recovery identifier from the public-repository artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_production_d1_export == true }}
        run: |
          python3 -c 'import hashlib,json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"business-inquiries-preflight.json"; x=json.loads(p.read_text()); b=x.pop("bookmark"); x["bookmarkSha256"]=hashlib.sha256(b.encode()).hexdigest(); p.write_text(json.dumps(x,indent=2)+"\n")'
      - name: Preserve recovery and rehearsal evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_production_d1_export == true }}
        uses: actions/upload-artifact@v4
        with:
          name: b2b-d1-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/business-inquiries-preflight.json
          if-no-files-found: error
      - name: Apply approved B2B schema and verify reads
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.apply == true && inputs.allow_production_d1_export == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # A validated full backup is necessary, but redundant table CREATE is not.
          # Existing B2B schema was already confirmed live. Never issue remote SQL
          # when the isolated rehearsal reports the three tables current.
          if python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"business-inquiries-preflight.json"; x=json.loads(p.read_text()); assert x.get("isolatedRestoreAndSchemaRehearsal")=="passed"; assert x.get("requiresProductionSchemaApply") is False'; then
            echo 'All three B2B tables already present with verified schema; remote D1 apply skipped.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Fail-closed: only a successful isolated rehearsal with missing tables may apply.
          python3 -c 'import json,os,pathlib,sys; x=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"business-inquiries-preflight.json").read_text()); sys.exit(0 if x.get("isolatedRestoreAndSchemaRehearsal")=="passed" and x.get("requiresProductionSchemaApply") is True and x.get("missingB2bTableCount") in (1,2,3) else 2)'
          npx --no-install wrangler d1 execute xianjiawei-internal-db --remote --file "$RUNNER_TEMP/business-inquiries.sql"
          npx --no-install wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT id, revision, notification_started_at FROM business_inquiries WHERE 0; SELECT actor_key, expires_at FROM business_inquiry_drafts WHERE 0; SELECT 1 FROM business_inquiry_crm_delivery WHERE 0;"
      - name: Remove downloaded production data from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/business-inquiries-backup.sql" "$RUNNER_TEMP/business-inquiries-recovery.json" "$RUNNER_TEMP/business-inquiries-export-private.log" "$RUNNER_TEMP/business-inquiries.sql" "$RUNNER_TEMP/business-inquiries-preflight.json" "$RUNNER_TEMP/business-inquiries-live-table-inventory.json"
