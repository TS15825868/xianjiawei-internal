name: XJW one-time AI visual precheck removes stale hard-rework flags
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reclassify-visual-inspected-legacy-holds-20261031.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xjw-d1-visual-evidence-maintenance
  cancel-in-progress: false
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_ROWS: |
        XJW-CONV-care-before-home-message|19fe92c1df87|3c9b1e9d97cc
        XJW-CONV-care-simple-checkin|7ff37b482e18|09af99ae30cd
        XJW-CONV-chat-ask-boss-topic|a7ac0e6b871a|1d35cfb13185
        XJW-CONV-chat-brand-not-only-product|a148b5484449|5a3eb12c8d0a
        XJW-CONV-chat-buy-first-look|9c933fa3e74d|27563fd236fb
        XJW-CONV-chat-craft-years|504c4a3873ae|b67fc553b8a6
        XJW-CONV-chat-dayoff-cook|8d8a7274b619|dc53c44e7169
        XJW-CONV-chat-elder-kitchen-habit|dd30eaea035e|d64559d907eb
        XJW-CONV-chat-family-old-object|d7d900260ecf|5223015dc252
        XJW-CONV-chat-fixed-storage|d35515ad1c0e|c592146d4435
        XJW-CONV-chat-last-bowl|58902982ef4d|3122295dfed8
        XJW-CONV-chat-no-standard-answer|4991b10381f3|5fbde8f25a8f
        XJW-CONV-chat-old-methods|1bdee3f0a396|c561311039aa
        XJW-CONV-chat-opening-prep|fd1e0e9db869|bfb3371d59ba
        XJW-CONV-chat-pantry-memory|0bd405f938d8|b19096624c1d
        XJW-CONV-chat-receive-package|b143b3059aeb|4d88fd665d48
        XJW-CONV-chat-recipe-or-feel|ac23cb985a1d|7bef76cdcba1
        XJW-CONV-chat-shop-organizing|7ad496354fb2|77b8a97a84ab
        XJW-CONV-chat-simple-soup|aeee6148d25d|10d4e2e6685e
        XJW-CONV-chat-small-things-work|7fa4563e0290|b8c162c4e167
        XJW-CONV-chat-tradition-today|05345abf0a49|c96fb019888c
        XJW-CONV-chat-traditional-image|757c78b3337c|87a3d4fd8792
        XJW-CONV-chat-wanhua-morning|006575db65cf|002956c14dd7
        XJW-CONV-cny-childhood-now|cc28bc212736|8e1874ee7b2a
        XJW-CONV-cny-family-choice|e9c306f47fa2|f227b003acdd
        XJW-CONV-cny-fridge-clean|24d377c706a8|71f3e110f34a
        XJW-CONV-cny-last-day-reset|069b2e0d9b09|ba20c6f554a6
        XJW-CONV-cny-must-have-dish|71f738baf1ab|d695584a06a2
        XJW-CONV-cny-pre-clean|9790f1ca7766|066e63f6e392
        XJW-CONV-cny-reopen|d8702b0d1546|c718889890af
        XJW-CONV-new-year-slow-start|22b5ec499b3b|f19008329f49
        XJW-CONV-new-year-warm-cup-share|1da90695f31d|293bbd8fe5a3
        XJW-CONV-weather-cool-drink|f98d6c1cd1a5|6b31fe01bb1f
        XJW-CONV-weather-rain-chat|995203821d48|c09f1c3f736b
        XJW-CONV-year-end-clean|4a81e9c17fd8|defffc3e6322
        XJW-CONV-year-end-keep-habit|30a19bca74da|e9ab3e645d6b
        XJW-CONV-year-end-small-win|2eef2cbaba5d|b969c866d291
        XJW-FEST-2027-eve-welcome-home|55880970b22b|1bf649948aea
        XJW-FEST-2027-lantern-riceballs|eedc34d32809|b4e474157ad6
        XJW-FEST-2027-newyear-breakfast|d9e0da80db8e|b15da0355eb2
        XJW-FEST-2027-spring-walk|6bc35f1ba7f8|5a281b7de61a
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read current pending D1 rows, review gates and external delivery locks
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,title,copy,image_url,image_quality_status,image_approved,approved_by,approved_at,scheduled_at,published_at,updated_at FROM social_posts WHERE status='pending_review' ORDER BY id" > /tmp/visual-before.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT post_id,state,metricool_id FROM social_metricool_sync WHERE post_id IN (SELECT id FROM social_posts WHERE status='pending_review')" > /tmp/visual-links.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT post_id,status,attempt_count,remote_id,published_at,last_attempt_at FROM social_publish_deliveries WHERE post_id IN (SELECT id FROM social_posts WHERE status='pending_review')" > /tmp/visual-deliveries.json
      - name: Strict current-version and image-byte preflight; generate conservative defer-only SQL
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'))[0].results;
          const before=read('/tmp/visual-before.json'),links=read('/tmp/visual-links.json'),deliveries=read('/tmp/visual-deliveries.json');
          const rows=process.env.TARGET_ROWS.trim().split(/\r?\n/).map(x=>{const [id,imagePrefix,copyPrefix]=x.trim().split('|');return{id,imagePrefix,copyPrefix}});
          if(rows.length!==41||new Set(rows.map(x=>x.id)).size!==41)throw Error('Unexpected or repeated AI precheck target list');
          const q=s=>"'"+String(s??'').replaceAll("'","''")+"'";
          const hashes=x=>crypto.createHash('sha256').update(x).digest('hex');
          const sql=[],proof=[];
          const prefix='https://raw.githubusercontent.com/TS15825868/xianjiawei-internal/main/';
          for(const item of rows){
            const p=before.find(x=>x.id===item.id);
            if(!p||p.status!=='pending_review'||p.image_quality_status!=='needs_rework'||Number(p.image_approved)!==0||p.approved_by||p.approved_at||p.scheduled_at||p.published_at||p.updated_at!=='2026-10-17 15:35:18')throw Error('Current D1 row changed; stop without writes: '+item.id);
            if(!p.image_url.startsWith(prefix))throw Error('Unexpected image host: '+item.id);
            const path=p.image_url.slice(prefix.length).split('?')[0];
            if(!path.startsWith('assets/post-images/')||path.includes('..')||!fs.existsSync(path))throw Error('Untrusted image path: '+item.id);
            const imageSha=hashes(fs.readFileSync(path)),copySha=hashes(p.copy);
            if(!imageSha.startsWith(item.imagePrefix)||!copySha.startsWith(item.copyPrefix))throw Error('Picture/copy differs from already inspected original: '+item.id);
            if(links.some(x=>x.post_id===p.id&&['scheduled','awaiting_work','queued','awaiting_verification','cancel_required','unknown','published'].includes(x.state)))throw Error('External work lock exists: '+item.id);
            if(deliveries.some(x=>x.post_id===p.id&&(Number(x.attempt_count)>0||x.last_attempt_at||x.published_at||x.remote_id||['sending','retry','published','manual_required','permanent_failed'].includes(x.status))))throw Error('Prior send attempt: '+item.id);
            const auditId='AUD-XJW-AI-DEFER-20261031-'+hashes(p.id).slice(0,20);
            const beforeEvidence=JSON.stringify({quality:'needs_rework',updated_at:p.updated_at,image_sha256:imageSha,copy_sha256:copySha});
            const afterEvidence=JSON.stringify({quality:'needs_review',visual_precheck:'scene visually inspected from real GitHub image bytes; pending 16-point formal review',reviewer_type:'AI_PRECHECK_NOT_HUMAN',image_sha256:imageSha,copy_sha256:copySha,d1_image_artifact_ids:[13029414371,13029776644],not_human_approved:true,not_ai_approved:true,auto_publish:false});
            sql.push("UPDATE social_posts SET image_quality_status='needs_review',image_approved=0,updated_at=datetime('now') WHERE id="+q(p.id)+" AND status='pending_review' AND image_quality_status='needs_rework' AND copy="+q(p.copy)+" AND image_url="+q(p.image_url)+" AND updated_at="+q(p.updated_at)+" AND approved_by IS NULL AND approved_at IS NULL AND scheduled_at IS NULL AND published_at IS NULL AND image_approved=0 AND NOT EXISTS(SELECT 1 FROM social_metricool_sync WHERE post_id=social_posts.id AND state IN ('scheduled','awaiting_work','queued','awaiting_verification','cancel_required','unknown','published')) AND NOT EXISTS(SELECT 1 FROM social_publish_deliveries WHERE post_id=social_posts.id AND (COALESCE(attempt_count,0)>0 OR last_attempt_at IS NOT NULL OR published_at IS NOT NULL OR TRIM(COALESCE(remote_id,''))<>'' OR status IN ('sending','retry','published','manual_required','permanent_failed')));");
            sql.push("INSERT INTO audit_logs(id,actor_email,action,entity_type,entity_id,before_json,after_json,ip) SELECT "+[auditId,'system:ai-precheck-not-human','AI圖片實際看圖：舊需重製轉待正式覆核','貼文',p.id,beforeEvidence,afterEvidence,''].map(q).join(',')+" WHERE changes()=1;");
            sql.push("DELETE FROM social_post_review_gates WHERE post_id="+q(p.id)+" AND EXISTS(SELECT 1 FROM audit_logs WHERE id="+q(auditId)+");");
            proof.push({post_id:p.id,expected_quality:'needs_review',image_sha256:imageSha,copy_sha256:copySha,audit_id:auditId});
          }
          fs.writeFileSync('/tmp/visual-update.sql',sql.join('\n')+'\n');
          fs.writeFileSync('/tmp/visual-targets.json',JSON.stringify(proof,null,2));
          console.log('PASS preflight: 41 truly reviewed image revisions, no active sends; only downgrade old hard-rework to defer/needs_review. NO approval.');
          NODE
      - name: Execute guarded D1 changes; leave every post pending, no publishing
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/visual-update.sql
      - name: Read back D1 rows, source audit and invalidated historic review gates
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,title,copy,image_url,image_quality_status,image_approved,approved_by,approved_at,scheduled_at,published_at,updated_at FROM social_posts WHERE status='pending_review' ORDER BY id" > /tmp/visual-after.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,entity_id,actor_email,action,after_json FROM audit_logs WHERE action='AI圖片實際看圖：舊需重製轉待正式覆核' AND id LIKE 'AUD-XJW-AI-DEFER-20261031-%'" > /tmp/visual-audit.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT post_id FROM social_post_review_gates WHERE post_id IN (SELECT id FROM social_posts WHERE status='pending_review')" > /tmp/visual-gates.json
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),r=p=>JSON.parse(fs.readFileSync(p,'utf8'))[0].results;
          const before=r('/tmp/visual-before.json'),after=r('/tmp/visual-after.json'),logs=r('/tmp/visual-audit.json'),gates=r('/tmp/visual-gates.json'),targets=JSON.parse(fs.readFileSync('/tmp/visual-targets.json','utf8'));const set=new Set(targets.map(x=>x.post_id));
          if(before.length!==after.length||targets.length!==41||logs.length!==41)throw Error('Expected post population/audit count changed');
          for(const p of before){
            const cur=after.find(x=>x.id===p.id);if(!cur)throw Error('Pending post vanished '+p.id);
            if(set.has(p.id)){
              if(cur.image_quality_status!=='needs_review'||cur.status!=='pending_review'||cur.image_approved!==0||cur.approved_by||cur.approved_at||cur.published_at||cur.scheduled_at||cur.copy!==p.copy||cur.image_url!==p.image_url)throw Error('Target after-state invalid '+p.id);
              if(gates.some(g=>g.post_id===p.id))throw Error('Stale approval gate not invalidated '+p.id);
              const audit=logs.find(x=>x.entity_id===p.id);
              if(!audit||audit.actor_email!=='system:ai-precheck-not-human'||JSON.parse(audit.after_json).quality!=='needs_review')throw Error('Missing truthful AI precheck audit '+p.id);
            }else if(JSON.stringify(cur)!==JSON.stringify(p))throw Error('Unrelated pending post modified '+p.id);
          }
          console.log('PASS independent D1 readback: 41 hard-rework flags properly turned into needs_review; all 59 remain pending review, no approval/sends.');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xjw-pending-visual-defer-evidence-${{ github.run_id }}
          path: |
            /tmp/visual-before.json
            /tmp/visual-after.json
            /tmp/visual-audit.json
            /tmp/visual-targets.json
          retention-days: 3
