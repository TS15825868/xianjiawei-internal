name: One-shot patch social quality v2 trigger
on:
  push:
    paths:
      - '.github/workflows/one-shot-patch-social-quality-v2-trigger.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Remove internal image-policy post from source and live cleanup list
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/one-shot-clean-social-quality-v2-20260815.yml')
          s=p.read_text()
          old="            'assets/data/social-batch-20260815-01.json':{'brand-from-wanhua','product-tangkuai'},\n            'assets/data/social-batch-20260815-03.json':{'one-eighty-pouch-detail'},"
          new="            'assets/data/social-batch-20260815-01.json':{'brand-from-wanhua','product-tangkuai'},\n            'assets/data/social-batch-20260815-02.json':{'real-product-image-policy'},\n            'assets/data/social-batch-20260815-03.json':{'one-eighty-pouch-detail'},"
          if old not in s: raise SystemExit('remove_by_file anchor missing')
          s=s.replace(old,new,1)
          old_ids="'XJW-SOCIAL-20260815-01-brand-from-wanhua','XJW-SOCIAL-20260815-01-product-tangkuai','XJW-SOCIAL-20260815-03-one-eighty-pouch-detail',"
          new_ids="'XJW-SOCIAL-20260815-01-brand-from-wanhua','XJW-SOCIAL-20260815-01-product-tangkuai','XJW-SOCIAL-20260815-02-real-product-image-policy','XJW-SOCIAL-20260815-03-one-eighty-pouch-detail',"
          if s.count(old_ids)!=2: raise SystemExit(f'expected two cleanup id anchors, found {s.count(old_ids)}')
          s=s.replace(old_ids,new_ids)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-shot-clean-social-quality-v2-20260815.yml
          git commit -m 'fix(publishing): remove internal image-policy post from review queue'
          git pull --rebase origin main
          git push origin HEAD:main