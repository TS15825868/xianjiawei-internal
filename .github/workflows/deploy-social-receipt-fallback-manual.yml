name: 仙加味免費備援安全部署
on:
  # Controlled release only: code changes receive zero-send verification,
  # but cannot deploy an unverified receipt endpoint implicitly.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xjw-receipt-fallback-manual-deploy
  cancel-in-progress: false
jobs:
  deploy-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify receipt-only safety
        run: |
          node --test src/social-webhook-cloudflare-fallback.test.mjs
          grep -q '"XJW_CF_RECEIPT_ENABLED": "false"' wrangler.social-receipt-fallback.jsonc
          grep -q '"XJW_META_E2E_VERIFIED": "false"' wrangler.social-receipt-fallback.jsonc
          grep -q '"XJW_PRIMARY_OVERLAP_VERIFIED": "false"' wrangler.social-receipt-fallback.jsonc
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy isolated fallback disabled
        run: npx --yes wrangler@4 deploy --config wrangler.social-receipt-fallback.jsonc
      - name: Confirm deployed endpoint is disabled
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 20 -o /tmp/fallback-response.json -w '%{http_code}' https://xianjiawei-social-receipt-fallback.tung314069.workers.dev/)
          test "$status" = 503
          node -e 'const x=require("/tmp/fallback-response.json"); if(x.accepted!==false || x.sent!==false || x.code!=="disabled")process.exit(1)'

