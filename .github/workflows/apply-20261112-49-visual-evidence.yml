name: 仙加味49篇現版逐篇圖片實際覆核證據寫入（不核准不發布）
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-20261112-49-visual-evidence.yml'
      - 'ops/request-20261112-49-visual-evidence-write.json'
permissions:
  contents: write
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Check scope, current image hashes and current D1 version before CAS
        run: |
          node --check ops/apply-20261112-49-visual-evidence.mjs
          node ops/apply-20261112-49-visual-evidence.mjs
      - name: Preserve actual readback receipt
        run: |
          set -euo pipefail
          git config user.name 'xianjiawei-safe-audit-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/receipts/20261112-49-visual-observation-d1.json
          git commit -m 'review: persist verified D1 readback for current 49 image observations'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xjw-49-visual-observation-d1-${{ github.run_id }}
          path: ops/receipts/20261112-49-visual-observation-d1.json
          retention-days: 7
