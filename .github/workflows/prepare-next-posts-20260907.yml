name: 準備 9月9日與9月11日正式貼文待審核
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-next-posts-20260907.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝
        run: npm ci --no-audit --no-fund
      - name: 建立兩篇正式候選並送待審核
        run: |
          set -euo pipefail
          cat > /tmp/seed-next-posts.sql <<'SQL'
          INSERT INTO social_posts(
            id,title,headline,copy,category,platforms_json,status,scheduled_at,proposed_scheduled_at,
            approved_by,approved_at,published_at,image_url,image_alt,image_source,image_approved,
            image_width,image_height,image_bytes,image_quality_status,created_by,created_at,updated_at
          ) VALUES(
            'XJW-SOCIAL-20260909-0900-CHOOSE',
            '週三早上，先看今天的生活動線再決定怎麼安排',
            '今天會整天在外，還是晚上才回到家？',
            '週三早上，出門前先看一下今天會待在哪裡：整天在外、工作空檔，或晚上才回到家。仙加味有不同產品型態，不必每一天都照同一套；先從自己的生活動線開始，再決定哪一種安排比較順手。想確認產品差異，也可以從 LINE 問我們。補養，是一種節奏。',
            '生活情境','["Facebook","Instagram"]','pending_review',NULL,'2026-09-09T01:00:00.000Z',
            NULL,NULL,NULL,
            'https://ts15825868.github.io/xianjiawei/images/brand/approved-v405/choose.webp',
            '仙加味Q版小男生小老闆在看板前依生活動線說明怎麼選，小鹿與小烏龜分開陪伴',
            '官網核准Q版素材｜approved-v405/choose.webp｜依本篇生活動線文案配對',
            0,1448,1086,297736,'clear','system',CURRENT_TIMESTAMP,CURRENT_TIMESTAMP
          )
          ON CONFLICT(id) DO UPDATE SET
            title=excluded.title,headline=excluded.headline,copy=excluded.copy,category=excluded.category,
            platforms_json=excluded.platforms_json,status=CASE WHEN social_posts.status='published' THEN social_posts.status ELSE 'pending_review' END,
            scheduled_at=CASE WHEN social_posts.status='published' THEN social_posts.scheduled_at ELSE NULL END,
            proposed_scheduled_at=CASE WHEN social_posts.status='published' THEN social_posts.proposed_scheduled_at ELSE excluded.proposed_scheduled_at END,
            approved_by=CASE WHEN social_posts.status='published' THEN social_posts.approved_by ELSE NULL END,
            approved_at=CASE WHEN social_posts.status='published' THEN social_posts.approved_at ELSE NULL END,
            image_url=excluded.image_url,image_alt=excluded.image_alt,image_source=excluded.image_source,
            image_approved=CASE WHEN social_posts.status='published' THEN social_posts.image_approved ELSE 0 END,
            image_width=excluded.image_width,image_height=excluded.image_height,image_bytes=excluded.image_bytes,
            image_quality_status=excluded.image_quality_status,updated_at=CURRENT_TIMESTAMP;

          INSERT INTO social_posts(
            id,title,headline,copy,category,platforms_json,status,scheduled_at,proposed_scheduled_at,
            approved_by,approved_at,published_at,image_url,image_alt,image_source,image_approved,
            image_width,image_height,image_bytes,image_quality_status,created_by,created_at,updated_at
          ) VALUES(
            'XJW-SOCIAL-20260911-0900-RECIPE',
            '週五回家想煮一鍋熱湯，先把晚餐的節奏留出來',
            '下班前把食材想好，回家就不用手忙腳亂',
            '週五下午準備下班前，如果晚上想在家煮一鍋熱湯，可以先把要用的食材記下來。仙加味把傳統飲食文化放進更貼近日常的料理方式裡；從備料、燉煮到一家人坐下來吃飯，都可以照自己的時間慢慢安排。補養，是一種節奏。',
            '生活情境','["Facebook","Instagram"]','pending_review',NULL,'2026-09-11T01:00:00.000Z',
            NULL,NULL,NULL,
            'https://ts15825868.github.io/xianjiawei/images/brand/approved-v405/recipes.webp',
            '仙加味Q版小男生小老闆在家常料理情境準備熱湯，小鹿與小烏龜分開陪伴',
            '官網核准Q版素材｜approved-v405/recipes.webp｜依本篇家常料理文案配對',
            0,1448,1086,330016,'clear','system',CURRENT_TIMESTAMP,CURRENT_TIMESTAMP
          )
          ON CONFLICT(id) DO UPDATE SET
            title=excluded.title,headline=excluded.headline,copy=excluded.copy,category=excluded.category,
            platforms_json=excluded.platforms_json,status=CASE WHEN social_posts.status='published' THEN social_posts.status ELSE 'pending_review' END,
            scheduled_at=CASE WHEN social_posts.status='published' THEN social_posts.scheduled_at ELSE NULL END,
            proposed_scheduled_at=CASE WHEN social_posts.status='published' THEN social_posts.proposed_scheduled_at ELSE excluded.proposed_scheduled_at END,
            approved_by=CASE WHEN social_posts.status='published' THEN social_posts.approved_by ELSE NULL END,
            approved_at=CASE WHEN social_posts.status='published' THEN social_posts.approved_at ELSE NULL END,
            image_url=excluded.image_url,image_alt=excluded.image_alt,image_source=excluded.image_source,
            image_approved=CASE WHEN social_posts.status='published' THEN social_posts.image_approved ELSE 0 END,
            image_width=excluded.image_width,image_height=excluded.image_height,image_bytes=excluded.image_bytes,
            image_quality_status=excluded.image_quality_status,updated_at=CURRENT_TIMESTAMP;

          DELETE FROM social_post_review_gates WHERE post_id IN ('XJW-SOCIAL-20260909-0900-CHOOSE','XJW-SOCIAL-20260911-0900-RECIPE');
          SQL
          npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/seed-next-posts.sql
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT id,title,status,scheduled_at,proposed_scheduled_at,image_url,image_approved FROM social_posts WHERE id IN ('XJW-SOCIAL-20260909-0900-CHOOSE','XJW-SOCIAL-20260911-0900-RECIPE') ORDER BY proposed_scheduled_at;"
      - name: 清理一次性準備流程
        if: always()
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-next-posts-20260907.yml
          git config user.name 'TS15825868'
          git config user.email 'tung314069@gmail.com'
          git add .github/workflows/prepare-next-posts-20260907.yml
          if ! git diff --cached --quiet; then
            git commit -m '移除 9月9日與9月11日貼文準備暫存流程'
            git push origin HEAD:main
          fi
