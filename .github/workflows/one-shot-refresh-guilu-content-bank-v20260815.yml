name: 仙加味龜鹿貼文母庫最新規格與待審核同步
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-refresh-guilu-content-bank-v20260815.yml'
permissions:
  contents: write
concurrency:
  group: xianjiawei-publishing-content-refresh
  cancel-in-progress: true
jobs:
  refresh-validate-sync-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Refresh content bank to current authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path=Path('assets/data/guilu-content-topic-bank-v20260814.json')
          bank=json.loads(path.read_text(encoding='utf-8'))
          bank['version']='2026-08-15-guilu-publishing-v3-current-product-authority'
          rules=bank.setdefault('rules',{})
          rules['imagePriority']='符合文案的目前正式素材優先；official_product 一律使用 customer-display 正式顧客產品圖，products-v3 只作實物身份與比例校正；沒有合格情境圖才重新生成。正式產品本體不得AI重畫、裁切、拉伸或改比例。'
          rules['pendingReviewRule']='只有文案與圖片都完整、且圖片來源可確認時才進待審核；既有 draft／pending_review 可同步最新正式文案與媒體，已核准或已發布內容不自動覆寫；所有貼文仍需人工圖文審核後才能核准。'

          media={
            'guilu-gao':'https://ts15825868.github.io/xianjiawei/images/customer-display-v20260812/guilu-gao.avif?v=20260814-product-modal-media-v3',
            'guilu-drink-30':'https://ts15825868.github.io/xianjiawei/images/customer-display-v20260812/guilu-drink-30cc.avif?v=20260814-product-modal-media-v3',
            'guilu-drink-180':'https://ts15825868.github.io/xianjiawei/images/customer-display-v20260812/guilu-drink-180cc-product.jpg?v=20260814-product-modal-media-v3',
            'guilu-tangkuai':'https://ts15825868.github.io/xianjiawei/images/customer-display-v20260812/guilu-tangkuai.avif?v=20260814-product-modal-media-v3',
            'guilu-jiao':'https://ts15825868.github.io/xianjiawei/images/customer-display-v20260812/guilu-jiao.avif?v=20260814-product-modal-media-v3',
            'luerong-fen':'https://ts15825868.github.io/xianjiawei/images/customer-display-v20260812/luerong-fen.avif?v=20260814-product-modal-media-v3',
          }

          def norm(s):
              if not isinstance(s,str): return s
              s=s.replace('75g／盒、8塊裝','75g （2兩）／盒｜8塊裝')
              s=s.replace('75g／盒｜8塊裝','75g （2兩）／盒｜8塊裝')
              s=s.replace('75g／盒','75g （2兩）／盒')
              s=s.replace('600g（1斤）／盒、32塊裝','600g （1斤）／盒｜32塊裝')
              s=s.replace('600g（1斤）／盒｜32塊裝','600g （1斤）／盒｜32塊裝')
              s=s.replace('600g（1斤）大盒、32塊裝','600g （1斤）／盒｜32塊裝')
              s=s.replace('600g（1斤）','600g （1斤）')
              s=s.replace('每塊約18.75g','每塊約18.75 g')
              return s

          topics={t.get('id'):t for t in bank.get('topics',[]) if t.get('id')}
          for t in bank.get('topics',[]):
              for key in ('title','headline','copy','category','imageAlt','imageSource'):
                  if key in t: t[key]=norm(t[key])
              if t.get('imageMode')=='official_product':
                  ids=[x for x in (t.get('productIds') or []) if x]
                  if len(ids)==1 and ids[0] in media:
                      t['imageUrl']=media[ids[0]]
                      t['imageSource']=f'仙加味目前正式顧客產品圖:{ids[0]}'

          slogan='\n\n仙加味｜補養，是一種節奏。'
          if 'guilu-forms' in topics:
              topics['guilu-forms']['copy']='想方便即飲，可以比較龜鹿飲；喜歡小匙取用或用溫熱水化開，可以了解龜鹿膏；喜歡熱湯與家常料理，可以從龜鹿湯塊或龜鹿膠開始。先看產品型態與生活情境，再比較規格會更容易。'+slogan
          if 'soup-block-vs-jiao' in topics:
              topics['soup-block-vs-jiao']['copy']='龜鹿湯塊是75g （2兩）／盒｜8塊裝，每塊約9.375g；龜鹿膠是600g （1斤）／盒｜32塊裝，每塊約18.75 g。兩者都能從溫熱料理情境理解，差別先看盒裝規格、每次取用與家庭使用方式。'+slogan
          if 'gao-routine' in topics:
              topics['gao-routine']['headline']='依自己的使用習慣與作息安排，更容易維持日常節奏'
              topics['gao-routine']['copy']='龜鹿膏食用時間可依個人使用習慣與作息時間安排；初次可先從半匙開始。可以直接取用，也可以用約100～300mL溫熱水化開。'+slogan
          if 'gao-first-half' in topics:
              topics['gao-first-half']['copy']='龜鹿膏初次可以先從半匙開始；後續食用時間可依個人使用習慣與作息時間安排。這一篇只整理產品取用方式與日常安排。'+slogan
          if 'tangkuai-75g' in topics:
              topics['tangkuai-75g']['title']='龜鹿湯塊75g （2兩）／盒，8塊裝代表什麼？'
              topics['tangkuai-75g']['copy']='龜鹿湯塊正式規格為75g （2兩）／盒｜8塊裝，每塊約9.375g。把總重量、盒裝數量與每塊約重一起看，會更容易理解實際規格，也不會和舊的300g或600g資料混在一起。'+slogan
          if 'tangkuai-hot-water' in topics:
              topics['tangkuai-hot-water']['copy']='龜鹿湯塊除了料理，也可以依正式使用方式搭配熱水或保溫壺。不同情境都維持同一個正式規格：75g （2兩）／盒｜8塊裝，每塊約9.375g。'+slogan
          if 'tangkuai-detail-weight' in topics:
              topics['tangkuai-detail-weight']['title']='龜鹿湯塊每塊約9.375g，怎麼看這個數字？'
              topics['tangkuai-detail-weight']['headline']='75g （2兩）／盒、8塊裝，換算每塊約9.375g'
              topics['tangkuai-detail-weight']['copy']='龜鹿湯塊規格為75g （2兩）／盒｜8塊裝，每塊約9.375g。把總重量、塊數與單塊約重一起看，可以更清楚理解每次取用的份量。'+slogan
          if 'jiao-600g' in topics:
              topics['jiao-600g']['title']='龜鹿膠600g （1斤）／盒，怎麼看這個規格？'
              topics['jiao-600g']['copy']='龜鹿膠正式規格為600g （1斤）／盒｜32塊裝，每塊約18.75 g。產品本體維持淡紫色正式盒裝，不與龜鹿湯塊混用。'+slogan
          if 'jiao-family' in topics:
              topics['jiao-family']['copy']='龜鹿膠是600g （1斤）／盒｜32塊裝，每塊約18.75 g。可以從家庭料理、分塊取用與固定備用的角度理解，先看包裝與使用方式，不把大盒產品誤畫成75g龜鹿湯塊。'+slogan
          if 'jiao-detail-weight' in topics:
              topics['jiao-detail-weight']['title']='龜鹿膠每塊約18.75 g，怎麼看這個數字？'
              topics['jiao-detail-weight']['headline']='600g （1斤）／盒、32塊裝，換算每塊約18.75 g'
              topics['jiao-detail-weight']['copy']='龜鹿膠規格為600g （1斤）／盒｜32塊裝，每塊約18.75 g。把總重量、塊數與單塊約重一起看，可以更清楚理解家庭使用與分塊取用。'+slogan

          path.write_text(json.dumps(bank,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY
      - name: Assert refreshed bank has no stale authority text
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          bank=json.loads(Path('assets/data/guilu-content-topic-bank-v20260814.json').read_text(encoding='utf-8'))
          text=json.dumps(bank,ensure_ascii=False)
          forbidden=['早上及下午各一小匙','一般日常安排為早上及下午','75g／盒、8塊裝','600g（1斤）／盒','600g（1斤）大盒','每塊約18.75g','current-products-v3']
          for token in forbidden:
              if token in text: raise SystemExit(f'仍有退役內容：{token}')
          topics={t['id']:t for t in bank.get('topics',[]) if t.get('id')}
          assert '依個人使用習慣與作息時間安排' in topics['gao-routine']['copy']
          assert '75g （2兩）／盒｜8塊裝，每塊約9.375g' in topics['soup-block-vs-jiao']['copy']
          assert '600g （1斤）／盒｜32塊裝，每塊約18.75 g' in topics['soup-block-vs-jiao']['copy']
          customer='/images/customer-display-v20260812/'
          seeded=0
          for t in bank.get('topics',[]):
              if t.get('seedToReview') is True: seeded+=1
              if t.get('imageMode')=='official_product':
                  assert customer in t.get('imageUrl',''), f"{t.get('id')} 未使用目前正式顧客產品圖"
                  assert '/images/products-v3/' not in t.get('imageUrl',''), f"{t.get('id')} 不得直接使用products-v3作貼文主圖"
          print(f'PASS: content bank current authority; seedToReview={seeded}; total={len(bank.get("topics",[]))}')
          PY
      - name: Install and validate publishing system
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run check
          npm run guard:full
          npm run build:static
      - name: Sync only draft and pending review rows to remote D1
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo 'Before sync:'
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT status,COUNT(*) AS count FROM social_posts WHERE id LIKE 'XJW-GUILU-%' GROUP BY status ORDER BY status"
          node tools/build-guilu-review-seed.mjs > /tmp/guilu-seed.sql
          npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/guilu-seed.sql
          python - <<'PY'
          import json,re
          from pathlib import Path
          bank=json.loads(Path('assets/data/guilu-content-topic-bank-v20260814.json').read_text(encoding='utf-8'))
          site='https://ts15825868.github.io/xianjiawei'
          ver='20260814-product-modal-media-v3'
          media={
            'guilu-gao':f'{site}/images/customer-display-v20260812/guilu-gao.avif?v={ver}',
            'guilu-drink-30':f'{site}/images/customer-display-v20260812/guilu-drink-30cc.avif?v={ver}',
            'guilu-drink-180':f'{site}/images/customer-display-v20260812/guilu-drink-180cc-product.jpg?v={ver}',
            'guilu-tangkuai':f'{site}/images/customer-display-v20260812/guilu-tangkuai.avif?v={ver}',
            'guilu-jiao':f'{site}/images/customer-display-v20260812/guilu-jiao.avif?v={ver}',
            'luerong-fen':f'{site}/images/customer-display-v20260812/luerong-fen.avif?v={ver}',
          }
          def q(v): return "'"+str(v or '').replace("'","''")+"'"
          def safe(v): return re.sub(r'[^a-z0-9-]+','-',str(v or '').strip().lower()).strip('-')
          rows=[]
          for t in bank.get('topics',[]):
              if t.get('seedToReview') is not True: continue
              pid=[x for x in (t.get('productIds') or []) if x]
              if t.get('imageMode')=='official_product' and len(pid)==1: url=media[pid[0]]; source=f'仙加味8/14目前正式產品圖:{pid[0]}'
              elif t.get('imageMode')=='official_trial': url=f'{site}/images/trial/trial-poster-small-boss-official-v20260814.jpg?v={ver}'; source='仙加味8/14目前正式試喝主圖'
              else: url=t.get('imageUrl',''); source=t.get('imageSource','仙加味正式素材')
              slug=safe(t.get('id')); post=f'XJW-GUILU-{slug}'
              platforms=json.dumps(t.get('platforms') or ['Facebook','Instagram'],ensure_ascii=False,separators=(',',':'))
              image_source=f'{source}|題庫:{slug}|{bank.get("version","")}|media:{ver}'
              rows.append("UPDATE social_posts SET title={title},headline={headline},copy={copy},category={cat},platforms_json={platforms},image_url={url},image_alt={alt},image_source={source},updated_at=CURRENT_TIMESTAMP WHERE id={id} AND status IN ('draft','pending_review');".format(
                  title=q(t.get('title')),headline=q(t.get('headline')),copy=q(t.get('copy')),cat=q(t.get('category') or '龜鹿知識'),platforms=q(platforms),url=q(url),alt=q(t.get('imageAlt') or t.get('title')),source=q(image_source),id=q(post)))
          Path('/tmp/guilu-sync-pending.sql').write_text('\n'.join(rows)+'\n',encoding='utf-8')
          print(f'prepared {len(rows)} pending/draft updates')
          PY
          npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/guilu-sync-pending.sql
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS stale_count FROM social_posts WHERE id LIKE 'XJW-GUILU-%' AND status IN ('draft','pending_review') AND (copy LIKE '%早上及下午各一小匙%' OR copy LIKE '%75g／盒、8塊裝%' OR copy LIKE '%600g（1斤）%' OR copy LIKE '%每塊約18.75g%')" > /tmp/guilu-audit.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/guilu-audit.json','utf8'));
          let count=null;
          const walk=x=>{if(count!==null)return;if(Array.isArray(x)){for(const v of x)walk(v)}else if(x&&typeof x==='object'){if(Object.prototype.hasOwnProperty.call(x,'stale_count'))count=Number(x.stale_count);else for(const v of Object.values(x))walk(v)}};
          walk(data);
          if(count!==0)throw new Error(`遠端待審核龜鹿貼文仍有 ${count} 筆退役規格／用法`);
          console.log('PASS: remote pending/draft guilu posts contain no retired spec or fixed-time copy.');
          NODE
          echo 'After sync:'
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT status,COUNT(*) AS count FROM social_posts WHERE id LIKE 'XJW-GUILU-%' GROUP BY status ORDER BY status"
      - name: Commit refreshed bank
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/guilu-content-topic-bank-v20260814.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(publishing): sync content bank with current guilu authority'
            git push origin HEAD:main
          fi
      - name: Deploy current publishing center
        run: npx wrangler deploy --keep-vars
      - name: Verify private publishing route
        shell: bash
        run: |
          set -euo pipefail
          base='https://xianjiawei-internal.tung314069.workers.dev'
          for path in '/publishing.html' '/'; do
            code="$(curl -sS --max-time 20 -o /tmp/xjw-route -w '%{http_code}' "$base$path" || true)"
            test "$code" != '000'
            test "$code" -lt 500
            echo "PASS: $path reachable with HTTP $code (Cloudflare Access may protect content)."
          done
