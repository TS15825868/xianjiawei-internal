name: 仙加味貼文圖片批次回填 20260923-2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/incoming/xjw_batch_next_5_20260923_jpg.zip'
      - 'ops/post-image-bindings-20260923-batch2.json'
      - '.github/workflows/apply-post-image-batch-20260923-2.yml'

permissions:
  contents: write

concurrency:
  group: xianjiawei-post-image-binding-20260923-2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Extract and validate batch
        run: |
          rm -rf /tmp/xjw-batch
          mkdir -p /tmp/xjw-batch assets/post-images/2026-09-23
          unzip -q ops/incoming/xjw_batch_next_5_20260923_jpg.zip -d /tmp/xjw-batch
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const m=JSON.parse(fs.readFileSync('ops/post-image-bindings-20260923-batch2.json','utf8'));
          if(!Array.isArray(m.items)||m.items.length!==5) throw new Error('manifest 必須剛好5篇');
          for(const x of m.items){
            if(Number(x.width)!==1254||Number(x.height)!==1254) throw new Error(x.postId+' 尺寸非1254x1254');
            const src=path.join('/tmp/xjw-batch',x.filename);
            if(!fs.existsSync(src)) throw new Error('缺少 '+x.filename);
            const stat=fs.statSync(src);
            if(stat.size<250000) throw new Error(x.filename+' 檔案過小，可能畫質不足');
            const dst=path.join('assets/post-images/2026-09-23',x.filename);
            fs.copyFileSync(src,dst);
          }
          console.log('PASS: 5 image files extracted at 1254x1254 manifest spec');
          NODE

      - name: Commit formal image files
        run: |
          if git diff --quiet -- assets/post-images/2026-09-23; then
            echo "No image file changes"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/post-images/2026-09-23
            git commit -m 'content: publish formal post image batch 20260923-2'
            git push
          fi

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Build safe D1 update SQL
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('ops/post-image-bindings-20260923-batch2.json','utf8'));
          const q=v=>"'" + String(v??'').replaceAll("'","''") + "'";
          const lines=[];
          for(const x of m.items){
            const url='https://raw.githubusercontent.com/TS15825868/xianjiawei-internal/main/assets/post-images/2026-09-23/'+x.filename;
            lines.push(`UPDATE social_posts SET image_url=${q(url)}, image_alt=${q(x.alt)}, image_source=${q('ChatGPT正式單張圖｜2026-09-23｜GitHub main｜人工待審核')}, image_width=${Number(x.width)}, image_height=${Number(x.height)}, image_bytes=${Number(x.bytes)}, image_quality_status='ok', image_approved=0, status='pending_review', approved_by=NULL, approved_at=NULL, scheduled_at=NULL, published_at=NULL, updated_at=datetime('now') WHERE id=${q(x.postId)} AND status='draft';`);
          }
          fs.writeFileSync('/tmp/apply-post-images.sql',lines.join('\n')+'\n');
          NODE

      - name: Apply bindings to formal D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/apply-post-images.sql

      - name: Verify 5 posts are pending review
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_url,image_width,image_height,image_bytes,image_quality_status,image_approved FROM social_posts WHERE id IN ('XJW-CONV-chat-deer-turtle-soup-choice','XJW-CONV-chat-elder-kitchen-habit','XJW-CONV-chat-family-old-object','XJW-CONV-chat-fixed-storage','XJW-CONV-chat-last-bowl') ORDER BY id" > /tmp/verify.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/verify.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          if(rows.length!==5) throw new Error('找不到完整5篇貼文');
          for(const r of rows){
            if(r.status!=='pending_review') throw new Error(r.id+' 未進入 pending_review');
            if(!String(r.image_url||'').includes('/assets/post-images/2026-09-23/')) throw new Error(r.id+' 圖片路徑不正確');
            if(Number(r.image_width)!==1254||Number(r.image_height)!==1254) throw new Error(r.id+' 圖片尺寸不正確');
            if(Number(r.image_bytes)<250000) throw new Error(r.id+' 圖片檔案過小');
            if(r.image_quality_status!=='ok') throw new Error(r.id+' 品質狀態非ok');
            if(Number(r.image_approved)!==0) throw new Error(r.id+' 不可自動核准');
          }
          console.log('PASS 5 posts pending_review');
          NODE

      - name: Rebuild production queue from remaining drafts
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,copy,category,image_alt,image_source FROM social_posts WHERE status='draft' ORDER BY id" > /tmp/active-drafts.json
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const raw=JSON.parse(fs.readFileSync('/tmp/active-drafts.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          const windowFor=(id='')=>{const s=String(id).toLowerCase();if(s.includes('cny-'))return'lunar_new_year_window';if(s.includes('year-end-'))return'year_end_window';if(s.includes('new-year-'))return'new_year_window';if(s.includes('weather-'))return'weather_dynamic';if(s.includes('season-'))return'cool_season_dynamic';return'evergreen'};
          const order={evergreen:0,weather_dynamic:1,cool_season_dynamic:2,year_end_window:3,new_year_window:4,lunar_new_year_window:5};
          const productKeys=['30cc','180cc','龜鹿膏','龜鹿湯塊','龜鹿膠','鹿茸粉'];
          rows.sort((a,b)=>(order[windowFor(a.id)]-order[windowFor(b.id)])||String(a.id).localeCompare(String(b.id)));
          const items=rows.map((r,index)=>{const txt=[r.title,r.copy,r.image_alt].filter(Boolean).join(' ');return{postId:r.id,imageId:`XJW-ACTIVE-IMG-${String(index+1).padStart(3,'0')}`,kind:r.category||'生活內容',title:r.title||'',products:productKeys.filter(x=>txt.includes(x)),scene:r.image_alt||'',imageSource:r.image_source||'',window:windowFor(r.id),status:'needs_unique_image',copyHash:crypto.createHash('sha256').update(r.copy||'').digest('hex').slice(0,16)}});
          const out={version:'2026-09-23-v6-live-after-image-batch',brand:'仙加味',source:'Cloudflare D1 live social_posts WHERE status=draft',total:items.length,status:'production-queue',rule:'只為live D1目前status=draft的有效貼文製作唯一正式圖片；柒玄茶暫停；產品只能正式實物原圖；完成後只回pending_review。',items};
          fs.writeFileSync('ops/post-image-production-queue-current.json',JSON.stringify(out,null,2)+'\n');
          console.log('remaining drafts',items.length);
          NODE

      - name: Commit rebuilt queue
        run: |
          if git diff --quiet -- ops/post-image-production-queue-current.json; then exit 0; fi
          git pull --rebase
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/post-image-production-queue-current.json
          git commit -m 'sync: remove completed batch 20260923-2 from image queue'
          git push
