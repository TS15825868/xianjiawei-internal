name: XJW one-time 8 criterion proof corrections (no approval)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recheck-8-ai-criteria-20261031.yml'
permissions:
  contents: read
concurrency:
  group: xjw-d1-ai-review-evidence-not-approval
  cancel-in-progress: false
jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Read eight exact pending posts, original AI proof, D1 link authority
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts WHERE id IN ('XJW-FEST-2027-eve-welcome-home','XJW-FEST-2027-lantern-riceballs','XJW-FEST-2027-newyear-breakfast','XJW-FEST-2027-spring-walk','XJW-CONV-weather-rain-chat','XJW-CONV-weather-cool-drink','XJW-CONV-chat-30-vs-180','XJW-CONV-chat-gao-vs-drink') ORDER BY id" > /tmp/criterion-before.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_post_quality_reviews WHERE id LIKE 'AI-PRECHECK-20261031-%'" > /tmp/criterion-original-reviews.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT post_id,uuid,metricool_id,state FROM social_metricool_sync WHERE post_id IN (SELECT id FROM social_posts WHERE id LIKE 'XJW-FEST-2027-%')" > /tmp/criterion-links.json
      - name: Check live version and prepare narrow updates
        run: node tools/complete-pending-ai-criteria-20261031.mjs prepare
      - name: Apply evidence corrections only; keep pending/unapproved
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/criterion-update.sql
      - name: Independently verify eight revised records and truthful audits
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts WHERE id IN ('XJW-FEST-2027-eve-welcome-home','XJW-FEST-2027-lantern-riceballs','XJW-FEST-2027-newyear-breakfast','XJW-FEST-2027-spring-walk','XJW-CONV-weather-rain-chat','XJW-CONV-weather-cool-drink','XJW-CONV-chat-30-vs-180','XJW-CONV-chat-gao-vs-drink') ORDER BY id" > /tmp/criterion-after.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_post_quality_reviews WHERE id LIKE 'AI-RECHECK-20261031-%' ORDER BY post_id" > /tmp/criterion-reviews-after.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM audit_logs WHERE action='AI16項預審證據補正' ORDER BY entity_id" > /tmp/criterion-audits-after.json
          node tools/complete-pending-ai-criteria-20261031.mjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xjw-8-ai-criteria-recheck-${{ github.run_id }}
          path: |
            /tmp/criterion-before.json
            /tmp/criterion-after.json
            /tmp/criterion-reviews-after.json
            /tmp/criterion-audits-after.json
            /tmp/criterion-proof.json
          retention-days: 3
