name: 仙加味五篇當前圖文動作與主題角度批次精準修復
on:
  push:
    branches: [main]
    paths: ['ops/request-five-editorial-visual-copy-deltas-20261108.json']
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node ops/apply-five-editorial-visual-deltas-20261108.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-editorial-fixes-${{ github.run_id }}
          path: five-editorial-visual-fixes.json
          retention-days: 7
