# 2026-08-17 final rerun after priority10 + remainder66 formal release
name: 仙加味貼文中心目前77篇匯出

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-live-posts-v20260816.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Export current D1 posts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audits
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,headline,copy,category,status,image_url,image_alt,image_source,review_note,rejection_reason,created_at,updated_at FROM social_posts WHERE status <> 'archived' ORDER BY created_at,id" > /tmp/posts.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/posts.json','utf8'));
          const rows=(Array.isArray(raw)?raw:[]).flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          const out={version:'2026-08-17-live-post-library-v4-final',generated_at_utc:new Date().toISOString(),total:rows.length,posts:rows};
          fs.writeFileSync('audits/live-posts-current.json',JSON.stringify(out,null,2)+'\n');
          fs.writeFileSync('audits/live-post-index-current.tsv', ['id\tstatus\tcategory\ttitle\theadline\timage_url',...rows.map(r=>[r.id,r.status,r.category,r.title,r.headline,r.image_url].map(v=>String(v||'').replace(/[\t\r\n]+/g,' ')).join('\t'))].join('\n')+'\n');
          console.log('exported',rows.length);
          if(rows.length<1)process.exit(2);
          NODE
      - name: Commit audit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audits/live-posts-current.json audits/live-post-index-current.tsv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(posts): snapshot current live post library'
          git pull --rebase origin main
          git push origin HEAD:main
