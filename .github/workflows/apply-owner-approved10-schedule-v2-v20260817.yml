name: 仙加味老闆確認10篇圖文排程v2
on:
  push:
    branches: [main]
    paths: ['assets/data/owner-approved10-schedule-v2-v20260817.trigger']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Build exact matched schedule SQL
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const b='https://ts15825868.github.io/xianjiawei/images/posts/priority10-v20260817/';
          const p=[
          ['XJW-GUILU-drink30-work-break','上班帶一罐，30cc不用把行程打亂','日常安排','XJW-GUILU-drink30-work-break.webp?v=20260817-owner10','上班行程已經夠滿，想把仙加味龜鹿飲安排進白天，不一定要多準備一堆東西。\n\n龜鹿飲30cc是小玻璃罐、裸罐無貼紙，體積小，工作告一段落時找個空檔就能依自己的節奏安排。龜鹿飲可以常溫飲用；想喝溫熱的，也可依當下情境再安排。\n\n上班帶一罐，不用把原本的行程打亂。\n\n仙加味｜補養，是一種節奏。','2026-08-18T11:30:00.000Z'],
          ['XJW-SOCIAL-20260815-03-storage-basics','星期天整理櫃子，也順便看看龜鹿還剩多少','整理一下','XJW-SOCIAL-20260815-03-storage-basics.webp?v=20260817-owner10','星期天在家整理櫃子時，也可以順手看看仙加味龜鹿系列還剩多少。\n\n把30cc小玻璃罐、180cc鋁袋、龜鹿膏與其他產品分好固定位置，開封與未開封分開，保存方式也一起確認。龜鹿膏未開封可放常溫陰涼處，開罐後記得冷藏。\n\n整理好，下次要用時也更順手。\n\n仙加味｜補養，是一種節奏。','2026-08-22T01:30:00.000Z'],
          ['XJW-SOCIAL-20260815-01-warm-drink-moment','辦公桌上的一杯溫熱飲，也可以有不同選擇','辦公室日常','XJW-SOCIAL-20260815-01-warm-drink-moment.webp?v=20260817-owner10','辦公桌旁想簡單安排一杯龜鹿飲，可以依今天的工作節奏選不同型態。\n\n仙加味龜鹿飲30cc是小玻璃裸罐，180cc是鋁袋包裝。龜鹿飲可以直接常溫飲用；如果當下比較喜歡溫熱，也可以依情境再溫熱安排。\n\n產品型態不同，重點是找到自己方便的方式。\n\n仙加味｜補養，是一種節奏。','2026-08-25T11:30:00.000Z'],
          ['XJW-GUILU-tangkuai-soup','今晚燉湯，把龜鹿湯塊安排進家常餐桌','料理搭配','XJW-GUILU-tangkuai-soup.webp?v=20260817-owner10','晚上準備家常燉湯時，可以把仙加味龜鹿湯塊一起安排進餐桌。\n\n龜鹿湯塊正式規格為75g／盒、8塊裝，正式產品是藍色盒裝。備料、下鍋、慢慢燉煮，再和家人一起上桌。產品圖照正式藍色盒實物呈現，不改包裝、不改比例。\n\n仙加味｜補養，是一種節奏。','2026-08-29T01:30:00.000Z'],
          ['XJW-GUILU-jiao-600g','週末有時間，再慢慢認識龜鹿膠這種型態','型態認識','XJW-GUILU-jiao-600g.webp?v=20260817-owner10','週末時間比較從容，可以慢慢把不同的龜鹿產品型態看清楚。\n\n仙加味龜鹿膠正式規格為600g／盒（1斤）、32塊裝，正式產品是紫色盒裝。先認識包裝、規格與自己的生活方式，再決定怎麼安排。產品圖照正式紫色盒實物呈現，不改包裝、不改比例。\n\n仙加味｜補養，是一種節奏。','2026-09-01T11:30:00.000Z'],
          ['XJW-SOCIAL-20260815-02-line-consult-and-trial','不知道怎麼選，先把你的日常告訴我們','LINE 諮詢','XJW-SOCIAL-20260815-02-line-consult-and-trial.webp?v=20260817-owner10','不知道先選哪一種仙加味龜鹿產品，可以先在LINE告訴我們：平常是在家還是外出、比較方便早上還是下午、想直接常溫飲用、依情境溫熱，還是想用在家常料理。\n\n先把生活說清楚，再慢慢看適合自己的產品型態。\n\n仙加味｜補養，是一種節奏。','2026-09-05T01:30:00.000Z'],
          ['XJW-GUILU-drink180-home','回到家，把180cc溫熱一下再慢慢喝','居家安排','XJW-GUILU-drink180-home.webp?v=20260817-owner10','一天忙完回到家，可以依自己的習慣安排仙加味龜鹿飲180cc鋁袋。\n\n龜鹿飲本來就可以常溫飲用；如果回家後比較喜歡溫熱的口感，也可以隔水加熱或依適合的方式溫熱後再慢慢喝。不是一定要加熱，而是照當下生活情境選擇。\n\n仙加味｜補養，是一種節奏。','2026-09-08T11:30:00.000Z'],
          ['XJW-GUILU-luerong-75g','下午想簡單一點，可以先認識鹿茸粉','產品認識','XJW-GUILU-luerong-75g.webp?v=20260817-owner10','下午工作告一段落，想先簡單認識不同產品，可以從產品標示開始看。\n\n仙加味鹿茸粉為75g／罐。先看清楚正式產品標示與包裝，再依自己的作息與生活方式安排。\n\n看懂產品，再安排進自己的生活。\n\n仙加味｜補養，是一種節奏。','2026-09-12T01:30:00.000Z'],
          ['XJW-GUILU-choose-by-place','今天在家，明天外出，產品型態不一定要選同一種','生活節奏','XJW-GUILU-choose-by-place.webp?v=20260817-owner10','同一個人的生活，也不會每天都一樣。\n\n今天在家，可以慢慢安排；明天外出，可能更需要方便攜帶。仙加味龜鹿系列有30cc小玻璃罐、180cc鋁袋、龜鹿膏、龜鹿湯塊、龜鹿膠等不同型態。龜鹿飲可以常溫直接飲用，也可依情境溫熱。\n\n先看今天的行程，再選適合自己的型態。\n\n仙加味｜補養，是一種節奏。','2026-09-15T11:30:00.000Z'],
          ['XJW-GUILU-gao-storage','龜鹿膏開罐後，順手放進冰箱','保存提醒','XJW-GUILU-gao-storage.webp?v=20260817-owner10','家裡開了一罐仙加味龜鹿膏，取用完後順手放回固定位置，下一次會更好找。\n\n龜鹿膏正式規格為100g／罐。未開封時放常溫陰涼處；開罐後記得冷藏。每天取用後把蓋子蓋好，再順手放回冰箱。\n\n仙加味｜補養，是一種節奏。','2026-09-19T01:30:00.000Z']];
          const q=x=>`'${String(x??'').replaceAll("'","''")}'`;
          const source='老闆2026-08-17上傳確認圖｜小老闆同款｜正式產品實物等比例｜包裝不改｜湯塊藍盒｜龜鹿膠紫盒';
          const sql=p.map(x=>`UPDATE social_posts SET title=${q(x[1])},headline=${q(x[1])},copy=${q(x[4])},category=${q(x[2])},image_url=${q(b+x[3])},image_alt=${q('仙加味小老闆｜'+x[1]+'｜老闆確認圖')},image_source=${q(source)},status='scheduled',image_approved=1,approved_by=NULL,approved_at=strftime('%Y-%m-%dT%H:%M:%fZ','now'),scheduled_at=${q(x[5])},review_note='老闆確認圖文匹配後排程；龜鹿飲可常溫或依情境溫熱；湯塊藍盒、龜鹿膠紫盒；實物等比例且包裝不改。',rejection_reason='',updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now') WHERE id=${q(x[0])} AND status<>'published';`).join('\n');
          fs.writeFileSync('/tmp/a.sql',sql+'\n');
          fs.writeFileSync('/tmp/e.json',JSON.stringify(p));
          NODE
      - name: Verify image URLs
        shell: bash
        run: |
          node - <<'NODE' >/tmp/u
          const p=JSON.parse(require('fs').readFileSync('/tmp/e.json')); const b='https://ts15825868.github.io/xianjiawei/images/posts/priority10-v20260817/'; for(const x of p) console.log(b+x[3]);
          NODE
          while IFS= read -r u; do curl -fsSL --retry 5 --retry-delay 2 -o /dev/null "$u"; done </tmp/u
      - name: Apply to production D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/a.sql
      - name: Verify production schedule
        shell: bash
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,copy,status,image_url,image_source,image_approved,scheduled_at FROM social_posts WHERE status='scheduled' ORDER BY scheduled_at,id" >/tmp/r.json
          node - <<'NODE'
          const raw=JSON.parse(require('fs').readFileSync('/tmp/r.json')); const rows=raw.flatMap(x=>x.results||[]); const e=JSON.parse(require('fs').readFileSync('/tmp/e.json')); const ids=new Set(e.map(x=>x[0])); const t=rows.filter(r=>ids.has(r.id)); if(t.length!==10) throw new Error(`owner10 ${t.length}/10`); for(const r of t){if(+r.image_approved!==1)throw new Error(r.id+' image'); if(!r.image_source.includes('老闆2026-08-17上傳確認圖'))throw new Error(r.id+' source');} for(const r of t.filter(r=>r.id.includes('drink')||r.id.includes('warm')||r.id.includes('choose')||r.id.includes('line-consult')))if(!r.copy.includes('常溫'))throw new Error(r.id+' roomtemp'); console.log('PASS owner10 scheduled 10/10'); for(const r of t)console.log(`${r.scheduled_at} | ${r.title}`);
          NODE
