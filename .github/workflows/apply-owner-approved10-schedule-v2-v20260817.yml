name: 仙加味新版10篇圖文取代舊貼文並排程

on:
  push:
    branches: [main]
    paths:
      - 'assets/data/owner-approved10-schedule-v2-v20260817.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install D1 tooling
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Fetch image-first 10-post authority manifest
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-delay 3 \
            "https://ts15825868.github.io/xianjiawei/images/posts/priority10-v20260817/manifest.json?v=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -o /tmp/priority10.json
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('/tmp/priority10.json','utf8'));
          if(m.count!==10 || m.posts?.length!==10) throw new Error(`manifest count ${m.count}/${m.posts?.length}`);
          if(!String(m.version||'').includes('image-first')) throw new Error(`wrong manifest ${m.version}`);
          const ids=m.posts.map(p=>p.id);
          if(new Set(ids).size!==10) throw new Error('duplicate ids');
          if(new Set(m.posts.map(p=>p.image_url)).size!==10) throw new Error('duplicate image urls');
          for(const p of m.posts){
            if(!p.copy?.includes('仙加味')) throw new Error(`${p.id}: brand missing`);
            if(!p.image_url?.includes('/images/posts/priority10-v20260817/')) throw new Error(`${p.id}: wrong image release`);
            if((p.title+p.copy+p.image_alt).includes('台興山產')) throw new Error(`${p.id}: blocked public name`);
          }
          const room=m.posts.filter(p=>/drink30|drink180|warm-drink|line-consult/.test(p.id));
          for(const p of room) if(!p.copy.includes('常溫')) throw new Error(`${p.id}: missing room-temperature rule`);
          const tang=m.posts.find(p=>p.id==='XJW-GUILU-tangkuai-soup');
          if(!tang?.copy.includes('藍色盒裝')) throw new Error('tangkuai blue box rule missing');
          const jiao=m.posts.find(p=>p.id==='XJW-GUILU-jiao-600g');
          if(!jiao?.copy.includes('紫色盒裝')) throw new Error('jiao purple box rule missing');
          console.log('PASS image-first manifest 10/10');
          NODE
          node - <<'NODE' >/tmp/image-urls.txt
          const m=JSON.parse(require('fs').readFileSync('/tmp/priority10.json','utf8'));
          for(const p of m.posts) console.log(p.image_url);
          NODE
          while IFS= read -r u; do curl -fsSL --retry 5 --retry-delay 2 -o /dev/null "$u"; done </tmp/image-urls.txt

      - name: Build replace-old-and-schedule SQL
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('/tmp/priority10.json','utf8'));
          const schedule={
            'XJW-GUILU-drink30-work-break':'2026-08-18T11:30:00.000Z',
            'XJW-SOCIAL-20260815-03-storage-basics':'2026-08-22T01:30:00.000Z',
            'XJW-SOCIAL-20260815-01-warm-drink-moment':'2026-08-25T11:30:00.000Z',
            'XJW-GUILU-tangkuai-soup':'2026-08-29T01:30:00.000Z',
            'XJW-GUILU-jiao-600g':'2026-09-01T11:30:00.000Z',
            'XJW-SOCIAL-20260815-02-line-consult-and-trial':'2026-09-05T01:30:00.000Z',
            'XJW-GUILU-drink180-home':'2026-09-08T11:30:00.000Z',
            'XJW-GUILU-luerong-75g':'2026-09-12T01:30:00.000Z',
            'XJW-GUILU-choose-by-place':'2026-09-15T11:30:00.000Z',
            'XJW-GUILU-gao-storage':'2026-09-19T01:30:00.000Z'
          };
          const q=v=>`'${String(v??'').replaceAll("'","''")}'`;
          const ids=m.posts.map(p=>q(p.id)).join(',');
          const sql=[];
          sql.push(`UPDATE social_posts SET status='archived', scheduled_at=NULL, image_approved=0, review_note='2026-08-17 使用者要求舊貼文從貼文中心移除；資料保留封存，不影響已發布歷史。', rejection_reason='已由新版10篇圖文取代', updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now') WHERE status<>'published' AND id NOT IN (${ids});`);
          for(const p of m.posts){
            const when=schedule[p.id];
            if(!when) throw new Error(`${p.id}: no schedule`);
            const title=String(p.title||'').replace(/\s*\n\s*/g,' ');
            const category=String(p.kicker||'仙加味｜生活情境').split('｜').pop()||'生活情境';
            sql.push(`UPDATE social_posts SET title=${q(title)}, headline=${q(title)}, copy=${q(p.copy)}, category=${q(category)}, image_url=${q(p.image_url)}, image_alt=${q(p.image_alt)}, image_source=${q(p.image_source)}, status='scheduled', image_approved=1, approved_by=NULL, approved_at=strftime('%Y-%m-%dT%H:%M:%fZ','now'), scheduled_at=${q(when)}, review_note='2026-08-17 使用者確認：這10張圖先以圖生成文案；圖文一對一；龜鹿飲可常溫或依情境溫熱；龜鹿湯塊藍盒、龜鹿膠紫盒。', rejection_reason='', updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now') WHERE id=${q(p.id)} AND status<>'published';`);
          }
          fs.writeFileSync('/tmp/apply.sql',sql.join('\n')+'\n');
          fs.writeFileSync('/tmp/expected.json',JSON.stringify({schedule,ids:m.posts.map(p=>p.id)}));
          console.log('PASS SQL built: archive old active + schedule exact 10');
          NODE

      - name: Apply to production D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/apply.sql

      - name: Verify production publishing center
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,copy,status,image_url,image_source,image_approved,scheduled_at FROM social_posts WHERE status<>'archived' ORDER BY scheduled_at,created_at,id" >/tmp/live.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/live.json','utf8'));
          const rows=raw.flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          const e=JSON.parse(fs.readFileSync('/tmp/expected.json','utf8'));
          const ids=new Set(e.ids);
          const activeNonPublished=rows.filter(r=>r.status!=='published');
          if(activeNonPublished.length!==10) throw new Error(`active nonpublished ${activeNonPublished.length}/10`);
          for(const r of activeNonPublished){
            if(!ids.has(r.id)) throw new Error(`old active post remains ${r.id}`);
            if(r.status!=='scheduled') throw new Error(`${r.id}: ${r.status}`);
            if(+r.image_approved!==1) throw new Error(`${r.id}: image not approved`);
            if(r.scheduled_at!==e.schedule[r.id]) throw new Error(`${r.id}: schedule mismatch ${r.scheduled_at}`);
          }
          console.log('PASS publishing center: only new 10 active nonpublished; all scheduled; old active posts archived; published history preserved');
          for(const r of activeNonPublished.sort((a,b)=>a.scheduled_at.localeCompare(b.scheduled_at))) console.log(`${r.scheduled_at} | ${r.title}`);
          NODE
