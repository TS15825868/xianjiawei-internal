name: 仙加味歷史委託審核保留（唯讀安全查核）
# Previously this workflow automatically changed pending_review to approved
# using an AI actor instead of the required authenticated human approval.
# The legacy tool is preserved solely as project history. This workflow
# intentionally cannot write D1, grant approval, schedule or publish content.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archived-review-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Inspect historical script without executing it
        run: |
          set -euo pipefail
          node --check tools/apply-owner-delegated-ai-review-20261011.cjs
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const history=fs.readFileSync('tools/apply-owner-delegated-ai-review-20261011.cjs','utf8');
          assert.ok(history.includes("chatgpt:owner-delegated-reviewed"));
          const workflow=fs.readFileSync('.github/workflows/owner-delegated-ai-review-20261011.yml','utf8');
          assert.ok(workflow.includes('workflow_dispatch:'));
          assert.ok(!/npx wrangler|node tools\/apply-owner-delegated-ai-review-20261011\.cjs (?:prepare|verify)|CLOUDFLARE_API_TOKEN|^  push:/m.test(workflow));
          console.log('PASS archived AI approval has no production write or automatic trigger');
          NODE
