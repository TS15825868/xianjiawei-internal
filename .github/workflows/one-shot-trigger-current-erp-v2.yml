name: 仙加味 ERP 目前權威驗收觸發

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-trigger-current-erp-v2.yml'

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Touch current readiness validator to trigger v2 on latest main
        shell: bash
        run: |
          set -euo pipefail
          printf '\n// 20260814 synced-ZIP mirror validation trigger; no runtime behavior.\n' >> tools/validate-system-readiness.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/validate-system-readiness.mjs
          git commit -m 'test(erp): rerun current authority after synced ZIP mirror'
          git pull --rebase origin main
          git push origin HEAD:main
