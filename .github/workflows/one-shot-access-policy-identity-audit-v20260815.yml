name: One-shot Access policy identity audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-access-policy-identity-audit-v20260815.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Inspect allowed Access identities
        shell: bash
        run: |
          set -euo pipefail
          app_id='010ecc73-3f19-49a4-9115-8b0f9c9e405c'
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps/$app_id/policies?per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/policies.json
          node - <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/policies.json','utf8'));
          if(body.success!==true) throw new Error('Cloudflare Access policy API failed');
          const policies=body.result||[];
          const emails=[];
          const domains=[];
          let everyone=false;
          for(const p of policies){
            if(p.decision==='deny') continue;
            for(const rule of [...(p.include||[]),...(p.require||[])]){
              if(rule?.email?.email) emails.push(String(rule.email.email).toLowerCase());
              if(rule?.email_domain?.domain) domains.push(String(rule.email_domain.domain).toLowerCase());
              if(rule?.everyone) everyone=true;
            }
          }
          console.log('ACCESS_ALLOWED_EMAILS='+JSON.stringify([...new Set(emails)]));
          console.log('ACCESS_ALLOWED_DOMAINS='+JSON.stringify([...new Set(domains)]));
          console.log('ACCESS_EVERYONE_RULE='+everyone);
          console.log('PASS: Access identity policy inspected.');
          NODE
