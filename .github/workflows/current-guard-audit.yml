name: 仙加味貼文中心目前權威驗收（手動）

# MAINTENANCE MODE：不在 push / PR 自動執行，不阻擋目前更新。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install without deployment
        run: npm install --ignore-scripts
      - name: Minimum syntax/static safety
        run: npm run check
      - name: Current authority full guard
        run: npm run guard:full
      - name: Verify maintenance mode remains nonblocking
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const mode=JSON.parse(fs.readFileSync('guard-mode.json','utf8'));
          if(mode.mode!=='paused_for_full_system_update'||mode.blocking_content_and_media_guards!==false||mode.keep_minimum_safety!==true) throw new Error('maintenance guard mode changed unexpectedly');
          console.log('PASS: blockers remain paused; updated full guard is available manually.');
          NODE
