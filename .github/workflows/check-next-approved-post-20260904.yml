name: 檢查下次正式貼文候選

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-next-approved-post-20260904.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 讀取可排程候選與審核狀態
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT id,title,status,scheduled_at,approved_at,image_approved,image_url FROM social_posts WHERE status IN ('approved','pending_review','draft','scheduled') ORDER BY CASE status WHEN 'approved' THEN 0 WHEN 'scheduled' THEN 1 WHEN 'pending_review' THEN 2 ELSE 3 END, datetime(updated_at) DESC LIMIT 20; SELECT g.post_id,g.copy_image_match,g.reviewed_at,g.content_fingerprint FROM social_post_review_gates g JOIN social_posts p ON p.id=g.post_id WHERE p.status IN ('approved','scheduled') ORDER BY datetime(g.reviewed_at) DESC LIMIT 20;"
      - name: 清理一次性檢查流程
        if: always()
        run: |
          set -euo pipefail
          rm -f .github/workflows/check-next-approved-post-20260904.yml
          git config user.name 'TS15825868'
          git config user.email 'tung314069@gmail.com'
          git add .github/workflows/check-next-approved-post-20260904.yml
          if ! git diff --cached --quiet; then
            git commit -m '移除下次正式貼文候選檢查流程'
            git push origin HEAD:main
          fi
