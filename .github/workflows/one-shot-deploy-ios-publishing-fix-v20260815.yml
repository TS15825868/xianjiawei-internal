name: One-shot deploy iOS Safari publishing stability fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-deploy-ios-publishing-fix-v20260815.yml'

permissions:
  contents: read

concurrency:
  group: xianjiawei-ios-publishing-fix
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install and validate
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run check
          npm run guard:full
          npm run build:static
      - name: Verify remote D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT 1 AS ok"
      - name: Deploy Worker
        run: npx wrangler deploy --keep-vars
      - name: Verify production route or Access boundary
        shell: bash
        run: |
          set -euo pipefail
          base='https://xianjiawei-internal.tung314069.workers.dev'
          for path in '/healthz/core' '/publishing.html'; do
            body="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$body" -w '%{http_code}' "$base$path" || true)"
            test "$code" != '000'
            test "$code" -lt 500
            if [ "$path" = '/publishing.html' ]; then
              if grep -q '貼文審核發佈系統' "$body"; then
                echo 'PASS: publishing page content is directly reachable.'
              else
                grep -Eiq '<html|<!doctype|cloudflare|access|sign in|login' "$body"
                echo 'PASS: publishing page is live behind Cloudflare Access.'
              fi
            fi
          done
