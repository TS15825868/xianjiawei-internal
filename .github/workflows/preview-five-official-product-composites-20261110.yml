name: 仙加味5篇不合格商品圖片正式原圖合成預覽
on:
  push:
    branches: [main]
    paths:
      - 'ops/request-five-official-photo-previews-20261110.json'
permissions:
  contents: write
concurrency:
  group: xianjiawei-image-composite-preview
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install free local image processing libraries
        run: python -m pip install -q pillow opencv-python-headless
      - name: Confirm source-bound preview pipeline
        run: python -m py_compile ops/preview-five-official-product-composites-20261110.py
      - name: Generate original photo composites without modifying D1
        run: python ops/preview-five-official-product-composites-20261110.py
      - name: Commit staged draft-only previews for visual assessment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/visual-previews/20261110-official-source-composite-v7/
          if git diff --cached --quiet; then echo 'No preview changes'; exit 0; fi
          git commit -m 'review: stage original-product scene composites for visual inspection only'
          for tries in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xjw-official-photo-previews-${{ github.run_id }}
          path: ops/visual-previews/20261110-official-source-composite/
          retention-days: 7
