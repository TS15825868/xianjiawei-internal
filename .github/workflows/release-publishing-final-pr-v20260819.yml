name: final publishing release verification 20260819

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/data/final-publishing-release-v20260819.trigger'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  release-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Validate current publishing code
        run: |
          npm run check
          npm run guard:full
          npm run build:static
      - name: Deploy current publishing Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --keep-vars | tee /tmp/wrangler-deploy.log
          grep -Eiq 'deployed|current version id|https://.*workers.dev' /tmp/wrangler-deploy.log
      - name: Verify exact official13 production D1 state after deployment
        shell: bash
        run: |
          set -euo pipefail
          IDS="'XJW-GUILU-drink30-work-break','XJW-GUILU-drink180-home','XJW-GUILU-gao-storage','XJW-GUILU-tangkuai-soup','XJW-GUILU-jiao-600g','XJW-GUILU-luerong-75g','XJW-SOCIAL-20260815-02-line-consult-and-trial','XJW-GUILU-choose-by-place','XJW-SOCIAL-20260815-03-storage-basics','XJW-SOCIAL-20260815-01-warm-drink-moment','POST-AUDIENCE-NEEDS','POST-TRIAL-MAIN','POST-BRAND-START'"
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,name,file_name,bytes,width,height,quality_status,approval_status FROM media_assets WHERE id LIKE 'IMG-OFFICIAL-%' ORDER BY id" > /tmp/media.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,status,image_url,image_approved,image_quality_status,media_id,platforms_json FROM social_posts WHERE id IN ($IDS) ORDER BY id" > /tmp/posts.json
          node - <<'NODE'
          const fs=require('fs');
          const rows=p=>{const x=JSON.parse(fs.readFileSync(p,'utf8'));return Array.isArray(x)&&x[0]?.results?x[0].results:(x?.results||x||[])};
          const media=rows('/tmp/media.json'),posts=rows('/tmp/posts.json');
          const expected={
            'XJW-GUILU-drink30-work-break':['IMG-OFFICIAL-01-WORK-30CC','pending_review'],
            'XJW-GUILU-drink180-home':['IMG-OFFICIAL-02-HOME-180CC','pending_review'],
            'XJW-GUILU-gao-storage':['IMG-OFFICIAL-03-GAO-STORAGE','pending_review'],
            'XJW-GUILU-tangkuai-soup':['IMG-OFFICIAL-04-TANGKUAI-SOUP','pending_review'],
            'XJW-GUILU-jiao-600g':['IMG-OFFICIAL-05-JIAO-600G','pending_review'],
            'XJW-GUILU-luerong-75g':['IMG-OFFICIAL-06-LURONG-75G','pending_review'],
            'XJW-SOCIAL-20260815-02-line-consult-and-trial':['IMG-OFFICIAL-07-LINE-CONSULT','pending_review'],
            'XJW-GUILU-choose-by-place':['IMG-OFFICIAL-08-HOME-OUT','pending_review'],
            'XJW-SOCIAL-20260815-03-storage-basics':['IMG-OFFICIAL-09-ORGANIZE-CABINET','pending_review'],
            'XJW-SOCIAL-20260815-01-warm-drink-moment':['IMG-OFFICIAL-10-OFFICE-WARM','pending_review'],
            'POST-AUDIENCE-NEEDS':['IMG-OFFICIAL-11-AUDIENCE-NEEDS','pending_review'],
            'POST-TRIAL-MAIN':['IMG-OFFICIAL-12-TRIAL','published'],
            'POST-BRAND-START':['IMG-OFFICIAL-13-BRAND-STORY','published']
          };
          const by=Object.fromEntries(posts.map(p=>[p.id,p]));
          const problems=[];
          for(const [id,[mediaId,status]] of Object.entries(expected)){
            const p=by[id];
            if(!p) problems.push(`${id}:missing`); else {
              if(p.media_id!==mediaId) problems.push(`${id}:media`);
              if(p.status!==status) problems.push(`${id}:status`);
              if(p.image_url!==`/media/${mediaId}`) problems.push(`${id}:url`);
              if(status==='published'&&Number(p.image_approved)!==1) problems.push(`${id}:published-approval`);
              if(status==='pending_review'&&Number(p.image_approved)!==0) problems.push(`${id}:pending-approval`);
              let platforms=[];try{platforms=JSON.parse(p.platforms_json||'[]')}catch{}
              if(!Array.isArray(platforms)||platforms.length===0)problems.push(`${id}:platforms`);
            }
          }
          if(media.length!==13) problems.push(`media-count:${media.length}`);
          if(posts.length!==13) problems.push(`post-count:${posts.length}`);
          for(const m of media){if(m.quality_status!=='good'||m.approval_status!=='approved'||Number(m.bytes)<=0)problems.push(`${m.id}:media-state`)}
          console.log('FINAL_RELEASE_D1='+JSON.stringify({media_count:media.length,post_count:posts.length,problems,posts,media}));
          if(problems.length)process.exit(2);
          NODE
      - name: Verify review, upload, scheduling and immediate-publish contracts exist in built release
        shell: bash
        run: |
          set -euo pipefail
          grep -q '16項完整圖文審核' dist/assets/js/publishing-review-gate.js
          grep -q 'data-publish-now-from-modal' dist/assets/js/publishing-app-v2.js
          grep -q '裝置上傳｜使用者人工指定' dist/assets/js/device-image-upload.js
          grep -q '立即發布不受固定時段限制' dist/assets/js/publishing-app-v2.js
          grep -q "body?.status==='scheduled'||body?.status==='published'" src/publishing-review-gate-entry.js
          grep -q "\['approved','scheduled'\].includes(before.status)" src/flexible-publish-entry.js
          grep -q "source_type','upload'" src/media-upload.js
          grep -q 'user_replacements_preserved' src/post-image-reconciler.js
          echo 'PASS: mobile upload, 16-review, schedule, immediate publish, and user-image preservation contracts are in deployed source.'
