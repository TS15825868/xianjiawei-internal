name: 仙加味 2026-09-24 待審核貼文圖實體巡檢

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-pending-review-images-20260924.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Export pending-review posts
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,image_url,image_alt,image_source,image_width,image_height,image_bytes,image_quality_status,image_approved,status FROM social_posts WHERE status='pending_review' ORDER BY id" > /tmp/pending.json
      - name: Collect repository image files
        run: |
          mkdir -p audit/pending-review-images/files
          cp /tmp/pending.json audit/pending-review-images/pending.json
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const raw=JSON.parse(fs.readFileSync('/tmp/pending.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          const base='https://raw.githubusercontent.com/TS15825868/xianjiawei-internal/main/';
          const report={total:rows.length,copied:[],missing:[],external:[]};
          for(const r of rows){
            const u=String(r.image_url||'').trim();
            if(u.startsWith(base)){
              const rel=decodeURIComponent(u.slice(base.length));
              if(!rel || rel==='undefined' || rel.includes('..') || !fs.existsSync(rel)){
                report.missing.push({id:r.id,title:r.title,image_url:u,repo_path:rel});
                continue;
              }
              const ext=path.extname(rel)||'.bin';
              const dst=path.join('audit/pending-review-images/files',r.id+ext);
              fs.copyFileSync(rel,dst);
              report.copied.push({id:r.id,title:r.title,image_url:u,repo_path:rel,file:path.basename(dst),alt:r.image_alt});
            }else{
              report.external.push({id:r.id,title:r.title,image_url:u});
            }
          }
          fs.writeFileSync('audit/pending-review-images/report.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pending-review-image-audit-${{ github.run_id }}
          path: audit/pending-review-images
          retention-days: 3
