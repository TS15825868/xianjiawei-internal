name: 仙加味貼文狀態與待審核母庫正式修復V2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-publishing-repair-v2-v20260815.yml'
permissions:
  contents: write
concurrency:
  group: xianjiawei-publishing-repair-v2
  cancel-in-progress: true
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      XJW_CONTENT_SEED_CREATED_BY: tung314069@gmail.com
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply current publishing authority
        run: node tools/apply-current-publishing-authority.mjs

      - name: Validate source and content bank
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const b=JSON.parse(fs.readFileSync('assets/data/guilu-content-topic-bank-v20260814.json','utf8'));const s=JSON.stringify(b);for(const x of ['早上及下午各一小匙','一般日常安排為早上及下午','75g／盒、8塊裝','600g（1斤）／盒','600g（1斤）大盒','每塊約18.75g','current-products-v3'])if(s.includes(x))throw Error('退役母庫內容:'+x);const t=Object.fromEntries(b.topics.map(x=>[x.id,x]));if(!t['soup-block-vs-jiao'].copy.includes('75g （2兩）／盒｜8塊裝，每塊約9.375g'))throw Error('湯塊母庫未更新');if(!t['soup-block-vs-jiao'].copy.includes('600g （1斤）／盒｜32塊裝，每塊約18.75 g'))throw Error('龜鹿膠母庫未更新');if(!t['gao-routine'].copy.includes('依個人使用習慣與作息時間安排'))throw Error('龜鹿膏用法未更新');const seeded=b.topics.filter(x=>x.seedToReview===true).length;if(seeded!==28)throw Error('seedToReview='+seeded);for(const x of b.topics.filter(x=>x.imageMode==='official_product')){if(!x.imageUrl.includes('/images/customer-display-v20260812/')||x.imageUrl.includes('/images/products-v3/'))throw Error('正式貼文圖錯誤:'+x.id)}console.log('PASS: current bank total='+b.topics.length+', seedToReview='+seeded);"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run check
          npm run guard:full
          npm run build:static
          XJW_CONTENT_SEED_CREATED_BY="$XJW_CONTENT_SEED_CREATED_BY" node tools/build-guilu-review-seed.mjs > /tmp/guilu-seed.sql
          grep -Fq "'pending_review'" /tmp/guilu-seed.sql
          grep -Fq 'ON CONFLICT(id) DO UPDATE SET' /tmp/guilu-seed.sql
          git diff --check

      - name: Preflight remote D1
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS row_count FROM social_posts; SELECT COUNT(*) AS orphan_created FROM social_posts p LEFT JOIN profiles x ON p.created_by=x.email WHERE p.created_by<>'' AND x.email IS NULL; SELECT COUNT(*) AS orphan_approved FROM social_posts p LEFT JOIN profiles x ON p.approved_by=x.email WHERE p.approved_by IS NOT NULL AND p.approved_by<>'' AND x.email IS NULL; SELECT sql AS table_sql FROM sqlite_master WHERE type='table' AND name='social_posts';" > /tmp/d1-preflight.json
          cat /tmp/d1-preflight.json
          node -e "const fs=require('fs'),d=JSON.parse(fs.readFileSync('/tmp/d1-preflight.json','utf8'));let rows=null,oc=null,oa=null,sql='';const w=x=>{if(Array.isArray(x))x.forEach(w);else if(x&&typeof x==='object'){if('row_count'in x)rows=+x.row_count;if('orphan_created'in x)oc=+x.orphan_created;if('orphan_approved'in x)oa=+x.orphan_approved;if('table_sql'in x)sql=String(x.table_sql||'');Object.values(x).forEach(w)}};w(d);if(!(rows>=1))throw Error('row_count='+rows);if(oc!==0||oa!==0)throw Error('orphan created='+oc+' approved='+oa);fs.writeFileSync('/tmp/d1-before-count.txt',String(rows));fs.writeFileSync('/tmp/d1-migration-needed.txt',sql.includes(\"'pending_review'\")&&sql.includes(\"'manual_required'\")&&sql.includes(\"'failed'\")?'0':'1');console.log('PASS preflight rows='+rows+' migrationNeeded='+fs.readFileSync('/tmp/d1-migration-needed.txt','utf8'));"

      - name: Stage remote D1 status migration
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat /tmp/d1-migration-needed.txt)" = "0" ]; then echo 'D1 status schema already current'; exit 0; fi
          npx wrangler d1 execute xianjiawei-internal-db --remote --file tools/social-post-status-stage-v20260815.sql
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT (SELECT COUNT(*) FROM social_posts) AS old_count,(SELECT COUNT(*) FROM social_posts_status_v2) AS staged_count;" > /tmp/d1-stage.json
          cat /tmp/d1-stage.json
          node -e "const fs=require('fs'),d=JSON.parse(fs.readFileSync('/tmp/d1-stage.json','utf8'));let o=null,s=null;const w=x=>{if(Array.isArray(x))x.forEach(w);else if(x&&typeof x==='object'){if('old_count'in x)o=+x.old_count;if('staged_count'in x)s=+x.staged_count;Object.values(x).forEach(w)}};w(d);if(o===null||o!==s)throw Error('stage mismatch old='+o+' staged='+s);console.log('PASS staging rows='+s);"
          npx wrangler d1 execute xianjiawei-internal-db --remote --file tools/social-post-status-swap-v20260815.sql

      - name: Verify migrated D1 and seed current review queue
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS row_count FROM social_posts; SELECT sql AS table_sql FROM sqlite_master WHERE type='table' AND name='social_posts'; PRAGMA foreign_key_check;" > /tmp/d1-after.json
          cat /tmp/d1-after.json
          node -e "const fs=require('fs'),d=JSON.parse(fs.readFileSync('/tmp/d1-after.json','utf8')),before=+fs.readFileSync('/tmp/d1-before-count.txt','utf8');let rows=null,sql='',fk=[];for(const b of d){for(const r of b.results||[]){if('row_count'in r)rows=+r.row_count;if('table_sql'in r)sql=String(r.table_sql||'');if('table'in r&&'rowid'in r)fk.push(r)}}if(rows!==before)throw Error('migration count before='+before+' after='+rows);for(const s of ['pending_review','manual_required','failed'])if(!sql.includes(\"'\"+s+\"'\"))throw Error('missing status '+s);if(fk.length)throw Error('foreign_key_check failed');console.log('PASS migrated schema preserved '+rows+' posts');"
          XJW_CONTENT_SEED_CREATED_BY="$XJW_CONTENT_SEED_CREATED_BY" node tools/build-guilu-review-seed.mjs > /tmp/guilu-seed.sql
          npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/guilu-seed.sql
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS guilu_count FROM social_posts WHERE instr(id,'XJW-GUILU-')=1; SELECT COUNT(*) AS guilu_pending FROM social_posts WHERE instr(id,'XJW-GUILU-')=1 AND status='pending_review'; SELECT COUNT(*) AS stale_count FROM social_posts WHERE instr(id,'XJW-GUILU-')=1 AND status IN ('draft','pending_review') AND (title LIKE '%75g／盒、8塊裝%' OR headline LIKE '%75g／盒、8塊裝%' OR copy LIKE '%75g／盒、8塊裝%' OR title LIKE '%600g（1斤）%' OR headline LIKE '%600g（1斤）%' OR copy LIKE '%600g（1斤）%' OR copy LIKE '%早上及下午各一小匙%' OR copy LIKE '%每塊約18.75g%'); SELECT COUNT(*) AS products_v3_live FROM social_posts WHERE instr(id,'XJW-GUILU-')=1 AND image_url LIKE '%/images/products-v3/%'; SELECT status,COUNT(*) AS count FROM social_posts GROUP BY status ORDER BY status;" > /tmp/d1-seed-audit.json
          cat /tmp/d1-seed-audit.json
          node -e "const fs=require('fs'),d=JSON.parse(fs.readFileSync('/tmp/d1-seed-audit.json','utf8'));let g=null,p=null,s=null,v=null;const w=x=>{if(Array.isArray(x))x.forEach(w);else if(x&&typeof x==='object'){if('guilu_count'in x)g=+x.guilu_count;if('guilu_pending'in x)p=+x.guilu_pending;if('stale_count'in x)s=+x.stale_count;if('products_v3_live'in x)v=+x.products_v3_live;Object.values(x).forEach(w)}};w(d);if(g!==28||p!==28||s!==0||v!==0)throw Error('audit guilu='+g+' pending='+p+' stale='+s+' productsV3='+v);console.log('PASS remote D1: 28 current guilu posts pending_review; stale=0; products-v3-live=0');"

      - name: Commit permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/worker.js src/publishing-review-gate-entry.js tools/build-guilu-review-seed.mjs package.json
          git add -f assets/data/guilu-content-topic-bank-v20260814.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix(publishing): support pending review and sync current guilu bank'
            git push origin HEAD:main
          fi

      - name: Deploy current Worker
        run: npx wrangler deploy --keep-vars

      - name: Verify production routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://xianjiawei-internal.tung314069.workers.dev'
          for path in '/healthz/core' '/publishing.html' '/'; do
            code="$(curl -sS --max-time 25 -o /tmp/xjw-route -w '%{http_code}' "$base$path" || true)"
            test "$code" != '000'
            test "$code" -lt 500
            echo "PASS: $path reachable with HTTP $code (Cloudflare Access may protect private content)."
          done
