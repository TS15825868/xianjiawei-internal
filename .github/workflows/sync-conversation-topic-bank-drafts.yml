name: 仙加味輕鬆互動題庫同步到貼文中心

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/data/social-conversation-topic-bank-current.json'
      - 'tools/build-conversation-draft-seed.mjs'
      - '.github/workflows/sync-conversation-topic-bank-drafts.yml'

permissions:
  contents: read

concurrency:
  group: xianjiawei-conversation-draft-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare D1 credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Validate current topic bank
        run: |
          node tools/validate-social-conversation-topic-bank.mjs
          node --check tools/build-conversation-draft-seed.mjs
      - name: Build safe draft SQL
        run: |
          node tools/build-conversation-draft-seed.mjs > /tmp/conversation-drafts.sql
          test -s /tmp/conversation-drafts.sql
          ! grep -q '柒玄茶\|龜鹿調飲粉' /tmp/conversation-drafts.sql
      - name: Sync drafts to remote D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/conversation-drafts.sql
      - name: Verify visible drafts and Threads coverage
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS active_count, SUM(CASE WHEN LOWER(platforms_json) LIKE '%threads%' THEN 1 ELSE 0 END) AS threads_count, SUM(CASE WHEN status<>'published' AND instr(copy,char(92)||'n')>0 THEN 1 ELSE 0 END) AS literal_newline_count FROM social_posts WHERE id LIKE 'XJW-CONV-%' AND status<>'archived';" > /tmp/verify.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/verify.json','utf8'));
          const row=(Array.isArray(data)?data[0]?.results:data?.results)?.[0];
          if(!row)throw Error('D1 驗證未回傳有效的資料列');
          const active=Number(row.active_count),threads=Number(row.threads_count),literal=Number(row.literal_newline_count);
          if(!Number.isSafeInteger(active)||active<40)throw Error('可見草稿不足或回傳不合法：'+row.active_count);
          if(!Number.isSafeInteger(threads)||threads!==active)throw Error('Threads 覆蓋不完整：threads='+threads+' active='+active);
          if(!Number.isSafeInteger(literal)||literal!==0)throw Error('D1仍有字面\\n：'+row.literal_newline_count);
          console.log('PASS conversation drafts='+active+', Threads='+threads+', literalNewlines='+literal);
          NODE
