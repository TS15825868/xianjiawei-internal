name: 仙加味輕鬆互動題庫同步到貼文中心

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/data/social-conversation-topic-bank-current.json'
      - 'tools/build-conversation-draft-seed.mjs'
      - '.github/workflows/sync-conversation-topic-bank-drafts.yml'

permissions:
  contents: read

concurrency:
  group: xianjiawei-conversation-draft-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare D1 credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Validate current topic bank
        run: |
          node tools/validate-social-conversation-topic-bank.mjs
          node --check tools/build-conversation-draft-seed.mjs
      - name: Build safe draft SQL
        run: |
          node tools/build-conversation-draft-seed.mjs > /tmp/conversation-drafts.sql
          test -s /tmp/conversation-drafts.sql
          ! grep -q '柒玄茶\|龜鹿調飲粉' /tmp/conversation-drafts.sql
      - name: Sync drafts to remote D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/conversation-drafts.sql
      - name: Verify visible drafts and Threads coverage
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT status,COUNT(*) AS count FROM social_posts WHERE id LIKE 'XJW-CONV-%' GROUP BY status ORDER BY status; SELECT COUNT(*) AS active_count FROM social_posts WHERE id LIKE 'XJW-CONV-%' AND status<>'archived'; SELECT COUNT(*) AS threads_count FROM social_posts WHERE id LIKE 'XJW-CONV-%' AND platforms_json LIKE '%Threads%';" > /tmp/verify.txt
          cat /tmp/verify.txt
          node - <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('/tmp/verify.txt','utf8');
          const values=[...text.matchAll(/"(active_count|threads_count)"\s*:\s*(\d+)/g)].reduce((m,x)=>(m[x[1]]=Number(x[2]),m),{});
          if(!values.active_count||values.active_count<40)throw new Error(`可見草稿不足，active_count=${values.active_count||0}`);
          if(values.threads_count!==values.active_count)throw new Error(`Threads 覆蓋不完整：threads=${values.threads_count||0} active=${values.active_count||0}`);
          console.log(`PASS visible conversation drafts=${values.active_count}, Threads=${values.threads_count}`);
          NODE
