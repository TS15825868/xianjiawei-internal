name: 仙加味 n8n 啟動依賴與 DI 版本唯讀診斷
on:
  push:
    branches: [main]
    paths: ['ops/request-n8n-dependency-graph-20261108.json', 'n8n-runtime/package.json']
permissions:
  contents: read
concurrency:
  group: xjw-n8n-dependency-only-20261108
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Install exact production n8n runtime dependencies on disposable runner, no DB credentials
        working-directory: n8n-runtime
        run: npm install --no-audit --no-fund --no-package-lock --ignore-scripts
      - name: Inspect resolved DI and database package locations without launching n8n
        run: node ops/inspect-n8n-dependency-graph-20261108.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n8n-dependency-di-${{ github.run_id }}
          path: n8n-dependency-di-report.json
          retention-days: 7
          if-no-files-found: warn
