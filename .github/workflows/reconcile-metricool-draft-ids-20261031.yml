name: XJW one-time safe reconciliation of 8 Metricool draft IDs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-metricool-draft-ids-20261031.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xjw-d1-metricool-id-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read latest D1 linked drafts and delivery attempts (no writes)
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT post_id,metricool_id,uuid,state,updated_at FROM social_metricool_sync ORDER BY post_id" > /tmp/xjw-metricool-links-before.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,published_at,scheduled_at,approved_by FROM social_posts WHERE id IN (SELECT post_id FROM social_metricool_sync)" > /tmp/xjw-metricool-posts-before.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT post_id,status,attempt_count,remote_id,published_at,last_attempt_at FROM social_publish_deliveries WHERE post_id IN (SELECT post_id FROM social_metricool_sync)" > /tmp/xjw-metricool-deliveries-before.json
      - name: Validate exact 8 UUID and observed draft receipts; prepare guarded D1 changes
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'))[0]?.results||[];
          const evidence=JSON.parse(fs.readFileSync('ops/metricool-id-reconciliation-20261031.json','utf8'));
          const targets=evidence.conflicts;
          const links=read('/tmp/xjw-metricool-links-before.json');
          const posts=read('/tmp/xjw-metricool-posts-before.json');
          const deliveries=read('/tmp/xjw-metricool-deliveries-before.json');
          if(targets.length!==8||new Set(targets.map(x=>x.uuid)).size!==8||new Set(targets.map(x=>x.post_id)).size!==8)
             throw Error('Expected exactly eight distinct UUIDs and posts');
          const q=s=>"'"+String(s??'').replaceAll("'","''")+"'";
          const statements=[],proof=[];
          for(const t of targets){
            if(t.observed_draft!==true||t.observed_auto_publish!==false||!Number.isSafeInteger(t.observed_metricool_id))
              throw Error('Missing externally checked draft-only evidence: '+t.post_id);
            const candidate=links.filter(x=>x.post_id===t.post_id);
            const existingUuid=links.filter(x=>x.uuid===t.uuid);
            if(candidate.length!==1||existingUuid.length!==1)throw Error('Non-unique D1 post link or UUID: '+t.post_id);
            const link=candidate[0],post=posts.find(x=>x.id===t.post_id);
            if(link.uuid!==t.uuid||Number(link.metricool_id)!==t.snapshot_metricool_id||link.state!=='pending_review')
              throw Error('Latest D1 link no longer matches original guarded evidence: '+t.post_id);
            if(!post||post.status!=='pending_review'||post.published_at||post.scheduled_at||post.approved_by)
              throw Error('D1 post no longer safely pending review: '+t.post_id);
            if(deliveries.some(x=>x.post_id===t.post_id&&(Number(x.attempt_count)>0||x.last_attempt_at||x.published_at||x.remote_id||['sending','retry','published','manual_required','permanent_failed'].includes(x.status))))
              throw Error('Prior delivery attempt exists: '+t.post_id);
            const auditId='AUD-XJW-METRICOOL-ID-20261031-'+crypto.createHash('sha256').update(t.post_id).digest('hex').slice(0,16);
            const beforeJson=JSON.stringify({metricool_id:t.snapshot_metricool_id,uuid:t.uuid,state:'pending_review',updated_at:link.updated_at});
            const afterJson=JSON.stringify({metricool_id:t.observed_metricool_id,uuid:t.uuid,state:'pending_review',source:'Metricool connected read-only connector, exact unique UUID, draft=true, autoPublish=false on 2026-10-31',approved:false,scheduled:false,published:false});
            statements.push("UPDATE social_metricool_sync SET metricool_id="+t.observed_metricool_id+",updated_at=datetime('now') WHERE post_id="+q(t.post_id)+" AND uuid="+q(t.uuid)+" AND metricool_id="+t.snapshot_metricool_id+" AND state='pending_review' AND COALESCE(updated_at,'')="+q(link.updated_at||'')+" AND EXISTS(SELECT 1 FROM social_posts WHERE id="+q(t.post_id)+" AND status='pending_review' AND approved_by IS NULL AND published_at IS NULL AND scheduled_at IS NULL) AND NOT EXISTS(SELECT 1 FROM social_publish_deliveries WHERE post_id="+q(t.post_id)+" AND (COALESCE(attempt_count,0)>0 OR last_attempt_at IS NOT NULL OR published_at IS NOT NULL OR TRIM(COALESCE(remote_id,''))<>'' OR status IN ('sending','retry','published','manual_required','permanent_failed')));");
            statements.push("INSERT INTO audit_logs(id,actor_email,action,entity_type,entity_id,before_json,after_json,ip) SELECT "+[auditId,'system:metricool-id-reconciliation','Metricool UUID 原草稿 ID 對帳修正','貼文',t.post_id,beforeJson,afterJson,''].map(q).join(',')+" WHERE changes()=1;");
            proof.push({post_id:t.post_id,uuid:t.uuid,old_metricool_id:t.snapshot_metricool_id,new_metricool_id:t.observed_metricool_id,audit_id:auditId});
          }
          fs.writeFileSync('/tmp/xjw-metricool-id-update.sql',statements.join('\n')+'\n');
          fs.writeFileSync('/tmp/xjw-metricool-id-proof.json',JSON.stringify(proof,null,2));
          console.log('PASS eight one-to-one pending-review Metricool UUID links; no publish or schedule paths');
          NODE
      - name: Apply D1 compare-and-swap updates and independent audit records
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/xjw-metricool-id-update.sql
      - name: Read back all eight repaired IDs and audit logs
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT post_id,metricool_id,uuid,state,updated_at FROM social_metricool_sync ORDER BY post_id" > /tmp/xjw-metricool-links-after.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,entity_id,actor_email,action,after_json FROM audit_logs WHERE action='Metricool UUID 原草稿 ID 對帳修正'" > /tmp/xjw-metricool-id-audit.json
          node - <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'))[0]?.results||[];
          const before=read('/tmp/xjw-metricool-links-before.json'),after=read('/tmp/xjw-metricool-links-after.json'),audit=read('/tmp/xjw-metricool-id-audit.json');
          const target=JSON.parse(fs.readFileSync('/tmp/xjw-metricool-id-proof.json','utf8')),ids=new Set(target.map(x=>x.post_id));
          if(before.length!==after.length||target.length!==8)throw Error('External link count changed');
          for(const row of before){
             const current=after.find(x=>x.post_id===row.post_id);
             if(!current)throw Error('Disappeared link: '+row.post_id);
             if(ids.has(row.post_id)){
               const t=target.find(x=>x.post_id===row.post_id),a=audit.find(x=>x.id===t.audit_id);
               if(!a||a.entity_id!==row.post_id||a.actor_email!=='system:metricool-id-reconciliation'||JSON.parse(a.after_json).metricool_id!==t.new_metricool_id)
                 throw Error('Missing truthful auditable ID correction: '+row.post_id);
               if(current.metricool_id!==t.new_metricool_id||current.uuid!==row.uuid||current.state!==row.state)
                 throw Error('Repaired link incorrect: '+row.post_id);
             }else if(JSON.stringify(current)!==JSON.stringify(row))throw Error('Unrelated link unexpectedly changed: '+row.post_id);
          }
          console.log('PASS 8/8 D1 linked Metricool IDs corrected with exact UUID, 8 audit records; no posts or images changed');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xjw-metricool-id-fix-evidence-${{ github.run_id }}
          path: |
            /tmp/xjw-metricool-links-before.json
            /tmp/xjw-metricool-links-after.json
            /tmp/xjw-metricool-posts-before.json
            /tmp/xjw-metricool-deliveries-before.json
            /tmp/xjw-metricool-id-proof.json
            /tmp/xjw-metricool-id-audit.json
          retention-days: 3
