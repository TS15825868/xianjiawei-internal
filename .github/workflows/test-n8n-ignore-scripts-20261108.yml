name: 仙加味 n8n 跳過安裝腳本與 CLI 啟動安全驗證
on:
  push:
    branches: [main]
    paths:
      - ops/request-n8n-ignore-scripts-ci-20261108.json
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      NODE_OPTIONS: "--max-old-space-size=384"
      npm_config_legacy_peer_deps: "true"
      npm_config_ignore_scripts: "true"
      npm_config_progress: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
      - name: Install isolated n8n without lifecycle scripts
        working-directory: n8n-runtime
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Verify singleton DI, isolated-vm and source-approved three monitors
        run: node ops/check-n8n-ignore-scripts-20261108.cjs
      - name: Verify actual n8n CLI loads and protected start script syntax
        shell: bash
        run: |
          set -euo pipefail
          sh -n n8n-runtime/start-low-memory.sh
          n8n-runtime/node_modules/.bin/n8n --version
          node n8n-runtime/verify-monitor-sources.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n8n-ignore-scripts-ci-${{ github.run_id }}
          path: n8n-ignore-scripts-ci-report.json
          if-no-files-found: warn
          retention-days: 7
