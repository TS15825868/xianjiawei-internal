name: 仙加味貼文分類整理 20260913

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-social-category-normalization-20260913.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Apply category normalization
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file ops/social-category-normalization-20260913.sql
      - name: Verify category and post invariants
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT category,COUNT(*) AS count FROM social_posts WHERE status='archived' GROUP BY category ORDER BY category" > categories.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT status,COUNT(*) AS count FROM social_posts GROUP BY status ORDER BY status" > counts.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS bad FROM social_posts WHERE status='archived' AND (image_url<>'' OR image_alt<>'' OR image_approved<>0 OR proposed_scheduled_at IS NOT NULL)" > archived-clean.json
          node - <<'NODE'
          const fs=require('fs');
          const rows=f=>{const d=JSON.parse(fs.readFileSync(f,'utf8'));return (Array.isArray(d)?d[0]?.results:d?.results)||[]};
          const counts=Object.fromEntries(rows('counts.json').map(r=>[r.status,Number(r.count)]));
          if(counts.published!==3||counts.pending_review!==2||counts.archived!==66) throw new Error(`貼文狀態異常 ${JSON.stringify(counts)}`);
          const cats=Object.fromEntries(rows('categories.json').map(r=>[r.category,Number(r.count)]));
          const expected={'生活情境':15,'產品知識':10,'使用方式':9,'怎麼選':6,'料理搭配':6,'保存整理':5,'LINE諮詢':4,'品牌故事':4,'試喝':4,'交期說明':3};
          if(JSON.stringify(cats)!==JSON.stringify(Object.fromEntries(Object.entries(expected).sort(([a],[b])=>a.localeCompare(b,'zh-Hant'))))) {
            const keys=Object.keys(expected);
            for(const k of keys) if(cats[k]!==expected[k]) throw new Error(`分類 ${k} 預期${expected[k]}，實際${cats[k]}`);
            if(Object.keys(cats).length!==keys.length) throw new Error(`有未預期分類 ${JSON.stringify(cats)}`);
          }
          if(Number(rows('archived-clean.json')[0]?.bad||0)!==0) throw new Error('封存貼文仍有舊圖或排程');
          console.log('PASS categories',cats,'statuses',counts);
          NODE
      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: social-category-normalization-${{ github.run_id }}
          path: |
            categories.json
            counts.json
            archived-clean.json
          retention-days: 7
