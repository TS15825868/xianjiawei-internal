name: 仙加味 2026-09-24 重複貼文圖清理
# trigger-v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-duplicate-post-images-20260924.yml'

permissions:
  contents: write

concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Clear known duplicated image bindings and return posts to draft
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "
          UPDATE social_posts
          SET image_url='',
              image_alt='',
              image_source='待重新製作唯一正式情境圖｜2026-09-24重複圖清理',
              image_width=0,
              image_height=0,
              image_bytes=0,
              image_quality_status='needs_unique_image',
              image_approved=0,
              status='draft',
              approved_by=NULL,
              approved_at=NULL,
              scheduled_at=NULL,
              published_at=NULL,
              updated_at=datetime('now')
          WHERE id IN (
            'XJW-CONV-chat-opening-prep',
            'XJW-CONV-chat-pantry-memory',
            'XJW-CONV-chat-picture-or-text',
            'XJW-CONV-chat-quiet-work'
          );"

      - name: Verify repaired posts are safe drafts
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "
          SELECT id,status,image_url,image_approved
          FROM social_posts
          WHERE id IN (
            'XJW-CONV-chat-opening-prep',
            'XJW-CONV-chat-pantry-memory',
            'XJW-CONV-chat-picture-or-text',
            'XJW-CONV-chat-quiet-work'
          )
          ORDER BY id" > /tmp/repaired.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/repaired.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          if(rows.length!==4) throw new Error('重複圖修復貼文數量不完整');
          for(const r of rows){
            if(r.status!=='draft') throw new Error(r.id+' 未回到draft');
            if(String(r.image_url||'').trim()) throw new Error(r.id+' 仍保留舊重複圖');
            if(Number(r.image_approved)!==0) throw new Error(r.id+' 圖片核准未重設');
          }
          console.log('PASS repaired duplicate bindings',rows.length);
          NODE

      - name: Verify no duplicate non-published image remains
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "
          SELECT image_url,COUNT(*) AS cnt,GROUP_CONCAT(id) AS ids
          FROM social_posts
          WHERE status<>'published'
            AND image_url IS NOT NULL
            AND TRIM(image_url)<>''
          GROUP BY image_url
          HAVING COUNT(*)>1" > /tmp/dupes.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/dupes.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          if(rows.length){
            console.error(rows);
            throw new Error('仍有未發布貼文重複使用同一張圖片');
          }
          console.log('PASS no duplicate non-published image_url');
          NODE

      - name: Verify formal statuses all have images
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "
          SELECT id,status
          FROM social_posts
          WHERE status IN ('pending_review','approved','scheduled')
            AND (image_url IS NULL OR TRIM(image_url)='')" > /tmp/missing.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/missing.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          if(rows.length){
            console.error(rows);
            throw new Error('正式流程仍有缺圖貼文');
          }
          console.log('PASS all formal non-published statuses have images');
          NODE

      - name: Rebuild current production queue from live D1
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,copy,category,image_alt,image_source FROM social_posts WHERE status='draft' ORDER BY id" > /tmp/active-drafts.json
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const raw=JSON.parse(fs.readFileSync('/tmp/active-drafts.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          const windowFor=(id='')=>{const s=String(id).toLowerCase();if(s.includes('cny-'))return'lunar_new_year_window';if(s.includes('year-end-'))return'year_end_window';if(s.includes('new-year-'))return'new_year_window';if(s.includes('weather-'))return'weather_dynamic';if(s.includes('season-'))return'cool_season_dynamic';return'evergreen'};
          const order={evergreen:0,weather_dynamic:1,cool_season_dynamic:2,year_end_window:3,new_year_window:4,lunar_new_year_window:5};
          const productKeys=['30cc','180cc','龜鹿膏','龜鹿湯塊','龜鹿膠','鹿茸粉'];
          const lock='正式Q版小朋友小男孩、同一位角色；短黑髮、大眼睛、圓潤幼童臉型、固定頭身比；米白中式上衣、深橄欖綠圍裙、胸前紅色直式仙加味印章；不得成熟化、少年化、成人化或像不同人；小鹿與小烏龜分開且相對尺寸固定。';
          rows.sort((a,b)=>(order[windowFor(a.id)]-order[windowFor(b.id)])||String(a.id).localeCompare(String(b.id)));
          const items=rows.map((r,index)=>{const txt=[r.title,r.copy,r.image_alt].filter(Boolean).join(' ');return{postId:r.id,imageId:`XJW-ACTIVE-IMG-${String(index+1).padStart(3,'0')}`,kind:r.category||'生活內容',title:r.title||'',products:productKeys.filter(x=>txt.includes(x)),scene:r.image_alt||'',imageSource:r.image_source||'',window:windowFor(r.id),status:'needs_unique_image',characterLock:lock,copyHash:crypto.createHash('sha256').update(r.copy||'').digest('hex').slice(0,16)}});
          const out={
            version:'2026-09-24-v9-live-after-duplicate-cleanup',
            brand:'仙加味',
            source:'Cloudflare D1 live social_posts WHERE status=draft',
            total:items.length,
            status:'production-queue',
            rule:'只處理live D1 status=draft；每篇唯一正式圖片；產品只用正式實物原圖；小老闆必須通過年齡／同一人鎖定；完成後回pending_review，人工視覺審核前不得發布。',
            characterLock:lock,
            items
          };
          fs.writeFileSync('ops/post-image-production-queue-current.json',JSON.stringify(out,null,2)+'\n');
          console.log('rebuilt drafts',items.length);
          NODE

      - name: Commit rebuilt queue safely
        run: |
          if git diff --quiet -- ops/post-image-production-queue-current.json; then exit 0; fi
          cp ops/post-image-production-queue-current.json /tmp/rebuilt-post-image-production-queue.json
          git checkout -- ops/post-image-production-queue-current.json
          git pull --rebase
          cp /tmp/rebuilt-post-image-production-queue.json ops/post-image-production-queue-current.json
          if git diff --quiet -- ops/post-image-production-queue-current.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/post-image-production-queue-current.json
          git commit -m 'fix: clear duplicate post images and rebuild queue'
          git push
