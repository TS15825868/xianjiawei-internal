name: 仙加味公開文案安全退回重審
on:
  push:
    branches: [main]
    paths: ['ops/post-copy-corrections/*.json']
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-copy-correction
  cancel-in-progress: false
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 2}
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Select exactly one correction
        run: |
          file="$(git diff --name-only HEAD^ HEAD -- 'ops/post-copy-corrections/' | head -1)"
          test -n "$file"
          test "$(git diff --name-only HEAD^ HEAD -- 'ops/post-copy-corrections/' | wc -l)" -eq 1
          echo "CORRECTION_FILE=$file" >> "$GITHUB_ENV"
      - name: Validate live lease and prepare one correction
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts ORDER BY id" > /tmp/post-copy-before.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_metricool_sync ORDER BY post_id" > /tmp/post-copy-links-before.json
          node tools/apply-post-copy-correction.cjs
      - name: Apply guarded pending-review rollback
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/post-copy-correction.sql
      - name: Verify only the requested post and mapping changed
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts ORDER BY id" > /tmp/post-copy-after.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_metricool_sync ORDER BY post_id" > /tmp/post-copy-links-after.json
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert/strict');
          const rows=p=>JSON.parse(fs.readFileSync(p))[0].results;
          const b=rows('/tmp/post-copy-before.json'),a=rows('/tmp/post-copy-after.json'),bl=rows('/tmp/post-copy-links-before.json'),al=rows('/tmp/post-copy-links-after.json');
          const result=JSON.parse(fs.readFileSync('/tmp/post-copy-result.json')),req=JSON.parse(fs.readFileSync(process.env.CORRECTION_FILE)).items[0];
          assert.equal(a.length,b.length); assert.equal(al.length,bl.length);
          const p=a.find(x=>x.id===result.post_id),m=al.find(x=>x.post_id===result.post_id);
          assert(p&&m); assert.equal(p.status,'pending_review'); assert.equal(p.copy,req.new_copy);
          assert.equal(p.approved_by,null); assert.equal(p.approved_at,null);
          assert.equal(Number(p.image_approved),0); assert.equal(p.scheduled_at,null);
          assert.equal(p.proposed_scheduled_at,null); assert.equal(p.published_at,null);
          assert.equal(m.uuid,result.uuid); assert.equal(String(m.metricool_id),String(result.metricool_id)); assert.equal(m.state,'pending_review'); assert.equal(m.content_fingerprint,result.new_fingerprint);
          for(const old of b.filter(x=>x.id!==result.post_id))assert.deepEqual(a.find(x=>x.id===old.id),old);
          for(const old of bl.filter(x=>x.post_id!==result.post_id))assert.deepEqual(al.find(x=>x.post_id===old.post_id),old);
          console.log('PASS exact post returned to pending_review with verified Metricool draft');
          console.log('NEW_FINGERPRINT='+result.new_fingerprint);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-copy-correction-${{ github.run_id }}
          path: |
            /tmp/post-copy-before.json
            /tmp/post-copy-after.json
            /tmp/post-copy-links-before.json
            /tmp/post-copy-links-after.json
            /tmp/post-copy-result.json
          retention-days: 7
