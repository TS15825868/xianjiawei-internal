name: 仙加味目前正式規格與守門整理

on:
  push:
    branches: [main]
    paths:
      - 'tools/normalize-current-publishing-authority-v20260815.mjs'
      - '.github/workflows/normalize-current-publishing-authority-v20260815.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Normalize current authority
        run: node tools/normalize-current-publishing-authority-v20260815.mjs
      - name: Validate changed source
        shell: bash
        run: |
          node --check assets/js/product-authority-guard.js
          node --check tools/validate-system-readiness.mjs
          node --check tools/validate-single-publishing-system.mjs
          ! grep -R -F '75g （2兩）／盒｜8塊裝' --exclude-dir=.git --exclude-dir=audits .
          ! grep -R -F '75g（2兩）／盒｜8塊裝' --exclude-dir=.git --exclude-dir=audits .
          grep -q 'products-v3只作產品身份、包裝與比例校正' publishing.html
      - name: Commit normalized authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(authority): normalize current specs and capability guards'
          git pull --rebase origin main
          git push origin HEAD:main
