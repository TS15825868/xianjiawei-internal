name: 仙加味已發試喝角度與既有Metricool草稿安全封存
on:
  push:
    branches: [main]
    paths: ['ops/request-trial-first-linked-draft-archive-20261107.json']
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  safe-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node ops/archive-trial-first-linked-draft-20261107.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trial-first-archive-${{ github.run_id }}
          path: trial-first-archive-result.json
          retention-days: 7
