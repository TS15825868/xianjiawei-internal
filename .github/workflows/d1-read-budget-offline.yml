name: D1 and social recovery offline regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-business-inquiries-d1.yml'
      - 'tools/verify-business-inquiry-d1-restore.py'
      - 'tools/test-verify-business-inquiry-d1-restore.py'
      - 'tools/capture-d1-live-table-inventory.mjs'
      - 'tools/capture-d1-live-table-inventory.test.mjs'
      - 'tools/test-b2b-migration-free-budget-gate.mjs'
      - 'tools/check-d1-free-budget-before-export.mjs'
      - 'tools/check-d1-free-budget-before-export.test.mjs'
      - 'tools/test-live-v2-post-image-sha.mjs'
      - 'ops/receipts/20261122-live-46-latest-review-version-delta.json'
      - 'ops/tests/test-d1-unattended-workflow-guards.mjs'
      - '.github/workflows/prepare-ai-delegated-publication-d1.yml'
      - '.github/workflows/prepare-line-handoff-d1.yml'
      - '.github/workflows/prepare-line-receipt-d1.yml'
      - '.github/workflows/ai-quality-rollout.yml'
      - '.github/workflows/metricool-free-evidence.yml'
      - '.github/workflows/sync-social-schedule-candidates.yml'
      - '.github/workflows/d1-read-budget-offline.yml'
  pull_request:
    paths:
      - 'tools/test-live-v2-post-image-sha.mjs'
      - 'ops/receipts/20261122-live-46-latest-review-version-delta.json'
      - 'tools/check-d1-free-budget-before-export.mjs'
      - 'tools/check-d1-free-budget-before-export.test.mjs'
      - 'tools/report-d1-expensive-queries.mjs'
      - '.github/workflows/prepare-business-inquiries-d1.yml'
      - 'tools/verify-business-inquiry-d1-restore.py'
      - 'tools/test-verify-business-inquiry-d1-restore.py'
      - 'tools/capture-d1-live-table-inventory.mjs'
      - 'tools/capture-d1-live-table-inventory.test.mjs'
      - 'tools/test-b2b-migration-free-budget-gate.mjs'
      - 'tools/report-d1-expensive-queries.test.mjs'
      - 'tools/audit-social-dedup-offline.mjs'
      - 'tools/audit-social-dedup-offline.test.mjs'
      - 'src/social-missed-post-recovery.js'
      - 'src/ai-operations-brain.js'
      - 'src/ai-operations-readiness.js'
      - 'tools/test-ai-operations-readiness.mjs'
      - 'tools/test-ai-operations-brain.mjs'
      - 'tools/test-social-missed-post-recovery.mjs'
      - 'ops/tests/test-d1-unattended-workflow-guards.mjs'
      - '.github/workflows/prepare-ai-delegated-publication-d1.yml'
      - '.github/workflows/prepare-line-handoff-d1.yml'
      - '.github/workflows/prepare-line-receipt-d1.yml'
      - '.github/workflows/ai-quality-rollout.yml'
      - '.github/workflows/metricool-free-evidence.yml'
      - '.github/workflows/sync-social-schedule-candidates.yml'
      - '.github/workflows/d1-read-budget-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check offline source syntax
        run: |
          node --check tools/report-d1-expensive-queries.mjs
          node --check tools/check-d1-free-budget-before-export.mjs
          node --check tools/capture-d1-live-table-inventory.mjs
          node --check tools/audit-social-dedup-offline.mjs
          node --check src/social-missed-post-recovery.js
          node --check src/ai-operations-brain.js
          node --check src/ai-operations-readiness.js
      - name: Run offline D1 and missed-post recovery regression
        run: node --test tools/report-d1-expensive-queries.test.mjs tools/test-social-missed-post-recovery.mjs tools/test-ai-operations-brain.mjs tools/audit-social-dedup-offline.test.mjs tools/test-ai-operations-readiness.mjs
      - name: Verify B2B migration budget gating and CRM safety (no production D1)
        run: node --test tools/test-b2b-migration-free-budget-gate.mjs tools/check-d1-free-budget-before-export.test.mjs tools/capture-d1-live-table-inventory.test.mjs edge/business-inquiries.test.mjs edge/business-inquiry-notification-management.test.mjs edge/business-inquiry-crm.test.mjs
      - name: Test isolated D1 SQL snapshot restore with existing and missing B2B schema
        run: python3 -m unittest tools/test-verify-business-inquiry-d1-restore.py
      - name: Guard unattended D1 schema and publishing workflows without network access
        run: node --test ops/tests/test-d1-unattended-workflow-guards.mjs
      - name: Verify two current v2 image bytes without D1 queries
        run: node --test tools/test-live-v2-post-image-sha.mjs
