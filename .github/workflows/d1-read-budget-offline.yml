name: D1 read-budget offline regression
on:
  pull_request:
    paths:
      - 'tools/report-d1-expensive-queries.mjs'
      - 'tools/report-d1-expensive-queries.test.mjs'
      - '.github/workflows/d1-read-budget-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check offline report syntax
        run: node --check tools/report-d1-expensive-queries.mjs
      - name: Run offline D1 read-budget regression
        run: node --test tools/report-d1-expensive-queries.test.mjs
