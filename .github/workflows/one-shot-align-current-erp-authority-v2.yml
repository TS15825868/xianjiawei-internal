name: 仙加味 ERP 目前權威 Runtime 一次性對齊 v2

# rerun-3: only commit formal runtime files; connector cleans temporary workflows after success
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-align-current-erp-authority-v2.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Align current runtime authority deterministically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_required(text,old,new,label):
              if old not in text:
                  raise SystemExit(f'missing target {label}: {old[:120]}')
              return text.replace(old,new,1)

          path=Path('src/publishing-review-gate-entry.js')
          text=path.read_text(encoding='utf-8')
          start=text.index('function productMatchErrors(row){')
          end=text.index('function checklistFrom',start)
          new_block="""const REVIEW_PRODUCT_NAMES=['龜鹿膏','龜鹿飲30cc','龜鹿飲180cc','龜鹿湯塊','龜鹿膠','鹿茸粉'];
          function reviewProductSegments(value,target){const source=String(value||''),segments=[];let start=0;while(target){const pos=source.indexOf(target,start);if(pos<0)break;let end=source.length,after=pos+target.length;for(const name of REVIEW_PRODUCT_NAMES){const next=source.indexOf(name,after);if(next>=0)end=Math.min(end,next)}segments.push(source.slice(pos,end));start=after}return segments}
          function productMatchErrors(row){const text=[row.title,row.headline,row.copy,row.category].filter(Boolean).join(' '),image=[row.image_url,row.image_alt,row.image_source].filter(Boolean).join(' '),combined=`${text} ${image}`,errors=[];for(const rule of PRODUCT_RULES){if(!rule.terms.some(term=>text.toLowerCase().includes(term.toLowerCase())))continue;if(image&&!rule.image.some(term=>image.toLowerCase().includes(term.toLowerCase())))errors.push(`文案提到「${rule.name}」，但圖片網址／說明／來源沒有對應產品資訊`)}if(/30\\s*cc/i.test(combined)&&/(玻璃瓶|小玻璃瓶|30\\s*cc\\s*／\\s*瓶|30\\s*cc\\s*瓶裝)/i.test(combined))errors.push('30cc正式名稱必須是小玻璃罐／30cc／罐，不得稱瓶');for(const segment of reviewProductSegments(combined,'龜鹿湯塊')){if(/(300\\s*g|600\\s*g)/i.test(segment))errors.push('龜鹿湯塊正式規格只有75g／盒｜8塊裝');if(/每塊約?\\s*9\\.375\\s*g/i.test(segment))errors.push('龜鹿湯塊每塊約9.375g只留產品詳細／內部資料，不放貼文主規格')}for(const segment of reviewProductSegments(combined,'龜鹿膠')){if(/每塊約?\\s*18\\.75\\s*g/i.test(segment))errors.push('龜鹿膠每塊約18.75g只留產品詳細／內部資料，不放貼文主規格')}for(const segment of reviewProductSegments(combined,'龜鹿膏')){if(/(一天一次一小匙|每日一次一小匙|早晚各一小匙)/.test(segment))errors.push('龜鹿膏目前正式使用方式為每日早上及下午各一小匙')}if(!clean(row?.image_url))errors.push('缺少圖片');if(!clean(row?.image_alt))errors.push('缺少圖片說明，無法完成圖文一致審核');if(clean(row?.image_quality_status)==='low')errors.push('圖片解析度不足');return[...new Set(errors)]}
          """
          path.write_text(text[:start]+new_block+text[end:],encoding='utf-8')

          path=Path('assets/js/post-regenerate-policy-v1.js')
          text=path.read_text(encoding='utf-8')
          pairs=[
            ("const VERSION='2026-08-10-single-system-generation-policy-v4-latest-originals';","const VERSION='2026-08-14-current-media-role-generation-policy-v5';"),
            ("const PRODUCT_IMAGE_VERSION='20260810-products-v3-latest-originals-v3';","const PRODUCT_IMAGE_VERSION='20260814-product-modal-media-v3';"),
            ("images/products-v3/guilu-gao.jpg","images/customer-display-v20260812/guilu-gao.avif"),
            ("images/products-v3/guilu-drink-30.jpg","images/customer-display-v20260812/guilu-drink-30cc.avif"),
            ("images/products-v3/guilu-drink-180.jpg","images/customer-display-v20260812/guilu-drink-180cc-product.jpg"),
            ("images/products-v3/guilu-tangkuai.jpg","images/customer-display-v20260812/guilu-tangkuai.avif"),
            ("images/products-v3/guilu-jiao.jpg","images/customer-display-v20260812/guilu-jiao.avif"),
            ("images/products-v3/luerong-fen.jpg","images/customer-display-v20260812/luerong-fen.avif"),
            ("- 產品只能使用下列 products-v3 最新正式實拍原圖，完整等比例呈現，不裁切、不拉寬、不拉高、不改標籤、不改包裝。","- 一般產品主題優先使用下列目前核准customer-display正式產品圖，完整等比例呈現，不裁切、不拉寬、不拉高、不改標籤、不改包裝；products-v3只作真實產品身份、包裝與比例校正參考。"),
            ("4. 龜鹿湯塊：75g／盒｜8塊裝｜每塊約9.375g。","4. 龜鹿湯塊：75g／盒｜8塊裝；每塊約9.375g只屬產品詳細／內部資料，不放貼文、產品圖或DM主規格。"),
            ("5. 龜鹿膠：600g（1斤）／盒｜32塊裝｜每塊約18.75g。","5. 龜鹿膠：600g（1斤）／盒｜32塊裝；每塊約18.75g只屬產品詳細／內部資料，不放貼文、產品圖或DM主規格。"),
            ("- 30cc：小玻璃裸罐、金色蓋、無貼紙、無外盒、無外袋；約Ø42×H51mm；不可叫瓶、不可放大成100g罐大小。","- 30cc：小玻璃裸罐、無貼紙；約Ø42×H51mm；不可叫瓶、不可改罐型或比例、不可放大成100g罐大小。"),
            ("只能使用products-v3最新正式實拍等比例融入同一場景","只能使用目前核准正式產品圖完整等比例融入同一場景；products-v3只作真實產品身份與比例校正參考"),
            ("需要產品時只能使用products-v3最新正式實拍完整等比例融入單一場景","需要產品時只能使用目前核准正式產品圖完整等比例融入單一場景；products-v3只作真實產品身份與比例校正參考")
          ]
          for i,(old,new) in enumerate(pairs,1): text=replace_required(text,old,new,f'regeneration-{i}')
          anchor='- 若目前無法安全讀取或合成正式實拍，寧可生成「不含產品本體」的完整場景並預留乾淨產品位置，也不得虛構產品。'
          text=replace_required(text,anchor,'- 明確「DM／詳細DM」主題才使用官網目前images/dm-final正式詳細DM；試喝主題固定使用images/trial/trial-poster-small-boss-official-v20260814.jpg。\\n'+anchor,'regeneration-media-role-note')
          text=replace_required(text,'- 文案提到產品、成分、規格、使用方式、價格或活動時必須使用目前正式版本，不可自行補資料。','- 龜鹿膏目前使用方式為「每日早上及下午各一小匙」，不得回退一天一次／早晚用法。\\n- 文案提到產品、成分、規格、使用方式、價格或活動時必須使用目前正式版本，不可自行補資料。','regeneration-usage-note')
          path.write_text(text,encoding='utf-8')

          path=Path('assets/js/formal-media-policy-v20260810.js')
          text=path.read_text(encoding='utf-8')
          pairs=[
            ('/images/dm-approved-v20260810/guilu-drink-180cc.webp','/images/dm-final/03_guilu-drink-180cc-dm.jpg'),
            ('/images/dm-approved-v20260810/guilu-tangkuai-75g.webp','/images/dm-final/05_guilu-tangkuai-75g-dm.jpg'),
            ('/images/dm-approved-v20260810/guilu-jiao-600g.webp','/images/dm-final/06_guilu-jiao-600g-dm.jpg'),
            ('/images/dm-approved-v20260810/lurong-fen-75g.webp','/images/dm-final/04_luerong-fen-75g-dm.jpg'),
            ("actualProductReference:'products-v3'","actualProductReference:'products-v3-identity-and-scale-reference-only',customerProductImageReference:'customer-display-v20260812'"),
            ("productGenerationRule:'must preserve products-v3 actual product appearance'","productGenerationRule:'must preserve current customer product display and verify identity/scale against products-v3; never redraw product'")
          ]
          for i,(old,new) in enumerate(pairs,1): text=replace_required(text,old,new,f'media-{i}')
          path.write_text(text,encoding='utf-8')

          path=Path('config/official-products.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          data['version']='20260814-full-erp-current-authority-v4'
          byid={p['id']:p for p in data.get('products',[])}
          byid['guilu-drink-180']['spec']='180cc／包（鋁袋）'
          data.setdefault('visualLocks',{})['guiluDrink30']='小玻璃裸罐、無貼紙；高矮胖瘦照正式原圖，不改罐型與比例，不得稱瓶'
          data['mediaRoles']={'product':'官網目前六張customer-display正式顧客產品圖','dm':'官網目前images/dm-final六張高解析正式詳細DM','trial':'images/trial/trial-poster-small-boss-official-v20260814.jpg','identityReference':'images/products-v3/真實產品身份、包裝與比例校正參考','rule':'一般產品圖、詳細DM、試喝海報與products-v3身份參考四種角色分離，不得互相取代；產品本體不得AI重畫或變形'}
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Require current checks, full guard and static build
        run: |
          npm run check
          npm run guard:full
          npm run build:static

      - name: Commit validated current runtime files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/publishing-review-gate-entry.js assets/js/post-regenerate-policy-v1.js assets/js/formal-media-policy-v20260810.js config/official-products.json
          git commit -m 'fix(erp): align review regeneration and media runtime to current authority'
          git pull --rebase origin main
          git push origin HEAD:main
