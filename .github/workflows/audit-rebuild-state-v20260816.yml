name: 仙加味77篇重製後正式D1稽核

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-rebuild-state-v20260816.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Query production D1
        shell: bash
        run: |
          set -euo pipefail
          db='xianjiawei-internal-db'
          npx wrangler d1 execute "$db" --remote --json --command "SELECT status,COUNT(*) AS n FROM social_posts WHERE status<>'archived' GROUP BY status ORDER BY status" > /tmp/status.json
          npx wrangler d1 execute "$db" --remote --json --command "SELECT COUNT(*) AS total, SUM(CASE WHEN instr(image_url,'/rebuild-v20260816/')>0 THEN 1 ELSE 0 END) AS rebuilt, SUM(CASE WHEN instr(image_url,id)>0 THEN 1 ELSE 0 END) AS id_matched, SUM(CASE WHEN trim(COALESCE(image_url,''))='' THEN 1 ELSE 0 END) AS missing_image, SUM(CASE WHEN instr(COALESCE(title,'')||COALESCE(headline,'')||COALESCE(copy,'')||COALESCE(image_alt,''),'台興山產')>0 THEN 1 ELSE 0 END) AS blocked_name, SUM(CASE WHEN instr(image_url,'smallboss-v20260815')>0 OR instr(image_url,'approved-v405')>0 OR instr(image_url,'generated-v20260815')>0 THEN 1 ELSE 0 END) AS old_visual, SUM(CASE WHEN instr(COALESCE(image_source,''),'使用者核准2D Q版小老闆')>0 THEN 1 ELSE 0 END) AS reference_locked FROM social_posts WHERE status<>'archived'" > /tmp/core.json
          npx wrangler d1 execute "$db" --remote --json --command "SELECT COUNT(*) AS duplicate_copy_posts FROM social_posts p WHERE status<>'archived' AND EXISTS (SELECT 1 FROM social_posts q WHERE q.status<>'archived' AND q.id<>p.id AND trim(COALESCE(q.copy,''))=trim(COALESCE(p.copy,'')))" > /tmp/copy.json
          npx wrangler d1 execute "$db" --remote --json --command "SELECT COUNT(*) AS duplicate_image_posts FROM social_posts p WHERE status<>'archived' AND EXISTS (SELECT 1 FROM social_posts q WHERE q.status<>'archived' AND q.id<>p.id AND trim(COALESCE(q.image_url,''))=trim(COALESCE(p.image_url,'')))" > /tmp/image.json
          node - <<'NODE'
          const fs=require('fs');
          const rows=p=>{const x=JSON.parse(fs.readFileSync(p,'utf8'));return x.flatMap(r=>r.results||[])};
          const statusRows=rows('/tmp/status.json');
          const core=rows('/tmp/core.json')[0]||{};
          const copy=rows('/tmp/copy.json')[0]||{};
          const image=rows('/tmp/image.json')[0]||{};
          const out={version:'2026-08-16-post-rebuild-d1-audit-v3',generated_at_utc:new Date().toISOString(),status_counts:Object.fromEntries(statusRows.map(r=>[r.status,Number(r.n)])),total:Number(core.total||0),rebuilt:Number(core.rebuilt||0),id_matched:Number(core.id_matched||0),missing_image:Number(core.missing_image||0),blocked_name:Number(core.blocked_name||0),old_visual:Number(core.old_visual||0),duplicate_copy_posts:Number(copy.duplicate_copy_posts||0),duplicate_image_posts:Number(image.duplicate_image_posts||0),reference_locked:Number(core.reference_locked||0)};
          fs.mkdirSync('audits',{recursive:true});
          fs.writeFileSync('audits/post-rebuild-d1-current.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out));
          NODE
      - name: Commit audit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audits/post-rebuild-d1-current.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(posts): record current rebuilt D1 counts'
          git pull --rebase origin main
          git push origin HEAD:main
