name: 仙加味 ERP Cloudflare 憑證狀態一次性檢查

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-cloudflare-secret-presence-v20260815.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Record secret presence without exposing values
        shell: bash
        run: |
          set -euo pipefail
          token='missing'; account='missing'
          test -n "$CLOUDFLARE_API_TOKEN" && token='present'
          test -n "$CLOUDFLARE_ACCOUNT_ID" && account='present'
          ready=false
          if [ "$token" = present ] && [ "$account" = present ]; then ready=true; fi
          cat > cloudflare-secret-presence-current.json <<EOF
          {
            "checked_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "CLOUDFLARE_API_TOKEN": "$token",
            "CLOUDFLARE_ACCOUNT_ID": "$account",
            "ready_for_production_deploy": $ready
          }
          EOF
          echo "CLOUDFLARE_API_TOKEN=$token"
          echo "CLOUDFLARE_ACCOUNT_ID=$account"
          echo "ready_for_production_deploy=$ready"
      - name: Commit status and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-secret-presence-current.json
          git rm .github/workflows/one-shot-cloudflare-secret-presence-v20260815.yml
          git diff --cached --check
          git commit -m 'chore(erp): record current Cloudflare secret presence'
          git pull --rebase origin main
          git push origin HEAD:main
