name: One-shot deploy 仙加味貼文中心系統 App

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-deploy-publishing-center-app-v20260815.yml'

permissions:
  contents: read

concurrency:
  group: xianjiawei-publishing-center-cutover
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Validate posting center app
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run check
          npm run guard:full
          npm run build:static
          test -f dist/publishing.html
          test -f dist/manifest.webmanifest
          test -f dist/assets/css/publishing-base.css
          test ! -e dist/assets/js/internal-app.js
          test ! -e dist/assets/js/erp-publishing-separation.js
          grep -q '貼文中心系統 App' dist/publishing.html
      - name: Verify Remote D1 and preserve posting data
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT 1 AS ok"
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT status, COUNT(*) AS count FROM social_posts GROUP BY status ORDER BY status"
      - name: Deploy posting center Worker
        run: npx wrangler deploy --keep-vars
      - name: Verify production route or private Access boundary
        shell: bash
        run: |
          set -euo pipefail
          base='https://xianjiawei-internal.tung314069.workers.dev'
          for path in '/healthz/core' '/publishing.html' '/'; do
            body="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$body" -w '%{http_code}' "$base$path" || true)"
            test "$code" != '000'
            test "$code" -lt 500
            if grep -q '貼文中心系統 App' "$body"; then
              echo "PASS: $path serves posting center content."
            else
              grep -Eiq '<html|<!doctype|cloudflare|access|sign in|login|貼文中心|publishing' "$body"
              echo "PASS: $path is live behind the expected private Access boundary or redirect."
            fi
          done
