name: 仙加味失效歷史媒體第一方來源增量還原（不發布）
on:
  push:
    branches: [main]
    paths:
      - 'ops/request-historical-firstparty-media-delta-20261111.json'
permissions:
  contents: write
concurrency:
  group: xianjiawei-historical-firstparty-delta-20261111
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install free local image comparison libraries
        run: python -m pip install -q pillow requests
      - name: Validate image-source integrity and download only three previously unavailable published images
        run: |
          python -m py_compile ops/recover-historical-firstparty-delta-20261111.py
          python ops/recover-historical-firstparty-delta-20261111.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('ops/receipts/20261111-firstparty-historical-media-recovery.json').read_text())
          assert r['pendingCompared']==49 and r['sourceRequests']==3 and len(r['results'])==3
          assert r['D1Writes']==r['aiApprovals']==r['humanApprovals']==r['schedules']==r['publications']==0
          assert r['fullHistoryCleared'] is False
          print('Read-only signed-media source check completed:',r['sourceReachable'],'retrieved /',r['failedSources'],'unavailable')
          PY
      - name: Preserve exact first-party published image bytes and bounded evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'xianjiawei-safe-audit-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/receipts/20261111-firstparty-historical-media-recovery.json
          if test -d assets/historical-published; then
            git add assets/historical-published/instagram/2026-11-11-recovery/ assets/historical-published/facebook/2026-11-11-recovery/ --ignore-errors
          fi
          git commit -m 'audit: store 2026-11-11 first-party historical media and per-image dHash evidence'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xjw-current-published-history-delta-${{ github.run_id }}
          path: ops/receipts/20261111-firstparty-historical-media-recovery.json
          retention-days: 7
