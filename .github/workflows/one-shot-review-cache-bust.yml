name: 仙加味貼文審核快取一次性整理

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-review-cache-bust.yml'

permissions:
  contents: write

jobs:
  refresh-review-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Update review gate cache identity
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('publishing.html')
          text=p.read_text(encoding='utf-8')
          old='publishing-review-gate.js?v=20260812-formal-image-fix-v3'
          new='publishing-review-gate.js?v=20260814-review-flow-v2'
          if old not in text: raise SystemExit('找不到舊審核JS快取識別')
          text=text.replace(old,new)
          text=text.replace('content-upgrade-20260814-v1','review-flow-20260814-v2')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Validate and build current publishing UI
        run: |
          npm run check
          npm run build:static
          grep -q 'publishing-review-gate.js?v=20260814-review-flow-v2' dist/publishing.html
          grep -q 'draftToPendingReview:true' dist/assets/js/publishing-review-gate.js
          grep -q 'directDraftApproval:false' dist/assets/js/publishing-review-gate.js
          echo 'PASS: 新版送審與16項審核攔截層已進正式dist並使用新快取識別。'
      - name: Commit cache identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publishing.html
          git commit -m 'fix(publishing): refresh review gate client cache'
          git push origin HEAD:main
