name: 仙加味收假背包泛生活稿安全退件封存
on:
  push:
    branches: [main]
    paths: ['ops/request-one-generic-holiday-bag-20261109.json']
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Preflight exact-source D1 archive
        run: node --check ops/archive-one-generic-holiday-bag-20261109.mjs
      - name: Archive one visually compared holiday bag weak-brand lifestyle post and read back D1
        run: node ops/archive-one-generic-holiday-bag-20261109.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-generic-holiday-bag-${{ github.run_id }}
          path: one-generic-holiday-bag-readback.json
          if-no-files-found: warn
          retention-days: 7
