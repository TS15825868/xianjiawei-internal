name: 修正 Instagram 正式橋接備援並重試首篇

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-instagram-webhook-fallback-20260904.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: 5e85d589-9c4f-412e-9ccd-585a5b6ecabe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 套用 Instagram 正式橋接備援
        run: python tools/patch-social-instagram-webhook-fallback-20260904.py
      - name: 檢查並部署 Worker
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build:static
          npx wrangler deploy --keep-vars
      - name: 只重置 Instagram 首篇失敗紀錄
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query"
          sql="DELETE FROM social_publish_deliveries WHERE post_id='XJW-SOCIAL-20260904-0900-FIRST' AND platform='Instagram'; UPDATE social_posts SET status='scheduled', published_at=NULL, scheduled_at='2026-09-04T01:00:00.000Z', updated_at=datetime('now') WHERE id='XJW-SOCIAL-20260904-0900-FIRST';"
          curl -fsS "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')" | jq .
      - name: 提交正式修正並清理臨時檔
        shell: bash
        run: |
          set -e
          rm -f .github/workflows/fix-instagram-webhook-fallback-20260904.yml tools/patch-social-instagram-webhook-fallback-20260904.py .github/workflows/diag-social-delivery-20260904b.yml
          git config user.name 'TS15825868'
          git config user.email 'tung314069@gmail.com'
          git add src/social-publisher.js .github/workflows/fix-instagram-webhook-fallback-20260904.yml tools/patch-social-instagram-webhook-fallback-20260904.py .github/workflows/diag-social-delivery-20260904b.yml
          git commit -m '啟用 Instagram 正式發布橋接備援'
          git push origin HEAD:main
      - name: 等待 Cron 並驗證 Facebook 與 Instagram 實際發布
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query"
          query(){
            curl -fsS "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data "$(jq -cn --arg sql "$1" '{sql:$sql}')"
          }
          sql="SELECT id,status,published_at,updated_at FROM social_posts WHERE id='XJW-SOCIAL-20260904-0900-FIRST'; SELECT post_id,platform,status,remote_id,attempt_count,last_attempt_at,published_at,error_text FROM social_publish_deliveries WHERE post_id='XJW-SOCIAL-20260904-0900-FIRST' ORDER BY platform;"
          for attempt in $(seq 1 14); do
            echo "=== verification attempt ${attempt} ==="
            out="$(query "$sql")"
            echo "$out" | jq .
            ig_status="$(echo "$out" | jq -r '[.result[]?.results[]? | select(.platform=="Instagram") | .status][0] // "missing"')"
            fb_status="$(echo "$out" | jq -r '[.result[]?.results[]? | select(.platform=="Facebook") | .status][0] // "missing"')"
            if [ "$fb_status" = "published" ] && [ "$ig_status" = "published" ]; then
              echo 'Facebook and Instagram are both published.'
              exit 0
            fi
            sleep 30
          done
          echo 'Instagram did not reach published status within the verification window.' >&2
          exit 1
