name: 仙加味現版68篇跨封存與已發布原圖感知去重唯讀驗證
on:
  push:
    branches: [main]
    paths: ['ops/request-current-vs-archived-image-visual-audit-20261108.json']
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet --disable-pip-version-check Pillow==11.3.0
      - name: Compare actual current pending scene images to archived, published and verified historic originals
        run: python ops/current-vs-archived-visual-audit-20261108.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xjw-pending-vs-archive-visual-${{ github.run_id }}
          path: current-vs-archived-visual-report.json
          retention-days: 7
          if-no-files-found: warn
