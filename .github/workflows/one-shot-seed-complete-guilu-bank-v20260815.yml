name: 仙加味龜鹿40題一次性完整進內容中心

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-seed-complete-guilu-bank-v20260815.yml'

permissions:
  contents: write

concurrency:
  group: xianjiawei-guilu-complete-bank-20260815
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      XJW_CONTENT_SEED_CREATED_BY: tung314069@gmail.com
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require production D1 credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Validate source and build both seeds
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run check
          npm run guard:full
          XJW_CONTENT_SEED_CREATED_BY="$XJW_CONTENT_SEED_CREATED_BY" node tools/build-guilu-review-seed.mjs > /tmp/review.sql
          XJW_CONTENT_SEED_CREATED_BY="$XJW_CONTENT_SEED_CREATED_BY" node tools/build-guilu-draft-seed.mjs > /tmp/draft.sql
          node - <<'NODE'
          const fs=require('fs');
          const bank=JSON.parse(fs.readFileSync('assets/data/guilu-content-topic-bank-v20260814.json','utf8'));
          const topics=bank.topics||[];
          const ready=topics.filter(x=>x.seedToReview===true).length;
          const drafts=topics.filter(x=>x.seedToReview!==true&&x.imageMode==='context_required').length;
          if(topics.length!==40||ready!==28||drafts!==12)throw new Error(`unexpected bank total=${topics.length} ready=${ready} draft=${drafts}`);
          console.log(`PASS bank: ${topics.length} total = ${ready} pending_review ready + ${drafts} image-needed draft`);
          NODE
      - name: Verify D1 before writes
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT COUNT(*) AS before_total FROM social_posts; SELECT COUNT(*) AS guilu_before FROM social_posts WHERE id LIKE 'XJW-GUILU-%'; SELECT email,active FROM profiles WHERE email='${XJW_CONTENT_SEED_CREATED_BY}' LIMIT 1;"
      - name: Sync image-ready topics
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/review.sql
      - name: Add image-needed topics as safe drafts
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/draft.sql
      - name: Verify complete current bank in review center
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS guilu_total FROM social_posts WHERE id LIKE 'XJW-GUILU-%'; SELECT COUNT(*) AS pending_count FROM social_posts WHERE id LIKE 'XJW-GUILU-%' AND status='pending_review'; SELECT COUNT(*) AS image_needed_drafts FROM social_posts WHERE id LIKE 'XJW-GUILU-%' AND status='draft' AND trim(image_url)=''; SELECT COUNT(*) AS products_v3_live FROM social_posts WHERE id LIKE 'XJW-GUILU-%' AND image_url LIKE '%/images/products-v3/%'; SELECT COUNT(*) AS stale_count FROM social_posts WHERE id LIKE 'XJW-GUILU-%' AND status IN ('draft','pending_review') AND (copy LIKE '%早上及下午各一小匙%' OR copy LIKE '%75g／盒、8塊裝%' OR copy LIKE '%600g（1斤）%' OR copy LIKE '%每塊約18.75g%'); SELECT status,COUNT(*) AS count FROM social_posts GROUP BY status ORDER BY status;" > /tmp/audit.json
          cat /tmp/audit.json
          node - <<'NODE'
          const fs=require('fs'),d=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          let total=null,pending=null,drafts=null,pv3=null,stale=null;
          const walk=x=>{if(Array.isArray(x))return x.forEach(walk);if(x&&typeof x==='object'){if('guilu_total'in x)total=+x.guilu_total;if('pending_count'in x)pending=+x.pending_count;if('image_needed_drafts'in x)drafts=+x.image_needed_drafts;if('products_v3_live'in x)pv3=+x.products_v3_live;if('stale_count'in x)stale=+x.stale_count;Object.values(x).forEach(walk)}};walk(d);
          if(total!==40||pending!==28||drafts!==12||pv3!==0||stale!==0)throw new Error(`audit total=${total} pending=${pending} imageDraft=${drafts} productsV3=${pv3} stale=${stale}`);
          console.log('PASS remote D1: all 40 current guilu topics are visible; 28 pending_review + 12 image-needed drafts; stale=0; products-v3-live=0.');
          NODE
      - name: Remove one-shot workflow after success
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-seed-complete-guilu-bank-v20260815.yml
          git commit -m 'chore(publishing): remove completed guilu bank seed workflow'
          git pull --rebase origin main
          git push origin HEAD:main
