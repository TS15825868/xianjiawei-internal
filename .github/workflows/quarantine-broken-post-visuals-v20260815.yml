name: 仙加味問題貼文視覺全庫隔離

# 已確認 images/posts/current-v20260815 與 images/publishing/generated-v20260815 的 SVG
# 在貼文中心以圖片載入時會出現空白產品框、加號、文字模板或缺少完整情境。
# 本工作只把尚未發布的問題項目退回草稿，不碰已發布內容，不刪文案與圖片來源。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quarantine-broken-post-visuals-v20260815.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-quarantine-broken-post-visuals
  cancel-in-progress: true

jobs:
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare D1 credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install Wrangler
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Find and quarantine every unposted broken SVG composition
        shell: bash
        run: |
          set -euo pipefail
          echo '=== BEFORE ==='
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "
            SELECT id,title,status,image_url
            FROM social_posts
            WHERE status IN ('pending_review','approved','scheduled')
              AND (
                lower(image_url) LIKE '%/images/posts/current-v20260815/%.svg%'
                OR lower(image_url) LIKE '%/images/publishing/generated-v20260815/%.svg%'
              )
            ORDER BY status,id;
          "
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "
            UPDATE social_posts
            SET status='draft',
                scheduled_at=NULL,
                proposed_scheduled_at=NULL,
                approved_by=NULL,
                approved_at=NULL,
                image_approved=0,
                updated_at=CURRENT_TIMESTAMP
            WHERE status IN ('pending_review','approved','scheduled')
              AND (
                lower(image_url) LIKE '%/images/posts/current-v20260815/%.svg%'
                OR lower(image_url) LIKE '%/images/publishing/generated-v20260815/%.svg%'
              );
          "
          echo '=== AFTER ==='
          result="$(npx wrangler d1 execute xianjiawei-internal-db --remote --command "
            SELECT COUNT(*) AS unsafe_svg_non_draft
            FROM social_posts
            WHERE status IN ('pending_review','approved','scheduled')
              AND (
                lower(image_url) LIKE '%/images/posts/current-v20260815/%.svg%'
                OR lower(image_url) LIKE '%/images/publishing/generated-v20260815/%.svg%'
              );
            SELECT COUNT(*) AS unsafe_svg_draft
            FROM social_posts
            WHERE status='draft'
              AND (
                lower(image_url) LIKE '%/images/posts/current-v20260815/%.svg%'
                OR lower(image_url) LIKE '%/images/publishing/generated-v20260815/%.svg%'
              );
          ")"
          echo "$result"
          echo "$result" | grep -Eq 'unsafe_svg_non_draft[^0-9]*0|unsafe_svg_non_draft[[:space:]]+0'
          echo 'PASS: 所有已知會空白／缺圖的 SVG 合成圖均已退出待審核、核准與排程；已發布內容未變更。'
      - name: Summary
        if: always()
        run: |
          echo '只隔離已確認有實際顯示問題的 SVG 合成圖；保留原文案與原圖片網址供後續逐篇重新製圖。'
          echo '正式產品原圖、試喝圖、已發布內容與其他正常功能不受影響。'
