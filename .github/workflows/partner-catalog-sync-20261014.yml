name: Sync verified partner product facts into ERP
on:
  push:
    branches: [main]
    paths: ['.github/workflows/partner-catalog-sync-20261014.yml', 'data/partner-product-import-20261014.json', 'tools/import-partner-catalog-20261014.cjs', 'tools/import-partner-catalog-20261014.test.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Validate brand-safe imports before touching the official database
        run: node --test tools/import-partner-catalog-20261014.test.cjs
      - name: Preserve current private product fields and merge verified facts
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,data_json FROM app_records WHERE module='products' AND archived=0" > /tmp/erp-products-before.json
          node tools/import-partner-catalog-20261014.cjs
          npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/partner-import.sql
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,data_json FROM app_records WHERE module='products' AND archived=0" > /tmp/erp-products-after.json
          node - <<'JS'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8')).flatMap(x=>x.results||[]);
          const before=read('/tmp/erp-products-before.json'),after=read('/tmp/erp-products-after.json');
          const targets=JSON.parse(fs.readFileSync('data/partner-product-import-20261014.json','utf8'));
          for(const old of before){
            const now=after.find(x=>x.id===old.id);if(!now)throw Error('Lost original record');
            const a=JSON.parse(old.data_json),b=JSON.parse(now.data_json);
            for(const field of ['cost_price','retail_price','wholesale_price','promotional_price','quantity','stock'])if(JSON.stringify(a[field])!==JSON.stringify(b[field]))throw Error('Private field changed: '+field);
          }
          for(const p of targets)if(!after.some(x=>JSON.parse(x.data_json).name===p.name))throw Error('Missing imported product: '+p.name);
          console.log('PASS ERP: verified facts for '+targets.length+' products; original records, costs and stock retained');
          JS
