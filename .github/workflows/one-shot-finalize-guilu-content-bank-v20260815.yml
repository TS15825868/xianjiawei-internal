name: 仙加味龜鹿貼文母庫正式收尾與D1驗證
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-finalize-guilu-content-bank-v20260815.yml'
permissions:
  contents: write
concurrency:
  group: xianjiawei-publishing-content-finalize
  cancel-in-progress: true
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply current content authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('assets/data/guilu-content-topic-bank-v20260814.json')
          bank=json.loads(p.read_text(encoding='utf-8'))
          bank['version']='2026-08-15-guilu-publishing-v3-current-product-authority'
          rules=bank.setdefault('rules',{})
          rules['imagePriority']='符合文案的目前正式素材優先；official_product 一律使用 customer-display 正式顧客產品圖，products-v3 只作實物身份與比例校正；沒有合格情境圖才重新生成。正式產品本體不得AI重畫、裁切、拉伸或改比例。'
          rules['pendingReviewRule']='只有文案與圖片都完整、且圖片來源可確認時才進待審核；既有 draft／pending_review 可同步最新正式文案與媒體，已核准或已發布內容不自動覆寫；所有貼文仍需人工圖文審核後才能核准。'
          media={
            'guilu-gao':'https://ts15825868.github.io/xianjiawei/images/customer-display-v20260812/guilu-gao.avif?v=20260814-product-modal-media-v3',
            'guilu-drink-30':'https://ts15825868.github.io/xianjiawei/images/customer-display-v20260812/guilu-drink-30cc.avif?v=20260814-product-modal-media-v3',
            'guilu-drink-180':'https://ts15825868.github.io/xianjiawei/images/customer-display-v20260812/guilu-drink-180cc-product.jpg?v=20260814-product-modal-media-v3',
            'guilu-tangkuai':'https://ts15825868.github.io/xianjiawei/images/customer-display-v20260812/guilu-tangkuai.avif?v=20260814-product-modal-media-v3',
            'guilu-jiao':'https://ts15825868.github.io/xianjiawei/images/customer-display-v20260812/guilu-jiao.avif?v=20260814-product-modal-media-v3',
            'luerong-fen':'https://ts15825868.github.io/xianjiawei/images/customer-display-v20260812/luerong-fen.avif?v=20260814-product-modal-media-v3',
          }
          def norm(s):
              if not isinstance(s,str): return s
              for a,b in [
                ('75g／盒、8塊裝','75g （2兩）／盒｜8塊裝'),
                ('75g／盒｜8塊裝','75g （2兩）／盒｜8塊裝'),
                ('75g／盒','75g （2兩）／盒'),
                ('600g（1斤）／盒、32塊裝','600g （1斤）／盒｜32塊裝'),
                ('600g（1斤）／盒｜32塊裝','600g （1斤）／盒｜32塊裝'),
                ('600g（1斤）大盒、32塊裝','600g （1斤）／盒｜32塊裝'),
                ('600g（1斤）','600g （1斤）'),
                ('每塊約18.75g','每塊約18.75 g')]: s=s.replace(a,b)
              return s
          topics={t.get('id'):t for t in bank.get('topics',[]) if t.get('id')}
          for t in bank.get('topics',[]):
              for key in ('title','headline','copy','category','imageAlt','imageSource'):
                  if key in t:t[key]=norm(t[key])
              if t.get('imageMode')=='official_product':
                  ids=[x for x in (t.get('productIds') or []) if x]
                  if len(ids)==1 and ids[0] in media:
                      t['imageUrl']=media[ids[0]]
                      t['imageSource']=f'仙加味目前正式顧客產品圖:{ids[0]}'
          slogan='\n\n仙加味｜補養，是一種節奏。'
          custom={
            'guilu-forms':('copy','想方便即飲，可以比較龜鹿飲；喜歡小匙取用或用溫熱水化開，可以了解龜鹿膏；喜歡熱湯與家常料理，可以從龜鹿湯塊或龜鹿膠開始。先看產品型態與生活情境，再比較規格會更容易。'+slogan),
            'soup-block-vs-jiao':('copy','龜鹿湯塊是75g （2兩）／盒｜8塊裝，每塊約9.375g；龜鹿膠是600g （1斤）／盒｜32塊裝，每塊約18.75 g。兩者都能從溫熱料理情境理解，差別先看盒裝規格、每次取用與家庭使用方式。'+slogan),
            'gao-routine':('copy','龜鹿膏食用時間可依個人使用習慣與作息時間安排；初次可先從半匙開始。可以直接取用，也可以用約100～300mL溫熱水化開。'+slogan),
            'gao-first-half':('copy','龜鹿膏初次可以先從半匙開始；後續食用時間可依個人使用習慣與作息時間安排。這一篇只整理產品取用方式與日常安排。'+slogan),
            'tangkuai-75g':('copy','龜鹿湯塊正式規格為75g （2兩）／盒｜8塊裝，每塊約9.375g。把總重量、盒裝數量與每塊約重一起看，會更容易理解實際規格，也不會和舊的300g或600g資料混在一起。'+slogan),
            'tangkuai-hot-water':('copy','龜鹿湯塊除了料理，也可以依正式使用方式搭配熱水或保溫壺。不同情境都維持同一個正式規格：75g （2兩）／盒｜8塊裝，每塊約9.375g。'+slogan),
            'tangkuai-detail-weight':('copy','龜鹿湯塊規格為75g （2兩）／盒｜8塊裝，每塊約9.375g。把總重量、塊數與單塊約重一起看，可以更清楚理解每次取用的份量。'+slogan),
            'jiao-600g':('copy','龜鹿膠正式規格為600g （1斤）／盒｜32塊裝，每塊約18.75 g。產品本體維持淡紫色正式盒裝，不與龜鹿湯塊混用。'+slogan),
            'jiao-family':('copy','龜鹿膠是600g （1斤）／盒｜32塊裝，每塊約18.75 g。可以從家庭料理、分塊取用與固定備用的角度理解，先看包裝與使用方式，不把大盒產品誤畫成75g龜鹿湯塊。'+slogan),
            'jiao-detail-weight':('copy','龜鹿膠規格為600g （1斤）／盒｜32塊裝，每塊約18.75 g。把總重量、塊數與單塊約重一起看，可以更清楚理解家庭使用與分塊取用。'+slogan),
          }
          for id,(field,value) in custom.items():
              if id in topics:topics[id][field]=value
          if 'gao-routine' in topics:topics['gao-routine']['headline']='依自己的使用習慣與作息安排，更容易維持日常節奏'
          if 'tangkuai-75g' in topics:topics['tangkuai-75g']['title']='龜鹿湯塊75g （2兩）／盒，8塊裝代表什麼？'
          if 'tangkuai-detail-weight' in topics:
              topics['tangkuai-detail-weight']['title']='龜鹿湯塊每塊約9.375g，怎麼看這個數字？'
              topics['tangkuai-detail-weight']['headline']='75g （2兩）／盒、8塊裝，換算每塊約9.375g'
          if 'jiao-600g' in topics:topics['jiao-600g']['title']='龜鹿膠600g （1斤）／盒，怎麼看這個規格？'
          if 'jiao-detail-weight' in topics:
              topics['jiao-detail-weight']['title']='龜鹿膠每塊約18.75 g，怎麼看這個數字？'
              topics['jiao-detail-weight']['headline']='600g （1斤）／盒、32塊裝，換算每塊約18.75 g'
          p.write_text(json.dumps(bank,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY
      - name: Validate current bank and publishing runtime
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          bank=json.loads(Path('assets/data/guilu-content-topic-bank-v20260814.json').read_text(encoding='utf-8'))
          text=json.dumps(bank,ensure_ascii=False)
          for token in ['早上及下午各一小匙','一般日常安排為早上及下午','75g／盒、8塊裝','600g（1斤）／盒','600g（1斤）大盒','每塊約18.75g','current-products-v3']:
              if token in text:raise SystemExit(f'仍有退役內容：{token}')
          seeded=0
          for t in bank.get('topics',[]):
              if t.get('seedToReview') is True:seeded+=1
              if t.get('imageMode')=='official_product':
                  assert '/images/customer-display-v20260812/' in t.get('imageUrl','')
                  assert '/images/products-v3/' not in t.get('imageUrl','')
          assert seeded==28
          print(f'PASS: bank current; total={len(bank.get("topics",[]))}; seedToReview={seeded}')
          PY
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run check
          npm run guard:full
          npm run build:static
      - name: Seed, sync and verify remote D1
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node tools/build-guilu-review-seed.mjs > /tmp/guilu-seed.sql
          npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/guilu-seed.sql
          python - <<'PY'
          import json,re
          from pathlib import Path
          bank=json.loads(Path('assets/data/guilu-content-topic-bank-v20260814.json').read_text(encoding='utf-8'))
          site='https://ts15825868.github.io/xianjiawei'; ver='20260814-product-modal-media-v3'
          media={'guilu-gao':f'{site}/images/customer-display-v20260812/guilu-gao.avif?v={ver}','guilu-drink-30':f'{site}/images/customer-display-v20260812/guilu-drink-30cc.avif?v={ver}','guilu-drink-180':f'{site}/images/customer-display-v20260812/guilu-drink-180cc-product.jpg?v={ver}','guilu-tangkuai':f'{site}/images/customer-display-v20260812/guilu-tangkuai.avif?v={ver}','guilu-jiao':f'{site}/images/customer-display-v20260812/guilu-jiao.avif?v={ver}','luerong-fen':f'{site}/images/customer-display-v20260812/luerong-fen.avif?v={ver}'}
          def q(v):return "'"+str(v or '').replace("'","''")+"'"
          def safe(v):return re.sub(r'[^a-z0-9-]+','-',str(v or '').strip().lower()).strip('-')
          rows=[]
          for t in bank.get('topics',[]):
              if t.get('seedToReview') is not True:continue
              ids=[x for x in (t.get('productIds') or []) if x]
              if t.get('imageMode')=='official_product' and len(ids)==1:url=media[ids[0]];source=f'仙加味目前正式顧客產品圖:{ids[0]}'
              elif t.get('imageMode')=='official_trial':url=f'{site}/images/trial/trial-poster-small-boss-official-v20260814.jpg?v={ver}';source='仙加味8/14目前正式試喝主圖'
              else:url=t.get('imageUrl','');source=t.get('imageSource','仙加味正式素材')
              slug=safe(t.get('id'));post=f'XJW-GUILU-{slug}';platforms=json.dumps(t.get('platforms') or ['Facebook','Instagram'],ensure_ascii=False,separators=(',',':'))
              image_source=f'{source}|題庫:{slug}|{bank.get("version","")}|media:{ver}'
              rows.append("UPDATE social_posts SET title={title},headline={headline},copy={copy},category={cat},platforms_json={platforms},image_url={url},image_alt={alt},image_source={source},updated_at=CURRENT_TIMESTAMP WHERE id={id} AND status IN ('draft','pending_review');".format(title=q(t.get('title')),headline=q(t.get('headline')),copy=q(t.get('copy')),cat=q(t.get('category') or '龜鹿知識'),platforms=q(platforms),url=q(url),alt=q(t.get('imageAlt') or t.get('title')),source=q(image_source),id=q(post)))
          Path('/tmp/guilu-sync.sql').write_text('\n'.join(rows)+'\n',encoding='utf-8')
          PY
          npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/guilu-sync.sql
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS guilu_count FROM social_posts WHERE instr(id,'XJW-GUILU-')=1; SELECT COUNT(*) AS stale_count FROM social_posts WHERE instr(id,'XJW-GUILU-')=1 AND status IN ('draft','pending_review') AND (copy LIKE '%早上及下午各一小匙%' OR copy LIKE '%75g／盒、8塊裝%' OR copy LIKE '%600g（1斤）%' OR copy LIKE '%每塊約18.75g%'); SELECT id,status,title FROM social_posts WHERE instr(id,'XJW-GUILU-')=1 ORDER BY created_at DESC LIMIT 40;" > /tmp/d1-audit.json
          cat /tmp/d1-audit.json
          node - <<'NODE'
          const fs=require('fs');const data=JSON.parse(fs.readFileSync('/tmp/d1-audit.json','utf8'));let guilu=null,stale=null;
          const walk=x=>{if(Array.isArray(x))for(const v of x)walk(v);else if(x&&typeof x==='object'){if('guilu_count'in x)guilu=Number(x.guilu_count);if('stale_count'in x)stale=Number(x.stale_count);for(const v of Object.values(x))walk(v)}};walk(data);
          if(!(guilu>=28))throw new Error(`遠端龜鹿母庫筆數異常：${guilu}`);if(stale!==0)throw new Error(`遠端待審核仍有退役內容：${stale}`);console.log(`PASS: remote D1 guilu_count=${guilu}, stale_count=${stale}`);
          NODE
      - name: Commit current content bank
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/data/guilu-content-topic-bank-v20260814.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(publishing): finalize current guilu content bank'
            git push origin HEAD:main
          fi
      - name: Deploy current publishing center
        run: npx wrangler deploy --keep-vars
      - name: Verify production routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://xianjiawei-internal.tung314069.workers.dev'
          for path in '/publishing.html' '/'; do
            code="$(curl -sS --max-time 20 -o /tmp/xjw-route -w '%{http_code}' "$base$path" || true)"
            test "$code" != '000'
            test "$code" -lt 500
            echo "PASS: $path reachable with HTTP $code (Cloudflare Access may protect content)."
          done
