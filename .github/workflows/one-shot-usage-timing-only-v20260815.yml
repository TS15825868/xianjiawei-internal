name: 仙加味 ERP 20260815 使用時間一致性更新
# exact-timing-only-v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-usage-timing-only-v20260815.yml'
permissions:
  contents: write
jobs:
  update-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact current timing authority
        run: python tools/apply-usage-flex-v20260815.py
      - name: Validate ERP and publishing contracts
        run: |
          npm install
          npm run check
          npm run guard:full
          npm run build:static
      - name: Commit verified regular files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/one-shot-usage-timing-only-v20260815.yml' ':!tools/apply-usage-flex-v20260815.py'
          if git diff --cached --quiet; then echo 'No verified changes'; exit 0; fi
          git commit -m 'fix(erp): align exact personal timing authority'
          git push origin HEAD:main
