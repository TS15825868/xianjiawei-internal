name: 仙加味 ERP 20260815 使用時間一致性更新
# exact-timing-only-v3-inline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-usage-timing-only-v20260815.yml'
permissions:
  contents: write
jobs:
  update-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply exact current timing authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          replacements=[
            ('食用時間與份量可依個人使用習慣與作息安排','食用時間可依個人使用習慣與作息時間安排'),
            ('食用時間可依個人使用習慣與作息安排','食用時間可依個人使用習慣與作息時間安排'),
            ('飲用時間可依個人使用習慣與作息安排','飲用時間可依個人使用習慣與作息時間安排'),
            ('所有產品使用時間依個人使用習慣與作息安排','所有產品使用時間依個人使用習慣與作息時間安排'),
          ]
          suffixes={'.js','.mjs','.json','.md','.html','.txt','.py'}
          changed=[]
          for rel in subprocess.check_output(['git','ls-files'],text=True).splitlines():
            if rel.startswith('.github/') or Path(rel).suffix.lower() not in suffixes:
              continue
            p=Path(rel)
            try:
              old=p.read_text(encoding='utf-8')
            except Exception:
              continue
            new=old
            for a,b in replacements:
              new=new.replace(a,b)
            if new!=old:
              p.write_text(new,encoding='utf-8')
              changed.append(rel)
          print('changed files:',len(changed))
          print('\n'.join(changed))
          src=Path('src/product-authority.js').read_text(encoding='utf-8')
          front=Path('assets/js/product-authority-guard.js').read_text(encoding='utf-8')
          status=Path('cloudflare-deploy-current-status.json').read_text(encoding='utf-8')
          combined='\n'.join([src,front,status])
          assert '食用時間可依個人使用習慣與作息時間安排' in combined
          assert '每日 1-2罐' in combined
          assert '飲用時間可依個人使用習慣與作息時間安排' in combined
          # 「建議白天飲用」可保留在防倒退正則/錯誤訊息中，但不得作為目前使用方式。
          PY
      - name: Validate ERP and publishing contracts
        run: |
          npm install
          npm run check
          npm run guard:full
          npm run build:static
      - name: Commit verified regular files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/one-shot-usage-timing-only-v20260815.yml'
          if git diff --cached --quiet; then echo 'No verified changes'; exit 0; fi
          git commit -m 'fix(erp): align exact personal timing authority'
          git push origin HEAD:main
