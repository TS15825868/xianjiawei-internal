name: Bootstrap D1 first social post

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-d1-first-post.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Write formal first post to live D1
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/first-post.sql <<'SQL'
          CREATE TABLE IF NOT EXISTS social_post_review_gates(
            post_id TEXT PRIMARY KEY,
            content_fingerprint TEXT NOT NULL,
            checklist_json TEXT NOT NULL DEFAULT '{}',
            copy_image_match INTEGER NOT NULL DEFAULT 0,
            reviewed_by TEXT NOT NULL DEFAULT '',
            reviewed_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP
          );

          DELETE FROM social_post_review_gates WHERE post_id IN (
            'XJW-GUILU-drink30-work-break','XJW-GUILU-drink180-home','XJW-GUILU-gao-storage','XJW-GUILU-tangkuai-soup','XJW-GUILU-jiao-600g','XJW-GUILU-luerong-75g','XJW-SOCIAL-20260815-02-line-consult-and-trial','XJW-GUILU-choose-by-place','XJW-SOCIAL-20260815-03-storage-basics','XJW-SOCIAL-20260815-01-warm-drink-moment','POST-AUDIENCE-NEEDS'
          );
          DELETE FROM social_posts WHERE id IN (
            'XJW-GUILU-drink30-work-break','XJW-GUILU-drink180-home','XJW-GUILU-gao-storage','XJW-GUILU-tangkuai-soup','XJW-GUILU-jiao-600g','XJW-GUILU-luerong-75g','XJW-SOCIAL-20260815-02-line-consult-and-trial','XJW-GUILU-choose-by-place','XJW-SOCIAL-20260815-03-storage-basics','XJW-SOCIAL-20260815-01-warm-drink-moment','POST-AUDIENCE-NEEDS'
          ) AND status<>'published';

          INSERT INTO social_posts(
            id,title,headline,copy,category,platforms_json,status,scheduled_at,approved_by,approved_at,published_at,created_by,created_at,updated_at,
            image_url,image_alt,image_source,image_approved,image_width,image_height,image_bytes,image_quality_status,media_id,review_note,brand_check_json,rejection_reason,proposed_scheduled_at
          ) VALUES(
            'XJW-SOCIAL-20260904-0900-FIRST',
            '週五早上，先把今天想問的整理好',
            '週五早上，先把今天想問的整理好',
            '週五早上，把今天想問仙加味的事先記在手機裡。出門前或早上有空時，再從 LINE 找我們慢慢聊；從不同產品型態、攜帶方式到日常安排，都可以依自己的生活節奏慢慢確認。補養，是一種節奏。',
            '生活情境',
            '["Facebook","Instagram"]',
            'scheduled',
            '2026-09-04T01:00:00.000Z',
            COALESCE((SELECT email FROM profiles WHERE active=1 ORDER BY CASE WHEN role='owner' THEN 0 WHEN role='admin' THEN 1 WHEN role='content' THEN 2 ELSE 3 END,email LIMIT 1),(SELECT email FROM profiles LIMIT 1)),
            strftime('%Y-%m-%dT%H:%M:%fZ','now'),
            NULL,
            COALESCE((SELECT email FROM profiles WHERE active=1 ORDER BY CASE WHEN role='owner' THEN 0 WHEN role='admin' THEN 1 WHEN role='content' THEN 2 ELSE 3 END,email LIMIT 1),(SELECT email FROM profiles LIMIT 1)),
            strftime('%Y-%m-%dT%H:%M:%fZ','now'),
            strftime('%Y-%m-%dT%H:%M:%fZ','now'),
            'https://ts15825868.github.io/xianjiawei/images/posts/formal-v20260904/first-post-work-rest-qmascot.webp',
            '仙加味Q版小男生小老闆與分開的Q版小鹿、Q版小烏龜，在早晨店內一起看手機準備LINE諮詢',
            '使用者人工指定｜identity-approved｜2026-09-04正式Q版小男生完整單一情境圖',
            1,1122,1402,317077,'clear',NULL,
            '使用者於對話中確認開始動作；固定Q版小男生小老闆、Q版小鹿與Q版小烏龜，圖文一致後排入2026-09-04 09:00正式首篇。',
            '{"brand":"仙加味","mascot":"Q版小男生","companions":["Q版小鹿","Q版小烏龜"],"single_scene":true,"product_visual":false,"medical_claims":false}',
            '',
            '2026-09-04T01:00:00.000Z'
          )
          ON CONFLICT(id) DO UPDATE SET
            title=excluded.title,headline=excluded.headline,copy=excluded.copy,category=excluded.category,platforms_json=excluded.platforms_json,
            status=CASE WHEN social_posts.status='published' THEN social_posts.status ELSE excluded.status END,
            scheduled_at=CASE WHEN social_posts.status='published' THEN social_posts.scheduled_at ELSE excluded.scheduled_at END,
            approved_by=CASE WHEN social_posts.status='published' THEN social_posts.approved_by ELSE excluded.approved_by END,
            approved_at=CASE WHEN social_posts.status='published' THEN social_posts.approved_at ELSE excluded.approved_at END,
            updated_at=excluded.updated_at,
            image_url=excluded.image_url,image_alt=excluded.image_alt,image_source=excluded.image_source,image_approved=excluded.image_approved,
            image_width=excluded.image_width,image_height=excluded.image_height,image_bytes=excluded.image_bytes,image_quality_status=excluded.image_quality_status,
            review_note=excluded.review_note,brand_check_json=excluded.brand_check_json,rejection_reason='',proposed_scheduled_at=excluded.proposed_scheduled_at;

          INSERT INTO social_post_review_gates(post_id,content_fingerprint,checklist_json,copy_image_match,reviewed_by,reviewed_at)
          SELECT
            'XJW-SOCIAL-20260904-0900-FIRST',
            '03bf028f616db312f594f905d90a53c4248267221df8c2d2c8619333e422065f',
            '{"brand":true,"product":true,"specification":true,"pricing_activity":true,"season":true,"weather":true,"occasion":true,"location":true,"scene_environment":true,"temperature":true,"expression":true,"action":true,"mascot_companions":true,"physical_scale":true,"duplicate":true,"compliance_final":true}',
            1,
            COALESCE((SELECT email FROM profiles WHERE active=1 ORDER BY CASE WHEN role='owner' THEN 0 WHEN role='admin' THEN 1 WHEN role='content' THEN 2 ELSE 3 END,email LIMIT 1),(SELECT email FROM profiles LIMIT 1)),
            strftime('%Y-%m-%dT%H:%M:%fZ','now')
          WHERE EXISTS(SELECT 1 FROM social_posts WHERE id='XJW-SOCIAL-20260904-0900-FIRST' AND status<>'published')
          ON CONFLICT(post_id) DO UPDATE SET
            content_fingerprint=excluded.content_fingerprint,checklist_json=excluded.checklist_json,copy_image_match=excluded.copy_image_match,reviewed_by=excluded.reviewed_by,reviewed_at=excluded.reviewed_at;
          SQL
          npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/first-post.sql > bootstrap-result.txt
      - name: Verify live D1 state and public image
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT id,title,headline,copy,category,platforms_json,status,scheduled_at,image_url,image_alt,image_source,image_approved,image_width,image_height,image_bytes,image_quality_status,approved_at,updated_at FROM social_posts WHERE id='XJW-SOCIAL-20260904-0900-FIRST' LIMIT 1;" > first-post.txt
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT post_id,content_fingerprint,checklist_json,copy_image_match,reviewed_at FROM social_post_review_gates WHERE post_id='XJW-SOCIAL-20260904-0900-FIRST' LIMIT 1;" > first-gate.txt
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT COUNT(*) AS invalid_unpublished_left FROM social_posts WHERE id IN ('XJW-GUILU-drink30-work-break','XJW-GUILU-drink180-home','XJW-GUILU-gao-storage','XJW-GUILU-tangkuai-soup','XJW-GUILU-jiao-600g','XJW-GUILU-luerong-75g','XJW-SOCIAL-20260815-02-line-consult-and-trial','XJW-GUILU-choose-by-place','XJW-SOCIAL-20260815-03-storage-basics','XJW-SOCIAL-20260815-01-warm-drink-moment','POST-AUDIENCE-NEEDS') AND status<>'published';" > invalid-count.txt
          grep -q 'scheduled' first-post.txt
          grep -q '2026-09-04T01:00:00.000Z' first-post.txt
          grep -q '03bf028f616db312f594f905d90a53c4248267221df8c2d2c8619333e422065f' first-gate.txt
          grep -q '"copy_image_match": 1' first-gate.txt
          grep -q '"invalid_unpublished_left": 0' invalid-count.txt
          curl -fsSL --max-time 30 'https://ts15825868.github.io/xianjiawei/images/posts/formal-v20260904/first-post-work-rest-qmascot.webp' -o /dev/null
      - name: Upload formal verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-first-post-d1-evidence
          path: |
            bootstrap-result.txt
            first-post.txt
            first-gate.txt
            invalid-count.txt
          retention-days: 1
