name: One-shot harden social quality
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-harden-social-quality-v20260815.yml'
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Harden customer-visible copy checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'anchor missing: {path}: {old[:80]}')
              p.write_text(s.replace(old,new,1))

          # 圖片替代文字也可能被客人／輔助工具讀到，納入顧客可見文字守門。
          replace_once('assets/js/publishing-app-v2.js',
            "const internalHit=CUSTOMER_INTERNAL_TERMS.find(term=>[post.title,post.headline,post.copy].filter(Boolean).join(' ').toLowerCase().includes(term.toLowerCase()));",
            "const internalHit=CUSTOMER_INTERNAL_TERMS.find(term=>[post.title,post.headline,post.copy,post.image_alt].filter(Boolean).join(' ').toLowerCase().includes(term.toLowerCase()));")
          replace_once('src/publishing-review-gate-entry.js',
            "function customerCopyErrors(row){const text=[row?.title,row?.headline,row?.copy].filter(Boolean).join(' ');",
            "function customerCopyErrors(row){const text=[row?.title,row?.headline,row?.copy,row?.image_alt].filter(Boolean).join(' ');")
          replace_once('tools/build-social-batches-review-seed.mjs',
            "const text = [post.title, post.headline, post.copy, post.category].join(' ');",
            "const text = [post.title, post.headline, post.copy, post.imageAlt, post.category].join(' ');")
          replace_once('tools/build-guilu-review-seed.mjs',
            "const text = [topic.title, topic.headline, topic.copy, topic.category].join(' ');",
            "const text = [topic.title, topic.headline, topic.copy, topic.imageAlt, topic.category].join(' ');")
          replace_once('tools/build-guilu-draft-seed.mjs',
            "const text = [topic.title,topic.headline,topic.copy,topic.category].join(' ');",
            "const text = [topic.title,topic.headline,topic.copy,topic.imageAlt,topic.category].join(' ');")

          # 擴充只有內部人員才應看到的作業字樣。
          extra="'Cloudflare','API Token','Secret','Repository','Repo','commit','deploy','部署','快取版本','測試資料','內部檢查','客戶實際會看到的文案'"
          for path in ['assets/js/publishing-app-v2.js','src/publishing-review-gate-entry.js','tools/build-social-batches-review-seed.mjs','tools/build-guilu-review-seed.mjs','tools/build-guilu-draft-seed.mjs']:
              p=Path(path); s=p.read_text()
              anchor="'debug','TODO','placeholder','假資料']"
              if anchor not in s:
                  raise SystemExit(f'internal terms anchor missing: {path}')
              p.write_text(s.replace(anchor, f"'debug','TODO','placeholder','假資料',{extra}]",1))

          # 台興山產是可對外使用的正式品牌名稱，不應被誤列為禁止字詞。
          p=Path('tools/build-guilu-review-seed.mjs'); s=p.read_text()
          s=s.replace("  '台興山產','不是每個人都一定需要'","  '不是每個人都一定需要'",1)
          # 內部字樣比對改為不分大小寫，避免 ERP/erp、GitHub/github 之類漏網。
          s=s.replace("  const hit = [...BLOCKED,...CUSTOMER_INTERNAL].find(term => text.includes(term));","  const lower=text.toLowerCase();\n  const hit = [...BLOCKED,...CUSTOMER_INTERNAL].find(term => lower.includes(term.toLowerCase()));",1)
          p.write_text(s)
          p=Path('tools/build-guilu-draft-seed.mjs'); s=p.read_text()
          s=s.replace("  const hit = [...BLOCKED,...CUSTOMER_INTERNAL].find(term => text.includes(term));","  const lower=text.toLowerCase();\n  const hit = [...BLOCKED,...CUSTOMER_INTERNAL].find(term => lower.includes(term.toLowerCase()));",1)
          p.write_text(s)

          # 驗證器固定要求 image_alt 也必須被後端顧客文字守門涵蓋。
          p=Path('tools/validate-publishing-review-gate.mjs'); s=p.read_text()
          anchor="must(gate.includes('CUSTOMER_INTERNAL_TERMS'),'正式審核缺少顧客文案內部用語守門');"
          if anchor not in s: raise SystemExit('validator anchor missing')
          s=s.replace(anchor, anchor+"\nmust(gate.includes('row?.image_alt'),'正式審核必須把圖片替代文字納入顧客可見文字守門');",1)
          p.write_text(s)
          print('PASS customer-visible copy hardening patched')
          PY
      - name: Validate and build
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run check
          npm run guard:full
          npm run build:static
      - name: Commit permanent quality hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/publishing-app-v2.js src/publishing-review-gate-entry.js tools/build-social-batches-review-seed.mjs tools/build-guilu-review-seed.mjs tools/build-guilu-draft-seed.mjs tools/validate-publishing-review-gate.mjs
          git commit -m 'fix(publishing): harden customer-visible copy quality gate'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Deploy hardened posting center
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --keep-vars
      - name: Verify protected production routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://xianjiawei-internal.tung314069.workers.dev'
          for path in '/' '/publishing' '/publishing.html' '/healthz/core'; do
            body="$(mktemp)"
            result="$(curl -LsS --max-redirs 6 --max-time 25 -o "$body" -w '%{http_code} %{num_redirects} %{url_effective}' "$base$path")"
            code="${result%% *}"
            echo "$path -> $result"
            test "$code" -ge 200
            test "$code" -lt 500
            grep -Eiq '貼文中心系統 App|<html|<!doctype|cloudflare|access|sign in|login|publishing' "$body"
          done
