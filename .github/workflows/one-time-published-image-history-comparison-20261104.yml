name: XJW read-only published image history comparison
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-published-image-history-comparison-20261104.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Snapshot ALL D1 current and archived image bindings read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,status,image_url,copy FROM social_posts ORDER BY id" > /tmp/post-images-all.json
          test -s /tmp/post-images-all.json
      - name: Compare present unpublished art with previously published and archived art
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pillow
          python - <<'PY'
          import io,os,json,hashlib,urllib.parse,urllib.request,pathlib,concurrent.futures,collections
          from PIL import Image,ImageOps
          src=json.load(open('/tmp/post-images-all.json','r',encoding='utf-8'))
          rows=src[0].get('results',[]) if isinstance(src,list) else src.get('results',[])
          m=json.load(open('ops/metricool-published-media-history-20261104.json',encoding='utf-8'))
          assert m['schema']=='xjw-metricool-published-media-history-v1' and len(m['records'])>=20
          live=[{'type':'live_unpublished','id':r['id'],'status':r['status'],'title':r['title'],'url':r['image_url']} for r in rows if r['status'] in ('pending_review','draft') and r['image_url']]
          archived=[{'type':'d1_history','id':r['id'],'status':r['status'],'title':r['title'],'url':r['image_url']} for r in rows if r['status'] in ('published','archived') and r['image_url']]
          history=[{'type':'metricool_published','id':str(x['metricool_id']),'uuid':x['uuid'],'status':'published','title':'','url':u} for x in m['records'] for u in x['media']]
          assert len(live)>=50, 'Unexpected live D1 count'
          allitems=live+archived+history
          urls=list(dict.fromkeys(x['url'] for x in allitems))
          def get_bytes(url):
              try:
                  u=urllib.parse.urlparse(url)
                  if u.scheme!='https' or u.username or u.password:return(None,'unsafe_protocol')
                  domain=(u.hostname or '').lower()
                  official_raw='raw.githubusercontent.com'
                  if domain==official_raw:
                      parts=u.path.strip('/').split('/')
                      if len(parts)<5 or parts[0].lower()!='ts15825868' or parts[1] not in ('xianjiawei-internal','xianjiawei') or parts[2]!='main': return(None,'outside_official_repo')
                      if '..' in parts:return(None,'path_escape')
                      if parts[1]=='xianjiawei-internal':
                          p=pathlib.Path('/'.join(parts[3:]))
                          if p.is_file() and p.stat().st_size<=12*1024*1024:return(p.read_bytes(),'local_git')
                  elif domain not in ('static.metricool.com','ts15825868.github.io'):return(None,'outside_allowlist')
                  req=urllib.request.Request(url,headers={'User-Agent':'XJW-Visual-Provenance-Audit/1.0','Accept':'image/*'})
                  with urllib.request.urlopen(req,timeout=12) as resp:
                      data=resp.read(12*1024*1024+1)
                      if len(data)>12*1024*1024:return(None,'too_large')
                      if len(data)<1000:return(None,'too_small')
                      return(data,'fetched')
              except Exception as e:
                  code=getattr(e,'code',None)
                  return(None,('http_'+str(code)) if code is not None else type(e).__name__)
          def perceptual(data):
              try:
                  im=Image.open(io.BytesIO(data))
                  im=ImageOps.exif_transpose(im).convert('RGB')
                  pixels=im.convert('L').resize((9,8)).load()
                  bit=0
                  for y in range(8):
                      for x in range(8):bit=(bit<<1)|int(pixels[x,y]>pixels[x+1,y])
                  a=im.convert('L').resize((8,8))
                  vs=list(a.getdata());avg=sum(vs)/len(vs)
                  abit=0
                  for v in vs:abit=(abit<<1)|int(v>avg)
                  return {'sha256':hashlib.sha256(data).hexdigest(),'dhash':bit,'ahash':abit,'size':[im.width,im.height],'bytes':len(data)}
              except Exception as e:return {'error':'decode_'+type(e).__name__}
          results={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              futures={ex.submit(get_bytes,u):u for u in urls}
              for fut in concurrent.futures.as_completed(futures):
                  url=futures[fut]
                  raw,status=fut.result()
                  results[url]={**(perceptual(raw) if raw else {}),'source_status':status}
          def hdist(a,b):return (a^b).bit_count()
          exact=[],similar=[]
          for left in live:
              la=results[left['url']]
              if 'sha256' not in la:continue
              for right in archived+history:
                  if left['id']==right['id']:continue
                  ra=results[right['url']]
                  if 'sha256' not in ra:continue
                  hint={'pending_id':left['id'],'pending_title':left['title'],'historical_source':right['type'],'historical_id':right['id'],'historical_status':right['status'],'historical_url':right['url']}
                  if la['sha256']==ra['sha256']:exact.append(hint)
                  else:
                      dist=hdist(la['dhash'],ra['dhash']);avg=hdist(la['ahash'],ra['ahash'])
                      if dist<=6 and avg<=9:similar.append({**hint,'dhash_distance':dist,'ahash_distance':avg})
          counts=collections.Counter(x['type'] for x in allitems)
          hist_unique_urls=list(dict.fromkeys(x['url'] for x in archived+history))
          failures=collections.Counter(results[u].get('source_status') for u in hist_unique_urls if 'sha256' not in results[u])
          report={'schema':'xjw-readonly-published-image-dedup-v1','scope':'Current live D1 plus observed Metricool published records; not full FB/IG/Threads history','live_unpublished':len(live),'d1_archived_or_published_images':len(archived),'metricool_published_media_entries':len(history),'historical_unique_media_urls':len(hist_unique_urls),'historical_accessible_media':sum('sha256' in results[u] for u in hist_unique_urls),'historical_inaccessible_by_reason':dict(failures),'all_unique_urls':len(urls),'exact_historical_reuses':exact,'possible_visual_similarity_NEEDS_MANUAL_REVIEW':sorted(similar,key=lambda x:(x['dhash_distance'],x['ahash_distance']))[:90],'similarity_count':len(similar),'safety':'Read-only. No D1, Metricool, GitHub image, published post, review state or outbound communication changed. Missing history is not proof of nonduplicate.'}
          pathlib.Path('/tmp/xjw-image-history-dedup-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PASS read-only history coverage',json.dumps({k:report[k] for k in ('live_unpublished','d1_archived_or_published_images','metricool_published_media_entries','historical_accessible_media','historical_unique_media_urls','historical_inaccessible_by_reason','similarity_count')},ensure_ascii=False))
          print('PASS exact image conflicts',len(exact),'confirmed; candidate visual similarities',len(similar),'not auto-approved')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xjw-published-image-history-compare-${{ github.run_id }}
          path: /tmp/xjw-image-history-dedup-report.json
          if-no-files-found: warn
          retention-days: 3
