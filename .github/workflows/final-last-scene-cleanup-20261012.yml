name: 仙加味兩張字跡清理與正式圖片替換｜單次安全回填
on:
  push:
    branches: [main]
    paths: ['ops/final-last-scene-cleanup-20261012.json']
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Read current D1 and reject stale manifests
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts ORDER BY id" > /tmp/full-audit-before.json
          node tools/apply-final-last-scene-cleanup-20261012.cjs prepare
      - name: Apply exact public-field repairs without approvals or publishing
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/full-audit-apply.sql
      - name: Verify actual values and historical preservation
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts ORDER BY id" > /tmp/full-audit-after.json
          node tools/apply-final-last-scene-cleanup-20261012.cjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-library-cleanup-${{ github.run_id }}
          path: |
            /tmp/full-audit-result.json
            /tmp/full-audit-before.json
            /tmp/full-audit-after.json
