name: fix official13 D1 PR 20260819

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/data/fix-official13-d1-pr-v20260819.trigger'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install tools
        run: |
          python -m pip install --quiet pillow
          npm install --no-save wrangler@latest

      - name: Download and verify exact 13 formal images from website main
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/official13
          rm -rf "$root" && mkdir -p "$root"
          names=('01-work-30cc.webp' '02-home-180cc.webp' '03-gao-storage.webp' '04-tangkuai-soup.webp' '05-jiao-600g.webp' '06-lurong-75g.webp' '07-line-consult.webp' '08-home-out.webp' '09-organize-cabinet.webp' '10-office-warm-drink.webp' '11-audience-needs.webp' '12-trial-group-published.webp' '13-brand-story-wanhua-published.webp')
          hashes=('2126f7218e28840d691d3e7e9277e2e4b3877d7394d3fa1cc9454fce475fdb4d' 'f346affa8e5387ba9323bb1cfaccacab739b06d5f45fdaa0f9c469d966a8b401' 'd9072baa0d40dce6ab1dac9c750fac0badeee188c7f24558cedd97aff6c6c41f' 'f9ad9d7b153ad8da3761b17e7bbacda268361f67986b88a7ca823224150e99a7' '4c2566ffcbdb0af564ebe8c6182ccc3c7d9e51b09c31f7238591052f5835a0bf' '0d0cbdf260af3f9d067205eba476d833d016ad85b16feb27e2bcf1f8c8c494de' 'dc2ab1d8516eb1e133853ad40a8f8128ae6c154c31dba76b7e61d7266ada55e9' '17a75dff9fa92cbe164bb9e729ab6bcf49a8c5011c43b83f9f809d835856d38b' '4f93a8d1c948184b28dad6115708000e47968442eaf5be6f01b2c6ac23912132' '5d35292b7c18c5b1bfae7aebfb2b48b869aea948e4bbde2cba1329fab187ad2f' '30719042a9291b34eb34711dbbc022d7e8ea58a940d553aafc7e40896b6da70d' '47793954b2883aab287edefc1b059c033d1bb9be605df114ff16f0d90cbfe40f' 'dad70a2120e5630e733c341993ef477c28bc5e06eef203a5c780bda72780f9cd')
          sizes=(49620 53070 47502 50334 48654 46950 52640 50190 49092 49882 50280 57232 27672)
          for i in $(seq 0 12); do
            f="${names[$i]}"
            curl -LfsS --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 "https://raw.githubusercontent.com/TS15825868/xianjiawei/main/images/posts/official-v20260818/$f" -o "$root/$f"
            test "$(stat -c%s "$root/$f")" -eq "${sizes[$i]}"
            echo "${hashes[$i]}  $root/$f" | sha256sum -c -
          done

      - name: Resolve live owner profile for D1 foreign key
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT email FROM profiles ORDER BY CASE WHEN role='owner' THEN 0 WHEN role='admin' THEN 1 ELSE 2 END,email LIMIT 1" > /tmp/owner.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/owner.json','utf8'));
          const rows=Array.isArray(x)&&x[0]?.results?x[0].results:(x?.results||x||[]);
          const email=String(rows[0]?.email||'').trim();
          if(!email||!email.includes('@')) throw new Error('No valid owner profile email found');
          fs.writeFileSync('/tmp/owner-email.txt',email);
          console.log('PASS owner profile resolved');
          NODE

      - name: Build schema-compatible per-image D1 writes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, json

          root=Path('/tmp/official13')
          out=Path('/tmp/official13-sql'); out.mkdir(exist_ok=True)
          owner=Path('/tmp/owner-email.txt').read_text().strip()
          items=[
            ('01-work-30cc.webp','IMG-OFFICIAL-01-WORK-30CC','XJW-GUILU-drink30-work-break','上班帶一罐，30cc不用把行程打亂','仙加味小老闆上班工作情境，手持30cc小玻璃裸罐','pending_review'),
            ('02-home-180cc.webp','IMG-OFFICIAL-02-HOME-180CC','XJW-GUILU-drink180-home','回到家，把180cc安排進自己的節奏','仙加味小老闆居家180cc鋁袋飲用情境','pending_review'),
            ('03-gao-storage.webp','IMG-OFFICIAL-03-GAO-STORAGE','XJW-GUILU-gao-storage','龜鹿膏開罐後，順手放進冰箱','仙加味小老闆把龜鹿膏100g開罐後放回冰箱保存','pending_review'),
            ('04-tangkuai-soup.webp','IMG-OFFICIAL-04-TANGKUAI-SOUP','XJW-GUILU-tangkuai-soup','今晚燉湯，把龜鹿湯塊安排進家常餐桌','仙加味小老闆家常燉湯情境與龜鹿湯塊盒','pending_review'),
            ('05-jiao-600g.webp','IMG-OFFICIAL-05-JIAO-600G','XJW-GUILU-jiao-600g','週末有時間，再慢慢認識龜鹿膠這種型態','仙加味小老闆週末認識龜鹿膠情境與龜鹿膠盒','pending_review'),
            ('06-lurong-75g.webp','IMG-OFFICIAL-06-LURONG-75G','XJW-GUILU-luerong-75g','下午想簡單一點，可以先認識鹿茸粉','仙加味小老闆午後認識鹿茸粉75g罐裝情境','pending_review'),
            ('07-line-consult.webp','IMG-OFFICIAL-07-LINE-CONSULT','XJW-SOCIAL-20260815-02-line-consult-and-trial','不知道怎麼選，先把你的日常告訴我們','仙加味小老闆以LINE諮詢協助依日常挑選產品','pending_review'),
            ('08-home-out.webp','IMG-OFFICIAL-08-HOME-OUT','XJW-GUILU-choose-by-place','今天在家，明天外出，產品型態不一定要選同一種','仙加味小老闆在家與外出雙情境，依生活節奏選不同產品型態','pending_review'),
            ('09-organize-cabinet.webp','IMG-OFFICIAL-09-ORGANIZE-CABINET','XJW-SOCIAL-20260815-03-storage-basics','星期天整理櫃子，也順便看看龜鹿還剩多少','仙加味小老闆星期天整理櫃子與龜鹿產品庫存情境','pending_review'),
            ('10-office-warm-drink.webp','IMG-OFFICIAL-10-OFFICE-WARM','XJW-SOCIAL-20260815-01-warm-drink-moment','辦公桌上的一杯，也可以有不同選擇','仙加味小老闆辦公桌飲用情境，呈現30cc與180cc不同選擇','pending_review'),
            ('11-audience-needs.webp','IMG-OFFICIAL-11-AUDIENCE-NEEDS','POST-AUDIENCE-NEEDS','哪些人，會開始認識龜鹿系列？','常見生活情境與需求，協助顧客先理解龜鹿系列入門方向','pending_review'),
            ('12-trial-group-published.webp','IMG-OFFICIAL-12-TRIAL','POST-TRIAL-MAIN','龜鹿飲試喝組｜先試喝，再決定','龜鹿飲試喝組正式發布主圖','published'),
            ('13-brand-story-wanhua-published.webp','IMG-OFFICIAL-13-BRAND-STORY','POST-BRAND-START','仙加味，從萬華開始','仙加味品牌故事正式發布主圖','published')
          ]
          def q(v): return "'"+str(v).replace("'","''")+"'"
          manifest=[]
          for n,(file_name,media_id,post_id,title,alt,status) in enumerate(items,1):
            p=root/file_name; raw=p.read_bytes()
            with Image.open(p) as im:
              if im.format!='WEBP': raise SystemExit(f'not WEBP: {file_name}')
              w,h=im.size
            sha=hashlib.sha256(raw).hexdigest(); data=base64.b64encode(raw).decode('ascii')
            public_url=f'https://ts15825868.github.io/xianjiawei/images/posts/official-v20260818/{file_name}'
            media_url=f'/media/{media_id}'
            sql=[
              f"DELETE FROM media_assets WHERE id={q(media_id)};",
              "INSERT INTO media_assets(id,name,category,source_type,file_url,data_base64,mime_type,width,height,file_size,quality_status,approval_status,notes,created_by,created_at,updated_at,file_name,bytes) VALUES("+
              ",".join([q(media_id),q(file_name),q('貼文主圖'),q('official'),q(public_url),q(data),q('image/webp'),str(w),str(h),str(len(raw)),q('good'),q('approved'),q('2026-08-19正式13圖｜xianjiawei main SHA256精確綁定'),q(owner),'CURRENT_TIMESTAMP','CURRENT_TIMESTAMP',q(file_name),str(len(raw))])+');'
            ]
            platforms="platforms_json=CASE WHEN COALESCE(TRIM(platforms_json),'') IN ('','[]') THEN '[\"Facebook\",\"Instagram\",\"LINE VOOM\"]' ELSE platforms_json END"
            shared=f"image_url={q(media_url)},media_id={q(media_id)},image_alt={q(alt)},image_source={q('2026-08-19正式13圖｜xianjiawei main SHA256精確綁定')},image_width={w},image_height={h},image_bytes={len(raw)},{platforms},rejection_reason='',scheduled_at=NULL,proposed_scheduled_at=NULL,updated_at=CURRENT_TIMESTAMP"
            if status=='published':
              sql.append(f"UPDATE social_posts SET {shared},status='published',image_quality_status='published_approved',image_approved=1 WHERE id={q(post_id)};")
            else:
              sql.append(f"UPDATE social_posts SET {shared},status='pending_review',image_quality_status='candidate',image_approved=0,approved_by=NULL,approved_at=NULL WHERE id={q(post_id)};")
            (out/f'{n:02d}.sql').write_text('\n'.join(sql)+'\n',encoding='utf-8')
            manifest.append({'post_id':post_id,'title':title,'status':status,'media_id':media_id,'file':file_name,'bytes':len(raw),'width':w,'height':h,'sha256':sha,'image_url':media_url})
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Apply exact 13 formal media and post bindings to production D1
        shell: bash
        run: |
          set -euo pipefail
          for f in /tmp/official13-sql/{01..13}.sql; do
            echo "Applying $(basename "$f")"
            npx wrangler d1 execute xianjiawei-internal-db --remote --file="$f"
          done

      - name: Verify exact production D1 state
        shell: bash
        run: |
          set -euo pipefail
          IDS="'XJW-GUILU-drink30-work-break','XJW-GUILU-drink180-home','XJW-GUILU-gao-storage','XJW-GUILU-tangkuai-soup','XJW-GUILU-jiao-600g','XJW-GUILU-luerong-75g','XJW-SOCIAL-20260815-02-line-consult-and-trial','XJW-GUILU-choose-by-place','XJW-SOCIAL-20260815-03-storage-basics','XJW-SOCIAL-20260815-01-warm-drink-moment','POST-AUDIENCE-NEEDS','POST-TRIAL-MAIN','POST-BRAND-START'"
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,name,file_name,bytes,file_size,width,height,created_by,quality_status,approval_status FROM media_assets WHERE id LIKE 'IMG-OFFICIAL-%' ORDER BY id" > /tmp/media.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,status,platforms_json,image_url,image_approved,image_quality_status,media_id FROM social_posts WHERE id IN ($IDS) ORDER BY id" > /tmp/posts.json
          node - <<'NODE'
          const fs=require('fs');
          const rows=p=>{const x=JSON.parse(fs.readFileSync(p,'utf8'));return Array.isArray(x)&&x[0]?.results?x[0].results:(x?.results||x||[])};
          const media=rows('/tmp/media.json'),posts=rows('/tmp/posts.json'),expected=JSON.parse(fs.readFileSync('/tmp/official13-sql/manifest.json','utf8'));
          const byPost=Object.fromEntries(posts.map(p=>[p.id,p]));
          const byMedia=Object.fromEntries(media.map(m=>[m.id,m]));
          const problems=[];
          for(const e of expected){
            const p=byPost[e.post_id],m=byMedia[e.media_id];
            if(!m) problems.push(`${e.media_id}:missing-media`); else {
              if(Number(m.bytes)!==e.bytes||Number(m.file_size)!==e.bytes) problems.push(`${e.media_id}:wrong-bytes`);
              if(m.file_name!==e.file||m.name!==e.file) problems.push(`${e.media_id}:wrong-name`);
              if(!String(m.created_by||'').includes('@')) problems.push(`${e.media_id}:bad-owner-fk`);
              if(m.quality_status!=='good'||m.approval_status!=='approved') problems.push(`${e.media_id}:bad-media-status`);
            }
            if(!p) problems.push(`${e.post_id}:missing-post`); else {
              if(p.media_id!==e.media_id) problems.push(`${e.post_id}:wrong-media`);
              if(p.status!==e.status) problems.push(`${e.post_id}:wrong-status`);
              if(p.image_url!==e.image_url) problems.push(`${e.post_id}:wrong-url`);
              if(e.status==='published'&&Number(p.image_approved)!==1) problems.push(`${e.post_id}:published-not-approved`);
              if(e.status==='pending_review'&&Number(p.image_approved)!==0) problems.push(`${e.post_id}:pending-approved`);
              const platforms=JSON.parse(p.platforms_json||'[]');
              if(!Array.isArray(platforms)||platforms.length===0) problems.push(`${e.post_id}:empty-platforms`);
            }
          }
          const result={ok:media.length===13&&posts.length===13&&problems.length===0,version:'2026-08-19-official13-d1-live',media_count:media.length,post_count:posts.length,problems,posts,media,expected};
          console.log('XJW_D1_FIX_VERIFY='+JSON.stringify(result));
          if(!result.ok) process.exit(2);
          NODE
