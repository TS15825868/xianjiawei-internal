name: 仙加味13正式圖D1正式回填 20260819

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seed-official13-d1-push-v20260819.yml'
      - 'assets/data/seed-official13-d1-v20260819.trigger'
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install tools
        run: |
          python -m pip install --quiet pillow
          npm install --no-save wrangler@latest

      - name: Download and verify exact 13 formal images from website main
        shell: bash
        run: |
          set -euo pipefail
          root='/tmp/official13'
          rm -rf "$root" && mkdir -p "$root"
          names=(
            '01-work-30cc.webp' '02-home-180cc.webp' '03-gao-storage.webp'
            '04-tangkuai-soup.webp' '05-jiao-600g.webp' '06-lurong-75g.webp'
            '07-line-consult.webp' '08-home-out.webp' '09-organize-cabinet.webp'
            '10-office-warm-drink.webp' '11-audience-needs.webp'
            '12-trial-group-published.webp' '13-brand-story-wanhua-published.webp'
          )
          hashes=(
            '2126f7218e28840d691d3e7e9277e2e4b3877d7394d3fa1cc9454fce475fdb4d'
            'f346affa8e5387ba9323bb1cfaccacab739b06d5f45fdaa0f9c469d966a8b401'
            'd9072baa0d40dce6ab1dac9c750fac0badeee188c7f24558cedd97aff6c6c41f'
            'f9ad9d7b153ad8da3761b17e7bbacda268361f67986b88a7ca823224150e99a7'
            '4c2566ffcbdb0af564ebe8c6182ccc3c7d9e51b09c31f7238591052f5835a0bf'
            '0d0cbdf260af3f9d067205eba476d833d016ad85b16feb27e2bcf1f8c8c494de'
            'dc2ab1d8516eb1e133853ad40a8f8128ae6c154c31dba76b7e61d7266ada55e9'
            '17a75dff9fa92cbe164bb9e729ab6bcf49a8c5011c43b83f9f809d835856d38b'
            '4f93a8d1c948184b28dad6115708000e47968442eaf5be6f01b2c6ac23912132'
            '5d35292b7c18c5b1bfae7aebfb2b48b869aea948e4bbde2cba1329fab187ad2f'
            '30719042a9291b34eb34711dbbc022d7e8ea58a940d553aafc7e40896b6da70d'
            '47793954b2883aab287edefc1b059c033d1bb9be605df114ff16f0d90cbfe40f'
            'dad70a2120e5630e733c341993ef477c28bc5e06eef203a5c780bda72780f9cd'
          )
          sizes=(49620 53070 47502 50334 48654 46950 52640 50190 49092 49882 50280 57232 27672)
          for n in $(seq 1 13); do
            idx=$((n-1))
            f="${names[$idx]}"
            curl -LfsS --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 \
              "https://raw.githubusercontent.com/TS15825868/xianjiawei/main/images/posts/official-v20260818/$f" \
              -o "$root/$f"
            test "$(stat -c%s "$root/$f")" -eq "${sizes[$idx]}"
            echo "${hashes[$idx]}  $root/$f" | sha256sum -c -
          done

      - name: Build exact production D1 seed SQL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, json

          root=Path('/tmp/official13')
          items=[
            ('01-work-30cc.webp','IMG-OFFICIAL-01-WORK-30CC','XJW-GUILU-drink30-work-break','上班帶一罐，30cc不用把行程打亂','仙加味小老闆上班工作情境，手持30cc小玻璃裸罐','pending_review'),
            ('02-home-180cc.webp','IMG-OFFICIAL-02-HOME-180CC','XJW-GUILU-drink180-home','回到家，把180cc安排進自己的節奏','仙加味小老闆居家180cc鋁袋飲用情境','pending_review'),
            ('03-gao-storage.webp','IMG-OFFICIAL-03-GAO-STORAGE','XJW-GUILU-gao-storage','龜鹿膏開罐後，順手放進冰箱','仙加味小老闆把龜鹿膏100g開罐後放回冰箱保存','pending_review'),
            ('04-tangkuai-soup.webp','IMG-OFFICIAL-04-TANGKUAI-SOUP','XJW-GUILU-tangkuai-soup','今晚燉湯，把龜鹿湯塊安排進家常餐桌','仙加味小老闆家常燉湯情境與龜鹿湯塊盒','pending_review'),
            ('05-jiao-600g.webp','IMG-OFFICIAL-05-JIAO-600G','XJW-GUILU-jiao-600g','週末有時間，再慢慢認識龜鹿膠這種型態','仙加味小老闆週末認識龜鹿膠情境與龜鹿膠盒','pending_review'),
            ('06-lurong-75g.webp','IMG-OFFICIAL-06-LURONG-75G','XJW-GUILU-luerong-75g','下午想簡單一點，可以先認識鹿茸粉','仙加味小老闆午後認識鹿茸粉75g罐裝情境','pending_review'),
            ('07-line-consult.webp','IMG-OFFICIAL-07-LINE-CONSULT','XJW-SOCIAL-20260815-02-line-consult-and-trial','不知道怎麼選，先把你的日常告訴我們','仙加味小老闆以LINE諮詢協助依日常挑選產品','pending_review'),
            ('08-home-out.webp','IMG-OFFICIAL-08-HOME-OUT','XJW-GUILU-choose-by-place','今天在家，明天外出，產品型態不一定要選同一種','仙加味小老闆在家與外出雙情境，依生活節奏選不同產品型態','pending_review'),
            ('09-organize-cabinet.webp','IMG-OFFICIAL-09-ORGANIZE-CABINET','XJW-SOCIAL-20260815-03-storage-basics','星期天整理櫃子，也順便看看龜鹿還剩多少','仙加味小老闆星期天整理櫃子與龜鹿產品庫存情境','pending_review'),
            ('10-office-warm-drink.webp','IMG-OFFICIAL-10-OFFICE-WARM','XJW-SOCIAL-20260815-01-warm-drink-moment','辦公桌上的一杯，也可以有不同選擇','仙加味小老闆辦公桌飲用情境，呈現30cc與180cc不同選擇','pending_review'),
            ('11-audience-needs.webp','IMG-OFFICIAL-11-AUDIENCE-NEEDS','POST-AUDIENCE-NEEDS','哪些人，會開始認識龜鹿系列？','常見生活情境與需求，協助顧客先理解龜鹿系列入門方向','pending_review'),
            ('12-trial-group-published.webp','IMG-OFFICIAL-12-TRIAL','POST-TRIAL-MAIN','龜鹿飲試喝組｜先試喝，再決定','龜鹿飲試喝組正式發布主圖','published'),
            ('13-brand-story-wanhua-published.webp','IMG-OFFICIAL-13-BRAND-STORY','POST-BRAND-START','仙加味，從萬華開始','仙加味品牌故事正式發布主圖','published')
          ]
          def q(v): return "'"+str(v).replace("'","''")+"'"
          sql=['BEGIN;']
          sql.append("CREATE TABLE IF NOT EXISTS media_assets(id TEXT PRIMARY KEY,file_name TEXT NOT NULL DEFAULT '',mime_type TEXT NOT NULL DEFAULT 'image/jpeg',data_base64 TEXT NOT NULL DEFAULT '',bytes INTEGER NOT NULL DEFAULT 0,width INTEGER NOT NULL DEFAULT 0,height INTEGER NOT NULL DEFAULT 0,created_by TEXT NOT NULL DEFAULT '',created_at TEXT NOT NULL DEFAULT '');")
          sql.append("DELETE FROM media_assets WHERE id LIKE 'IMG-OFFICIAL-%';")
          owner="(SELECT email FROM profiles ORDER BY CASE WHEN role='owner' THEN 0 WHEN role='admin' THEN 1 ELSE 2 END,email LIMIT 1)"
          audience_copy='不只是某一個年齡層，很多人會從自己的生活節奏開始認識龜鹿系列。上班、運動、作息忙碌、日常飲食安排或年節送禮，都可以先從自己的使用情境與方便性來了解不同產品型態。第一次接觸不用急著選，先把平常在家或外出、偏好常溫或溫熱、是否想搭配家常料理等日常告訴仙加味，再慢慢挑適合自己的方式。'
          trial_copy='龜鹿飲試喝組｜先試喝，再決定。30cc小玻璃罐3罐試喝品免費，運費自付；7-11店到店60元、郵局宅配100元。每位顧客、電話及地址限申請一次。龜鹿飲接單後安排製作，約5～7個工作天出貨。試喝申請與正式下單皆由仙加味LINE OA完成。'
          sql.append(f"INSERT OR IGNORE INTO social_posts(id,title,headline,copy,category,platforms_json,status,scheduled_at,approved_by,approved_at,published_at,created_by,created_at,updated_at,image_url,image_alt,image_source,image_approved,image_width,image_height,image_bytes,image_quality_status,media_id,review_note,brand_check_json,rejection_reason,proposed_scheduled_at) SELECT 'POST-AUDIENCE-NEEDS','哪些人，會開始認識龜鹿系列？','哪些人，會開始認識龜鹿系列？',{q(audience_copy)},'生活節奏','[]','pending_review',NULL,NULL,NULL,NULL,{owner},CURRENT_TIMESTAMP,CURRENT_TIMESTAMP,'','','2026-08-19正式圖待綁定',0,0,0,0,'candidate',NULL,'','{{}}','',NULL WHERE EXISTS(SELECT 1 FROM profiles LIMIT 1);")
          sql.append(f"INSERT OR IGNORE INTO social_posts(id,title,headline,copy,category,platforms_json,status,scheduled_at,approved_by,approved_at,published_at,created_by,created_at,updated_at,image_url,image_alt,image_source,image_approved,image_width,image_height,image_bytes,image_quality_status,media_id,review_note,brand_check_json,rejection_reason,proposed_scheduled_at) SELECT 'POST-TRIAL-MAIN','龜鹿飲試喝組｜先試喝，再決定','龜鹿飲試喝組｜先試喝，再決定',{q(trial_copy)},'試喝申請','[\"Facebook\",\"Instagram\",\"LINE VOOM\"]','published',NULL,'owner',CURRENT_TIMESTAMP,CURRENT_TIMESTAMP,{owner},CURRENT_TIMESTAMP,CURRENT_TIMESTAMP,'','','2026-08-19正式發布圖待綁定',1,0,0,0,'published_approved',NULL,'','{{}}','',NULL WHERE EXISTS(SELECT 1 FROM profiles LIMIT 1);")
          audit=[]
          for file_name,media_id,post_id,title,alt,status in items:
              raw=(root/file_name).read_bytes()
              with Image.open(root/file_name) as im:
                  if im.format!='WEBP': raise SystemExit(f'not WEBP: {file_name}')
                  w,h=im.size
              data=base64.b64encode(raw).decode('ascii')
              sha=hashlib.sha256(raw).hexdigest()
              url=f'/media/{media_id}'
              sql.append(f"INSERT INTO media_assets(id,file_name,mime_type,data_base64,bytes,width,height,created_by,created_at) VALUES({q(media_id)},{q(file_name)},'image/webp',{q(data)},{len(raw)},{w},{h},'system:official13-20260819',CURRENT_TIMESTAMP);")
              if status=='published':
                  sql.append(f"UPDATE social_posts SET status='published',image_url={q(url)},media_id={q(media_id)},image_alt={q(alt)},image_source='2026-08-19正式發布圖｜xianjiawei main SHA256精確綁定',image_width={w},image_height={h},image_bytes={len(raw)},image_quality_status='published_approved',image_approved=1,scheduled_at=NULL,proposed_scheduled_at=NULL,rejection_reason='',updated_at=CURRENT_TIMESTAMP WHERE id={q(post_id)};")
              else:
                  sql.append(f"UPDATE social_posts SET status='pending_review',image_url={q(url)},media_id={q(media_id)},image_alt={q(alt)},image_source='2026-08-19正式圖｜xianjiawei main SHA256精確綁定',image_width={w},image_height={h},image_bytes={len(raw)},image_quality_status='candidate',image_approved=0,scheduled_at=NULL,proposed_scheduled_at=NULL,approved_by=NULL,approved_at=NULL,rejection_reason='',updated_at=CURRENT_TIMESTAMP WHERE id={q(post_id)};")
              audit.append({'post_id':post_id,'title':title,'status':status,'media_id':media_id,'file':file_name,'bytes':len(raw),'width':w,'height':h,'sha256':sha,'image_url':url})
          sql.append('COMMIT;')
          Path('/tmp/official13-seed.sql').write_text('\n'.join(sql)+'\n',encoding='utf-8')
          Path('/tmp/official13-expected.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Seed formal production D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/official13-seed.sql

      - name: Verify live D1 exact bindings and statuses
        shell: bash
        run: |
          set -euo pipefail
          IDS="'XJW-GUILU-drink30-work-break','XJW-GUILU-drink180-home','XJW-GUILU-gao-storage','XJW-GUILU-tangkuai-soup','XJW-GUILU-jiao-600g','XJW-GUILU-luerong-75g','XJW-SOCIAL-20260815-02-line-consult-and-trial','XJW-GUILU-choose-by-place','XJW-SOCIAL-20260815-03-storage-basics','XJW-SOCIAL-20260815-01-warm-drink-moment','POST-AUDIENCE-NEEDS','POST-TRIAL-MAIN','POST-BRAND-START'"
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,file_name,bytes,width,height FROM media_assets WHERE id LIKE 'IMG-OFFICIAL-%' ORDER BY id" > /tmp/media.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,status,image_url,image_approved,image_quality_status,media_id FROM social_posts WHERE id IN ($IDS) ORDER BY id" > /tmp/posts.json
          python - <<'PY'
          import json
          from pathlib import Path
          def rows(path):
              x=json.loads(Path(path).read_text())
              if isinstance(x,list) and x and isinstance(x[0],dict) and 'results' in x[0]: return x[0]['results']
              if isinstance(x,dict) and 'results' in x: return x['results']
              return x
          media=rows('/tmp/media.json'); posts=rows('/tmp/posts.json')
          expected=json.loads(Path('/tmp/official13-expected.json').read_text())
          if len(media)!=13: raise SystemExit(f'media count != 13: {len(media)}')
          if len(posts)!=13: raise SystemExit(f'post count != 13: {len(posts)}')
          by={p['id']:p for p in posts}
          for item in expected:
              p=by.get(item['post_id'])
              if not p: raise SystemExit(f"missing post {item['post_id']}")
              if p['media_id']!=item['media_id']: raise SystemExit(f"wrong media {item['post_id']} {p['media_id']}")
              if p['status']!=item['status']: raise SystemExit(f"wrong status {item['post_id']} {p['status']}")
              if item['status']=='published' and int(p['image_approved'] or 0)!=1: raise SystemExit(f"published not approved {item['post_id']}")
              if item['status']=='pending_review' and int(p['image_approved'] or 0)!=0: raise SystemExit(f"pending wrongly approved {item['post_id']}")
          result={'ok':True,'version':'2026-08-19-official13-d1-live','media_count':len(media),'post_count':len(posts),'posts':posts,'media':media,'expected':expected}
          Path('audits/official13-d1-live-20260819.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PASS production D1 media=13 posts=13 statuses exact')
          PY

      - name: Commit live verification to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audits/official13-d1-live-20260819.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(posts): record live official13 D1 verification'
          git pull --rebase origin main
          git push origin HEAD:main
