name: 仙加味11月10日單篇三平台發布回執正式對帳
on:
  push:
    branches: [main]
    paths:
      - 'ops/request-reconcile-owner-direct-published-20261110.json'
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node --check ops/reconcile-owner-direct-published-20261110.mjs
      - run: node ops/reconcile-owner-direct-published-20261110.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-direct-20261110-three-platforms-${{ github.run_id }}
          path: owner-direct-published-reconcile-result.json
          retention-days: 10
