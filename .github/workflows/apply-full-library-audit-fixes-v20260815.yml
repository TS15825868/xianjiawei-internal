name: 仙加味貼文中心全庫圖文檢查修正

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-full-library-audit-fixes-v20260815.mjs'
      - '.github/workflows/apply-full-library-audit-fixes-v20260815.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xianjiawei-full-library-audit-fixes
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply exact source patches
        run: node tools/apply-full-library-audit-fixes-v20260815.mjs
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          node --check src/publishing-content-audit-entry.js
          node --check src/publishing-review-gate-entry.js
          node --check assets/js/publishing-review-gate.js
          node --check tools/build-social-batches-review-seed.mjs
      - name: Commit durable fixes to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/publishing-content-audit-entry.js src/publishing-review-gate-entry.js assets/js/publishing-review-gate.js tools/build-social-batches-review-seed.mjs .github/workflows/deploy-cloudflare-publishing.yml
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix(publishing): enforce full-library copy and image uniqueness'
          git pull --rebase origin main
          git push origin HEAD:main
