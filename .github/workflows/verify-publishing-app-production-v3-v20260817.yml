name: 仙加味貼文中心 App 正式線上驗收 v3

on:
  push:
    branches: [main]
    paths:
      - 'assets/data/full-app-audit-v3-v20260817.trigger'
      - '.github/workflows/verify-publishing-app-production-v3-v20260817.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Full App source and guard validation
        run: |
          npm run check
          npm run guard:full
          npm run build:static
      - name: Verify complete App function contracts and anti-collage gates
        shell: bash
        run: |
          set -euo pipefail
          for token in 'data-diagnose' 'data-refresh' 'data-add-post' 'id="searchInput"' 'id="statusFilter"'; do grep -q "$token" dist/publishing.html; done
          for token in '/publish-now' '/deliveries' 'data-post-edit' 'data-post-schedule' 'data-load-more'; do grep -q "$token" dist/assets/js/publishing-app-v2.js; done
          for token in '16項完整圖文審核' 'copyImageMatch' '完整成圖／非拼湊／不重複' '產品比例尺寸' '冷熱' '表情' '動作' 'fullLibraryAudit:true' 'strictUniqueImagePerPost:true'; do grep -q "$token" dist/assets/js/publishing-review-gate.js; done
          for token in 'regeneration-start' 'regeneration-ready' '禁止拼貼' 'AI絕對不得重畫'; do grep -q "$token" dist/assets/js/post-regenerate-policy-v1.js; done
          grep -q 'media-upload' src/publishing-only-entry.js
          grep -q 'semanticImageMatchRequired:true' src/publishing-only-entry.js
          grep -q 'fullLibraryAudit:true' src/publishing-content-audit-entry.js
          echo 'PASS all App function contracts and complete/non-collage content gates'
      - name: Verify exact production D1 10-post library and pairing
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,headline,copy,category,status,image_url,image_alt,image_source,image_approved,scheduled_at,platforms_json FROM social_posts WHERE status<>'archived' ORDER BY scheduled_at,created_at,id" >/tmp/live.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/live.json','utf8')); const rows=raw.flatMap(x=>x?.results||[]); const active=rows.filter(r=>r.status!=='published');
          const expected={
          'XJW-GUILU-drink30-work-break':'XJW-GUILU-drink30-work-break.webp',
          'XJW-SOCIAL-20260815-03-storage-basics':'XJW-SOCIAL-20260815-03-storage-basics.webp',
          'XJW-SOCIAL-20260815-01-warm-drink-moment':'XJW-SOCIAL-20260815-01-warm-drink-moment.webp',
          'XJW-GUILU-tangkuai-soup':'XJW-GUILU-tangkuai-soup.webp',
          'XJW-GUILU-jiao-600g':'XJW-GUILU-jiao-600g.webp',
          'XJW-SOCIAL-20260815-02-line-consult-and-trial':'XJW-SOCIAL-20260815-02-line-consult-and-trial.webp',
          'XJW-GUILU-drink180-home':'XJW-GUILU-drink180-home.webp',
          'XJW-GUILU-luerong-75g':'XJW-GUILU-luerong-75g.webp',
          'XJW-GUILU-choose-by-place':'XJW-GUILU-choose-by-place.webp',
          'XJW-GUILU-gao-storage':'XJW-GUILU-gao-storage.webp'};
          if(active.length!==10)throw new Error(`active nonpublished ${active.length}/10`);
          const byId=new Map(active.map(r=>[r.id,r]));
          for(const [id,file] of Object.entries(expected)){
            const r=byId.get(id); if(!r)throw new Error(`missing ${id}`);
            if(r.status!=='scheduled')throw new Error(`${id} status ${r.status}`);
            if(+r.image_approved!==1)throw new Error(`${id} image not approved`);
            if(!r.title?.trim()||!r.copy?.trim()||!r.image_url?.trim()||!r.image_alt?.trim()||!r.scheduled_at)throw new Error(`${id} incomplete`);
            if(!r.image_url.includes('/images/posts/priority10-v20260817/')||!r.image_url.includes(file))throw new Error(`${id} image pairing mismatch`);
            const src=String(r.image_source||'');
            if(!/使用者.*確認.*正式10圖|使用者確認之正式10圖|老闆.*確認圖|approved/i.test(src))throw new Error(`${id} unapproved source: ${src}`);
          }
          if(new Set(active.map(r=>r.image_url.split('?')[0])).size!==10)throw new Error('duplicate image');
          if(new Set(active.map(r=>r.copy)).size!==10)throw new Error('duplicate copy');
          for(const id of ['XJW-GUILU-drink30-work-break','XJW-GUILU-drink180-home','XJW-SOCIAL-20260815-01-warm-drink-moment','XJW-SOCIAL-20260815-02-line-consult-and-trial'])if(!byId.get(id).copy.includes('常溫'))throw new Error(`${id} no room temp rule`);
          if(!byId.get('XJW-GUILU-tangkuai-soup').copy.includes('藍色盒裝'))throw new Error('湯塊藍盒 missing');
          if(!byId.get('XJW-GUILU-jiao-600g').copy.includes('紫色盒裝'))throw new Error('龜鹿膠紫盒 missing');
          if(!byId.get('XJW-GUILU-gao-storage').copy.includes('冷藏'))throw new Error('龜鹿膏冷藏 missing');
          const blocked=['台興山產','TODO','placeholder','假資料','測試資料','內部作業','GitHub','Worker','D1','API Token'];
          for(const r of active){const v=[r.title,r.headline,r.copy,r.image_alt].join(' ');const hit=blocked.find(x=>v.includes(x));if(hit)throw new Error(`${r.id}: ${hit}`)}
          fs.writeFileSync('/tmp/image-urls.txt',active.map(r=>r.image_url).join('\n')+'\n');
          console.log('PASS exact current 10 posts + unique copy/image + exact filename pairing + product rules');
          NODE
      - name: Verify all current post images online
        shell: bash
        run: |
          set -euo pipefail
          i=0
          while IFS= read -r u; do i=$((i+1)); h="/tmp/h$i"; f="/tmp/f$i"; curl -fsSL --retry 5 --retry-delay 2 --max-time 25 -D "$h" -o "$f" "$u"; b=$(wc -c <"$f"); test "$b" -ge 30000; grep -Eiq '^content-type:[[:space:]]*image/' "$h"; echo "$i $b $u"; done </tmp/image-urls.txt
          test "$i" -eq 10
          echo 'PASS online images 10/10 reachable and non-placeholder-size'
      - name: Verify Cloudflare Access, D1, platform config and live App routes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          domain='xianjiawei-internal.tung314069.workers.dev'
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps?domain=$domain&exact=true&per_page=50" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' >/tmp/a.json
          node - <<'NODE'
          const b=JSON.parse(require('fs').readFileSync('/tmp/a.json'));if(b.success!==true)throw Error('Access API failure');const d='xianjiawei-internal.tung314069.workers.dev';const a=(b.result||[]).filter(x=>String(x.domain||'').replace(/^https?:\/\//,'').replace(/\/$/,'')===d);if(a.length!==1)throw Error(`Access app ${a.length}`);if(a[0].aud!=='201dea08ea9611989cd8ad4ccac88f99974fd9b1309e4af74bf11a397ee6522f')throw Error('AUD mismatch');console.log('PASS Access')
          NODE
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT 1 AS ok"
          base='https://xianjiawei-internal.tung314069.workers.dev'
          for p in '/' '/publishing' '/publishing/' '/publishing.html' '/healthz/core'; do body=$(mktemp); result=$(curl -LsS --max-redirs 6 --max-time 25 -o "$body" -w '%{http_code} %{num_redirects} %{url_effective}' "$base$p"); code=${result%% *}; rest=${result#* }; redirects=${rest%% *}; echo "$p -> $result"; test "$code" -ge 200; test "$code" -lt 500; test "$redirects" -le 1; grep -Eiq '貼文中心系統 App|唯一正式內容系統|cloudflare|access|sign in|login' "$body"; done
          echo 'PASS Cloudflare Access/D1/live App boundary/no redirect storm'
