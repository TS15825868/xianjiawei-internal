name: 仙加味新版貼文產品實物完整性補強

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-rebuild-product-coverage-v20260816.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Ensure explicit drink posts show both formal drink formats
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='audits/full-rebuild-manifest-current.json';
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          const map=new Map(m.posts.map(x=>[x.id,x]));
          const fixes={
            'POST-DRINK':['drink30','drink180'],
            'XJW-SOCIAL-20260815-01-warm-drink':['drink30','drink180']
          };
          for(const [id,products] of Object.entries(fixes)){
            const row=map.get(id); if(!row)throw new Error(`missing ${id}`); row.products=products;
          }
          m.version='2026-08-16-full-rebuild-v3-reference-locked-product-covered';
          fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');
          for(const [id,products] of Object.entries(fixes)){
            const row=map.get(id); if(JSON.stringify(row.products)!==JSON.stringify(products))throw new Error(`failed ${id}`);
          }
          console.log('PASS explicit drink posts now use formal 30cc + 180cc product artwork');
          NODE
      - name: Commit manifest patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audits/full-rebuild-manifest-current.json
          git commit -m 'fix(posts): show formal 30cc and 180cc on explicit drink posts'
          git pull --rebase origin main
          git push origin HEAD:main
