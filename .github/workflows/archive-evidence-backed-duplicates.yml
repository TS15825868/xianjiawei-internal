name: 仙加味精準封存兩篇歷史同角度舊稿（保留證據）
on:
  push:
    branches: [main]
    paths:
      - 'ops/archive-duplicate-posts-request.json'
permissions:
  contents: read
concurrency:
  group: xjw-archive-two-evidence-backed-duplicate-topics
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Assert exact archival scope and evidence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const req=require('./ops/archive-duplicate-posts-request.json');
          const m=require('./ops/archive-evidence-backed-duplicates-20261105.json');
          const proof=require('./ops/verified-historical-editorial-overlap-20261105.json');
          assert.equal(req.action,'archive_exact_two_pending_editorial_duplicates');
          assert.equal(req.publish,false);assert.equal(req.delete,false);assert.equal(req.approve,false);
          assert.equal(m.dataAction,'archive_only_no_delete_no_publish');
          assert.deepEqual(m.items.map(x=>x.id).sort(),[
            'XJW-CONV-chat-gao-vs-drink','XJW-CONV-year-end-keep-habit'].sort());
          for(const x of m.items){const found=proof.findings.find(z=>z.pendingId===x.id);assert.equal(found.assessment.includes('high_risk'),true);assert.ok(found.history?.some(z=>z.permalink?.startsWith('https://www.facebook.com/')))}
          console.log('PASS: only two documented duplicate-angle pending posts can be archived');
          NODE
      - name: Install existing Wrangler
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Read live D1 posts and status counts before change
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,copy,image_url,status,scheduled_at,proposed_scheduled_at,approved_by,approved_at,published_at,image_approved,review_note FROM social_posts WHERE id IN ('XJW-CONV-chat-gao-vs-drink','XJW-CONV-year-end-keep-habit')" > /tmp/archival-preflight.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT status, COUNT(*) AS n FROM social_posts GROUP BY status" > /tmp/archival-before-counts.json
      - name: Fail closed if live content or approval no longer matches
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const m=require('./ops/archive-evidence-backed-duplicates-20261105.json');
          const data=JSON.parse(fs.readFileSync('/tmp/archival-preflight.json','utf8'));
          const rows=(Array.isArray(data)?data[0]?.results:data.results)||[];
          assert.equal(rows.length,2,'both live post rows required');
          const byId=new Map(rows.map(x=>[x.id,x]));
          const q=x=>"'"+String(x??'').replaceAll("'","''")+"'";
          const sql=[];
          for(const old of m.items){
            const row=byId.get(old.id);
            assert.ok(row);assert.equal(row.status,'pending_review');
            assert.equal(row.title,old.title);assert.equal(row.copy,old.sourceCopy);
            assert.equal(row.image_url,old.sourceImageUrl);
            assert.equal(row.scheduled_at,null);assert.equal(row.approved_by,null);
            assert.equal(row.approved_at,null);assert.equal(row.published_at,null);
            assert.equal(Number(row.image_approved||0),0);
            const note='依使用者指示封存與正式歷史同角度重複貼文；保留原始文圖及審核紀錄；未核准未排程未發布';
            sql.push("UPDATE social_posts SET status='archived',proposed_scheduled_at=NULL,updated_at=CURRENT_TIMESTAMP,review_note="+q(note)+" WHERE id="+q(old.id)+" AND status='pending_review' AND title="+q(old.title)+" AND copy="+q(old.sourceCopy)+" AND image_url="+q(old.sourceImageUrl)+" AND scheduled_at IS NULL AND approved_by IS NULL AND approved_at IS NULL AND published_at IS NULL AND image_approved=0;");
          }
          fs.writeFileSync('/tmp/xjw-archive-only-two.sql',sql.join('\n')+'\n');
          console.log('PASS: both live D1 rows match historical evidence; 2 exact CAS archive statements built');
          NODE
      - name: Archive exactly two non-approved duplicate-angle posts
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --file /tmp/xjw-archive-only-two.sql > /tmp/archive-response.json
      - name: Readback and check full D1 status totals unchanged except 2 archived
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,copy,image_url,status,scheduled_at,proposed_scheduled_at,approved_by,approved_at,published_at,image_approved,review_note FROM social_posts WHERE id IN ('XJW-CONV-chat-gao-vs-drink','XJW-CONV-year-end-keep-habit')" > /tmp/archive-after.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT status, COUNT(*) AS n FROM social_posts GROUP BY status" > /tmp/archival-after-counts.json
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const read=p=>{const x=JSON.parse(fs.readFileSync(p,'utf8'));return(Array.isArray(x)?x[0]?.results:x.results)||[]};
          const before=Object.fromEntries(read('/tmp/archival-before-counts.json').map(x=>[x.status,Number(x.n)]));
          const after=Object.fromEntries(read('/tmp/archival-after-counts.json').map(x=>[x.status,Number(x.n)]));
          const items=require('./ops/archive-evidence-backed-duplicates-20261105.json').items;
          const actual=read('/tmp/archive-after.json');
          assert.equal(actual.length,2);
          for(const expected of items){
            const r=actual.find(x=>x.id===expected.id);
            assert.ok(r);assert.equal(r.status,'archived');
            assert.equal(r.title,expected.title);assert.equal(r.copy,expected.sourceCopy);assert.equal(r.image_url,expected.sourceImageUrl);
            assert.equal(r.proposed_scheduled_at,null);assert.equal(r.scheduled_at,null);
            assert.equal(r.approved_by,null);assert.equal(r.approved_at,null);assert.equal(r.published_at,null);
            assert.equal(Number(r.image_approved||0),0);assert.match(r.review_note||'',/依使用者指示封存/);
          }
          assert.equal(after.pending_review,before.pending_review-2);
          assert.equal(after.archived,before.archived+2);
          for(const k of new Set([...Object.keys(before),...Object.keys(after)])){
            if(k!=='pending_review'&&k!=='archived')assert.equal(after[k]||0,before[k]||0,'non-target status changed: '+k);
          }
          const result={schema:'xjw-archive-two-evidence-backed-overlap-receipt-v1',checkedAt:new Date().toISOString(),affected:2,ids:items.map(x=>x.id),
            before,after,status:'archived',deleted:0,published:0,scheduled:0,approvals:0,originalMediaPreserved:true,
            historicPublishedMediaPreserved:true,metricoolUnchanged:true,requiresDistinctNewSubjectAndImage:true};
          fs.writeFileSync('evidence-archive-two-overlaps.json',JSON.stringify(result,null,2)+'\n');
          console.log('XJW_ARCHIVE_RECEIPT '+JSON.stringify({archived:2,deleted:0,published:0,scheduled:0,before,after}));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xjw-two-editorial-archives-${{ github.run_id }}
          path: evidence-archive-two-overlaps.json
          retention-days: 3
          if-no-files-found: warn
