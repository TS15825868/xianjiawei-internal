name: One-shot audit social copy
on:
  push:
    paths:
      - '.github/workflows/one-shot-audit-social-copy-v20260815.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Export and audit social posts
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,headline,copy,category,status,image_url,image_alt,image_source,created_at,updated_at FROM social_posts WHERE status <> 'archived' ORDER BY created_at,id" > /tmp/posts.json
          python - <<'PY'
          import json,re,unicodedata,difflib
          raw=json.load(open('/tmp/posts.json'))
          rows=[]
          for block in raw:
              rows.extend(block.get('results') or [])
          def norm(s):
              s=unicodedata.normalize('NFKC',str(s or '')).lower()
              s=re.sub(r'https?://\S+','',s)
              s=re.sub(r'[\s\W_]+','',s,flags=re.UNICODE)
              s=s.replace('仙加味補養是一種節奏','')
              return s
          def core_copy(s):
              s=str(s or '')
              s=re.sub(r'仙加味\s*[｜|]?\s*補養，是一種節奏。?','',s)
              return norm(s)
          exact={}
          titles={}
          for r in rows:
              k=core_copy(r.get('copy'))
              if k: exact.setdefault(k,[]).append(r)
              tk=norm(r.get('title'))
              if tk: titles.setdefault(tk,[]).append(r)
          print('TOTAL',len(rows))
          print('\n=== EXACT COPY DUPLICATES ===')
          for g in exact.values():
              if len(g)>1:
                  print('GROUP')
                  for r in g: print(r['status'],r['id'],'|',r['title'])
          print('\n=== SAME TITLE GROUPS ===')
          for g in titles.values():
              if len(g)>1:
                  print('GROUP')
                  for r in g: print(r['status'],r['id'],'|',r['title'])
          active=[r for r in rows if r.get('status') in ('draft','pending_review')]
          print('\n=== NEAR DUPLICATES >= 0.88 ===')
          seen=set()
          for i,a in enumerate(active):
              ac=core_copy(a.get('copy'))
              if len(ac)<40: continue
              for b in active[i+1:]:
                  bc=core_copy(b.get('copy'))
                  if len(bc)<40: continue
                  ratio=difflib.SequenceMatcher(None,ac,bc).ratio()
                  if ratio>=0.88:
                      key=tuple(sorted((a['id'],b['id'])))
                      if key in seen: continue
                      seen.add(key)
                      print(f'{ratio:.3f}',a['status'],a['id'],'|',a['title'],' <=> ',b['status'],b['id'],'|',b['title'])
          terms=[
            '待審核','16項','人工審核','審核','核准','草稿','排程','發布中心','貼文中心','內部','erp','products-v3','產品身份','校正','守門員','母庫','資料庫','d1','worker','github','workflow','正式版','最新確認','目前正式','正式產品原圖','正式比例','正式包裝','網站同款','q版小老闆','系統','測試','debug','todo','placeholder','假資料','候選圖','回填','重新生成','chatgpt'
          ]
          print('\n=== CUSTOMER COPY LEAKAGE CANDIDATES ===')
          for r in rows:
              text=' '.join(str(r.get(k) or '') for k in ('title','headline','copy'))
              hits=[t for t in terms if t.lower() in text.lower()]
              if hits:
                  print(r['status'],r['id'],'|',r['title'],'| hits=',','.join(hits))
                  print('  ',re.sub(r'\s+',' ',text)[:420])
          print('\n=== MISSING / SUSPICIOUS MEDIA ===')
          for r in rows:
              if r.get('status') in ('draft','pending_review') and (not r.get('image_url') or not r.get('image_alt')):
                  print(r['status'],r['id'],'|',r['title'],'| image=',bool(r.get('image_url')),'alt=',bool(r.get('image_alt')))
          PY