name: 仙加味貼文核准與外部排程唯讀稽核
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/current-scheduling-eligibility-audit.yml'
permissions:
  contents: read
concurrency:
  group: xianjiawei-scheduling-readonly-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Read D1 status and human approval flags without post content or mutation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT status,COUNT(*) AS count,SUM(CASE WHEN image_approved=1 AND TRIM(COALESCE(image_url,''))<>'' THEN 1 ELSE 0 END) AS has_approved_image,SUM(CASE WHEN approved_at IS NOT NULL AND TRIM(COALESCE(approved_by,''))<>'' THEN 1 ELSE 0 END) AS has_approval_record,SUM(CASE WHEN approved_at IS NOT NULL AND TRIM(COALESCE(approved_by,''))<>'' AND image_approved=1 AND TRIM(COALESCE(image_url,''))<>'' THEN 1 ELSE 0 END) AS image_posts_with_approval_evidence, SUM(CASE WHEN approved_at IS NOT NULL AND TRIM(COALESCE(approved_by,''))<>'' AND (image_approved<>1 OR TRIM(COALESCE(image_url,''))='') THEN 1 ELSE 0 END) AS text_only_candidates_require_platform_review,SUM(CASE WHEN scheduled_at IS NOT NULL AND TRIM(scheduled_at)<>'' THEN 1 ELSE 0 END) AS has_scheduled_at FROM social_posts GROUP BY status ORDER BY status" > /tmp/social-status-audit.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT state,COUNT(*) AS count,SUM(CASE WHEN metricool_id IS NOT NULL THEN 1 ELSE 0 END) AS with_metricool_id FROM social_metricool_sync GROUP BY state ORDER BY state" > /tmp/metricool-link-audit.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS approved_no_external_sync FROM social_posts p LEFT JOIN social_metricool_sync m ON m.post_id=p.id WHERE p.status='approved' AND m.post_id IS NULL" > /tmp/missing-link-audit.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT p.status,COUNT(*) AS count,SUM(CASE WHEN g.post_id IS NOT NULL THEN 1 ELSE 0 END) AS with_review_gate,SUM(CASE WHEN g.post_id IS NOT NULL AND g.copy_image_match=1 AND LENGTH(TRIM(COALESCE(g.reviewed_by,'')))>4 AND TRIM(COALESCE(g.reviewed_at,''))<>'' THEN 1 ELSE 0 END) AS with_review_evidence FROM social_posts p LEFT JOIN social_post_review_gates g ON g.post_id=p.id GROUP BY p.status ORDER BY p.status" > /tmp/review-gates-audit.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS count,SUM(CASE WHEN approved_at IS NULL OR TRIM(approved_at)='' THEN 1 ELSE 0 END) AS no_time,SUM(CASE WHEN approved_by IS NULL OR TRIM(approved_by)='' THEN 1 ELSE 0 END) AS no_user,SUM(CASE WHEN (approved_at IS NULL OR TRIM(approved_at)='') AND (approved_by IS NULL OR TRIM(approved_by)='') THEN 1 ELSE 0 END) AS neither FROM social_posts WHERE status='approved'" > /tmp/approval-field-audit.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS total,COUNT(DISTINCT g.reviewed_by) AS distinct_reviewers,SUM(CASE WHEN INSTR(COALESCE(g.reviewed_by,''),'@')>0 THEN 1 ELSE 0 END) AS email_shaped,SUM(CASE WHEN EXISTS(SELECT 1 FROM profiles x WHERE x.email=g.reviewed_by) THEN 1 ELSE 0 END) AS profile_exists,SUM(CASE WHEN EXISTS(SELECT 1 FROM profiles x WHERE x.email=g.reviewed_by AND x.active=1 AND x.role IN ('owner','admin','content')) THEN 1 ELSE 0 END) AS active_reviewer,SUM(CASE WHEN LOWER(g.reviewed_by) LIKE 'ai:%' OR LOWER(g.reviewed_by) LIKE 'bot:%' THEN 1 ELSE 0 END) AS ai_prefix FROM social_posts p JOIN social_post_review_gates g ON g.post_id=p.id WHERE p.status='approved'" > /tmp/reviewer-identity-audit.json
          node - <<'NODE'
          const fs=require('fs');
          function rows(path) {
            const v=JSON.parse(fs.readFileSync(path,'utf8'));
            return (Array.isArray(v)?v[0]?.results:v?.results)||[];
          }
          const posts=rows('/tmp/social-status-audit.json');
          const metrics=rows('/tmp/metricool-link-audit.json');
          const missing=rows('/tmp/missing-link-audit.json')[0]||{};
          const reviewGates=rows('/tmp/review-gates-audit.json');
          const missingFields=rows('/tmp/approval-field-audit.json');
          const reviewerIdentity=rows('/tmp/reviewer-identity-audit.json');
          const total=posts.reduce((s,x)=>s+Number(x.count||0),0);
          if(total===0) throw new Error('找不到貼文資料，停止判斷');
          console.log('D1 social_posts totals and review eligibility:',JSON.stringify(posts));
          console.log('D1 metricool sync state totals:',JSON.stringify(metrics));
          console.log('Approved posts without Metricool mapping:',Number(missing.approved_no_external_sync||0));
          console.log('Human review gate evidence totals:',JSON.stringify(reviewGates));
          console.log('Approved metadata missing fields:',JSON.stringify(missingFields));
          console.log('Reviewer identity shape only (no emails):',JSON.stringify(reviewerIdentity));
          console.log('Text-only candidates are NOT automatically eligible: Facebook/Threads only after human review; Instagram needs media.');
          console.log('Audit is read only. Counts are not proof of real-time autoPublish settings.');
          NODE
