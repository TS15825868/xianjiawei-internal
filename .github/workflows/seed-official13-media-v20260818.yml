name: 回填貼文中心13張正式圖 20260818

on:
  push:
    branches: [main]
    paths:
      - 'assets/data/seed-official13-media-v20260818.trigger'
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install tools
        run: |
          python -m pip install --quiet pillow
          npm install --no-save wrangler@latest
      - name: Restore verified 13-image package from website repo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, urllib.request
          from pathlib import Path
          api='https://api.github.com/repos/TS15825868/xianjiawei/contents/assets/staging/official13-b64?ref=main'
          req=urllib.request.Request(api,headers={'User-Agent':'xianjiawei-official13-seeder'})
          with urllib.request.urlopen(req,timeout=30) as r:
              rows=json.load(r)
          parts=sorted([x for x in rows if x.get('name','').startswith('part') and x.get('name','').endswith('.txt')],key=lambda x:x['name'])
          if not parts:
              raise SystemExit('找不到 official13 base64 parts')
          payload=''
          for row in parts:
              req=urllib.request.Request(row['download_url'],headers={'User-Agent':'xianjiawei-official13-seeder'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  payload += r.read().decode('utf-8').strip()
          raw=base64.b64decode(''.join(payload.split()))
          if len(raw)!=635488:
              raise SystemExit(f'official13 zip size mismatch: {len(raw)}')
          sha=hashlib.sha256(raw).hexdigest()
          if sha!='d1903805811b476b0ada677727f23b5d68f79ee334c6b6cb93303c285aeb5f3c':
              raise SystemExit(f'official13 zip sha mismatch: {sha}')
          Path('/tmp/official13.zip').write_bytes(raw)
          print('verified parts',len(parts),'size',len(raw),'sha256',sha)
          PY
          rm -rf /tmp/official13
          mkdir -p /tmp/official13
          unzip -q /tmp/official13.zip -d /tmp/official13
      - name: Build exact D1 seed SQL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, json

          root=Path('/tmp/official13')
          items=[
            ('01-work-30cc.webp','IMG-OFFICIAL-01-WORK-30CC','XJW-GUILU-drink30-work-break','上班帶一罐，30cc不用把行程打亂','仙加味小老闆上班工作情境，手持30cc小玻璃裸罐','pending_review'),
            ('02-home-180cc.webp','IMG-OFFICIAL-02-HOME-180CC','XJW-GUILU-drink180-home','回到家，把180cc安排進自己的節奏','仙加味小老闆居家180cc鋁袋飲用情境','pending_review'),
            ('03-gao-storage.webp','IMG-OFFICIAL-03-GAO-STORAGE','XJW-GUILU-gao-storage','龜鹿膏開罐後，順手放進冰箱','仙加味小老闆把龜鹿膏100g開罐後放回冰箱保存','pending_review'),
            ('04-tangkuai-soup.webp','IMG-OFFICIAL-04-TANGKUAI-SOUP','XJW-GUILU-tangkuai-soup','今晚燉湯，把龜鹿湯塊安排進家常餐桌','仙加味小老闆家常燉湯情境與龜鹿湯塊盒','pending_review'),
            ('05-jiao-600g.webp','IMG-OFFICIAL-05-JIAO-600G','XJW-GUILU-jiao-600g','週末有時間，再慢慢認識龜鹿膠這種型態','仙加味小老闆週末認識龜鹿膠情境與龜鹿膠盒','pending_review'),
            ('06-lurong-75g.webp','IMG-OFFICIAL-06-LURONG-75G','XJW-GUILU-luerong-75g','下午想簡單一點，可以先認識鹿茸粉','仙加味小老闆午後認識鹿茸粉75g罐裝情境','pending_review'),
            ('07-line-consult.webp','IMG-OFFICIAL-07-LINE-CONSULT','XJW-SOCIAL-20260815-02-line-consult-and-trial','不知道怎麼選，先把你的日常告訴我們','仙加味小老闆以LINE諮詢協助依日常挑選產品','pending_review'),
            ('08-home-out.webp','IMG-OFFICIAL-08-HOME-OUT','XJW-GUILU-choose-by-place','今天在家，明天外出，產品型態不一定要選同一種','仙加味小老闆在家與外出雙情境，依生活節奏選不同產品型態','pending_review'),
            ('09-organize-cabinet.webp','IMG-OFFICIAL-09-ORGANIZE-CABINET','XJW-SOCIAL-20260815-03-storage-basics','星期天整理櫃子，也順便看看龜鹿還剩多少','仙加味小老闆星期天整理櫃子與龜鹿產品庫存情境','pending_review'),
            ('10-office-warm-drink.webp','IMG-OFFICIAL-10-OFFICE-WARM','XJW-SOCIAL-20260815-01-warm-drink-moment','辦公桌上的一杯，也可以有不同選擇','仙加味小老闆辦公桌飲用情境，呈現30cc與180cc不同選擇','pending_review'),
            ('11-audience-needs.webp','IMG-OFFICIAL-11-AUDIENCE-NEEDS','POST-AUDIENCE-NEEDS','哪些人，會開始認識龜鹿系列？','常見生活情境與需求，協助顧客先理解龜鹿系列入門方向','pending_review'),
            ('12-trial-group-published.webp','IMG-OFFICIAL-12-TRIAL','POST-TRIAL-MAIN','龜鹿飲試喝組｜先試喝，再決定','龜鹿飲試喝組正式發布主圖','published'),
            ('13-brand-story-wanhua-published.webp','IMG-OFFICIAL-13-BRAND-STORY','POST-BRAND-START','仙加味，從萬華開始','仙加味品牌故事正式發布主圖','published'),
          ]
          found=sorted(p.name for p in root.glob('*.webp'))
          expected=sorted(x[0] for x in items)
          if found!=expected:
              raise SystemExit(f'13圖檔案不一致: {found}')

          def q(value):
              return "'"+str(value).replace("'","''")+"'"
          origin='https://xianjiawei-internal.tung314069.workers.dev'
          sql=['BEGIN;']
          sql.append("CREATE TABLE IF NOT EXISTS media_assets(id TEXT PRIMARY KEY,file_name TEXT NOT NULL DEFAULT '',mime_type TEXT NOT NULL DEFAULT 'image/jpeg',data_base64 TEXT NOT NULL DEFAULT '',bytes INTEGER NOT NULL DEFAULT 0,width INTEGER NOT NULL DEFAULT 0,height INTEGER NOT NULL DEFAULT 0,created_by TEXT NOT NULL DEFAULT '',created_at TEXT NOT NULL DEFAULT '');")
          owner_expr="(SELECT email FROM profiles ORDER BY CASE WHEN role='owner' THEN 0 WHEN role='admin' THEN 1 ELSE 2 END,email LIMIT 1)"

          # Ensure the two missing formal post records exist. Existing rows are never replaced here.
          audience_copy='不只是某一個年齡層，很多人會從自己的生活節奏開始認識龜鹿系列。上班、運動、作息忙碌、日常飲食安排或年節送禮，都可以先從自己的使用情境與方便性來了解不同產品型態。第一次接觸不用急著選，先把平常在家或外出、偏好常溫或溫熱、是否想搭配家常料理等日常告訴仙加味，再慢慢挑適合自己的方式。'
          trial_copy='龜鹿飲試喝組｜先試喝，再決定。30cc小玻璃罐3罐試喝品免費，運費自付；7-11店到店60元、郵局宅配100元。每位顧客、電話及地址限申請一次。龜鹿飲接單後安排製作，約5～7個工作天出貨。試喝申請與正式下單皆由仙加味LINE OA完成。'
          sql.append(f"INSERT OR IGNORE INTO social_posts(id,title,headline,copy,category,platforms_json,status,scheduled_at,approved_by,approved_at,published_at,created_by,created_at,updated_at,image_url,image_alt,image_source,image_approved,image_width,image_height,image_bytes,image_quality_status,media_id,review_note,brand_check_json,rejection_reason,proposed_scheduled_at) SELECT 'POST-AUDIENCE-NEEDS','哪些人，會開始認識龜鹿系列？','哪些人，會開始認識龜鹿系列？',{q(audience_copy)},'生活節奏','[]','pending_review',NULL,NULL,NULL,NULL,{owner_expr},CURRENT_TIMESTAMP,CURRENT_TIMESTAMP,'','','2026-08-18 使用者確認正式新圖',0,0,0,0,'candidate',NULL,'','{{}}','',NULL WHERE EXISTS(SELECT 1 FROM profiles LIMIT 1);")
          sql.append(f"INSERT OR IGNORE INTO social_posts(id,title,headline,copy,category,platforms_json,status,scheduled_at,approved_by,approved_at,published_at,created_by,created_at,updated_at,image_url,image_alt,image_source,image_approved,image_width,image_height,image_bytes,image_quality_status,media_id,review_note,brand_check_json,rejection_reason,proposed_scheduled_at) SELECT 'POST-TRIAL-MAIN','龜鹿飲試喝組｜先試喝，再決定','龜鹿飲試喝組｜先試喝，再決定',{q(trial_copy)},'試喝申請','[\"Facebook\",\"Instagram\",\"LINE VOOM\"]','published',NULL,NULL,NULL,CURRENT_TIMESTAMP,{owner_expr},CURRENT_TIMESTAMP,CURRENT_TIMESTAMP,'','','2026-08-18 使用者確認正式發布圖',1,0,0,0,'published_approved',NULL,'','{{}}','',NULL WHERE EXISTS(SELECT 1 FROM profiles LIMIT 1);")

          audit=[]
          for file_name,media_id,post_id,title,alt,status in items:
              p=root/file_name
              raw=p.read_bytes()
              data=base64.b64encode(raw).decode('ascii')
              with Image.open(p) as im:
                  width,height=im.size
                  if im.format!='WEBP': raise SystemExit(f'not WEBP: {file_name}')
              url=f'{origin}/media/{media_id}'
              sql.append(f"DELETE FROM media_assets WHERE id={q(media_id)};")
              sql.append(f"INSERT INTO media_assets(id,file_name,mime_type,data_base64,bytes,width,height,created_by,created_at) VALUES({q(media_id)},{q(file_name)},'image/webp',{q(data)},{len(raw)},{width},{height},'system:official13',CURRENT_TIMESTAMP);")
              if status=='published':
                  sql.append(f"UPDATE social_posts SET image_url={q(url)},image_alt={q(alt)},image_source='2026-08-18 使用者確認正式發布圖',image_approved=1,image_width={width},image_height={height},image_bytes={len(raw)},image_quality_status='published_approved',media_id={q(media_id)},updated_at=CURRENT_TIMESTAMP WHERE id={q(post_id)};")
              else:
                  sql.append(f"UPDATE social_posts SET image_url={q(url)},image_alt={q(alt)},image_source='2026-08-18 使用者確認正式圖',image_approved=0,image_width={width},image_height={height},image_bytes={len(raw)},image_quality_status='candidate',media_id={q(media_id)},status='pending_review',scheduled_at=NULL,approved_by=NULL,approved_at=NULL,proposed_scheduled_at=NULL,rejection_reason='',updated_at=CURRENT_TIMESTAMP WHERE id={q(post_id)};")
              audit.append({'file':file_name,'media_id':media_id,'post_id':post_id,'title':title,'status':status,'bytes':len(raw),'width':width,'height':height,'url':url})
          sql.append('COMMIT;')
          Path('/tmp/official13-seed.sql').write_text('\n'.join(sql)+'\n',encoding='utf-8')
          Path('/tmp/official13-map.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('prepared',len(audit),'official images')
          PY
      - name: Seed remote D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/official13-seed.sql
      - name: Verify exact production result
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS count FROM media_assets WHERE id LIKE 'IMG-OFFICIAL-%'" > /tmp/media-count.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,status,image_url,image_approved,image_quality_status,media_id FROM social_posts WHERE status<>'archived' ORDER BY id" > /tmp/posts.json
          python - <<'PY'
          import json
          from pathlib import Path
          def unwrap(path):
              x=json.loads(Path(path).read_text())
              return x[0]['results'] if isinstance(x,list) and x and 'results' in x[0] else x.get('results',x)
          media=unwrap('/tmp/media-count.json')
          posts=unwrap('/tmp/posts.json')
          count=int(media[0]['count']) if media else 0
          wanted={'XJW-GUILU-drink30-work-break','XJW-GUILU-drink180-home','XJW-GUILU-gao-storage','XJW-GUILU-tangkuai-soup','XJW-GUILU-jiao-600g','XJW-GUILU-luerong-75g','XJW-SOCIAL-20260815-02-line-consult-and-trial','XJW-GUILU-choose-by-place','XJW-SOCIAL-20260815-03-storage-basics','XJW-SOCIAL-20260815-01-warm-drink-moment','POST-AUDIENCE-NEEDS','POST-TRIAL-MAIN','POST-BRAND-START'}
          matched=[p for p in posts if p['id'] in wanted]
          pending=[p for p in matched if p['status']=='pending_review']
          published=[p for p in matched if p['status']=='published']
          bad=[p for p in matched if not str(p.get('image_url') or '').startswith('https://xianjiawei-internal.tung314069.workers.dev/media/IMG-OFFICIAL-')]
          if count!=13: raise SystemExit(f'media count expected 13, got {count}')
          if len(matched)!=13: raise SystemExit(f'post count expected 13, got {len(matched)}')
          if len(pending)!=11: raise SystemExit(f'pending_review expected 11, got {len(pending)}')
          if len(published)!=2: raise SystemExit(f'published expected 2, got {len(published)}')
          if bad: raise SystemExit(f'bad image bindings: {bad}')
          result={'verified_at':'2026-08-18T23:26:00+08:00','media_count':count,'post_count':len(matched),'pending_review':len(pending),'published':len(published),'posts':matched}
          Path('audits/official13-production-verified-v20260818.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Commit verification audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audits/official13-production-verified-v20260818.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(posts): verify 13 formal images in production D1'
          git pull --rebase origin main
          git push origin HEAD:main
