name: 仙加味貼文圖片批次正式回填

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/post-image-bindings-20260921.json'

permissions:
  contents: write

concurrency:
  group: xianjiawei-post-image-binding
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Build safe D1 update SQL
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('ops/post-image-bindings-20260921.json','utf8'));
          const q=v=>"'" + String(v??'').replaceAll("'","''") + "'";
          const lines=[];
          for(const x of data.items){
            const url='https://raw.githubusercontent.com/TS15825868/xianjiawei-internal/main/'+x.path;
            lines.push(`UPDATE social_posts SET image_url=${q(url)}, image_alt=${q(x.alt)}, image_source=${q('ChatGPT正式生成｜2026-09-21｜GitHub main｜人工待審核')}, image_width=${Number(x.width)}, image_height=${Number(x.height)}, image_bytes=${Number(x.bytes)}, image_quality_status='ok', image_approved=0, status='pending_review', approved_by=NULL, approved_at=NULL, scheduled_at=NULL, published_at=NULL, updated_at=datetime('now') WHERE id=${q(x.postId)} AND status='draft';`);
          }
          fs.writeFileSync('/tmp/apply-post-images.sql',lines.join('\n')+'\n');
          NODE
      - name: Apply image bindings to formal D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/apply-post-images.sql
      - name: Verify bound posts are pending review
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_url,image_width,image_height,image_bytes,image_quality_status FROM social_posts WHERE id IN ('XJW-CONV-chat-wanhua-morning','XJW-CONV-weather-cool-drink','XJW-CONV-weather-rain-chat','XJW-CONV-season-more-soup','XJW-CONV-year-end-clean') ORDER BY id" > /tmp/verify.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/verify.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          if(rows.length!==5)throw new Error('綁定後找不到完整5篇貼文');
          for(const r of rows){
            if(r.status!=='pending_review')throw new Error(r.id+' 未進入 pending_review');
            if(!String(r.image_url||'').includes('/assets/post-images/2026-09-21/'))throw new Error(r.id+' 圖片路徑不正確');
            if(Number(r.image_width)!==1254||Number(r.image_height)!==1254)throw new Error(r.id+' 圖片尺寸不正確');
            if(r.image_quality_status!=='ok')throw new Error(r.id+' 圖片品質狀態不正確');
          }
          console.log('PASS 5 posts pending_review with formal images');
          NODE
      - name: Rebuild current production queue from remaining D1 drafts
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,copy,category,image_alt,image_source FROM social_posts WHERE status='draft' ORDER BY id" > /tmp/active-drafts.json
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const raw=JSON.parse(fs.readFileSync('/tmp/active-drafts.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          const windowFor=(id='')=>{const s=String(id).toLowerCase();if(s.includes('cny-'))return'lunar_new_year_window';if(s.includes('year-end-'))return'year_end_window';if(s.includes('new-year-'))return'new_year_window';if(s.includes('weather-'))return'weather_dynamic';if(s.includes('season-'))return'cool_season_dynamic';return'evergreen'};
          const order={evergreen:0,weather_dynamic:1,cool_season_dynamic:2,year_end_window:3,new_year_window:4,lunar_new_year_window:5};
          const productKeys=['30cc','180cc','龜鹿膏','龜鹿湯塊','龜鹿膠','鹿茸粉'];
          rows.sort((a,b)=>(order[windowFor(a.id)]-order[windowFor(b.id)])||String(a.id).localeCompare(String(b.id)));
          const items=rows.map((r,index)=>{const text=[r.title,r.copy,r.image_alt].filter(Boolean).join(' ');return{postId:r.id,imageId:`XJW-ACTIVE-IMG-${String(index+1).padStart(3,'0')}`,kind:r.category||'生活內容',title:r.title||'',products:productKeys.filter(x=>text.includes(x)),scene:r.image_alt||'',imageSource:r.image_source||'',window:windowFor(r.id),status:'needs_unique_image',copyHash:crypto.createHash('sha256').update(r.copy||'').digest('hex').slice(0,16)}});
          const out={version:'2026-09-21-v4-live-after-image-batch',brand:'仙加味',source:'Cloudflare D1 live social_posts WHERE status=draft',total:items.length,status:'production-queue',supersedes:'2026-09-16-v3-live-active-drafts',rule:'只為live D1目前status=draft的有效貼文製作唯一正式圖片；圖片完成後才回填image_url並改pending_review；人工審核前不得approved/scheduled/published。',formalAssets:{'30cc':'images/customer-display-v20260812/guilu-drink-30cc.avif','180cc':'images/customer-display-v20260812/guilu-drink-180cc-product.jpg','龜鹿膏':'images/customer-display-v20260812/guilu-gao.avif','龜鹿湯塊':'images/customer-display-v20260812/guilu-tangkuai.avif','龜鹿膠':'images/customer-display-v20260812/guilu-jiao.avif','鹿茸粉':'images/customer-display-v20260812/luerong-fen.avif'},items};
          fs.writeFileSync('ops/post-image-production-queue-current.json',JSON.stringify(out,null,2)+'\n');
          console.log('remaining drafts',items.length);
          NODE
      - name: Commit rebuilt queue if changed
        run: |
          if git diff --quiet -- ops/post-image-production-queue-current.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/post-image-production-queue-current.json
          git commit -m 'sync: remove completed image batch from active queue'
          git push
