name: 完成首篇 Instagram 正式發布

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-instagram-first-post-20260904.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: 5e85d589-9c4f-412e-9ccd-585a5b6ecabe
      POST_ID: XJW-SOCIAL-20260904-0900-FIRST
      BRIDGE_HEALTH: https://ts-line.onrender.com/internal/api/v2/publish-bridge/healthz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 驗證 Render 正式發布橋接已上線
        run: |
          set -euo pipefail
          echo '=== Render bridge health ==='
          body="$(curl -fsS --retry 5 --retry-delay 5 --max-time 30 "$BRIDGE_HEALTH")"
          echo "$body" | jq .
          echo "$body" | jq -e '.ok == true and .authenticationConfigured == true' >/dev/null

      - name: 讀取目前首篇發布狀態
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query"
          sql="SELECT id,status,scheduled_at,published_at,updated_at FROM social_posts WHERE id='${POST_ID}'; SELECT post_id,platform,status,remote_id,attempt_count,last_attempt_at,published_at,error_text FROM social_publish_deliveries WHERE post_id='${POST_ID}' ORDER BY platform;"
          curl -fsS "$endpoint" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')" | tee /tmp/before.json | jq .

      - name: 僅重置 Instagram 失敗紀錄並保持 Facebook 已發布
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query"
          current_ig="$(jq -r '.result[1].results[]? | select(.platform=="Instagram") | .status' /tmp/before.json | head -1)"
          current_fb="$(jq -r '.result[1].results[]? | select(.platform=="Facebook") | .status' /tmp/before.json | head -1)"
          echo "Facebook=$current_fb Instagram=$current_ig"
          test "$current_fb" = "published"
          if [ "$current_ig" = "published" ]; then
            echo 'Instagram 已發布，不做重複發布。'
            exit 0
          fi
          sql="DELETE FROM social_publish_deliveries WHERE post_id='${POST_ID}' AND platform='Instagram'; UPDATE social_posts SET status='scheduled', published_at=NULL, scheduled_at='2026-09-04T01:00:00.000Z', updated_at=datetime('now') WHERE id='${POST_ID}';"
          curl -fsS "$endpoint" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')" | jq .

      - name: 等待 Cron 並確認 Instagram 實際發布成功
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query"
          for attempt in $(seq 1 40); do
            sql="SELECT id,status,scheduled_at,published_at,updated_at FROM social_posts WHERE id='${POST_ID}'; SELECT post_id,platform,status,remote_id,attempt_count,last_attempt_at,published_at,error_text FROM social_publish_deliveries WHERE post_id='${POST_ID}' ORDER BY platform;"
            curl -fsS "$endpoint" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')" > /tmp/current.json
            fb_status="$(jq -r '.result[1].results[]? | select(.platform=="Facebook") | .status' /tmp/current.json | head -1)"
            ig_status="$(jq -r '.result[1].results[]? | select(.platform=="Instagram") | .status' /tmp/current.json | head -1)"
            ig_remote="$(jq -r '.result[1].results[]? | select(.platform=="Instagram") | .remote_id' /tmp/current.json | head -1)"
            post_status="$(jq -r '.result[0].results[0].status // ""' /tmp/current.json)"
            echo "[$attempt/40] post=$post_status Facebook=$fb_status Instagram=$ig_status remote_id=$ig_remote"
            if [ "$fb_status" = "published" ] && [ "$ig_status" = "published" ] && [ -n "$ig_remote" ] && [ "$ig_remote" != "null" ]; then
              echo '=== FINAL D1 DELIVERY ==='
              cat /tmp/current.json | jq .
              exit 0
            fi
            if [ "$ig_status" = "permanent_failed" ]; then
              echo 'Instagram 再次出現永久失敗：'
              cat /tmp/current.json | jq .
              exit 1
            fi
            sleep 15
          done
          echo '等待 Instagram 發布逾時：'
          cat /tmp/current.json | jq .
          exit 1

      - name: 清理一次性工作流程
        if: always()
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-instagram-first-post-20260904.yml
          git config user.name 'TS15825868'
          git config user.email 'tung314069@gmail.com'
          git add .github/workflows/finalize-instagram-first-post-20260904.yml
          if git diff --cached --quiet; then
            echo '無需清理'
          else
            git commit -m '移除首篇 Instagram 正式發布暫存流程'
            git push origin HEAD:main
          fi
