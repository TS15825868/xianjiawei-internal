name: 修正 Instagram 身分解析並重試 9/4 首篇

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-instagram-identity-20260904.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 套用 Instagram 身分解析修正
        run: python tools/patch-instagram-identity-20260904.py
      - name: 檢查與部署
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build:static
          npx wrangler deploy --keep-vars
      - name: 只重置 Instagram 失敗紀錄
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "DELETE FROM social_publish_deliveries WHERE post_id='XJW-SOCIAL-20260904-0900-FIRST' AND platform='Instagram'; UPDATE social_posts SET status='scheduled', published_at=NULL, scheduled_at='2026-09-04T01:00:00.000Z', updated_at=datetime('now') WHERE id='XJW-SOCIAL-20260904-0900-FIRST';"
      - name: 提交正式修正並清理臨時流程
        run: |
          rm -f .github/workflows/fix-instagram-identity-20260904.yml .github/workflows/diag-social-delivery-20260904.yml tools/patch-instagram-identity-20260904.py
          git config user.name 'TS15825868'
          git config user.email 'tung314069@gmail.com'
          git add src/social-publisher.js .github/workflows/fix-instagram-identity-20260904.yml .github/workflows/diag-social-delivery-20260904.yml tools/patch-instagram-identity-20260904.py
          git commit -m '修正 Instagram 專業帳號解析與首篇重試'
          git push origin HEAD:main
