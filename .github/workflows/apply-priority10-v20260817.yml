name: 仙加味第一批10篇正式圖文同步貼文中心

on:
  push:
    branches: [main]
    paths:
      - 'assets/data/priority10-release-v20260817.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install D1 tooling
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Fetch and validate website authority manifest
        shell: bash
        run: |
          set -euo pipefail
          URL="$(node -p "JSON.parse(require('fs').readFileSync('assets/data/priority10-release-v20260817.json','utf8')).authority_url")"
          curl -fsSL --retry 6 --retry-delay 3 "$URL" -o /tmp/priority10.json
          node - <<'NODE'
          const fs=require('fs');
          const release=JSON.parse(fs.readFileSync('assets/data/priority10-release-v20260817.json','utf8'));
          const m=JSON.parse(fs.readFileSync('/tmp/priority10.json','utf8'));
          if(m.count!==10||m.posts?.length!==10) throw new Error(`manifest count ${m.count}/${m.posts?.length}`);
          const ids=m.posts.map(p=>p.id).sort();
          const expected=[...release.ids].sort();
          if(JSON.stringify(ids)!==JSON.stringify(expected)) throw new Error('ID set mismatch');
          const seen=new Set();
          for(const p of m.posts){
            if(!p.copy?.includes('仙加味')) throw new Error(`${p.id}: missing brand link`);
            if(!p.image_url?.includes('/images/posts/priority10-v20260817/')) throw new Error(`${p.id}: wrong image release`);
            if(seen.has(p.image_url)) throw new Error(`${p.id}: duplicate image URL`);
            seen.add(p.image_url);
            if((p.title+p.copy+p.image_alt).includes('台興山產')) throw new Error(`${p.id}: blocked public name`);
          }
          console.log('PASS manifest: 10 unique matched lifestyle posts');
          NODE
          node - <<'NODE' > /tmp/image-urls.txt
          const m=JSON.parse(require('fs').readFileSync('/tmp/priority10.json','utf8'));
          for(const p of m.posts) console.log(p.image_url);
          NODE
          while IFS= read -r u; do curl -fsSL --retry 5 --retry-delay 2 -o /dev/null "$u"; done < /tmp/image-urls.txt
      - name: Build safe D1 update SQL
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('/tmp/priority10.json','utf8'));
          const q=v=>`'${String(v??'').replaceAll("'","''")}'`;
          const sql=[];
          for(const p of m.posts){
            const title=String(p.title||'').replace(/\s*\n\s*/g,' ');
            const category=String(p.kicker||'仙加味｜生活情境').split('｜').pop()||'生活情境';
            sql.push(`UPDATE social_posts SET title=${q(title)}, headline=${q(title)}, copy=${q(p.copy)}, category=${q(category)}, image_url=${q(p.image_url)}, image_alt=${q(p.image_alt)}, image_source=${q(p.image_source)}, status='pending_review', image_approved=0, review_note='2026-08-17 第一批10篇正式重做：明確生活場景＋網站同款Q版小老闆＋正式產品實物；回待審核。', rejection_reason='', approved_by=NULL, approved_at=NULL, scheduled_at=NULL, updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now') WHERE id=${q(p.id)} AND status<>'published';`);
          }
          fs.writeFileSync('/tmp/apply-priority10.sql',sql.join('\n')+'\n');
          const ids=m.posts.map(p=>q(p.id)).join(',');
          const prefix=q('https://ts15825868.github.io/xianjiawei/images/posts/priority10-v20260817/%');
          const verify=`SELECT COUNT(*) AS matched FROM social_posts WHERE id IN (${ids}); SELECT COUNT(*) AS wrong_nonpublished FROM social_posts WHERE id IN (${ids}) AND status<>'published' AND image_url NOT LIKE ${prefix}; SELECT COUNT(*) AS bad_status FROM social_posts WHERE id IN (${ids}) AND status NOT IN ('pending_review','published'); SELECT COUNT(*) AS blocked_name FROM social_posts WHERE id IN (${ids}) AND instr(title||headline||copy||image_alt,'台興山產')>0; SELECT COUNT(*) AS duplicate_image_posts FROM social_posts p WHERE p.id IN (${ids}) AND p.status<>'archived' AND EXISTS (SELECT 1 FROM social_posts q WHERE q.status<>'archived' AND q.id<>p.id AND trim(q.image_url)=trim(p.image_url)); SELECT COUNT(*) AS duplicate_copy_posts FROM social_posts p WHERE p.id IN (${ids}) AND p.status<>'archived' AND EXISTS (SELECT 1 FROM social_posts q WHERE q.status<>'archived' AND q.id<>p.id AND trim(q.copy)=trim(p.copy));`;
          fs.writeFileSync('/tmp/verify-priority10.sql',verify);
          console.log('PASS built 10 guarded update statements');
          NODE
      - name: Apply to production D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/apply-priority10.sql
      - name: Verify production D1
        shell: bash
        run: |
          set -euo pipefail
          QUERY="$(cat /tmp/verify-priority10.sql)"
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "$QUERY" > /tmp/verify.json
          cat /tmp/verify.json
          node - <<'NODE'
          const raw=JSON.parse(require('fs').readFileSync('/tmp/verify.json','utf8'));
          const rows=raw.flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          const get=k=>Number(rows.find(r=>Object.prototype.hasOwnProperty.call(r,k))?.[k]??-1);
          if(get('matched')!==10) throw new Error(`matched ${get('matched')}`);
          for(const k of ['wrong_nonpublished','bad_status','blocked_name','duplicate_image_posts','duplicate_copy_posts']) if(get(k)!==0) throw new Error(`${k}=${get(k)}`);
          console.log('PASS D1 priority10: matched=10, nonpublished pending_review, duplicate copy/image=0');
          NODE
