name: 仙加味既有視覺證據增量釐清（不核准不發布）
on:
  push:
    branches: [main]
    paths: ['ops/visual-quality-increment-20261107.json']
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: node ops/apply-visual-quality-increment-20261107.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-quality-increment-${{ github.run_id }}
          path: visual-quality-increment-results.json
          retention-days: 7
