name: 仙加味貼文圖文退回結果安全複驗
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-held-social-visuals-v20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install read-only D1 CLI
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Retrieve pre-migration snapshot (private GitHub workflow artifact)
        run: |
          mkdir -p /tmp/held-3d-baseline
          gh run download 39045678700 --repo TS15825868/xianjiawei-internal --name xjw-62-visually-rejected-post-status-safe-review-20261017 --dir /tmp/held-3d-baseline
          test -s /tmp/held-3d-baseline/xjw-current-posts-before.json
      - name: Fetch current D1 rows without any mutation
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_url,title,headline,copy,image_alt,image_source,approved_by,approved_at,image_approved,image_quality_status,scheduled_at,published_at FROM social_posts WHERE status IN ('pending_review','approved','scheduled','published') ORDER BY id" > /tmp/xjw-now-after-readonly.json
      - name: Verify 62 exact posts held and three published rows intact
        run: |
          python3 - <<'PY'
          import json,collections
          from pathlib import Path
          def rows(name):
              a=json.loads(Path(name).read_text())
              return (a[0] if isinstance(a,list) else a)['results']
          before=rows('/tmp/held-3d-baseline/xjw-current-posts-before.json')
          after=rows('/tmp/xjw-now-after-readonly.json')
          prev={x['id']:x for x in before}
          curr={x['id']:x for x in after}
          assert len(before)==65 and len(after)==65
          assert collections.Counter(x['status'] for x in before)=={'approved':47,'pending_review':15,'published':3}
          assert collections.Counter(x['status'] for x in after)=={'pending_review':62,'published':3}
          assert set(prev)==set(curr)
          original_fields=['image_url','title','headline','copy','image_alt','image_source']
          checked=0;published=0
          for ident,old in prev.items():
              now=curr[ident]
              for key in original_fields:
                  assert now.get(key)==old.get(key),(ident,key)
              if old['status']=='published':
                  assert now['status']=='published' and now.get('published_at')==old.get('published_at')
                  published+=1
              else:
                  assert now['status']=='pending_review' and now['image_quality_status']=='needs_rework'
                  assert not now.get('approved_by') and not now.get('approved_at') and not now.get('scheduled_at') and not now.get('published_at')
                  assert int(now.get('image_approved') or 0)==0
                  checked+=1
          assert checked==62 and published==3
          print('PASS current live D1: 62 visually rejected scenes safely held, no copy/image lost; 3 published posts intact')
          PY
