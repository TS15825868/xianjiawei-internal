name: 仙加味貼文中心 App 正式線上驗收 v2

on:
  push:
    branches: [main]
    paths:
      - 'assets/data/full-app-audit-v2-v20260817.trigger'
      - '.github/workflows/verify-publishing-app-production-v2-v20260817.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify source, guards and App contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run guard:full
          npm run build:static
          grep -q 'data-diagnose' dist/publishing.html
          grep -q 'data-refresh' dist/publishing.html
          grep -q 'data-add-post' dist/publishing.html
          grep -q 'id="searchInput"' dist/publishing.html
          grep -q 'id="statusFilter"' dist/publishing.html
          grep -q '/publish-now' dist/assets/js/publishing-app-v2.js
          grep -q '/deliveries' dist/assets/js/publishing-app-v2.js
          grep -q 'data-post-schedule' dist/assets/js/publishing-app-v2.js
          grep -q '16項完整圖文審核' dist/assets/js/publishing-review-gate.js
          grep -q '完整成圖／非拼湊／不重複' dist/assets/js/publishing-review-gate.js
          grep -q '產品比例尺寸' dist/assets/js/publishing-review-gate.js
          grep -q 'fullLibraryAudit:true' dist/assets/js/publishing-review-gate.js
          grep -q 'strictUniqueImagePerPost:true' dist/assets/js/publishing-review-gate.js
          grep -q 'regeneration-start' dist/assets/js/post-regenerate-policy-v1.js
          grep -q 'regeneration-ready' dist/assets/js/post-regenerate-policy-v1.js
          grep -q '禁止拼貼' dist/assets/js/post-regenerate-policy-v1.js
          grep -q 'AI絕對不得重畫' dist/assets/js/post-regenerate-policy-v1.js
          grep -q 'media-upload' src/publishing-only-entry.js
          grep -q 'semanticImageMatchRequired:true' src/publishing-only-entry.js
          grep -q 'fullLibraryAudit:true' src/publishing-content-audit-entry.js
          echo 'PASS source + App contracts + 16-item review + regeneration + upload + semantic hard gates'

      - name: Verify production D1 exact current 10 posts and image-copy pairing
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,headline,copy,category,status,image_url,image_alt,image_source,image_approved,scheduled_at,platforms_json FROM social_posts WHERE status<>'archived' ORDER BY scheduled_at,created_at,id" > /tmp/live-posts.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/live-posts.json','utf8'));
          const rows=raw.flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          const active=rows.filter(r=>r.status!=='published');
          const expected={
            'XJW-GUILU-drink30-work-break':'XJW-GUILU-drink30-work-break.webp',
            'XJW-SOCIAL-20260815-03-storage-basics':'XJW-SOCIAL-20260815-03-storage-basics.webp',
            'XJW-SOCIAL-20260815-01-warm-drink-moment':'XJW-SOCIAL-20260815-01-warm-drink-moment.webp',
            'XJW-GUILU-tangkuai-soup':'XJW-GUILU-tangkuai-soup.webp',
            'XJW-GUILU-jiao-600g':'XJW-GUILU-jiao-600g.webp',
            'XJW-SOCIAL-20260815-02-line-consult-and-trial':'XJW-SOCIAL-20260815-02-line-consult-and-trial.webp',
            'XJW-GUILU-drink180-home':'XJW-GUILU-drink180-home.webp',
            'XJW-GUILU-luerong-75g':'XJW-GUILU-luerong-75g.webp',
            'XJW-GUILU-choose-by-place':'XJW-GUILU-choose-by-place.webp',
            'XJW-GUILU-gao-storage':'XJW-GUILU-gao-storage.webp'
          };
          if(active.length!==10) throw new Error(`active nonpublished ${active.length}/10`);
          const byId=new Map(active.map(r=>[r.id,r]));
          for(const [id,file] of Object.entries(expected)){
            const r=byId.get(id);
            if(!r) throw new Error(`missing current post ${id}`);
            if(r.status!=='scheduled') throw new Error(`${id}: status ${r.status}`);
            if(+r.image_approved!==1) throw new Error(`${id}: image not approved`);
            if(!r.title?.trim()||!r.copy?.trim()||!r.image_url?.trim()||!r.image_alt?.trim()) throw new Error(`${id}: incomplete title/copy/image/alt`);
            if(!r.scheduled_at) throw new Error(`${id}: missing schedule`);
            if(!r.image_url.includes('/images/posts/priority10-v20260817/')) throw new Error(`${id}: wrong image release`);
            if(!r.image_url.includes(file)) throw new Error(`${id}: image-copy pairing mismatch`);
            const src=String(r.image_source||'');
            if(!src.trim()) throw new Error(`${id}: image_source blank`);
            if(!/(2026-08-17|20260817)/.test(src)||!/確認|approved|使用者/.test(src)) throw new Error(`${id}: source not traceable to approved 2026-08-17 image batch: ${src}`);
          }
          const images=new Set(active.map(r=>r.image_url.split('?')[0]));
          const copies=new Set(active.map(r=>r.copy));
          if(images.size!==10) throw new Error(`duplicate image ${images.size}/10`);
          if(copies.size!==10) throw new Error(`duplicate copy ${copies.size}/10`);
          for(const id of ['XJW-GUILU-drink30-work-break','XJW-GUILU-drink180-home','XJW-SOCIAL-20260815-01-warm-drink-moment','XJW-SOCIAL-20260815-02-line-consult-and-trial']){
            if(!byId.get(id)?.copy.includes('常溫')) throw new Error(`${id}: room-temperature rule missing`);
          }
          if(!byId.get('XJW-GUILU-tangkuai-soup')?.copy.includes('藍色盒裝')) throw new Error('龜鹿湯塊藍色盒裝規則缺少');
          if(!byId.get('XJW-GUILU-jiao-600g')?.copy.includes('紫色盒裝')) throw new Error('龜鹿膠紫色盒裝規則缺少');
          if(!byId.get('XJW-GUILU-gao-storage')?.copy.includes('冷藏')) throw new Error('龜鹿膏冷藏規則缺少');
          const blocked=['台興山產','TODO','placeholder','假資料','測試資料','內部作業','GitHub','Worker','D1','API Token'];
          for(const r of active){
            const visible=[r.title,r.headline,r.copy,r.image_alt].join(' ');
            const hit=blocked.find(x=>visible.includes(x));
            if(hit) throw new Error(`${r.id}: public content contains ${hit}`);
          }
          fs.writeFileSync('/tmp/image-urls.txt',active.map(r=>r.image_url).join('\n')+'\n');
          console.log('PASS D1: exact 10 active scheduled posts, exact image filename pairing, unique image/copy, correct room-temp/blue-box/purple-box/storage rules');
          NODE

      - name: Verify all 10 production images are reachable non-placeholder image files
        shell: bash
        run: |
          set -euo pipefail
          i=0
          while IFS= read -r url; do
            i=$((i+1)); out="/tmp/post-$i.img"; headers="/tmp/post-$i.headers"
            curl -fsSL --retry 5 --retry-delay 2 --max-time 25 -D "$headers" -o "$out" "$url"
            bytes=$(wc -c < "$out")
            test "$bytes" -ge 30000 || { echo "image too small: $url ($bytes bytes)" >&2; exit 1; }
            grep -Eiq '^content-type:[[:space:]]*image/' "$headers" || { echo "not image MIME: $url" >&2; exit 1; }
            echo "$i: $bytes bytes | $url"
          done < /tmp/image-urls.txt
          test "$i" -eq 10
          echo 'PASS image URLs 10/10'

      - name: Verify Cloudflare Access, D1 and live App route boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          domain='xianjiawei-internal.tung314069.workers.dev'
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps?domain=$domain&exact=true&per_page=50" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' > /tmp/access-apps.json
          node - <<'NODE'
          const fs=require('fs'); const body=JSON.parse(fs.readFileSync('/tmp/access-apps.json','utf8'));
          if(body.success!==true) throw new Error('Access API failure');
          const domain='xianjiawei-internal.tung314069.workers.dev';
          const apps=(body.result||[]).filter(x=>String(x.domain||'').replace(/^https?:\/\//,'').replace(/\/$/,'')===domain);
          if(apps.length!==1) throw new Error(`Access app count ${apps.length}`);
          if(apps[0].aud!=='201dea08ea9611989cd8ad4ccac88f99974fd9b1309e4af74bf11a397ee6522f') throw new Error('Access AUD mismatch');
          console.log('PASS Access app/AUD');
          NODE
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT 1 AS ok"
          base='https://xianjiawei-internal.tung314069.workers.dev'
          for path in '/' '/publishing' '/publishing/' '/publishing.html' '/healthz/core'; do
            body="$(mktemp)"
            result="$(curl -LsS --max-redirs 6 --max-time 25 -o "$body" -w '%{http_code} %{num_redirects} %{url_effective}' "$base$path")"
            code="${result%% *}"; rest="${result#* }"; redirects="${rest%% *}"
            echo "$path -> $result"
            test "$code" -ge 200; test "$code" -lt 500; test "$redirects" -le 1
            grep -Eiq '貼文中心系統 App|唯一正式內容系統|cloudflare|access|sign in|login' "$body" || { echo "$path unexpected content" >&2; exit 1; }
          done
          echo 'PASS Cloudflare Access + D1 + live App routes/no redirect storm'
