name: 仙加味貼文D1遷移前診斷
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-diagnose-d1-migration-v20260815.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Inspect profiles and dependent tables
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT email,display_name,role,active FROM profiles ORDER BY email;"
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT name,sql FROM sqlite_master WHERE type='table' AND sql LIKE '%REFERENCES social_posts%';"
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT name,sql FROM sqlite_master WHERE type='trigger' AND (tbl_name='social_posts' OR sql LIKE '%social_posts%');"
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "PRAGMA foreign_keys;"
