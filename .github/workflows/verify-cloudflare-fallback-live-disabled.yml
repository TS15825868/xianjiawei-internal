name: 仙加味 Cloudflare 備援正式端點安全驗證
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-cloudflare-fallback-live-disabled.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live fallback rejects traffic while disabled
        shell: bash
        run: |
          set -euo pipefail
          url='https://xianjiawei-social-receipt-fallback.tung314069.workers.dev/'
          code=$(curl --silent --show-error --max-time 20 -o /tmp/xjw-fallback.json -w '%{http_code}' "$url")
          test "$code" = '503' || { echo "Unexpected fallback status: $code"; exit 1; }
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/xjw-fallback.json','utf8'));if(d.accepted!==false||d.code!=='disabled'||d.sent!==false)process.exit(1)"
          echo 'Live fallback safely disabled; no messages sent.'
