name: One-shot clean social quality v4
on:
  push:
    paths:
      - '.github/workflows/one-shot-clean-social-quality-v4-20260815.yml'
permissions:
  contents: write
jobs:
  clean-validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      XJW_CONTENT_SEED_CREATED_BY: tung314069@gmail.com
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply customer-copy cleanup and unicode-safe dedupe
        run: |
          python tools/one-shot-clean-social-quality-v3.py
          python tools/one-shot-unicode-dedupe-fix.py
      - name: Validate source, guard and build
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run check
          npm run guard:full
          npm run build:static
      - name: Build current queue SQL
        shell: bash
        run: |
          set -euo pipefail
          XJW_CONTENT_SEED_CREATED_BY="$XJW_CONTENT_SEED_CREATED_BY" node tools/build-guilu-review-seed.mjs > /tmp/guilu-review.sql
          XJW_CONTENT_SEED_CREATED_BY="$XJW_CONTENT_SEED_CREATED_BY" node tools/build-guilu-draft-seed.mjs > /tmp/guilu-draft.sql
          XJW_CONTENT_SEED_CREATED_BY="$XJW_CONTENT_SEED_CREATED_BY" node tools/build-social-batches-review-seed.mjs > /tmp/social.sql
      - name: Apply queue updates and remove redundant drafts
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/guilu-review.sql
          npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/guilu-draft.sql
          npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/social.sql
          cat >/tmp/cleanup.sql <<'SQL'
          DELETE FROM social_post_review_gates WHERE post_id IN (
            'XJW-SOCIAL-20260815-01-brand-from-wanhua','XJW-SOCIAL-20260815-01-product-tangkuai','XJW-SOCIAL-20260815-02-real-product-image-policy','XJW-SOCIAL-20260815-03-one-eighty-pouch-detail',
            'POST-CHOOSE','POST-CHOOSE-BY-HABIT','POST-DAILY-SOUP','POST-GUIDE','POST-JIAO-600','POST-PRODUCT-OVERVIEW','POST-RECIPES','POST-SOUP-75','POST-STORAGE','POST-DRINK-180','POST-DRINK-30',
            'XJW-GUILU-craft-time-heat','XJW-GUILU-drink-30-vs-180','XJW-GUILU-soup-block-vs-jiao','XJW-GUILU-wanhua-four-generations','XJW-GUILU-why-spec-clear','XJW-GUILU-guilu-table'
          );
          DELETE FROM social_posts WHERE status IN ('draft','pending_review') AND id IN (
            'XJW-SOCIAL-20260815-01-brand-from-wanhua','XJW-SOCIAL-20260815-01-product-tangkuai','XJW-SOCIAL-20260815-02-real-product-image-policy','XJW-SOCIAL-20260815-03-one-eighty-pouch-detail',
            'POST-CHOOSE','POST-CHOOSE-BY-HABIT','POST-DAILY-SOUP','POST-GUIDE','POST-JIAO-600','POST-PRODUCT-OVERVIEW','POST-RECIPES','POST-SOUP-75','POST-STORAGE','POST-DRINK-180','POST-DRINK-30',
            'XJW-GUILU-craft-time-heat','XJW-GUILU-drink-30-vs-180','XJW-GUILU-soup-block-vs-jiao','XJW-GUILU-wanhua-four-generations','XJW-GUILU-why-spec-clear','XJW-GUILU-guilu-table'
          );
          UPDATE social_posts
          SET copy=replace(copy,'\n\n此類貼文需確認當日天氣後再安排，不自動排程。',''),updated_at=CURRENT_TIMESTAMP
          WHERE status='draft' AND id IN ('POST-WEATHER-HOT','POST-WEATHER-RAIN','POST-WEATHER-TEMP');
          SQL
          npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/cleanup.sql
      - name: Verify live customer copy and duplication
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,headline,copy,status,image_url,image_alt FROM social_posts WHERE status<>'archived' ORDER BY id" >/tmp/current.json
          python - <<'PY'
          import json,re,unicodedata,difflib,sys
          raw=json.load(open('/tmp/current.json'));rows=[]
          for block in raw: rows.extend(block.get('results') or [])
          def norm(s):
              s=unicodedata.normalize('NFKC',str(s or '')).lower()
              s=re.sub(r'仙加味\s*[｜|]?\s*補養，是一種節奏。?','',s)
              return re.sub(r'[\s\W_]+','',s,flags=re.UNICODE)
          blocked=['待審核','人工審核','16項','核准','不自動排程','不自動發布','貼文中心','發布中心','ERP','products-v3','守門員','母庫','資料庫','D1','Worker','GitHub','Workflow','候選圖','回填','重新生成','ChatGPT','不重畫','圖片呈現時','看圖片時','產品圖片','版面效果','產品本體','誤畫','正式原圖','正式產品原圖','正式比例','正式包裝','目前正式','最新確認','此類貼文需確認','舊的300g','舊版','debug','TODO','placeholder','假資料']
          leaks=[]
          for r in rows:
              text=' '.join(str(r.get(k) or '') for k in ('title','headline','copy'))
              hits=[x for x in blocked if x.lower() in text.lower()]
              if hits: leaks.append((r['id'],r['title'],hits))
          if leaks:
              print('CUSTOMER COPY LEAKAGE',leaks);sys.exit(1)
          dup=[];titles={};copies={}
          for r in rows:
              tk=norm(r.get('title'));ck=norm(r.get('copy'))
              if tk and tk in titles: dup.append(('same-title',titles[tk]['id'],r['id']))
              else: titles[tk]=r
              if ck and ck in copies: dup.append(('same-copy',copies[ck]['id'],r['id']))
              else: copies[ck]=r
          for i,a in enumerate(rows):
              ac=norm(a.get('copy'))
              if len(ac)<40: continue
              for b in rows[i+1:]:
                  bc=norm(b.get('copy'))
                  if len(bc)<40: continue
                  ratio=difflib.SequenceMatcher(None,ac,bc).ratio()
                  if ratio>=0.90: dup.append((f'near-{ratio:.3f}',a['id'],b['id']))
          if dup:
              print('DUPLICATE POSTS',dup);sys.exit(1)
          missing=[(r['id'],r['title']) for r in rows if r.get('status')=='pending_review' and (not r.get('image_url') or not r.get('image_alt'))]
          if missing:
              print('PENDING REVIEW MISSING MEDIA',missing);sys.exit(1)
          print('PASS customer copy clean, duplicate-free, pending-review media complete; total=',len(rows))
          PY
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT status,COUNT(*) AS count FROM social_posts WHERE status<>'archived' GROUP BY status ORDER BY status;"
      - name: Commit permanent quality fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/social-batch-20260815-01.json assets/data/social-batch-20260815-02.json assets/data/social-batch-20260815-03.json assets/data/guilu-content-topic-bank-v20260814.json tools/build-guilu-review-seed.mjs tools/build-guilu-draft-seed.mjs tools/build-social-batches-review-seed.mjs .github/workflows/seed-guilu-review-queue.yml src/publishing-review-gate-entry.js assets/js/publishing-app-v2.js assets/css/publishing-base.css publishing.html tools/validate-publishing-review-gate.mjs tools/validate-publishing-app-contract.mjs
          git commit -m 'fix(publishing): prevent duplicate posts and internal customer copy'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Deploy verified posting center
        run: npx wrangler deploy --keep-vars
      - name: Verify protected production routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://xianjiawei-internal.tung314069.workers.dev'
          for path in '/' '/publishing' '/publishing/' '/publishing.html' '/healthz/core'; do
            body="$(mktemp)"
            result="$(curl -LsS --max-redirs 6 --max-time 25 -o "$body" -w '%{http_code} %{num_redirects} %{url_effective}' "$base$path")"
            code="${result%% *}";rest="${result#* }";redirects="${rest%% *}"
            echo "$path -> $result"
            test "$code" -ge 200;test "$code" -lt 500;test "$redirects" -le 1
            grep -Eiq '貼文中心系統 App|<html|<!doctype|cloudflare|access|sign in|login|publishing' "$body"
          done
      - name: Remove completed temporary files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          git rm -f .github/workflows/one-shot-clean-social-quality-v4-20260815.yml .github/workflows/one-shot-clean-social-quality-v3-20260815.yml .github/workflows/one-shot-clean-social-quality-v2-20260815.yml .github/workflows/one-shot-clean-social-quality-v20260815.yml .github/workflows/one-shot-audit-social-copy-v20260815.yml .github/workflows/one-shot-patch-social-quality-v2-trigger.yml tools/one-shot-clean-social-quality-v3.py tools/one-shot-unicode-dedupe-fix.py
          git commit -m 'chore(publishing): remove completed social quality temporary files'
          git push origin HEAD:main