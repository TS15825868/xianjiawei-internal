name: 仙加味10篇文案先定版更新貼文中心

on:
  push:
    branches: [main]
    paths:
      - 'assets/data/text-first10-drafts-v20260817.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install D1 tooling
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Build text-first draft SQL
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const posts=[
            {
              id:'XJW-GUILU-drink30-work-break',
              title:'上班帶一罐，30cc 不用把行程打亂',
              category:'日常安排',
              copy:`工作告一段落時，留一點空檔給自己，安排一罐剛剛好的日常節奏。\n\n仙加味龜鹿飲 30cc 是小玻璃裸罐，容量小，外出攜帶也方便。\n如果平常生活節奏比較快，不想準備太多，也不想把行程打亂，可以先從這種型態開始認識。\n\n白天安排更順手，帶著出門也簡單。\n仙加味｜補養，是一種節奏。`
            },
            {
              id:'XJW-GUILU-drink180-home',
              title:'回到家，把180cc安排成自己的步調',
              category:'居家安排',
              copy:`回到家，把白天的節奏放慢一點，也把自己的日常安排回來。\n\n仙加味龜鹿飲 180cc 是鋁袋包裝，適合在家依自己的習慣安排。\n可以直接常溫飲用；如果你比較喜歡溫熱入口，也可以依情境溫熱後再飲用。\n\n在家安排，比較從容；喝的方式，也可以照自己的習慣來。\n仙加味｜補養，是一種節奏。`
            },
            {
              id:'XJW-GUILU-gao-storage',
              title:'龜鹿膏開罐後，順手放進冰箱',
              category:'保存提醒',
              copy:`有些日常小動作，先做起來，之後使用就會順手很多。\n\n仙加味龜鹿膏未開罐時，可放在常溫陰涼處保存；\n開罐後，記得放進冰箱冷藏，之後取用也更方便。\n\n用完蓋好、放回固定位置，日常安排就會更有節奏。\n仙加味｜補養，是一種節奏。`
            },
            {
              id:'XJW-GUILU-tangkuai-soup',
              title:'今晚燉湯，把龜鹿湯塊安排進家常餐桌',
              category:'料理搭配',
              copy:`今天想自己下廚，不一定要把餐桌弄得很複雜，簡單安排，也可以很有日常感。\n\n仙加味龜鹿湯塊是 75g／盒、8 塊裝，正式產品為藍色盒裝，適合依自己的料理習慣安排。\n不管是平日晚餐、週末燉湯，或想把熟悉的味道放進家常餐桌，都可以慢慢找到適合自己的方式。\n\n把料理和生活節奏接在一起，就是很實在的日常安排。\n仙加味｜補養，是一種節奏。`
            },
            {
              id:'XJW-GUILU-jiao-600g',
              title:'週末有時間，再慢慢認識龜鹿膠這種型態',
              category:'型態認識',
              copy:`平日忙的時候，先求方便；到了週末有空，再慢慢認識不同型態，也是一種很自然的安排。\n\n仙加味龜鹿膠為 600g／盒、32 塊裝，正式產品為紫色盒裝。\n如果你想先從產品型態開始了解，看看自己比較習慣哪一種使用方式，可以留到有空的時候慢慢認識。\n\n不急著一次看懂，先從自己的生活方式開始。\n仙加味｜補養，是一種節奏。`
            },
            {
              id:'XJW-GUILU-luerong-75g',
              title:'下午想簡單一點，可以先認識鹿茸粉',
              category:'產品認識',
              copy:`下午的節奏，常常不需要太複雜，先把產品看懂，再安排進生活裡就好。\n\n仙加味鹿茸粉為 75g／罐。\n如果你想先從單一型態開始認識，也可以先看產品標示、保存方式與自己的日常習慣，再慢慢安排適合自己的步調。\n\n先看懂，再安排，生活會更順。\n仙加味｜補養，是一種節奏。`
            },
            {
              id:'XJW-SOCIAL-20260815-01-warm-drink-moment',
              title:'辦公桌上的一杯日常安排，也可以有不同選擇',
              category:'辦公室日常',
              copy:`在辦公桌旁，也能留一點空間給自己的日常安排。\n\n仙加味龜鹿飲 30cc 是小玻璃裸罐，180cc 是鋁袋包裝。\n如果想簡單快速，可以依情況安排 30cc；如果是在辦公室或回到家，也可以依自己的步調安排 180cc。\n\n龜鹿飲可常溫飲用；如果你比較習慣溫熱入口，也可以依情境調整。\n產品型態不同，重點是找到自己方便的方式。\n仙加味｜補養，是一種節奏。`
            },
            {
              id:'XJW-SOCIAL-20260815-03-storage-basics',
              title:'星期天整理櫃子，也順便看看龜鹿還剩多少',
              category:'整理一下',
              copy:`星期天整理櫃子時，也可以順手看看家裡的仙加味龜鹿系列還剩多少。\n\n把 30cc 小玻璃罐、180cc 鋁袋、龜鹿膏等產品分開放好，固定位置、開封與未開封分開，之後要使用時也更順手。\n\n整理一下，不只是收納，也是把自己的生活節奏理清楚。\n仙加味｜補養，是一種節奏。`
            },
            {
              id:'XJW-GUILU-choose-by-place',
              title:'今天在家，明天外出，產品型態不一定要選同一種',
              category:'生活節奏',
              copy:`每天的生活節奏不一樣，產品型態也不一定要都選同一種。\n\n今天在家，可能想安排得從容一點；明天外出，可能會更重視攜帶方便。\n仙加味把不同型態整理清楚，就是希望你可以依自己的生活步調，慢慢挑選適合自己的方式。\n\n先看今天的行程，再選今天適合的型態。\n仙加味｜補養，是一種節奏。`
            },
            {
              id:'XJW-SOCIAL-20260815-02-line-consult-and-trial',
              title:'不知道怎麼選，先把你的日常告訴我們',
              category:'LINE 諮詢',
              copy:`如果你還不知道先從哪一種開始，也可以先把自己的日常告訴我們。\n\n像是：\n你平常是在家還是外出比較多？\n早上安排比較方便，還是下午？\n比較習慣常溫飲用，還是想依情境溫熱？\n想找方便攜帶的型態，還是在家慢慢安排的型態？\n\n先把生活說清楚，再慢慢挑選產品，會更容易找到適合自己的安排。\n歡迎到 LINE 和我們聊聊。\n仙加味｜補養，是一種節奏。`
            }
          ];
          const q=v=>`'${String(v??'').replaceAll("'","''")}'`;
          const ids=posts.map(p=>q(p.id)).join(',');
          const sql=[];
          sql.push(`UPDATE social_posts SET status='archived', scheduled_at=NULL, proposed_scheduled_at=NULL, image_approved=0, review_note='2026-08-17 使用者確認：舊圖全部作廢，舊的非已發布貼文移出目前工作區。', rejection_reason='已由文案先定版10篇取代', updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now') WHERE status<>'published' AND id NOT IN (${ids});`);
          for(const p of posts){
            sql.push(`UPDATE social_posts SET title=${q(p.title)}, headline=${q(p.title)}, copy=${q(p.copy)}, category=${q(p.category)}, platforms_json='[]', status='draft', scheduled_at=NULL, proposed_scheduled_at=NULL, approved_by=NULL, approved_at=NULL, image_url='', image_alt='', image_source='待重新製作｜文案已確認，圖片尚未核准', image_approved=0, image_width=0, image_height=0, image_bytes=0, image_quality_status='unknown', media_id=NULL, review_note='2026-08-17 文案先定版；目前舊圖全部作廢。待依文案重新製作完整正式圖，經使用者確認後才送待審核與排程。', brand_check_json='{}', rejection_reason='', updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now') WHERE id=${q(p.id)} AND status<>'published';`);
          }
          fs.writeFileSync('/tmp/apply.sql',sql.join('\n')+'\n');
          fs.writeFileSync('/tmp/expected.json',JSON.stringify(posts));
          console.log('PASS built exact 10 text-first drafts');
          NODE

      - name: Apply to production D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/apply.sql

      - name: Verify publishing center exact state
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,copy,status,image_url,image_alt,image_source,image_approved,scheduled_at,proposed_scheduled_at,platforms_json FROM social_posts WHERE status<>'archived' ORDER BY created_at,id" >/tmp/live.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/live.json','utf8'));
          const rows=raw.flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          const expected=JSON.parse(fs.readFileSync('/tmp/expected.json','utf8'));
          const byId=new Map(rows.map(r=>[r.id,r]));
          const active=rows.filter(r=>r.status!=='published');
          if(active.length!==10) throw new Error(`active nonpublished ${active.length}/10`);
          for(const p of expected){
            const r=byId.get(p.id); if(!r) throw new Error(`missing ${p.id}`);
            if(r.status!=='draft') throw new Error(`${p.id}: status ${r.status}`);
            if(r.title!==p.title) throw new Error(`${p.id}: title mismatch`);
            if(r.copy!==p.copy) throw new Error(`${p.id}: copy mismatch`);
            if(String(r.image_url||'')||String(r.image_alt||'')) throw new Error(`${p.id}: old image still attached`);
            if(+r.image_approved!==0) throw new Error(`${p.id}: image still approved`);
            if(r.scheduled_at||r.proposed_scheduled_at) throw new Error(`${p.id}: schedule still exists`);
            if(r.platforms_json!=='[]') throw new Error(`${p.id}: platforms not cleared`);
            if(!String(r.image_source||'').includes('圖片尚未核准')) throw new Error(`${p.id}: source note mismatch`);
          }
          if(new Set(active.map(r=>r.copy)).size!==10) throw new Error('duplicate copy');
          if(active.some(r=>String(r.copy).includes('台興山產'))) throw new Error('blocked public name');
          console.log('PASS publishing center: exact 10 new text drafts; all old images detached; schedules cleared; published history preserved');
          for(const r of active) console.log(`draft | ${r.title}`);
          NODE
