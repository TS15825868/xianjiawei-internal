name: 仙加味整理期間免登入安全強化

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-maintenance-readonly-mode.yml'

permissions:
  contents: write

jobs:
  harden-maintenance-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Remove broad child-layer maintenance auth bypass
        shell: python
        run: |
          from pathlib import Path

          block = """  if(String(env.TEMP_DISABLE_ACCESS||'').toLowerCase()==='true'){
    if(!env?.DB)throw new Error('D1 資料庫尚未綁定');
    const profile=await env.DB.prepare(\"SELECT email,display_name,role,active FROM profiles WHERE active=1 ORDER BY CASE WHEN role='owner' THEN 0 WHEN role='admin' THEN 1 ELSE 2 END, email LIMIT 1\").first();
    if(!profile)throw new Error('維護模式找不到可用內部帳號');
    return profile;
  }
"""

          changed = []
          for name in ['src/publishing-only-entry.js','src/production-entry.js','src/worker.js']:
            path = Path(name)
            text = path.read_text()
            count = text.count(block)
            if count != 1:
              raise SystemExit(f'{name}: expected exactly one broad bypass block, found {count}')
            path.write_text(text.replace(block, '', 1))
            changed.append(name)

          print('Removed broad child auth bypass:', ', '.join(changed))

      - name: Validate defense in depth
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q '維護模式找不到可用內部帳號' src/publishing-only-entry.js
          ! grep -q '維護模式找不到可用內部帳號' src/production-entry.js
          ! grep -q '維護模式找不到可用內部帳號' src/worker.js
          grep -q 'XJW_MAINTENANCE_PRIVATE_READ_LOCKED' src/full-system-entry.js
          grep -q 'XJW_MAINTENANCE_READ_ONLY' src/full-system-entry.js
          grep -q '"TEMP_DISABLE_ACCESS": "true"' wrangler.jsonc
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run check
          npm run guard:full

      - name: Commit hardened maintenance mode
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TS15825868'
          git config user.email 'tung314069@gmail.com'
          git add src/publishing-only-entry.js src/production-entry.js src/worker.js
          if git diff --cached --quiet; then
            echo 'No child bypass cleanup needed.'
            exit 0
          fi
          git commit -m 'security: keep no-login maintenance bypass at top-level whitelist only'
          git push origin HEAD:main
