name: 仙加味貼文中心現況只讀驗證

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-post-queue-v20260815.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify live D1 queue
        shell: bash
        run: |
          set -euo pipefail
          echo 'STATUS_COUNTS'
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT status,COUNT(*) AS count FROM social_posts WHERE status<>'archived' GROUP BY status ORDER BY status;"
          echo 'DUPLICATE_ACTIVE_IMAGES'
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT image_url,COUNT(*) AS count FROM social_posts WHERE status IN ('pending_review','approved','scheduled','published') AND trim(image_url)<>'' GROUP BY image_url HAVING COUNT(*)>1 ORDER BY count DESC;"
          echo 'HELD_DUPLICATE_POSTS'
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT COUNT(*) AS count FROM social_posts WHERE status='draft' AND instr(image_source,'全庫圖文檢查：目前主圖與其他貼文重複')=1;"
          echo 'PENDING_WITHOUT_IMAGE'
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT COUNT(*) AS count FROM social_posts WHERE status='pending_review' AND trim(image_url)='';"
          echo 'BLOCKED_OLD_TEXT'
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT COUNT(*) AS count FROM social_posts WHERE status<>'archived' AND (instr(title,'台興山產')>0 OR instr(headline,'台興山產')>0 OR instr(copy,'台興山產')>0 OR instr(title,'2兩')>0 OR instr(headline,'2兩')>0 OR instr(copy,'2兩')>0);"
