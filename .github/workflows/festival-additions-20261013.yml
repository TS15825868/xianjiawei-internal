name: 仙加味2026至2027節慶補缺｜四篇新增與安全待審回填
on:
  push:
    branches: [main]
    paths: ['ops/festival-additions-20261013.json']
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  festival:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Exact live source leases and 16-point prechecks
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts ORDER BY id" > /tmp/festival-before.json
          node tools/apply-festival-additions-20261013.cjs prepare
      - name: Insert only new pending posts and return repaired content to review
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/festival-apply.sql
      - name: Verify actual records and every protected historical row
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts ORDER BY id" > /tmp/festival-after.json
          node tools/apply-festival-additions-20261013.cjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: festival-evidence-${{ github.run_id }}
          path: |
            /tmp/festival-before.json
            /tmp/festival-after.json
            /tmp/festival-result.json
          retention-days: 7
