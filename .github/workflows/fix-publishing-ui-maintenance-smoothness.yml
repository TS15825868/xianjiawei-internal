name: 仙加味貼文中心整理模式與流暢度修正

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-publishing-ui-maintenance-smoothness.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Patch publishing UI safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('assets/js/publishing-app-v2.js')
          s=p.read_text()

          def rep(old,new,count=1):
              global s
              actual=s.count(old)
              if actual < count:
                  raise SystemExit(f'missing publishing-app marker: {old[:120]!r} (found {actual})')
              s=s.replace(old,new,count)

          rep("const state={me:null,items:[],total:0,counts:{},filter:'',status:'all',loading:false,platforms:null,loadId:0};",
              "const state={me:null,items:[],total:0,counts:{},filter:'',status:'all',loading:false,platforms:null,loadId:0,maintenanceReadonly:false};")

          rep("    if(![2,6].includes(local.getDay()))continue;\n    local.setHours(local.getDay()===2?19:9,30,0,0);",
              "    if(![1,3,5].includes(local.getDay()))continue;\n    local.setHours(9,0,0,0);")

          marker="function audit(post){"
          insert="""function applyMaintenanceMode(){
  const readonly=Boolean(state.maintenanceReadonly);
  document.documentElement.dataset.maintenanceReadonly=readonly?'true':'false';
  const add=$('[data-add-post]');
  if(add){
    add.disabled=readonly;
    add.setAttribute('aria-disabled',readonly?'true':'false');
    add.title=readonly?'系統整理期間暫停新增；驗證恢復後會重新開放。':'';
  }
  if(readonly){
    const user=$('#userState');
    if(user)user.textContent='系統整理模式（唯讀）';
  }
}

"""
          rep(marker,insert+marker)

          rep("  const locked=post.status==='published';",
              "  const locked=post.status==='published';\n  const readOnly=state.maintenanceReadonly;")
          rep("${!locked?`<button class=\"btn small orange\" data-post-edit=\"${esc(post.id)}\">重新編輯</button>`:''}",
              "${!readOnly&&!locked?`<button class=\"btn small orange\" data-post-edit=\"${esc(post.id)}\">重新編輯</button>`:''}")
          rep("${post.status==='draft'?`<button class=\"btn small green\" data-post-status=\"pending_review\" data-id=\"${esc(post.id)}\" ${a.level==='danger'?'disabled':''}>送待審核</button>`:''}",
              "${!readOnly&&post.status==='draft'?`<button class=\"btn small green\" data-post-status=\"pending_review\" data-id=\"${esc(post.id)}\" ${a.level==='danger'?'disabled':''}>送待審核</button>`:''}")
          rep("${post.status==='pending_review'?`<button class=\"btn small green\" data-post-status=\"approved\" data-id=\"${esc(post.id)}\" ${a.level==='danger'?'disabled':''}>16項審核通過</button><button class=\"btn small\" data-post-status=\"draft\" data-id=\"${esc(post.id)}\">退回草稿</button>`:''}",
              "${!readOnly&&post.status==='pending_review'?`<button class=\"btn small green\" data-post-status=\"approved\" data-id=\"${esc(post.id)}\" ${a.level==='danger'?'disabled':''}>16項審核通過</button><button class=\"btn small\" data-post-status=\"draft\" data-id=\"${esc(post.id)}\">退回草稿</button>`:''}")
          rep("${post.status==='approved'?`<button class=\"btn small orange\" data-post-schedule=\"${esc(post.id)}\">安排時間</button><button class=\"btn small green\" data-post-publish-now=\"${esc(post.id)}\">立即發布</button>`:''}",
              "${!readOnly&&post.status==='approved'?`<button class=\"btn small orange\" data-post-schedule=\"${esc(post.id)}\">安排時間</button><button class=\"btn small green\" data-post-publish-now=\"${esc(post.id)}\">立即發布</button>`:''}")
          rep("${post.status==='scheduled'?`<button class=\"btn small orange\" data-post-schedule=\"${esc(post.id)}\">修改時間</button><button class=\"btn small\" data-post-status=\"draft\" data-id=\"${esc(post.id)}\">取消排程</button><button class=\"btn small green\" data-post-publish-now=\"${esc(post.id)}\">立即發布</button>`:''}",
              "${!readOnly&&post.status==='scheduled'?`<button class=\"btn small orange\" data-post-schedule=\"${esc(post.id)}\">修改時間</button><button class=\"btn small\" data-post-status=\"draft\" data-id=\"${esc(post.id)}\">取消排程</button><button class=\"btn small green\" data-post-publish-now=\"${esc(post.id)}\">立即發布</button>`:''}")

          rep("function renderList(){\n  const root=$('#listRoot');\n  if(!root)return;\n  const remaining=Math.max(0,state.total-state.items.length);",
              "function renderList(){\n  const root=$('#listRoot');\n  if(!root)return;\n  const signature=JSON.stringify([state.status,state.filter,state.total,state.items.map(p=>[p.id,p.updated_at,p.status,p.image_url])]);\n  if(root.dataset.renderSignature===signature){renderMetrics();return;}\n  root.dataset.renderSignature=signature;\n  const remaining=Math.max(0,state.total-state.items.length);")

          rep("    const data=await api(queryPath(offset),{timeout:18000});",
              "    const data=await api(queryPath(offset),{timeout:10000});")
          rep("    const batch=Array.isArray(data)?data:(data?.items||[]);",
              "    if(data?.maintenance_readonly||data?.maintenance_no_login){state.maintenanceReadonly=true;applyMaintenanceMode();}\n    const batch=Array.isArray(data)?data:(data?.items||[]);")

          rep("function openPostForm(post=null){\n  const edit=!!post;",
              "function openPostForm(post=null){\n  if(state.maintenanceReadonly){toast('系統整理期間為唯讀模式；新增與修改暫時鎖定。',true);return;}\n  const edit=!!post;")

          rep("${p.status==='manual_required'?`<div class=\"xjw-warning\">有平台需要人工發布。請使用卡片上的「手動發布包」，完成後再補登已發布。</div><div class=\"xjw-modal-footer\"><button class=\"btn green\" data-post-status=\"published\" data-id=\"${esc(p.id)}\">手動補登已發布</button></div>`:''}",
              "${!state.maintenanceReadonly&&p.status==='manual_required'?`<div class=\"xjw-warning\">有平台需要人工發布。請使用卡片上的「手動發布包」，完成後再補登已發布。</div><div class=\"xjw-modal-footer\"><button class=\"btn green\" data-post-status=\"published\" data-id=\"${esc(p.id)}\">手動補登已發布</button></div>`:''}")

          rep("function openSchedule(post){\n  const suggested=post.scheduled_at||post.proposed_scheduled_at||nextSlot();",
              "function openSchedule(post){\n  if(state.maintenanceReadonly){toast('系統整理期間為唯讀模式；排程暫時鎖定。',true);return;}\n  const suggested=post.scheduled_at||post.proposed_scheduled_at||nextSlot();")
          rep("固定時段為週二19:30、週六09:30；也可自行修改。立即發布不受固定時段限制，但仍必須維持目前16項圖文核准有效。",
              "固定時段為週一／週三／週五 09:00（台灣時間）；也可自行修改。立即發布不受固定時段限制，但仍必須維持目前16項圖文核准有效。")

          rep("async function changeStatus(id,status,button){\n  const done=setButtonBusy(button,'更新中…');",
              "async function changeStatus(id,status,button){\n  if(state.maintenanceReadonly){toast('系統整理期間為唯讀模式；狀態變更暫時鎖定。',true);return;}\n  const done=setButtonBusy(button,'更新中…');")
          rep("async function publishNow(id,button){\n  if(!confirm('確認要立即發布這篇貼文？系統只會發布到已完成授權的平台，其他平台會轉為人工發布。'))return;",
              "async function publishNow(id,button){\n  if(state.maintenanceReadonly){toast('系統整理期間為唯讀模式；立即發布暫時鎖定。',true);return;}\n  if(!confirm('確認要立即發布這篇貼文？系統只會發布到已完成授權的平台，其他平台會轉為人工發布。'))return;")

          rep("    state.me=await api('/me',{timeout:12000});\n    $('#userState').textContent=state.me?.display_name||state.me?.email||'已登入';",
              "    state.me=await api('/me',{timeout:8000});\n    state.maintenanceReadonly=Boolean(state.me?.maintenance_readonly||state.me?.maintenance_no_login);\n    applyMaintenanceMode();\n    $('#userState').textContent=state.maintenanceReadonly?'系統整理模式（唯讀）':(state.me?.display_name||state.me?.email||'已登入');")

          p.write_text(s)

          p=Path('assets/js/publishing-review-gate.js')
          s=p.read_text()

          def rep2(old,new,count=1):
              global s
              actual=s.count(old)
              if actual < count:
                  raise SystemExit(f'missing review-gate marker: {old[:120]!r} (found {actual})')
              s=s.replace(old,new,count)

          rep2("  let auditRun=0;\n  async function auditVisible(){\n    const run=++auditRun;\n    const ids=[...document.querySelectorAll('.publish-card [data-post-view],.xjw-row [data-post-view]')].map(node=>node.dataset.postView).filter(Boolean);\n    if(!ids.length)return;\n    try{\n      const [visibleResult,allResult]=await Promise.all([auditIds(ids),api('/posts/content-audit?all=1',{timeout:20000})]);",
               "  let auditRun=0;\n  let auditTimer=null;\n  let lastAuditSignature='';\n  let lastAuditAt=0;\n  let fullAuditCache={at:0,result:null};\n  const maintenanceReadonly=()=>document.documentElement.dataset.maintenanceReadonly==='true';\n  async function fullAudit(){\n    if(fullAuditCache.result&&Date.now()-fullAuditCache.at<60000)return fullAuditCache.result;\n    const result=await api('/posts/content-audit?all=1',{timeout:12000});\n    fullAuditCache={at:Date.now(),result};\n    return result;\n  }\n  function scheduleAudit(delay=160){clearTimeout(auditTimer);auditTimer=setTimeout(auditVisible,delay)}\n  async function auditVisible(){\n    if(maintenanceReadonly())return;\n    const run=++auditRun;\n    const cards=[...document.querySelectorAll('.publish-card,.xjw-row')];\n    const ids=cards.map(card=>card.querySelector('[data-post-view]')?.dataset?.postView||'').filter(Boolean);\n    if(!ids.length)return;\n    const signature=cards.map(card=>[card.querySelector('[data-post-view]')?.dataset?.postView||'',card.dataset.status||'',card.querySelector('.xjw-copy')?.textContent||'',card.querySelector('img')?.getAttribute('src')||''].join('|')).join('||');\n    if(signature===lastAuditSignature&&Date.now()-lastAuditAt<60000)return;\n    try{\n      const [visibleResult,allResult]=await Promise.all([auditIds(ids),fullAudit()]);\n      lastAuditSignature=signature;lastAuditAt=Date.now();")

          rep2("  window.addEventListener('xjw-publishing-list-rendered',()=>setTimeout(auditVisible,40));",
               "  window.addEventListener('xjw-publishing-list-rendered',()=>scheduleAudit(160));")
          rep2("  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{enhance();setTimeout(auditVisible,250)},{once:true});else{enhance();setTimeout(auditVisible,250)}",
               "  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{enhance();scheduleAudit(300)},{once:true});else{enhance();scheduleAudit(300)}")

          p.write_text(s)
          PY

      - name: Validate syntax and formal bundle
        shell: bash
        run: |
          node --check assets/js/publishing-app-v2.js
          node --check assets/js/publishing-review-gate.js
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run check
          npm run build:static
          grep -q "\[1,3,5\]" assets/js/publishing-app-v2.js
          grep -q "週一／週三／週五 09:00" assets/js/publishing-app-v2.js
          grep -q "maintenanceReadonly" assets/js/publishing-app-v2.js
          grep -q "fullAuditCache" assets/js/publishing-review-gate.js

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TS15825868'
          git config user.email 'tung314069@gmail.com'
          git add assets/js/publishing-app-v2.js assets/js/publishing-review-gate.js
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'fix: align publishing schedule and smooth maintenance UI'
          git push origin HEAD:main
