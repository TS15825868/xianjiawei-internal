name: 仙加味 ERP／貼文中心一次性正式驗收

on:
  push:
    paths:
      - 'audits/live-verification-trigger.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-internal-live-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      BASE_URL: https://xianjiawei-internal.tung314069.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Validate current full ERP and publishing source
        run: |
          set -euo pipefail
          npm run check
          npm run guard:full
          npm run build:static
          grep -q '仙加味營運中控' dist/erp.html
          grep -q '貼文中心系統 App' dist/publishing.html
          grep -Eq '"main"[[:space:]]*:[[:space:]]*"src/full-system-entry.js"' wrangler.jsonc
          grep -q 'erpUiEnabled:true' src/full-system-entry.js
          grep -q 'erpApisEnabled:true' src/full-system-entry.js
          grep -q 'publishingCenterIndependent:true' src/full-system-entry.js
          grep -q 'qixuanPublicVisible:false' src/product-authority.js
          echo 'PASS source/build contract'

      - name: Verify current remote D1 live data (read-only)
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo '--- D1 tables ---'
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
          echo '--- social_posts status summary ---'
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT COUNT(*) AS total, SUM(CASE WHEN status='draft' THEN 1 ELSE 0 END) AS draft, SUM(CASE WHEN status='pending_review' THEN 1 ELSE 0 END) AS pending_review, SUM(CASE WHEN status='approved' THEN 1 ELSE 0 END) AS approved, SUM(CASE WHEN status='scheduled' THEN 1 ELSE 0 END) AS scheduled, SUM(CASE WHEN status='published' THEN 1 ELSE 0 END) AS published, SUM(CASE WHEN status='manual_required' THEN 1 ELSE 0 END) AS manual_required, SUM(CASE WHEN status='failed' THEN 1 ELSE 0 END) AS failed, SUM(CASE WHEN status='archived' THEN 1 ELSE 0 END) AS archived FROM social_posts"
          echo '--- pending review rows ---'
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT id,title,category,status,image_url,image_approved,image_quality_status,review_note,updated_at FROM social_posts WHERE status='pending_review' ORDER BY updated_at DESC LIMIT 20"
          echo '--- published rows ---'
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT id,title,status,image_url,published_at,updated_at FROM social_posts WHERE status='published' ORDER BY COALESCE(published_at,updated_at) DESC LIMIT 20"
          echo '--- schedule range ---'
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT MIN(scheduled_at) AS first_scheduled_at, MAX(scheduled_at) AS last_scheduled_at, COUNT(*) AS rows_with_schedule FROM social_posts WHERE scheduled_at IS NOT NULL AND TRIM(scheduled_at)<>''"
          echo '--- ready-state missing image check ---'
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT COUNT(*) AS ready_state_missing_image FROM social_posts WHERE status IN ('pending_review','approved','scheduled','published') AND TRIM(COALESCE(image_url,''))=''"
          echo '--- foreign key check ---'
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "PRAGMA foreign_key_check"
          echo 'D1_LIVE_READONLY=PASS' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '已讀取正式 D1 的 social_posts 狀態分布、待審核／已發布摘要、排程範圍、正式狀態缺圖與 foreign key；此步驟不寫入資料。' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Cloudflare Access boundary does not expose server errors
        run: |
          set -euo pipefail
          for path in '/' '/erp.html' '/publishing.html' '/healthz/core'; do
            code="$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 25 "$BASE_URL$path")"
            echo "$path unauthenticated -> HTTP $code"
            test "$code" -ge 200
            test "$code" -lt 500
          done

      - name: Verify authenticated protected pages when service token is configured
        run: |
          set -euo pipefail
          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo 'AUTHENTICATED_LIVE=SKIPPED_NO_SERVICE_TOKEN' | tee -a "$GITHUB_STEP_SUMMARY"
            echo 'Cloudflare Access service-token secrets are not configured in GitHub; authenticated page-body verification remains pending.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          auth=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")

          curl -fsS --max-time 25 "${auth[@]}" "$BASE_URL/" -o /tmp/root.html
          grep -q '正在開啟仙加味營運中控' /tmp/root.html

          curl -fsS --max-time 25 "${auth[@]}" "$BASE_URL/erp.html" -o /tmp/erp.html
          grep -q '仙加味營運中控' /tmp/erp.html

          curl -fsS --max-time 25 "${auth[@]}" "$BASE_URL/publishing.html" -o /tmp/publishing.html
          grep -q '貼文中心系統 App' /tmp/publishing.html

          curl -fsS --max-time 25 "${auth[@]}" "$BASE_URL/healthz/core" -o /tmp/health.json
          grep -Eq 'ok|ready|healthy' /tmp/health.json

          echo 'AUTHENTICATED_LIVE=PASS' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '首頁 /、ERP、貼文中心與 healthz 已使用 Cloudflare Access service token 驗證正式內容。' >> "$GITHUB_STEP_SUMMARY"
