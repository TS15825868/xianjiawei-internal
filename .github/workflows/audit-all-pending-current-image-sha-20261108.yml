name: 仙加味全部待審圖片原檔與現版D1證據一致性驗收
on:
  push:
    branches: [main]
    paths: ['ops/request-all-pending-image-sha-audit-20261108.json']
permissions:
  contents: read
concurrency:
  group: xjw-all-pending-current-image-sha-readonly
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Read all current pending D1 rows and verify actual GitHub original image bytes and evidence
        run: node ops/audit-all-pending-current-image-sha-20261108.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-pending-source-sha-${{ github.run_id }}
          path: all-pending-current-image-sha-report.json
          if-no-files-found: warn
          retention-days: 7
