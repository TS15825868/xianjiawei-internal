name: 仙加味貼文圖片批次回填

# Legacy/manual fallback only.
# The formal automatic path is apply-post-image-current-batch.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Build D1 update SQL
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('ops/post-image-bindings-current.json','utf8'));
          const q=v=>"'" + String(v??'').replaceAll("'","''") + "'";
          const lines=[];
          for(const x of data.items){
            const url='https://raw.githubusercontent.com/TS15825868/xianjiawei-internal/main/'+x.path;
            lines.push(`UPDATE social_posts SET image_url=${q(url)}, image_alt=${q(x.alt)}, image_source=${q(x.source||'ChatGPT正式生成｜GitHub main｜人工待審核')}, image_width=${Number(x.width||1254)}, image_height=${Number(x.height||1254)}, image_bytes=${Number(x.bytes||0)}, image_quality_status='ok', image_approved=0, status='pending_review', approved_by=NULL, approved_at=NULL, scheduled_at=NULL, published_at=NULL, updated_at=datetime('now') WHERE id=${q(x.postId)} AND status='draft';`);
          }
          fs.writeFileSync('/tmp/apply-post-images.sql',lines.join('\n')+'\n');
          NODE
      - name: Apply image bindings to formal D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/apply-post-images.sql
      - name: Verify posts are pending review
        run: |
          node - <<'NODE' >/tmp/verify-query.txt
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('ops/post-image-bindings-current.json','utf8'));
          const ids=data.items.map(x=>"'" + String(x.postId).replaceAll("'","''") + "'").join(',');
          process.stdout.write(`SELECT id,status,image_url,image_width,image_height,image_quality_status FROM social_posts WHERE id IN (${ids}) ORDER BY id`);
          NODE
          QUERY="$(cat /tmp/verify-query.txt)"
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "$QUERY" > /tmp/verify.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('ops/post-image-bindings-current.json','utf8'));
          const raw=JSON.parse(fs.readFileSync('/tmp/verify.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          if(rows.length!==data.items.length)throw new Error('綁定後貼文數量不一致');
          for(const r of rows){
            if(r.status!=='pending_review')throw new Error(r.id+' 未進入 pending_review');
            if(!String(r.image_url||'').includes('/assets/post-images/'))throw new Error(r.id+' 圖片路徑不正確');
            if(Number(r.image_width)!==1254||Number(r.image_height)!==1254)throw new Error(r.id+' 圖片尺寸不正確');
            if(r.image_quality_status!=='ok')throw new Error(r.id+' 圖片品質狀態不正確');
          }
          console.log('PASS',rows.length,'posts pending_review with formal images');
          NODE
      - name: Rebuild current production queue
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,copy,category,image_alt,image_source FROM social_posts WHERE status='draft' ORDER BY id" > /tmp/active-drafts.json
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const raw=JSON.parse(fs.readFileSync('/tmp/active-drafts.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          const windowFor=(id='')=>{const s=String(id).toLowerCase();if(s.includes('cny-'))return'lunar_new_year_window';if(s.includes('year-end-'))return'year_end_window';if(s.includes('new-year-'))return'new_year_window';if(s.includes('weather-'))return'weather_dynamic';if(s.includes('season-'))return'cool_season_dynamic';return'evergreen'};
          const order={evergreen:0,weather_dynamic:1,cool_season_dynamic:2,year_end_window:3,new_year_window:4,lunar_new_year_window:5};
          const productKeys=['龜鹿膏','龜鹿湯塊','龜鹿膠','鹿茸粉'];
          const productListFor=text=>{
            const out=[];
            if(text.includes('30cc')) out.push('30cc');
            if(text.includes('180cc')) out.push('180cc');
            if(text.includes('龜鹿飲')&&!text.includes('30cc')&&!text.includes('180cc')) out.push('30cc','180cc');
            for(const x of productKeys) if(text.includes(x)) out.push(x);
            return [...new Set(out)];
          };
          rows.sort((a,b)=>(order[windowFor(a.id)]-order[windowFor(b.id)])||String(a.id).localeCompare(String(b.id)));
          const items=rows.map((r,index)=>{const text=[r.title,r.copy,r.image_alt].filter(Boolean).join(' ');return{postId:r.id,imageId:`XJW-ACTIVE-IMG-${String(index+1).padStart(3,'0')}`,kind:r.category||'生活內容',title:r.title||'',products:productListFor(text),scene:r.image_alt||'',imageSource:r.image_source||'',window:windowFor(r.id),status:'needs_unique_image',characterLock:'正式Q版小朋友小男孩、同一位角色；短黑髮、大眼睛、圓潤幼童臉型、固定頭身比；不得成熟化、少年化、成人化或像不同人；小鹿與小烏龜分開且相對尺寸固定。',copyHash:crypto.createHash('sha256').update(r.copy||'').digest('hex').slice(0,16)}});
          const out={version:'2026-09-22-v5-live-after-image-batch',brand:'仙加味',source:'Cloudflare D1 live social_posts WHERE status=draft',total:items.length,status:'production-queue',rule:'只為live D1目前status=draft的有效貼文製作唯一正式圖片；小老闆必須通過2026-09-24年齡／同一人鎖定；完成後回填pending_review；人工視覺審核前不得approved/scheduled/published；柒玄茶暫停對外。',characterLock:'正式Q版小朋友小男孩、同一位角色；短黑髮、大眼睛、圓潤幼童臉型、固定頭身比；不得成熟化、少年化、成人化或像不同人；小鹿與小烏龜分開且相對尺寸固定。',items};
          fs.writeFileSync('ops/post-image-production-queue-current.json',JSON.stringify(out,null,2)+'\n');
          console.log('remaining drafts',items.length);
          NODE
      - name: Commit rebuilt queue if changed
        run: |
          if git diff --quiet -- ops/post-image-production-queue-current.json; then exit 0; fi
          cp ops/post-image-production-queue-current.json /tmp/rebuilt-post-image-production-queue.json
          git checkout -- ops/post-image-production-queue-current.json
          git pull --rebase
          cp /tmp/rebuilt-post-image-production-queue.json ops/post-image-production-queue-current.json
          if git diff --quiet -- ops/post-image-production-queue-current.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/post-image-production-queue-current.json
          git commit -m 'sync: rebuild active post image queue'
          git push
