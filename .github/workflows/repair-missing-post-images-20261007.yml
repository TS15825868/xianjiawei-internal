name: 仙加味貼文破圖一次性修復 20261007

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-missing-post-images-20261007.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify missing image sources and move affected posts back to draft
        shell: bash
        run: |
          set -euo pipefail
          ids="'XJW-CONV-chat-deer-turtle-soup-choice','XJW-CONV-chat-elder-kitchen-habit','XJW-CONV-chat-family-old-object','XJW-CONV-chat-fixed-storage','XJW-CONV-chat-last-bowl','XJW-CONV-chat-receive-package','XJW-CONV-chat-recipe-or-feel','XJW-CONV-chat-shop-organizing','XJW-CONV-chat-simple-soup','XJW-CONV-chat-traditional-image'"
          test ! -d assets/post-images/2026-09-23
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_url FROM social_posts WHERE id IN ($ids) ORDER BY id" > before.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('before.json','utf8'));
          const rows=(Array.isArray(d)?d[0]?.results:d?.results)||[];
          if(rows.length!==10)throw new Error('預期10篇破圖貼文，實際 '+rows.length);
          for(const r of rows){
            if(r.status!=='pending_review')throw new Error(r.id+' 目前不是 pending_review，停止避免誤改');
            if(!String(r.image_url||'').includes('/assets/post-images/2026-09-23/'))throw new Error(r.id+' 圖片來源已改變，停止避免誤改');
          }
          console.log('PASS preflight: 10 missing-image pending_review posts confirmed');
          NODE
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "UPDATE social_posts SET status='draft',image_url='',image_alt='',image_source='',scheduled_at=NULL WHERE id IN ($ids) AND status='pending_review' AND image_url LIKE '%/assets/post-images/2026-09-23/%'"
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_url FROM social_posts WHERE id IN ($ids) ORDER BY id" > after.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('after.json','utf8'));
          const rows=(Array.isArray(d)?d[0]?.results:d?.results)||[];
          if(rows.length!==10)throw new Error('修復後筆數異常');
          for(const r of rows){
            if(r.status!=='draft'||String(r.image_url||'').trim()!=='')throw new Error(r.id+' 未正確退回待補圖草稿');
          }
          console.log('PASS repaired: 10 broken-image posts moved to draft with image cleared');
          NODE
      - name: Upload repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: xianjiawei-broken-image-repair-${{ github.run_id }}
          path: |
            before.json
            after.json
