name: 仙加味待審圖文正式編輯安全批次退件
on:
  push:
    branches: [main]
    paths: ['ops/editorial-batch-archive-request.json']
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Validate reusable bounded editorial review
        run: node --check ops/editorial-batch-archive-v1.mjs
      - name: Archive only verified editorial rejects with D1 CAS and audit readback
        run: node ops/editorial-batch-archive-v1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-batch-archive-${{ github.run_id }}
          path: editorial-batch-archive-readback.json
          if-no-files-found: warn
          retention-days: 7
