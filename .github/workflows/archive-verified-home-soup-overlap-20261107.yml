name: 仙加味已發家常湯重複候選精準封存（不發布）
on:
  push:
    branches: [main]
    paths: ['ops/request-archive-overlapping-home-soup-20261107.json']
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Archive one current duplicate by checked published receipt and CAS
        run: node ops/archive-verified-home-soup-overlap-20261107.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-soup-archive-${{ github.run_id }}
          path: home-soup-archive-result.json
          retention-days: 7
