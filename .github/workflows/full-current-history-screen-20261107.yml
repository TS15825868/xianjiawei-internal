name: 仙加味全部剩餘貼文跨平台歷史去重完整掃描
on:
  push:
    branches: [main]
    paths: ['ops/request-all-active-dedup-audit-20261107.json']
permissions:
  contents: write
concurrency:
  group: xianjiawei-all-pending-dedup-readonly
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Audit all current active posts against FB, IG, Threads published history without modification
        run: node ops/full-current-history-screen-20261107.mjs
      - name: Save one verified current-version all-pending editorial-dedup evidence report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/receipts
          cp all-active-history-dedup-screen.json ops/receipts/20261111-current-all-pending-history-screen.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('ops/receipts/20261111-current-all-pending-history-screen.json','utf8'));
          const n=Number(d.counts.find(r=>r.status==='pending_review')?.count||0);
          if(d.activePosts!==n||d.rows.length!==n||d.d1Mutations!==0||d.aiApprovals!==0||d.humanApprovals!==0||d.publications!==0)throw Error('Snapshot incomplete or released');
          console.log('Verified current D1 all-pending snapshot:',n,'published exact text duplicates:',d.copyExactPublished);
          NODE
          git config user.name 'xianjiawei-safe-audit-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/receipts/20261111-current-all-pending-history-screen.json
          git commit -m 'audit: preserve 2026-11-11 current pending published-history comparison'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-active-dedup-${{ github.run_id }}
          path: all-active-history-dedup-screen.json
          retention-days: 7
