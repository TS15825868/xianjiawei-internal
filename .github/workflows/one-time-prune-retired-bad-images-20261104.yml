name: XJW one-time cleanup of unreferenced historical bad images
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-prune-retired-bad-images-20261104.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify current D1 has NO references including published and archived
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_url FROM social_posts WHERE image_url LIKE '%/2026-09-30/batch6/%'" > /tmp/xjw-bad-retired-refs.json
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert/strict');
          const d=JSON.parse(fs.readFileSync('/tmp/xjw-bad-retired-refs.json','utf8'));
          const rows=(Array.isArray(d)?d[0]?.results:d?.results)||[];
          assert.equal(rows.length,0,'A historical bad image is referenced in live D1; refuse cleanup');
          console.log('PASS all historical/published/pending D1 rows do not reference retired batch6');
          NODE
      - name: Remove only the 14 confirmed bad and unreferenced retired image files
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const names=["XJW-CONV-chat-30-bare-jar.jpg","XJW-CONV-chat-30-vs-180.jpg","XJW-CONV-chat-drink-made-to-order.jpg","XJW-CONV-chat-gao-storage.jpg","XJW-CONV-chat-gao-vs-drink.jpg","XJW-CONV-chat-glass-vs-pouch-storage.jpg","XJW-CONV-chat-luerong-intro.jpg","XJW-CONV-chat-photo-size.jpg","XJW-CONV-chat-jiao-spec.jpg","XJW-CONV-chat-tang-vs-jiao.jpg","XJW-CONV-chat-tangkuai-spec.jpg","XJW-CONV-cny-family-choice.jpg","XJW-CONV-cny-gift-choice.jpg","XJW-CONV-cny-pre-clean.jpg"];
          const root='assets/post-images/2026-09-30/batch6/';
          const removed=[],skipped=[];
          for(const name of names){
            const path=root+name;
            if(!fs.existsSync(path)){skipped.push({path,reason:'already_missing'});continue;}
            let hits='';
            try{hits=cp.execFileSync('git',['grep','-F','-n','-e',path,'--','src','assets/js','assets/css','index.html','erp.html','publishing.html','data','config','.github/workflows'],{encoding:'utf8'});}catch(e){if(e.status!==1)throw e;}
            if(hits.trim()){skipped.push({path,reason:'active_code_reference',count:hits.trim().split('\n').length});continue;}
            cp.execFileSync('git',['rm','--',path]);
            removed.push(path);
          }
          fs.writeFileSync('/tmp/retired-image-cleanup.json',JSON.stringify({confirmedD1References:0,removed,skipped,neverTouchedPublished:true,neverPublished:true},null,2)+'\n');
          console.log('Retired confirmed bad image files removed:',removed.length,'skipped:',skipped.length);
          NODE
      - name: Commit safe deletion only; never redeploy or affect posted D1
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'No safe file deletions; no commit needed.'
            exit 0
          fi
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'Main advanced; refuse stale commit' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'cleanup: prune unused known-bad historic post artwork [skip ci]'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xjw-retired-bad-image-cleanup-${{ github.run_id }}
          path: /tmp/retired-image-cleanup.json
          retention-days: 3
