name: 仙加味貼文中心圖片上傳與手機工具整合

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-publishing-image-upload.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Consolidate direct upload and mobile essentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app=Path('assets/js/publishing-app-v2.js')
          s=app.read_text()
          old="""    form.dataset.uploadedFileKey=fileKey(file);
              setUploadPreview(form,result.url||'');
          """
          new="""    form.dataset.uploadedFileKey=fileKey(file);
              form.dataset.uploadedImageWidth=String(result.width||prepared.width||0);
              form.dataset.uploadedImageHeight=String(result.height||prepared.height||0);
              form.dataset.uploadedImageBytes=String(result.bytes||prepared.file.size||0);
              setUploadPreview(form,result.url||'');
          """
          if old in s:s=s.replace(old,new,1)
          old="""      delete body.image_file;
                body.platforms=selectedPlatforms(form);
          """
          new="""      delete body.image_file;
                if(form.dataset.uploadedImageWidth)body.image_width=Number(form.dataset.uploadedImageWidth||0);
                if(form.dataset.uploadedImageHeight)body.image_height=Number(form.dataset.uploadedImageHeight||0);
                if(form.dataset.uploadedImageBytes)body.image_bytes=Number(form.dataset.uploadedImageBytes||0);
                if(selectedFile&&String(body.image_url||'').trim())body.image_source='貼文中心直接上傳｜使用者人工指定';
                body.platforms=selectedPlatforms(form);
          """
          if old in s:s=s.replace(old,new,1)
          app.write_text(s)

          legacy=Path('assets/js/device-image-upload.js')
          s=legacy.read_text()
          marker="""    const field=input.closest('.field')||input.parentElement;
              const form=input.closest('form');
              if(!field||!form) return;
          """
          repl="""    const field=input.closest('.field')||input.parentElement;
              const form=input.closest('form');
              if(!field||!form) return;
              // 新版主編輯器已內建選圖／壓縮／上傳；此舊相容層只保留儲存後回待審核的 fetch 銜接，避免重複產生第二組上傳按鈕。
              if(form.querySelector('[data-upload-image],input[name=\"image_file\"]')) return;
          """
          if marker in s and '避免重複產生第二組上傳按鈕' not in s:s=s.replace(marker,repl,1)
          legacy.write_text(s)

          html=Path('publishing.html')
          s=html.read_text()
          s=s.replace('publishing-center-app-20260915-v14-mobile-fast-metricool-threads','publishing-center-app-20260916-v15-direct-upload')
          s=s.replace("window.__XJW_BOOT_VERSION__='20260915-lean-boot-v12-mobile-stable';","window.__XJW_BOOT_VERSION__='20260916-lean-boot-v13-mobile-tools';")
          s=s.replace('目前整理期間為免登入唯讀模式；重新連線只更新資料，不會重新整理整個頁面，也不會刪除貼文資料。','如果出現登入提示，完成 Cloudflare Access 登入後再按「重新連線」；重新連線只更新資料，不會刪除貼文。')
          s=s.replace('/assets/js/device-image-upload.js?v=20260818-direct-upload-v2','/assets/js/device-image-upload.js?v=20260916-consolidated-v3')
          s=s.replace('/assets/js/publishing-app-v2.js?v=20260915-mobile-stable-v12','/assets/js/publishing-app-v2.js?v=20260916-direct-upload-v20')
          old="""        var mobile=!!(window.matchMedia&&window.matchMedia('(max-width:720px)').matches);
                  if(mobile)return;
                  var essential=['/assets/js/publishing-readiness-ui.js?v=20260914-live-summary-v9','/assets/js/manual-publish-tools.js?v=20260818-lazy-v2'];
          """
          new="""        var mobile=!!(window.matchMedia&&window.matchMedia('(max-width:720px)').matches);
                  if(mobile){
                    setTimeout(function(){
                      loadScript('/assets/js/manual-publish-tools.js?v=20260916-mobile-v3').catch(function(){});
                      loadScript('/assets/js/post-regenerate-policy-v1.js?v=20260916-mobile-policy-v8').then(function(){return loadScript('/assets/js/post-regenerate-buttons.js?v=20260916-mobile-buttons-v4')}).catch(function(){});
                    },900);
                    return;
                  }
                  var essential=['/assets/js/publishing-readiness-ui.js?v=20260914-live-summary-v9','/assets/js/manual-publish-tools.js?v=20260916-desktop-v3'];
          """
          if old in s:s=s.replace(old,new,1)
          html.write_text(s)
          PY
          node --check assets/js/publishing-app-v2.js
          node --check assets/js/device-image-upload.js
          grep -q '20260916-direct-upload-v20' publishing.html
          grep -q '20260916-mobile-buttons-v4' publishing.html
          grep -q '避免重複產生第二組上傳按鈕' assets/js/device-image-upload.js
          grep -q 'uploadedImageWidth' assets/js/publishing-app-v2.js
      - name: Commit consolidated UI
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/js/publishing-app-v2.js assets/js/device-image-upload.js publishing.html; then
            echo 'Publishing UI already consolidated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/publishing-app-v2.js assets/js/device-image-upload.js publishing.html
          git commit -m 'fix: consolidate direct upload and mobile publishing tools'
          git push
