name: 修正正式排程逾時發布 v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-late-publish-guard-v2-20260907.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 修正逾時防呆
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_social_publisher.py
          python /tmp/patch_social_publisher.py
          node --check src/social-publisher.js
          grep -F 'MAX_SCHEDULE_LATENESS_MINUTES=15' src/social-publisher.js
          grep -F 'lateScheduleGuardEnabled:true' src/social-publisher.js
      - name: 正式檢查與建置
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check
          npm run build:static
      - name: 提交正式修正
        run: |
          set -euo pipefail
          git config user.name 'TS15825868'
          git config user.email 'tung314069@gmail.com'
          git add src/social-publisher.js
          git commit -m '防止正式貼文超過15分鐘後自動晚發'
          git push origin HEAD:main
      - name: 部署正式 Worker
        run: |
          set -euo pipefail
          npx wrangler deploy --keep-vars
      - name: 驗證正式狀態
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT id,title,status,scheduled_at,proposed_scheduled_at,image_approved FROM social_posts WHERE id IN ('XJW-SOCIAL-20260909-0900-CHOOSE','XJW-SOCIAL-20260911-0900-RECIPE') ORDER BY proposed_scheduled_at;"
          grep -F '"crons": ["* * * * *"]' wrangler.jsonc
      - name: 清理一次性流程
        if: always()
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          rm -f .github/workflows/fix-late-publish-guard-v2-20260907.yml
          git config user.name 'TS15825868'
          git config user.email 'tung314069@gmail.com'
          git add .github/workflows/fix-late-publish-guard-v2-20260907.yml
          if ! git diff --cached --quiet; then
            git commit -m '移除正式排程逾時防呆修正流程 v2'
            git push origin HEAD:main
          fi
