name: 驗證 9/4 首篇實際發布狀態

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-0904-publish-status.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: 查詢首篇貼文與平台發布結果
        run: |
          set -e
          echo '=== social_posts ==='
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT id,title,status,scheduled_at,published_at,updated_at,platforms_json,image_url FROM social_posts WHERE id='XJW-SOCIAL-20260904-0900-FIRST';"
          echo '=== deliveries ==='
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT post_id,platform,status,remote_id,attempt_count,last_attempt_at,error_text FROM social_publish_deliveries WHERE post_id='XJW-SOCIAL-20260904-0900-FIRST' ORDER BY platform;"
