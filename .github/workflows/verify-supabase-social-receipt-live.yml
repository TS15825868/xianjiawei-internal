name: 仙加味 Supabase Meta 安全收件線上驗收
on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-supabase-social-receipt-live.yml'
permissions:
  contents: read
concurrency:
  group: xjw-supabase-receipt-live-readonly
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: 唯讀 GET 驗證既有 Edge 收件服務拒絕未授權請求
        shell: bash
        run: |
          set -euo pipefail
          # No signature, token, customer data or POST: must not persist an event.
          url='https://iphexhvjhsmelbgwzhhr.supabase.co/functions/v1/xjw-social-receipt'
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --retry 1 --retry-delay 3 --dump-header /tmp/xjw-edge-readonly.headers --output /tmp/xjw-edge-readonly.json \
            --write-out '%{http_code}' "$url")
          echo "Received safe GET status $status"
          node - "$status" <<'NODE'
          const fs=require('node:fs');
          const status=Number(process.argv[2]);
          let result;
          try{result=JSON.parse(fs.readFileSync('/tmp/xjw-edge-readonly.json','utf8'))}
          catch{throw Error('Edge function did not return JSON');}
          if(result.sent!==false||result.accepted===true)
            throw Error('Unauthenticated GET must never be accepted or sent');
          const permitted=(status===503&&['receipt_disabled','verification_required'].includes(result.code))||
            (status===400&&result.code==='verification_rejected');
          if(!permitted)throw Error('Edge receipt live acceptance state is not verified');
          const headers=fs.readFileSync('/tmp/xjw-edge-readonly.headers','utf8');
          if(!/^cache-control:\s*[^\r\n]*no-store/im.test(headers))
            throw Error('Sensitive receipt endpoint must be non-cacheable');
          console.log('PASS signed-only Meta receipt endpoint rejects unauthenticated GET, sent=false, no-store; code='+result.code);
          NODE
      - name: 缺少 Meta verify token 的 GET 挑戰仍須拒絕（不含任何正式憑證）
        shell: bash
        run: |
          set -euo pipefail
          # No secret, no POST and no customer data. An opt-in GET handshake
          # may return 200 only for the exact secret known to Meta/operators.
          url='https://iphexhvjhsmelbgwzhhr.supabase.co/functions/v1/xjw-social-receipt?hub.mode=subscribe&hub.challenge=123456789'
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /tmp/xjw-edge-wrong-token.json --write-out '%{http_code}' "$url")
          node - "$status" <<'NODE'
          const fs=require('node:fs');
          const status=Number(process.argv[2]);
          let result;
          try{result=JSON.parse(fs.readFileSync('/tmp/xjw-edge-wrong-token.json','utf8'))}
          catch{throw Error('Unauthenticated Meta verification must not return a challenge or HTML');}
          if(result.sent!==false||result.accepted===true)
            throw Error('Verification challenge without token must never be accepted or sent');
          if(!((status===503&&['receipt_disabled','verification_required'].includes(result.code))||
               (status===400&&result.code==='verification_rejected')))
            throw Error('Unexpected response to Meta challenge without a verify token');
          console.log('PASS no-token Meta challenge rejected; automatic customer replies remain disabled.');
          NODE
      - name: 錯誤 Meta verify token 不得取得任何驗證回傳
        shell: bash
        run: |
          set -euo pipefail
          # A known-invalid, nonsecret literal; never use official verify tokens in CI.
          url='https://iphexhvjhsmelbgwzhhr.supabase.co/functions/v1/xjw-social-receipt?hub.mode=subscribe&hub.verify_token=xjw-not-a-valid-token-test-only&hub.challenge=123456789'
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /tmp/xjw-edge-invalid-verification.json --write-out '%{http_code}' "$url")
          node - "$status" <<'NODE'
          const fs=require('node:fs');
          const status=Number(process.argv[2]);
          let data;
          try{data=JSON.parse(fs.readFileSync('/tmp/xjw-edge-invalid-verification.json','utf8'))}
          catch{throw Error('A known-wrong Meta challenge returned non-JSON or was echoed');}
          if(data.accepted===true||data.sent!==false)
            throw Error('Known-wrong challenge must never authorize receipt or sending');
          if(!((status===503&&['receipt_disabled','verification_required'].includes(data.code))||
               (status===400&&data.code==='verification_rejected')))
            throw Error('Known-wrong token must fail closed');
          console.log('PASS live Meta GET with wrong verification token rejected, no durable event and no send.');
          NODE
