name: 仙加味貼文D1資料診斷
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-diagnose-publishing-d1-v20260815.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Inspect remote D1 social_posts and audit_logs
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "PRAGMA table_info(social_posts);"
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT COUNT(*) AS total_posts FROM social_posts; SELECT id,typeof(id) AS id_type,status,title,created_at FROM social_posts ORDER BY created_at DESC LIMIT 40;"
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT COUNT(*) AS guilu_audits FROM audit_logs WHERE entity_id LIKE 'XJW-GUILU-%'; SELECT id,action,entity_id,created_at FROM audit_logs WHERE entity_id LIKE 'XJW-GUILU-%' ORDER BY created_at DESC LIMIT 40;"
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT COUNT(*) AS pending_count FROM social_posts WHERE status='pending_review'; SELECT id,status,title FROM social_posts WHERE status='pending_review' ORDER BY created_at DESC LIMIT 40;"
