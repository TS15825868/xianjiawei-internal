name: One-shot final Access and profile audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-final-access-profile-audit-v20260815.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Audit Access application and policies
        shell: bash
        run: |
          set -euo pipefail
          app_id='010ecc73-3f19-49a4-9115-8b0f9c9e405c'
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps/$app_id" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/app.json
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps/$app_id/policies?per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/policies.json
          node - <<'NODE'
          const fs=require('fs');
          const app=JSON.parse(fs.readFileSync('/tmp/app.json','utf8'));
          const policies=JSON.parse(fs.readFileSync('/tmp/policies.json','utf8'));
          if(app.success!==true||policies.success!==true) throw new Error('Cloudflare Access audit API failed');
          const a=app.result||{};
          if(a.domain!=='xianjiawei-internal.tung314069.workers.dev') throw new Error('Access domain mismatch');
          if(a.aud!=='201dea08ea9611989cd8ad4ccac88f99974fd9b1309e4af74bf11a397ee6522f') throw new Error('Access audience mismatch');
          const active=(policies.result||[]).filter(p=>p.decision!=='deny');
          if(!active.length) throw new Error('No active allow/bypass Access policy found');
          console.log('ACCESS_APP='+String(a.name||''));
          console.log('ACCESS_DOMAIN='+a.domain);
          console.log('ACCESS_SESSION_DURATION='+String(a.session_duration||''));
          console.log('ACCESS_ACTIVE_POLICY_COUNT='+active.length);
          console.log('PASS: Access application and policy layer are present.');
          NODE
      - name: Audit D1 owner profiles and post queue
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT email, display_name, role, active FROM profiles ORDER BY email"
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT status, COUNT(*) AS count FROM social_posts GROUP BY status ORDER BY status"
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT COUNT(*) AS active_profile_count FROM profiles WHERE active=1"
