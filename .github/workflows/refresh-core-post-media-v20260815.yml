name: 仙加味核心貼文最新版圖文回填 20260815

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-core-post-media-v20260815.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-core-post-media-refresh-20260815
  cancel-in-progress: false

jobs:
  refresh-core-media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare D1 credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install Wrangler
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Refresh only draft and pending-review stale core posts
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/core-refresh.sql <<'SQL'
          UPDATE social_posts SET
            title='鹿茸粉75g',
            copy='鹿茸粉75g／罐，可依個人習慣加入溫開水、牛奶、豆漿或其他飲品中攪拌。',
            image_url='https://ts15825868.github.io/xianjiawei/images/customer-display-v20260812/luerong-fen.avif',
            image_alt='仙加味鹿茸粉75g正式顧客展示圖',
            image_source='2026-08-15目前正式顧客產品圖｜luerong-fen.avif',
            status='pending_review',scheduled_at=NULL,proposed_scheduled_at=NULL,approved_by=NULL,approved_at=NULL,published_at=NULL,image_approved=0,updated_at=CURRENT_TIMESTAMP
          WHERE id='POST-LUERONG' AND status IN ('draft','pending_review');

          UPDATE social_posts SET
            title='四季日常節奏',
            copy='春天整理步調、夏天留意清爽、秋天回到規律、冬天安排溫熱。從每天做得到的小事開始。',
            image_url='https://ts15825868.github.io/xianjiawei/images/posts/generated-v20260808-preflight/four-seasons.svg',
            image_alt='春夏秋冬四季環境、色調與冷熱感清楚區分的日常節奏情境',
            image_source='2026-08-15目前四季專屬情境圖｜four-seasons.svg',
            status='pending_review',scheduled_at=NULL,proposed_scheduled_at=NULL,approved_by=NULL,approved_at=NULL,published_at=NULL,image_approved=0,updated_at=CURRENT_TIMESTAMP
          WHERE id='POST-SEASONS-RHYTHM' AND status IN ('draft','pending_review');

          UPDATE social_posts SET
            copy='天氣悶熱時，外出記得帶水，依活動量分次補充，也可留意防曬與休息。',
            image_url='https://ts15825868.github.io/xianjiawei/images/post-library/userzip3-v20260811/hot-weather-hydration-2.webp',
            image_alt='天氣悶熱外出時留意補水與防曬的情境',
            image_source='2026-08-11最新使用者ZIP｜hot-weather-hydration-2.webp｜發布前12小時內確認當日實際天氣',
            status='pending_review',scheduled_at=NULL,proposed_scheduled_at=NULL,approved_by=NULL,approved_at=NULL,published_at=NULL,image_approved=0,updated_at=CURRENT_TIMESTAMP
          WHERE id='POST-WEATHER-HOT' AND status IN ('draft','pending_review');

          UPDATE social_posts SET
            copy='早晚溫差較明顯時，外出可多帶一件薄外套，依當天實際溫度調整穿著。',
            image_url='https://ts15825868.github.io/xianjiawei/images/post-library/userzip3-v20260811/temperature-coat.webp',
            image_alt='早晚溫差明顯時外出多帶一件薄外套的情境',
            image_source='2026-08-11最新使用者ZIP｜temperature-coat.webp｜發布前12小時內確認當日實際天氣',
            status='pending_review',scheduled_at=NULL,proposed_scheduled_at=NULL,approved_by=NULL,approved_at=NULL,published_at=NULL,image_approved=0,updated_at=CURRENT_TIMESTAMP
          WHERE id='POST-WEATHER-TEMP' AND status IN ('draft','pending_review');

          UPDATE social_posts SET
            copy='下雨天的步調可以慢一點，收好雨具，回到室內喝口溫水、整理手邊的事。',
            image_url='https://ts15825868.github.io/xianjiawei/images/post-library/userzip3-v20260811/rainy-home.webp',
            image_alt='下雨天在家放慢步調並喝溫水的情境',
            image_source='2026-08-11最新使用者ZIP｜rainy-home.webp｜發布前12小時內確認當日實際天氣',
            status='pending_review',scheduled_at=NULL,proposed_scheduled_at=NULL,approved_by=NULL,approved_at=NULL,published_at=NULL,image_approved=0,updated_at=CURRENT_TIMESTAMP
          WHERE id='POST-WEATHER-RAIN' AND status IN ('draft','pending_review');
          SQL
          npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/core-refresh.sql
      - name: Verify refreshed core records
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,status,image_url,image_alt FROM social_posts WHERE id IN ('POST-LUERONG','POST-SEASONS-RHYTHM','POST-WEATHER-HOT','POST-WEATHER-TEMP','POST-WEATHER-RAIN') ORDER BY id;" > /tmp/core.json
          node - <<'NODE'
          const fs=require('fs');
          const blocks=JSON.parse(fs.readFileSync('/tmp/core.json','utf8'));
          const rows=blocks.flatMap(x=>x.results||[]);
          if(rows.length!==5)throw new Error(`核心回填筆數錯誤：${rows.length}/5`);
          for(const row of rows){if(!row.image_url||!row.image_alt)throw new Error(`${row.id} 仍缺圖片或圖片說明`);if(row.status!=='pending_review')throw new Error(`${row.id} 未回待審核`)}
          console.log('PASS: 5 個已確認過期／缺圖核心貼文已回填最新版匹配圖片並回待審核。');
          NODE
      - name: Audit all current D1 semantic image-copy matches
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,headline,copy,category,image_url,image_alt,image_source,status FROM social_posts WHERE status<>'archived' ORDER BY id;" > /tmp/live-posts.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { semanticErrors } from './src/publishing-content-audit-entry.js';
          const blocks=JSON.parse(fs.readFileSync('/tmp/live-posts.json','utf8'));
          const rows=blocks.flatMap(block=>block.results||[]);
          const problems=[];
          for(const row of rows){const errors=semanticErrors(row,rows);if(errors.length)problems.push({id:row.id,title:row.title,status:row.status,image_url:row.image_url,errors});}
          if(problems.length){console.error('SEMANTIC_IMAGE_COPY_PROBLEMS',JSON.stringify(problems,null,2));process.exit(1)}
          console.log(`PASS: ${rows.length} 篇目前未封存貼文全部通過季節／天氣／情境／圖片語意巡檢。`);
          NODE
