name: 診斷貼文中心正式資料 v20260818

on:
  push:
    branches: [main]
    paths:
      - 'assets/data/live-diagnose-posts-v20260818.trigger'
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@latest
      - name: Query production D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,category,status,image_url,image_alt,image_source,image_quality_status,image_approved,platforms_json,scheduled_at,published_at,created_at,updated_at FROM social_posts WHERE status<>'archived' ORDER BY datetime(updated_at) DESC,datetime(created_at) DESC,id DESC;" > /tmp/live-posts.raw.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/live-posts.raw.json','utf8'));
          const rows=raw?.[0]?.results||[];
          const out={checked_at:new Date().toISOString(),count:rows.length,counts:{},posts:rows};
          for(const r of rows) out.counts[r.status]=(out.counts[r.status]||0)+1;
          fs.mkdirSync('audits',{recursive:true});
          fs.writeFileSync('audits/live-posts-v20260818.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({count:out.count,counts:out.counts,posts:rows.map(x=>({id:x.id,title:x.title,status:x.status,image_url:x.image_url}))},null,2));
          NODE
      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f audits/live-posts-v20260818.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(posts): record production posting center state'
          git pull --rebase origin main
          git push origin HEAD:main
