name: One-shot clean public alt and wording
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-clean-public-alt-v20260815.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Clean customer-visible wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          bank_path=Path('assets/data/guilu-content-topic-bank-v20260814.json')
          bank=json.loads(bank_path.read_text())
          alt_rewrites={
            'drink30-small-jar':'龜鹿飲30cc玻璃罐｜小玻璃裸罐、無貼紙',
            'drink30-warm':'龜鹿飲30cc玻璃罐｜溫熱飲用',
            'drink180-pouch':'龜鹿飲180cc鋁袋｜狹長直立鋁袋',
            'drink180-home':'龜鹿飲180cc鋁袋｜居家日常介紹',
            'gao-100g':'龜鹿膏100g／罐',
            'tangkuai-75g':'龜鹿湯塊75g （2兩）／盒｜8塊裝',
            'tangkuai-detail-weight':'龜鹿湯塊75g （2兩）／盒｜8塊裝',
            'jiao-600g':'龜鹿膠600g （1斤）／盒｜32塊裝',
            'jiao-family':'龜鹿膠600g大盒｜家庭使用',
            'jiao-detail-weight':'龜鹿膠600g （1斤）／盒｜32塊裝',
            'luerong-75g':'鹿茸粉75g／罐',
            'trial-first':'龜鹿飲30cc試喝組｜仙加味小老闆與3罐試喝'
          }
          found=set()
          for topic in bank.get('topics',[]):
              tid=topic.get('id')
              if tid in alt_rewrites:
                  topic['imageAlt']=alt_rewrites[tid];found.add(tid)
              if tid=='gao-first-half':
                  topic['headline']='初次可先從半匙開始，再依自己的使用習慣安排'
              if tid=='luerong-single-material':
                  topic['copy']=str(topic.get('copy','')).replace('鹿茸粉的正式資訊很直接：','鹿茸粉的產品資訊很直接：')
          missing=set(alt_rewrites)-found
          if missing: raise SystemExit(f'missing topic ids: {sorted(missing)}')
          bank['version']='2026-08-15-guilu-publishing-v6-customer-visible-clean'
          bank_path.write_text(json.dumps(bank,ensure_ascii=False,separators=(',',':'))+'\n')

          # 顧客可見文字守門再補上容易混入的內部圖檔／校稿語氣。
          paths=['assets/js/publishing-app-v2.js','src/publishing-review-gate-entry.js','tools/build-social-batches-review-seed.mjs','tools/build-guilu-review-seed.mjs','tools/build-guilu-draft-seed.mjs']
          for path in paths:
              p=Path(path);s=p.read_text()
              old="'內部檢查','客戶實際會看到的文案']"
              new="'內部檢查','客戶實際會看到的文案','產品原圖','正式資訊','正式說明']"
              if old not in s: raise SystemExit(f'guard anchor missing: {path}')
              p.write_text(s.replace(old,new,1))
          print('PASS public alt/copy cleanup patched')
          PY
      - name: Validate source and build
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run check
          npm run guard:full
          npm run build:static
          XJW_CONTENT_SEED_CREATED_BY='tung314069@gmail.com' node tools/build-guilu-review-seed.mjs >/tmp/review.sql
          XJW_CONTENT_SEED_CREATED_BY='tung314069@gmail.com' node tools/build-guilu-draft-seed.mjs >/tmp/draft.sql
          XJW_CONTENT_SEED_CREATED_BY='tung314069@gmail.com' node tools/build-social-batches-review-seed.mjs >/tmp/social.sql
      - name: Commit permanent public-copy cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/guilu-content-topic-bank-v20260814.json assets/js/publishing-app-v2.js src/publishing-review-gate-entry.js tools/build-social-batches-review-seed.mjs tools/build-guilu-review-seed.mjs tools/build-guilu-draft-seed.mjs
          git commit -m 'fix(publishing): clean customer-visible alt text and internal wording'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Deploy customer-copy guard update
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --keep-vars
      - name: Verify protected production boundary
        shell: bash
        run: |
          set -euo pipefail
          base='https://xianjiawei-internal.tung314069.workers.dev'
          for path in '/' '/publishing' '/publishing.html' '/healthz/core'; do
            body="$(mktemp)"
            result="$(curl -LsS --max-redirs 6 --max-time 25 -o "$body" -w '%{http_code} %{num_redirects} %{url_effective}' "$base$path")"
            code="${result%% *}"
            echo "$path -> $result"
            test "$code" -ge 200
            test "$code" -lt 500
            grep -Eiq '貼文中心系統 App|<html|<!doctype|cloudflare|access|sign in|login|publishing' "$body"
          done
