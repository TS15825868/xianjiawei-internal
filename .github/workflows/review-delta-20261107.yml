name: 仙加味目前版本審核證據增量綁定（不核准不發布）
on:
  push:
    branches: [main]
    paths: ['ops/review-delta-request-20261107.json']
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: node ops/apply-review-delta-20261107.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-delta-${{ github.run_id }}
          path: review-delta-results.json
          retention-days: 7
