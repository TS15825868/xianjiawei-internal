name: 仙加味走春離題連結草稿安全封存
on:
  push:
    branches: [main]
    paths: ['ops/request-spring-walk-linked-safe-hold-20261109.json']
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node --check ops/archive-spring-walk-linked-safe-hold-20261109.mjs
      - run: node ops/archive-spring-walk-linked-safe-hold-20261109.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spring-walk-linked-safe-hold-${{ github.run_id }}
          path: spring-walk-linked-safe-hold-result.json
          retention-days: 7
