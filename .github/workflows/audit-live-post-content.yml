name: 仙加味全部現行貼文圖文語意巡檢

on:
  push:
    branches: [main]
    paths:
      - 'src/publishing-content-audit-entry.js'
      - 'src/publishing-review-gate-entry.js'
      - 'assets/data/social-image-audit-v20260815.json'
      - '.github/workflows/audit-live-post-content.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-live-post-semantic-audit
  cancel-in-progress: true

jobs:
  audit-live-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare D1 credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Fetch all current non-archived posts
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,headline,copy,category,image_url,image_alt,image_source,status FROM social_posts WHERE status<>'archived' ORDER BY id;" > /tmp/live-posts.json
      - name: Audit copy-image semantic match for every current post
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { semanticErrors } from './src/publishing-content-audit-entry.js';
          const blocks=JSON.parse(fs.readFileSync('/tmp/live-posts.json','utf8'));
          const rows=blocks.flatMap(block=>block.results||[]);
          const problems=[];
          for(const row of rows){
            const errors=semanticErrors(row,rows);
            if(errors.length)problems.push({id:row.id,title:row.title,status:row.status,image_url:row.image_url,errors});
          }
          if(problems.length){
            console.error('SEMANTIC_IMAGE_COPY_PROBLEMS',JSON.stringify(problems,null,2));
            process.exit(1);
          }
          console.log(`PASS: ${rows.length} live non-archived posts passed season/weather/context/image semantic audit.`);
          NODE
      - name: Summary
        if: always()
        run: echo '全部未封存貼文皆以目前季節／天氣／情境／料理／保存／外出／產品主題規則逐篇檢查。'
