name: 仙加味已發布貼文狀態修復 20261007

on:
  push:
    branches: [main]
    paths:
      - 'ops/published-status-repair-current.json'

permissions:
  contents: write

concurrency:
  group: xianjiawei-published-status-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Build verified published-state repair SQL
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('ops/published-status-repair-current.json','utf8'));
          if(!Array.isArray(c.items)||c.items.length!==2)throw new Error('repair must contain exactly 2 verified published posts');
          const q=v=>"'"+String(v??'').replaceAll("'","''")+"'";
          const lines=[];
          for(const x of c.items){
            if(x.metricoolStatus!=='PUBLISHED'||!x.userApproved)throw new Error(x.postId+' missing verified approval/published evidence');
            lines.push(`UPDATE social_posts SET status='published', image_url=${q(x.imageUrl)}, image_alt=${q(x.imageAlt)}, image_source=${q(x.imageSource)}, image_quality_status='ok', image_approved=1, approved_by=${q(x.approvedBy)}, approved_at=COALESCE(approved_at,${q(x.approvedAt)}), scheduled_at=${q(x.publishedAt)}, published_at=${q(x.publishedAt)}, updated_at=datetime('now') WHERE id=${q(x.postId)};`);
          }
          fs.writeFileSync('/tmp/repair.sql',lines.join('\n')+'\n');
          fs.writeFileSync('/tmp/ids.txt',c.items.map(x=>q(x.postId)).join(','));
          NODE
          npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/repair.sql
      - name: Verify two published rows
        run: |
          IDS="$(cat /tmp/ids.txt)"
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_url,image_approved,approved_by,scheduled_at,published_at FROM social_posts WHERE id IN ($IDS) ORDER BY id" > /tmp/verify.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/verify.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          if(rows.length!==2)throw new Error('expected 2 repaired rows');
          for(const r of rows){
            if(r.status!=='published'||Number(r.image_approved)!==1||!r.image_url||!r.published_at)throw new Error(r.id+' repair verification failed');
          }
          console.log('PASS repaired published rows',rows.length);
          NODE
      - name: Rebuild live draft image queue
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,copy,category,image_alt,image_source FROM social_posts WHERE status='draft' ORDER BY id" > /tmp/drafts.json
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const raw=JSON.parse(fs.readFileSync('/tmp/drafts.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          const items=rows.map((r,index)=>({postId:r.id,imageId:`XJW-ACTIVE-IMG-${String(index+1).padStart(3,'0')}`,kind:r.category||'生活內容',title:r.title||'',scene:r.image_alt||'',imageSource:r.image_source||'',status:'needs_unique_image',copyHash:crypto.createHash('sha256').update(r.copy||'').digest('hex').slice(0,16)}));
          fs.writeFileSync('ops/post-image-production-queue-current.json',JSON.stringify({version:'2026-10-07-after-published-drift-repair',brand:'仙加味',source:'Cloudflare D1 live social_posts WHERE status=draft',total:items.length,status:'production-queue',rule:'只為live D1目前status=draft的有效貼文製作唯一正式圖片；人工審核前不得發布。',items},null,2)+'\n');
          if(items.length!==0)throw new Error('draft queue not zero: '+items.length);
          NODE
      - name: Record final queue state
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='ops/post-image-production-status-current.json';
          const s=JSON.parse(fs.readFileSync(p,'utf8'));
          s.version='2026-10-07-publishing-queue-complete';
          s.updatedAt=new Date().toISOString();
          s.remainingNeedsUniqueImage=0;
          s.nextWork=['目前有效draft製圖佇列已清零；後續只處理新建立或人工退回的內容'];
          s.note='2026-10-07：10篇缺圖已復原並回pending_review；另2篇已由Metricool三平台published證據修正D1狀態，正式draft製圖佇列=0。';
          fs.writeFileSync(p,JSON.stringify(s,null,2)+'\n');
          NODE
          git rm -f ops/published-status-repair-current.json
          git add ops/post-image-production-queue-current.json ops/post-image-production-status-current.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'sync: finalize publishing queue after verified published-state repair'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            [ "$attempt" = 4 ] && exit 1
            sleep 2
          done
