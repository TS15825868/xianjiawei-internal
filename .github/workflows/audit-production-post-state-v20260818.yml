name: 稽核貼文中心正式資料 20260818

on:
  push:
    branches: [main]
    paths:
      - 'assets/data/audit-production-post-state-v20260818.trigger'
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save wrangler@latest
      - name: Read production D1 state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audits
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,category,status,image_url,image_alt,image_source,image_quality_status,image_approved,platforms_json,scheduled_at,published_at,updated_at FROM social_posts WHERE status<>'archived' ORDER BY CASE status WHEN 'published' THEN 0 WHEN 'pending_review' THEN 1 WHEN 'draft' THEN 2 ELSE 3 END, datetime(updated_at) DESC" > /tmp/raw.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/raw.json','utf8'));
          const posts=raw?.[0]?.results||[];
          const counts={};
          for(const p of posts)counts[p.status]=(counts[p.status]||0)+1;
          const wrong=posts.filter(p=>/priority10-v20260817|rebuild-v20260816|current-v20260815|generated-v202608/i.test(String(p.image_url||'')));
          const out={checked_at:new Date().toISOString(),count:posts.length,counts,wrong_old_image_count:wrong.length,posts};
          fs.writeFileSync('audits/production-post-state-v20260818.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({count:posts.length,counts,wrong_old_image_count:wrong.length}));
          NODE
      - name: Commit audit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audits/production-post-state-v20260818.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(posts): record current production post state'
          git pull --rebase origin main
          git push origin HEAD:main
