name: 仙加味龜鹿飲雙規格正式原圖情境精準修復
on:
  push:
    branches: [main]
    paths:
      - 'ops/request-apply-glass-pouch-original-photo-20261110.json'
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node --check ops/apply-glass-pouch-original-photo-20261110.mjs
      - run: node ops/apply-glass-pouch-original-photo-20261110.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xjw-real-photo-repair-${{ github.run_id }}
          path: glass-pouch-original-photo-repair-result.json
          retention-days: 8
