name: 仙加味貼文中心平台授權現行就緒檢查

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'src/social-publisher.js'
      - 'src/platform-connection-probe.js'
      - 'src/system-readiness.js'
      - 'src/full-system-entry.js'
      - 'wrangler.jsonc'
      - '.github/workflows/social-platform-readiness-current.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE_URL: https://xianjiawei-internal.tung314069.workers.dev
    steps:
      - uses: actions/checkout@v5
      - name: Verify publisher capability contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Facebook:{direct:'facebook'" src/social-publisher.js
          grep -q "Instagram:{direct:'instagram'" src/social-publisher.js
          grep -q "Threads:{url:'THREADS_PUBLISH_WEBHOOK_URL',token:'THREADS_PUBLISH_WEBHOOK_TOKEN',route:'metricool'}" src/social-publisher.js
          grep -q "threadsFormalRoute:'Metricool xianjiawei.tw'" src/social-publisher.js
          grep -q "'LINE OA':{direct:'line_oa'" src/social-publisher.js
          grep -q "'LINE VOOM':{manual:true" src/social-publisher.js
          grep -q "'Google 商家':{direct:'google_business'" src/social-publisher.js
          grep -q 'META_PAGE_ACCESS_TOKEN' src/social-publisher.js
          grep -q 'LINE_CHANNEL_ACCESS_TOKEN' src/social-publisher.js
          grep -q 'GOOGLE_OAUTH_REFRESH_TOKEN' src/social-publisher.js
          grep -q "platformConnectionProbePath:'/healthz/platform-connections'" src/full-system-entry.js
          test -f src/platform-connection-probe.js
          grep -q "externalScheduler:'Metricool'" src/platform-connection-probe.js
          grep -q "account:'xianjiawei.tw'" src/platform-connection-probe.js
          grep -q 'externalSchedulerReady:true' src/platform-connection-probe.js
          if grep -q 'graph.threads.net' src/platform-connection-probe.js; then
            echo 'Threads連線探測不得再依賴Graph API' >&2
            exit 1
          fi
          grep -q 'publishes_content:false' src/platform-connection-probe.js
          grep -q 'blocking_platforms' src/platform-connection-probe.js
          echo 'PASS current social publisher capabilities and safe connection probe present; Threads authority is Metricool xianjiawei.tw.'
      - name: Require Cloudflare audit credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Read Worker binding names without exposing secret values
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/xianjiawei-internal/settings" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/settings.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/settings.json','utf8'));
          if(x.success!==true) throw new Error('Cloudflare Worker settings API failed');
          const bindings=x.result?.bindings||[];
          const names=new Set(bindings.map(b=>b.name));
          const has=n=>names.has(n);
          const pair=(a,b)=>has(a)&&has(b);
          const readiness={
            Facebook:has('META_PAGE_ACCESS_TOKEN')||pair('FACEBOOK_PUBLISH_WEBHOOK_URL','FACEBOOK_PUBLISH_WEBHOOK_TOKEN'),
            Instagram:has('META_PAGE_ACCESS_TOKEN')||pair('INSTAGRAM_PUBLISH_WEBHOOK_URL','INSTAGRAM_PUBLISH_WEBHOOK_TOKEN'),
            Threads:'metricool_external:xianjiawei.tw',
            'LINE OA':has('LINE_CHANNEL_ACCESS_TOKEN')||pair('LINE_OA_PUBLISH_WEBHOOK_URL','LINE_OA_PUBLISH_WEBHOOK_TOKEN'),
            'LINE VOOM':'manual_required',
            'Google 商家':['GOOGLE_OAUTH_CLIENT_ID','GOOGLE_OAUTH_CLIENT_SECRET','GOOGLE_OAUTH_REFRESH_TOKEN','GOOGLE_BUSINESS_ACCOUNT_ID','GOOGLE_BUSINESS_LOCATION_ID'].every(has)||pair('GOOGLE_BUSINESS_PUBLISH_WEBHOOK_URL','GOOGLE_BUSINESS_PUBLISH_WEBHOOK_TOKEN')
          };
          console.log('PLATFORM_READINESS '+JSON.stringify(readiness));
          console.log('SAFE_BINDING_NAMES '+bindings.filter(b=>/META_|THREADS_|LINE_|GOOGLE_|PUBLISH_WEBHOOK/.test(b.name||'')).map(b=>`${b.name}:${b.type}`).sort().join(','));
          NODE
      - name: Verify live read-only authorization metadata during maintenance
        shell: bash
        run: |
          set -euo pipefail
          maintenance="$(node -e "const fs=require('fs');const s=fs.readFileSync('wrangler.jsonc','utf8');console.log(/\"TEMP_DISABLE_ACCESS\"\s*:\s*\"true\"/.test(s)?'true':'false')")"
          if [ "$maintenance" != 'true' ]; then
            echo 'Access已恢復，略過免登入平台metadata驗收。'
            exit 0
          fi
          curl -fsS --max-time 25 "$BASE_URL/api/platform-authorization" -o /tmp/live-platform.json
          node - <<'NODE'
          const x=require('/tmp/live-platform.json');
          if(!x.maintenance_readonly) throw new Error('整理模式平台metadata未標示唯讀');
          console.log('PASS live platform authorization metadata is read-only.');
          NODE
      - name: Wait for current connection probe deployment
        shell: bash
        run: |
          set -euo pipefail
          maintenance="$(node -e "const fs=require('fs');const s=fs.readFileSync('wrangler.jsonc','utf8');console.log(/\"TEMP_DISABLE_ACCESS\"\s*:\s*\"true\"/.test(s)?'true':'false')")"
          if [ "$maintenance" != 'true' ]; then
            echo 'Access已恢復；沒有設定自動化 Service Token 前，不繞過 Access 執行公開探測。'
            exit 0
          fi
          expected="$(node -e "const fs=require('fs');const s=fs.readFileSync('src/full-system-entry.js','utf8');console.log((s.match(/const VERSION='([^']+)'/)||[])[1]||'')")"
          test -n "$expected"
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 20 "$BASE_URL/healthz/platform-connections" -o /tmp/platform-connections.json; then
              live="$(node -e "const x=require('/tmp/platform-connections.json');console.log(x.fullSystemVersion||'')")"
              if [ "$live" = "$expected" ] && node -e "const x=require('/tmp/platform-connections.json');const t=x.platforms?.Threads||{};process.exit(t.externalScheduler==='Metricool'&&t.account==='xianjiawei.tw'&&t.operational===true?0:1)"; then
                echo "PASS live platform probe version=$live with Metricool Threads"
                exit 0
              fi
              echo "等待正式部署含Metricool Threads：live=$live expected=$expected attempt=$attempt/24"
            fi
            sleep 5
          done
          echo "正式平台探測端點未在時限內更新到Metricool Threads版本" >&2
          exit 1
      - name: Probe live provider credentials without publishing content
        shell: bash
        run: |
          set -euo pipefail
          maintenance="$(node -e "const fs=require('fs');const s=fs.readFileSync('wrangler.jsonc','utf8');console.log(/\"TEMP_DISABLE_ACCESS\"\s*:\s*\"true\"/.test(s)?'true':'false')")"
          if [ "$maintenance" != 'true' ]; then
            echo 'Access已恢復；略過無 Service Token 的公開探測。'
            exit 0
          fi
          curl -fsS --max-time 35 "$BASE_URL/healthz/platform-connections" -o /tmp/platform-connections.json
          node - <<'NODE'
          const x=require('/tmp/platform-connections.json');
          if(x.safe_read_only!==true) throw new Error('平台連線探測不是唯讀模式');
          if(x.publishes_content!==false) throw new Error('平台連線探測不得發布內容');
          const p=x.platforms||{};
          const names=['Facebook','Instagram','Threads','LINE OA','Google 商家'];
          for(const name of names){
            const item=p[name]||{};
            console.log(`${name}: mode=${item.mode||'unknown'} direct=${Boolean(item.directConfigured)} webhook=${Boolean(item.webhookConfigured)} external=${item.externalScheduler||''} account=${item.account||''} connected=${String(item.connected)} operational=${Boolean(item.operational)} degraded=${Boolean(item.degraded)} status=${item.status||'unknown'}`);
          }
          for(const name of ['Facebook','Instagram','LINE OA']){
            const item=p[name]||{};
            if(item.operational!==true)throw new Error(`${name} 沒有可用官方 API 或既有 Webhook 備援：${item.status||'unknown'}`);
          }
          const threads=p.Threads||{};
          if(threads.operational!==true||threads.externalScheduler!=='Metricool'||threads.account!=='xianjiawei.tw'||threads.directConfigured===true){
            throw new Error('Threads正式路徑不是Metricool xianjiawei.tw');
          }
          const blocking=Array.isArray(x.blocking_platforms)?x.blocking_platforms:[];
          if(blocking.length)throw new Error(`已設定平台沒有可用發布路徑：${blocking.join(', ')}`);
          const degraded=Array.isArray(x.degraded_platforms)?x.degraded_platforms:[];
          const unconfigured=Array.isArray(x.unconfigured_platforms)?x.unconfigured_platforms:[];
          if(degraded.length)console.log(`DEGRADED_WITH_FALLBACK ${degraded.join(', ')}`);
          if(unconfigured.length)console.log(`UNCONFIGURED ${unconfigured.join(', ')}`);
          if(p['LINE VOOM']?.manualRequired!==true)throw new Error('LINE VOOM 必須維持人工發布');
          console.log('PASS live provider credential probe completed without publishing content; Threads is Metricool xianjiawei.tw.');
          NODE