name: 仙加味已確認3D不合格圖安全退回待審核
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hold-reviewed-3d-posts-v20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: xjw-hold-exact-62-3d-reviewed-20261017
  cancel-in-progress: false
jobs:
  safe-return:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install authenticated database CLI
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Load frozen human-inspected 62-image evidence from prior successful run
        run: |
          mkdir -p /tmp/xjw-visual-audit
          gh run download 39044772071 --repo TS15825868/xianjiawei-internal --name xjw-actual-current-post-visual-sheets-20261017 --dir /tmp/xjw-visual-audit
          test -s /tmp/xjw-visual-audit/index.json
      - name: Back up exact live D1 records and verify no externally scheduled rows
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT p.id,p.status,p.image_url,p.title,p.headline,p.copy,p.image_alt,p.image_source,p.approved_by,p.approved_at,p.image_approved,p.image_quality_status,p.scheduled_at,p.published_at,p.review_note,p.rejection_reason,EXISTS(SELECT 1 FROM social_metricool_sync m WHERE m.post_id=p.id AND m.state IN ('scheduled','awaiting_work','awaiting_verification','cancel_required','unknown')) AS active_external_schedule FROM social_posts p WHERE p.status IN ('pending_review','approved','scheduled','published') ORDER BY p.id" > /tmp/xjw-current-posts-before.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_url,published_at FROM social_posts WHERE status='published' ORDER BY id" > /tmp/xjw-published-before.json
          python3 tools/hold-reviewed-3d-posts-v20261017.py prepare
      - name: Return ONLY unchanged nonpublished image records to pending review
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --file /tmp/xjw-hold-62.sql > /tmp/xjw-hold-result.json
      - name: Verify full 62-row results and published records untouched
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_url,approved_by,approved_at,image_approved,image_quality_status,scheduled_at,published_at FROM social_posts WHERE status IN ('pending_review','approved','scheduled','published') ORDER BY id" > /tmp/xjw-current-posts-after.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_url,published_at FROM social_posts WHERE status='published' ORDER BY id" > /tmp/xjw-published-after.json
          python3 tools/hold-reviewed-3d-posts-v20261017.py verify
          cmp /tmp/xjw-published-before.json /tmp/xjw-published-after.json
          echo 'Published post history and images unchanged.'
      - name: Preserve nonpublic D1 review before/after evidence for rollback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xjw-62-visually-rejected-post-status-safe-review-20261017
          path: |
            /tmp/xjw-current-posts-before.json
            /tmp/xjw-current-posts-after.json
            /tmp/xjw-published-before.json
            /tmp/xjw-published-after.json
            /tmp/xjw-hold-62.sql
            /tmp/xjw-hold-result.json
          if-no-files-found: warn
          retention-days: 7
