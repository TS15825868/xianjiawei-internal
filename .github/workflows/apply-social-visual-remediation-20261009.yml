name: 仙加味貼文圖不合格安全退回與下架產品封存
on:
  push:
    branches: [main]
    paths:
      - 'ops/social-visual-remediation-20261009.json'
      - 'tools/apply-social-visual-remediation-20261009.cjs'
      - '.github/workflows/apply-social-visual-remediation-20261009.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xjw-social-visual-remediation-20261009
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install Wrangler
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Create safe conditional updates from audit manifest
        run: node tools/apply-social-visual-remediation-20261009.cjs
      - name: Apply only to unchanged, non-published problem posts
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/social-visual-remediation-20261009.sql
      - name: Read back targeted status, preserving published posts
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('ops/social-visual-remediation-20261009.json','utf8'));
          const ids=[...j.items.map(v=>v.id),'XJW-CONV-brand-third-generation-note'];
          const q=s=>"'"+s.replaceAll("'","''")+"'";
          fs.writeFileSync('/tmp/check-social-visual.sql','SELECT id,status,image_url,image_quality_status,copy FROM social_posts WHERE id IN ('+ids.map(q).join(',')+');');
          NODE
          QUERY="$(cat /tmp/check-social-visual.sql)"
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "$QUERY" > /tmp/check-social-visual.json
          node - <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('ops/social-visual-remediation-20261009.json','utf8'));
          const raw=JSON.parse(fs.readFileSync('/tmp/check-social-visual.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          const missing=[];
          for(const entry of manifest.items){
            const r=rows.find(x=>x.id===entry.id);
            if(!r){missing.push(entry.id);continue}
            if(entry.action==='archive' && r.status!=='archived')missing.push(entry.id+': expected archived');
            if(entry.action==='regenerate' && !(r.status==='draft'&&!r.image_url))missing.push(entry.id+': expected empty-image draft');
          }
          if(missing.length)throw new Error('Verification errors: '+missing.join(', '));
          if(rows.some(r=>r.id==='XJW-CONV-brand-third-generation-note' && /龜鹿膠/.test(r.copy||'')))throw new Error('Old discontinued product returned into draft');
          console.log('PASS verified',manifest.items.length,'non-published posts; historical records preserved');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xjw-social-visual-remediation-evidence
          path: /tmp/check-social-visual.json
          if-no-files-found: ignore
          retention-days: 3
