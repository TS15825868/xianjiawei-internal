name: 仙加味 Meta 已發布輪播歷史唯讀結果
on:
  push:
    branches: [main]
    paths: ['ops/meta-history-readonly-check-request.json']
permissions:
  contents: read
concurrency:
  group: xjw-one-shot-meta-history-readonly
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Read only currently saved one-shot FB/IG historical audit, never publish
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name='social_meta_history_readonly'" > /tmp/meta-history-presence.json
          if node -e "const x=require('/tmp/meta-history-presence.json');process.exit((x[0]?.results||[]).length?0:1)"; then
            npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT run_id,status,result_json,created_at,completed_at FROM social_meta_history_readonly WHERE run_id='XJW-META-HISTORY-20261105-V1'" > /tmp/meta-history-readonly.json
          else
            echo '[{"results":[]}]' > /tmp/meta-history-readonly.json
          fi
          node - <<'NODE'
          const fs=require('node:fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/meta-history-readonly.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw.results)||[];
          const row=rows[0];
          const report=row?JSON.parse(row.result_json||'{}'):{summary:{status:'not_run_yet',completeThreePlatforms:false}};
          const summary=report.summary||{};
          const out={source:'Cloudflare D1 one-shot Meta published-media history read-only',
            checkedAt:new Date().toISOString(),runId:row?.run_id||'XJW-META-HISTORY-20261105-V1',
            status:row?.status||'not_run_yet',summary,
            facebook:report.facebook||[],instagram:report.instagram||[],
            requiresThreadsIndependentCheck:true,
            writesToSocialPosts:0,publicationActions:0,approvals:0};
          fs.writeFileSync('meta-history-readonly-evidence.json',JSON.stringify(out,null,2)+'\n');
          console.log('META_HISTORY_SUMMARY',JSON.stringify({status:out.status,
            facebook:summary.facebook,facebookCount:summary.facebookCount||0,
            instagram:summary.instagram,instagramCount:summary.instagramCount||0,
            threads:'unverified',carouselIncomplete:summary.carouselIncomplete,
            facebookHasMore:summary.facebookHasMore,instagramHasMore:summary.instagramHasMore}));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xjw-meta-history-readonly-${{ github.run_id }}
          path: meta-history-readonly-evidence.json
          retention-days: 2
          if-no-files-found: warn
