name: 仙加味歷史29篇AI委託審核｜保留唯讀驗證
# 2026-10-25: The old push job set status=approved without a human approver.
# Preserve legacy manifests and helper for historical audit; never auto-approve.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archived-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify legacy manifests and helper syntax only (no D1, no writes)
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/apply-final-reviewed-batches-20261013.cjs
          node - <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          for(const n of [1,2]){
            const p=JSON.parse(fs.readFileSync('ops/final-reviewed-batch-'+n+'-20261013.json','utf8'));
            assert.equal(p.actorType,'AI_ASSISTANT_NOT_HUMAN');
            assert.equal(p.actor,'chatgpt:owner-delegated-reviewed');
            assert.ok(Array.isArray(p.items));
          }
          const y=fs.readFileSync('.github/workflows/final-reviewed-batches-20261013.yml','utf8');
          assert.ok(y.includes('workflow_dispatch:'));
          assert.ok(!/^\s*(?:push:|CLOUDFLARE_API_TOKEN:|npx wrangler\b|node tools\/apply-final-reviewed-batches-20261013\.cjs (?:prepare|verify)\b)/m.test(y));
          console.log('PASS old AI review cannot promote pending_review to approved');
          NODE
