name: 仙加味最後29篇委託圖文審核｜逐項證據與正式D1驗證
on:
  push:
    branches: [main]
    paths: ['ops/final-reviewed-batch-1-20261013.json','ops/final-reviewed-batch-2-20261013.json']
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Execute two explicit visually reviewed batches without scheduling or publishing
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/apply-final-reviewed-batches-20261013.cjs
          for batch in 1 2; do
            npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts ORDER BY id" > /tmp/xjw-owner-auto-before.json
            node tools/apply-final-reviewed-batches-20261013.cjs prepare "$batch"
            npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/xjw-owner-auto-apply.sql
            npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts ORDER BY id" > /tmp/xjw-owner-auto-after.json
            npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_post_review_gates ORDER BY post_id" > /tmp/xjw-owner-auto-gates.json
            node tools/apply-final-reviewed-batches-20261013.cjs verify "$batch"
            cp /tmp/xjw-owner-auto-result.json "/tmp/final-review-result-$batch.json"
          done
      - name: Export only the two existing published brand images for visual inspection
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,mime_type,data_base64 FROM media_assets WHERE id IN ('IMG-OFFICIAL-13-BRAND-STORY','IMG-OFFICIAL-12-TRIAL')" > /tmp/published-brand-media.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-reviewed-evidence-${{ github.run_id }}
          path: |
            /tmp/final-review-result-*.json
            /tmp/xjw-owner-auto-before.json
            /tmp/xjw-owner-auto-after.json
            /tmp/xjw-owner-auto-gates.json
            /tmp/published-brand-media.json
          retention-days: 7
