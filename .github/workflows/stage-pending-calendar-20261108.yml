name: 仙加味待審稿候選時段精準補齊（絕不發布）
on:
  push:
    branches: [main]
    paths: ['ops/request-stage-pending-calendar-20261108.json']
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Verify live versions and write candidate dates only
        run: node ops/stage-pending-calendar-20261108.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pending-calendar-stage-${{ github.run_id }}
          path: stage-pending-calendar-result.json
          retention-days: 7
