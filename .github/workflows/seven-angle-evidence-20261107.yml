name: 仙加味七篇候選實質角度補證（保留正式去重阻擋）
on:
  push:
    branches: [main]
    paths: ['ops/seven-angle-evidence-20261107.json']
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Save seven current independent editorial judgments with full-history DEFER preserved
        run: node ops/apply-seven-angle-evidence-20261107.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seven-angle-receipts-${{ github.run_id }}
          path: seven-editorial-angle-receipts.json
          retention-days: 7
