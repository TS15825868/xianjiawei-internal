name: XJW one-time four obsolete visual notes correction
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-four-stale-review-holds.yml']
permissions:
  contents: read
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read exact latest D1 targets and all published posts
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts WHERE id IN ('XJW-CONV-chat-soup-day','XJW-CONV-cny-first-soup','XJW-CONV-season-more-soup','XJW-CONV-chat-deer-turtle-soup-choice') ORDER BY id" > /tmp/old.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts WHERE status='published' ORDER BY id" > /tmp/published-old.json
      - name: Validate only obsolete 2D-only reason and write guarded SQL
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert/strict'),crypto=require('crypto');
          const items=[["XJW-CONV-chat-soup-day","XJW-CONV-chat-soup-day-safety-v1.png"],["XJW-CONV-cny-first-soup","XJW-CONV-cny-first-soup-safety-v1.png"],["XJW-CONV-season-more-soup","XJW-CONV-season-more-soup-safety-v1.png"],["XJW-CONV-chat-deer-turtle-soup-choice","XJW-CONV-chat-deer-turtle-soup-choice-safety-v1.png"]];
          const oldReason='實際圖片覆核：小老闆與夥伴為非正式立體3D風格；涉及產品的貼文需核對正式實物原圖。請重新製作固定2D Q版並回待審核。';
          const rows=JSON.parse(fs.readFileSync('/tmp/old.json'))[0].results;
          assert.equal(rows.length,4);
          const q=x=>"'"+String(x??'').replaceAll("'","''")+"'";
          const sql=[];
          for(const [id,filename] of items){
            const row=rows.find(r=>r.id===id);assert(row,id);
            assert.equal(row.status,'pending_review');
            assert.equal(row.image_quality_status,'clear');
            assert.equal(Number(row.image_approved),0);
            assert.equal(row.rejection_reason,oldReason);
            assert(String(row.image_url).endsWith('/2026-10-31/cooking-safety/'+filename));
            assert(String(row.review_note).includes('external_history_media_incomplete'));
            assert(!row.approved_by&&!row.approved_at&&!row.published_at&&!row.scheduled_at);
            const hash=crypto.createHash('sha256').update(row.id+'|'+row.image_url).digest('hex').slice(0,16);
            const auditId='XJW-OLD-2D-REASON-'+hash;
            const evidence=JSON.stringify({removedOldRule:oldReason,preservedImageUrl:row.image_url,imageQualityUnchanged:'clear',reviewNoteUnchanged:true,aiApproval:false,humanApproval:false});
            sql.push('UPDATE social_posts SET rejection_reason='+q('')+' WHERE id='+q(id)+' AND status='+q('pending_review')+' AND image_quality_status='+q('clear')+' AND image_url='+q(row.image_url)+' AND updated_at='+q(row.updated_at)+' AND rejection_reason='+q(oldReason)+' AND approved_by IS NULL AND published_at IS NULL;');
            sql.push('INSERT INTO audit_logs(id,actor_email,action,entity_type,entity_id,before_json,after_json,ip) SELECT '+[auditId,'system:xjw-visual-note-correction','撤銷與現行角色政策不符的舊2D限定退件原因','貼文',id,JSON.stringify({rejection_reason:oldReason}),evidence,''].map(q).join(',')+' WHERE changes()=1;');
          }
          fs.writeFileSync('/tmp/change.sql',sql.join('\n')+'\n');
          console.log('PASS safe four-version guard; no AI or human approval changed');
          NODE
      - name: Apply evidence correction only; do not change copies, images or approvals
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/change.sql
      - name: D1 readback and preserve every published record
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts WHERE id IN ('XJW-CONV-chat-soup-day','XJW-CONV-cny-first-soup','XJW-CONV-season-more-soup','XJW-CONV-chat-deer-turtle-soup-choice') ORDER BY id" > /tmp/new.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts WHERE status='published' ORDER BY id" > /tmp/published-new.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT entity_id FROM audit_logs WHERE id LIKE 'XJW-OLD-2D-REASON-%'" > /tmp/audit.json
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert/strict');
          const rd=p=>JSON.parse(fs.readFileSync(p))[0].results;
          const b=rd('/tmp/old.json'),a=rd('/tmp/new.json'),logs=rd('/tmp/audit.json');
          assert.equal(a.length,4);
          for(const old of b){const cur=a.find(x=>x.id===old.id);assert(cur,old.id);assert.equal(cur.rejection_reason,'');for(const k of Object.keys(old))if(k!=='rejection_reason')assert.deepEqual(cur[k],old[k],old.id+':'+k);assert(logs.some(x=>x.entity_id===old.id));}
          assert.deepEqual(rd('/tmp/published-old.json'),rd('/tmp/published-new.json'));
          console.log('PASS exact four stale rejection reasons removed, old reviews untouched, all published content unchanged, still await AI review');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obsolete-four-image-review-notes-${{ github.run_id }}
          path: |
            /tmp/new.json
            /tmp/audit.json
          retention-days: 3
