name: 仙加味剩餘候選與既有草稿精準接續
on:
  push:
    branches: [main]
    paths: ['.github/workflows/xjw-current-draft-calendar-delta.yml']
permissions:
  contents: read
concurrency:
  group: xjw-current-draft-calendar-delta
  cancel-in-progress: false
jobs:
  delta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Match all current external drafts against actual D1 versions, no publishing
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createRequire} from 'node:module';
          import {createHash} from 'node:crypto';
          import {createD1Transport} from './tools/d1-http-transport.mjs';
          const {fingerprint}=createRequire(import.meta.url)('./tools/metricool-free-evidence.cjs');
          const remote=[{"id":395780595,"uuid":"-4666029736018688758","date":{"dateTime":"2027-01-01T09:00:00","timezone":"Asia/Taipei"},"text":"元旦早上，不一定要急著列出一整年的目標。把熱粥、饅頭和家人喜歡的小菜準備好，坐下來一起吃一餐，也是一個踏實的開始。\n\n仙加味想留下的漢方生活，不只在產品裡，也在這些照顧日常、好好相聚的小事裡。\n\n新年的第一餐，你最想和誰一起吃？","media":["https://static.metricool.com/planner/202610/6889683-file-2787967735441711605.jpeg"],"alt":["元旦清晨的居家早餐情境，仙加味小老闆將熱粥與饅頭放上餐桌，小鹿與小烏龜陪在旁邊，家人在桌邊等著一起吃早餐。"],"providers":["facebook","instagram","threads"],"draft":true,"autoPublish":false},{"id":395780663,"uuid":"-2388141536229897403","date":{"dateTime":"2027-02-03T09:00:00","timezone":"Asia/Taipei"},"text":"小時候期待過年，跟長大後期待的事情常常完全不一樣。有人記得的是年夜飯，有人記得長輩家，也有人現在最期待的是終於可以休息。\n\n仙加味從萬華走過幾代年節，也想把這些家庭生活記憶留下來。\n\n你覺得自己家過年最大的改變是什麼？","media":["https://static.metricool.com/planner/202610/6889683-file-332421681141374024.jpeg"],"alt":["年節回憶的情境插畫，仙加味小老闆與小鹿、小烏龜一起翻看家庭聚餐照片道具，聊聊小時候與現在的過年記憶。"],"providers":["facebook","instagram","threads"],"draft":true,"autoPublish":false},{"id":395780722,"uuid":"4739607617070649128","date":{"dateTime":"2027-02-05T09:00:00","timezone":"Asia/Taipei"},"text":"除夕準備年夜飯時，小老闆想先做一件小事：替剛回到家的家人拉好椅子，讓大家不用急，慢慢坐下來。\n\n仙加味從萬華走過幾代家庭日常，一直珍惜的，是有人一起吃飯、有人願意等你回家的時刻。\n\n今年的年夜飯，你最想把哪個位置留給誰？","media":["https://static.metricool.com/planner/202610/6889683-file-12915704977023112905.jpeg"],"alt":["除夕傍晚，仙加味小老闆替剛回家的家人拉開餐桌旁的椅子，小鹿與小烏龜在安全位置陪伴，屋內亮著溫暖燈光。"],"providers":["facebook","instagram","threads"],"draft":true,"autoPublish":false},{"id":395780855,"uuid":"7059549514727835567","date":{"dateTime":"2027-02-08T09:00:00","timezone":"Asia/Taipei"},"text":"春節出門走春，不一定要跑很多地方。選一段好走的路，陪家人看看街角的花、聊聊最近的小事，就很有年節的感覺。\n\n仙加味從萬華的日常出發，也想把這種不急著趕路的相伴留下來。補養，是一種節奏。\n\n你走春比較喜歡熱鬧拜訪，還是安靜散步？","media":["https://static.metricool.com/planner/202610/6889683-file-13031052408353198187.jpeg"],"alt":["春節走春的街道情境插畫，仙加味小老闆與家人在行人步道慢慢散步，小鹿與小烏龜分開同行，街角有花木與少量年節裝飾。"],"providers":["facebook","instagram","threads"],"draft":true,"autoPublish":false},{"id":409190019,"uuid":"9095248166936789919","date":{"dateTime":"2026-11-28T10:00:00","timezone":"Asia/Taipei"},"text":"認識仙加味鹿茸粉｜75g／罐\n\n挑選粉狀食材時，你會先看什麼？品名、重量、包裝標示，還是保存方式？\n\n這款鹿茸粉以每罐75g的形式呈現。認識原有包裝上的資訊，才能在使用與收納時更清楚；實際方式仍以產品正式標示為準。\n\n你平常買粉狀食材，最先注意包裝上的哪一項資訊？\n\n#仙加味 #鹿茸粉 #認識食材","media":["https://static.metricool.com/planner/202610/6889683-file-8496885381465870054.webp"],"alt":["仙加味鹿茸粉75g正式實物原圖，白色罐蓋，原廠雪地鹿群與鹿茸粉標籤，產品完整呈現。"],"providers":["facebook","instagram","threads"],"draft":true,"autoPublish":false},{"id":415295632,"uuid":"2100266406683036682","date":{"dateTime":"2026-11-25T10:00:00","timezone":"Asia/Taipei"},"text":"你看過這種小小的玻璃罐嗎？\n\n仙加味龜鹿飲30cc是小玻璃裸罐，罐身沒有額外貼紙。認識一款飲品，除了看名稱，也可以先看容量和包裝形式。\n\n龜鹿飲採接單後製作，約5～7個工作天出貨。日常飲用方式與保存請依正式產品說明。\n\n你比較習慣小份量的玻璃容器，還是隨身攜帶的鋁袋包裝？\n\n#仙加味 #龜鹿飲 #認識包裝","media":["https://static.metricool.com/planner/202610/6889683-file-8137000347001538751.webp"],"alt":["仙加味龜鹿飲30cc正式小玻璃裸罐原圖，金色罐蓋、深色內容物，罐身無貼紙，完整呈現小罐外觀。"],"providers":["facebook","instagram","threads"],"draft":true,"autoPublish":false},{"id":425177099,"uuid":"8803367464274840026","date":{"dateTime":"2027-02-06T09:00:00","timezone":"Asia/Taipei"},"text":"春節回到家，小老闆抱抱坐在客廳的長輩。家常菜已經擺上桌，小鹿和小烏龜在一旁陪伴。仙加味想留住這樣的家常年節畫面：進門先問聲好，等家人坐齊，再一起開飯。","media":["https://static.metricool.com/planner/202610/6889683-file-13050442033821600915.jpeg"],"alt":["春節團聚的情境插畫，仙加味小老闆抱抱坐在家中的長輩，小鹿與小烏龜分開陪伴，背景餐桌上有簡單家常菜。"],"providers":["facebook","instagram","threads"],"draft":true,"autoPublish":false},{"id":425177186,"uuid":"-4565812021150200465","date":{"dateTime":"2027-02-20T09:00:00","timezone":"Asia/Taipei"},"text":"元宵夜，仙加味小老闆和家人圍在廚房桌邊搓湯圓，小鹿和小烏龜分開陪伴，窗外有燈籠和月光。一家人把手邊的小麵糰慢慢搓圓，等備好再依家裡的做法下鍋。","media":["https://static.metricool.com/planner/202610/6889683-file-13576794906107738782.jpeg"],"alt":["元宵夜的家常廚房，仙加味小老闆和家人一起搓小顆白色湯圓，小鹿與小烏龜在旁陪伴，窗外可見素面燈籠與月光。"],"providers":["facebook","instagram","threads"],"draft":true,"autoPublish":false},{"id":425468095,"uuid":"-1546358116532992876","date":{"dateTime":"2026-11-16T10:00:00","timezone":"Asia/Taipei"},"text":"認識仙加味龜鹿膏｜100g／罐\n\n有些人喜歡直接取用膏狀食材，有些人比較習慣用溫熱的水慢慢調開。\n\n龜鹿膏可依產品說明取一小匙，加入約100～300ml熱水攪拌化開，再依個人口味調整濃淡。實際食用、保存方式仍以正式產品標示為準。\n\n你平常準備溫熱飲品，喜歡濃一些還是淡一些？\n\n#仙加味 #龜鹿膏 #日常飲品","media":["https://static.metricool.com/planner/202611/6889683-file-11338806686392267015.webp"],"alt":["仙加味龜鹿膏100g正式產品外盒正面原圖，米白外盒、深紅頂部與龜鹿膏字樣，產品外觀完整呈現。"],"providers":["facebook","instagram","threads"],"draft":true,"autoPublish":false}];
          const db=fs.readFileSync('wrangler.jsonc','utf8').match(/"database_id"\s*:\s*"([a-f0-9-]+)"/)?.[1];
          const execute=createD1Transport({token:process.env.CLOUDFLARE_API_TOKEN,accountId:process.env.CLOUDFLARE_ACCOUNT_ID,databaseId:db});
          const read=async sql=>(await execute(sql)).flatMap(x=>x.results||[]);
          const posts=await read("SELECT * FROM social_posts WHERE status IN ('pending_review','approved','scheduled','published')");
          const mappings=await read("SELECT post_id,metricool_id,uuid,state,publication_at,content_fingerprint FROM social_metricool_sync");
          const reviews=await read("SELECT q.post_id,q.id,q.decision,q.content_fingerprint,q.image_sha256,q.reviewed_at,q.evidence_json FROM social_post_quality_reviews q JOIN social_posts p ON p.id=q.post_id WHERE p.status='pending_review' AND q.id=(SELECT id FROM social_post_quality_reviews WHERE post_id=q.post_id ORDER BY reviewed_at DESC,created_at DESC,id DESC LIMIT 1)");
          const map=new Map(reviews.map(r=>[r.post_id,r]));
          const norm=s=>String(s||'').normalize('NFKC').replace(/[\s\p{P}\p{S}]+/gu,'');
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const hashImage=async u=>{try{const r=await fetch(u,{redirect:'error',signal:AbortSignal.timeout(10000)});if(!r.ok||!r.headers.get('content-type')?.startsWith('image/'))return null;const b=Buffer.from(await r.arrayBuffer());if(!b.length||b.length>12*1024*1024)return null;return sha(b)}catch{return null}};
          const results=await Promise.all(remote.map(async d=>{
            const existing=mappings.filter(m=>String(m.metricool_id)===String(d.id)||m.uuid===d.uuid);
            const exact=posts.filter(p=>p.copy===d.text);
            const matched=existing.length===1?posts.find(p=>p.id===existing[0].post_id):exact.length===1?exact[0]:null;
            const current=matched?map.get(matched.id):null;
            const remoteSha=await hashImage(d.media?.[0]);
            const sourceSha=matched?await hashImage(matched.image_url):null;
            return {id:d.id,uuid:d.uuid,date:d.date,existing,exact:exact.map(p=>({id:p.id,status:p.status})),matched:matched?{id:matched.id,title:matched.title,status:matched.status,copyMatches:matched.copy===d.text,fingerprint:fingerprint(matched),image_url:matched.image_url,proposed:matched.proposed_scheduled_at,reviewId:current?.id,reviewDecision:current?.decision,reviewCurrent:current?.content_fingerprint===fingerprint(matched),reviewSha:current?.image_sha256}:null,remoteSha,sourceSha,exactMedia:!!remoteSha&&remoteSha===sourceSha,disposition:!matched?'external_unmapped_preserve':matched.status!=='pending_review'?'nonpending_preserve':matched.copy!==d.text?'copy_mismatch_preserve':!remoteSha||!sourceSha?'media_unverified_preserve':remoteSha!==sourceSha?'media_bytes_differ_preserve':'matching_draft_preserve'};
          }));
          const pending=posts.filter(p=>p.status==='pending_review').map(p=>{const r=map.get(p.id);let checks={};try{checks=JSON.parse(r?.evidence_json||'{}').checks||{}}catch{}return{id:p.id,title:p.title,category:p.category,proposed:p.proposed_scheduled_at,image:p.image_url,updated:p.updated_at,fp:fingerprint(p),review:r?.decision,reviewCurrent:r?.content_fingerprint===fingerprint(p),nonPass:Object.entries(checks).filter(([k,v])=>v.result!=='PASS').map(([k,v])=>[k,v.result]),mapping:mappings.find(m=>m.post_id===p.id)||null}});
          console.log('XJW_CURRENT_DRAFT_DELTA '+JSON.stringify({drafts:results,counts:await read("SELECT status,COUNT(*) AS total FROM social_posts GROUP BY status"),pending,externalWrites:0,d1Writes:0}));
          NODE
