name: 仙加味有效貼文圖片佇列同步
# Refresh live D1 queue after current authority maintenance; never alter post approval.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["仙加味輕鬆互動題庫同步到貼文中心", "仙加味全庫不合格貼文圖片安全退回"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-active-post-image-queue.yml'
      - 'ops/social-post-image-scenes-20261010.json'

permissions:
  contents: write

concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Read active draft posts from formal D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,copy,category,image_alt,image_source,proposed_scheduled_at FROM social_posts WHERE status='draft' AND TRIM(COALESCE(image_url,''))='' ORDER BY id" > /tmp/active-drafts.json
      - name: Fetch website formal media authority
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --max-time 30 \
            'https://raw.githubusercontent.com/TS15825868/xianjiawei/main/public-product-master.json' \
            -o /tmp/website-formal-media-authority.json
          node -e "const x=require('/tmp/website-formal-media-authority.json');if(!Array.isArray(x.products)||x.products.length!==4||x.productCount!==4)process.exit(1)"

      - name: Build current production queue
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const raw=JSON.parse(fs.readFileSync('/tmp/active-drafts.json','utf8'));
          const formalMedia=JSON.parse(fs.readFileSync('/tmp/website-formal-media-authority.json','utf8'));
          const sceneBook=JSON.parse(fs.readFileSync('ops/social-post-image-scenes-20261010.json','utf8'));
          const sceneById=sceneBook.sceneByPostId||{};
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          const windowFor=(id='')=>{
            const s=String(id).toLowerCase();
            if(s.includes('cny-')) return 'lunar_new_year_window';
            if(s.includes('year-end-')) return 'year_end_window';
            if(s.includes('new-year-')) return 'new_year_window';
            if(s.includes('weather-')) return 'weather_dynamic';
            if(s.includes('season-')) return 'cool_season_dynamic';
            return 'evergreen';
          };
          const order={evergreen:0,weather_dynamic:1,cool_season_dynamic:2,year_end_window:3,new_year_window:4,lunar_new_year_window:5};
          const productKeys=['龜鹿膏','鹿茸粉'];
          const productListFor=text=>{
            const out=[];
            if(/龜鹿膠|龜鹿湯塊/.test(text)) throw new Error('仍有退場產品公開草稿，先修文案或封存，不可進製圖佇列');
            if(text.includes('30cc')) out.push('30cc');
            if(text.includes('180cc')) out.push('180cc');
            if(text.includes('龜鹿飲')&&!text.includes('30cc')&&!text.includes('180cc')) out.push('30cc','180cc');
            for(const x of productKeys) if(text.includes(x)) out.push(x);
            return [...new Set(out)];
          };
          rows.sort((a,b)=>(order[windowFor(a.id)]-order[windowFor(b.id)])||String(a.id).localeCompare(String(b.id)));
          const items=rows.map((r,index)=>{
            const text=[r.title,r.copy,r.image_alt].filter(Boolean).join(' ');
            return {
              postId:r.id,
              imageId:`XJW-ACTIVE-IMG-${String(index+1).padStart(3,'0')}`,
              kind:r.category||'生活內容',
              title:r.title||'',
              products:productListFor(text),
              scene:String(sceneById[r.id]||r.image_alt||''),
              sceneSource:sceneById[r.id]?'formal_unique_scene_20261010':'needs_unique_scene_review',
              generationPolicy:'AI only environment and fixed mascots. Formal product photo only via locked post-compositing. No AI products, labels or poster text.',
              imageSource:r.image_source||'',
              window:windowFor(r.id),
              proposedScheduledAt:r.proposed_scheduled_at||null,
              status:'needs_unique_image',
              characterLock:'正式Q版小朋友小男孩、同一位角色；短黑髮、大眼睛、圓潤幼童臉型、固定頭身比；不得成熟化、少年化、成人化或像不同人；小鹿與小烏龜分開且相對尺寸固定。',
              copyHash:crypto.createHash('sha256').update(r.copy||'').digest('hex').slice(0,16)
            };
          });
          const out={
            version:'2026-10-10-v13-four-current-products-image-missing-drafts',
            brand:'仙加味',
            source:'Cloudflare D1 live social_posts WHERE status=draft AND image_url is empty',
            total:items.length,
            status:'production-queue',
            supersedes:'2026-09-14-v2-product-map：舊68篇已在live D1封存，不得再製作或回流',
            rule:'只為live D1目前status=draft且尚無image_url的有效貼文製作唯一正式圖片；已有圖片的draft不重複進製圖佇列；人工視覺審核前不得approved/scheduled/published。',
            characterLock:'正式Q版小朋友小男孩、同一位角色；短黑髮、大眼睛、圓潤幼童臉型、固定頭身比；米白中式上衣、深橄欖綠圍裙、胸前紅色直式仙加味印章；不得成熟化、少年化、成人化或像不同人；小鹿與小烏龜分開且相對尺寸固定。',
            threadsQueue:'ops/metricool-threads-media-queue-current.json',
            formalAssets:(()=>{
              const byId=new Map((formalMedia.products||[]).map(p=>[p.id,p]));
              const approvedPaths={'guilu-drink-30':'images/product-main/guilu-drink-30.jpg','guilu-drink-180':'images/product-main/guilu-drink-180.jpg','guilu-gao':'images/product-main/guilu-gao.jpg','luerong-fen':'images/product-main/luerong-fen.jpg'};
              const clean=id=>{
                const item=byId.get(id);
                if(!item || item.mediaStatus!=='approved-formal-product-image')throw new Error('現行四項正式產品權威未核准 '+id);
                return approvedPaths[id];
              };
              const assets={
                '30cc':clean('guilu-drink-30'),
                '180cc':clean('guilu-drink-180'),
                '龜鹿膏':clean('guilu-gao'),
                '鹿茸粉':clean('luerong-fen')
              };
              for(const [name,value] of Object.entries(assets)) if(!value) throw new Error(`官網正式媒體權威缺少 ${name}`);
              return assets;
            })(),
            visualRules:[
              '固定已確認Q版小朋友小男孩角色，不自由重畫角色；年齡感、頭身比、臉型、眼睛、髮型、服裝與圍裙比例須與定稿同一人；不得成熟化、少年化、成人化；小鹿與小烏龜分開且相對尺寸固定',
              '生活、料理、品牌、產品、萬華、互動、季節自然穿插，不連發同系列',
              '對外僅四品：產品只用formalAssets正式實物主圖等比例合成，AI不得重畫；30cc小玻璃裸罐無貼紙；180cc正式鋁袋比例；已退場龜鹿膠與龜鹿湯塊禁止回流',
              '找不到正式產品原圖時寧可不放產品；公開只顯示仙加味',
              '圖文、季節、天氣、冷熱、動作一致；無亂碼、怪字、療效宣稱',
              '完成後回pending_review，未經使用者人工審核不得發布'
            ],
            windowPolicy:{
              evergreen:'優先依混合題材製作',
              weather_dynamic:'只在實際天氣符合時插播',
              cool_season_dynamic:'進入適合溫度窗口再啟用',
              year_end_window:'年底窗口再啟用',
              new_year_window:'新年窗口再啟用',
              lunar_new_year_window:'農曆年前後適合窗口再啟用'
            },
            items
          };
          // 0 筆代表目前沒有「draft 且缺圖片」的製圖工作，是合法狀態；不可用舊佇列假裝還有待製圖項目。
          fs.writeFileSync('ops/post-image-production-queue-current.json',JSON.stringify(out,null,2)+'\n');
          console.log(`BUILT active image queue: ${items.length}`);
          NODE
      - name: Validate no archived post leaked into queue
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('ops/post-image-production-queue-current.json','utf8'));
          const raw=JSON.parse(fs.readFileSync('/tmp/active-drafts.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          const ids=new Set(rows.map(x=>x.id));
          if(q.total!==rows.length) throw new Error(`queue total mismatch ${q.total}/${rows.length}`);
          for(const item of q.items) if(!ids.has(item.postId)) throw new Error(`non-active post leaked: ${item.postId}`);
          console.log(`PASS queue contains only ${q.total} live D1 drafts`);
          NODE
      - name: Commit queue when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ops/post-image-production-queue-current.json; then
            echo 'Queue already matches live D1.'
            exit 0
          fi
          cp ops/post-image-production-queue-current.json /tmp/rebuilt-post-image-production-queue.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/rebuilt-post-image-production-queue.json ops/post-image-production-queue-current.json
            if git diff --quiet -- ops/post-image-production-queue-current.json; then
              echo 'Queue already matches latest main.'
              exit 0
            fi
            git add ops/post-image-production-queue-current.json
            git commit -m 'sync: rebuild image queue from active D1 drafts'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another main update; retry $attempt/4"
            sleep 2
          done
          echo 'Unable to update queue after retries' >&2
          exit 1

