name: 套用最新10張正式圖到貼文中心

on:
  push:
    branches: [main]
    paths:
      - 'assets/data/apply-owner-approved-final10-live-v20260818.trigger'
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

concurrency:
  group: xjw-owner-approved-final10-live-v20260818
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require Cloudflare production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install Wrangler
        run: npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@latest

      - name: Fetch newest user-approved manifest and verify all ten public images
        shell: bash
        run: |
          set -euo pipefail
          base='https://ts15825868.github.io/xianjiawei/images/posts/owner-approved-v20260818'
          manifest="$base/manifest.json?v=20260818-owner-approved-final10-v1"
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 15 "$manifest" -o /tmp/final10.json; then
              if node -e "const m=require('/tmp/final10.json');process.exit(m.version==='2026-08-18-owner-approved-final10-v1'&&m.count===10&&m.posts?.length===10?0:1)"; then
                break
              fi
            fi
            if [ "$i" -eq 30 ]; then echo 'latest final10 manifest not live' >&2; exit 1; fi
            sleep 5
          done
          node - <<'NODE' >/tmp/final10-urls.txt
          const m=require('/tmp/final10.json');
          const urls=m.posts.map(x=>x.image_url);
          if(new Set(urls.map(x=>x.split('?')[0])).size!==10) throw new Error('duplicate latest image url');
          for(const u of urls) console.log(u);
          NODE
          while IFS= read -r u; do
            code=$(curl -fLsS --retry 5 --retry-delay 2 --max-time 25 -o /tmp/image.webp -w '%{http_code}' "$u")
            test "$code" = 200
            test "$(stat -c%s /tmp/image.webp)" -gt 30000
            python3 - <<'PY'
b=open('/tmp/image.webp','rb').read(16)
assert b[:4]==b'RIFF' and b[8:12]==b'WEBP', b
PY
          done </tmp/final10-urls.txt
          echo 'PASS latest public final10: 10/10 reachable WebP images'

      - name: Build exact D1 update SQL from approved mapping
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const m=require('/tmp/final10.json');
          const byId=new Map(m.posts.map(x=>[x.id,x]));
          const content={
            'XJW-GUILU-drink30-work-break':{
              category:'上班日常',title:'上班帶一罐，30cc 不用把行程打亂',
              copy:'早上出門，包包裡已經有手機、鑰匙和工作用品，日常安排不用再弄得太複雜。\n\n仙加味龜鹿飲30cc是小玻璃罐，體積小，白天工作告一段落時，就能找個空檔慢慢安排。\n\n龜鹿飲可以直接常溫飲用；如果平常比較喜歡溫熱的方式，也可以依自己的生活情境安排。\n\n先把今天的工作排好，再把一罐帶上，順手就更自然。\n\n仙加味｜補養，是一種節奏。'},
            'XJW-GUILU-drink180-home':{
              category:'居家溫飲',title:'今天在家，180cc 可以慢慢安排',
              copy:'今天在家，不趕時間，就照自己的生活節奏慢慢安排。\n\n仙加味龜鹿飲180cc為鋁袋包裝，可以直接常溫飲用；比較喜歡溫熱口感時，也可以依情境隔水溫熱後再喝。\n\n不是一定要加熱，而是依自己的習慣選擇舒服的方式。\n\n在家不趕時間，就照自己的節奏安排一杯剛剛好的日常。\n\n仙加味｜補養，是一種節奏。'},
            'XJW-GUILU-gao-storage':{
              category:'保存提醒',title:'龜鹿膏開罐後，記得冷藏',
              copy:'仙加味龜鹿膏為100g／罐。未開封時放在常溫陰涼處；開罐後記得冷藏。\n\n每次使用後把蓋子蓋好，再固定放回冰箱的位置，下次要找也更順手。\n\n保存方式先弄清楚，日常使用就能更簡單。\n\n仙加味｜補養，是一種節奏。'},
            'XJW-GUILU-tangkuai-soup':{
              category:'料理搭配',title:'今晚燉湯，把龜鹿湯塊安排進家常餐桌',
              copy:'晚上準備家常菜，如果本來就有燉湯的習慣，也可以認識龜鹿湯塊這種料理型態。\n\n仙加味龜鹿湯塊為75g／盒、8塊裝。備料、下鍋、上桌，把日常放進熟悉的家常餐桌裡。\n\n不需要另外安排一套複雜流程，依平常料理方式搭配就好。\n\n仙加味｜補養，是一種節奏。'},
            'XJW-GUILU-jiao-600g':{
              category:'型態認識',title:'週末有時間，再慢慢認識龜鹿膠這種型態',
              copy:'平日忙著工作，很多事情都希望簡單快速；到了週末，反而比較有時間把不同產品型態看清楚。\n\n仙加味龜鹿膠為600g／盒（1斤）、32塊裝，每塊約18.75g。\n\n第一次接觸不用急著一次看懂，先從熟悉產品開始，再依自己的生活步調慢慢安排。\n\n仙加味｜補養，是一種節奏。'},
            'XJW-GUILU-luerong-75g':{
              category:'粉末安排',title:'午後認識鹿茸粉，把節奏留給自己',
              copy:'午後工作告一段落，想把日常安排得簡單一點，可以先從認識鹿茸粉這種粉末型態開始。\n\n仙加味鹿茸粉為75g／罐，可依自己的使用習慣搭配溫開水或熱飲。\n\n留一點時間給自己，把日常安排得剛剛好。\n\n仙加味｜補養，是一種節奏。'},
            'XJW-SOCIAL-20260815-02-line-consult-and-trial':{
              category:'LINE 諮詢',title:'不知道怎麼選，先把你的日常告訴我們',
              copy:'第一次接觸仙加味龜鹿系列，不知道怎麼選，可以先把自己的日常告訴我們。\n\n平常比較常在家還是外出？早上比較方便，還是下午？希望直接飲用、依情境溫熱，或搭配家常料理？\n\n先把生活說清楚，再慢慢認識30cc、180cc、龜鹿膏、龜鹿湯塊、龜鹿膠等不同產品型態。\n\n有問題可以直接透過LINE諮詢。\n\n仙加味｜補養，是一種節奏。'},
            'XJW-GUILU-choose-by-place':{
              category:'生活節奏',title:'今天在家，明天外出，產品型態不一定要選同一種',
              copy:'今天在家，明天可能外出，日常行程不同，產品型態也不一定要每次都選同一種。\n\n在家可以慢慢安排；外出時則可以優先考慮方便攜帶的型態。\n\n先看今天的行程，再選適合自己的方式，讓仙加味自然融入原本的生活節奏。\n\n仙加味｜補養，是一種節奏。'},
            'XJW-SOCIAL-20260815-03-storage-basics':{
              category:'整理一下',title:'星期天整理櫃子，也順便看看龜鹿還剩多少',
              copy:'星期天整理櫃子時，也可以順手看看家裡的仙加味龜鹿系列還剩多少。\n\n把30cc小玻璃罐、180cc鋁袋、龜鹿膏等產品分開放好，固定位置；開封與未開封也分開整理。\n\n像龜鹿膏未開封可放常溫陰涼處，開罐後則記得冷藏。\n\n整理一下，不只是收納，也是讓下一次要用的時候更順手。\n\n仙加味｜補養，是一種節奏。'},
            'XJW-SOCIAL-20260815-01-warm-drink-moment':{
              category:'辦公桌安排',title:'辦公桌上的一杯溫熱飲，也可以有不同選擇',
              copy:'坐在辦公桌前，一杯日常安排也可以有不同選擇。\n\n仙加味龜鹿飲30cc小玻璃罐可以直接安排；180cc鋁袋可以常溫飲用，也可以依自己的喜好與情境溫熱。\n\n產品型態不同，重點是找到自己方便的方式。\n\n讓工作中的一小段時間，也保留自己的生活節奏。\n\n仙加味｜補養，是一種節奏。'}
          };
          const q=v=>`'${String(v??'').replaceAll("'","''")}'`;
          const ids=Object.keys(content);
          let sql=['BEGIN;'];
          for(const id of ids){
            const p=byId.get(id); if(!p) throw new Error('manifest missing '+id);
            const c=content[id];
            sql.push(`UPDATE social_posts SET category=${q(c.category)}, title=${q(c.title)}, headline=${q(c.title)}, copy=${q(c.copy)}, image_url=${q(p.image_url)}, image_alt=${q(p.image_alt)}, image_source=${q(p.image_source)}, image_quality_status='ok', image_approved=0, platforms_json='[]', status='pending_review', scheduled_at=NULL, proposed_scheduled_at=NULL, approved_by=NULL, approved_at=NULL, published_at=NULL, updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now') WHERE id=${q(id)} AND status<>'archived';`);
          }
          const keep=ids.map(q).join(',');
          sql.push(`UPDATE social_posts SET image_url='', image_alt='', image_source='舊錯圖已依使用者2026-08-18指示移除', image_quality_status='missing', image_approved=0, updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now') WHERE id NOT IN (${keep}) AND status<>'archived' AND (image_url LIKE '%/images/posts/%' OR image_url LIKE '%/images/publishing/generated-v20260815/%' OR image_url LIKE '%/asset-staging/priority10-svg-v20260817/%') AND image_url NOT LIKE '%/owner-approved-v20260818/%';`);
          sql.push('COMMIT;');
          fs.writeFileSync('/tmp/apply-final10.sql',sql.join('\n')+'\n');
          NODE

      - name: Apply exact final10 to remote production D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/apply-final10.sql

      - name: Verify production D1 live state
        shell: bash
        run: |
          set -euo pipefail
          IDS="'XJW-GUILU-drink30-work-break','XJW-GUILU-drink180-home','XJW-GUILU-gao-storage','XJW-GUILU-tangkuai-soup','XJW-GUILU-jiao-600g','XJW-GUILU-luerong-75g','XJW-SOCIAL-20260815-02-line-consult-and-trial','XJW-GUILU-choose-by-place','XJW-SOCIAL-20260815-03-storage-basics','XJW-SOCIAL-20260815-01-warm-drink-moment'"
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,category,status,image_url,image_alt,image_source,image_quality_status,image_approved,scheduled_at,proposed_scheduled_at,platforms_json FROM social_posts WHERE id IN ($IDS) ORDER BY id" > /tmp/live.json
          node - <<'NODE'
          const rows=require('/tmp/live.json')[0]?.results||[];
          if(rows.length!==10) throw new Error('production final10 count='+rows.length);
          const urls=new Set();
          for(const r of rows){
            if(r.status!=='pending_review') throw new Error(r.id+' status='+r.status);
            if(!String(r.image_url||'').includes('/owner-approved-v20260818/')) throw new Error(r.id+' wrong image '+r.image_url);
            if(r.image_quality_status!=='ok') throw new Error(r.id+' image quality');
            if(Number(r.image_approved||0)!==0) throw new Error(r.id+' image approval must reset');
            if(r.scheduled_at||r.proposed_scheduled_at) throw new Error(r.id+' schedule must clear');
            if((r.platforms_json||'[]')!=='[]') throw new Error(r.id+' platforms must clear');
            urls.add(String(r.image_url).split('?')[0]);
          }
          if(urls.size!==10) throw new Error('production final10 image urls are not unique');
          console.log('PASS production D1 final10: 10 pending_review + 10 unique newest images + 0 schedules');
          NODE
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS n FROM social_posts WHERE status<>'archived' AND image_url<>'' AND (image_url LIKE '%/images/posts/%' OR image_url LIKE '%/images/publishing/generated-v20260815/%') AND image_url NOT LIKE '%/owner-approved-v20260818/%';" > /tmp/stale.json
          node - <<'NODE'
          const n=Number(require('/tmp/stale.json')[0]?.results?.[0]?.n||0);
          if(n!==0) throw new Error('still has '+n+' live stale post-image references');
          console.log('PASS production D1: 0 live stale post-image references');
          NODE

      - name: Record final10 production authority and cleanup result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/data
          cp /tmp/final10.json assets/data/owner-approved-final10-live-v20260818.json
          cat > assets/data/owner-approved-final10-live-v20260818.ok <<EOF
          PASS 2026-08-18
          source=https://ts15825868.github.io/xianjiawei/images/posts/owner-approved-v20260818/manifest.json
          images=10/10 newest user-approved WebP reachable
          d1=10/10 mapped one-to-one
          status=pending_review
          image_approved=0
          schedules=cleared
          stale_live_image_refs=0
          fallback_old_images=forbidden
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/owner-approved-final10-live-v20260818.json assets/data/owner-approved-final10-live-v20260818.ok
          git commit -m 'fix(posts): apply owner-approved final10 to live posting center' || true
          git pull --rebase origin main
          git push origin HEAD:main
