name: Isolated B2B cross-system contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'edge/business-inquir*.mjs'
      - 'integrations/b2b-crm/**'
      - 'src/full-system-entry.js'
      - 'package.json'
      - 'wrangler.jsonc'
      - 'business-inquiries.html'
      - 'assets/js/business-inquiry-management.js'
      - '.github/workflows/b2b-contract.yml'
  push:
    branches: [main, ops/b2b-inquiry-persistence]
    paths:
      - 'edge/business-inquir*.mjs'
      - 'integrations/b2b-crm/**'
      - 'src/full-system-entry.js'
      - 'package.json'
      - 'wrangler.jsonc'
      - 'business-inquiries.html'
      - 'assets/js/business-inquiry-management.js'
      - '.github/workflows/b2b-contract.yml'
permissions:
  contents: read
concurrency:
  group: xjw-b2b-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          path: erp
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: TS15825868/TS-LINE
          # Use the CURRENT official LINE OA main instead of a stale snapshot.
          ref: main
          path: line
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Record actual formal ERP and LINE contract versions
        shell: bash
        run: |
          set -euo pipefail
          echo '### B2B isolated contract source authority' >> "$GITHUB_STEP_SUMMARY"
          printf 'ERP checked-out SHA: `%s`\n' "$(git -C erp rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          printf 'LINE current main SHA: `%s`\n' "$(git -C line rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          # Source-only: no production D1, CRM receivers, customer sends or deployments.
      - name: ERP isolated B2B regressions
        working-directory: erp
        run: node --test edge/business-inquiries.test.mjs edge/business-inquiry-notification-management.test.mjs edge/business-inquiry-crm.test.mjs
      - name: LINE signed intake and Access contracts against actual ERP handler
        working-directory: line
        run: node --test business-inquiry-intake.test.js business-inquiry-access.test.js
      - name: CRM order contract against checked-in Apps Script (offline only)
        working-directory: line
        run: node crm-order-contract.test.js
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install existing dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate full static ERP and existing publishing guards
        run: |
          npm run build:static
          npm run guard:full
          node --check assets/js/business-inquiry-management.js
          test -f dist/business-inquiries.html
          test -f dist/assets/js/business-inquiry-management.js
      - name: Verify approved B2B release flags and bundle without deploying
        run: |
          node -e 'const fs=require("node:fs");const s=fs.readFileSync("wrangler.jsonc","utf8");for(const [name,expected] of Object.entries({XJW_B2B_INTAKE_ENABLED:"true",XJW_B2B_NOTIFICATION_RETRY_ENABLED:"false",XJW_B2B_CRM_ENABLED:"false"})){const values=[...s.matchAll(new RegExp("^\\s*"+JSON.stringify(name)+"\\s*:\\s*\"(true|false)\"\\s*,?\\s*$","gm"))];if(values.length!==1||values[0][1]!==expected)throw Error(name+" must have exactly one explicit release value: "+expected);}'
          npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/xjw-b2b-bundle"
