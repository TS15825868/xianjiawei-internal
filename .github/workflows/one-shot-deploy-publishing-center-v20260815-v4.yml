name: One-shot deploy 貼文中心 App v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-deploy-publishing-center-v20260815-v4.yml'

permissions:
  contents: read

concurrency:
  group: xianjiawei-publishing-center-v4
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate current posting center
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run check
          npm run guard:full
          npm run build:static
          grep -q 'publishing-center-app-20260815-v3' dist/publishing.html
          grep -q '20260815-app-v3' dist/publishing.html
          grep -q '20260815-publishing-readiness-ui-v7-nonblocking-boot' dist/assets/js/publishing-readiness-ui.js
      - name: Verify Remote D1 remains healthy
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT 1 AS ok"
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT status, COUNT(*) AS count FROM social_posts GROUP BY status ORDER BY status"
      - name: Deploy current posting center Worker
        run: npx wrangler deploy --keep-vars
      - name: Verify private production boundary
        shell: bash
        run: |
          set -euo pipefail
          base='https://xianjiawei-internal.tung314069.workers.dev'
          for path in '/healthz/core' '/publishing.html' '/'; do
            body="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$body" -w '%{http_code}' "$base$path" || true)"
            test "$code" != '000'
            test "$code" -lt 500
            grep -Eiq '貼文中心系統 App|<html|<!doctype|cloudflare|access|sign in|login|publishing' "$body"
          done
