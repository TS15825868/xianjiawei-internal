name: 仙加味77篇新版文案與圖片同步貼文中心

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-full-rebuild-v20260816.yml'
      - 'audits/full-rebuild-manifest-current.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install D1 tooling
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify all 77 generated visuals are live on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-delay 4 'https://ts15825868.github.io/xianjiawei/images/posts/rebuild-v20260816/manifest.json' -o /tmp/site-manifest.json
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('/tmp/site-manifest.json','utf8'));
          if(Number(m.count)!==77)throw new Error(`website visual count ${m.count}`);
          console.log('PASS website has 77 rebuilt visuals');
          NODE
          for id in POST-WORK-PAUSE XJW-GUILU-drink30-small-jar XJW-SOCIAL-20260815-03-craft-time-and-heat; do
            curl -fsSL --retry 5 --retry-delay 3 "https://ts15825868.github.io/xianjiawei/images/posts/rebuild-v20260816/${id}.webp" -o "/tmp/${id}.webp"
            test -s "/tmp/${id}.webp"
          done
      - name: Build exact D1 update SQL from rebuild manifest
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('audits/full-rebuild-manifest-current.json','utf8'));
          if(m.posts?.length!==77)throw new Error(`manifest count ${m.posts?.length}`);
          const q=v=>`'${String(v??'').replaceAll("'","''")}'`;
          const sql=['BEGIN TRANSACTION;'];
          for(const p of m.posts){
            const status=`CASE WHEN status='published' THEN 'published' ELSE 'pending_review' END`;
            sql.push(`UPDATE social_posts SET title=${q(p.title)}, headline=${q(p.headline)}, copy=${q(p.copy)}, category=${q(p.category)}, image_url=${q(p.image_url)}, image_alt=${q(p.image_alt)}, image_source=${q(p.image_source)}, status=${status}, image_approved=CASE WHEN status='published' THEN image_approved ELSE 0 END, review_note=CASE WHEN status='published' THEN COALESCE(review_note,'') ELSE '2026-08-16 全庫重製：使用者核准2D Q版小老闆；產品採正式實物原圖等比例縮放；圖文一對一，回待審核。' END, rejection_reason=NULL, approved_by=CASE WHEN status='published' THEN approved_by ELSE NULL END, approved_at=CASE WHEN status='published' THEN approved_at ELSE NULL END, scheduled_at=CASE WHEN status='published' THEN scheduled_at ELSE NULL END, updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now') WHERE id=${q(p.id)};`);
          }
          sql.push('COMMIT;');
          fs.writeFileSync('/tmp/apply-rebuild.sql',sql.join('\n')+'\n');
          console.log(`PASS built ${m.posts.length} update statements`);
          NODE
      - name: Apply rebuild to production D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/apply-rebuild.sql
      - name: Verify production D1 after rebuild
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT status,COUNT(*) AS n FROM social_posts WHERE status<>'archived' GROUP BY status ORDER BY status; SELECT COUNT(*) AS total FROM social_posts WHERE status<>'archived'; SELECT COUNT(*) AS rebuilt FROM social_posts WHERE status<>'archived' AND image_url LIKE 'https://ts15825868.github.io/xianjiawei/images/posts/rebuild-v20260816/%'; SELECT COUNT(*) AS id_matched FROM social_posts WHERE status<>'archived' AND instr(image_url,id)>0; SELECT COUNT(*) AS missing_image FROM social_posts WHERE status<>'archived' AND trim(COALESCE(image_url,''))=''; SELECT COUNT(*) AS blocked_name FROM social_posts WHERE status<>'archived' AND instr(title||headline||copy||image_alt,'台興山產')>0; SELECT COUNT(*) AS old_collage FROM social_posts WHERE status<>'archived' AND (instr(image_url,'smallboss-v20260815')>0 OR instr(image_url,'approved-v405')>0 OR instr(image_url,'generated-v20260815')>0); SELECT COUNT(*) AS duplicate_copy_posts FROM social_posts p WHERE status<>'archived' AND EXISTS (SELECT 1 FROM social_posts q WHERE q.status<>'archived' AND q.id<>p.id AND trim(q.copy)=trim(p.copy)); SELECT COUNT(*) AS duplicate_image_posts FROM social_posts p WHERE status<>'archived' AND EXISTS (SELECT 1 FROM social_posts q WHERE q.status<>'archived' AND q.id<>p.id AND trim(q.image_url)=trim(p.image_url));" > /tmp/verify.json
          cat /tmp/verify.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/verify.json','utf8'));
          const sets=raw.flatMap(x=>Array.isArray(x?.results)?[x.results]:[]);
          const flat=sets.flat();
          const get=k=>Number(flat.find(r=>Object.prototype.hasOwnProperty.call(r,k))?.[k]??-1);
          for(const [k,want] of Object.entries({total:77,rebuilt:77,id_matched:77,missing_image:0,blocked_name:0,old_collage:0,duplicate_copy_posts:0,duplicate_image_posts:0})){
            const got=get(k); if(got!==want)throw new Error(`${k}: ${got} != ${want}`);
          }
          console.log('PASS D1: 77/77 rebuilt, unique copy, unique image, exact id-image match, blocked name 0, old visuals 0');
          NODE
