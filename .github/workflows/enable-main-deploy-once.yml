name: Enable Main Publishing Deploy

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enable-main-deploy-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add main push trigger to publishing deploy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/deploy-cloudflare-publishing.yml')
          s = p.read_text(encoding='utf-8')
          if 'push:' not in s.split('jobs:',1)[0]:
            needle = 'on:\n  workflow_dispatch:'
            repl = "on:\n  workflow_dispatch:\n  push:\n    branches: [main]\n    paths-ignore:\n      - 'deployment-status.json'"
            if needle not in s:
              raise SystemExit('expected workflow_dispatch trigger not found')
            s = s.replace(needle, repl, 1)
            p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/enable-main-deploy-once.yml
      - name: Commit trigger update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'deploy: enable publishing deploy on main updates'
          git push
