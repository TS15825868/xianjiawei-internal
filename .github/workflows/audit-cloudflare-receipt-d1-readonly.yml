name: 仙加味 Cloudflare 備援 D1 唯讀巡檢
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-cloudflare-receipt-d1-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read remote D1 schema and count only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 d1 execute xianjiawei-internal-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name='xjw_webhook_receipts'"
          npx --yes wrangler@4 d1 execute xianjiawei-internal-db --remote --command "SELECT COUNT(*) AS receipt_count FROM xjw_webhook_receipts"
          echo 'Read-only receipt audit complete; no payload or customer data printed.'
