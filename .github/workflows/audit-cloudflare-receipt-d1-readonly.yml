name: 仙加味 Cloudflare 備援 D1 唯讀巡檢
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-cloudflare-receipt-d1-readonly.yml'
  workflow_dispatch:
    inputs:
      allow_production_d1_scan:
        description: '確認 Cloudflare 帳戶 D1 Rows Read 有足夠剩餘額度後才查詢正式回執'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Note remote D1 audit skipped to protect free quota
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.allow_production_d1_scan != true }}
        run: echo 'Formal D1 receipt audit SKIPPED; no production receipt state has been verified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Read remote D1 schema and count only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_production_d1_scan == true }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 d1 execute xianjiawei-internal-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name='xjw_webhook_receipts'"
          npx --yes wrangler@4 d1 execute xianjiawei-internal-db --remote --command "SELECT COUNT(*) AS receipt_count FROM xjw_webhook_receipts"
          echo 'Read-only receipt audit complete; no payload or customer data printed.'
