name: 仙加味封存貼文圖片製作清單守門

on:
  push:
    branches: [main]
    paths:
      - 'ops/post-image-production-queue-current.json'
      - '.github/workflows/post-image-queue-integrity.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Export archived posts
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,copy,status,image_url FROM social_posts WHERE status='archived' ORDER BY id" > archived-posts.json
      - name: Verify one-to-one image production queue and scene-product mapping
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const q=JSON.parse(fs.readFileSync('ops/post-image-production-queue-current.json','utf8'));
          const d=JSON.parse(fs.readFileSync('archived-posts.json','utf8'));
          const posts=(Array.isArray(d)?d[0]?.results:d?.results)||[];
          const items=Array.isArray(q.items)?q.items:[];
          const errors=[];
          const allowedProducts=new Set(['30cc','180cc','龜鹿膏','龜鹿湯塊','龜鹿膠','鹿茸粉']);
          const requiredAssets=['30cc','180cc','龜鹿膏','龜鹿湯塊','龜鹿膠','鹿茸粉'];
          if(q.brand!=='仙加味')errors.push('圖片清單品牌不是仙加味');
          if(q.status!=='production-queue')errors.push(`queue status異常 ${q.status}`);
          if(Number(q.total)!==items.length)errors.push(`queue total ${q.total} != items ${items.length}`);
          if(items.length!==posts.length)errors.push(`圖片清單 ${items.length} != 封存稿 ${posts.length}`);
          for(const key of requiredAssets)if(!String(q.formalAssets?.[key]||'').trim())errors.push(`缺正式產品素材 ${key}`);
          const byPost=new Map(), imageIds=new Set();
          for(const x of items){
            if(!x.postId||!x.imageId||!x.title||!x.copyHash)errors.push('圖片清單存在缺欄位項目');
            if(byPost.has(x.postId))errors.push(`postId重複 ${x.postId}`); else byPost.set(x.postId,x);
            if(imageIds.has(x.imageId))errors.push(`imageId重複 ${x.imageId}`); else imageIds.add(x.imageId);
            if(!Array.isArray(x.products))errors.push(`${x.postId}: products不是陣列`);
            const products=Array.isArray(x.products)?x.products:[];
            if(new Set(products).size!==products.length)errors.push(`${x.postId}: products重複`);
            for(const product of products)if(!allowedProducts.has(product))errors.push(`${x.postId}: 未知產品 ${product}`);

            const t=String(x.title||'');
            if(/180cc/i.test(t)&&!/30cc/i.test(t)&&products.includes('30cc'))errors.push(`${x.postId}: 單一180cc情境混入30cc`);
            if(/30cc/i.test(t)&&!/180cc/i.test(t)&&products.includes('180cc'))errors.push(`${x.postId}: 單一30cc情境混入180cc`);
            if(/龜鹿膠/.test(t)&&!/(龜鹿湯塊|湯塊)/.test(t)&&products.includes('龜鹿湯塊'))errors.push(`${x.postId}: 單一龜鹿膠情境混入龜鹿湯塊`);
            if(/龜鹿湯塊|湯塊/.test(t)&&!/龜鹿膠/.test(t)&&products.includes('龜鹿膠'))errors.push(`${x.postId}: 單一龜鹿湯塊情境混入龜鹿膠`);
            if(/試喝/.test(t)){
              if(!products.includes('30cc'))errors.push(`${x.postId}: 試喝情境缺正式30cc小玻璃裸罐`);
              if(products.includes('180cc'))errors.push(`${x.postId}: 試喝情境不得混入180cc`);
            }
            if(/龜鹿飲/.test(t)&&!/(30cc|180cc)/i.test(t)){
              if(!products.some(p=>p==='30cc'||p==='180cc'))errors.push(`${x.postId}: 龜鹿飲情境未指定任何正式飲品型態`);
              const extras=products.filter(p=>p!=='30cc'&&p!=='180cc');
              if(extras.length)errors.push(`${x.postId}: 龜鹿飲情境混入非飲品 ${extras.join(',')}`);
            }
          }
          for(const p of posts){
            const x=byPost.get(p.id);
            if(!x){errors.push(`${p.id}: 沒有唯一圖片製作項目`);continue}
            if(x.title!==p.title)errors.push(`${p.id}: 圖片清單標題與D1不一致`);
            const hash=crypto.createHash('sha256').update(String(p.copy||'')).digest('hex').slice(0,16);
            if(x.copyHash!==hash)errors.push(`${p.id}: 文案已變更，圖片規劃尚未同步`);
            if(String(p.image_url||'').trim())errors.push(`${p.id}: 尚未完成正式圖卻在archived掛了圖片`);
          }
          for(const x of items)if(!posts.some(p=>p.id===x.postId))errors.push(`${x.postId}: 清單項目已不在封存稿，需完成後移出queue`);
          if(errors.length){console.error(errors.join('\n'));process.exit(1)}
          console.log(`PASS ${posts.length}篇封存稿均有唯一imageId、文案雜湊、正式素材與情境產品對應`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: post-image-queue-integrity-${{ github.run_id }}
          path: archived-posts.json
          retention-days: 3
