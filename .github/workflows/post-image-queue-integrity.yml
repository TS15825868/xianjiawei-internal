name: 仙加味有效貼文圖片製作清單守門
# validation-trigger-20261001-v4-image-missing-drafts-only

on:
  workflow_run:
    workflows: ["仙加味有效貼文圖片佇列同步"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'ops/post-image-production-queue-current.json'
      - '.github/workflows/post-image-queue-integrity.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Export live draft posts
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,copy,status,image_url FROM social_posts WHERE status='draft' AND TRIM(COALESCE(image_url,''))='' ORDER BY id" > active-drafts.json

      - name: Fetch website formal media authority
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --max-time 30 \
            'https://raw.githubusercontent.com/TS15825868/xianjiawei/main/public-product-master.json' \
            -o website-formal-media-authority.json
          node -e "const x=require('./website-formal-media-authority.json');if(!Array.isArray(x.products)||x.products.length<1)process.exit(1)"

      - name: Verify active one-to-one image production queue
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const q=JSON.parse(fs.readFileSync('ops/post-image-production-queue-current.json','utf8'));
          const d=JSON.parse(fs.readFileSync('active-drafts.json','utf8'));
          const media=JSON.parse(fs.readFileSync('website-formal-media-authority.json','utf8'));
          const posts=(Array.isArray(d)?d[0]?.results:d?.results)||[];
          const items=Array.isArray(q.items)?q.items:[];
          const errors=[];
          const allowedProducts=new Set(['30cc','180cc','龜鹿膏','鹿茸粉']);
          if(!Array.isArray(media.products)||media.productCount!==4||media.products.length!==4)errors.push('目前官網正式產品權威必須是四品');
          const authorityById=new Map((media.products||[]).map(p=>[p.id,p]));
          const assetMap={
            '30cc':'guilu-drink-30',
            '180cc':'guilu-drink-180',
            '龜鹿膏':'guilu-gao',
            '鹿茸粉':'luerong-fen'
          };

          if(q.brand!=='仙加味')errors.push('圖片清單品牌不是仙加味');
          if(q.status!=='production-queue')errors.push(`queue status異常 ${q.status}`);
          if(Number(q.total)!==items.length)errors.push(`queue total ${q.total} != items ${items.length}`);
          if(items.length!==posts.length)errors.push(`圖片清單 ${items.length} != live draft ${posts.length}`);
          if(!String(q.characterLock||'').includes('不得成熟化'))errors.push('queue缺少小老闆年齡／同一人硬鎖');

          for(const [queueName,id] of Object.entries(assetMap)){
            const current=String(q.formalAssets?.[queueName]||'').replace(/^\//,'');
            const product=authorityById.get(id);
            const approvedPaths={'guilu-drink-30':'images/product-main/guilu-drink-30.jpg','guilu-drink-180':'images/product-main/guilu-drink-180.jpg','guilu-gao':'images/product-main/guilu-gao.jpg','luerong-fen':'images/product-main/luerong-fen.jpg'};
            const expected=approvedPaths[id];
            if(!expected||!product)errors.push(`官網正式媒體權威缺 ${id}`);
            else if(product.mediaStatus!=='approved-formal-product-image')errors.push(`官網 ${id} 尚未核准正式主圖`);
            else if(current!==expected)errors.push(`${queueName}: queue產品主圖 ${current||'(空)'} 與官網權威 ${expected} 不一致`);
          }

          const byPost=new Map(), imageIds=new Set();
          for(const x of items){
            if(!x.postId||!x.imageId||!x.title||!x.copyHash)errors.push('圖片清單存在缺欄位項目');
            if(byPost.has(x.postId))errors.push(`postId重複 ${x.postId}`); else byPost.set(x.postId,x);
            if(imageIds.has(x.imageId))errors.push(`imageId重複 ${x.imageId}`); else imageIds.add(x.imageId);
            if(!String(x.characterLock||'').includes('不得成熟化')||!String(x.characterLock||'').includes('同一位角色'))errors.push(`${x.postId}: 缺小老闆年齡／同一人硬鎖`);
            if(!Array.isArray(x.products))errors.push(`${x.postId}: products不是陣列`);
            const products=Array.isArray(x.products)?x.products:[];
            if(new Set(products).size!==products.length)errors.push(`${x.postId}: products重複`);
            for(const product of products)if(!allowedProducts.has(product))errors.push(`${x.postId}: 未知產品 ${product}`);

            const t=String(x.title||'');
            if(/180cc/i.test(t)&&!/30cc/i.test(t)&&products.includes('30cc'))errors.push(`${x.postId}: 單一180cc情境混入30cc`);
            if(/30cc/i.test(t)&&!/180cc/i.test(t)&&products.includes('180cc'))errors.push(`${x.postId}: 單一30cc情境混入180cc`);
            if(/龜鹿膠|龜鹿湯塊/.test([x.title,x.scene].join(' ')))errors.push(`${x.postId}: 出現退場產品，不可恢復對外製圖`);
            if(/試喝/.test(t)){
              if(!products.includes('30cc'))errors.push(`${x.postId}: 試喝情境缺正式30cc小玻璃裸罐`);
              if(products.includes('180cc'))errors.push(`${x.postId}: 試喝情境不得混入180cc`);
            }
            if(/龜鹿飲/.test(t)&&!products.some(p=>p==='30cc'||p==='180cc'))errors.push(`${x.postId}: 龜鹿飲情境未對應正式30cc／180cc產品圖`);
          }

          for(const p of posts){
            const x=byPost.get(p.id);
            if(!x){errors.push(`${p.id}: 沒有唯一圖片製作項目`);continue}
            if(x.title!==p.title)errors.push(`${p.id}: 圖片清單標題與D1不一致`);
            const hash=crypto.createHash('sha256').update(String(p.copy||'')).digest('hex').slice(0,16);
            if(x.copyHash!==hash)errors.push(`${p.id}: 文案已變更，圖片規劃尚未同步`);
                  }

          for(const x of items)if(!posts.some(p=>p.id===x.postId))errors.push(`${x.postId}: 清單項目已不在live draft，需移出queue`);
          if(errors.length){console.error(errors.join('\n'));process.exit(1)}
          console.log(`PASS ${posts.length}篇live draft：唯一imageId、文案雜湊、角色年齡鎖、情境產品對應與現行四項正式產品主圖一致`);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: post-image-queue-integrity-${{ github.run_id }}
          path: |
            active-drafts.json
            website-formal-media-authority.json
          retention-days: 3
