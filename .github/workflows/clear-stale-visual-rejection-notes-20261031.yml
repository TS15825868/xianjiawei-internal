name: XJW one-time remove obsolete 3D rejection messages after visual recheck
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clear-stale-visual-rejection-notes-20261031.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xjw-d1-visual-note-cleanup
  cancel-in-progress: false
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read live pending posts and only completed visual precheck audit IDs
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_quality_status,rejection_reason,review_note,copy,image_url,updated_at,approved_by,approved_at,published_at,scheduled_at,image_approved FROM social_posts WHERE status='pending_review' ORDER BY id" > /tmp/xjw-visual-messages-before.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT entity_id,actor_email,after_json FROM audit_logs WHERE action='AI圖片實際看圖：舊需重製轉待正式覆核' ORDER BY entity_id" > /tmp/xjw-visual-precheck-audits.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT post_id,state,metricool_id FROM social_metricool_sync WHERE post_id IN (SELECT id FROM social_posts WHERE status='pending_review')" > /tmp/xjw-visual-metricool-links.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT post_id,status,attempt_count,remote_id,last_attempt_at,published_at FROM social_publish_deliveries WHERE post_id IN (SELECT id FROM social_posts WHERE status='pending_review')" > /tmp/xjw-visual-delivery-links.json
      - name: Exact original rework reason and current review evidence CAS preflight
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'))[0]?.results||[];
          const posts=read('/tmp/xjw-visual-messages-before.json');
          const logs=read('/tmp/xjw-visual-precheck-audits.json');
          const sync=read('/tmp/xjw-visual-metricool-links.json'),delivery=read('/tmp/xjw-visual-delivery-links.json');
          const old='實際圖片覆核：小老闆與夥伴為非正式立體3D風格；涉及產品的貼文需核對正式實物原圖。請重新製作固定2D Q版並回待審核。';
          const next='AI實圖預檢已核對現有圖片檔案雜湊與文案版本；仍待正式16項圖文與產品原圖來源確認，未核准、不可排程或發布。';
          const q=s=>"'"+String(s??'').replaceAll("'","''")+"'";
          if(logs.length!==41||new Set(logs.map(x=>x.entity_id)).size!==41)throw Error('Missing 41 unique completed precheck audit IDs');
          const sql=[],proof=[];
          for(const a of logs){
            const p=posts.find(x=>x.id===a.entity_id);
            if(!p||p.status!=='pending_review'||p.image_quality_status!=='needs_review'||Number(p.image_approved)!==0||p.approved_by||p.approved_at||p.scheduled_at||p.published_at)throw Error('Unexpected approved/published or nonpending row: '+a.entity_id);
            const precheck=JSON.parse(a.after_json);
            if(a.actor_email!=='system:ai-precheck-not-human'||precheck.quality!=='needs_review'||precheck.image_sha256!==crypto.createHash('sha256').update(fs.readFileSync(new URL(p.image_url).pathname.replace(/^\/TS15825868\/xianjiawei-internal\/main\//,''))).digest('hex'))throw Error('Precheck audit evidence no longer agrees with GitHub image: '+a.entity_id);
            if(p.rejection_reason!==old||!String(p.review_note||'').includes('20261017_3D_FULL_AUDIT'))throw Error('Refuse to erase nonlegacy or externally edited review messages: '+a.entity_id);
            if(sync.some(x=>x.post_id===p.id&&['scheduled','awaiting_work','queued','awaiting_verification','cancel_required','unknown','published'].includes(x.state)))throw Error('Externally scheduled row: '+a.entity_id);
            if(delivery.some(x=>x.post_id===p.id&&(Number(x.attempt_count)>0||x.remote_id||x.last_attempt_at||x.published_at||['sending','retry','published','manual_required','permanent_failed'].includes(x.status))))throw Error('History delivery lock: '+a.entity_id);
            const id='AUD-XJW-LEGACY-NOTE-CLEAR-20261031-'+crypto.createHash('sha256').update(p.id).digest('hex').slice(0,14);
            const before=JSON.stringify({reason:p.rejection_reason,review_note:p.review_note,quality:'needs_review',updated_at:p.updated_at});
            const after=JSON.stringify({reason:'',review_note:next,quality:'needs_review',status:'pending_review',approval:false,original_reason_retained_in_audit:true,source_precheck_audit_id:a.entity_id});
            sql.push("UPDATE social_posts SET rejection_reason='',review_note="+q(next)+",updated_at=datetime('now') WHERE id="+q(p.id)+" AND status='pending_review' AND image_quality_status='needs_review' AND image_approved=0 AND approved_by IS NULL AND approved_at IS NULL AND scheduled_at IS NULL AND published_at IS NULL AND rejection_reason="+q(old)+" AND review_note="+q(p.review_note)+" AND updated_at="+q(p.updated_at)+" AND copy="+q(p.copy)+" AND image_url="+q(p.image_url)+" AND NOT EXISTS(SELECT 1 FROM social_metricool_sync WHERE post_id=social_posts.id AND state IN ('scheduled','awaiting_work','queued','awaiting_verification','cancel_required','unknown','published')) AND NOT EXISTS(SELECT 1 FROM social_publish_deliveries WHERE post_id=social_posts.id AND (COALESCE(attempt_count,0)>0 OR last_attempt_at IS NOT NULL OR published_at IS NOT NULL OR TRIM(COALESCE(remote_id,''))<>'' OR status IN ('sending','retry','published','manual_required','permanent_failed')));");
            sql.push("INSERT INTO audit_logs(id,actor_email,action,entity_type,entity_id,before_json,after_json,ip) SELECT "+[id,'system:visual-note-cleanup','AI實圖預檢後清理舊3D退件文案','貼文',p.id,before,after,''].map(q).join(',')+" WHERE changes()=1;");
            proof.push({post_id:p.id,audit_id:id});
          }
          fs.writeFileSync('/tmp/xjw-visual-note-fix.sql',sql.join('\n')+'\n');
          fs.writeFileSync('/tmp/xjw-visual-note-targets.json',JSON.stringify(proof,null,2));
          console.log('PASS all 41 prior image prechecks; message-only update, unchanged status, image or copy');
          NODE
      - name: Clear only outdated display messages, not quality holds or approvals
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/xjw-visual-note-fix.sql
      - name: Independently read back all 59 pending posts and 41 audit records
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_quality_status,rejection_reason,review_note,copy,image_url,updated_at,approved_by,approved_at,published_at,scheduled_at,image_approved FROM social_posts WHERE status='pending_review' ORDER BY id" > /tmp/xjw-visual-messages-after.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,entity_id,actor_email,after_json FROM audit_logs WHERE action='AI實圖預檢後清理舊3D退件文案'" > /tmp/xjw-visual-note-audits.json
          node - <<'NODE'
          const fs=require('fs'),read=p=>JSON.parse(fs.readFileSync(p,'utf8'))[0]?.results||[];
          const before=read('/tmp/xjw-visual-messages-before.json'),after=read('/tmp/xjw-visual-messages-after.json'),logs=read('/tmp/xjw-visual-note-audits.json'),targets=JSON.parse(fs.readFileSync('/tmp/xjw-visual-note-targets.json','utf8'));
          if(before.length!==after.length||before.length!==59||logs.length!==41||targets.length!==41)throw Error('Unexpected row count after cleanup');
          const ids=new Set(targets.map(x=>x.post_id));
          for(const old of before){
            const cur=after.find(x=>x.id===old.id);
            if(!cur)throw Error('Missing pending row: '+old.id);
            if(ids.has(old.id)){
              if(cur.status!=='pending_review'||cur.image_quality_status!=='needs_review'||cur.rejection_reason!==''||!cur.review_note.startsWith('AI實圖預檢已核對')||cur.copy!==old.copy||cur.image_url!==old.image_url||cur.image_approved!==0||cur.approved_by||cur.approved_at||cur.scheduled_at||cur.published_at)throw Error('Unsafe cleanup after-state: '+old.id);
              if(!logs.some(a=>a.entity_id===old.id&&a.actor_email==='system:visual-note-cleanup'))throw Error('Audit missing: '+old.id);
            }else if(JSON.stringify(cur)!==JSON.stringify(old))throw Error('Unrelated pending row changed: '+old.id);
          }
          console.log('PASS live D1: 41 obsolete displayed rejection messages removed, all 59 remain pending, 0 new approvals/publications');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xjw-visual-message-cleanup-${{ github.run_id }}
          path: |
            /tmp/xjw-visual-messages-before.json
            /tmp/xjw-visual-messages-after.json
            /tmp/xjw-visual-precheck-audits.json
            /tmp/xjw-visual-note-audits.json
            /tmp/xjw-visual-note-targets.json
          retention-days: 3
