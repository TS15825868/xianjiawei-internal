name: 修正貼文中心圖片與上傳功能 20260818

on:
  push:
    branches: [main]
    paths:
      - 'assets/data/repair-posting-center-v20260818.trigger'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Repair production D1 post state
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/repair.sql <<'SQL'
          BEGIN;

          -- 已發布品牌故事：只校正正式圖片，不改已發布狀態。
          UPDATE social_posts
          SET image_url='https://ts15825868.github.io/xianjiawei/images/brand/approved-v405/brand-story.webp?v=20260818-published-authority',
              image_alt='仙加味品牌故事｜仙加味，從萬華開始｜使用者確認正式發布圖',
              image_source='2026-08-18 使用者再次確認之已發布品牌故事正式圖',
              image_quality_status='published_approved',image_approved=1,
              updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now')
          WHERE id='POST-BRAND-START';

          -- 已發布試喝貼文：若歷史列不存在則補回；不重新送審、不重新發布。
          INSERT INTO social_posts(
            id,title,headline,copy,category,platforms_json,status,scheduled_at,proposed_scheduled_at,
            approved_by,approved_at,published_at,image_url,image_alt,image_source,image_approved,
            image_width,image_height,image_bytes,image_quality_status,created_by,created_at,updated_at
          ) VALUES(
            'trial-first','龜鹿飲試喝組｜先試喝，再決定','30cc小玻璃罐3罐試喝品免費，運費自付',
            '想先認識龜鹿飲，可以從30cc小玻璃罐試喝組開始。試喝內容為3罐試喝品免費，運費自付：7-11店到店60元，郵局宅配100元。每位顧客、電話及地址限申請一次。\n\n龜鹿飲為接單後安排製作，約5～7個工作天完成並安排出貨。試喝申請與正式下單皆由官方LINE承接。\n\n仙加味｜補養，是一種節奏。',
            '試喝','["Facebook","Instagram","LINE VOOM","Google 商家"]','published',NULL,NULL,
            NULL,NULL,NULL,
            'https://ts15825868.github.io/xianjiawei/images/trial/trial-poster-small-boss-official-v20260814.jpg?v=20260818-published-authority',
            '仙加味龜鹿飲30cc三罐試喝正式小老闆海報','2026-08-18 使用者再次確認之已發布試喝正式圖',1,
            0,0,0,'published_approved','system',strftime('%Y-%m-%dT%H:%M:%fZ','now'),strftime('%Y-%m-%dT%H:%M:%fZ','now')
          ) ON CONFLICT(id) DO UPDATE SET
            title=excluded.title,headline=excluded.headline,copy=excluded.copy,category=excluded.category,
            platforms_json=excluded.platforms_json,status='published',scheduled_at=NULL,proposed_scheduled_at=NULL,
            image_url=excluded.image_url,image_alt=excluded.image_alt,image_source=excluded.image_source,
            image_approved=1,image_quality_status='published_approved',updated_at=excluded.updated_at;

          -- 新增「哪些人會開始認識龜鹿系列」：有文案但圖片尚未同步到公開正式媒體前維持草稿。
          INSERT INTO social_posts(
            id,title,headline,copy,category,platforms_json,status,scheduled_at,proposed_scheduled_at,
            approved_by,approved_at,published_at,image_url,image_alt,image_source,image_approved,
            image_width,image_height,image_bytes,image_quality_status,created_by,created_at,updated_at
          ) VALUES(
            'POST-AUDIENCE-NEEDS','哪些人，會開始認識龜鹿系列？','從生活情境開始，比只看年齡更容易理解',
            '龜鹿系列不只是一種年齡的選擇。有人從上班工作、運動健身、作息忙碌、日常飲食安排或年節送禮等生活情境，開始認識仙加味龜鹿系列。\n\n不同生活節奏，適合先了解的產品型態也不一定相同。可以先從自己平常在家或外出、直接飲用或料理搭配等習慣開始，再慢慢認識30cc、180cc、龜鹿膏、龜鹿湯塊、龜鹿膠與鹿茸粉。\n\n想知道怎麼開始，也可以直接透過LINE把自己的日常告訴我們。\n\n仙加味｜補養，是一種節奏。',
            '龜鹿入門','["Facebook","Instagram","LINE VOOM"]','draft',NULL,NULL,NULL,NULL,NULL,
            '','常見生活情境與需求｜待回填使用者2026-08-18確認正式圖','2026-08-18 使用者確認新圖｜待正式媒體同步',0,
            0,0,0,'needs-generation','system',strftime('%Y-%m-%dT%H:%M:%fZ','now'),strftime('%Y-%m-%dT%H:%M:%fZ','now')
          ) ON CONFLICT(id) DO UPDATE SET
            title=excluded.title,headline=excluded.headline,copy=excluded.copy,category=excluded.category,
            platforms_json=excluded.platforms_json,status='draft',scheduled_at=NULL,proposed_scheduled_at=NULL,
            approved_by=NULL,approved_at=NULL,published_at=NULL,image_url='',image_alt=excluded.image_alt,
            image_source=excluded.image_source,image_approved=0,image_quality_status='needs-generation',updated_at=excluded.updated_at;

          -- 目前10篇被錯圖污染。先移除錯圖，不再讓 FAQ／怎麼使用／舊 priority 圖冒充正式圖。
          UPDATE social_posts
          SET status='draft',scheduled_at=NULL,proposed_scheduled_at=NULL,approved_by=NULL,approved_at=NULL,published_at=NULL,
              image_url='',image_alt='',image_source='2026-08-18 舊錯圖已移除｜等待依文案回填使用者確認正式圖',
              image_approved=0,image_width=0,image_height=0,image_bytes=0,image_quality_status='needs-generation',
              platforms_json='["Facebook","Instagram","LINE VOOM"]',
              updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now')
          WHERE id IN (
            'XJW-GUILU-drink30-work-break','XJW-GUILU-drink180-home','XJW-GUILU-gao-storage',
            'XJW-GUILU-tangkuai-soup','XJW-GUILU-jiao-600g','XJW-GUILU-luerong-75g',
            'XJW-SOCIAL-20260815-02-line-consult-and-trial','XJW-GUILU-choose-by-place',
            'XJW-SOCIAL-20260815-03-storage-basics','XJW-SOCIAL-20260815-01-warm-drink-moment'
          );

          COMMIT;
          SQL
          npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/repair.sql

      - name: Verify D1 no longer serves wrong images
        shell: bash
        run: |
          set -euo pipefail
          IDS="'XJW-GUILU-drink30-work-break','XJW-GUILU-drink180-home','XJW-GUILU-gao-storage','XJW-GUILU-tangkuai-soup','XJW-GUILU-jiao-600g','XJW-GUILU-luerong-75g','XJW-SOCIAL-20260815-02-line-consult-and-trial','XJW-GUILU-choose-by-place','XJW-SOCIAL-20260815-03-storage-basics','XJW-SOCIAL-20260815-01-warm-drink-moment'"
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_url,image_quality_status,platforms_json FROM social_posts WHERE id IN ($IDS) ORDER BY id" >/tmp/ten.json
          node - <<'NODE'
          const rows=require('/tmp/ten.json')[0]?.results||[];
          if(rows.length!==10) throw new Error('ten post count='+rows.length);
          for(const r of rows){
            if(r.status!=='draft') throw new Error(r.id+' status='+r.status);
            if(String(r.image_url||'')!=='') throw new Error(r.id+' still has wrong image');
            if(r.image_quality_status!=='needs-generation') throw new Error(r.id+' wrong image state');
            if(!String(r.platforms_json||'').includes('Facebook')) throw new Error(r.id+' platforms missing');
          }
          console.log('PASS 10/10 wrong images removed; all waiting for exact image refill');
          NODE
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_url,image_approved FROM social_posts WHERE id IN ('POST-BRAND-START','trial-first','POST-AUDIENCE-NEEDS') ORDER BY id" >/tmp/special.json
          node - <<'NODE'
          const rows=require('/tmp/special.json')[0]?.results||[];
          const by=Object.fromEntries(rows.map(x=>[x.id,x]));
          if(by['POST-BRAND-START']?.status!=='published'||!String(by['POST-BRAND-START']?.image_url||'').includes('/images/brand/approved-v405/brand-story.webp')) throw new Error('brand story not restored');
          if(by['trial-first']?.status!=='published'||!String(by['trial-first']?.image_url||'').includes('/images/trial/trial-poster-small-boss-official-v20260814.jpg')) throw new Error('trial post not restored');
          if(by['POST-AUDIENCE-NEEDS']?.status!=='draft') throw new Error('audience post must stay draft before image review');
          console.log('PASS published brand + trial restored; new audience post queued as draft');
          NODE

      - name: Build and deploy current posting center
        shell: bash
        run: |
          set -euo pipefail
          npm run build:static
          npx wrangler deploy --keep-vars

      - name: Verify deployed Worker core
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 5 --max-time 20 https://xianjiawei-internal.tung314069.workers.dev/healthz/core | tee /tmp/health.json
          node -e "const x=require('/tmp/health.json');if(!x.ok)process.exit(1);console.log('PASS worker core',x.productionEntryVersion||x.version||'ok')"
