name: 修正貼文中心錯圖狀態 20260818

on:
  push:
    branches: [main]
    paths:
      - 'assets/data/repair-posting-center-v20260818.trigger'
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save wrangler@latest
      - name: Remove wrong live images from the ten review posts
        shell: bash
        run: |
          set -euo pipefail
          IDS="'XJW-GUILU-drink30-work-break','XJW-GUILU-drink180-home','XJW-GUILU-gao-storage','XJW-GUILU-tangkuai-soup','XJW-GUILU-jiao-600g','XJW-GUILU-luerong-75g','XJW-SOCIAL-20260815-02-line-consult-and-trial','XJW-GUILU-choose-by-place','XJW-SOCIAL-20260815-03-storage-basics','XJW-SOCIAL-20260815-01-warm-drink-moment'"
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "UPDATE social_posts SET status='draft', image_url='', image_alt='', image_source='2026-08-18 舊錯圖已移除｜等待依文案回填正式圖', image_quality_status='needs-generation', image_approved=0, scheduled_at=NULL, updated_at=datetime('now') WHERE id IN ($IDS) AND status<>'archived';"
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,status,image_url,image_quality_status,image_approved,scheduled_at FROM social_posts WHERE id IN ($IDS) ORDER BY id" > /tmp/ten.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/ten.json','utf8'));
          const rows=raw?.[0]?.results||[];
          if(rows.length!==10)throw new Error('expected 10 rows, got '+rows.length);
          for(const r of rows){
            if(r.status!=='draft')throw new Error(r.id+' status='+r.status);
            if(String(r.image_url||'')!=='')throw new Error(r.id+' still has image='+r.image_url);
            if(r.image_quality_status!=='needs-generation')throw new Error(r.id+' quality='+r.image_quality_status);
            if(Number(r.image_approved||0)!==0)throw new Error(r.id+' image_approved='+r.image_approved);
            if(r.scheduled_at)throw new Error(r.id+' still scheduled');
          }
          fs.mkdirSync('audits',{recursive:true});
          fs.writeFileSync('audits/repair-posting-center-v20260818.json',JSON.stringify({checked_at:new Date().toISOString(),status:'PASS',count:rows.length,posts:rows},null,2)+'\n');
          console.log('PASS: 10/10 wrong images removed from production D1');
          NODE
      - name: Record verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audits/repair-posting-center-v20260818.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(posts): record verified removal of wrong live images'
          git pull --rebase origin main
          git push origin HEAD:main
