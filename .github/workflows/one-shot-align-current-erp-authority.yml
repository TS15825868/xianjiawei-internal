name: 仙加味 ERP 目前權威 Runtime 一次性對齊

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-align-current-erp-authority.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Align review gate, regeneration prompt, media policy and product metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re

          # 1) Review gate: product-specific context, not cross-product 80-char false positives.
          path=Path('src/publishing-review-gate-entry.js')
          text=path.read_text(encoding='utf-8')
          pattern=r"function productMatchErrors\(row\)\{.*?return\[\.\.\.new Set\(errors\)\]\}"
          replacement=r'''const REVIEW_PRODUCT_NAMES=['龜鹿膏','龜鹿飲30cc','龜鹿飲180cc','龜鹿湯塊','龜鹿膠','鹿茸粉'];
          function reviewProductSegments(value,target){const source=String(value||''),segments=[];let start=0;while(target){const pos=source.indexOf(target,start);if(pos<0)break;let end=source.length,after=pos+target.length;for(const name of REVIEW_PRODUCT_NAMES){const next=source.indexOf(name,after);if(next>=0)end=Math.min(end,next)}segments.push(source.slice(pos,end));start=after}return segments}
          function productMatchErrors(row){const text=[row.title,row.headline,row.copy,row.category].filter(Boolean).join(' '),image=[row.image_url,row.image_alt,row.image_source].filter(Boolean).join(' '),combined=`${text} ${image}`,errors=[];for(const rule of PRODUCT_RULES){if(!rule.copy.some(re=>re.test(text)))continue;if(image&&!rule.image.some(re=>re.test(image)))errors.push(`文案主產品與圖片不一致：${rule.label}`)}if(/30\s*cc/i.test(combined)&&/(玻璃瓶|小玻璃瓶|30\s*cc\s*／\s*瓶|30\s*cc\s*瓶裝)/i.test(combined))errors.push('30cc正式名稱必須是小玻璃罐／30cc／罐，不得稱瓶');for(const segment of reviewProductSegments(combined,'龜鹿湯塊')){if(/(300\s*g|600\s*g)/i.test(segment))errors.push('龜鹿湯塊正式規格只有75g／盒｜8塊裝');if(/每塊約?\s*9\.375\s*g/i.test(segment))errors.push('龜鹿湯塊每塊約9.375g只留產品詳細／內部資料，不放貼文主規格')}for(const segment of reviewProductSegments(combined,'龜鹿膠')){if(/每塊約?\s*18\.75\s*g/i.test(segment))errors.push('龜鹿膠每塊約18.75g只留產品詳細／內部資料，不放貼文主規格')}for(const segment of reviewProductSegments(combined,'龜鹿膏')){if(/(一天一次一小匙|每日一次一小匙|早晚各一小匙)/.test(segment))errors.push('龜鹿膏目前正式使用方式為每日早上及下午各一小匙')}if(!image)errors.push('缺少貼文圖片');if(!String(row.image_alt||'').trim())errors.push('缺少圖片說明');if(String(row.image_quality_status||'').toLowerCase()==='low')errors.push('圖片解析度不足');return[...new Set(errors)]}'''
          updated,count=re.subn(pattern,replacement,text,count=1,flags=re.S)
          if count!=1: raise SystemExit(f'review gate productMatchErrors patch count={count}')
          path.write_text(updated,encoding='utf-8')

          # 2) Regeneration prompt: current customer product images + products-v3 identity references.
          path=Path('assets/js/post-regenerate-policy-v1.js')
          text=path.read_text(encoding='utf-8')
          marker='  const escText='
          if marker not in text: raise SystemExit('regeneration marker missing')
          suffix=text[text.index(marker):]
          # Preserve the operating implementation; replace only authority/prompt prefix.
          prefix="""(()=>{\n  'use strict';\n  const VERSION='2026-08-14-current-media-role-generation-policy-v5';\n  const SITE='https://ts15825868.github.io/xianjiawei/';\n  const MEDIA_VERSION='20260814-product-modal-media-v3';\n  const STORAGE_PREFIX='xjw-regeneration:';\n  const nativeFetch=window.fetch.bind(window);\n  const OFFICIAL=Object.freeze({\n    '龜鹿膏100g':`${SITE}images/customer-display-v20260812/guilu-gao.avif?v=${MEDIA_VERSION}`,\n    '龜鹿飲30cc玻璃罐':`${SITE}images/customer-display-v20260812/guilu-drink-30cc.avif?v=${MEDIA_VERSION}`,\n    '龜鹿飲180cc鋁袋':`${SITE}images/customer-display-v20260812/guilu-drink-180cc-product.jpg?v=${MEDIA_VERSION}`,\n    '龜鹿湯塊75g':`${SITE}images/customer-display-v20260812/guilu-tangkuai.avif?v=${MEDIA_VERSION}`,\n    '龜鹿膠600g':`${SITE}images/customer-display-v20260812/guilu-jiao.avif?v=${MEDIA_VERSION}`,\n    '鹿茸粉75g':`${SITE}images/customer-display-v20260812/luerong-fen.avif?v=${MEDIA_VERSION}`\n  });\n  const IDENTITY=Object.freeze({\n    '龜鹿膏':`${SITE}images/products-v3/guilu-gao.jpg`,\n    '龜鹿飲30cc玻璃罐':`${SITE}images/products-v3/guilu-drink-30.jpg`,\n    '龜鹿飲180cc鋁袋':`${SITE}images/products-v3/guilu-drink-180.jpg`,\n    '龜鹿湯塊':`${SITE}images/products-v3/guilu-tangkuai.jpg`,\n    '龜鹿膠':`${SITE}images/products-v3/guilu-jiao.jpg`,\n    '鹿茸粉':`${SITE}images/products-v3/luerong-fen.jpg`\n  });\n  const TRIAL=`${SITE}images/trial/trial-poster-small-boss-official-v20260814.jpg?v=${MEDIA_VERSION}`;\n  const PRODUCT_URLS=Object.entries(OFFICIAL).map(([name,url])=>`${name}：${url}`).join('\\n');\n  const IDENTITY_URLS=Object.entries(IDENTITY).map(([name,url])=>`${name}：${url}`).join('\\n');\n  const HARD_RULES=`【仙加味圖片與文案目前唯一正式規格】\\n\\n一、視覺總原則\\n- 每張只能是一個完整、自然、統一光影與透視的單一場景。\\n- 禁止拼貼、拼版、六格、海報疊海報、卡片堆疊、產品裁片硬貼、角色裁片硬貼、黑色補位、不同畫風素材混搭。\\n- 圖片與文案的季節、天氣、地點、場合、環境、冷熱、表情、動作與道具必須一致。\\n\\n二、產品本體與媒體角色\\n- AI絕對不得重畫、改造、補畫、變形仙加味產品。\\n- 一般產品主題優先使用目前核准的顧客正式產品圖，完整等比例呈現：\\n${PRODUCT_URLS}\\n- products-v3只作真實產品身份、包裝與比例校正參考，不是一般顧客主圖：\\n${IDENTITY_URLS}\\n- 明確「DM／詳細DM」意圖才使用目前images/dm-final/正式詳細DM。\\n- 試喝主題固定使用8/14正式小老闆試喝海報：${TRIAL}\\n- 若無法安全使用正式產品素材，寧可生成不含產品本體的完整場景並預留乾淨位置，也不得虛構產品。\\n- 多產品同框沒有可信相對尺度時改成單品構圖，不做拼貼式全系列。\\n\\n三、正式產品與主規格只有六項\\n1. 龜鹿膏：100g／罐。\\n2. 龜鹿飲30cc玻璃罐：30cc／罐（小玻璃罐）。\\n3. 龜鹿飲180cc鋁袋：180cc／包（鋁袋）。\\n4. 龜鹿湯塊：75g／盒｜8塊裝；每塊約9.375g只屬產品詳細／內部資料，不放貼文、產品圖或DM主規格。\\n5. 龜鹿膠：600g（1斤）／盒｜32塊裝；每塊約18.75g只屬產品詳細／內部資料，不放貼文、產品圖或DM主規格。\\n6. 鹿茸粉：75g／罐。\\n不得新增、猜測或沿用舊規格。\\n\\n四、產品比例硬規則\\n- 30cc：小玻璃裸罐、無貼紙；約Ø42×H51mm；不可叫瓶、不可改罐型或比例、不可放大成100g罐大小。\\n- 100g龜鹿膏：約寬51×高78mm；正式罐型與標籤比例固定。\\n- 180cc：狹長直立鋁袋，寬高比約0.64，可接受約0.60～0.68；不可拉胖或誇張放大。\\n- 湯塊75g、龜鹿膠600g、鹿茸粉75g沒有可信毫米尺寸，不得自行猜；只維持正式產品圖與products-v3身份參考的原比例。\\n\\n五、小老闆與角色\\n- 使用仙加味官網正式同款Q版小老闆：圓臉、大而圓深棕眼、短黑髮、米白中式上衣、深橄欖綠圍裙、胸前紅色直式「仙加味」印章。\\n- 頭、頭髮、雙手、雙腳與持物完整，不可裁切，四周保留安全空間。\\n- 小鹿與小烏龜需要時才加入，必須是分開的獨立角色；不可融合，也不可直接拿LINE OA裁切素材當社群貼文角色。\\n\\n六、文案與正式資料\\n- 繁體中文；以日常補養、生活節奏、飲食文化、溫熱飲用、日常搭配、料理方式、傳統工藝、原料特色與品牌故事為主。\\n- 不做療效、治療、改善疾病、保證等宣稱。\\n- 龜鹿膏目前使用方式為「每日早上及下午各一小匙」，不得回退一天一次／早晚用法。\\n- 品牌只顯示「仙加味」。\\n- 文案提到產品、成分、規格、使用方式、價格或活動時必須使用目前正式版本，不可自行補資料。\\n\\n七、流程\\n- 新文案與新圖一律只作 candidate／待審核。\\n- 不得因生成完成就自動核准、排程或發布。\\n- 生成後回仙加味貼文系統，按同一張卡片的「生成後回填／上傳」，貼上新文案或上傳新圖片；儲存後系統自動送回待審核。\\n- 生成後必須重新完成16項圖文審核。`;\n\n"""
          text=prefix+suffix
          text=text.replace('只能使用products-v3最新正式實拍等比例融入同一場景','只能使用目前核准正式產品圖完整等比例融入同一場景；products-v3只作真實產品身份與比例校正參考')
          text=text.replace('需要產品時只能使用products-v3最新正式實拍完整等比例融入單一場景','需要產品時只能使用目前核准正式產品圖完整等比例融入單一場景；products-v3只作真實產品身份與比例校正參考')
          text=text.replace('使用products-v3最新正式實拍完整等比例融入','使用目前核准正式產品圖完整等比例融入；products-v3只作身份與比例校正')
          path.write_text(text,encoding='utf-8')

          # 3) Formal media policy: align all detailed DMs to current high-resolution masters.
          path=Path('assets/js/formal-media-policy-v20260810.js')
          text=path.read_text(encoding='utf-8')
          replacements={
            '/images/dm-approved-v20260810/guilu-drink-180cc.webp':'/images/dm-final/03_guilu-drink-180cc-dm.jpg',
            '/images/dm-approved-v20260810/guilu-tangkuai-75g.webp':'/images/dm-final/05_guilu-tangkuai-75g-dm.jpg',
            '/images/dm-approved-v20260810/guilu-jiao-600g.webp':'/images/dm-final/06_guilu-jiao-600g-dm.jpg',
            '/images/dm-approved-v20260810/lurong-fen-75g.webp':'/images/dm-final/04_luerong-fen-75g-dm.jpg',
            "actualProductReference:'products-v3'":"actualProductReference:'products-v3-identity-and-scale-reference-only',customerProductImageReference:'customer-display-v20260812'",
            "productGenerationRule:'must preserve products-v3 actual product appearance'":"productGenerationRule:'must preserve current customer product display and verify identity/scale against products-v3; never redraw product'"
          }
          for old,new in replacements.items():
            if old not in text: raise SystemExit(f'formal media target missing: {old}')
            text=text.replace(old,new)
          path.write_text(text,encoding='utf-8')

          # 4) Product config metadata: canonical 180cc spec and current media roles.
          path=Path('config/official-products.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          data['version']='20260814-full-erp-current-authority-v4'
          byid={p['id']:p for p in data.get('products',[])}
          byid['guilu-drink-180']['spec']='180cc／包（鋁袋）'
          data.setdefault('visualLocks',{})['guiluDrink30']='小玻璃裸罐、無貼紙；高矮胖瘦照正式原圖，不改罐型與比例，不得稱瓶'
          data['mediaRoles']={
            'product':'官網目前六張customer-display正式顧客產品圖',
            'dm':'官網目前images/dm-final六張高解析正式詳細DM',
            'trial':'images/trial/trial-poster-small-boss-official-v20260814.jpg',
            'identityReference':'images/products-v3/真實產品身份、包裝與比例校正參考',
            'rule':'一般產品圖、詳細DM、試喝海報與products-v3身份參考四種角色分離，不得互相取代；產品本體不得AI重畫或變形'
          }
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Install dependencies for exact current validation
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Run current checks before commit
        run: |
          npm run check
          npm run guard:full
          npm run build:static

      - name: Commit aligned runtime and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/publishing-review-gate-entry.js assets/js/post-regenerate-policy-v1.js assets/js/formal-media-policy-v20260810.js config/official-products.json
          git rm .github/workflows/one-shot-align-current-erp-authority.yml
          git commit -m 'fix(erp): align review regeneration and media runtime to current authority'
          git pull --rebase origin main
          git push origin HEAD:main
