name: 仙加味貼文系統正式上線手動驗收

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Confirm production Worker entry
        run: >-
          grep -q '"main": "src/production-entry.js"' wrangler.jsonc
      - name: Check production and review-gate entry syntax
        run: |
          node --check src/production-entry.js
          node --check src/publishing-review-gate-entry.js
          node --check src/flexible-publish-entry.js
      - name: Confirm standalone publishing hard gates
        run: |
          grep -q 'social_post_review_gates' src/publishing-review-gate-entry.js
          grep -q "copy_image_match!==true" src/publishing-review-gate-entry.js
          grep -q "gateState(env,row)" src/production-entry.js
          grep -q "status='draft'" src/production-entry.js
          grep -q 'publishing-review-gate.js' publishing.html
          grep -q 'publishing.html' assets/js/erp-publishing-separation.js
      - name: Install checker dependencies only
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Run complete standalone publishing release checks
        run: npm run check
      - name: Build the exact static assets that will deploy
        run: npm run build:static
      - name: Ensure audit makes no repository changes
        run: git diff --exit-code
