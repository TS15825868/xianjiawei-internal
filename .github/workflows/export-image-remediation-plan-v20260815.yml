name: 仙加味重複圖片逐篇換圖清單

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-image-remediation-plan-v20260815.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require D1 credentials and install dependencies
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Read current 77-post library
        shell: bash
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,headline,copy,category,status,image_url,image_alt,image_source FROM social_posts WHERE status<>'archived' ORDER BY id;" > /tmp/posts.json
      - name: Build exact replacement queue
        shell: bash
        run: |
          mkdir -p audits
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const blocks=JSON.parse(fs.readFileSync('/tmp/posts.json','utf8'));
          const rows=blocks.flatMap(x=>x.results||[]);
          const norm=v=>String(v||'').trim().split(/[?#]/)[0].toLowerCase();
          const groups=new Map();
          for(const row of rows){const key=norm(row.image_url);if(!key)continue;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(row)}
          const score=(row,image)=>{
            let n=row.status==='published'?10000:0;
            const id=String(row.id||''),title=String(row.title||''),alt=String(row.image_alt||''),hay=`${id} ${title} ${alt}`.toLowerCase();
            if(/product-/.test(id))n+=800;
            if(/trial|試喝/.test(image)&&/trial|試喝/.test(hay))n+=700;
            if(/brand-story/.test(image)&&/brand|品牌故事|四代|萬華/.test(hay))n+=700;
            if(/drink-30|30cc/.test(image)&&/30cc|drink-30/.test(hay))n+=500;
            if(/drink-180|180cc/.test(image)&&/180cc|drink-180/.test(hay))n+=500;
            if(/guilu-gao|龜鹿膏/.test(image)&&/龜鹿膏|gao/.test(hay))n+=500;
            if(/tangkuai/.test(image)&&/湯塊|tangkuai/.test(hay))n+=500;
            if(/guilu-jiao/.test(image)&&/龜鹿膠|jiao/.test(hay))n+=500;
            if(/luerong/.test(image)&&/鹿茸|luerong/.test(hay))n+=500;
            if(/storage/.test(image)&&/保存|storage/.test(hay))n+=400;
            if(/warm/.test(image)&&/溫熱|溫一點|warm/.test(hay))n+=400;
            if(/rain/.test(image)&&/雨|rain/.test(hay))n+=400;
            return n;
          };
          const duplicateGroups=[];const targets=[];
          for(const [image,posts] of groups){
            if(posts.length<2)continue;
            const ranked=[...posts].sort((a,b)=>score(b,image)-score(a,image)||String(a.id).localeCompare(String(b.id)));
            const keep=ranked[0];
            const replace=ranked.slice(1);
            duplicateGroups.push({image_url:image,count:posts.length,keep:{id:keep.id,title:keep.title,status:keep.status},replace:replace.map(p=>({id:p.id,title:p.title,status:p.status,category:p.category}))});
            for(const p of replace){
              targets.push({
                id:p.id,title:p.title,headline:p.headline,copy:p.copy,category:p.category,status:p.status,current_image:p.image_url,
                action:'generate_unique_one_shot_scene',
                visual_rules:['完整單一情境','不可拼湊','仙加味固定Q版小老闆','小鹿與小烏龜分開','依文案季節／氣候／冷熱／場景／表情／動作','需要產品時沿用正式產品外觀與比例','圖片不要生成多餘文字','不得顯示台興山產'],
                target_alt:`仙加味｜${p.title}｜專屬完整單一情境圖`
              });
            }
          }
          const plan={version:'2026-08-15-image-remediation-v1',generated_at_utc:new Date().toISOString(),total_posts:rows.length,duplicate_groups:duplicateGroups.length,duplicate_posts:[...new Set(duplicateGroups.flatMap(g=>[g.keep.id,...g.replace.map(x=>x.id)]))].length,replacement_targets:targets.length,groups:duplicateGroups,targets};
          fs.writeFileSync('audits/image-remediation-current.json',JSON.stringify(plan,null,2)+'\n');
          console.log(JSON.stringify({total_posts:plan.total_posts,duplicate_groups:plan.duplicate_groups,duplicate_posts:plan.duplicate_posts,replacement_targets:plan.replacement_targets},null,2));
          NODE
      - name: Commit current remediation plan
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audits/image-remediation-current.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(posts): refresh exact duplicate-image replacement queue'
          git pull --rebase origin main
          git push origin HEAD:main
