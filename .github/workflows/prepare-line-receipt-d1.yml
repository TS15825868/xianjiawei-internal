name: 仙加味 LINE 備援 D1 安全建立與驗證
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-line-receipt-d1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xjw-line-receipt-d1-schema
  cancel-in-progress: false
jobs:
  create-idempotent-inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Confirm minimal isolated schema and configured disabled Worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node - <<'NODE'
          const fs=require('node:fs');
          const sql=fs.readFileSync('docs/cloudflare-line-receipt-schema.sql','utf8');
          const cfg=JSON.parse(fs.readFileSync('wrangler.line-receipt-staging.jsonc','utf8'));
          if(!sql.includes('CREATE TABLE IF NOT EXISTS xjw_line_receipt_inbox') ||
             !sql.includes('CREATE INDEX IF NOT EXISTS idx_xjw_line_receipt_status_time') ||
             /DROP\s+|DELETE\s+FROM|UPDATE\s+|ALTER\s+TABLE|INSERT\s+INTO/i.test(sql))throw Error('Unsafe schema');
          const guards=['XJW_LINE_RECEIPT_ENABLED','XJW_LINE_VERIFY_ONLY_ENABLED','XJW_LINE_E2E_VERIFIED','XJW_LINE_EXCLUSIVE_CALLBACK_CONFIRMED'];
          if(guards.some(k=>cfg.vars[k]!=='false'))throw Error('Do not migrate after enabling standby');
          NODE
      - name: Check Cloudflare D1 recovery point before schema change
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 time-travel info xianjiawei-internal-db > /tmp/xjw-line-before-bookmark.txt
          grep -Eiq 'bookmark|current' /tmp/xjw-line-before-bookmark.txt || { echo 'D1 Time Travel recovery point unavailable; migration cancelled'; exit 1; }
          echo 'PASS: Cloudflare automatic D1 Time Travel bookmark exists; content withheld.'
      - name: Create only the LINE isolated inbox and index
        run: npx --yes wrangler@4 d1 execute xianjiawei-internal-db --remote --file docs/cloudflare-line-receipt-schema.sql
      - name: Read back schema only and verify empty inbox
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute xianjiawei-internal-db --remote --command "SELECT COUNT(*) AS inbox_count FROM xjw_line_receipt_inbox"
          npx --yes wrangler@4 d1 execute xianjiawei-internal-db --remote --command "SELECT name FROM sqlite_master WHERE type='index' AND name='idx_xjw_line_receipt_status_time'"
          echo 'PASS: isolated LINE receipt inbox exists; no customer webhook switched and no messages sent.'
