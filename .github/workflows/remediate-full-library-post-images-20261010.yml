name: 仙加味全庫不合格貼文圖片安全退回
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remediate-full-library-post-images-20261010.yml'
      - 'tools/remediate-social-image-audit-20261010.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xjw-full-library-rejection-20261010
  cancel-in-progress: false
jobs:
  reject:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Confirm existing Cloudflare D1 credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install existing project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Read current image states before any edits
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_url,image_approved FROM social_posts" > /tmp/full-library-visual-live.json
      - name: Compare live D1 with the 27-item visual audit
        run: node tools/remediate-social-image-audit-20261010.cjs
      - name: Remove unsafe old image bindings from unapproved posts only
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/full-library-visual-updates.sql
      - name: Read back and verify all changed rows
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_url,image_approved,image_quality_status FROM social_posts" > /tmp/full-library-visual-after.json
          node - <<'NODE'
          const fs=require('node:fs');
          const plan=JSON.parse(fs.readFileSync('/tmp/full-library-visual-plan.json','utf8'));
          const raw=JSON.parse(fs.readFileSync('/tmp/full-library-visual-after.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          const byId=new Map(rows.map(x=>[x.id,x]));
          for(const x of plan.applied){
            const r=byId.get(x.id);
            if(!r||r.status!=='draft'||String(r.image_url||'')!==''||Number(r.image_approved)!==0||r.image_quality_status!=='needs_regeneration')throw Error('D1 post mismatch '+x.id);
          }
          console.log('PASS: '+plan.applied.length+' unsafe images safely returned to draft; '+plan.skipped.length+' updated/unchanged records preserved; published and archived untouched.');
          NODE
      - name: Upload non-sensitive remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-library-post-image-remediation-20261010
          path: /tmp/full-library-visual-plan.json
          if-no-files-found: ignore
          retention-days: 7
