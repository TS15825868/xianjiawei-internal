name: 仙加味 n8n 三條唯讀監控正式排程

on:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/n8n-readonly-monitor-scheduler.yml'
      - 'n8n-runtime/smoke-readonly.js'
      - 'n8n-runtime/smoke-readonly.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-n8n-readonly-monitors
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: 喚醒並確認正式 n8n
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          echo 'Checking n8n readiness with limited cold-start probes.'
          # 2026-10-24: 14 attempts consumed ~7 minutes while Render was
          # returning 503 or timing out. A retry cannot repair Render OOM,
          # PostgreSQL stall or an exhausted build quota. Keep the failed
          # primary job visible while the independent fallback checks public
          # services in parallel; do not wake a stuck instance indefinitely.
          # Successful readiness still runs all three official GET monitors.
          for attempt in 1 2 3 4; do
            if curl -fsS --retry 0 --connect-timeout 7 --max-time 20 'https://xianjiawei-n8n-longterm.onrender.com/healthz/readiness' -o /tmp/n8n-health.json; then
              if node -e "if(JSON.parse(require('fs').readFileSync('/tmp/n8n-health.json','utf8')).status!=='ok')process.exit(1)"; then ready=true; break; fi
            fi
            echo "n8n not ready on attempt $attempt/4; using independent fallback coverage."
            if [ "$attempt" -lt 4 ]; then sleep 5; fi
          done
          if [ "$ready" != true ]; then
            echo 'n8n readiness unavailable; no monitor webhooks were invoked.'
            exit 1
          fi
      - name: 觸發三條正式唯讀監控
        shell: bash
        run: |
          set -euo pipefail
          # These workflows only inspect service/product state. The publisher is excluded.
          for route in xjw-line-health-a7f8c2 xjw-ai-geo-9c3f75 xjw-system-health-d4b6e1; do
            echo "Checking read-only monitor: $route"
            curl -fsS --retry 2 --retry-all-errors --retry-delay 10 --retry-max-time 100 --connect-timeout 15 --max-time 60 "https://xianjiawei-n8n-longterm.onrender.com/webhook/$route" -o /tmp/n8n-trigger.json
            node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/n8n-trigger.json','utf8'));if(x.ok!==true)throw Error('n8n monitor did not return a completed successful result')"
            echo "PASS completed read-only monitor: $route"
          done
          echo 'All three read-only monitors completed successfully; publication workflow remains excluded.'

  # Independent public GET backup starts in PARALLEL with the n8n wakeup,
  # so the site's safety coverage is not delayed by Render's cold start / OOM.
  # A successful backup never hides monitor's separate failed job status.
  # Public repo standard GitHub-hosted runners carry no additional minute charge.
  fallback-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Execute independent GET-only public health fallback
        run: |
          set -euo pipefail
          node n8n-runtime/smoke-readonly.js
          {
            echo '### 唯讀備援檢查完成'
            echo '直接檢查 LINE OA、官網產品母資料與 AI/GEO，並驗證 Supabase/Cloudflare Meta 收件服務拒絕未授權 GET。'
            echo '此結果僅為唯讀安全驗收，不代表 n8n、Meta 實際收件或自動回覆已可用；沒有呼叫發布。'
          } >> "$GITHUB_STEP_SUMMARY"
