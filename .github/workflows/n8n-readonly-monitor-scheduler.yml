name: 仙加味 n8n 三條唯讀監控正式排程

on:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/n8n-readonly-monitor-scheduler.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-n8n-readonly-monitors
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 喚醒並確認正式 n8n
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in 1 2 3 4 5; do
            if curl -fsS --connect-timeout 15 --max-time 40 'https://xianjiawei-n8n-longterm.onrender.com/healthz' -o /tmp/n8n-health.json; then
              if node -e "if(JSON.parse(require('fs').readFileSync('/tmp/n8n-health.json','utf8')).status!=='ok')process.exit(1)"; then ready=true; break; fi
            fi
            sleep 5
          done
          test "$ready" = true
      - name: 觸發三條正式唯讀監控
        shell: bash
        run: |
          set -euo pipefail
          # These workflows only inspect service/product state. The publisher is excluded.
          for route in xjw-line-health-a7f8c2 xjw-ai-geo-9c3f75 xjw-system-health-d4b6e1; do
            curl -fsS --connect-timeout 15 --max-time 60 "https://xianjiawei-n8n-longterm.onrender.com/webhook/$route" -o /tmp/n8n-trigger.json
            node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/n8n-trigger.json','utf8'));if(x.message!=='Workflow was started'&&x.ok!==true)throw Error('n8n trigger was not accepted')"
            echo "Accepted read-only monitor: $route"
          done
          echo 'Triggers accepted; final execution results are recorded in n8n, not inferred from HTTP acceptance.'
