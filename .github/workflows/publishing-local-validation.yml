name: 仙加味貼文中心系統 App 驗證（不代表已部署）

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'data/**'
      - 'publishing.html'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'tools/**'
      - 'guard-mode.json'
      - '.github/workflows/publishing-local-validation.yml'
      - '.github/workflows/deploy-cloudflare-publishing.yml'
      - '.github/workflows/seed-guilu-review-queue.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-publishing-local-validation
  cancel-in-progress: true

jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      XJW_CONTENT_SEED_CREATED_BY: tung314069@gmail.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies without deployment
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify maintenance guard mode
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const mode=JSON.parse(fs.readFileSync('guard-mode.json','utf8'));
          if(mode.mode!=='paused_for_full_system_update') throw new Error('unexpected guard mode');
          if(mode.blocking_content_and_media_guards!==false) throw new Error('blocking guards must remain paused during update');
          if(mode.keep_minimum_safety!==true) throw new Error('minimum safety must stay enabled');
          console.log('PASS: maintenance mode is nonblocking with minimum safety enabled.');
          NODE
      - name: Run current code checks
        run: npm run check
      - name: Run current full guard contract
        run: npm run guard:full
      - name: Build standalone publishing center app
        run: npm run build:static
      - name: Verify current outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/publishing.html
          test -f dist/manifest.webmanifest
          test -f dist/assets/css/publishing-base.css
          test -f dist/assets/css/publishing-app.css
          test -f dist/assets/css/publishing-performance.css
          test -f dist/assets/css/publishing-readiness.css
          test -f dist/assets/js/publishing-app-v2.js
          test -f dist/assets/js/publishing-resilience.js
          test -f dist/assets/js/publishing-review-gate.js
          test -f dist/assets/js/publishing-content-guidance-v20260814.js
          test -f dist/assets/data/guilu-content-topic-bank-v20260814.json
          test -f dist/assets/js/formal-media-policy-v20260810.js
          test -f dist/assets/js/zip-media-assistant.js
          test -f dist/data/latest-user-post-zip.json
          grep -q '貼文中心系統 App' dist/publishing.html
          grep -q "location.replace('/publishing.html')" dist/index.html
          test ! -e dist/assets/js/internal-app.js
          test ! -e dist/assets/js/erp-publishing-separation.js
          echo 'PASS: standalone posting center app outputs exist and retired ERP frontend is absent.'
      - name: Validate safe idempotent review seed against current bank count
        shell: bash
        run: |
          set -euo pipefail
          XJW_CONTENT_SEED_CREATED_BY="$XJW_CONTENT_SEED_CREATED_BY" node tools/build-guilu-review-seed.mjs > /tmp/guilu-review-seed.sql
          actual="$(grep -c '^INSERT INTO social_posts(' /tmp/guilu-review-seed.sql)"
          upserts="$(grep -c '^  ON CONFLICT(id) DO UPDATE SET' /tmp/guilu-review-seed.sql)"
          expected="$(node - <<'NODE'
          const fs=require('fs');
          const bank=JSON.parse(fs.readFileSync('assets/data/guilu-content-topic-bank-v20260814.json','utf8'));
          process.stdout.write(String((bank.topics||[]).filter(x=>x&&x.seedToReview===true).length));
          NODE
          )"
          test "$expected" -gt 0
          test "$actual" -eq "$expected"
          test "$upserts" -eq "$expected"
          grep -Fq "WHERE social_posts.status IN ('draft','pending_review')" /tmp/guilu-review-seed.sql
          if grep -Fq 'INSERT OR IGNORE INTO social_posts' /tmp/guilu-review-seed.sql; then exit 1; fi
          echo "PASS: current ${expected} image-ready topics produce safe idempotent pending-review upserts."
      - name: Confirm this run did not deploy
        run: |
          {
            echo '## 貼文中心系統 App 程式驗證完成'
            echo ''
            echo '- ✅ 只部署貼文中心前端資產'
            echo '- ✅ 根網址直接進貼文中心'
            echo '- ✅ draft → pending_review → 16項人工審核 → approved → 排程／立即發布'
            echo '- ✅ iOS Safari 恢復與離線快取能力'
            echo '- ✅ 其他 ERP UI/API 不進正式 App'
            echo '- ⏸ 本 workflow 不部署 Cloudflare Worker'
          } >> "$GITHUB_STEP_SUMMARY"
