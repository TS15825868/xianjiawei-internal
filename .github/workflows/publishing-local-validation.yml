name: 仙加味 ERP＋貼文中心正式程式手動驗收

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-internal-manual-validation
  cancel-in-progress: true

jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies without deployment
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify maintenance guard mode
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const mode=JSON.parse(fs.readFileSync('guard-mode.json','utf8'));
          if(mode.mode!=='paused_for_full_system_update') throw new Error('unexpected guard mode');
          if(mode.blocking_content_and_media_guards!==false) throw new Error('blocking guards must remain paused during update');
          if(mode.keep_minimum_safety!==true) throw new Error('minimum safety must stay enabled');
          console.log('PASS maintenance guard mode');
          NODE
      - name: Run current code and authority checks
        run: |
          npm run check
          npm run guard:full
          npm run build:static
      - name: Verify full ERP plus one publishing center output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/erp.html
          test -f dist/publishing.html
          test -f dist/manifest.webmanifest
          test -f dist/assets/css/internal-app.css
          test -f dist/assets/js/internal-app.js
          test -f dist/assets/js/erp-publishing-separation.js
          test -f dist/assets/js/publishing-app-v2.js
          test -f dist/assets/js/publishing-review-gate.js
          test -f dist/assets/js/device-image-upload.js
          test -f dist/assets/js/formal-media-policy-v20260810.js
          grep -q "location.replace('/erp.html')" dist/index.html
          grep -q '仙加味營運中控' dist/erp.html
          grep -q '貼文中心系統 App' dist/publishing.html
          grep -Eq '"main"[[:space:]]*:[[:space:]]*"src/full-system-entry.js"' wrangler.jsonc
          grep -q 'erpUiEnabled:true' src/full-system-entry.js
          grep -q 'erpApisEnabled:true' src/full-system-entry.js
          grep -q 'publishingCenterIndependent:true' src/full-system-entry.js
          echo 'PASS full ERP is retained and exactly one publishing center remains.'
