name: Sync Current User ZIP 3 Media

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/userzip3-internal-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update current ZIP media references without changing review policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/latest-user-post-zip.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          scene_ids = {
            'warm-rhythm','storage','warm-water','work-break','rainy-warm',
            'hot-weather-hydration','daily-hydration','self-care-family',
            'hot-weather-hydration-2','temperature-coat','choose-by-routine',
            'rainy-home','work-break-2','self-care-family-2','temperature-coat-2'
          }
          base = 'https://ts15825868.github.io/xianjiawei/images/post-library/userzip3-v20260811/'
          updated = []

          def walk(node):
            if isinstance(node, dict):
              sid = node.get('scene_id')
              if sid in scene_ids:
                url = base + sid + '.webp'
                node['online_src'] = url
                if 'source_url' in node:
                  node['source_url'] = url
                if 'public_url' in node:
                  node['public_url'] = url
                if 'availability' in node:
                  node['availability'] = 'online'
                if 'binary_sync_status' in node:
                  node['binary_sync_status'] = 'online'
                if 'needs_binary_sync' in node:
                  node['needs_binary_sync'] = False
                updated.append(sid)
              for value in node.values():
                walk(value)
            elif isinstance(node, list):
              for value in node:
                walk(value)

          walk(data)
          missing = scene_ids - set(updated)
          if missing:
            raise SystemExit(f'missing expected scene ids: {sorted(missing)}')
          if isinstance(data, dict):
            data['updated_at'] = '2026-08-11T14:35:00+08:00'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'updated {len(set(updated))} lifestyle scenes')
          PY
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/userzip3-internal-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'media: connect current ZIP lifestyle scenes to publishing center'
          git push
