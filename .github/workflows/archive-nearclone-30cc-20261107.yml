name: 仙加味30cc圖片近似重複精準封存（不發文）
on:
  push:
    branches: [main]
    paths: ['ops/request-archive-nearclone-30cc-20261107.json']
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node ops/archive-nearclone-30cc-20261107.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nearclone-30cc-${{ github.run_id }}
          path: nearclone-30cc-result.json
          retention-days: 7
