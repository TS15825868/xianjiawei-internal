name: 仙加味草稿錯圖解除綁定

on:
  push:
    branches: [main]
    paths:
      - 'assets/data/clear-held-bad-media-v20260817.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clear-held-media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare D1 credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install D1 tooling
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Remove rejected image bindings only
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/clear-held-media.sql <<'SQL'
          UPDATE social_posts
          SET image_url='',
              image_alt='',
              image_source='待重新製作｜ChatGPT預覽＋老闆確認後回填',
              image_approved=0,
              approved_by=NULL,
              approved_at=NULL,
              scheduled_at=NULL,
              review_note='原配圖已解除綁定；新文案與新圖先在 ChatGPT 給老闆確認，確認後才回填貼文中心。',
              rejection_reason='原圖已確認不適合正式發布；等待老闆確認的新正式圖。',
              updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now')
          WHERE status='draft' AND image_quality_status='low';

          UPDATE social_posts
          SET image_url='',
              image_alt='',
              image_source='待重新配圖｜ChatGPT預覽＋老闆確認後回填',
              image_quality_status='unknown',
              image_approved=0,
              approved_by=NULL,
              approved_at=NULL,
              scheduled_at=NULL,
              review_note='原圖本身正常但與目前文案主題不一致，已解除綁定；新圖先在 ChatGPT 給老闆確認。',
              rejection_reason='目前文案與六項產品總覽圖不吻合；等待新配圖。',
              updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now')
          WHERE id='XJW-SOCIAL-20260815-01-six-products-overview' AND status='draft';
          SQL
          npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/clear-held-media.sql
      - name: Verify clean posting-center state
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_url,image_quality_status,image_source FROM social_posts WHERE status<>'archived' ORDER BY id" > /tmp/live.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/live.json','utf8'));
          const rows=raw.flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          const ready=rows.filter(x=>['pending_review','approved','scheduled'].includes(String(x.status)));
          const drafts=rows.filter(x=>x.status==='draft');
          const published=rows.filter(x=>x.status==='published');
          const readyMissing=ready.filter(x=>!String(x.image_url||'').trim());
          if(readyMissing.length) throw new Error(`可審核流程有 ${readyMissing.length} 篇缺圖`);
          const readyDup=new Set(),seen=new Set();
          for(const x of ready){const k=String(x.image_url||'').split('?')[0].toLowerCase();if(seen.has(k))readyDup.add(k);seen.add(k)}
          if(readyDup.size) throw new Error(`可審核流程仍有重複圖片 ${readyDup.size} 組`);
          const badPath=rows.filter(x=>/\/images\/posts\/(?:remainder66-v20260817|priority10-v20260817|current-v20260815)\/|\/images\/publishing\/generated-v20260815\//i.test(String(x.image_url||'')));
          if(badPath.length) throw new Error(`資料庫仍綁定 ${badPath.length} 張已拒絕生成圖`);
          const waiting=drafts.filter(x=>!String(x.image_url||'').trim());
          console.log(`PASS: live=${rows.length}; published=${published.length}; ready-with-normal-image=${ready.length}; draft-waiting-new-image=${waiting.length}; rejected-generated-image-bindings=0; ready-duplicate-images=0`);
          NODE
