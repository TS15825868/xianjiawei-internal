name: XJW one-time verify 10 official product scenes and 1 cooking false-pass
on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-product-photo-pixels-20261031.yml']
permissions:
  contents: read
concurrency:
  group: xjw-d1-ai-review-evidence-not-approval
  cancel-in-progress: false
jobs:
  product-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Read live D1 posts, all original review evidence and external locks
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts WHERE id IN ('XJW-CONV-chat-30-bare-jar','XJW-CONV-chat-30-vs-180','XJW-CONV-chat-gao-vs-drink','XJW-CONV-chat-glass-vs-pouch-storage','XJW-CONV-chat-luerong-intro','XJW-CONV-chat-photo-size','XJW-CONV-chat-picture-or-text','XJW-CONV-chat-trial-first','XJW-CONV-cny-gift-choice','XJW-0663bdeb-49aa-46bf-8a41-95a14486f425','XJW-CONV-chat-soup-day') ORDER BY id" > /tmp/photo-before.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_post_quality_reviews WHERE post_id IN ('XJW-CONV-chat-30-bare-jar','XJW-CONV-chat-30-vs-180','XJW-CONV-chat-gao-vs-drink','XJW-CONV-chat-glass-vs-pouch-storage','XJW-CONV-chat-luerong-intro','XJW-CONV-chat-photo-size','XJW-CONV-chat-picture-or-text','XJW-CONV-chat-trial-first','XJW-CONV-cny-gift-choice','XJW-0663bdeb-49aa-46bf-8a41-95a14486f425','XJW-CONV-chat-soup-day') ORDER BY reviewed_at DESC" > /tmp/photo-reviews-before.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT post_id,state,metricool_id FROM social_metricool_sync WHERE post_id IN (SELECT id FROM social_posts WHERE status='pending_review')" > /tmp/photo-links.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_publish_deliveries WHERE post_id IN (SELECT id FROM social_posts WHERE status='pending_review')" > /tmp/photo-deliveries.json
      - name: Validate original photo PNG SHA, original scene JPEG SHA and exact D1 text versions
        run: node tools/verify-product-photo-pixels-20261031.mjs prepare
      - name: Apply evidence-linked image quality reclassification, no AI approval
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/photo-ai-proof.sql
      - name: Verify all 11 D1 rows, 11 evidence records, and 11 audit entries
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts WHERE id IN ('XJW-CONV-chat-30-bare-jar','XJW-CONV-chat-30-vs-180','XJW-CONV-chat-gao-vs-drink','XJW-CONV-chat-glass-vs-pouch-storage','XJW-CONV-chat-luerong-intro','XJW-CONV-chat-photo-size','XJW-CONV-chat-picture-or-text','XJW-CONV-chat-trial-first','XJW-CONV-cny-gift-choice','XJW-0663bdeb-49aa-46bf-8a41-95a14486f425','XJW-CONV-chat-soup-day') ORDER BY id" > /tmp/photo-after.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_post_quality_reviews WHERE id LIKE 'AI-PIXEL-PRECHECK-20261031-%' ORDER BY post_id" > /tmp/photo-reviews-after.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM audit_logs WHERE action='正式商品原圖與料理安全16項證據補正' ORDER BY entity_id" > /tmp/photo-audits-after.json
          node tools/verify-product-photo-pixels-20261031.mjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xjw-10-product-photo-original-pixel-evidence-${{ github.run_id }}
          path: |
            /tmp/photo-before.json
            /tmp/photo-after.json
            /tmp/photo-ai-proof.json
            /tmp/photo-reviews-after.json
            /tmp/photo-audits-after.json
          retention-days: 3

