name: 仙加味 ERP 最新湯塊與龜鹿膠規格同步部署
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-sync-block-specs-and-deploy-v20260815.yml'
permissions:
  contents: write
concurrency:
  group: xianjiawei-erp-production
  cancel-in-progress: true
jobs:
  update-validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply latest product authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          TANG='75g （2兩）／盒｜8塊裝'
          JIAO='600g （1斤）／盒｜32塊裝'
          JIAO_DETAIL='每塊約18.75 g'
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          binary={'.png','.jpg','.jpeg','.webp','.avif','.gif','.ico','.zip','.pdf','.mp4','.mov','.woff','.woff2','.ttf','.otf'}
          for name in files:
              if name.startswith('.github/workflows/'): continue
              p=Path(name)
              if p.suffix.lower() in binary or not p.is_file(): continue
              try:s=p.read_text(encoding='utf-8')
              except Exception:continue
              old=s
              s=s.replace('75g／盒｜8塊裝',TANG)
              s=s.replace('600g（1斤）／盒｜32塊裝',JIAO)
              s=s.replace('每塊約18.75g',JIAO_DETAIL)
              if s!=old:p.write_text(s,encoding='utf-8')

          def patch(path,pairs):
              p=Path(path);s=p.read_text(encoding='utf-8');old=s
              for a,b in pairs:s=s.replace(a,b)
              if s!=old:p.write_text(s,encoding='utf-8')

          # Server authority：文字產品資訊可顯示每塊約重；圖片／DM仍不自加字。
          patch('src/product-authority.js',[
            ("detailUnitApprox:'每塊約9.375g'","detailUnitApprox:'每塊約9.375g'"),
            ("detailUnitApprox:'每塊約18.75 g'","detailUnitApprox:'每塊約18.75 g'"),
            ("    if(/每塊約?\\s*9\\.375\\s*g/i.test(segment))errors.push('龜鹿湯塊每塊約9.375g只屬產品詳細／內部資料，不放對外貼文、產品圖或DM主規格。');\n",''),
            ("    if(/每塊約?\\s*18\\.75\\s*g/i.test(segment))errors.push('龜鹿膠每塊約18.75 g只屬產品詳細／內部資料，不放對外貼文、產品圖或DM主規格。');\n",''),
            ("soupBlockDetail:'每塊約9.375g（僅產品詳細／內部資料）'","soupBlockDetail:'每塊約9.375g（顧客文字可顯示）'"),
            ("guiluJiaoDetail:'每塊約18.75 g（僅產品詳細／內部資料）'","guiluJiaoDetail:'每塊約18.75 g（顧客文字可顯示）'"),
            ("version:'current-server-product-authority-v3-20260815'","version:'current-server-product-authority-v4-20260815-2li-1jin'")
          ])
          # Client authority：同一規則，避免舊守門誤擋新 FAQ／產品文字。
          patch('assets/js/product-authority-guard.js',[
            ("detailUnitApprox:'每塊約9.375g（僅產品詳細／內部資料）'","detailUnitApprox:'每塊約9.375g（顧客文字可顯示）'"),
            ("detailUnitApprox:'每塊約18.75 g（僅產品詳細／內部資料）'","detailUnitApprox:'每塊約18.75 g（顧客文字可顯示）'"),
            ("      if(/每塊約?\\s*9\\.375\\s*g/i.test(segment))errors.push('龜鹿湯塊每塊約9.375g只留產品詳細／內部資料，不放對外貼文、產品圖或DM主規格。');\n",''),
            ("    for(const segment of productSegments(value,'龜鹿膠'))if(/每塊約?\\s*18\\.75\\s*g/i.test(segment))errors.push('龜鹿膠每塊約18.75 g只留產品詳細／內部資料，不放對外貼文、產品圖或DM主規格。');\n",''),
            ("version:'current-product-authority-20260814-v2'","version:'current-product-authority-20260815-v3-2li-1jin'"),
            ("龜鹿湯塊75g （2兩）／盒｜8塊裝；龜鹿膠600g （1斤）／盒｜32塊裝；鹿茸粉75g／罐。","龜鹿湯塊75g （2兩）／盒｜8塊裝，每塊約9.375g；龜鹿膠600g （1斤）／盒｜32塊裝，每塊約18.75 g；鹿茸粉75g／罐。")
          ])
          # Server tests：新規格為唯一主規格；每塊約重在顧客文字中合法。
          patch('src/product-authority.test.js',[
            ("{name:'龜鹿湯塊',specification:'75g （2兩）／盒｜8塊裝｜每塊約9.375g'},\n  {name:'龜鹿膠',specification:'600g （1斤）／盒｜32塊裝｜每塊約18.75 g'}","{name:'龜鹿湯塊',specification:'75g／盒｜8塊裝'},\n  {name:'龜鹿膠',specification:'600g（1斤）／盒｜32塊裝'},\n  {name:'龜鹿湯塊',specification:'75g （2兩）／盒｜8塊裝｜每塊約9.375g'},\n  {name:'龜鹿膠',specification:'600g （1斤）／盒｜32塊裝｜每塊約18.75 g'}"),
            ("assert.ok(validatePublicProductText('龜鹿湯塊75g （2兩）／盒｜8塊裝｜每塊約9.375g').length>0);","assert.deepEqual(validatePublicProductText('龜鹿湯塊75g （2兩）／盒｜8塊裝，每塊約9.375g'),[]);"),
            ("assert.ok(validatePublicProductText('龜鹿膠600g （1斤）／盒｜32塊裝｜每塊約18.75 g').length>0);","assert.deepEqual(validatePublicProductText('龜鹿膠600g （1斤）／盒｜32塊裝，每塊約18.75 g'),[]);")
          ])
          # Client validator：改驗最新版本與顧客文字可顯示約重。
          patch('tools/validate-client-product-authority.mjs',[
            ("current-product-authority-20260814-v2","current-product-authority-20260815-v3-2li-1jin"),
            ("must(source.includes('每塊約9.375g只留產品詳細／內部資料'),'湯塊每塊重量必須是detail-only');","must(source.includes('每塊約9.375g（顧客文字可顯示）'),'湯塊每塊約重應允許顧客文字顯示');"),
            ("must(source.includes('每塊約18.75 g只留產品詳細／內部資料'),'龜鹿膠每塊重量必須是detail-only');","must(source.includes('每塊約18.75 g（顧客文字可顯示）'),'龜鹿膠每塊約重應允許顧客文字顯示');")
          ])
          PY
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Assert exact latest product authority
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "allowedSpecs:['75g （2兩）／盒｜8塊裝']" src/product-authority.js
          grep -Fq "detailUnitApprox:'每塊約9.375g'" src/product-authority.js
          grep -Fq "allowedSpecs:['600g （1斤）／盒｜32塊裝']" src/product-authority.js
          grep -Fq "detailUnitApprox:'每塊約18.75 g'" src/product-authority.js
          grep -Fq "75g （2兩）／盒｜8塊裝" assets/js/product-authority-guard.js
          grep -Fq "600g （1斤）／盒｜32塊裝" assets/js/product-authority-guard.js
      - name: Validate ERP and publishing contracts
        run: |
          npm run check
          npm run guard:full
          npm run build:static
      - name: Verify Cloudflare credentials and remote D1
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT 1 AS ok"
      - name: Commit verified runtime changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          if ! git diff --cached --quiet; then
            git commit -m 'fix(erp): sync 2兩 soup block and 1斤 guilu jiao authority'
            git push origin HEAD:main
          fi
      - name: Deploy current full ERP Worker
        run: npx wrangler deploy --keep-vars
      - name: Verify private production route is reachable
        shell: bash
        run: |
          set -euo pipefail
          base='https://xianjiawei-internal.tung314069.workers.dev'
          code="$(curl -sS --max-time 20 -o /tmp/xjw-root -w '%{http_code}' "$base/" || true)"
          test "$code" != '000'
          test "$code" -lt 500
          echo "PASS: production route reachable with HTTP $code (Cloudflare Access may protect content)."
