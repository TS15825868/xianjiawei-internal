name: One-shot deploy Safari no-redirect-loop release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-deploy-no-redirect-loop-v20260815.yml'

permissions:
  contents: read

concurrency:
  group: xianjiawei-publishing-no-redirect-loop
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate Safari redirect-loop fix and full posting system
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run check
          npm run guard:full
          npm run build:static
          grep -Eq '"html_handling"[[:space:]]*:[[:space:]]*"none"' wrangler.jsonc
          grep -q 'rootServesPublishingDirectly:true' src/publishing-only-entry.js
          grep -q 'redirectLoopPrevention:true' src/publishing-only-entry.js
          ! grep -q "return redirect('/publishing.html')" src/publishing-only-entry.js
          test -f dist/publishing.html
      - name: Verify Remote D1 and posting data before deployment
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT 1 AS ok"
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT status, COUNT(*) AS count FROM social_posts GROUP BY status ORDER BY status"
      - name: Deploy direct no-redirect posting center Worker
        run: npx wrangler deploy --keep-vars
      - name: Verify private production boundary has no redirect storm
        shell: bash
        run: |
          set -euo pipefail
          base='https://xianjiawei-internal.tung314069.workers.dev'
          for path in '/' '/publishing' '/publishing/' '/publishing.html' '/healthz/core'; do
            result="$(curl -LsS --max-redirs 6 --max-time 25 -o /tmp/xjw-body -w '%{http_code} %{num_redirects} %{url_effective}' "$base$path")"
            code="${result%% *}"
            rest="${result#* }"
            redirects="${rest%% *}"
            echo "$path -> $result"
            test "$code" -ge 200
            test "$code" -lt 500
            test "$redirects" -le 6
            grep -Eiq '貼文中心系統 App|<html|<!doctype|cloudflare|access|sign in|login|publishing' /tmp/xjw-body
          done
