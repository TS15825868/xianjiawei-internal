name: 仙加味圖片說明抽屜動作精準修正與D1讀回
on:
  push:
    branches: [main]
    paths: ['ops/request-one-grounded-image-alt-20261109.json']
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Verify current-D1 CAS image-alt correction script
        run: node --check ops/repair-one-grounded-image-alt-20261109.mjs
      - name: Correct only verified drawer action image-alt and return DEFER evidence
        run: node ops/repair-one-grounded-image-alt-20261109.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grounded-image-alt-${{ github.run_id }}
          path: grounded-image-alt-readback.json
          retention-days: 7
