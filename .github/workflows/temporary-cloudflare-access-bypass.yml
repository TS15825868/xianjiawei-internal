name: 仙加味 Cloudflare Access 暫停／恢復控制

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '選擇 BYPASS 暫停驗證，或 RESTORE 恢復驗證'
        required: true
        default: 'RESTORE'
        type: choice
        options:
          - RESTORE
          - BYPASS

permissions:
  contents: read

env:
  TARGET_DOMAIN: xianjiawei-internal.tung314069.workers.dev
  TEMP_POLICY_NAME: TEMPORARY XJW BYPASS DURING SYSTEM COMPLETION
  MODE: ${{ inputs.mode }}

jobs:
  access-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          case "$MODE" in BYPASS|RESTORE) ;; *) echo "Invalid mode: $MODE" >&2; exit 1;; esac

      - name: Find Access application
        id: app
        shell: bash
        run: |
          set -euo pipefail
          resp="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps")"
          test "$(jq -r '.success' <<<"$resp")" = "true" || { jq . <<<"$resp"; exit 1; }
          app_id="$(jq -r --arg d "$TARGET_DOMAIN" '.result[] | select(.domain == $d) | .id' <<<"$resp" | head -n1)"
          test -n "$app_id" || { echo "Access app not found for $TARGET_DOMAIN" >&2; exit 1; }
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"

      - name: Enable temporary bypass
        if: env.MODE == 'BYPASS'
        shell: bash
        run: |
          set -euo pipefail
          app_id='${{ steps.app.outputs.app_id }}'
          policies="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps/$app_id/policies")"
          existing="$(jq -r --arg n "$TEMP_POLICY_NAME" '.result[] | select(.name == $n) | .id' <<<"$policies" | head -n1)"
          if [ -n "$existing" ]; then
            echo "Temporary bypass already active: $existing"
          else
            max_precedence="$(jq -r '[.result[].precedence // 0] | max // 0' <<<"$policies")"
            next_precedence="$((max_precedence + 1))"
            body="$(jq -nc --arg n "$TEMP_POLICY_NAME" --argjson p "$next_precedence" '{name:$n,decision:"bypass",precedence:$p,include:[{everyone:{}}]}')"
            resp="$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$body" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps/$app_id/policies")"
            test "$(jq -r '.success' <<<"$resp")" = "true" || { jq . <<<"$resp"; exit 1; }
            echo "Created temporary bypass policy: $(jq -r '.result.id' <<<"$resp")"
          fi

      - name: Verify bypass
        if: env.MODE == 'BYPASS'
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          url="https://$TARGET_DOMAIN/publishing.html"
          curl -sS -D /tmp/headers -o /tmp/body --max-time 25 "$url"
          if grep -qi '^location: .*cloudflareaccess\.com' /tmp/headers; then
            echo 'Still redirected to Cloudflare Access login' >&2
            exit 1
          fi
          grep -q '貼文中心' /tmp/body
          echo 'PASS Cloudflare Access bypass is active.'

      - name: Restore Access protection
        if: env.MODE == 'RESTORE'
        shell: bash
        run: |
          set -euo pipefail
          app_id='${{ steps.app.outputs.app_id }}'
          policies="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps/$app_id/policies")"
          mapfile -t ids < <(jq -r --arg n "$TEMP_POLICY_NAME" '.result[] | select(.name == $n) | .id' <<<"$policies")
          for id in "${ids[@]}"; do
            resp="$(curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps/$app_id/policies/$id")"
            test "$(jq -r '.success' <<<"$resp")" = "true" || { jq . <<<"$resp"; exit 1; }
            echo "Removed temporary bypass policy: $id"
          done
          echo 'Cloudflare Access outer protection restore request completed.'
