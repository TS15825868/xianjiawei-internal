name: 仙加味暫時關閉 Cloudflare Access 驗證

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-cloudflare-access-bypass.yml'

permissions:
  contents: read

env:
  TARGET_DOMAIN: xianjiawei-internal.tung314069.workers.dev
  TEMP_POLICY_NAME: TEMPORARY XJW BYPASS DURING SYSTEM COMPLETION
  MODE: BYPASS

jobs:
  access-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Find Access application
        id: app
        shell: bash
        run: |
          set -euo pipefail
          resp="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps")"
          ok="$(jq -r '.success' <<<"$resp")"
          test "$ok" = "true" || { jq . <<<"$resp"; exit 1; }
          app_id="$(jq -r --arg d "$TARGET_DOMAIN" '.result[] | select(.domain == $d) | .id' <<<"$resp" | head -n1)"
          test -n "$app_id" || { echo "Access app not found for $TARGET_DOMAIN" >&2; jq -r '.result[] | [.name,.domain,.id] | @tsv' <<<"$resp"; exit 1; }
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"
          echo "Found Access app for $TARGET_DOMAIN"

      - name: Enable temporary bypass
        if: env.MODE == 'BYPASS'
        shell: bash
        run: |
          set -euo pipefail
          app_id='${{ steps.app.outputs.app_id }}'
          policies="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps/$app_id/policies")"
          existing="$(jq -r --arg n "$TEMP_POLICY_NAME" '.result[] | select(.name == $n) | .id' <<<"$policies" | head -n1)"
          if [ -n "$existing" ]; then
            echo "Temporary bypass policy already exists: $existing"
          else
            body="$(jq -nc --arg n "$TEMP_POLICY_NAME" '{name:$n,decision:"bypass",precedence:1,include:[{everyone:{}}]}')"
            resp="$(curl -sS \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$body" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps/$app_id/policies")"
            ok="$(jq -r '.success' <<<"$resp")"
            test "$ok" = "true" || { jq . <<<"$resp"; exit 1; }
            echo "Created temporary bypass policy: $(jq -r '.result.id' <<<"$resp")"
          fi

      - name: Verify Access no longer redirects to login
        if: env.MODE == 'BYPASS'
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          url="https://$TARGET_DOMAIN/publishing.html"
          curl -sS -D /tmp/headers -o /tmp/body --max-time 25 "$url"
          if grep -qi '^location: .*cloudflareaccess\.com' /tmp/headers; then
            echo 'Still redirected to Cloudflare Access login' >&2
            cat /tmp/headers >&2
            exit 1
          fi
          grep -q '貼文中心' /tmp/body || { echo 'Publishing page did not load expected content' >&2; head -c 1200 /tmp/body >&2; exit 1; }
          echo 'PASS temporary Cloudflare Access bypass is active.'

      - name: Restore Access protection
        if: env.MODE == 'RESTORE'
        shell: bash
        run: |
          set -euo pipefail
          app_id='${{ steps.app.outputs.app_id }}'
          policies="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps/$app_id/policies")"
          mapfile -t ids < <(jq -r --arg n "$TEMP_POLICY_NAME" '.result[] | select(.name == $n) | .id' <<<"$policies")
          for id in "${ids[@]}"; do
            resp="$(curl -sS -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps/$app_id/policies/$id")"
            ok="$(jq -r '.success' <<<"$resp")"
            test "$ok" = "true" || { jq . <<<"$resp"; exit 1; }
            echo "Removed temporary bypass policy: $id"
          done
          echo 'Restore request completed.'
