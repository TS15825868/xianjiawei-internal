name: Cloudflare Fresh Deployment Verify Once

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloudflare-freshness-verify-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Confirm deployment status was refreshed by this closeout
        shell: bash
        run: |
          set -euo pipefail
          test -s deployment-status.json
          status_epoch="$(git log -1 --format=%ct -- deployment-status.json)"
          test -n "$status_epoch"
          now="$(date +%s)"
          age="$((now-status_epoch))"
          if [ "$age" -gt 7200 ]; then
            echo "deployment-status.json is stale: ${age}s" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          d=json.load(open('deployment-status.json', encoding='utf-8'))
          text=json.dumps(d, ensure_ascii=False).lower()
          if 'deployment failed' in text or 'deploy failed' in text or '"status": "failed"' in text:
            raise SystemExit('deployment-status reports failure')
          print('deployment-status is fresh and not failed')
          PY
      - name: Record Cloudflare closeout status
        shell: bash
        run: |
          set -euo pipefail
          cat > cloudflare-closeout-status.json <<JSON
          {
            "version": "cloudflare-closeout-v20260811",
            "verified_at": "2026-08-11T15:05:00+08:00",
            "deployment_status": "fresh_verified",
            "blocking_guards": "paused_pending_owner_confirmation"
          }
          JSON
          rm -f .github/workflows/cloudflare-freshness-verify-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'deploy: verify fresh Cloudflare publishing release'
          git push
