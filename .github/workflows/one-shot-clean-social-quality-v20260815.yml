      - name: Verify no duplicates or internal customer copy remain
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,headline,copy,status,image_url,image_alt FROM social_posts WHERE status<>'archived' ORDER BY id" >/tmp/current.json
          python - <<'PY'
          import json,re,unicodedata,difflib,sys
          raw=json.load(open('/tmp/current.json')); rows=[]
          for block in raw: rows.extend(block.get('results') or [])
          def norm(s):
              s=unicodedata.normalize('NFKC',str(s or '')).lower()
              s=re.sub(r'仙加味\s*[｜|]?\s*補養，是一種節奏。?','',s)
              return re.sub(r'[\s\W_]+','',s,flags=re.UNICODE)
          blocked=['待審核','人工審核','16項','核准','不自動排程','不自動發布','貼文中心','發布中心','ERP','products-v3','守門員','母庫','資料庫','D1','Worker','GitHub','Workflow','候選圖','回填','重新生成','ChatGPT','不重畫','圖片呈現時','版面效果','產品本體','正式原圖','正式產品原圖','正式比例','正式包裝','目前正式','最新確認','此類貼文需確認','debug','TODO','placeholder','假資料']
          bad=[]
          for r in rows:
              text=' '.join(str(r.get(k) or '') for k in ('title','headline','copy'))
              hits=[t for t in blocked if t.lower() in text.lower()]
              if hits: bad.append((r['id'],r['title'],hits))
          if bad:
              print('CUSTOMER COPY LEAKAGE',bad);sys.exit(1)
          title_seen={}; copy_seen={}; active=[r for r in rows if r.get('status')!='archived']
          duplicate=[]
          for r in active:
              tk=norm(r.get('title')); ck=norm(r.get('copy'))
              if tk and tk in title_seen: duplicate.append(('same-title',title_seen[tk]['id'],r['id'],r['title']))
              else: title_seen[tk]=r
              if ck and ck in copy_seen: duplicate.append(('same-copy',copy_seen[ck]['id'],r['id'],r['title']))
              else: copy_seen[ck]=r
          for i,a in enumerate(active):
              ac=norm(a.get('copy'))
              if len(ac)<40: continue
              for b in active[i+1:]:
                  bc=norm(b.get('copy'))
                  if len(bc)<40: continue
                  ratio=difflib.SequenceMatcher(None,ac,bc).ratio()
                  if ratio>=0.90: duplicate.append((f'near-{ratio:.3f}',a['id'],b['id'],a['title']+' <> '+b['title']))
          if duplicate:
              print('DUPLICATES',duplicate);sys.exit(1)
          print('PASS no public leakage and no duplicate/near-duplicate customer copy; active posts=',len(rows))
          PY
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT status,COUNT(*) AS count FROM social_posts WHERE status<>'archived' GROUP BY status ORDER BY status;"

