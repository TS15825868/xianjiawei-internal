name: 仙加味貼文ChatGPT生成目前權威修正V4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-regeneration-authority-v4-v20260815.yml'

permissions:
  contents: write

concurrency:
  group: xianjiawei-regeneration-authority-v4-20260815
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Patch current prompt cache and permanent validator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          NL=chr(10)
          policy=Path('assets/js/post-regenerate-policy-v1.js')
          s=policy.read_text(encoding='utf-8')
          s=s.replace('2026-08-14-current-media-role-generation-policy-v5','2026-08-15-current-authority-generation-policy-v6')
          updates=[
            ('4. 龜鹿湯塊：75g （2兩）／盒｜8塊裝；每塊約9.375g只屬產品詳細／內部資料，不放貼文、產品圖或DM主規格。','4. 龜鹿湯塊：75g （2兩）／盒｜8塊裝；顧客文案／FAQ／產品文字可在需要時補充每塊約9.375g；產品主圖與DM主規格維持正式原圖與主規格，不自行加字。'),
            ('5. 龜鹿膠：600g （1斤）／盒｜32塊裝；每塊約18.75 g只屬產品詳細／內部資料，不放貼文、產品圖或DM主規格。','5. 龜鹿膠：600g （1斤）／盒｜32塊裝；顧客文案／FAQ／產品文字可在需要時補充每塊約18.75g；產品主圖與DM主規格維持正式原圖與主規格，不自行加字。'),
            ('- 龜鹿膏目前使用方式為「每日早上及下午各一小匙」，不得回退一天一次／早晚用法。','- 龜鹿膏食用時間可依個人使用習慣與作息時間安排；初次可先從半匙開始。不得設定固定早上／下午、一天一次或早晚固定時段。\\n- 龜鹿飲30cc目前使用方式為每日 1-2罐；飲用時間可依個人使用習慣與作息時間安排。\\n- 龜鹿飲180cc目前使用方式為每日一包；飲用時間可依個人使用習慣與作息時間安排。')
          ]
          for old,new in updates:
            if old in s:s=s.replace(old,new)
            elif new not in s:raise SystemExit('policy patch marker missing: '+old[:20])
          for need in ['2026-08-15-current-authority-generation-policy-v6','每日 1-2罐','龜鹿飲180cc目前使用方式為每日一包','顧客文案／FAQ／產品文字可在需要時補充每塊約9.375g','顧客文案／FAQ／產品文字可在需要時補充每塊約18.75g']:
            if need not in s:raise SystemExit('policy current rule missing: '+need)
          if '每日早上及下午各一小匙' in s:raise SystemExit('policy still has retired gao timing')
          policy.write_text(s,encoding='utf-8')

          html=Path('publishing.html')
          h=html.read_text(encoding='utf-8')
          h=h.replace('review-flow-20260814-v4','review-flow-20260815-v5-current-regeneration')
          h=h.replace('post-regenerate-buttons.js?v=20260812-formal-image-fix-v3','post-regenerate-buttons.js?v=20260815-regeneration-policy-v6')
          h=h.replace('post-regenerate-policy-v1.js?v=20260812-formal-image-fix-v3','post-regenerate-policy-v1.js?v=20260815-regeneration-policy-v6')
          old='已有符合文案的正式圖片優先沿用；沒有合格來源才重新生成。開始重新生成會先撤銷舊核准與排程，生成完成後回填或上傳並回到待審核，不會自動核准、排程或發布。'
          new='已有符合文案的正式圖片優先沿用；沒有合格來源才重新生成。缺圖草稿會顯示「缺圖｜ChatGPT生成」；已有圖片但不符合則顯示「圖不符合｜ChatGPT重生成」。開始重新生成會先撤銷舊核准與排程，生成完成後回填或上傳並回到待審核，不會自動核准、排程或發布。'
          if old in h:h=h.replace(old,new)
          elif new not in h:raise SystemExit('publishing regeneration note marker missing')
          if '20260815-regeneration-policy-v6' not in h or '缺圖｜ChatGPT生成' not in h or '生成完成後回填或上傳並回到待審核' not in h:raise SystemExit('publishing generation contract missing')
          html.write_text(h,encoding='utf-8')

          validator=Path('tools/validate-publishing-review-gate.mjs')
          v=validator.read_text(encoding='utf-8')
          anchor="must(!generation.includes('/publish-now'),'重新生成流程不得自行觸發正式發布');"
          checks=[
            "must(!generation.includes('每日早上及下午各一小匙'),'ChatGPT生成規則不得回退龜鹿膏固定早上／下午時段');",
            "must(generation.includes('食用時間可依個人使用習慣與作息時間安排'),'ChatGPT生成規則缺少龜鹿膏目前個人作息原則');",
            "must(generation.includes('每日 1-2罐'),'ChatGPT生成規則缺少30cc目前每日 1-2罐');",
            "must(generation.includes('龜鹿飲180cc目前使用方式為每日一包'),'ChatGPT生成規則缺少180cc目前每日一包');",
            "must(generation.includes('顧客文案／FAQ／產品文字可在需要時補充每塊約9.375g'),'ChatGPT生成規則沒有允許湯塊目前完整顧客文字規格');",
            "must(generation.includes('顧客文案／FAQ／產品文字可在需要時補充每塊約18.75g'),'ChatGPT生成規則沒有允許龜鹿膠目前完整顧客文字規格');"
          ]
          if checks[0] not in v:
            if anchor not in v:raise SystemExit('validator generation anchor missing')
            v=v.replace(anchor,anchor+NL+NL.join(checks))
          button_anchor="must(generationButtons.includes(\"data-xjw-regenerate\")||generationButtons.includes('dataset.xjwRegenerate'),'純按鈕層沒有建立重生成操作入口');"
          button_checks=["must(generationButtons.includes('缺圖｜ChatGPT生成'),'缺圖草稿沒有清楚的ChatGPT生成按鈕');","must(generationButtons.includes('missingImage(card)'),'缺圖按鈕沒有依圖片存在狀態判斷');"]
          if button_checks[0] not in v:
            if button_anchor not in v:raise SystemExit('validator button anchor missing')
            v=v.replace(button_anchor,button_anchor+NL+NL.join(button_checks))
          html_anchor="must(/post-regenerate-policy-v1\\.js\\?v=[^\"']+/.test(html),'貼文中心重生成流程缺少正式快取版本識別');"
          html_check="must(html.includes('20260815-regeneration-policy-v6'),'貼文中心仍載入舊ChatGPT生成快取版本');"
          if html_check not in v:
            if html_anchor not in v:raise SystemExit('validator html anchor missing')
            v=v.replace(html_anchor,html_anchor+NL+html_check)
          validator.write_text(v,encoding='utf-8')
          print('PASS: current regeneration prompt/cache/validator patched.')
          PY

      - name: Validate full publishing runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run check
          npm run guard:full
          npm run build:static
          node -e "const fs=require('fs');const p=fs.readFileSync('assets/js/post-regenerate-policy-v1.js','utf8'),b=fs.readFileSync('assets/js/post-regenerate-buttons.js','utf8'),h=fs.readFileSync('publishing.html','utf8');if(p.includes('每日早上及下午各一小匙')||!p.includes('每日 1-2罐')||!p.includes('每塊約18.75g')||!b.includes('缺圖｜ChatGPT生成')||!b.includes('missingImage(card)')||!h.includes('20260815-regeneration-policy-v6')||!h.includes('生成完成後回填或上傳並回到待審核'))throw Error('regeneration current authority verification failed');console.log('PASS: generation prompt, missing-image button, review return and cache are current.');"
          git diff --check

      - name: Commit repair and remove one-shot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/post-regenerate-policy-v1.js assets/js/post-regenerate-buttons.js publishing.html tools/validate-publishing-review-gate.mjs
          git rm .github/workflows/one-shot-fix-regeneration-authority-v4-v20260815.yml
          git diff --cached --check
          git commit -m 'fix(publishing): use current authority in ChatGPT generation flow'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Deploy current Worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --keep-vars

      - name: Verify production routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://xianjiawei-internal.tung314069.workers.dev'
          for path in '/healthz/core' '/publishing.html'; do
            code="$(curl -sS --max-time 25 -o /tmp/xjw-live -w '%{http_code}' "$base$path" || true)"
            test "$code" != '000'
            test "$code" -lt 500
            echo "PASS: $path reachable HTTP $code (Cloudflare Access may protect private content)."
          done
