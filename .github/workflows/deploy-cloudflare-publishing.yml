name: 仙加味貼文中心系統 App 正式部署

on:
  push:
    branches: [main]
    paths:
      - 'publishing.html'
      - 'assets/css/publishing-base.css'
      - 'assets/css/publishing-app.css'
      - 'assets/js/publishing-readiness-ui.js'
      - 'assets/js/publishing-content-guidance-v20260814.js'
      - 'src/publishing-content-audit-entry.js'
      - 'src/publishing-only-entry.js'
      - 'src/production-entry.js'
      - 'src/publishing-review-gate-entry.js'
      - 'assets/js/publishing-review-gate.js'
      - 'assets/js/publishing-app-v2.js'
      - 'assets/data/social-image-audit-v20260815.json'
      - 'tools/validate-publishing-app-contract.mjs'
      - 'tools/validate-publishing-review-gate.mjs'
      - 'tools/validate-system-readiness.mjs'
      - 'tools/validate-single-publishing-system.mjs'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare-publishing.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xianjiawei-publishing-center-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare production credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify maintenance guard mode
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const mode=JSON.parse(fs.readFileSync('guard-mode.json','utf8'));
          if(mode.mode!=='paused_for_full_system_update') throw new Error('unexpected guard mode');
          if(mode.blocking_content_and_media_guards!==false) throw new Error('blocking guards must remain paused during update');
          if(mode.keep_minimum_safety!==true) throw new Error('minimum safety must stay enabled');
          NODE
      - name: Run posting center checks and guards
        run: |
          npm run check
          npm run guard:full
      - name: Build standalone posting center app
        run: npm run build:static
      - name: Verify posting center production output and Access runtime config
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/publishing.html
          test -f dist/manifest.webmanifest
          test -f dist/assets/css/publishing-base.css
          test -f dist/assets/css/publishing-app.css
          test -f dist/assets/css/publishing-performance.css
          test -f dist/assets/css/publishing-readiness.css
          test -f dist/assets/js/publishing-app-v2.js
          test -f dist/assets/js/publishing-resilience.js
          test -f dist/assets/js/publishing-review-gate.js
          test -f dist/assets/js/post-bank-sync.js
          test -f dist/assets/js/formal-media-policy-v20260810.js
          test -f dist/assets/js/zip-media-assistant.js
          test -f dist/assets/js/publishing-content-guidance-v20260814.js
          test -f dist/assets/data/guilu-content-topic-bank-v20260814.json
          test -f dist/assets/data/social-image-audit-v20260815.json
          test -f dist/data/latest-user-post-zip.json
          test -f src/publishing-content-audit-entry.js
          grep -q '貼文中心系統 App' dist/publishing.html
          ! grep -q 'body:before' dist/publishing.html
          grep -q "location.replace('/publishing.html')" dist/index.html
          grep -Eq '"main"[[:space:]]*:[[:space:]]*"src/publishing-content-audit-entry.js"' wrangler.jsonc
          grep -Eq '"html_handling"[[:space:]]*:[[:space:]]*"none"' wrangler.jsonc
          grep -q '"POLICY_AUD": "201dea08ea9611989cd8ad4ccac88f99974fd9b1309e4af74bf11a397ee6522f"' wrangler.jsonc
          grep -q '"TEAM_DOMAIN": "https://tung314069.cloudflareaccess.com"' wrangler.jsonc
          grep -q 'duplicateImageHardGate:true' src/publishing-content-audit-entry.js
          grep -q 'seasonWeatherContextAudit:true' src/publishing-content-audit-entry.js
          grep -q 'semanticImageMatchHardGate:true' src/publishing-content-audit-entry.js
          grep -q 'fullLibraryAudit:true' src/publishing-content-audit-entry.js
          grep -q 'strictUniqueImagePerPost:true' src/publishing-content-audit-entry.js
          grep -q 'rootServesPublishingDirectly:true' src/publishing-only-entry.js
          grep -q 'redirectLoopPrevention:true' src/publishing-only-entry.js
          ! grep -q "return redirect('/publishing.html')" src/publishing-only-entry.js
          test ! -e dist/assets/js/internal-app.js
          test ! -e dist/assets/js/erp-publishing-separation.js
          echo 'PASS: production bundle contains posting-center frontend plus full-library duplicate-image/copy, season, weather and semantic audit, Access JWT config, and no Worker/HTML canonical redirect loop.'
      - name: Cross-check current Cloudflare Access application
        shell: bash
        run: |
          set -euo pipefail
          domain='xianjiawei-internal.tung314069.workers.dev'
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps?domain=$domain&exact=true&per_page=50" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' > /tmp/access-apps.json
          node - <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/access-apps.json','utf8'));
          if(body.success!==true) throw new Error('Cloudflare Access API failed: '+JSON.stringify(body.errors||[]));
          const domain='xianjiawei-internal.tung314069.workers.dev';
          const apps=(body.result||[]).filter(x=>String(x.domain||'').replace(/^https?:\/\//,'').replace(/\/$/,'')===domain);
          if(apps.length!==1) throw new Error(`Expected exactly one Access app for ${domain}, got ${apps.length}`);
          if(apps[0].aud!=='201dea08ea9611989cd8ad4ccac88f99974fd9b1309e4af74bf11a397ee6522f') throw new Error('Access AUD does not match wrangler POLICY_AUD');
          console.log('PASS: Cloudflare Access app domain/AUD match the Worker JWT verification configuration.');
          NODE
      - name: Verify remote D1 before deploy
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT 1 AS ok"
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT status, COUNT(*) AS count FROM social_posts GROUP BY status ORDER BY status"
      - name: Deploy posting center Worker
        run: npx wrangler deploy --keep-vars
      - name: Verify deployed Worker routes and reject redirect storms
        shell: bash
        run: |
          set -euo pipefail
          base='https://xianjiawei-internal.tung314069.workers.dev'
          direct_content=0
          access_boundary=0
          for path in '/' '/publishing' '/publishing/' '/publishing.html' '/healthz/core'; do
            body="$(mktemp)"
            result="$(curl -LsS --max-redirs 6 --max-time 25 -o "$body" -w '%{http_code} %{num_redirects} %{url_effective}' "$base$path")"
            code="${result%% *}"
            rest="${result#* }"
            redirects="${rest%% *}"
            echo "$path -> $result"
            test "$code" -ge 200 || { echo "$path returned invalid HTTP status $code" >&2; exit 1; }
            test "$code" -lt 500 || { echo "$path returned server error $code" >&2; exit 1; }
            test "$redirects" -le 1 || { echo "$path has a redirect storm ($redirects redirects)" >&2; exit 1; }
            if grep -Eq '貼文中心系統 App|唯一正式內容系統' "$body"; then
              direct_content=$((direct_content+1))
            elif grep -Eiq '<html|<!doctype|cloudflare|access|sign in|login' "$body"; then
              access_boundary=$((access_boundary+1))
            else
              echo "$path returned unexpected content" >&2
              exit 1
            fi
          done
          if [ "$direct_content" -gt 0 ]; then
            echo 'XJW_DEPLOY_STATUS=verified_live' >> "$GITHUB_ENV"
            echo 'XJW_LIVE_VERIFY_MODE=direct_content_verified_no_redirect_storm' >> "$GITHUB_ENV"
          else
            test "$access_boundary" -eq 5 || { echo 'Not all protected routes reached Cloudflare Access boundary.' >&2; exit 1; }
            echo 'XJW_DEPLOY_STATUS=deployed_access_protected' >> "$GITHUB_ENV"
            echo 'XJW_LIVE_VERIFY_MODE=cloudflare_access_boundary_verified_no_redirect_storm' >> "$GITHUB_ENV"
          fi
      - name: Record verified production deployment
        shell: bash
        run: |
          cat > deployment-status.json <<EOF
          {
            "status": "${XJW_DEPLOY_STATUS}",
            "source_commit": "${GITHUB_SHA}",
            "runtime": "cloudflare-worker-publishing-center-app",
            "entry": "src/publishing-content-audit-entry.js",
            "canonical_routes": ["/", "/publishing", "/publishing/", "/publishing.html"],
            "route_mode": "direct_no_redirect",
            "html_handling": "none",
            "redirect_loop_prevention": true,
            "access_jwt_verification": "configured_and_api_cross_checked",
            "health": "healthz/core + healthz/readiness + direct publishing aliases",
            "content_image_audit": "full-library copy uniqueness + strict unique image per post + season + weather + context semantic hard gate",
            "live_verify_mode": "${XJW_LIVE_VERIFY_MODE}",
            "remote_d1": "verified",
            "erp_ui": "disabled",
            "erp_api": "blocked_except_publishing",
            "guard_mode": "paused_for_full_system_update",
            "blocking_content_media_guards": false,
            "verified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'deploy: record verified posting center app release'
          git pull --rebase origin main
          git push origin HEAD:main
