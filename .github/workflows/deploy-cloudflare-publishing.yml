name: 仙加味 ERP／貼文中心手動備援部署

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-internal-manual-backup-deploy
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare backup deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Validate current full ERP and publishing source
        run: |
          npm run check
          npm run guard:full
          npm run build:static
      - name: Verify full production bundle
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            dist/index.html dist/erp.html dist/publishing.html \
            dist/assets/css/internal-app.css dist/assets/js/internal-app.js dist/assets/js/erp-publishing-separation.js \
            dist/assets/css/publishing-base.css dist/assets/css/publishing-app.css \
            dist/assets/js/publishing-app-v2.js dist/assets/js/publishing-review-gate.js dist/assets/js/device-image-upload.js; do
            test -f "$f" || { echo "missing $f" >&2; exit 1; }
          done
          grep -q "location.replace('/erp.html')" dist/index.html
          grep -q '仙加味營運中控' dist/erp.html
          grep -q '貼文中心系統 App' dist/publishing.html
          grep -Eq '"main"[[:space:]]*:[[:space:]]*"src/full-system-entry.js"' wrangler.jsonc
          grep -q 'erpUiEnabled:true' src/full-system-entry.js
          grep -q 'erpApisEnabled:true' src/full-system-entry.js
          grep -q 'publishingCenterIndependent:true' src/full-system-entry.js
          grep -q 'qixuanPublicVisible:false' src/product-authority.js
          echo 'PASS full ERP + independent publishing bundle.'
      - name: Verify remote D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT 1 AS ok"
      - name: Manual backup deploy to Cloudflare
        run: npx wrangler deploy --keep-vars
      - name: Verify protected live routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://xianjiawei-internal.tung314069.workers.dev'
          for path in '/' '/erp.html' '/publishing.html' '/healthz/core'; do
            result="$(curl -LsS --max-redirs 6 --max-time 25 -o /tmp/xjw-body -w '%{http_code} %{num_redirects} %{url_effective}' "$base$path")"
            echo "$path -> $result"
            code="${result%% *}"
            test "$code" -ge 200
            test "$code" -lt 500
          done
          echo 'PASS manual backup deployment verification.'
