name: 仙加味獨立貼文系統安全自動部署

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'data/**'
      - 'publishing.html'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'tools/**'
      - '.github/workflows/deploy-cloudflare-publishing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-publishing-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Run formal release checks
        run: npm run check

      - name: Build exact production assets
        run: npm run build:static

      - name: Verify built latest ZIP catalog
        shell: bash
        run: |
          test -f dist/data/latest-user-post-zip.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('dist/data/latest-user-post-zip.json','utf8'));
          const must=(ok,msg)=>{if(!ok)throw new Error(msg)};
          must(d.source==='2.zip','建置輸出沒有最新2.zip素材批次');
          must(Number(d.candidate_count)>=22,'建置輸出ZIP候選數不足');
          must(d.priority==='user_zip_approved','建置輸出沒有維持ZIP優先');
          const rule=String(d.selection_rule||'');
          must(/regenerate only if no approved .*candidate matches/.test(rule),'建置輸出沒有維持「無合格來源才生成」能力');
          must(/needs_binary_sync/.test(rule),'建置輸出沒有區分「合格來源待同步原圖」狀態');
          must(/pending_review/.test(d.review_rule||'')&&/16/.test(d.review_rule||''),'建置輸出沒有維持待審核＋16項審核');
          console.log('PASS: latest ZIP catalog and fallback capabilities are included in production assets.');
          NODE

      - name: Detect Cloudflare deploy credentials
        id: cloudflare
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deploy credentials are configured.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deploy credentials are not configured in GitHub Actions; validation passed and deploy is safely skipped.'
          fi

      - name: Verify remote D1 before deploy
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT 1 AS ok"

      - name: Deploy standalone publishing Worker
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler deploy --keep-vars

      - name: Verify deployed Worker formal capabilities
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            response="$(curl -fsS --max-time 12 'https://xianjiawei-internal.tung314069.workers.dev/healthz/core' || true)"
            catalog="$(curl -fsS --max-time 12 'https://xianjiawei-internal.tung314069.workers.dev/data/latest-user-post-zip.json' || true)"
            if [ -n "$response" ]; then
              echo "$response"
              ui_ok=0; image_ok=0; sync_ok=0; regen_ok=0; media_ok=0; zip_ok=0
              printf '%s' "$response" | grep -Eq '"uiRuntime"[[:space:]]*:[[:space:]]*"[^"]+"' && ui_ok=1
              printf '%s' "$response" | grep -Eq '"productImageVersion"[[:space:]]*:[[:space:]]*"[^"]*products-v3[^"]*"' && image_ok=1
              printf '%s' "$response" | grep -Eq '"postBankSyncVersion"[[:space:]]*:[[:space:]]*"[^"]+"' && sync_ok=1
              RESPONSE="$response" node -e 'const d=JSON.parse(process.env.RESPONSE||"{}"); const v=Number(d.knownRegenerationMinimum ?? d?.publishing?.knownRegenerationMinimum ?? 0); process.exit(v>=121?0:1)' && regen_ok=1 || true
              RESPONSE="$response" node -e 'const d=JSON.parse(process.env.RESPONSE||"{}"); process.exit(d.latestPostZip==="2.zip"&&Number(d.latestPostZipCandidates)>=22&&d.postImagePriority==="user_zip_approved"&&d.regenerateOnlyIfNoApprovedMatch===true&&Number(d.reviewItemsAfterMediaChange)===16&&String(d.formalMediaRuntime||"").length>0?0:1)' && media_ok=1 || true
              if [ -n "$catalog" ]; then
                CATALOG="$catalog" node -e 'const d=JSON.parse(process.env.CATALOG||"{}"); const r=String(d.selection_rule||""); process.exit(d.source==="2.zip"&&Number(d.candidate_count)>=22&&d.priority==="user_zip_approved"&&/needs_binary_sync/.test(r)&&/regenerate only if no approved .*candidate matches/.test(r)?0:1)' && zip_ok=1 || true
              fi
              if [ "$ui_ok" -eq 1 ] && [ "$image_ok" -eq 1 ] && [ "$sync_ok" -eq 1 ] && [ "$regen_ok" -eq 1 ] && [ "$media_ok" -eq 1 ] && [ "$zip_ok" -eq 1 ]; then
                echo 'Worker core is healthy: current UI, products-v3, post-bank sync, regeneration safety, latest ZIP catalog and binary-aware media fallback are live.'
                exit 0
              fi
              echo "Worker responded but formal capabilities are not all live yet (ui=$ui_ok image=$image_ok sync=$sync_ok regen=$regen_ok media=$media_ok zip=$zip_ok)." >&2
            fi
            sleep 4
          done
          echo 'Worker deployment verification failed: required formal capabilities did not become live in time.' >&2
          exit 1

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          if [ '${{ steps.cloudflare.outputs.ready }}' = 'true' ]; then
            echo 'Validation complete. Cloudflare deployment path was enabled for this run.'
          else
            echo 'Validation complete. Cloudflare deployment was intentionally skipped because GitHub deploy credentials are absent.'
          fi
