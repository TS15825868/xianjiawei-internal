name: 仙加味 ERP／貼文中心正式部署

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'tools/**'
      - 'index.html'
      - 'erp.html'
      - 'publishing.html'
      - 'manifest.webmanifest'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare-publishing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-internal-production-deploy
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Validate current full ERP and publishing source
        run: |
          npm run check
          npm run guard:full
          npm run build:static
      - name: Verify full production bundle
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            dist/index.html dist/erp.html dist/publishing.html \
            dist/assets/css/internal-app.css dist/assets/js/internal-app.js dist/assets/js/erp-publishing-separation.js \
            dist/assets/css/publishing-base.css dist/assets/css/publishing-app.css dist/assets/css/publishing-performance.css dist/assets/css/publishing-readiness.css \
            dist/assets/js/publishing-resilience.js dist/assets/js/publishing-readiness-ui.js dist/assets/js/publishing-app-v2.js dist/assets/js/publishing-review-gate.js dist/assets/js/device-image-upload.js; do
            test -f "$f" || { echo "missing $f" >&2; exit 1; }
          done
          grep -q '仙加味內部系統' dist/index.html
          grep -q 'ERP／營運中控' dist/index.html
          grep -q '貼文中心' dist/index.html
          grep -q '仙加味營運中控' dist/erp.html
          grep -q '貼文中心系統 App' dist/publishing.html
          grep -Eq 'xianjiawei-publishing-runtime" content="publishing-center-app-[^"]+' dist/publishing.html
          grep -Eq "window\.__XJW_BOOT_VERSION__='[^']+'" dist/publishing.html
          grep -q 'publishing-app.css?v=20260914-no-containment-v4' dist/publishing.html
          grep -Eq 'publishing-app-v2\.js\?v=[^"[:space:]]+' dist/publishing.html
          grep -Eq 'publishing-review-gate\.js\?v=[^"[:space:]]+' dist/publishing.html
          grep -q "'/assets/js/publishing-readiness-ui.js?v=" dist/publishing.html
          grep -q 'scheduleOptionalTools' dist/publishing.html
          ! grep -q '<script src="/assets/js/publishing-readiness-ui.js' dist/publishing.html
          ! grep -q 'content-visibility:auto\|contain:layout paint style\|contain-intrinsic-size:620px\|contain-intrinsic-size:560px' dist/assets/css/publishing-app.css
          grep -q 'content-visibility:visible!important' dist/assets/css/publishing-performance.css
          grep -q 'livePlatformSummary' dist/assets/js/publishing-readiness-ui.js
          grep -q 'platformSummaryObserver' dist/assets/js/publishing-readiness-ui.js
          grep -q 'platformProbeError' dist/assets/js/publishing-readiness-ui.js
          grep -q 'xjwOfflineWasDisabled' dist/assets/js/publishing-resilience.js
          grep -Eq '"start_url"[[:space:]]*:[[:space:]]*"/"' dist/manifest.webmanifest
          grep -Eq '"main"[[:space:]]*:[[:space:]]*"src/full-system-entry.js"' wrangler.jsonc
          grep -q "HOME_PATH='/index.html'" src/full-system-entry.js
          grep -q 'erpUiEnabled:true' src/full-system-entry.js
          grep -q 'erpApisEnabled:true' src/full-system-entry.js
          grep -q 'publishingCenterIndependent:true' src/full-system-entry.js
          grep -q 'qixuanPublicVisible:false' src/product-authority.js
          echo 'PASS unified internal portal + ERP + deferred live platform readiness + iPhone no-containment bundle.'
      - name: Verify remote D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT 1 AS ok"
      - name: Deploy to Cloudflare
        run: npx wrangler deploy --keep-vars
      - name: Verify live routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://xianjiawei-internal.tung314069.workers.dev'
          for path in '/' '/erp.html' '/publishing.html' '/healthz/core'; do
            result="$(curl -LsS --max-redirs 6 --max-time 25 -o /tmp/xjw-body -w '%{http_code} %{num_redirects} %{url_effective}' "$base$path")"
            echo "$path -> $result"
            code="${result%% *}"
            test "$code" -ge 200
            test "$code" -lt 500
          done
          echo 'PASS production deployment verification.'
