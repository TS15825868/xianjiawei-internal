name: 仙加味獨立貼文系統安全自動部署

# MAINTENANCE MODE：完整內容／媒體守門暫停阻擋。
# 自動部署只保留必要語法、建置、D1、Worker健康檢查；
# 完整 current-authority 驗收改由 current-guard-audit.yml 手動執行。
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'data/**'
      - 'publishing.html'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'tools/**'
      - 'guard-mode.json'
      - '.github/workflows/deploy-cloudflare-publishing.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xianjiawei-publishing-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Verify maintenance guard mode
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const mode=JSON.parse(fs.readFileSync('guard-mode.json','utf8'));
          if(mode.mode!=='paused_for_full_system_update') throw new Error('unexpected guard mode');
          if(mode.blocking_content_and_media_guards!==false) throw new Error('blocking guards must remain paused during update');
          if(mode.keep_minimum_safety!==true) throw new Error('minimum safety must stay enabled');
          console.log('PASS: maintenance mode active; blocking content/media guards are paused.');
          NODE

      - name: Minimum syntax and static safety
        run: npm run check

      - name: Build production assets
        run: npm run build:static

      - name: Verify required production output exists
        run: |
          test -f dist/publishing.html
          test -f dist/assets/js/publishing-app-v2.js
          test -f dist/assets/js/formal-media-policy-v20260810.js
          test -f dist/assets/js/zip-media-assistant.js
          test -f dist/data/latest-user-post-zip.json
          echo 'PASS: required publishing production files are present.'

      - name: Detect Cloudflare deploy credentials
        id: cloudflare
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deploy credentials are configured.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deploy credentials are not configured; local validation passed and deploy is skipped.'
          fi

      - name: Verify remote D1 before deploy
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT 1 AS ok"

      - name: Deploy standalone publishing Worker
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler deploy --keep-vars

      - name: Verify deployed Worker minimum health
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            core="$(curl -fsS --max-time 15 'https://xianjiawei-internal.tung314069.workers.dev/healthz/core' || true)"
            page="$(curl -fsS --max-time 15 'https://xianjiawei-internal.tung314069.workers.dev/publishing.html' || true)"
            if [ -n "$core" ] && [ -n "$page" ]; then
              CORE="$core" PAGE="$page" node - <<'NODE' && exit 0 || true
              const core=JSON.parse(process.env.CORE||'{}');
              const page=String(process.env.PAGE||'');
              const okCore=Object.keys(core).length>0;
              const okPage=page.includes('貼文審核發佈系統')&&page.includes('publishing-app-v2.js');
              if(!okCore||!okPage) process.exit(1);
              console.log('PASS: Worker core and publishing UI are live under maintenance-mode minimum safety.');
              NODE
            fi
            sleep 5
          done
          echo 'Worker deployment verification failed: core or publishing UI did not become reachable.' >&2
          exit 1

      - name: Record verified production deployment
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          cat > deployment-status.json <<EOF
          {
            "status": "verified_live",
            "source_commit": "${GITHUB_SHA}",
            "runtime": "cloudflare-worker",
            "health": "healthz/core + publishing.html",
            "guard_mode": "paused_for_full_system_update",
            "blocking_content_media_guards": false,
            "verified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment-status.json
          if git diff --cached --quiet; then
            echo 'Deployment status already current.'
            exit 0
          fi
          git commit -m 'deploy: record verified publishing Worker release'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          if [ '${{ steps.cloudflare.outputs.ready }}' = 'true' ]; then
            echo 'Maintenance deployment attempted with minimum safety. Full content/media guard remains manual and nonblocking.'
          else
            echo 'Validation completed; Cloudflare deployment skipped because deploy credentials are absent.'
          fi
