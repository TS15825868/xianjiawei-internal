name: 仙加味貼文中心手動正式部署

# 整理期間維持手動部署；只有 Cloudflare 正式憑證存在時才允許執行。
# 不再讓缺少憑證的 push 顯示成綠色 success。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xianjiawei-publishing-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require Cloudflare production credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }
          echo 'PASS: Cloudflare production credentials are configured.'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Verify maintenance guard mode
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const mode=JSON.parse(fs.readFileSync('guard-mode.json','utf8'));
          if(mode.mode!=='paused_for_full_system_update') throw new Error('unexpected guard mode');
          if(mode.blocking_content_and_media_guards!==false) throw new Error('blocking guards must remain paused during update');
          if(mode.keep_minimum_safety!==true) throw new Error('minimum safety must stay enabled');
          console.log('PASS: maintenance mode active; blocking content/media guards are paused.');
          NODE

      - name: Minimum syntax and static safety
        run: npm run check

      - name: Build production assets
        run: npm run build:static

      - name: Verify required production output exists
        run: |
          test -f dist/publishing.html
          test -f dist/assets/js/publishing-app-v2.js
          test -f dist/assets/js/publishing-content-guidance-v20260814.js
          test -f dist/assets/data/guilu-content-topic-bank-v20260814.json
          test -f dist/assets/js/formal-media-policy-v20260810.js
          test -f dist/assets/js/zip-media-assistant.js
          test -f dist/data/latest-user-post-zip.json
          echo 'PASS: current publishing UI, content guidance, topic bank and media policy are all in production dist.'

      - name: Verify remote D1 before deploy
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT 1 AS ok"

      - name: Deploy standalone publishing Worker
        run: npx wrangler deploy --keep-vars

      - name: Verify deployed Worker minimum health
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            core="$(curl -fsS --max-time 15 'https://xianjiawei-internal.tung314069.workers.dev/healthz/core' || true)"
            page="$(curl -fsS --max-time 15 'https://xianjiawei-internal.tung314069.workers.dev/publishing.html' || true)"
            topic="$(curl -fsS --max-time 15 'https://xianjiawei-internal.tung314069.workers.dev/assets/data/guilu-content-topic-bank-v20260814.json' || true)"
            if [ -n "$core" ] && [ -n "$page" ] && [ -n "$topic" ]; then
              CORE="$core" PAGE="$page" TOPIC="$topic" node - <<'NODE' && exit 0 || true
              const core=JSON.parse(process.env.CORE||'{}');
              const topic=JSON.parse(process.env.TOPIC||'{}');
              const page=String(process.env.PAGE||'');
              const okCore=Object.keys(core).length>0;
              const okPage=page.includes('貼文審核發佈系統')&&page.includes('publishing-content-guidance-v20260814.js');
              const okTopic=Array.isArray(topic.topics)&&topic.topics.length>=40;
              if(!okCore||!okPage||!okTopic) process.exit(1);
              console.log('PASS: Worker core, publishing UI and 40-topic current bank are live.');
              NODE
            fi
            sleep 5
          done
          echo 'Worker deployment verification failed.' >&2
          exit 1

      - name: Record verified production deployment
        shell: bash
        run: |
          cat > deployment-status.json <<EOF
          {
            "status": "verified_live",
            "source_commit": "${GITHUB_SHA}",
            "runtime": "cloudflare-worker",
            "health": "healthz/core + publishing.html + guilu topic bank",
            "guard_mode": "paused_for_full_system_update",
            "blocking_content_media_guards": false,
            "verified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment-status.json
          if git diff --cached --quiet; then
            echo 'Deployment status already current.'
            exit 0
          fi
          git commit -m 'deploy: record verified publishing Worker release'
          git pull --rebase origin main
          git push origin HEAD:main
