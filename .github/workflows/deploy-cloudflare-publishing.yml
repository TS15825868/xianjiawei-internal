name: 仙加味獨立貼文系統安全自動部署

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'publishing.html'
      - 'package.json'
      - 'wrangler.jsonc'
      - 'tools/**'
      - '.github/workflows/deploy-cloudflare-publishing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-publishing-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Run formal release checks
        run: npm run check

      - name: Build exact production assets
        run: npm run build:static

      - name: Detect Cloudflare deploy credentials
        id: cloudflare
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deploy credentials are configured.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deploy credentials are not configured in GitHub Actions; validation passed and deploy is safely skipped.'
          fi

      - name: Verify remote D1 before deploy
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT 1 AS ok"

      - name: Deploy standalone publishing Worker
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler deploy --keep-vars

      - name: Verify deployed Worker core
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 12 'https://xianjiawei-internal.tung314069.workers.dev/healthz/core'; then
              exit 0
            fi
            sleep 4
          done
          echo 'Worker deployed but core health endpoint did not become reachable in time.' >&2
          exit 1

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          if [ '${{ steps.cloudflare.outputs.ready }}' = 'true' ]; then
            echo 'Validation complete. Cloudflare deployment path was enabled for this run.'
          else
            echo 'Validation complete. Cloudflare deployment was intentionally skipped because GitHub deploy credentials are absent.'
          fi
