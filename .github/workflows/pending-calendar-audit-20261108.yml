name: 仙加味全部待審稿與候選排程精準盤點（唯讀）
on:
  push:
    branches: [main]
    paths: ['ops/request-pending-calendar-audit-20261108.json']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Read all current candidate dates and AI review statuses without changing them
        run: node ops/audit-pending-calendar-20261108.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pending-calendar-readonly-${{ github.run_id }}
          path: pending-calendar-readonly-results.json
          retention-days: 7
