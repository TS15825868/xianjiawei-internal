name: 仙加味正常正式圖優先回補貼文中心

on:
  push:
    branches: [main]
    paths:
      - 'assets/data/recover-approved-media-v20260817.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare D1 credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install D1 tooling
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Fetch current live post library
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,status,image_url,image_alt,image_source,image_quality_status FROM social_posts WHERE status<>'archived' ORDER BY created_at,id" > /tmp/live-before.json
      - name: Build safe recovery SQL from previously approved normal media
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const audit=JSON.parse(fs.readFileSync('assets/data/social-image-audit-v20260815.json','utf8'));
          const blocks=JSON.parse(fs.readFileSync('/tmp/live-before.json','utf8'));
          const rows=blocks.flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          const byId=new Map(rows.map(x=>[String(x.id),x]));
          const cleanUrl=v=>String(v||'').split('#')[0].split('?')[0].toLowerCase();
          const q=v=>`'${String(v??'').replaceAll("'","''")}'`;
          const trusted=[
            '/images/post-library/userzip3-v20260811/',
            '/images/brand/approved-v405/',
            '/images/customer-display-v20260812/',
            '/images/trial/',
            '/images/brand/hd-v20260812/',
            '/images/dm-final/'
          ];
          const knownBad=[
            '/images/posts/remainder66-v20260817/',
            '/images/posts/priority10-v20260817/',
            '/images/posts/current-v20260815/',
            '/images/publishing/generated-v20260815/'
          ];
          const semanticHoldShortIds=new Set(['six-products-overview']);
          const isTrusted=url=>trusted.some(x=>cleanUrl(url).includes(x));
          const isBad=row=>knownBad.some(x=>cleanUrl(row.image_url).includes(x))||/完整生活場景重製v[23]|scene-v[234]|scene[23]/i.test(String(row.image_source||''));
          const used=new Set(rows.filter(x=>String(x.status)==='published'&&x.image_url).map(x=>cleanUrl(x.image_url)));
          const selected=[];
          const skippedDuplicate=[];
          const matchedKeys=[];
          const semanticHolds=[];
          const findRow=id=>{
            const exact=byId.get(id);
            if(exact)return exact;
            const suffix=`-${id}`;
            const matches=rows.filter(row=>String(row.id).endsWith(suffix));
            matches.sort((a,b)=>Number(String(b.id).includes('XJW-SOCIAL-'))-Number(String(a.id).includes('XJW-SOCIAL-'))||String(a.id).localeCompare(String(b.id)));
            return matches[0]||null;
          };
          for(const [shortId,item] of Object.entries(audit.overrides||{})){
            const row=findRow(shortId);
            if(!row||row.status==='published'||item?.action!=='replace'||!isTrusted(item?.imageUrl))continue;
            matchedKeys.push({shortId,id:row.id});
            if(semanticHoldShortIds.has(shortId)){
              semanticHolds.push({id:String(row.id),shortId,reason:'目前文案是購物清單／生活選擇主題，不能使用六項產品總覽圖。'});
              continue;
            }
            const key=cleanUrl(item.imageUrl);
            if(!key||used.has(key)){
              skippedDuplicate.push({id:row.id,shortId,image:item.imageUrl});
              continue;
            }
            used.add(key);
            selected.push({
              id:String(row.id),
              shortId,
              imageUrl:item.imageUrl,
              imageAlt:item.imageAlt||row.title||'仙加味正式貼文圖片',
              imageSource:`使用者先前核准正常正式素材｜${item.imageSource||'正式素材庫'}｜2026-08-17回補`,
            });
          }
          const selectedIds=new Set(selected.map(x=>x.id));
          const semanticHoldIds=new Set(semanticHolds.map(x=>x.id));
          const badHolds=rows.filter(row=>row.status!=='published'&&!selectedIds.has(String(row.id))&&!semanticHoldIds.has(String(row.id))&&isBad(row));
          const sql=[];
          for(const x of selected){
            sql.push(`UPDATE social_posts SET image_url=${q(x.imageUrl)}, image_alt=${q(x.imageAlt)}, image_source=${q(x.imageSource)}, image_quality_status='ok', status='pending_review', image_approved=0, review_note='已改回使用者先前核准的正常正式圖片；請老闆確認後再做16項審核與發布。', rejection_reason='', approved_by=NULL, approved_at=NULL, scheduled_at=NULL, updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now') WHERE id=${q(x.id)} AND status<>'published';`);
          }
          for(const x of semanticHolds){
            sql.push(`UPDATE social_posts SET status='draft', image_quality_status='ok', image_approved=0, review_note=${q('圖片本身正常，但目前文案主題與圖片用途不一致；需重新配對或製作新圖後由老闆確認。')}, rejection_reason=${q(x.reason)}, approved_by=NULL, approved_at=NULL, scheduled_at=NULL, updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now') WHERE id=${q(x.id)} AND status<>'published';`);
          }
          for(const row of badHolds){
            sql.push(`UPDATE social_posts SET status='draft', image_quality_status='low', image_approved=0, review_note='目前圖片屬2026-08-17已確認亂碼／假字／內部規格板合成圖批次，禁止發布；文案與新圖需先在ChatGPT由老闆確認，再回貼文中心。', rejection_reason='圖片實際呈現含亂碼、假字或內部規格板；等待老闆確認的新正式圖。', approved_by=NULL, approved_at=NULL, scheduled_at=NULL, updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now') WHERE id=${q(row.id)} AND status<>'published';`);
          }
          fs.writeFileSync('/tmp/recover-approved-media.sql',sql.join('\n')+'\n');
          fs.writeFileSync('/tmp/recovery-plan.json',JSON.stringify({live:rows.length,matchedKeys:matchedKeys.length,recovered:selected.length,badHolds:badHolds.length,semanticHolds:semanticHolds.length,skippedDuplicate:skippedDuplicate.length,recoveredIds:selected.map(x=>x.id),semanticHoldIds:semanticHolds.map(x=>x.id),duplicatesSkipped:skippedDuplicate},null,2));
          console.log(fs.readFileSync('/tmp/recovery-plan.json','utf8'));
          if(!selected.length&&!badHolds.length&&!semanticHolds.length)throw new Error('沒有找到需要回補或隔離的貼文，停止避免空操作');
          NODE
      - name: Apply safe recovery to production D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/recover-approved-media.sql
      - name: Verify only normal unique media can remain ready for review
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,status,image_url,image_alt,image_source,image_quality_status FROM social_posts WHERE status<>'archived' ORDER BY created_at,id" > /tmp/live-after.json
          node - <<'NODE'
          const fs=require('fs');
          const plan=JSON.parse(fs.readFileSync('/tmp/recovery-plan.json','utf8'));
          const blocks=JSON.parse(fs.readFileSync('/tmp/live-after.json','utf8'));
          const rows=blocks.flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          const clean=v=>String(v||'').split('#')[0].split('?')[0].toLowerCase();
          const bad=['/images/posts/remainder66-v20260817/','/images/posts/priority10-v20260817/','/images/posts/current-v20260815/','/images/publishing/generated-v20260815/'];
          const ready=rows.filter(x=>['pending_review','approved','scheduled'].includes(String(x.status)));
          const leaked=ready.filter(x=>bad.some(b=>clean(x.image_url).includes(b))||/完整生活場景重製v[23]|scene-v[234]|scene[23]/i.test(String(x.image_source||'')));
          if(leaked.length)throw new Error(`仍有 ${leaked.length} 篇已知亂碼合成批次留在可審核/可發布流程`);
          if(ready.some(x=>String(x.image_quality_status)==='low'))throw new Error('仍有 low 品質圖片留在可審核/可發布流程');
          const seen=new Map(),dups=[];
          for(const row of ready){
            const key=clean(row.image_url);if(!key)continue;
            if(seen.has(key))dups.push([seen.get(key),row.id,key]);else seen.set(key,row.id);
          }
          if(dups.length)throw new Error(`正常待審核圖仍有重複使用：${JSON.stringify(dups.slice(0,5))}`);
          if(ready.some(x=>x.id==='XJW-SOCIAL-20260815-01-six-products-overview'))throw new Error('六項產品總覽圖與目前購物清單文案錯配，不能留在待審核');
          const published=rows.filter(x=>x.status==='published');
          const heldLow=rows.filter(x=>x.status==='draft'&&String(x.image_quality_status)==='low');
          console.log(`PASS: published preserved=${published.length}; normal ready-for-review=${ready.length}; bad generated batch leaked=0; duplicate ready images=0; low-image holds=${heldLow.length}; semantic holds=${plan.semanticHolds}; recovered=${plan.recovered}; duplicate-approved-images-skipped=${plan.skippedDuplicate}`);
          NODE
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '這次只回補先前已核准且實際正常、且目前主題仍吻合的正式圖片；同圖不重複。'
          echo '2026-08-17 scene2/scene3 合成批次因使用者實機確認出現亂碼、假字、內部規格板，全部不得留在可發布流程，並標記 image_quality_status=low。'
          echo '圖片正常但文案主題已改變者也留草稿，不硬套舊圖。'
          echo '後續新文案與新圖必須先在 ChatGPT 提供給老闆確認，確認後才可同步至貼文中心。'
          cat /tmp/recovery-plan.json 2>/dev/null || true
