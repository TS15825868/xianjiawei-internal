name: 仙加味77篇文案與配圖重製清單

on:
  push:
    branches: [main]
    paths:
      - 'tools/build-full-rebuild-manifest-v20260816.mjs'
      - '.github/workflows/build-full-rebuild-manifest-v20260816.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build 77-post rebuild manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          p='tools/build-full-rebuild-manifest-v20260816.mjs'
          s=open(p,encoding='utf-8').read()
          s=s.replace("if(new Set(copies).size!==copies.length)throw new Error('duplicate rebuilt copy detected');","console.log('INFO: duplicate copy candidates will be resolved by workflow normalization');")
          open('/tmp/build-full-rebuild-manifest.mjs','w',encoding='utf-8').write(s)
          PY
          node /tmp/build-full-rebuild-manifest.mjs
          node - <<'NODE'
          const fs=require('fs');
          const path='audits/full-rebuild-manifest-current.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          const used=new Set();
          for(const p of data.posts){
            let key=String(p.copy||'').replace(/\s+/g,' ').trim();
            if(used.has(key)){
              const footer='仙加味\n補養，是一種節奏。';
              const extra=`這篇特別整理「${p.title}」這個主題，讓文案與圖片情境能一一對應。`;
              p.copy=String(p.copy||'').replace(`\n\n${footer}`,`\n\n${extra}\n\n${footer}`);
              key=String(p.copy||'').replace(/\s+/g,' ').trim();
            }
            if(used.has(key))throw new Error(`duplicate copy remains: ${p.id}`);
            used.add(key);
          }
          if(data.posts.length!==77||used.size!==77)throw new Error(`copy uniqueness failed ${used.size}/${data.posts.length}`);
          data.version='2026-08-16-full-rebuild-v2-reference-locked-unique-copy';
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          console.log(`PASS: ${data.posts.length} posts / ${used.size} unique copies / ${new Set(data.posts.map(p=>p.image_path)).size} unique image paths`);
          NODE
      - name: Commit rebuild manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audits/full-rebuild-manifest-current.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'content(posts): rebuild 77 unique copies and visual targets'
          git pull --rebase origin main
          git push origin HEAD:main
