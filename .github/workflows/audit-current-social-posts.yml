name: 仙加味貼文中心／D1 唯讀健康巡檢
# 2026-10-20：重新核對圖片回填後的正式數量與核准狀態；全程唯讀。
# 2026-11-05：依當天D1已讀回58篇pending_review，補取現行圖像品質與AI／人工審核證據；不寫入、不核准、不發文。

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-current-social-posts.yml'
      - 'ops/social-full-audit-request.json'
      - 'src/ai-quality-review.js'
      - 'src/metricool-sync.js'
      - 'tools/metricool-free-evidence.cjs'
      - 'tools/ai-batch-triage.mjs'
      - 'tools/test-ai-batch-triage.mjs'
      - 'ops/historical-media-source-link-gaps-20261108.json'
  schedule:
    # 每6小時一次；GitHub Actions 使用 UTC；亦可手動執行最新唯讀快照。
    - cron: '31 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-social-d1-readonly-health
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test fail-closed AI batch triage
        run: node --test tools/test-ai-batch-triage.mjs
      - name: Require Cloudflare read credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Export current social posts and structural health from D1 (read only)
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,headline,copy,category,platforms_json,status,scheduled_at,proposed_scheduled_at,approved_by,approved_at,published_at,image_url,image_alt,image_source,image_approved,image_width,image_height,image_bytes,image_quality_status,rejection_reason,review_note,created_at,updated_at FROM social_posts ORDER BY CASE status WHEN 'pending_review' THEN 0 WHEN 'approved' THEN 1 WHEN 'scheduled' THEN 2 WHEN 'draft' THEN 3 WHEN 'published' THEN 4 ELSE 5 END, updated_at DESC, id ASC" > current-social-posts.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT status,COUNT(*) AS count FROM social_posts GROUP BY status ORDER BY status" > current-social-post-counts.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT post_id,content_fingerprint,checklist_json,copy_image_match,reviewed_by,reviewed_at FROM social_post_review_gates ORDER BY post_id" > current-review-gates.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_post_quality_reviews ORDER BY reviewed_at DESC" > current-ai-reviews.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_metricool_sync ORDER BY publication_at" > current-metricool-sync.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT entity_id,actor_email,action,created_at FROM audit_logs WHERE entity_type='貼文' AND (action LIKE '%核准%' OR action LIKE '%審核%') ORDER BY created_at DESC LIMIT 250" > current-review-audit.json
          # 對齊圖片實際狀態：僅取公開貼文影像綁定欄位，不讀客戶資料；避免拿舊快照進行重製。
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,status,image_url,image_quality_status,image_approved,scheduled_at,updated_at FROM social_posts ORDER BY id" > current-social-image-states.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "PRAGMA foreign_key_check" > foreign-key-check.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS count FROM social_posts WHERE status NOT IN ('draft','pending_review','approved','scheduled','published','manual_required','failed','archived')" > invalid-status.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS count FROM social_posts WHERE TRIM(id)='' OR TRIM(title)=''" > required-text.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS count FROM social_posts WHERE status='pending_review' AND (approved_by IS NOT NULL OR approved_at IS NOT NULL OR published_at IS NOT NULL OR scheduled_at IS NOT NULL)" > pending-state.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS count FROM social_posts WHERE status='scheduled' AND scheduled_at IS NULL" > scheduled-state.json
      - name: Verify D1 invariants without changing content
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const rows=(file)=>{
            const d=JSON.parse(fs.readFileSync(file,'utf8'));
            return (Array.isArray(d)?d[0]?.results:d?.results)||[];
          };
          const counts=rows('current-social-post-counts.json');
          const total=counts.reduce((n,r)=>n+Number(r.count||0),0);
          if(total<3) throw new Error(`貼文資料異常，總數只有 ${total}`);
          const fk=rows('foreign-key-check.json');
          if(fk.length) throw new Error(`D1 foreign_key_check 異常：${JSON.stringify(fk)}`);
          for(const file of ['invalid-status.json','required-text.json','pending-state.json','scheduled-state.json']){
            const value=Number(rows(file)[0]?.count||0);
            if(value!==0) throw new Error(`${file} 異常筆數 ${value}`);
          }
          console.log('PASS D1 readonly health',Object.fromEntries(counts.map(r=>[r.status,Number(r.count||0)])));
          // 正式排程必須綁定目前圖文指紋的有效人工核准；AI_APPROVED 只能作為品質證據。
          const posts=rows('current-social-posts.json');
          const gates=rows('current-review-gates.json');
          const links=rows('current-metricool-sync.json');
          const {fingerprint}=require('./tools/metricool-free-evidence.cjs');
          const checklistKeys=['brand','product','specification','pricing_activity','season','weather','occasion','location','scene_environment','temperature','expression','action','mascot_companions','physical_scale','duplicate','compliance_final'];
          const scheduled=posts.filter(p=>p.status==='scheduled');
          const invalid=[];
          for(const post of scheduled){
            const gate=gates.find(g=>g.post_id===post.id);
            const link=links.find(l=>l.post_id===post.id);
            let checks={};
            try{checks=JSON.parse(gate?.checklist_json||'{}')}catch{}
            const validEmail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(gate?.reviewed_by||''));
            const human=gate&&validEmail&&gate.reviewed_by===post.approved_by&&gate.content_fingerprint===fingerprint(post)&&Number(gate.copy_image_match)===1&&checklistKeys.every(k=>checks[k]===true)&&!String(post.review_note||'').startsWith('AI審核：AI_APPROVED；');
            const linked=link&&link.state==='scheduled'&&link.uuid&&link.metricool_id;
            if(!human||!linked) invalid.push({id:post.id,human:Boolean(human),linked:Boolean(linked)});
          }
          if(invalid.length) throw new Error(`scheduled posts fail publication gate: ${JSON.stringify(invalid)}`);
          console.log('PASS scheduled human approval',scheduled.map(p=>p.id));
          NODE
      - name: Categorize every live social post without skipping hidden or archived rows
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const rows=name=>{
            const raw=JSON.parse(fs.readFileSync(name,'utf8'));
            return (Array.isArray(raw)?raw[0]?.results:raw.results)||[];
          };
          const posts=rows('current-social-posts.json');
          const counts=Object.fromEntries(rows('current-social-post-counts.json').map(x=>[x.status,Number(x.count)]));
          const total=Object.values(counts).reduce((n,x)=>n+x,0);
          if(posts.length!==total||new Set(posts.map(x=>x.id)).size!==total)
            throw Error('Incomplete or duplicate D1 full-inventory rows: '+posts.length+' vs '+total);
          const gates=new Map(rows('current-review-gates.json').map(x=>[x.post_id,x]));
          const ai=new Map();
          for(const item of rows('current-ai-reviews.json'))if(!ai.has(item.post_id))ai.set(item.post_id,item);
          const blockedProduct=/龜鹿膠|龜鹿湯塊|柒玄茶|guilu-tangkuai|guilu-jiao|qixuan-tea/i;
          const dangerousCopy=/治療|治癒|預防疾病|改善疾病|保證療效|補氣|生津|膠原蛋白|鈣質/i;
          const group=x=>['archived','published'].includes(x.status)?'preserve_historical_record':
            x.status==='draft'?'draft_needs_scene_and_quality_review':
            x.status==='pending_review'?'pending_image_16_checks_and_historical_dedup':
            x.status==='scheduled'?'verify_human_gate_and_remote_delivery':
            x.status==='approved'?'verify_version_bound_human_approval_before_slot':
            ['failed','manual_required'].includes(x.status)?'verify_external_receipt_before_retry':
            'requires_manual_status_examination';
          const actionable=posts.map(p=>{
            const violations=[];
            const content=[p.title,p.headline,p.copy,p.image_alt].filter(Boolean).join(' ');
            if(blockedProduct.test(content))violations.push('retired_product_in_public_candidate');
            if(dangerousCopy.test(content))violations.push('public_copy_legal_review');
            if(!p.image_url)violations.push('image_missing');
            if(!p.image_alt)violations.push('image_alt_missing');
            if(['needs_review','needs_rework','needs_regeneration','rejected','low','missing'].includes(String(p.image_quality_status||'').toLowerCase()))
              violations.push('image_quality_evidence_not_clear');
            if(!p.approved_by||!p.approved_at)violations.push('human_approval_not_recorded');
            if(!gates.has(p.id))violations.push('current_review_gate_missing');
            if(p.proposed_scheduled_at&&!p.scheduled_at)violations.push('proposed_time_is_not_external_schedule');
            return {id:p.id,status:p.status,actionGroup:group(p),
              proposedAt:p.proposed_scheduled_at||null,hasImage:!!p.image_url,
              imageQuality:p.image_quality_status||'',evidenceProblems:violations,
              latestAiDecision:ai.get(p.id)?.decision||'not_recorded',humanGatePresent:gates.has(p.id)};
          });
          const byAction={};const byIssue={};const active=actionable.filter(x=>!['archived','published'].includes(x.status));
          for(const row of actionable){
            byAction[row.actionGroup]=(byAction[row.actionGroup]||0)+1;
            if(active.includes(row))for(const issue of row.evidenceProblems)byIssue[issue]=(byIssue[issue]||0)+1;
          }
          const output={schema:'xjw-all-status-post-queue-v1',capturedAt:new Date().toISOString(),
            source:'direct D1 full table readonly remote',total,counts,
            activeToProcess:active.length,
            byAction,byIssue,
            flags:{noApprovalsGranted:true,noPostsDeleted:true,noMediaGenerated:true,
              noExternalPublicationPerformed:true,reviewerMustBeRealHuman:true,
              archivedAndPublishedExcludedFromNewQueue:true},
            records:actionable};
          fs.writeFileSync('all-social-posts-action-queue.json',JSON.stringify(output,null,2)+'\n');
          console.log('FULL_D1_QUEUE',JSON.stringify({total,counts,activeToProcess:active.length,byAction,byIssue}));
          NODE
      - name: Triage every current pending post using existing 16-check evidence and actual version binding
        run: node tools/report-pending-review-actual-checks.cjs
      - name: Run complete pending batch triage (read only, no automatic approval)
        run: node tools/ai-batch-triage.mjs pending-review-full-inventory.json ai-batch-triage.json ops/historical-media-source-link-gaps-20261108.json
      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-social-posts-${{ github.run_id }}
          path: |
            current-social-posts.json
            all-social-posts-action-queue.json
            ai-batch-triage.json
            pending-review-full-inventory.json
            current-social-post-counts.json
            current-social-image-states.json
            current-review-gates.json
            current-ai-reviews.json
            current-metricool-sync.json
            current-review-audit.json
            foreign-key-check.json
            invalid-status.json
            required-text.json
            pending-state.json
            scheduled-state.json
          if-no-files-found: error
          retention-days: 2
