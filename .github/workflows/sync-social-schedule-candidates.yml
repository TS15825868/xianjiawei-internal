name: 仙加味貼文排程候選同步

on:
  push:
    branches: [main]
    paths:
      - 'ops/schedule-candidate-sync-request.json'

permissions:
  contents: write

concurrency:
  group: xianjiawei-schedule-candidate-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Reconcile two Metricool-verified published posts
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "UPDATE social_posts SET status='published', image_url='https://raw.githubusercontent.com/TS15825868/xianjiawei-internal/main/assets/post-images/2026-09-30/live/XJW-LIVE-20260929-hongludi-outing.jpg', image_alt='烘爐地觀景平台夕陽情境，小老闆與小鹿、小烏龜分開坐著看城市風景', image_source='GitHub main正式圖｜Metricool 384813552｜Facebook/Instagram/Threads PUBLISHED verified 2026-10-07', image_quality_status='ok', image_approved=1, approved_by='使用者人工核准｜Metricool三平台已發布', approved_at=COALESCE(approved_at,'2026-10-01T12:30:00+08:00'), scheduled_at='2026-10-01T12:30:00+08:00', published_at='2026-10-01T12:30:00+08:00', updated_at=datetime('now') WHERE id='XJW-CONV-live-hongludi-outing-20260929';"
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "UPDATE social_posts SET status='published', image_url='https://raw.githubusercontent.com/TS15825868/xianjiawei-internal/main/assets/post-images/2026-10-03/XJW-CONV-brand-third-generation-note.png', image_alt='仙加味品牌手記主視覺：第三代在萬華老店工作情境，主題為有些東西真的不能只用價格來算。', image_source='GitHub main正式圖｜Metricool 386519368｜Facebook/Instagram/Threads PUBLISHED verified 2026-10-07', image_quality_status='ok', image_approved=1, approved_by='使用者人工核准｜Metricool三平台已發布', approved_at=COALESCE(approved_at,'2026-10-02T17:30:00+08:00'), scheduled_at='2026-10-03T10:00:00+08:00', published_at='2026-10-03T10:00:00+08:00', updated_at=datetime('now') WHERE id='XJW-CONV-brand-third-generation-note';"

      - name: Export approved, scheduled and pending-review posts
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,copy,category,platforms_json,status,scheduled_at,proposed_scheduled_at,image_url,image_alt,image_source,image_approved,approved_at,published_at,updated_at FROM social_posts WHERE status IN ('approved','scheduled','pending_review') ORDER BY CASE status WHEN 'approved' THEN 0 WHEN 'scheduled' THEN 1 ELSE 2 END, COALESCE(scheduled_at, proposed_scheduled_at, updated_at), id" > /tmp/schedule-candidates.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/schedule-candidates.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          const out={
            version:'2026-09-30-live-d1',
            source:'Cloudflare D1 social_posts',
            generatedAt:new Date().toISOString(),
            counts:rows.reduce((m,r)=>(m[r.status]=(m[r.status]||0)+1,m),{}),
            items:rows.map(r=>({...r,platforms:Array.isArray(r.platforms_json)?r.platforms_json:(()=>{try{return JSON.parse(r.platforms_json||'[]')}catch{return[]}})()}))
          };
          fs.writeFileSync('ops/social-schedule-candidates-current.json',JSON.stringify(out,null,2)+'\n');
          NODE
      - name: Commit current schedule candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/social-schedule-candidates-current.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'sync: refresh social schedule candidates'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            [ "$attempt" = 4 ] && exit 1
            sleep 2
          done
