name: 仙加味貼文排程候選同步

on:
  push:
    branches: [main]
    paths:
      - 'ops/schedule-candidate-sync-request.json'

permissions:
  contents: write

concurrency:
  group: xianjiawei-schedule-candidate-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Repair externally verified published-state drift
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ops/published-status-repair-current.json ]; then
            node - <<'NODE'
            const fs=require('fs');
            const cfg=JSON.parse(fs.readFileSync('ops/published-status-repair-current.json','utf8'));
            const q=v=>"'" + String(v??'').replaceAll("'","''") + "'";
            const lines=[];
            for(const x of cfg.items||[]){
              if(x.metricoolStatus!=='PUBLISHED'||x.userApproved!==true)throw new Error(x.postId+' published evidence invalid');
              lines.push(`UPDATE social_posts SET status='published', image_url=${q(x.imageUrl)}, image_alt=${q(x.imageAlt)}, image_source=${q(x.imageSource)}, image_quality_status='ok', image_approved=1, approved_by=${q(x.approvedBy)}, approved_at=COALESCE(approved_at,${q(x.approvedAt)}), scheduled_at=${q(x.publishedAt)}, published_at=${q(x.publishedAt)}, updated_at=datetime('now') WHERE id=${q(x.postId)};`);
            }
            if(lines.length!==2)throw new Error('expected exactly 2 verified published repairs');
            fs.writeFileSync('/tmp/xjw-published-repair.sql',lines.join('\n')+'\n');
            NODE
            npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/xjw-published-repair.sql
          fi
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title FROM social_posts WHERE status='draft' ORDER BY id" > /tmp/xjw-drafts-after-repair.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/xjw-drafts-after-repair.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          fs.writeFileSync('ops/post-image-production-queue-current.json',JSON.stringify({
            version:'2026-10-07-after-published-state-repair',
            brand:'仙加味',
            source:'Cloudflare D1 live social_posts WHERE status=draft',
            total:rows.length,
            status:'production-queue',
            rule:'只為live D1目前status=draft的有效貼文製作唯一正式圖片；人工審核前不得發布。',
            items:rows.map((r,i)=>({postId:r.id,imageId:`XJW-ACTIVE-IMG-${String(i+1).padStart(3,'0')}`,title:r.title||'',status:'needs_unique_image'}))
          },null,2)+'\n');
          if(rows.length!==0)throw new Error('D1 draft queue still not zero: '+rows.length);
          const p='ops/post-image-production-status-current.json';
          const s=JSON.parse(fs.readFileSync(p,'utf8'));
          s.version='2026-10-07-publishing-queue-complete';
          s.updatedAt=new Date().toISOString();
          s.remainingNeedsUniqueImage=0;
          s.nextWork=['目前有效draft製圖佇列已清零；後續只處理新建立或人工退回的內容'];
          s.note='2026-10-07：10篇缺圖已復原並回pending_review；另2篇依Metricool三平台PUBLISHED證據修正D1狀態；正式draft製圖佇列=0。';
          fs.writeFileSync(p,JSON.stringify(s,null,2)+'\n');
          NODE

      - name: Export approved, scheduled and pending-review posts
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,copy,category,platforms_json,status,scheduled_at,proposed_scheduled_at,image_url,image_alt,image_source,image_approved,approved_at,published_at,updated_at FROM social_posts WHERE status IN ('approved','scheduled','pending_review') ORDER BY CASE status WHEN 'approved' THEN 0 WHEN 'scheduled' THEN 1 ELSE 2 END, COALESCE(scheduled_at, proposed_scheduled_at, updated_at), id" > /tmp/schedule-candidates.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/schedule-candidates.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          const out={
            version:'2026-09-30-live-d1',
            source:'Cloudflare D1 social_posts',
            generatedAt:new Date().toISOString(),
            counts:rows.reduce((m,r)=>(m[r.status]=(m[r.status]||0)+1,m),{}),
            items:rows.map(r=>({...r,platforms:Array.isArray(r.platforms_json)?r.platforms_json:(()=>{try{return JSON.parse(r.platforms_json||'[]')}catch{return[]}})()}))
          };
          fs.writeFileSync('ops/social-schedule-candidates-current.json',JSON.stringify(out,null,2)+'\n');
          NODE
      - name: Commit current schedule candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f ops/published-status-repair-current.json ]; then git rm -f ops/published-status-repair-current.json; fi
          git add ops/social-schedule-candidates-current.json ops/post-image-production-queue-current.json ops/post-image-production-status-current.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'sync: refresh social schedule candidates'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            [ "$attempt" = 4 ] && exit 1
            sleep 2
          done
