name: 仙加味過時圖片是否無引用安全盤點（唯讀）
on:
  push:
    branches: [main]
    paths: ['ops/request-orphaned-old-candidate-audit-20261108.json']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Inspect all D1 social/post media references and Git tracked references without deleting
        run: node ops/audit-orphaned-old-candidate-20261108.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: old-candidate-orphan-review-${{ github.run_id }}
          path: old-variant-orphan-report.json
          retention-days: 7
          if-no-files-found: warn
