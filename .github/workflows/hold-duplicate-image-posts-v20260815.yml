name: 仙加味重複主圖貼文安全退回草稿

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hold-duplicate-image-posts-v20260815.yml'
  workflow_dispatch:

jobs:
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require credentials and install dependencies
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Build safe hold SQL from current remediation plan
        shell: bash
        run: |
          node - <<'NODE' > /tmp/hold.sql
          const fs=require('fs');
          const plan=JSON.parse(fs.readFileSync('audits/image-remediation-current.json','utf8'));
          const q=v=>`'${String(v??'').replaceAll("'","''")}'`;
          if(Number(plan.replacement_targets)!==48)throw new Error(`expected 48 replacement targets, got ${plan.replacement_targets}`);
          for(const row of plan.targets||[]){
            const reason=`全庫圖文檢查：目前主圖與其他貼文重複；已安全退回草稿，等待「${row.title}」專屬完整單一情境圖。原圖：${row.current_image}`;
            console.log(`UPDATE social_posts SET status='draft',image_url='',image_alt=${q(row.title)},image_source=${q(reason)},image_approved=0,approved_by=NULL,approved_at=NULL,scheduled_at=NULL,proposed_scheduled_at=NULL,published_at=NULL,updated_at=CURRENT_TIMESTAMP WHERE id=${q(row.id)} AND status<>'published';`);
          }
          NODE
          test "$(grep -c '^UPDATE social_posts' /tmp/hold.sql)" -eq 48
      - name: Apply safe hold to D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/hold.sql
      - name: Verify review queue has no duplicate main image
        shell: bash
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT status,COUNT(*) AS count FROM social_posts WHERE status<>'archived' GROUP BY status ORDER BY status;" > /tmp/status.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS value FROM (SELECT lower(substr(image_url,1,instr(image_url||'?','?')-1)) AS u,COUNT(*) c FROM social_posts WHERE status IN ('pending_review','approved','scheduled','published') AND trim(image_url)<>'' GROUP BY u HAVING c>1);" > /tmp/dup.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS value FROM social_posts WHERE status='draft' AND image_source LIKE '全庫圖文檢查：目前主圖與其他貼文重複%';" > /tmp/held.json
          node - <<'NODE'
          const fs=require('fs');
          const val=p=>Number(JSON.parse(fs.readFileSync(p,'utf8')).flatMap(x=>x.results||[])[0]?.value||0);
          const dup=val('/tmp/dup.json'),held=val('/tmp/held.json');
          const status=JSON.parse(fs.readFileSync('/tmp/status.json','utf8')).flatMap(x=>x.results||[]);
          console.log({status,duplicate_live_groups:dup,held_for_unique_image:held});
          if(dup!==0)throw new Error('待審核以上仍有重複主圖');
          if(held<48)throw new Error(`應至少隔離48篇，實際${held}`);
          NODE
