name: One-shot discover Cloudflare Access app

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-discover-cloudflare-access-v20260815.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Discover Access application audience for posting center
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          domain='xianjiawei-internal.tung314069.workers.dev'
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps?domain=$domain&exact=true&per_page=50" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' > /tmp/access-apps.json
          node - <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/access-apps.json','utf8'));
          if(body.success!==true) throw new Error('Cloudflare Access API failed: '+JSON.stringify(body.errors||[]));
          const domain='xianjiawei-internal.tung314069.workers.dev';
          const apps=(body.result||[]).filter(x=>String(x.domain||'').replace(/^https?:\/\//,'').replace(/\/$/,'')===domain);
          if(apps.length!==1) throw new Error(`Expected exactly one Access app for ${domain}, got ${apps.length}`);
          const app=apps[0];
          if(!app.aud) throw new Error('Access app is missing AUD tag');
          console.log('ACCESS_APP_ID='+app.id);
          console.log('ACCESS_APP_NAME='+String(app.name||''));
          console.log('ACCESS_APP_DOMAIN='+String(app.domain||''));
          console.log('ACCESS_APP_AUD='+String(app.aud||''));
          console.log('TEAM_DOMAIN=https://tung314069.cloudflareaccess.com');
          NODE
