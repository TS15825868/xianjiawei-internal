name: 仙加味 GitHub 歷史社群圖片離線指紋建檔
# Uses only public GitHub image files. Never queries or writes production D1.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-social-history-fingerprints-offline.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xjw-social-history-fingerprint-only
  cancel-in-progress: false

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout ERP evidence inventory
        uses: actions/checkout@v4
      - name: Checkout exact public website source revision, images only
        uses: actions/checkout@v4
        with:
          repository: TS15825868/xianjiawei
          ref: 73c26cf2dc8f802218c176408106a18cf14f1758
          path: website
          sparse-checkout: |
            images/posts
            images/post-library
            images/publishing
            images/social
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Set up offline image decoding
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow for local GitHub image decoding only
        run: python -m pip install --quiet 'Pillow==11.3.0'
      - name: Verify all 169 Git objects and calculate SHA-256 / 64-bit dHash
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image,ImageOps
          root=Path('website').resolve()
          inventory_path=Path('assets/data/github-social-media-source-inventory-v20261122.json')
          inventory=json.loads(inventory_path.read_text(encoding='utf-8'))
          if inventory.get('source_main_sha')!='73c26cf2dc8f802218c176408106a18cf14f1758':
              raise SystemExit('Website main snapshot mismatch; refuse to blend generations')
          assets=inventory.get('media')
          if not isinstance(assets,list) or len(assets)!=169:
              raise SystemExit('Expected 169 previously indexed GitHub media objects')
          result=[]
          for item in assets:
              name=item['path']
              rel=Path(name)
              if rel.is_absolute() or '..' in rel.parts or not name.startswith('images/'):
                  raise SystemExit('Unsafe image path in manifest')
              file=(root/rel).resolve()
              if not file.is_relative_to(root) or not file.is_file():
                  raise SystemExit('Missing GitHub image source: '+name)
              raw=file.read_bytes()
              if len(raw)!=item['bytes']:
                  raise SystemExit('Image byte size mismatch for '+name)
              actual_blob=hashlib.sha1(b'blob '+str(len(raw)).encode('ascii')+b'\0'+raw).hexdigest()
              if actual_blob!=item['git_blob_sha']:
                  raise SystemExit('Git object integrity mismatch for '+name)
              record={'path':name,'classification':item['classification'],
                      'git_blob_sha':actual_blob,'bytes':len(raw),
                      'sha256':hashlib.sha256(raw).hexdigest(),
                      'dhash':None,'width':None,'height':None,'decode_status':'not_supported'}
              if file.suffix.lower()=='.svg':
                  record['decode_status']='svg_not_rasterized'
              else:
                  try:
                      with Image.open(file) as image:
                          image.load()
                          clean=ImageOps.exif_transpose(image)
                          record['width'],record['height']=clean.size
                          grey=clean.convert('L').resize((9,8),Image.Resampling.LANCZOS)
                          pixels=list(grey.getdata())
                          value=0
                          for row in range(8):
                              for col in range(8):
                                  value=(value<<1)|int(pixels[row*9+col]>pixels[row*9+col+1])
                          record['dhash']=format(value,'016x')
                          record['decode_status']='ok'
                  except (OSError,ValueError,Image.DecompressionBombError) as exc:
                      record['decode_status']='unsupported_or_invalid_'+type(exc).__name__
              result.append(record)
          output={
             'schema':'xjw-github-social-media-image-fingerprints-v1',
             'source_repository':inventory['source_repository'],
             'source_main_sha':inventory['source_main_sha'],
             'source_inventory_path':str(inventory_path),
             'source_files':len(result),
             'git_objects_verified':len(result),
             'sha256_verified':sum(bool(row['sha256']) for row in result),
             'dhash_available':sum(bool(row['dhash']) for row in result),
             'decode_status_counts':{},
             'production_d1_queries':0,'production_d1_writes':0,
             'historical_178_cloudflare_coverage_confirmed':False,
             'pending_46_image_mapping_confirmed':False,
             'approval_or_publication_permitted':False,
             'warning':'These are public GitHub image fingerprints only. The 178 historical Cloudflare items and 46 pending post bindings remain unverified.',
             'media':result
          }
          for row in result:
              s=row['decode_status']
              output['decode_status_counts'][s]=output['decode_status_counts'].get(s,0)+1
          target=Path('assets/data/github-social-media-fingerprints-v20261122.json')
          target.write_text(json.dumps(output,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'count':len(result),'dhash_available':output['dhash_available'],'decoder_status':output['decode_status_counts'],'d1_queries':0},ensure_ascii=False))
          PY
      - name: Keep immutable review artifact (no approval or publication)
        uses: actions/upload-artifact@v4
        with:
          name: xjw-github-social-history-fingerprints
          path: assets/data/github-social-media-fingerprints-v20261122.json
          retention-days: 7
      - name: Save verified public-image fingerprints to ERP main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # ERP .gitignore excludes assets/data as runtime output; this specific
          # verified public-image evidence JSON is intentionally version-controlled.
          git add -f assets/data/github-social-media-fingerprints-v20261122.json
          if git diff --cached --quiet; then
            echo 'No fingerprint data change; no commit needed.'
            exit 0
          fi
          git commit -m 'data: persist offline GitHub media pixel hashes (no D1)'
          git push origin HEAD:main
