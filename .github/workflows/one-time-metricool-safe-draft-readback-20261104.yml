name: XJW one-time safe Metricool draft snapshot reconciliation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-metricool-safe-draft-readback-20261104.yml']
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Read exact D1 draft links, posts, prior deliveries and published rows
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_metricool_sync WHERE state='pending_review' ORDER BY post_id" > /tmp/links-before.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,copy,approved_by,approved_at,published_at,scheduled_at,image_approved FROM social_posts WHERE status='pending_review' ORDER BY id" > /tmp/posts-before.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT post_id,platform,status,attempt_count,remote_id,published_at,last_attempt_at FROM social_publish_deliveries ORDER BY post_id" > /tmp/deliveries-before.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts WHERE status='published' ORDER BY id" > /tmp/published-before.json
      - name: Build exact compare-and-swap update for safe, current remote draft snapshots only
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert/strict'),crypto=require('crypto');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'))[0].results;
          const payload=JSON.parse(fs.readFileSync('ops/metricool-safe-draft-snapshots-20261104.json','utf8'));
          const links=read('/tmp/links-before.json'),posts=read('/tmp/posts-before.json'),deliveries=read('/tmp/deliveries-before.json');
          assert.equal(payload.schema,'xjw_metricool_safe_draft_snapshot_v1');
          assert.equal(payload.brandId,'6889683');
          assert.equal(payload.items.length,15);
          const ids=new Set(),uuids=new Set(),q=x=>"'"+String(x??'').replaceAll("'","''")+"'";
          const fnv=s=>{let h=2166136261;for(const c of String(s||''))h=Math.imul(h^c.codePointAt(0),16777619)>>>0;return h.toString(16).padStart(8,'0');};
          const statements=[],summary=[];
          for(const entry of payload.items){
            const {post_id,metricool_id,uuid,remote,d1_copy_digest_fnv1a}=entry;
            assert(!ids.has(post_id)&&!uuids.has(uuid),'Duplicate ID');ids.add(post_id);uuids.add(uuid);
            assert.equal(remote.id,metricool_id);assert.equal(String(remote.uuid),uuid);
            assert.equal(remote.draft,true);assert.equal(remote.autoPublish,false);
            assert.equal(remote.providers?.length,3);
            assert(remote.providers.every(p=>p.status==='PENDING'));
            assert.equal(remote.media?.length,1);
            const link=links.find(x=>x.post_id===post_id),post=posts.find(x=>x.id===post_id);
            assert(link && post,'Missing current D1 entry '+post_id);
            assert.equal(Number(link.metricool_id),metricool_id);assert.equal(String(link.uuid),uuid);assert.equal(link.state,'pending_review');
            assert.equal(post.status,'pending_review');
            assert(!post.published_at&&!post.approved_at&&!post.approved_by&&!post.scheduled_at);
            assert.equal(Number(post.image_approved),0);
            assert.equal(fnv(remote.text),d1_copy_digest_fnv1a);
            assert.equal(fnv(post.copy),d1_copy_digest_fnv1a,'D1 copy changed '+post_id);
            assert(!deliveries.some(x=>x.post_id===post_id&&(Number(x.attempt_count)>0||x.last_attempt_at||x.published_at||x.remote_id||['sending','retry','published','manual_required','permanent_failed'].includes(x.status))),'Unexpected prior send '+post_id);
            const prior=JSON.parse(link.template_json||'{}'),replacement=JSON.stringify(remote);
            if(prior.text!==post.copy)throw Error('Previous D1 template is mismatched to post copy '+post_id);
            // Old template IDs predate prior exact-UUID reconciliation; compare UUID, not stale numeric ID.
            if(String(prior.uuid)!==uuid||!Number.isSafeInteger(Number(prior.id)))throw Error('Previous D1 template UUID invalid '+post_id);
            const changed=link.template_json!==replacement;
            if(changed){
              statements.push('UPDATE social_metricool_sync SET template_json='+q(replacement)+",last_sync_at=datetime('now'),updated_at=datetime('now') WHERE post_id="+q(post_id)+' AND metricool_id='+metricool_id+' AND uuid='+q(uuid)+" AND state='pending_review' AND template_json="+q(link.template_json)+' AND updated_at='+q(link.updated_at)+" AND EXISTS(SELECT 1 FROM social_posts WHERE id="+q(post_id)+" AND status='pending_review' AND approved_by IS NULL AND published_at IS NULL AND scheduled_at IS NULL) AND NOT EXISTS(SELECT 1 FROM social_publish_deliveries WHERE post_id="+q(post_id)+" AND (COALESCE(attempt_count,0)>0 OR last_attempt_at IS NOT NULL OR published_at IS NOT NULL OR TRIM(COALESCE(remote_id,''))<>'' OR status IN ('sending','retry','published','manual_required','permanent_failed')));");
              const key='XJW-METRICOOL-SNAPSHOT-'+crypto.createHash('sha256').update(post_id+'|'+uuid).digest('hex').slice(0,16);
              const prev={remoteId:prior.id,uuid:prior.uuid,draft:prior.draft,autoPublish:prior.autoPublish,media:prior.media};
              const next={remoteId:remote.id,uuid:remote.uuid,draft:true,autoPublish:false,media:remote.media,changedTemplateOnly:true,published:false};
              statements.push('INSERT INTO audit_logs(id,actor_email,action,entity_type,entity_id,before_json,after_json,ip) SELECT '+[key,'system:metricool-safe-snapshot','Metricool現行安全草稿快照回寫，未核准未發送','貼文',post_id,JSON.stringify(prev),JSON.stringify(next),''].map(q).join(',')+' WHERE changes()=1;');
            }
            summary.push({post_id,changed,oldDraft:prior.draft,newDraft:remote.draft,oldMedia:prior.media?.[0]||null,newMedia:remote.media[0]});
          }
          fs.writeFileSync('/tmp/apply.sql',statements.join('\n')+'\n');
          fs.writeFileSync('/tmp/targets.json',JSON.stringify(summary));
          console.log('PASS 15 D1 and connected Metricool identities, current copies, safe drafts and blocked outbound; sync snapshots requiring refresh',summary.filter(x=>x.changed).length);
          NODE
      - name: Apply guarded D1 sync snapshot updates without affecting posts or Metricool
        shell: bash
        run: |
          set -euo pipefail
          if test -s /tmp/apply.sql; then npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/apply.sql; fi
      - name: Read back snapshots, verify no post changes and retain published records
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_metricool_sync WHERE state='pending_review' ORDER BY post_id" > /tmp/links-after.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts WHERE status='published' ORDER BY id" > /tmp/published-after.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,copy,approved_by,approved_at,published_at,scheduled_at,image_approved FROM social_posts WHERE status='pending_review' ORDER BY id" > /tmp/posts-after.json
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert/strict');
          const rd=p=>JSON.parse(fs.readFileSync(p,'utf8'))[0].results;
          const saved=rd('/tmp/links-after.json'),payload=JSON.parse(fs.readFileSync('ops/metricool-safe-draft-snapshots-20261104.json'));
          for(const entry of payload.items){
            const x=saved.find(v=>v.post_id===entry.post_id);
            assert(x,entry.post_id);assert.equal(x.state,'pending_review');
            assert.equal(Number(x.metricool_id),entry.metricool_id);assert.equal(String(x.uuid),entry.uuid);
            assert.deepEqual(JSON.parse(x.template_json),entry.remote);
            assert.equal(JSON.parse(x.template_json).autoPublish,false);
            assert.equal(JSON.parse(x.template_json).draft,true);
          }
          assert.deepEqual(rd('/tmp/posts-after.json'),rd('/tmp/posts-before.json'),'Unpublished posts changed');
          assert.deepEqual(rd('/tmp/published-after.json'),rd('/tmp/published-before.json'),'Published posts changed');
          console.log('PASS D1 15 current remote safe drafts; 0 changed post fields, 0 publishing, published rows byte-for-byte unchanged');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xjw-metricool-safe-snapshot-reconcile-${{ github.run_id }}
          path: |
            /tmp/targets.json
            /tmp/links-after.json
          retention-days: 3
