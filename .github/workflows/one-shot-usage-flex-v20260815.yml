name: 仙加味 ERP／貼文中心 20260815 使用方式一次性更新
# rerun-v3-timing-only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-usage-flex-v20260815.yml'
permissions:
  contents: write
jobs:
  update-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply current usage rules
        run: python tools/apply-usage-flex-v20260815.py
      - name: Validate full ERP and publishing contracts
        run: |
          npm install
          npm run check
          npm run guard:full
          npm run build:static
      - name: Commit verified regular files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github tools/apply-usage-flex-v20260815.py || true
          if git diff --cached --quiet; then
            echo 'No verified regular-file changes to commit.'
            exit 0
          fi
          git commit -m 'fix(erp): use exact personal-routine product authority'
          git push origin HEAD:main
