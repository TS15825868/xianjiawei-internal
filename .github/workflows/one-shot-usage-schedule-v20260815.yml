name: one-shot ERP usage schedule 20260815
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-usage-schedule-v20260815.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply current product usage authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess, datetime

          workflow='.github/workflows/one-shot-usage-schedule-v20260815.yml'
          suffixes={'.js','.mjs','.json','.py','.txt','.md','.yml','.yaml','.html','.css','.sql'}
          replacements=[
            ('一般建議早上與下午各一小匙','可依個人使用習慣與作息時間安排'),
            ('建議早上與下午各一小匙','可依個人使用習慣與作息時間安排'),
            ('每日早上及下午各一小匙','可依個人使用習慣與作息時間安排'),
            ('建議白天飲用','可依個人使用習慣與作息時間飲用'),
            ('每日一罐','每日 1-2罐'),
            ('避免接近睡前食用','依個人作息彈性調整'),
          ]
          for rel in subprocess.check_output(['git','ls-files'],text=True).splitlines():
            if rel==workflow or Path(rel).suffix.lower() not in suffixes: continue
            p=Path(rel)
            try: old=p.read_text(encoding='utf-8')
            except Exception: continue
            new=old
            for a,b in replacements: new=new.replace(a,b)
            if new!=old: p.write_text(new,encoding='utf-8')

          status_path=Path('cloudflare-deploy-current-status.json')
          if status_path.exists():
            data=json.loads(status_path.read_text(encoding='utf-8'))
            auth=data.setdefault('current_product_authority',{})
            auth['guilu_gao_usage']='可依個人使用習慣與作息時間安排'
            auth['drink_30_usage']='每日 1-2罐｜可依個人使用習慣與作息時間飲用'
            auth['drink_180_usage']='可依個人使用習慣與作息時間飲用'
            data['updated_at_utc']='2026-08-14T16:28:00Z'
            status_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          current='\n'.join(p.read_text(encoding='utf-8',errors='ignore') for p in [status_path] if p.exists())
          assert '每日早上及下午各一小匙' not in current
          assert '每日 1-2罐' in current
          assert '可依個人使用習慣與作息時間安排' in current
          assert '可依個人使用習慣與作息時間飲用' in current
          PY
      - name: Validate ERP code
        shell: bash
        run: |
          set -e
          npm ci
          npm run check
          npm run guard:full
          npm run build:static
      - name: Commit update and remove one-shot workflow
        shell: bash
        run: |
          set -e
          rm -f .github/workflows/one-shot-usage-schedule-v20260815.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'No changes to commit'; exit 0; fi
          git commit -m 'fix: align ERP product usage with personal schedules'
          git push origin HEAD:main
