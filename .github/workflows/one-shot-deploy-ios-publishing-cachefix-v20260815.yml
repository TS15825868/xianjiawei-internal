name: One-shot deploy iOS Safari publishing cache fix

# Retry after aligning the existing regeneration cache authority with the new iOS cache-bust version.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-deploy-ios-publishing-cachefix-v20260815.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate and build
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run check
          npm run guard:full
          npm run build:static
      - name: Verify remote D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT 1 AS ok"
      - name: Deploy Worker
        run: npx wrangler deploy --keep-vars
      - name: Verify protected publishing route
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS --max-time 20 -o "$body" -w '%{http_code}' 'https://xianjiawei-internal.tung314069.workers.dev/publishing.html' || true)"
          test "$code" != '000'
          test "$code" -lt 500
          grep -Eiq '貼文審核發佈系統|<html|<!doctype|cloudflare|access|sign in|login' "$body"
