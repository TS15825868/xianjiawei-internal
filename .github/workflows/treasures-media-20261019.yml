name: Sync two treasures real photo galleries
on:
  push:
    branches: [main]
    paths: ['data/treasures-media-20261019.sql', '.github/workflows/treasures-media-20261019.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync-media:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Check published photos before changing ERP
        run: |
          node - <<'JS'
          const ids=['royalherb-erzhenbao-64','uboss-sizhenbao'];
          (async()=>{for(const id of ids)for(const role of ['front','open','back']){
            const r=await fetch(`https://ts15825868.github.io/xianjiawei/images/catalog-real-owner-v20261019/${id}-${role}.png`);
            if(!r.ok||!r.headers.get('content-type')?.includes('image/png'))throw Error('Photo unavailable');
          }})().catch(e=>{console.error(e.message);process.exitCode=1});
          JS
      - name: Apply media only and verify all operational fields preserved
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,data_json FROM app_records WHERE module='products' AND archived=0" > /tmp/before.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --file data/treasures-media-20261019.sql
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,data_json FROM app_records WHERE module='products' AND archived=0" > /tmp/after.json
          node - <<'JS'
          const fs=require('fs'),assert=require('assert/strict');
          const read=p=>JSON.parse(fs.readFileSync(p)).flatMap(x=>x.results||[]);
          const before=read('/tmp/before.json'),after=read('/tmp/after.json');assert.equal(before.length,after.length);
          const expected={'PRD-PARTNER-ROYALHERB-ERZHENBAO-64':'royalherb-erzhenbao-64','PRD-PARTNER-UBOSS-SIZHENBAO':'uboss-sizhenbao'};
          for(const old of before){const now=after.find(x=>x.id===old.id);assert.ok(now);const a=JSON.parse(old.data_json),b=JSON.parse(now.data_json);
            if(expected[old.id]){assert.equal(b.image_url,`https://ts15825868.github.io/xianjiawei/images/catalog-real-owner-v20261019/${expected[old.id]}-front.png`);assert.equal(b.gallery.length,3);delete a.image_url;delete b.image_url;delete a.gallery;delete b.gallery;}
            assert.deepEqual(b,a,'Non-media product fields changed');
          }
          for(const id of Object.keys(expected))assert.ok(after.some(p=>p.id===id),'Missing ERP product '+id);
          console.log('PASS two separate galleries; all non-media fields and records preserved');
          JS
