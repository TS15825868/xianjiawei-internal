name: Sync two treasures real photo galleries
on:
  push:
    branches: [main]
    paths: ['data/treasures-media-targets-20261019.json', 'tools/sync-treasures-media-20261019.cjs', '.github/workflows/treasures-media-20261019.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync-media:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Use current Wrangler for D1 remote import stability
        run: npm install --no-save --ignore-scripts --no-audit --no-fund --no-package-lock wrangler@4.151.1
      - name: Check published photos before changing ERP
        run: |
          node - <<'JS'
          const ids=['royalherb-erzhenbao-64','uboss-sizhenbao'];
          (async()=>{for(const id of ids)for(const role of ['front','open','back']){
            const r=await fetch(`https://ts15825868.github.io/xianjiawei/images/catalog-real-owner-v20261019/${id}-${role}.png`);
            if(!r.ok||!r.headers.get('content-type')?.includes('image/png'))throw Error('Photo unavailable');
          }})().catch(e=>{console.error(e.message);process.exitCode=1});
          JS
      - name: Apply media only and verify all operational fields preserved
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,data_json FROM app_records WHERE module='products' AND archived=0" > /tmp/before.json
          node tools/sync-treasures-media-20261019.cjs
          npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/treasures-media.sql
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,data_json FROM app_records WHERE module='products' AND archived=0" > /tmp/after.json
          node tools/sync-treasures-media-20261019.cjs --verify
