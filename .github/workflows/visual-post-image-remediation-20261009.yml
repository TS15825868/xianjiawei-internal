name: 仙加味不合格貼文圖片安全退回重製
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-post-image-remediation-20261009.yml'
      - 'ops/post-image-review-remediation-20261009.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xianjiawei-visual-rework-20261009
  cancel-in-progress: false
jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check authorized Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Read current D1 live post status, without secrets or PII
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_url FROM social_posts" > /tmp/live-posts-for-visual-remediation.json
      - name: Build nonpublished-only image rejection updates
        run: node tools/review-post-images-20261009.mjs
      - name: Move rejected images back to draft and archive retired products
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/remediate-images.sql
      - name: Verify no scheduled or published posts were edited
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_url,image_approved,image_quality_status FROM social_posts WHERE id LIKE 'XJW-CONV-%'" > /tmp/live-posts-after-remediation.json
          node - <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('ops/post-image-review-remediation-20261009.json','utf8'));
          const before=JSON.parse(fs.readFileSync('/tmp/remediate-report.json','utf8'));
          const raw=JSON.parse(fs.readFileSync('/tmp/live-posts-after-remediation.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          for(const item of before.applied){
            const row=rows.find(x=>x.id===item.id);
            if(!row||row.status!==item.status||row.image_url||Number(row.image_approved)!==0)throw Error('Failed D1 remediation verification: '+item.id);
          }
          console.log('PASS: verified '+before.applied.length+' targeted changes, '+before.skipped.length+' source-changed skips. No published or archived records targeted.');
          NODE
      - name: Preserve machine-readable remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-post-images-20261009
          path: /tmp/remediate-report.json
          if-no-files-found: ignore
          retention-days: 7
