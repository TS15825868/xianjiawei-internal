name: 仙加味已發布主題重複精準封存（無核准無發文）
on:
  push:
    branches: [main]
    paths: ['ops/request-published-topic-archive-20261107.json']
permissions:
  contents: read
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node ops/archive-published-topic-overlap-20261107.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-topic-archive-${{ github.run_id }}
          path: published-topic-archive-results.json
          retention-days: 7
