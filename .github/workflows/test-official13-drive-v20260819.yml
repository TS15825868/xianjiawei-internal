name: 診斷正式13圖 Drive 傳輸 20260819

on:
  push:
    branches: [main]
    paths:
      - 'assets/data/test-official13-drive-v20260819.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Drive download without failing workflow early
        shell: bash
        run: |
          set +e
          python -m pip install --quiet gdown
          rm -f /tmp/official13.zip
          gdown 'https://drive.google.com/uc?id=1q1i3kp6UVlOWQRQ2byyqDLpiG6zD_knB' -O /tmp/official13.zip >/tmp/gdown.out 2>/tmp/gdown.err
          rc=$?
          size=0
          sha=''
          kind='missing'
          if [ -f /tmp/official13.zip ]; then
            size=$(stat -c%s /tmp/official13.zip 2>/dev/null || echo 0)
            sha=$(sha256sum /tmp/official13.zip 2>/dev/null | awk '{print $1}')
            kind=$(file -b /tmp/official13.zip 2>/dev/null || true)
          fi
          mkdir -p audits
          {
            echo "tested_at=$(date -u +%FT%TZ)"
            echo "gdown_exit=$rc"
            echo "size=$size"
            echo "sha256=$sha"
            echo "file_type=$kind"
            echo "expected_size=635488"
            echo "expected_sha256=d1903805811b476b0ada677727f23b5d68f79ee334c6b6cb93303c285aeb5f3c"
            echo '--- stdout ---'
            cat /tmp/gdown.out 2>/dev/null || true
            echo '--- stderr ---'
            cat /tmp/gdown.err 2>/dev/null || true
          } > audits/official13-drive-transport-current.txt
          if [ "$rc" -eq 0 ] && [ "$size" -eq 635488 ] && [ "$sha" = 'd1903805811b476b0ada677727f23b5d68f79ee334c6b6cb93303c285aeb5f3c' ]; then
            echo 'result=PASS' >> audits/official13-drive-transport-current.txt
          else
            echo 'result=FAIL' >> audits/official13-drive-transport-current.txt
          fi
          exit 0
      - name: Commit diagnostic result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audits/official13-drive-transport-current.txt
          git commit -m 'audit(posts): record official13 Drive transport result' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
