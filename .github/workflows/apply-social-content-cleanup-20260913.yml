name: 仙加味貼文全面整理 20260913

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-social-content-cleanup-20260913.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-social-content-cleanup-20260913
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify preconditions
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT status,COUNT(*) AS count FROM social_posts GROUP BY status ORDER BY status" > before-counts.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('before-counts.json','utf8'));
          const rows=(Array.isArray(data)?data[0]?.results:data?.results)||[];
          const m=Object.fromEntries(rows.map(r=>[r.status,Number(r.count)]));
          if(m.published!==3) throw new Error(`published 預期3，實際${m.published}`);
          if(m.pending_review!==2) throw new Error(`pending_review 預期2，實際${m.pending_review}`);
          if(m.archived!==66) throw new Error(`archived 預期66，實際${m.archived}`);
          console.log('PASS preconditions',m);
          NODE
      - name: Apply formal content cleanup
        shell: bash
        run: |
          set -euo pipefail
          sed -E '/^(BEGIN TRANSACTION;|COMMIT;)$/d' ops/social-content-cleanup-20260913.sql > /tmp/social-content-cleanup-d1.sql
          npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/social-content-cleanup-d1.sql
      - name: Verify post cleanup
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT status,COUNT(*) AS count FROM social_posts GROUP BY status ORDER BY status" > current-social-post-counts.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,headline,copy,category,platforms_json,status,scheduled_at,proposed_scheduled_at,approved_by,approved_at,published_at,image_url,image_alt,image_source,image_approved,image_width,image_height,image_bytes,image_quality_status,rejection_reason,review_note,created_at,updated_at FROM social_posts ORDER BY CASE status WHEN 'pending_review' THEN 0 WHEN 'approved' THEN 1 WHEN 'scheduled' THEN 2 WHEN 'draft' THEN 3 WHEN 'published' THEN 4 ELSE 5 END, updated_at DESC, id ASC" > current-social-posts.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT COUNT(*) AS bad FROM social_posts WHERE status='archived' AND (image_url<>'' OR image_alt<>'' OR image_approved<>0 OR image_width<>0 OR image_height<>0 OR image_bytes<>0 OR proposed_scheduled_at IS NOT NULL)" > archived-clean.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,category,status,proposed_scheduled_at,image_url,image_approved FROM social_posts WHERE status='pending_review' ORDER BY id" > pending.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,title FROM social_posts WHERE status='published' ORDER BY id" > published.json
          node - <<'NODE'
          const fs=require('fs');
          const rows=f=>{const d=JSON.parse(fs.readFileSync(f,'utf8'));return (Array.isArray(d)?d[0]?.results:d?.results)||[]};
          const counts=Object.fromEntries(rows('current-social-post-counts.json').map(r=>[r.status,Number(r.count)]));
          if(counts.published!==3||counts.pending_review!==2||counts.archived!==66) throw new Error(`狀態筆數異常 ${JSON.stringify(counts)}`);
          const bad=Number(rows('archived-clean.json')[0]?.bad||0); if(bad!==0) throw new Error(`封存舊圖未清乾淨：${bad}`);
          const pending=rows('pending.json'); if(pending.length!==2) throw new Error('待審核不是2篇');
          if(pending.some(r=>r.status!=='pending_review'||r.proposed_scheduled_at!==null||!r.image_url||Number(r.image_approved)!==0)) throw new Error(`待審核狀態／排程／圖片異常 ${JSON.stringify(pending)}`);
          const published=rows('published.json');
          const ids=published.map(r=>r.id).sort();
          const expected=['POST-BRAND-START','POST-TRIAL-MAIN','XJW-SOCIAL-20260904-0900-FIRST'].sort();
          if(JSON.stringify(ids)!==JSON.stringify(expected)) throw new Error(`已發布貼文被改動集合：${JSON.stringify(ids)}`);
          console.log('PASS post cleanup',counts,pending.map(r=>r.id),ids);
          NODE
      - name: Upload verified snapshot
        uses: actions/upload-artifact@v4
        with:
          name: social-content-cleanup-verified-${{ github.run_id }}
          path: |
            before-counts.json
            current-social-post-counts.json
            current-social-posts.json
            archived-clean.json
            pending.json
            published.json
          if-no-files-found: error
          retention-days: 7
