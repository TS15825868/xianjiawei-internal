name: 仙加味三筆歷史公開圖片精準恢復（唯讀不發文）
on:
  push:
    branches: [main]
    paths: ['ops/request-three-public-historical-media-recovery-20261108.json']
permissions:
  contents: read
concurrency:
  group: xjw-three-public-history-media-recovery-readonly
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify only three known published public permalinks and their original media URLs
        run: node ops/recover-three-public-historical-media-20261108.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historic-public-three-${{ github.run_id }}
          path: historical-media-public-recovery-20261108/
          if-no-files-found: warn
          retention-days: 7
