name: 檢查 2026-09-07 社群排程狀態
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-social-state-20260907.yml']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝
        run: npm ci --no-audit --no-fund
      - name: 讀取正式 D1 排程與發布狀態
        run: |
          set -euo pipefail
          echo '=== 現在時間 ==='
          date -u
          TZ=Asia/Taipei date
          echo '=== 最近貼文 ==='
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT id,title,status,scheduled_at,published_at,approved_at,updated_at FROM social_posts ORDER BY datetime(updated_at) DESC LIMIT 20;"
          echo '=== 2026-09-07 到期或未來排程 ==='
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT id,title,status,scheduled_at,published_at,approved_at,image_approved FROM social_posts WHERE scheduled_at IS NOT NULL OR status IN ('approved','pending_review','draft','scheduled') ORDER BY CASE status WHEN 'scheduled' THEN 0 WHEN 'approved' THEN 1 WHEN 'pending_review' THEN 2 ELSE 3 END, datetime(scheduled_at) ASC, datetime(updated_at) DESC LIMIT 40;"
          echo '=== 最近平台 deliveries ==='
          npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT post_id,platform,status,attempt_count,last_attempt_at,published_at,remote_id,error_text,updated_at FROM social_publish_deliveries ORDER BY datetime(updated_at) DESC LIMIT 40;"
      - name: 清理一次性診斷流程
        if: always()
        run: |
          set -euo pipefail
          rm -f .github/workflows/diag-social-state-20260907.yml
          git config user.name 'TS15825868'
          git config user.email 'tung314069@gmail.com'
          git add .github/workflows/diag-social-state-20260907.yml
          if ! git diff --cached --quiet; then
            git commit -m '移除 2026-09-07 社群排程診斷流程'
            git push origin HEAD:main
          fi
