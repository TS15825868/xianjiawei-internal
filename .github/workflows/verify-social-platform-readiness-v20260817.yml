name: 仙加味貼文中心平台授權手動就緒檢查

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Require Cloudflare audit credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Read Worker binding names without exposing secret values
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/xianjiawei-internal/settings" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/settings.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/settings.json','utf8'));
          if(x.success!==true) throw new Error('Cloudflare Worker settings API failed');
          const bindings=x.result?.bindings||[];
          const names=new Set(bindings.map(b=>b.name));
          const has=n=>names.has(n);
          const pair=(a,b)=>has(a)&&has(b);
          const ready={
            Facebook:(has('META_PAGE_ID')&&has('META_PAGE_ACCESS_TOKEN'))||pair('FACEBOOK_PUBLISH_WEBHOOK_URL','FACEBOOK_PUBLISH_WEBHOOK_TOKEN'),
            Instagram:(has('META_INSTAGRAM_USER_ID')&&has('META_PAGE_ACCESS_TOKEN'))||pair('INSTAGRAM_PUBLISH_WEBHOOK_URL','INSTAGRAM_PUBLISH_WEBHOOK_TOKEN'),
            'LINE OA':has('LINE_CHANNEL_ACCESS_TOKEN')||pair('LINE_OA_PUBLISH_WEBHOOK_URL','LINE_OA_PUBLISH_WEBHOOK_TOKEN'),
            'LINE VOOM':false,
            'Google 商家':['GOOGLE_OAUTH_CLIENT_ID','GOOGLE_OAUTH_CLIENT_SECRET','GOOGLE_OAUTH_REFRESH_TOKEN','GOOGLE_BUSINESS_ACCOUNT_ID','GOOGLE_BUSINESS_LOCATION_ID'].every(has)||pair('GOOGLE_BUSINESS_PUBLISH_WEBHOOK_URL','GOOGLE_BUSINESS_PUBLISH_WEBHOOK_TOKEN')
          };
          console.log('PLATFORM_READINESS '+JSON.stringify(ready));
          console.log('SAFE_BINDING_NAMES '+bindings.filter(b=>/META_|LINE_|GOOGLE_|PUBLISH_WEBHOOK/.test(b.name||'')).map(b=>`${b.name}:${b.type}`).sort().join(','));
          NODE
