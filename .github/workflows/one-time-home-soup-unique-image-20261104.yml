name: XJW safe one-time unpublished home-soup media bind
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-home-soup-unique-image-20261104.yml']
permissions:
  contents: write
concurrency:
  group: xianjiawei-post-image-queue-write
  cancel-in-progress: false
jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IMAGE_SOURCE_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/2d6703c3-e700-45a7-9257-579a635f3dd9.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDIzNmY1ZDI4ZGE5ZWNhYyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzkyNzUwNn0.6S-WY9RlItiE_4UW4yAjfWJjUY4E1eJzdQ8GV3DStmo"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read current unpublished draft and protect all published records
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts WHERE id IN ('XJW-CONV-chat-home-soup','XJW-20913aa0-9cfb-49f0-acae-15005a51bbaa')" >/tmp/target-before.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts WHERE status='published' ORDER BY id" >/tmp/published-before.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id FROM social_posts WHERE image_url LIKE '%XJW-CONV-chat-home-soup-unique-poll-v2.png%'" >/tmp/image-refs-before.json
          node - <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const rows=f=>JSON.parse(fs.readFileSync(f,'utf8'))[0].results;
          const before=rows('/tmp/target-before.json');
          const draft=before.find(x=>x.id==='XJW-CONV-chat-home-soup');
          const published=before.find(x=>x.id==='XJW-20913aa0-9cfb-49f0-acae-15005a51bbaa');
          assert(draft && draft.status==='draft' && !String(draft.image_url||'').trim() && !draft.published_at && !draft.scheduled_at && !draft.approved_by,'Draft changed or image already bound');
          assert(published && published.status==='published' && String(published.image_url||'').endsWith('XJW-CONV-chat-home-soup-safety-v1.png'),'Published source unexpectedly changed');
          assert.equal(crypto.createHash('sha256').update(draft.copy||'').digest('hex'),'c2341f1e89644920f1f989352f529c27b76a0604bffb157a941b5a87a8c5df93','Draft copy changed');
          assert.equal(rows('/tmp/image-refs-before.json').length,0,'New image path already referenced');
          fs.writeFileSync('/tmp/draft-exact.json',JSON.stringify(draft));
          console.log('PASS exact unpublished draft, unchanged copy and published record guard');
          NODE
      - name: Transfer exact existing image and verify bytes, dimensions and repository dedupe
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --retry-delay 1 "$IMAGE_SOURCE_URL" -o /tmp/xjw-home-soup-new.png
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),assert=require('assert/strict'),path=require('path');
          const p='/tmp/xjw-home-soup-new.png',b=fs.readFileSync(p);
          assert.equal(b.length,2526233,'Source size changed');
          const sha=crypto.createHash('sha256').update(b).digest('hex');
          assert.equal(sha,'64bae2fc141179eb291c5bd5491591e4d8621ed96fb2f19dbd04f7b79e1e3dd3','Source bytes do not match checked image');
          assert.equal(b.subarray(0,8).toString('hex'),'89504e470d0a1a0a');
          assert.equal(b.readUInt32BE(16),1254);assert.equal(b.readUInt32BE(20),1254);
          const pathToFile='assets/post-images/2026-11-04/candidates/XJW-CONV-chat-home-soup-unique-poll-v2.png';
          assert(!fs.existsSync(pathToFile),'Candidate already exists; abort rather than overwrite');
          let equal=[];
          function scan(dir){if(!fs.existsSync(dir))return;for(const e of fs.readdirSync(dir,{withFileTypes:true})){const f=path.join(dir,e.name);if(e.isDirectory())scan(f);else if(e.isFile() && /\.(png|jpg|jpeg|webp)$/i.test(f) && fs.statSync(f).size===b.length && crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex')===sha)equal.push(f);}}
          scan('assets/post-images');assert.equal(equal.length,0,'Image already exists in archive');
          fs.mkdirSync(path.dirname(pathToFile),{recursive:true});
          fs.copyFileSync(p,pathToFile);
          console.log('PASS exact 1254x1254 original PNG, SHA256 and no exact GitHub image duplicates');
          NODE
      - name: Commit image only; skip unrelated deployment workflows
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main advanced, abort safely' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/post-images/2026-11-04/candidates/XJW-CONV-chat-home-soup-unique-poll-v2.png
          git commit -m 'media: preserve unique unapproved home-soup image [skip ci]'
          git push origin HEAD:main
      - name: Verify exact GitHub raw media bytes before updating D1
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/TS15825868/xianjiawei-internal/main/assets/post-images/2026-11-04/candidates/XJW-CONV-chat-home-soup-unique-poll-v2.png'
          for attempt in 1 2 3 4; do
            curl --fail --location --silent --show-error "$url" -o /tmp/xjw-github-raw.png && break
            sleep 3
          done
          printf '%s  %s\n' '64bae2fc141179eb291c5bd5491591e4d8621ed96fb2f19dbd04f7b79e1e3dd3' '/tmp/xjw-github-raw.png' | sha256sum -c -
      - name: Guarded update of ONLY the unposted draft; preserve AI/human approval gates
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const old=JSON.parse(fs.readFileSync('/tmp/draft-exact.json','utf8'));
          const q=v=>"'"+String(v??'').replaceAll("'","''")+"'";
          const url='https://raw.githubusercontent.com/TS15825868/xianjiawei-internal/main/assets/post-images/2026-11-04/candidates/XJW-CONV-chat-home-soup-unique-poll-v2.png';
          const alt='仙加味小老闆在居家餐桌介紹排骨、白蘿蔔、玉米、香菇等煮湯食材；小鹿與小烏龜分開陪伴，邀請讀者分享家常煮湯習慣';
          const evidence={postId:old.id,previousStatus:old.status,previousImageUrl:old.image_url,previousImageAlt:old.image_alt,previousImageSource:old.image_source,previousUpdatedAt:old.updated_at};
          const after={newUrl:url,sha256:'64bae2fc141179eb291c5bd5491591e4d8621ed96fb2f19dbd04f7b79e1e3dd3',imageApproval:false,aiApproval:false,humanApproval:false,autoPublish:false,manualReviewRequired:true};
          const auditId='XJW-IMG-DRAFT-HOME-SOUP-20261104-'+crypto.createHash('sha256').update(url).digest('hex').slice(0,10);
          const sql=[
            "UPDATE social_posts SET image_url="+q(url)+",media_id=NULL,image_alt="+q(alt)+",image_source="+q('仙加味正式原創插畫｜GitHub main｜AI 圖文及人工待覆核')+
            ",image_width=1254,image_height=1254,image_bytes=2526233,image_quality_status='needs_review',image_approved=0,status='pending_review',approved_by=NULL,approved_at=NULL,scheduled_at=NULL,updated_at=datetime('now') WHERE id="+q(old.id)+" AND status='draft' AND TRIM(COALESCE(image_url,''))='' AND published_at IS NULL AND scheduled_at IS NULL AND approved_by IS NULL AND updated_at="+q(old.updated_at)+" AND copy="+q(old.copy)+";",
            "INSERT INTO audit_logs(id,actor_email,action,entity_type,entity_id,before_json,after_json,ip) SELECT "+[auditId,'system:safe-image-binder','缺圖草稿補入專屬圖，待正式圖文審核','貼文',old.id,JSON.stringify(evidence),JSON.stringify(after),''].map(q).join(',')+" WHERE changes()=1;"
          ];
          fs.writeFileSync('/tmp/xjw-home-soup-guarded.sql',sql.join('\n')+'\n');
          NODE
          npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/xjw-home-soup-guarded.sql
      - name: Read back exact current post, published posts and audit evidence
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_url,image_quality_status,image_approved,published_at,approved_by,scheduled_at FROM social_posts WHERE id='XJW-CONV-chat-home-soup'" >/tmp/after.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT * FROM social_posts WHERE status='published' ORDER BY id" >/tmp/published-after.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,entity_id,action FROM audit_logs WHERE id LIKE 'XJW-IMG-DRAFT-HOME-SOUP-20261104-%'" >/tmp/audit-after.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT status,COUNT(*) count FROM social_posts WHERE status<>'archived' GROUP BY status ORDER BY status" >/tmp/counts-after.json
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert/strict');
          const rows=f=>JSON.parse(fs.readFileSync(f,'utf8'))[0].results;
          const actual=rows('/tmp/after.json');assert.equal(actual.length,1);
          const x=actual[0];assert.equal(x.id,'XJW-CONV-chat-home-soup');
          assert.equal(x.status,'pending_review');assert.equal(x.image_quality_status,'needs_review');assert.equal(Number(x.image_approved),0);
          assert(String(x.image_url).endsWith('XJW-CONV-chat-home-soup-unique-poll-v2.png'));
          assert(!x.approved_by&&!x.published_at&&!x.scheduled_at);
          assert.deepEqual(rows('/tmp/published-after.json'),rows('/tmp/published-before.json'),'Published posts changed');
          assert.equal(rows('/tmp/audit-after.json').length,1,'Audit receipt missing');
          console.log('PASS D1 guarded draft bind and readback. Published rows unchanged. Still needs 16-check review and human approval.');
          console.log('D1 active counts',JSON.stringify(rows('/tmp/counts-after.json')));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-soup-unique-unpublished-bind-\${{ github.run_id }}
          path: |
            /tmp/after.json
            /tmp/counts-after.json
            /tmp/audit-after.json
          retention-days: 3
