name: GitHub Actions 免費執行狀態確認
on:
  push:
    branches: [main]
    paths:
      - 'assets/data/actions-heartbeat-v20260818.trigger'
permissions:
  contents: write
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Record heartbeat
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/data
          printf 'PASS GitHub Actions heartbeat %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > assets/data/actions-heartbeat-v20260818.ok
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/actions-heartbeat-v20260818.ok
          git commit -m 'PASS: GitHub Actions heartbeat'
          git pull --rebase origin main
          git push origin HEAD:main
