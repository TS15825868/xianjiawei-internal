name: 仙加味剩餘66篇正式圖文同步貼文中心

on:
  push:
    branches: [main]
    paths:
      - 'assets/data/remainder66-release-v20260817.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install D1 tooling
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Fetch website authorities and validate content
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/urls.txt
          const r=JSON.parse(require('fs').readFileSync('assets/data/remainder66-release-v20260817.json','utf8'));
          console.log(r.authority_url); console.log(r.priority10_authority_url);
          NODE
          sed -n '1p' /tmp/urls.txt | xargs -I{} curl -fsSL --retry 6 --retry-delay 3 '{}' -o /tmp/remainder66.json
          sed -n '2p' /tmp/urls.txt | xargs -I{} curl -fsSL --retry 6 --retry-delay 3 '{}' -o /tmp/priority10.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/remainder66.json','utf8'));
          const p=JSON.parse(fs.readFileSync('/tmp/priority10.json','utf8'));
          if(r.count!==66||r.posts?.length!==66) throw new Error(`remainder count ${r.count}/${r.posts?.length}`);
          if(p.count!==10||p.posts?.length!==10) throw new Error(`priority count ${p.count}/${p.posts?.length}`);
          const ids=new Set(r.posts.map(x=>x.id)); const pids=new Set(p.posts.map(x=>x.id));
          if(ids.size!==66) throw new Error(`remainder IDs ${ids.size}`);
          if(ids.has('POST-BRAND-START')) throw new Error('published history included');
          for(const id of ids) if(pids.has(id)) throw new Error(`overlap ${id}`);
          const titles=new Set(),copies=new Set(),images=new Set();
          for(const x of r.posts){
            if(!x.copy?.includes('仙加味')) throw new Error(`${x.id}: no brand link`);
            if(!x.scene||!Array.isArray(x.bullets)||x.bullets.length<3) throw new Error(`${x.id}: no concrete scene`);
            if((x.title+x.copy+x.image_alt).includes('台興山產')) throw new Error(`${x.id}: blocked name`);
            if(!x.image_url?.includes('/images/posts/remainder66-v20260817/')) throw new Error(`${x.id}: wrong image release`);
            if(titles.has(x.title)||copies.has(x.copy)||images.has(x.image_url)) throw new Error(`${x.id}: duplicate within remainder`);
            titles.add(x.title); copies.add(x.copy); images.add(x.image_url);
          }
          for(const x of p.posts){
            if(titles.has(x.title)||copies.has(x.copy)||images.has(x.image_url)) throw new Error(`${x.id}: collision with priority10`);
          }
          console.log('PASS authorities: 66+10 no overlap, unique copy/image, concrete scenes');
          NODE
          node - <<'NODE' > /tmp/image-urls.txt
          const r=JSON.parse(require('fs').readFileSync('/tmp/remainder66.json','utf8'));
          for(const x of r.posts) console.log(x.image_url);
          NODE
          while IFS= read -r u; do curl -fsSL --retry 5 --retry-delay 2 -o /dev/null "$u"; done < /tmp/image-urls.txt
      - name: Build guarded D1 update SQL
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/remainder66.json','utf8'));
          const q=v=>`'${String(v??'').replaceAll("'","''")}'`;
          const sql=[];
          for(const x of r.posts){
            sql.push(`UPDATE social_posts SET title=${q(x.title)}, headline=${q(x.title)}, copy=${q(x.copy)}, category=${q(x.category)}, image_url=${q(x.image_url)}, image_alt=${q(x.image_alt)}, image_source=${q(x.image_source)}, status='pending_review', image_approved=0, review_note='2026-08-17 剩餘66篇正式重做：明確生活場景＋網站同款Q版小老闆＋正式產品實物；回待審核。', rejection_reason='', approved_by=NULL, approved_at=NULL, scheduled_at=NULL, updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now') WHERE id=${q(x.id)} AND status<>'published';`);
          }
          if(sql.length!==66) throw new Error(`sql ${sql.length}`);
          fs.writeFileSync('/tmp/apply-remainder66.sql',sql.join('\n')+'\n');
          console.log('PASS built 66 guarded updates');
          NODE
      - name: Apply to production D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/apply-remainder66.sql
      - name: Verify complete 77-post production library
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,headline,copy,category,status,image_url,image_alt,image_source FROM social_posts WHERE status <> 'archived' ORDER BY created_at,id" > /tmp/live.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/remainder66.json','utf8'));
          const p=JSON.parse(fs.readFileSync('/tmp/priority10.json','utf8'));
          const raw=JSON.parse(fs.readFileSync('/tmp/live.json','utf8'));
          const rows=raw.flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          if(rows.length!==77) throw new Error(`live total ${rows.length}`);
          const byId=new Map(rows.map(x=>[x.id,x]));
          const brand=byId.get('POST-BRAND-START');
          if(!brand||brand.status!=='published') throw new Error('published history not preserved');
          for(const x of [...p.posts,...r.posts]){
            const row=byId.get(x.id); if(!row) throw new Error(`${x.id}: missing`);
            if(row.status!=='pending_review') throw new Error(`${x.id}: status ${row.status}`);
            if(row.copy!==x.copy) throw new Error(`${x.id}: copy mismatch`);
            if(row.image_url!==x.image_url) throw new Error(`${x.id}: image mismatch`);
          }
          const working=rows.filter(x=>x.id!=='POST-BRAND-START');
          if(working.length!==76||working.some(x=>x.status!=='pending_review')) throw new Error('76 working posts not all pending_review');
          const titles=new Set(rows.map(x=>x.title)); const copies=new Set(rows.map(x=>x.copy)); const images=new Set(rows.map(x=>x.image_url));
          if(titles.size!==77) throw new Error(`global title uniqueness ${titles.size}/77`);
          if(copies.size!==77) throw new Error(`global copy uniqueness ${copies.size}/77`);
          if(images.size!==77) throw new Error(`global image uniqueness ${images.size}/77`);
          if(rows.some(x=>(x.title+x.headline+x.copy+x.image_alt).includes('台興山產'))) throw new Error('blocked public name live');
          if(working.some(x=>!x.copy.includes('仙加味'))) throw new Error('working post missing brand link');
          const old=working.filter(x=>x.image_url.includes('/rebuild-v20260816/'));
          if(old.length) throw new Error(`old working visuals ${old.length}`);
          console.log('PASS D1: total77; published history1; redesigned pending_review76; copy/image/title unique77; old working visuals0; blocked name0');
          NODE
