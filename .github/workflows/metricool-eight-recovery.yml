name: 仙加味歷史八篇Metricool復原｜唯讀安全查核
# This 2026-10-13 one-time recovery is obsolete. Its old manifest includes
# past autoPublish=true remote templates and must never be replayed against D1.
# Do not delete original manifests or ledger: retain as historical evidence.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate historical evidence locally without database or remote API
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/apply-metricool-eight-recovery.cjs
          node --check tools/verify-metricool-eight-recovery.cjs
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const m=JSON.parse(fs.readFileSync('ops/metricool-eight-recovery-20261013.json','utf8'));
          assert.equal(m.batch,'20261013-eight-recovery');
          assert.equal(m.posts.length,8);
          assert.equal(new Set(m.posts.map(x=>x.uuid)).size,8);
          const yaml=fs.readFileSync('.github/workflows/metricool-eight-recovery.yml','utf8');
          assert.match(yaml,/workflow_dispatch:/);
          assert.doesNotMatch(yaml,/^\s*(?:push:|CLOUDFLARE_API_TOKEN:|npx wrangler\b|node tools\/apply-metricool-eight-recovery\.cjs\b)/m);
          console.log('PASS historical 8-post recovery cannot schedule or publish');
          NODE
