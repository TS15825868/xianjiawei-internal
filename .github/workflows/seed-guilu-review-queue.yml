name: 仙加味龜鹿內容母庫手動送待審核

# 只有 Cloudflare D1 正式憑證存在時才執行。
# 平常不因 push 自動跑，避免缺憑證時出現誤導性的綠色 success。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-guilu-review-seed
  cancel-in-progress: true

jobs:
  seed-review-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require Cloudflare D1 credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }
          echo 'PASS: Cloudflare D1 credentials are configured.'

      - name: Install Wrangler
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Validate topic bank and build idempotent D1 seed
        run: |
          node tools/build-guilu-review-seed.mjs > /tmp/guilu-review-seed.sql
          count="$(grep -c 'INSERT OR IGNORE INTO social_posts' /tmp/guilu-review-seed.sql)"
          test "$count" -eq 28
          echo "PASS: 28篇已有正式圖片的龜鹿內容通過品牌、字詞、圖片來源與去重規則。"

      - name: Verify remote D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT 1 AS ok"

      - name: Seed complete topics into pending review
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/guilu-review-seed.sql

      - name: Verify review queue
        run: |
          result="$(npx wrangler d1 execute xianjiawei-internal-db --remote --command \"SELECT status,COUNT(*) AS count FROM social_posts WHERE id LIKE 'XJW-GUILU-%' GROUP BY status ORDER BY status\")"
          echo "$result"
          echo "$result" | grep -q 'pending_review'
          echo 'PASS: 龜鹿母庫已建立待審核內容；未自動核准、未排程、未發布。'

      - name: Summary
        if: always()
        run: |
          echo '只使用 seedToReview=true 且具有正式網站圖片來源的題目。'
          echo 'INSERT OR IGNORE 保證重跑不重複灌入同一題目，也不覆蓋人工修改後的既有貼文。'
