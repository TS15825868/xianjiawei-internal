name: 仙加味龜鹿內容母庫手動送待審核

# 只有 Cloudflare D1 正式憑證存在且人工觸發時才執行。
# 不因 push 自動跑；題數依目前 seedToReview=true 的正式題庫動態決定，不鎖歷史固定張數。
# 已核准、已排程、已發布內容不覆寫；只新增或同步 draft／pending_review。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-guilu-review-seed
  cancel-in-progress: true

jobs:
  seed-review-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      XJW_CONTENT_SEED_CREATED_BY: tung314069@gmail.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require Cloudflare D1 credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }
          echo 'PASS: Cloudflare D1 credentials are configured.'

      - name: Install Wrangler and validate current contracts
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run check
          npm run guard:full

      - name: Validate current topic bank and build safe idempotent D1 seed
        shell: bash
        run: |
          set -euo pipefail
          XJW_CONTENT_SEED_CREATED_BY="$XJW_CONTENT_SEED_CREATED_BY" node tools/build-guilu-review-seed.mjs > /tmp/guilu-review-seed.sql
          actual="$(grep -c '^INSERT INTO social_posts(' /tmp/guilu-review-seed.sql)"
          upserts="$(grep -c '^  ON CONFLICT(id) DO UPDATE SET' /tmp/guilu-review-seed.sql)"
          expected="$(node - <<'NODE'
          const fs=require('fs');
          const bank=JSON.parse(fs.readFileSync('assets/data/guilu-content-topic-bank-v20260814.json','utf8'));
          process.stdout.write(String((bank.topics||[]).filter(x=>x&&x.seedToReview===true).length));
          NODE
          )"
          test "$expected" -gt 0
          test "$actual" -eq "$expected"
          test "$upserts" -eq "$expected"
          grep -Fq "WHERE social_posts.status IN ('draft','pending_review')" /tmp/guilu-review-seed.sql
          if grep -Fq 'INSERT OR IGNORE INTO social_posts' /tmp/guilu-review-seed.sql; then
            echo 'ERROR: social_posts seed must not silently ignore CHECK/FK errors.' >&2
            exit 1
          fi
          echo "PASS: current ${expected} image-ready topics produce safe pending-review upserts."

      - name: Verify remote D1 schema and creator
        shell: bash
        run: |
          set -euo pipefail
          schema="$(npx wrangler d1 execute xianjiawei-internal-db --remote --command \"SELECT sql FROM sqlite_master WHERE type='table' AND name='social_posts'; SELECT email,active FROM profiles WHERE email='${XJW_CONTENT_SEED_CREATED_BY}' LIMIT 1;\")"
          echo "$schema"
          echo "$schema" | grep -q 'pending_review'
          echo "$schema" | grep -q 'manual_required'
          echo "$schema" | grep -q 'failed'
          echo "$schema" | grep -q "$XJW_CONTENT_SEED_CREATED_BY"
          echo 'PASS: remote D1 status schema and seed creator are valid.'

      - name: Seed current complete topics into pending review
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/guilu-review-seed.sql

      - name: Verify review queue and media authority
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute xianjiawei-internal-db --remote --command \"SELECT status,COUNT(*) AS count FROM social_posts WHERE id LIKE 'XJW-GUILU-%' GROUP BY status ORDER BY status; SELECT COUNT(*) AS products_v3_live FROM social_posts WHERE id LIKE 'XJW-GUILU-%' AND image_url LIKE '%/images/products-v3/%'; SELECT COUNT(*) AS stale_count FROM social_posts WHERE id LIKE 'XJW-GUILU-%' AND status IN ('draft','pending_review') AND (copy LIKE '%早上及下午各一小匙%' OR copy LIKE '%75g／盒、8塊裝%' OR copy LIKE '%600g（1斤）%' OR copy LIKE '%每塊約18.75g%');\")"
          echo "$result"
          echo "$result" | grep -q 'pending_review'
          echo "$result" | grep -Eq 'products_v3_live[^0-9]*0|products_v3_live[[:space:]]+0'
          echo "$result" | grep -Eq 'stale_count[^0-9]*0|stale_count[[:space:]]+0'
          echo 'PASS: current龜鹿母庫位於待審核；目前產品圖角色正確、退役規格／固定時段為0；未自動核准、未排程、未發布。'

      - name: Summary
        if: always()
        run: |
          echo '只使用目前 seedToReview=true 且具有目前正式網站圖片來源的題目。'
          echo 'social_posts 使用安全 upsert：只新增或同步 draft／pending_review；已核准、已排程、已發布內容不覆寫。'
          echo '任何 CHECK／FK 錯誤會直接失敗，不再使用 INSERT OR IGNORE 靜默吞錯。'
