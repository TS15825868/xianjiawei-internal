name: 仙加味內容母庫與社群批次同步待審核

# 只把「文案＋正式配圖都完整」的內容寫入 Cloudflare D1 待審核。
# 新 social-batch／母庫內容 push 到 main 時自動執行；也保留人工手動同步。
# 不自動核准、不自動排程、不自動發布；已核准、已排程、已發布內容不覆寫。
# 顧客可見文字包含標題、主標、文案與圖片替代文字；全部都要通過重複、內部字樣與公開用語檢查。
on:
  push:
    branches: [main]
    paths:
      - 'assets/data/social-batch-*.json'
      - 'assets/data/guilu-content-topic-bank-v20260814.json'
      - 'tools/build-social-batches-review-seed.mjs'
      - 'tools/build-guilu-review-seed.mjs'
      - 'tools/build-guilu-draft-seed.mjs'
      - '.github/workflows/seed-guilu-review-queue.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-review-seed
  cancel-in-progress: true

jobs:
  seed-review-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      XJW_CONTENT_SEED_CREATED_BY: tung314069@gmail.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require Cloudflare D1 credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }
          echo 'PASS: Cloudflare D1 credentials are configured.'

      - name: Install Wrangler and validate current contracts
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run check
          npm run guard:full

      - name: Build guilu bank and social batch seeds
        shell: bash
        run: |
          set -euo pipefail
          XJW_CONTENT_SEED_CREATED_BY="$XJW_CONTENT_SEED_CREATED_BY" node tools/build-guilu-review-seed.mjs > /tmp/guilu-review-seed.sql
          XJW_CONTENT_SEED_CREATED_BY="$XJW_CONTENT_SEED_CREATED_BY" node tools/build-guilu-draft-seed.mjs > /tmp/guilu-draft-seed.sql
          XJW_CONTENT_SEED_CREATED_BY="$XJW_CONTENT_SEED_CREATED_BY" node tools/build-social-batches-review-seed.mjs > /tmp/social-batches-review-seed.sql

          review_actual="$(grep -c '^INSERT INTO social_posts(' /tmp/guilu-review-seed.sql)"
          draft_actual="$(grep -c '^INSERT INTO social_posts(' /tmp/guilu-draft-seed.sql)"
          social_actual="$(grep -c '^INSERT INTO social_posts(' /tmp/social-batches-review-seed.sql)"

          read -r expected_review expected_draft expected_total expected_social <<EOF
          $(node - <<'NODE'
          const fs=require('fs');
          const bank=JSON.parse(fs.readFileSync('assets/data/guilu-content-topic-bank-v20260814.json','utf8'));
          const topics=(bank.topics||[]).filter(Boolean);
          const activeTopics=topics.filter(x=>x.queueEnabled!==false);
          const review=activeTopics.filter(x=>x.seedToReview===true).length;
          const draft=activeTopics.filter(x=>x.seedToReview!==true&&x.imageMode==='context_required').length;
          const batchFiles=fs.readdirSync('assets/data').filter(x=>/^social-batch-\d{8}-\d{2}\.json$/.test(x));
          const social=batchFiles.reduce((sum,file)=>sum+((JSON.parse(fs.readFileSync(`assets/data/${file}`,'utf8')).posts||[]).length),0);
          process.stdout.write(`${review} ${draft} ${activeTopics.length} ${social}`);
          NODE
          )
          EOF

          test "$expected_review" -gt 0
          test "$expected_draft" -gt 0
          test "$expected_social" -gt 0
          test "$review_actual" -eq "$expected_review"
          test "$draft_actual" -eq "$expected_draft"
          test "$social_actual" -eq "$expected_social"
          test "$((expected_review+expected_draft))" -eq "$expected_total"
          grep -Fq "WHERE social_posts.status IN ('draft','pending_review')" /tmp/guilu-review-seed.sql
          grep -Fq "WHERE social_posts.status='draft'" /tmp/guilu-draft-seed.sql
          grep -Fq "WHERE social_posts.status IN ('draft','pending_review')" /tmp/social-batches-review-seed.sql
          if grep -Fq 'INSERT OR IGNORE INTO social_posts' /tmp/guilu-review-seed.sql /tmp/guilu-draft-seed.sql /tmp/social-batches-review-seed.sql; then
            echo 'ERROR: social_posts seed must surface CHECK/FK errors.' >&2
            exit 1
          fi
          echo "PASS: guilu ${expected_total} active topics + social ${expected_social} posts are safe, deduplicated, and idempotent."

      - name: Verify remote D1 schema and creator
        shell: bash
        run: |
          set -euo pipefail
          schema="$(npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='social_posts'; SELECT email,active FROM profiles WHERE email='${XJW_CONTENT_SEED_CREATED_BY}' LIMIT 1;")"
          echo "$schema"
          echo "$schema" | grep -q 'pending_review'
          echo "$schema" | grep -q 'manual_required'
          echo "$schema" | grep -q 'failed'
          echo "$schema" | grep -q "$XJW_CONTENT_SEED_CREATED_BY"
          echo 'PASS: remote D1 status schema and seed creator are valid.'

      - name: Seed guilu image-ready topics into pending review
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/guilu-review-seed.sql

      - name: Seed guilu image-needed topics as drafts only
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/guilu-draft-seed.sql

      - name: Seed social production batches into pending review
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/social-batches-review-seed.sql

      - name: Verify current bank and social batch coverage
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT COUNT(*) AS guilu_total FROM social_posts WHERE id LIKE 'XJW-GUILU-%'; SELECT status,COUNT(*) AS count FROM social_posts WHERE id LIKE 'XJW-GUILU-%' GROUP BY status ORDER BY status; SELECT COUNT(*) AS social_total FROM social_posts WHERE id LIKE 'XJW-SOCIAL-%'; SELECT status,COUNT(*) AS count FROM social_posts WHERE id LIKE 'XJW-SOCIAL-%' GROUP BY status ORDER BY status; SELECT COUNT(*) AS products_v3_live FROM social_posts WHERE (id LIKE 'XJW-GUILU-%' OR id LIKE 'XJW-SOCIAL-%') AND status IN ('draft','pending_review') AND image_url LIKE '%/images/products-v3/%'; SELECT COUNT(*) AS stale_count FROM social_posts WHERE status IN ('draft','pending_review','approved','scheduled') AND (copy LIKE '%每日早上及下午各一小匙%' OR copy LIKE '%建議白天飲用%' OR copy LIKE '%30cc／瓶%' OR copy LIKE '%30cc玻璃瓶%' OR copy LIKE '%舊的300g%');")"
          echo "$result"
          echo "$result" | grep -q 'social_total'
          echo "$result" | grep -Eq 'products_v3_live[^0-9]*0|products_v3_live[[:space:]]+0'
          echo "$result" | grep -Eq 'stale_count[^0-9]*0|stale_count[[:space:]]+0'
          echo 'PASS: 文案＋正式配圖內容已同步至待審核；缺圖母庫內容仍停草稿；未自動核准、排程或發布。'

      - name: Verify live customer-facing copy is clean and duplicate-free
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,headline,copy,status,image_alt FROM social_posts WHERE status<>'archived' ORDER BY id;" > /tmp/live-posts.json
          node - <<'NODE'
          const fs=require('fs');
          const blocks=JSON.parse(fs.readFileSync('/tmp/live-posts.json','utf8'));
          const rows=blocks.flatMap(block=>block.results||[]);
          const internal=[
            '待審核','人工審核','16項','核准','不自動排程','不自動發布','貼文中心','發布中心','ERP','products-v3','守門員','母庫','資料庫','D1','Worker','GitHub','Workflow','候選圖','回填','重新生成','ChatGPT','不重畫','圖片呈現時','看圖片時','產品圖片','版面效果','產品本體','誤畫','正式原圖','正式產品原圖','正式比例','正式包裝','目前正式','最新確認','此類貼文需確認','舊的300g','舊版','debug','TODO','placeholder','假資料','Cloudflare','API Token','Secret','Repository','Repo','commit','deploy','部署','快取版本','測試資料','內部檢查','客戶實際會看到的文案','產品原圖','正式資訊','正式說明'
          ];
          const publicBlocked=['治療','治癒','療效','改善疾病','預防疾病','保證功效','保證改善','藥到病除','關節','卡卡','疲勞','精神不濟','補氣','生津','膠原蛋白','鈣質'];
          const norm=value=>String(value||'').normalize('NFKC').toLowerCase().replace(/仙加味\s*[｜|]?\s*補養，是一種節奏。?/g,'').replace(/[^\p{L}\p{N}]+/gu,'');
          const bigrams=s=>{const out=new Map();for(let i=0;i<s.length-1;i++){const k=s.slice(i,i+2);out.set(k,(out.get(k)||0)+1)}return out};
          const dice=(a,b)=>{if(!a||!b)return 0;if(a===b)return 1;const A=bigrams(a),B=bigrams(b);let ai=0,bi=0,hit=0;for(const n of A.values())ai+=n;for(const n of B.values())bi+=n;for(const [k,n] of A)hit+=Math.min(n,B.get(k)||0);return ai+bi?2*hit/(ai+bi):0};
          const leaks=[];
          for(const row of rows){
            const text=[row.title,row.headline,row.copy,row.image_alt].filter(Boolean).join(' ');
            const lower=text.toLowerCase();
            const hits=[...internal,...publicBlocked].filter(term=>lower.includes(term.toLowerCase()));
            if(hits.length)leaks.push({id:row.id,hits:[...new Set(hits)]});
          }
          const duplicates=[];
          for(let i=0;i<rows.length;i++){
            const a=rows[i],at=norm(a.title),ac=norm(a.copy);
            for(let j=i+1;j<rows.length;j++){
              const b=rows[j],bt=norm(b.title),bc=norm(b.copy);
              if(at&&at===bt)duplicates.push({type:'same-title',a:a.id,b:b.id});
              else if(ac.length>=40&&bc.length>=40){const score=dice(ac,bc);if(score>=0.90)duplicates.push({type:`near-${score.toFixed(3)}`,a:a.id,b:b.id});}
            }
          }
          if(leaks.length||duplicates.length){
            console.error('CUSTOMER_COPY_LEAKS',JSON.stringify(leaks));
            console.error('DUPLICATES',JSON.stringify(duplicates));
            process.exit(1);
          }
          console.log(`PASS: ${rows.length} live non-archived posts have customer-safe copy and no duplicate/near-duplicate content.`);
          NODE

      - name: Summary
        if: always()
        run: |
          echo '社群批次與目前有效母庫內容會在 push 到 main 後自動同步到 Cloudflare D1 貼文中心。'
          echo '只有文案與正式圖片完整、未重複且顧客可見文字不含內部作業字樣／禁止公開字詞的內容才能通過。'
          echo '圖片替代文字也視為顧客可見文字一起檢查；已核准、已排程、已發布內容不覆寫。'
