name: 仙加味內容母庫與社群批次同步待審核

# 只把「文案＋正式配圖都完整」的內容寫入 Cloudflare D1 待審核。
# 新 social-batch JSON push 到 main 時自動執行；也保留人工手動同步。
# 不自動核准、不自動排程、不自動發布；已核准、已排程、已發布內容不覆寫。
on:
  push:
    branches: [main]
    paths:
      - 'assets/data/social-batch-*.json'
      - 'tools/build-social-batches-review-seed.mjs'
      - '.github/workflows/seed-guilu-review-queue.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-review-seed
  cancel-in-progress: true

jobs:
  seed-review-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      XJW_CONTENT_SEED_CREATED_BY: tung314069@gmail.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require Cloudflare D1 credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }
          echo 'PASS: Cloudflare D1 credentials are configured.'

      - name: Install Wrangler and validate current contracts
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run check
          npm run guard:full

      - name: Build guilu bank and social batch seeds
        shell: bash
        run: |
          set -euo pipefail
          XJW_CONTENT_SEED_CREATED_BY="$XJW_CONTENT_SEED_CREATED_BY" node tools/build-guilu-review-seed.mjs > /tmp/guilu-review-seed.sql
          XJW_CONTENT_SEED_CREATED_BY="$XJW_CONTENT_SEED_CREATED_BY" node tools/build-guilu-draft-seed.mjs > /tmp/guilu-draft-seed.sql
          XJW_CONTENT_SEED_CREATED_BY="$XJW_CONTENT_SEED_CREATED_BY" node tools/build-social-batches-review-seed.mjs > /tmp/social-batches-review-seed.sql

          review_actual="$(grep -c '^INSERT INTO social_posts(' /tmp/guilu-review-seed.sql)"
          draft_actual="$(grep -c '^INSERT INTO social_posts(' /tmp/guilu-draft-seed.sql)"
          social_actual="$(grep -c '^INSERT INTO social_posts(' /tmp/social-batches-review-seed.sql)"

          read -r expected_review expected_draft expected_total expected_social <<EOF
          $(node - <<'NODE'
          const fs=require('fs');
          const bank=JSON.parse(fs.readFileSync('assets/data/guilu-content-topic-bank-v20260814.json','utf8'));
          const topics=(bank.topics||[]).filter(Boolean);
          const review=topics.filter(x=>x.seedToReview===true).length;
          const draft=topics.filter(x=>x.seedToReview!==true&&x.imageMode==='context_required').length;
          const batchFiles=fs.readdirSync('assets/data').filter(x=>/^social-batch-\d{8}-\d{2}\.json$/.test(x));
          const social=batchFiles.reduce((sum,file)=>sum+((JSON.parse(fs.readFileSync(`assets/data/${file}`,'utf8')).posts||[]).length),0);
          process.stdout.write(`${review} ${draft} ${topics.length} ${social}`);
          NODE
          )
          EOF

          test "$expected_review" -gt 0
          test "$expected_draft" -gt 0
          test "$expected_social" -gt 0
          test "$review_actual" -eq "$expected_review"
          test "$draft_actual" -eq "$expected_draft"
          test "$social_actual" -eq "$expected_social"
          test "$((expected_review+expected_draft))" -eq "$expected_total"
          grep -Fq "WHERE social_posts.status IN ('draft','pending_review')" /tmp/guilu-review-seed.sql
          grep -Fq "WHERE social_posts.status='draft'" /tmp/guilu-draft-seed.sql
          grep -Fq "WHERE social_posts.status IN ('draft','pending_review')" /tmp/social-batches-review-seed.sql
          if grep -Fq 'INSERT OR IGNORE INTO social_posts' /tmp/guilu-review-seed.sql /tmp/guilu-draft-seed.sql /tmp/social-batches-review-seed.sql; then
            echo 'ERROR: social_posts seed must surface CHECK/FK errors.' >&2
            exit 1
          fi
          echo "PASS: guilu ${expected_total} topics + social ${expected_social} posts are safe and idempotent."

      - name: Verify remote D1 schema and creator
        shell: bash
        run: |
          set -euo pipefail
          schema="$(npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='social_posts'; SELECT email,active FROM profiles WHERE email='${XJW_CONTENT_SEED_CREATED_BY}' LIMIT 1;")"
          echo "$schema"
          echo "$schema" | grep -q 'pending_review'
          echo "$schema" | grep -q 'manual_required'
          echo "$schema" | grep -q 'failed'
          echo "$schema" | grep -q "$XJW_CONTENT_SEED_CREATED_BY"
          echo 'PASS: remote D1 status schema and seed creator are valid.'

      - name: Seed guilu image-ready topics into pending review
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/guilu-review-seed.sql

      - name: Seed guilu image-needed topics as drafts only
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/guilu-draft-seed.sql

      - name: Seed social production batches into pending review
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file=/tmp/social-batches-review-seed.sql

      - name: Verify current bank and social batch coverage
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute xianjiawei-internal-db --remote --command "SELECT COUNT(*) AS guilu_total FROM social_posts WHERE id LIKE 'XJW-GUILU-%'; SELECT status,COUNT(*) AS count FROM social_posts WHERE id LIKE 'XJW-GUILU-%' GROUP BY status ORDER BY status; SELECT COUNT(*) AS social_total FROM social_posts WHERE id LIKE 'XJW-SOCIAL-%'; SELECT status,COUNT(*) AS count FROM social_posts WHERE id LIKE 'XJW-SOCIAL-%' GROUP BY status ORDER BY status; SELECT COUNT(*) AS products_v3_live FROM social_posts WHERE status IN ('draft','pending_review') AND image_url LIKE '%/images/products-v3/%'; SELECT COUNT(*) AS stale_count FROM social_posts WHERE status IN ('draft','pending_review') AND (copy LIKE '%早上及下午各一小匙%' OR copy LIKE '%75g／盒、8塊裝%' OR copy LIKE '%600g（1斤）%' OR copy LIKE '%每塊約18.75g%');")"
          echo "$result"
          echo "$result" | grep -q 'social_total'
          echo "$result" | grep -Eq 'products_v3_live[^0-9]*0|products_v3_live[[:space:]]+0'
          echo "$result" | grep -Eq 'stale_count[^0-9]*0|stale_count[[:space:]]+0'
          echo 'PASS: 文案＋正式配圖內容已同步至待審核；缺圖母庫內容仍停草稿；未自動核准、排程或發布。'

      - name: Summary
        if: always()
        run: |
          echo '社群批次現在會在 push 到 main 後自動同步到 Cloudflare D1 貼文中心待審核。'
          echo '只有文案與正式圖片完整的 social-batch 才能通過 builder。'
          echo '已核准、已排程、已發布內容不覆寫；CHECK／FK 錯誤直接失敗。'
