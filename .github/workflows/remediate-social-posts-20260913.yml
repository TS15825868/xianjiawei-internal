name: 仙加味貼文母庫一次性正式整理 20260913

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remediate-social-posts-20260913.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-social-remediation-20260913
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      REMEDIATION_SQL_GZ_B64: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Build one-time remediation SQL
        shell: bash
        run: |
          python - <<'PY'
          import os,base64,gzip
          raw=base64.b64decode(os.environ['REMEDIATION_SQL_GZ_B64'])
          open('remediation.sql','wb').write(gzip.decompress(raw))
          PY
      - name: Apply targeted post remediation
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file remediation.sql
      - name: Verify exact post state
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,headline,copy,status,image_url,image_alt,image_source,image_approved,image_width,image_height,image_bytes,image_quality_status,rejection_reason FROM social_posts ORDER BY id" > posts-after.json
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT status,COUNT(*) AS count FROM social_posts GROUP BY status ORDER BY status" > counts-after.json
          node - <<'NODE'
          const fs=require('fs');
          const unwrap=f=>{const d=JSON.parse(fs.readFileSync(f,'utf8'));return (Array.isArray(d)?d[0]?.results:d?.results)||[]};
          const posts=unwrap('posts-after.json');
          const counts=Object.fromEntries(unwrap('counts-after.json').map(x=>[x.status,Number(x.count||0)]));
          if(posts.length!==71) throw new Error(`貼文總數異常：${posts.length}`);
          if(Number(counts.published||0)!==3) throw new Error(`已發布篇數被改動：${counts.published||0}`);
          if(Number(counts.pending_review||0)!==0) throw new Error(`仍有未完成圖片卻停在待審核：${counts.pending_review||0}`);
          if(Number(counts.archived||0)!==68) throw new Error(`封存篇數不是68：${counts.archived||0}`);
          const retired=posts.filter(p=>['pending_review','approved','scheduled'].includes(p.status)&&String(p.image_url||'').includes('/images/brand/approved-v405/'));
          if(retired.length) throw new Error(`待發布流程仍使用退役舊圖：${retired.map(x=>x.id).join(',')}`);
          const active=posts.filter(p=>['pending_review','approved','scheduled'].includes(p.status));
          for(const p of active){
            if(!p.image_url||!p.image_alt||Number(p.image_approved)!==1||p.image_quality_status==='low') throw new Error(`待發布流程圖片未達正式標準：${p.id}`);
          }
          const publicText=posts.filter(p=>p.status!=='published').map(p=>`${p.id}\n${p.title||''}\n${p.headline||''}\n${p.copy||''}`);
          const banned=['治療','改善疾病','預防疾病','關節','卡卡','疲勞','精神不濟','補氣','生津','膠原蛋白','鈣質','保證功效','台興山產','這篇','主文已經','已經發過','不再重複','之後所有產品圖','排版方便','實際作業','一句廣告語'];
          for(const block of publicText){
            const hit=banned.find(x=>block.includes(x));
            if(hit) throw new Error(`公開文案仍有不合格語句「${hit}」：${block.split('\n')[0]}`);
          }
          const nonPublished=posts.filter(p=>p.status!=='published');
          for(const p of nonPublished){
            const t=`${p.title||''}\n${p.headline||''}\n${p.copy||''}`;
            if(/LINE(?! OA)/.test(t)) throw new Error(`仍有未統一的LINE導流文字：${p.id}`);
          }
          const norm=s=>String(s||'').replace(/\s+/g,'');
          const seen=new Map();
          for(const p of posts){
            const k=norm(p.copy);
            if(k&&seen.has(k)) throw new Error(`文案完全重複：${seen.get(k)} / ${p.id}`);
            if(k)seen.set(k,p.id);
          }
          console.log('PASS targeted remediation',counts);
          NODE
      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: post-remediation-20260913-${{ github.run_id }}
          path: |
            remediation.sql
            posts-after.json
            counts-after.json
          if-no-files-found: error
          retention-days: 2
