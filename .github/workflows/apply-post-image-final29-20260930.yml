name: 仙加味29張貼文圖正式落檔20260930

on:
  push:
    branches: [main]
    paths:
      - 'ops/post-image-import-url-current.json'

permissions:
  contents: write

concurrency:
  group: xianjiawei-post-image-final29-20260930
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Download and validate formal image ZIP
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('ops/post-image-import-url-current.json','utf8'));
          if(!c.download_url || !String(c.download_url).startsWith('https://')) throw new Error('缺少合法download_url');
          fs.writeFileSync('/tmp/download-url.txt',c.download_url);
          NODE
          curl -fL --retry 2 --retry-delay 1 "$(cat /tmp/download-url.txt)" -o /tmp/xjw-final29.zip
          rm -rf /tmp/xjw-final29
          mkdir -p /tmp/xjw-final29
          unzip -q /tmp/xjw-final29.zip -d /tmp/xjw-final29
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const m=JSON.parse(fs.readFileSync('ops/post-image-formal-1254-manifest-20260930.json','utf8'));
          if(!Array.isArray(m.items)||m.items.length!==29) throw new Error('正式manifest不是29張');
          const expected=new Set(m.items.map(x=>x.filename));
          const got=fs.readdirSync('/tmp/xjw-final29').filter(x=>x.toLowerCase().endsWith('.jpg'));
          if(got.length!==29) throw new Error('ZIP圖片數量不是29張: '+got.length);
          for(const f of got) if(!expected.has(f)) throw new Error('ZIP出現未預期檔案 '+f);
          for(const x of m.items){
            const p=path.join('/tmp/xjw-final29',x.filename);
            if(!fs.existsSync(p)) throw new Error('缺少 '+x.filename);
            const b=fs.readFileSync(p);
            if(b.length!==Number(x.bytes)) throw new Error(x.filename+' bytes不一致');
            if(b.length<250000) throw new Error(x.filename+' 檔案過小');
            const h=crypto.createHash('sha256').update(b).digest('hex');
            if(h!==x.sha256) throw new Error(x.filename+' sha256不一致');
            if(!(b[0]===0xff&&b[1]===0xd8&&b[b.length-2]===0xff&&b[b.length-1]===0xd9)) throw new Error(x.filename+' 非完整JPEG');
          }
          console.log('PASS formal JPEG bytes',m.items.length);
          NODE
          while IFS= read -r f; do
            file "$f" | grep -Eq 'JPEG image data.*1254x1254|JPEG image data.*1254 x 1254' || { file "$f"; exit 1; }
          done < <(find /tmp/xjw-final29 -maxdepth 1 -type f -name '*.jpg' | sort)

      - name: Commit 29 formal image assets
        run: |
          TARGET='assets/post-images/2026-09-30/batch6'
          mkdir -p "$TARGET"
          cp /tmp/xjw-final29/*.jpg "$TARGET"/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'content: commit 29 formal post images for review'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then break; fi
            git fetch origin main
            git rebase origin/main
            [ "$attempt" = 4 ] && exit 1
            sleep 2
          done

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Build formal D1 bindings
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const m=JSON.parse(fs.readFileSync('ops/post-image-formal-1254-manifest-20260930.json','utf8'));
          const qd=JSON.parse(fs.readFileSync('ops/post-image-production-queue-current.json','utf8'));
          const byId=new Map((qd.items||[]).map(x=>[x.postId,x]));
          const q=v=>"'" + String(v??'').replaceAll("'","''") + "'";
          const target='assets/post-images/2026-09-30/batch6';
          const sql=[];
          const bindings=[];
          for(const x of m.items){
            const postId=x.filename.replace(/\.jpg$/i,'');
            const qi=byId.get(postId)||{};
            const alt=qi.scene||qi.title||postId;
            const url='https://raw.githubusercontent.com/TS15825868/xianjiawei-internal/main/'+target+'/'+x.filename;
            sql.push(`UPDATE social_posts SET image_url=${q(url)}, image_alt=${q(alt)}, image_source=${q('ChatGPT正式單張圖｜GitHub main｜人工待審核')}, image_width=1254, image_height=1254, image_bytes=${Number(x.bytes)}, image_quality_status='ok', image_approved=0, status='pending_review', approved_by=NULL, approved_at=NULL, scheduled_at=NULL, published_at=NULL, updated_at=datetime('now') WHERE id=${q(postId)} AND status IN ('draft','pending_review');`);
            bindings.push({postId,filename:x.filename,path:target+'/'+x.filename,title:qi.title||'',width:1254,height:1254,bytes:Number(x.bytes),sha256:x.sha256,alt,source:'ChatGPT正式單張圖｜GitHub main｜人工待審核',statusAfterBind:'pending_review'});
          }
          fs.writeFileSync('/tmp/apply-final29.sql',sql.join('\n')+'\n');
          fs.writeFileSync('/tmp/final29-bindings.json',JSON.stringify({version:'2026-09-30-final29',brand:'仙加味',targetDir:target,statusAfterBind:'pending_review',total:bindings.length,items:bindings},null,2)+'\n');
          fs.writeFileSync('/tmp/final29-ids.txt',bindings.map(x=>q(x.postId)).join(','));
          NODE

      - name: Apply 29 bindings to formal D1
        run: npx wrangler d1 execute xianjiawei-internal-db --remote --file /tmp/apply-final29.sql

      - name: Verify 29 posts are pending review
        run: |
          IDS="$(cat /tmp/final29-ids.txt)"
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,status,image_url,image_width,image_height,image_bytes,image_quality_status,image_approved FROM social_posts WHERE id IN ($IDS) ORDER BY id" > /tmp/verify-final29.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/final29-bindings.json','utf8'));
          const raw=JSON.parse(fs.readFileSync('/tmp/verify-final29.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          if(rows.length!==29) throw new Error('D1找到 '+rows.length+' 篇，不是29篇');
          for(const x of b.items){
            const r=rows.find(v=>v.id===x.postId);
            if(!r) throw new Error('D1缺少 '+x.postId);
            if(r.status!=='pending_review') throw new Error(r.id+' 未進pending_review');
            if(!String(r.image_url||'').includes('/assets/post-images/2026-09-30/batch6/')) throw new Error(r.id+' 圖片URL錯誤');
            if(Number(r.image_width)!==1254||Number(r.image_height)!==1254) throw new Error(r.id+' 尺寸錯誤');
            if(Number(r.image_bytes)<250000) throw new Error(r.id+' bytes過小');
            if(r.image_quality_status!=='ok') throw new Error(r.id+' quality_status錯誤');
            if(Number(r.image_approved)!==0) throw new Error(r.id+' 不可自動核准');
          }
          console.log('PASS 29 pending_review');
          NODE

      - name: Rebuild remaining draft queue
        run: |
          npx wrangler d1 execute xianjiawei-internal-db --remote --json --command "SELECT id,title,copy,category,image_alt,image_source FROM social_posts WHERE status='draft' ORDER BY id" > /tmp/remaining-drafts.json
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const raw=JSON.parse(fs.readFileSync('/tmp/remaining-drafts.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]?.results:raw?.results)||[];
          const windowFor=(id='')=>{const s=String(id).toLowerCase();if(s.includes('cny-'))return'lunar_new_year_window';if(s.includes('year-end-'))return'year_end_window';if(s.includes('new-year-'))return'new_year_window';if(s.includes('weather-'))return'weather_dynamic';if(s.includes('season-'))return'cool_season_dynamic';return'evergreen'};
          const productKeys=['龜鹿膏','龜鹿湯塊','龜鹿膠','鹿茸粉'];
          const productListFor=text=>{const out=[];if(text.includes('30cc'))out.push('30cc');if(text.includes('180cc'))out.push('180cc');if(text.includes('龜鹿飲')&&!text.includes('30cc')&&!text.includes('180cc'))out.push('30cc','180cc');for(const x of productKeys)if(text.includes(x))out.push(x);return [...new Set(out)]};
          const items=rows.map((r,index)=>{const t=[r.title,r.copy,r.image_alt].filter(Boolean).join(' ');return{postId:r.id,imageId:`XJW-ACTIVE-IMG-${String(index+1).padStart(3,'0')}`,kind:r.category||'生活內容',title:r.title||'',products:productListFor(t),scene:r.image_alt||'',imageSource:r.image_source||'',window:windowFor(r.id),status:'needs_unique_image',characterLock:'正式Q版小朋友小男孩、同一位角色；短黑髮、大眼睛、圓潤幼童臉型、固定頭身比；不得成熟化、少年化、成人化或像不同人；小鹿與小烏龜分開且相對尺寸固定。',copyHash:crypto.createHash('sha256').update(r.copy||'').digest('hex').slice(0,16)}});
          const out={version:'2026-09-30-after-final29',brand:'仙加味',source:'Cloudflare D1 live social_posts WHERE status=draft',total:items.length,status:'production-queue',rule:'只為live D1目前status=draft的有效貼文製作唯一正式圖片；人工視覺審核前不得發布。',characterLock:'正式Q版小朋友小男孩、同一位角色；短黑髮、大眼睛、圓潤幼童臉型、固定頭身比；不得成熟化、少年化、成人化或像不同人；小鹿與小烏龜分開且相對尺寸固定。',items};
          fs.writeFileSync('/tmp/rebuilt-queue.json',JSON.stringify(out,null,2)+'\n');
          fs.writeFileSync('/tmp/remaining-count.txt',String(items.length));
          NODE

      - name: Commit binding records and verified final status
        run: |
          cp /tmp/final29-bindings.json ops/post-image-bindings-20260930-final29.json
          cp /tmp/rebuilt-queue.json ops/post-image-production-queue-current.json
          node - <<'NODE'
          const fs=require('fs');
          const p='ops/post-image-production-status-current.json';
          const s=JSON.parse(fs.readFileSync(p,'utf8'));
          const remaining=Number(fs.readFileSync('/tmp/remaining-count.txt','utf8'));
          s.version='2026-09-30-v8-final29-bound';
          s.updatedAt=new Date().toISOString();
          s.completedToPendingReview=29;
          s.visualQcPassedAwaitingAssetCommit=0;
          s.formalJpegsReady=29;
          s.formalJpegsCommitted=29;
          s.d1BoundPendingReview=29;
          s.binaryCommitRemaining=0;
          s.remainingNeedsUniqueImage=remaining;
          s.formalBindingRecord='ops/post-image-bindings-20260930-final29.json';
          s.finalAssetDir='assets/post-images/2026-09-30/batch6';
          s.openingPrepReplacementRequired=false;
          s.note='29張正式貼文圖已實體落GitHub main、D1回填並全部進pending_review；未經人工審核不得發布。';
          fs.writeFileSync(p,JSON.stringify(s,null,2)+'\n');
          NODE
          git rm -f ops/post-image-import-url-current.json
          git rm -f .github/workflows/apply-post-image-final29-20260930.yml
          git add ops/post-image-bindings-20260930-final29.json ops/post-image-production-queue-current.json ops/post-image-production-status-current.json
          git commit -m 'ops: finalize 29 post images as pending review'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            [ "$attempt" = 4 ] && exit 1
            sleep 2
          done
